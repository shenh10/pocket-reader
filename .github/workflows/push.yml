name: Retry Daily Push
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 1-5 * * *'
permissions:
  contents: read
concurrency:
  group: push-deliveries
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --prefix ai-infra-board
      - run: npm run push:flush --prefix ai-infra-board
        env:
          DATABASE_URL: ${{ secrets.AI_INFRA_DATABASE_URL }}
          DATABASE_SSL: 'true'
          JPUSH_APP_KEY: ${{ secrets.JPUSH_APP_KEY }}
          JPUSH_MASTER_SECRET: ${{ secrets.JPUSH_MASTER_SECRET }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
