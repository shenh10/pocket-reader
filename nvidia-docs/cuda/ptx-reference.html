://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: add", "titleZh": "整数算术指令：add", "numberedTitle": "9.7.1.1. Integer Arithmetic Instructions: add", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "add", "details": "add\nAdd two values.\nSyntax\nDescription\nPerforms addition and writes the resulting value into a destination register.\nFor .u16x2 , .s16x2 instruction types, forms input vectors by half word values from source operands.\nHalf-word operands are then added in parallel to produce .u16x2 , .s16x2 result in destination.\nFor .u8x4 , .s8x4 instruction types, forms input vectors by quarter word values from source operands.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-add", "tokens": ["u16x2", "s16x2", "u8x4", "s8x4"], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：add」，归在「指令」。重点关注 关键词 u16x2、s16x2、u8x4、s8x4，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：add」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：u16x2、s16x2、u8x4、s8x4。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: sub", "titleZh": "整数算术指令：sub", "numberedTitle": "9.7.1.2. Integer Arithmetic Instructions: sub", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "sub", "details": "sub\nSubtract one value from another.\nSyntax\nDescription\nPerforms subtraction and writes the resulting value into a destination register.\nFor .u8x4 , .s8x4 instruction types, forms input vectors by quarter word values from source operands.\nQuarter-word operands are then subtracted in parallel to produce .u8x4 , .s8x4 result in destination.\nFor instruction types .u8x4 , .s8x4 operands d , a and b have type .b32 .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-sub", "tokens": ["u8x4", "s8x4", "b32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：sub」，归在「指令」。重点关注 关键词 u8x4、s8x4、b32，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：sub」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：u8x4、s8x4、b32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: mul", "titleZh": "整数算术指令：mul", "numberedTitle": "9.7.1.3. Integer Arithmetic Instructions: mul", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "mul", "details": "mul\nMultiply two values.\nSyntax\nDescription\nCompute the product of two values.\nSemantics\nNotes\nThe type of the operation represents the types of the a and b operands.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-mul", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：mul」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：mul」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: mad", "titleZh": "整数算术指令：mad", "numberedTitle": "9.7.1.4. Integer Arithmetic Instructions: mad", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "mad", "details": "mad\nMultiply two values, optionally extract the high or low half of the intermediate result, and add a third value.\nSyntax\nDescription\nMultiplies two values, optionally extracts the high or low half of the intermediate result, and adds a third value.\nWrites the result into a destination register.\nSemantics\nNotes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-mad", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：mad」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：mad」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: clmad", "titleZh": "整数算术指令：clmad", "numberedTitle": "9.7.1.5. Integer Arithmetic Instructions: clmad", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "clmad", "details": "clmad\nPerform carryless multiply and add operation.\nSyntax\nDescription\nPerforms a carryless multiplication of a and b , followed by a carryless addition of c , and writes the result into destination register d .\nAll operands of clmad are unsigned 64-bit values.\nThe modifier .mode specifies which part of the carryless product is stored in the destination register:\nSemantics", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-clmad", "tokens": ["mode"], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：clmad」，归在「指令」。重点关注 关键词 mode，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：clmad」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mode。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: mul24", "titleZh": "整数算术指令：mul24", "numberedTitle": "9.7.1.6. Integer Arithmetic Instructions: mul24", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "mul24", "details": "mul24\nMultiply two 24-bit integer values.\nSyntax\nDescription\nCompute the product of two 24-bit integer values held in 32-bit source registers, and return either the high or low 32-bits of the 48-bit result.\nSemantics\nNotes\nInteger multiplication yields a result that is twice the size of the input operands, i.e., 48-bits.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-mul24", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：mul24」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：mul24」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: mad24", "titleZh": "整数算术指令：mad24", "numberedTitle": "9.7.1.7. Integer Arithmetic Instructions: mad24", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "mad24", "details": "mad24\nMultiply two 24-bit integer values and add a third value.\nSyntax\nDescription\nCompute the product of two 24-bit integer values held in 32-bit source registers, and add a third, 32-bit value to either the high or low 32-bits of the 48-bit result.\nReturn either the high or low 32-bits of the 48-bit result.\nSemantics\nNotes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-mad24", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：mad24」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：mad24」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: sad", "titleZh": "整数算术指令：sad", "numberedTitle": "9.7.1.8. Integer Arithmetic Instructions: sad", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "sad", "details": "sad\nSum of absolute differences.\nSyntax\nDescription\nAdds the absolute value of a-b to c and writes the resulting value into d .\nSemantics\nPTX ISA Notes\nIntroduced in PTX ISA version 1.0.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-sad", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：sad」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：sad」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: div", "titleZh": "整数算术指令：div", "numberedTitle": "9.7.1.9. Integer Arithmetic Instructions: div", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "div", "details": "div\nDivide one value by another.\nSyntax\nDescription\nDivides a by b , stores result in d .\nSemantics\nNotes\nDivision by zero yields an unspecified, machine-specific value.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-div", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：div」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：div」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: rem", "titleZh": "整数算术指令：rem", "numberedTitle": "9.7.1.10. Integer Arithmetic Instructions: rem", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "rem", "details": "rem\nThe remainder of integer division.\nSyntax\nDescription\nDivides a by b , store the remainder in d .\nSemantics\nNotes\nThe behavior for negative numbers is machine-dependent and depends on whether divide rounds towards zero or negative infinity.", "sourc 的「整数算术指令：neg」，归在「指令」。重点关注 关键词 s8x4，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：neg」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：s8x4。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: min", "titleZh": "整数算术指令：min", "numberedTitle": "9.7.1.13. Integer Arithmetic Instructions: min", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "min", "details": "min\nFind the minimum of two values.\nSyntax\nDescription\nStore the minimum of a and b in d .\nFor .u16x2 , .s16x2 instruction types, forms input vectors by half word values from source operands.\nHalf-word operands are then processed in parallel to produce .u16x2 , .s16x2 result in destination.\nFor .u8x4 , .s8x4 instruction types, input vectors are formed with quarter-word values from source operands.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-min", "tokens": ["u16x2", "s16x2", "u8x4", "s8x4"], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：min」，归在「指令」。重点关注 关键词 u16x2、s16x2、u8x4、s8x4，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：min」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：u16x2、s16x2、u8x4、s8x4。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: max", "titleZh": "整数算术指令：max", "numberedTitle": "9.7.1.14. Integer Arithmetic Instructions: max", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "max", "details": "max\nFind the maximum of two values.\nSyntax\nDescription\nStore the maximum of a and b in d .\nFor .u16x2 , .s16x2 instruction types, forms input vectors by half word values from source operands.\nHalf-word operands are then processed in parallel to produce .u16x2 , .s16x2 result in destination.\nFor .u8x4 , .s8x4 instruction types, input vectors are formed with quarter-word values from source operands.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-max", "tokens": ["u16x2", "s16x2", "u8x4", "s8x4"], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：max」，归在「指令」。重点关注 关键词 u16x2、s16x2、u8x4、s8x4，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：max」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：u16x2、s16x2、u8x4、s8x4。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: popc", "titleZh": "整数算术指令：popc", "numberedTitle": "9.7.1.15. Integer Arithmetic Instructions: popc", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "popc", "details": "popc\nPopulation count.\nSyntax\nDescription\nCount the number of one bits in a and place the resulting population count in 32-bit destination register d .\nOperand a has the instruction type and destination d has type .u32 .\nSemantics\nPTX ISA Notes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-popc", "tokens": ["u32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：popc」，归在「指令」。重点关注 关键词 u32，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：popc」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：u32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: clz", "titleZh": "整数算术指令：clz", "numberedTitle": "9.7.1.16. Integer Arithmetic Instructions: clz", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "clz", "details": "clz\nCount leading zeros.\nSyntax\nDescription\nCount the number of leading zeros in a starting with the most-significant bit and place the result in 32-bit destination register d .\nOperand a has the instruction type, and destination d has type .u32 .\nSemantics\nPTX ISA Notes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-clz", "tokens": ["u32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：clz」，归在「指令」。重点关注 关键词 u32，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：clz」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：u32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: bfind", "titleZh": "整数算术指令：bfind", "numberedTitle": "9.7.1.17. Integer Arithmetic Instructions: bfind", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "bfind", "details": "bfind\nFind most significant non-sign bit.\nSyntax\nDescription\nFind the bit position of the most significant non-sign bit in a and place the result in d .\nOperand a has the instruction type, and destination d has type .u32 .\nIf .shiftamt is specified, bfind returns the shift amount needed to left-shift the found bit into the most-significant bit position.\nbfind returns 0xffffffff if no non-sign bit is found.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-bfind", "tokens": ["u32", "shiftamt"], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：bfind」，归在「指令」。重点关注 关键词 u32、shiftamt，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：bfind」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：u32、shiftamt。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: fns", "titleZh": "整数算术指令：fns", "numberedTitle": "9.7.1.18. Integer Arithmetic Instructions: fns", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "fns", "details": "fns\nFind the n-th set bit\nSyntax\nDescription\nGiven a 32-bit value mask and an integer value base (between 0 and 31), find the n-th (given by offset) set bit in mask from the base bit, and store the bit position in d .\nIf not found, store 0xffffffff in d .\nOperand mask has a 32-bit type.\nOperand base has .b32 , .u32 or .s32 type.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-fns", "tokens": ["b32", "u32", "s32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：fns」，归在「指令」。重点关注 关键词 b32、u32、s32，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：fns」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：b32、u32、s32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: brev", "titleZh": "整数算术指令：brev", "numberedTitle": "9.7.1.19. Integer Arithmetic Instructions: brev", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "brev", "details": "brev\nBit reverse.\nSyntax\nDescription\nPerform bitwise reversal of input.\nSemantics\nPTX ISA Notes\nIntroduced in PTX ISA version 2.0.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-brev", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：brev」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：brev」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: bfe", "titleZh": "整数算术指令：bfe", "numberedTitle": "9.7.1.20. Integer Arithmetic Instructions: bfe", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "bfe", "details": "bfe\nBit Field Extract.\nSyntax\nDescription\nExtract bit field from a and place the zero or sign-extended result in d .\nSource b gives the bit field starting bit position, and source c gives the bit field length in bits.\nOperands a and d have the same type as the instruction type.\nOperands b and c are type .u32 , but are restricted to the 8-bit value range 0..255 .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-bfe", "tokens": ["u32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：bfe」，归在「指令」。重点关注 关键词 u32，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：bfe」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：u32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: bfi", "titleZh": "整数算术指令：bfi", "numberedTitle": "9.7.1.21. Integer Arithmetic Instructions: bfi", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "bfi", "details": "bfi\nBit Field Insert.\nSyntax\nDescription\nAlign and insert a bit field from a into b , and place the result in f .\nSource c gives the starting bit position for the insertion, and source d gives the bit field length in bits.\nOperands a , b , and f have the same type as the instruction type.\nOperands c and d are type .u32 , but are restricted to the 8-bit value range 0..255 .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-bfi", "tokens": ["u32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：bfi」，归在「指令」。重点关注 关键词 u32，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：bfi」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：u32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: szext", "titleZh": "整数算术指令：szext", "numberedTitle": "9.7.1.22. Integer Arithmetic Instructions: szext", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "szext", "details": "szext\nSign-extend or Zero-extend.\nSyntax\nDescription\nSign-extends or zero-extends an N-bit value from operand a where N is specified in operand b .\nThe resulting value is stored in the destination operand d .\nFor the .s32 instruction type, the value in a is treated as an N-bit signed value and the most significant bit of this N-bit value is replicated up to bit 31.\nFor the .u32 instruction type, the value in a is treated as an N-bit unsigned number and is zero-extended to 32 bits.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-szext", "tokens": ["s32", "u32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：szext」，归在「指令」。重点关注 关键词 s32、u32，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：szext」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：s32、u32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: bmsk", "titleZh": "整数算术指令：bmsk", "numberedTitle": "9.7.1.23. Integer Arithmetic Instructions: bmsk", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "bmsk", "details": "bmsk\nBit Field Mask.\nSyntax\nDescription\nGenerates a 32-bit mask starting from the bit position specified in operand a , and of the width specified in operand b .\nThe generated bitmask is stored in the destination operand d .\nThe resulting bitmask is 0 in the following cases:\nWhen the value of a is 32 or higher and .mode is .clamp .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-bmsk", "tokens": ["mode", "clamp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：bmsk」，归在「指令」。重点关注 关键词 mode、clamp，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：bmsk」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mode、clamp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: dp4a", "titleZh": "整数算术指令：dp4a", "numberedTitle": "9.7.1.24. Integer Arithmetic Instructions: dp4a", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "dp4a", "details": "dp4a\nFour-way byte dot product-accumulate.\nSyntax\nDescription\nFour-way byte dot product which is accumulated in 32-bit result.\nOperand a and b are 32-bit inputs which hold 4 byte inputs in packed form for dot product.\nOperand c has type .u32 if both .atype and .btype are .u32 else operand c has type .s32 .\nSemantics", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-dp4a", "tokens": ["u32", "atype", "btype", "s32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：dp4a」，归在「指令」。重点关注 关键词 u32、atype、btype、s32，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：dp4a」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：u32、atype、btype、s32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions: dp2a", "titleZh": "整数算术指令：dp2a", "numberedTitle": "9.7.1.25. Integer Arithmetic Instructions: dp2a", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Integer Arithmetic Instructions", "parentZh": "整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "dp2a", "details": "dp2a\nTwo-way dot product-accumulate.\nSyntax\nDescription\nTwo-way 16-bit to 8-bit dot product which is accumulated in 32-bit result.\nOperand a and b are 32-bit inputs.\nOperand a holds two 16-bits inputs in packed form and operand b holds 4 byte inputs in packed form for dot product.\nDepending on the .mode specified, either lower half or upper half of operand b will be used for dot product.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-arithmetic-instructions-dp2a", "tokens": ["mode"], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数算术指令：dp2a」，归在「指令」。重点关注 关键词 mode，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数算术指令：dp2a」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mode。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Extended-Precision Integer Arithmetic Instructions", "titleZh": "扩展精度整数算术指令", "numberedTitle": "9.7.2. Extended-Precision Integer Arithmetic Instructions", "level": "H3", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Instructions", "parentZh": "指令", "kind": "Instructions", "kindZh": "指令", "summary": "Instructions add.cc , addc , sub.cc , subc , mad.cc and madc reference an implicitly specified condition code register ( CC ) having a single carry flag bit ( CC.CF ) holding carry-in/carry-out or borrow-in/borrow-out. These instructions support extended-precision...", "details": "Instructions add.cc , addc , sub.cc , subc , mad.cc and madc reference an implicitly specified condition code register ( CC ) having a single carry flag bit ( CC.CF ) holding carry-in/carry-out or borrow-in/borrow-out.\nThese instructions support extended-precision integer addition, subtraction, and multiplication.\nThe extended-precision arithmetic instructions are:\nadd.cc , addc\nsub.cc , subc\nmad.cc , madc", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#extended-precision-integer-arithmetic-instructions", "tokens": ["add.cc", "sub.cc", "mad.cc"], "summaryZh": "本条整理 PTX ISA 官方文档中的「扩展精度整数算术指令」，归在「指令」。重点关注 关键词 add.cc、sub.cc、mad.cc，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「扩展精度整数算术指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：add.cc、sub.cc、mad.cc。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Extended-Precision Arithmetic Instructions: add.cc", "titleZh": "扩展精度算术指令：add.cc", "numberedTitle": "9.7.2.1. Extended-Precision Arithmetic Instructions: add.cc", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Extended-Precision Integer Arithmetic Instructions", "parentZh": "扩展精度整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "add.cc", "details": "add.cc\nAdd two values with carry-out.\nSyntax\nDescription\nPerforms integer addition and writes the carry-out value into the condition code register.\nSemantics\ncarry-out written to CC.CF\nNotes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#extended-precision-arithmetic-instructions-add-cc", "tokens": ["add.cc"], "summaryZh": "本条整理 PTX ISA 官方文档中的「扩展精度算术指令：add.cc」，归在「指令」。重点关注 关键词 add.cc，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「扩展精度算术指令：add.cc」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：add.cc。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Extended-Precision Arithmetic Instructions: addc", "titleZh": "扩展精度算术指令：addc", "numberedTitle": "9.7.2.2. Extended-Precision Arithmetic Instructions: addc", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Extended-Precision Integer Arithmetic Instructions", "parentZh": "扩展精度整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "addc", "details": "addc\nAdd two values with carry-in and optional carry-out.\nSyntax\nDescription\nPerforms integer addition with carry-in and optionally writes the carry-out value into the condition code register.\nSemantics\nif .cc specified, carry-out written to CC.CF\nNotes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#extended-precision-arithmetic-instructions-addc", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「扩展精度算术指令：addc」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「扩展精度算术指令：addc」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Extended-Precision Arithmetic Instructions: sub.cc", "titleZh": "扩展精度算术指令：sub.cc", "numberedTitle": "9.7.2.3. Extended-Precision Arithmetic Instructions: sub.cc", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Extended-Precision Integer Arithmetic Instructions", "parentZh": "扩展精度整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "sub.cc", "details": "sub.cc\nSubtract one value from another, with borrow-out.\nSyntax\nDescription\nPerforms integer subtraction and writes the borrow-out value into the condition code register.\nSemantics\nborrow-out written to CC.CF\nNotes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#extended-precision-arithmetic-instructions-sub-cc", "tokens": ["sub.cc"], "summaryZh": "本条整理 PTX ISA 官方文档中的「扩展精度算术指令：sub.cc」，归在「指令」。重点关注 关键词 sub.cc，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「扩展精度算术指令：sub.cc」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：sub.cc。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Extended-Precision Arithmetic Instructions: subc", "titleZh": "扩展精度算术指令：subc", "numberedTitle": "9.7.2.4. Extended-Precision Arithmetic Instructions: subc", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Extended-Precision Integer Arithmetic Instructions", "parentZh": "扩展精度整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "subc", "details": "subc\nSubtract one value from another, with borrow-in and optional borrow-out.\nSyntax\nDescription\nPerforms integer subtraction with borrow-in and optionally writes the borrow-out value into the condition code register.\nSemantics\nif .cc specified, borrow-out written to CC.CF\nNotes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#extended-precision-arithmetic-instructions-subc", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「扩展精度算术指令：subc」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「扩展精度算术指令：subc」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Extended-Precision Arithmetic Instructions: mad.cc", "titleZh": "扩展精度算术指令：mad.cc", "numberedTitle": "9.7.2.5. Extended-Precision Arithmetic Instructions: mad.cc", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Extended-Precision Integer Arithmetic Instructions", "parentZh": "扩展精度整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "mad.cc", "details": "mad.cc\nMultiply two values, extract high or low half of result, and add a third value with carry-out.\nSyntax\nDescription\nMultiplies two values, extracts either the high or low part of the result, and adds a third value.\nWrites the result to the destination register and the carry-out from the addition into the condition code register.\nSemantics\ncarry-out from addition is written to CC.CF", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#extended-precision-arithmetic-instructions-mad-cc", "tokens": ["mad.cc"], "summaryZh": "本条整理 PTX ISA 官方文档中的「扩展精度算术指令：mad.cc」，归在「指令」。重点关注 关键词 mad.cc，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「扩展精度算术指令：mad.cc」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mad.cc。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Extended-Precision Arithmetic Instructions: madc", "titleZh": "扩展精度算术指令：madc", "numberedTitle": "9.7.2.6. Extended-Precision Arithmetic Instructions: madc", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Extended-Precision Integer Arithmetic Instructions", "parentZh": "扩展精度整数算术指令", "kind": "Instructions", "kindZh": "指令", "summary": "madc", "details": "madc\nMultiply two values, extract high or low half of result, and add a third value with carry-in and optional carry-out.\nSyntax\nDescription\nMultiplies two values, extracts either the high or low part of the result, and adds a third value along with carry-in.\nWrites the result to the destination register and optionally writes the carry-out from the addition into the condition code register.\nSemantics\nif .cc specified, carry-out from addition is written to CC.CF", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#extended-precision-arithmetic-instructions-madc", "tokens": [], type into .f32 type.\nThe converted value is then used for the addition.\nSemantics\nNotes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#mixed-precision-floating-point-instructions-add", "tokens": ["atype", "f32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「混合精度浮点指令：add」，归在「指令」。重点关注 关键词 atype、f32，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「混合精度浮点指令：add」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：atype、f32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Mixed Precision Floating Point Instructions: sub", "titleZh": "混合精度浮点指令：sub", "numberedTitle": "9.7.5.2. Mixed Precision Floating Point Instructions: sub", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Mixed Precision Floating-Point Instructions", "parentZh": "混合精度浮点指令", "kind": "Instructions", "kindZh": "指令", "summary": "sub", "details": "sub\nSubtract one value from another.\nSyntax\nDescription\nConverts input operand a from .atype into .f32 type.\nThe converted value is then used for the subtraction.\nSemantics\nNotes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#mixed-precision-floating-point-instructions-sub", "tokens": ["atype", "f32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「混合精度浮点指令：sub」，归在「指令」。重点关注 关键词 atype、f32，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「混合精度浮点指令：sub」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：atype、f32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Mixed Precision Floating Point Instructions: fma", "titleZh": "混合精度浮点指令：fma", "numberedTitle": "9.7.5.3. Mixed Precision Floating Point Instructions: fma", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Mixed Precision Floating-Point Instructions", "parentZh": "混合精度浮点指令", "kind": "Instructions", "kindZh": "指令", "summary": "fma", "details": "fma\nFused multiply-add.\nSyntax\nDescription\nConverts input operands a and b from .atype into .f32 type.\nThe converted values are then used to perform fused multiply-add operation with no loss of precision in the intermediate product and addition.\nSemantics\nNotes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#mixed-precision-floating-point-instructions-fma", "tokens": ["atype", "f32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「混合精度浮点指令：fma」，归在「指令」。重点关注 关键词 atype、f32，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「混合精度浮点指令：fma」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：atype、f32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Comparison and Selection Instructions", "titleZh": "比较与选择指令", "numberedTitle": "9.7.6. Comparison and Selection Instructions", "level": "H3", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Instructions", "parentZh": "指令", "kind": "Instructions", "kindZh": "指令", "summary": "The comparison select instructions are:", "details": "The comparison select instructions are:\nset\nsetp\nselp\nslct\nAs with single-precision floating-point instructions, the set , setp , and slct instructions support subnormal numbers for sm_20 and higher targets and flush single-precision subnormal inputs to sign-preserving zero for sm_1x targets.\nThe optional .ftz modifier provides backward compatibility with sm_1x targets by flushing subnormal inputs and results to sign-preserving zero regardless of the target architecture.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#comparison-and-selection-instructions", "tokens": ["sm_20", "sm_1x", "ftz"], "summaryZh": "本条整理 PTX ISA 官方文档中的「比较与选择指令」，归在「指令」。重点关注 关键词 sm_20、sm_1x、ftz，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「比较与选择指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：sm_20、sm_1x、ftz。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Comparison and Selection Instructions: set", "titleZh": "比较与选择指令：set", "numberedTitle": "9.7.6.1. Comparison and Selection Instructions: set", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Comparison and Selection Instructions", "parentZh": "比较与选择指令", "kind": "Instructions", "kindZh": "指令", "summary": "set", "details": "set\nCompare two numeric values with a relational operator, and optionally combine this result with a predicate value by applying a Boolean operator.\nSyntax\nDescription\nCompares two numeric values and optionally combines the result with another predicate value by applying a Boolean operator.\nIf this result is True , 1.0f is written for floating-point destination types, and 0xffffffff is written for integer destination types.\nOperand d has type .dtype ; operands a and b have type .stype ; operand c has type .pred .\nSemantics", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#comparison-and-selection-instructions-set", "tokens": ["dtype", "stype", "pred"], "summaryZh": "本条整理 PTX ISA 官方文档中的「比较与选择指令：set」，归在「指令」。重点关注 关键词 dtype、stype、pred，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「比较与选择指令：set」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：dtype、stype、pred。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Comparison and Selection Instructions: setp", "titleZh": "比较与选择指令：setp", "numberedTitle": "9.7.6.2. Comparison and Selection Instructions: setp", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Comparison and Selection Instructions", "parentZh": "比较与选择指令", "kind": "Instructions", "kindZh": "指令", "summary": "setp", "details": "setp\nCompare two numeric values with a relational operator, and (optionally) combine this result with a predicate value by applying a Boolean operator.\nSyntax\nDescription\nCompares two values and combines the result with another predicate value by applying a Boolean operator.\nThis result is written to the first destination operand.\nApplies to all numeric types.\nOperands a and b have type .type ; operands p , q , and c have type .pred .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#comparison-and-selection-instructions-setp", "tokens": ["type", "pred"], "summaryZh": "本条整理 PTX ISA 官方文档中的「比较与选择指令：setp」，归在「指令」。重点关注 关键词 type、pred，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「比较与选择指令：setp」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：type、pred。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Comparison and Selection Instructions: selp", "titleZh": "比较与选择指令：selp", "numberedTitle": "9.7.6.3. Comparison and Selection Instructions: selp", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Comparison and Selection Instructions", "parentZh": "比较与选择指令", "kind": "Instructions", "kindZh": "指令", "summary": "selp", "details": "selp\nSelect between source operands, based on the value of the predicate source operand.\nSyntax\nDescription\nConditional selection.\nIf c is True , a is stored in d , b otherwise.\nSemantics\nPTX ISA Notes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#comparison-and-selection-instructions-selp", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「比较与选择指令：selp」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「比较与选择指令：selp」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Comparison and Selection Instructions: slct", "titleZh": "比较与选择指令：slct", "numberedTitle": "9.7.6.4. Comparison and Selection Instructions: slct", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Comparison and Selection Instructions", "parentZh": "比较与选择指令", "kind": "Instructions", "kindZh": "指令", "summary": "slct", "details": "slct\nSelect one source operand, based on the sign of the third operand.\nSyntax\nDescription\nConditional selection.\nIf c >= 0, a is stored in d , otherwise b is stored in d .\nSemantics\nFloating Point Notes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#comparison-and-selection-instructions-slct", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「比较与选择指令：slct」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用 tps://docs.nvidia.com/cuda/parallel-thread-execution/index.html#half-precision-comparison-instructions-set", "tokens": ["u32", "s32", "u16", "s16", "f16", "bf16"], "summaryZh": "本条整理 PTX ISA 官方文档中的「半精度比较指令：set」，归在「指令」。重点关注 关键词 u32、s32、u16、s16、f16，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「半精度比较指令：set」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：u32、s32、u16、s16、f16、bf16。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Half Precision Comparison Instructions: setp", "titleZh": "半精度比较指令：setp", "numberedTitle": "9.7.7.2. Half Precision Comparison Instructions: setp", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Half Precision Comparison Instructions", "parentZh": "半精度比较指令", "kind": "Instructions", "kindZh": "指令", "summary": "setp", "details": "setp\nCompare two numeric values with a relational operator, and optionally combine this result with a predicate value by applying a Boolean operator.\nSyntax\nDescription\nCompares two values and combines the result with another predicate value by applying a Boolean operator.\nThis result is written to the destination operand.\nOperand c , p and q has type .pred .\nFor instruction type .f16 , operands a and b have type .b16 or .f16 .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#half-precision-comparison-instructions-setp", "tokens": ["pred", "f16", "b16"], "summaryZh": "本条整理 PTX ISA 官方文档中的「半精度比较指令：setp」，归在「指令」。重点关注 关键词 pred、f16、b16，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「半精度比较指令：setp」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：pred、f16、b16。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Logic and Shift Instructions", "titleZh": "逻辑与移位指令", "numberedTitle": "9.7.8. Logic and Shift Instructions", "level": "H3", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Instructions", "parentZh": "指令", "kind": "Instructions", "kindZh": "指令", "summary": "The logic and shift instructions are fundamentally untyped, performing bit-wise operations on operands of any type, provided the operands are of the same size. This permits bit-wise operations on floating point values without having to define a union to access the...", "details": "The logic and shift instructions are fundamentally untyped, performing bit-wise operations on operands of any type, provided the operands are of the same size.\nThis permits bit-wise operations on floating point values without having to define a union to access the bits.\nThe logical shift instructions are:\nand\nor\nxor\nnot\ncnot", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#logic-and-shift-instructions", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「逻辑与移位指令」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「逻辑与移位指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Logic and Shift Instructions: and", "titleZh": "逻辑与移位指令：and", "numberedTitle": "9.7.8.1. Logic and Shift Instructions: and", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Logic and Shift Instructions", "parentZh": "逻辑与移位指令", "kind": "Instructions", "kindZh": "指令", "summary": "and", "details": "and\nBitwise AND.\nSyntax\nDescription\nCompute the bit-wise and operation for the bits in a and b .\nSemantics\nNotes\nThe size of the operands must match, but not necessarily the type.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#logic-and-shift-instructions-and", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「逻辑与移位指令：and」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「逻辑与移位指令：and」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Logic and Shift Instructions: or", "titleZh": "逻辑与移位指令：or", "numberedTitle": "9.7.8.2. Logic and Shift Instructions: or", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Logic and Shift Instructions", "parentZh": "逻辑与移位指令", "kind": "Instructions", "kindZh": "指令", "summary": "or", "details": "or\nBiwise OR.\nSyntax\nDescription\nCompute the bit-wise or operation for the bits in a and b .\nSemantics\nNotes\nThe size of the operands must match, but not necessarily the type.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#logic-and-shift-instructions-or", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「逻辑与移位指令：or」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「逻辑与移位指令：or」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Logic and Shift Instructions: xor", "titleZh": "逻辑与移位指令：xor", "numberedTitle": "9.7.8.3. Logic and Shift Instructions: xor", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Logic and Shift Instructions", "parentZh": "逻辑与移位指令", "kind": "Instructions", "kindZh": "指令", "summary": "xor", "details": "xor\nBitwise exclusive-OR (inequality).\nSyntax\nDescription\nCompute the bit-wise exclusive-or operation for the bits in a and b .\nSemantics\nNotes\nThe size of the operands must match, but not necessarily the type.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#logic-and-shift-instructions-xor", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「逻辑与移位指令：xor」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「逻辑与移位指令：xor」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Logic and Shift Instructions: not", "titleZh": "逻辑与移位指令：not", "numberedTitle": "9.7.8.4. Logic and Shift Instructions: not", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Logic and Shift Instructions", "parentZh": "逻辑与移位指令", "kind": "Instructions", "kindZh": "指令", "summary": "not", "details": "not\nBitwise negation; one’s complement.\nSyntax\nDescription\nInvert the bits in a .\nSemantics\nNotes\nThe size of the operands must match, but not necessarily the type.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#logic-and-shift-instructions-not", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「逻辑与移位指令：not」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「逻辑与移位指令：not」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Logic and Shift Instructions: cnot", "titleZh": "逻辑与移位指令：cnot", "numberedTitle": "9.7.8.5. Logic and Shift Instructions: cnot", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Logic and Shift Instructions", "parentZh": "逻辑与移位指令", "kind": "Instructions", "kindZh": "指令", "summary": "cnot", "details": "cnot\nC/C++ style logical negation.\nSyntax\nDescription\nCompute the logical negation using C/C++ semantics.\nSemantics\nNotes\nThe size of the operands must match, but not necessarily the type.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#logic-and-shift-instructions-cnot", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「逻辑与移位指令：cnot」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「逻辑与移位指令：cnot」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Logic and Shift Instructions: lop3", "titleZh": "逻辑与移位指令：lop3", "numberedTitle": "9.7.8.6. Logic and Shift Instructions: lop3", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Logic and Shift Instructions", "parentZh": "逻辑与移位指令", "kind": "Instructions", "kindZh": "指令", "summary": "lop3", "details": "lop3\nArbitrary logical operation on 3 inputs.\nSyntax\nDescription\nCompute bitwise logical operation on inputs a , b , c and store the result in destination d .\nOptionally, .BoolOp can be specified to compute the predicate result p by performing a Boolean operation on the destination operand d with the predicate q in the following manner:\nThe sink symbol ‘_’ may be used in place of the destination operand d when .BoolOp qualifier is specified.\nThe logical operation is defined by a look-up table which, for 3 inputs, can be represented as an 8-bit value specified by operand immLut as described below. immLut is an integer constant that can take values from 0 to 255, thereby allowing up to 256 distinct logical operations on inputs a , b , c .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#logic-and-shift-instructions-lop3", "tokens": ["BoolOp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「逻辑与移位指令：lop3」，归在「指令」。重点关注 关键词 BoolOp，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「逻辑与移位指令：lop3」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：BoolOp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Logic and Shift Instructions: shf", "titleZh": "逻辑与移位指令：shf", "numberedTitle": "9.7.8.7. Logic and Shift Instructions: shf", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Logic and Shift Instructions", "parentZh": "逻辑与移位指令", "kind": "Instructions", "kindZh": "指令", "summary": "shf", "details": "shf\nFunnel shift.\nSyntax\nDescription\nShift the 64-bit value formed by concatenating operands a and b left or right by the amount specified by the unsigned 32-bit value in c .\nOperand b holds bits 63:32 and operand a holds bits 31:0 of the 64-bit source value.\nSemantics\nNotes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#logic-and-shift-instructions-shf", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「逻辑与移位指令：shf」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「逻辑与移位指令：shf」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Logic and Shift Instructions: shl", "titleZh": "逻辑与移位指令：shl", "numberedTitle": "9.7.8.8. Logic and Shift Instructions: shl", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Logic and Shift Instructions", "parentZh": "逻辑与移位指令", "kind": "Instructions", "kindZh": "指令", "summary": "shl", "details": "shl\nShift bits left, zero-fill on right.\nSyntax\nDescription\nShift a left by the amount specified by unsigned 32-bit value in b .\nSemantics\nNotes\nShift amounts greater than the register width N are clamped to N .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#logic-and-shift-instructions-shl", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「逻辑与移位指令：shl」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「逻辑与移位指令：shl」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Logic and Shift Instructions: shr", "titleZh": "逻辑与移位指令：shr", "numberedTitle": "9.7.8.9. Logic and Shift Instructions: shr", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Logic and Shift Instructions", "parentZh": "逻辑与移位指令", "kind": "Instructions", "kindZh": "指令", "summary": "shr", "details": "shr\nShift bits right, sign or zero-fill on left.\nSyntax\nDescription\nShift a right by the amount specified by unsigned 32-bit value in b .\nSigned shifts fill with the sign bit, unsigned and untyped shifts fill with 0 .\nSemantics\nNotes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#logic-and-shift-instructions-shr", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「逻辑与移位指令：shr」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「逻辑与移位指令：shr」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions", "titleZh": "数据搬移与转换指令", "numberedTitle": "9.7.9. Data Movement and Conversion Instructions", "level": "H3", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Instructions", "parentZh": "指令", "kind": "Instructions", "kindZh": "指令", "summary": "These instructions copy data from place to place, and from state space to state space, possibly converting it from one format to another. mov , ld , ldu , and st operate on both scalar and vector types. The isspacep instruction is provided to query whether a generic...", "details": "These instructions copy data from place to place, and from state space to state space, possibly converting it from one format to another. mov , ld , ldu , and st operate on both scalar and vector types.\nThe isspacep instruction is provided to query whether a generic address falls within a particular state space window.\nInstructions ld , st , suld , and sust support optional cache operations.\nThe Data Movement and Conversion Instructions are:\nmov\nshfl.sync\nprmt\nld", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions", "tokens": ["shfl.sync"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令」，归在「指令」。重点关注 关键词 shfl.sync，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：shfl.sync。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Cache Operators", "titleZh": "Cache operator（缓存操作符）", "numberedTitle": "9.7.9.1. Cache Operators", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "PTX ISA version 2.0 introduced optional cache operators on load and store instructions. The cache operators require a target architecture of sm_20 or higher.", "details": "PTX ISA version 2.0 introduced optional cache operators on load and store instructions.\nThe cache operators require a target architecture of sm_20 or higher.\nCache operators on load or store instructions are treated as performance hints only.\nThe use of a cache operator on an ld or st instruction does not change the memory consistency behavior of the program.\nFor sm_20 and higher, the cache operators have the following definitions and behavior.\nOperator | Meaning\n.ca | Cache at all levels, likely to be accessed again. The default load instruction cache operation is ld.ca, which allocates cache lines in all levels (L1 and L2) with normal eviction policy. Global data is coherent at the L2 level, but multiple L1 caches are not coherent for global data. If one thread stores to global memory via one L1 cache, and a second thread loads that address via a second L1 cache with ld.ca , the second thread may get stale L1 cache data, rather than the data stored by the first thread. The driver must invalidate global L1 cache lines between dependent grids of parallel threads. Stores by the first grid program are then correctly fetched by the second grid program issuing default ld.ca loads cached in L1.\n.cg | Cache at global level (cache in L2 and below, not L1). Use ld.cg to cache loads only globally, bypassing the L1 cache, and cache only in the L2 cache.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#cache-operators", "tokens": ["sm_20", "ld.ca", "ld.cg"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Cache operator（缓存操作符）」，归在「指令」。重点关注 关键词 sm_20、ld.ca、ld.cg，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Cache operator（缓存操作符）」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：sm_20、ld.ca、ld.cg。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Cache Eviction Priority Hints", "titleZh": "Cache 驱逐优先级提示", "numberedTitle": "9.7.9.2. Cache Eviction Priority Hints", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "PTX ISA version 7.4 adds optional cache eviction priority hints on load and store instructions. Cache eviction priority requires target architecture sm_70 or higher.", "details": "PTX ISA version 7.4 adds optional cache eviction priority hints on load and store instructions.\nCache eviction priority requires target architecture sm_70 or higher.\nCache eviction priority on load or store instructions is treated as a performance hint.\nIt is supported for .global state space and generic addresses where the address points to .global state space.\nCache Eviction Priority | Meaning\nevict_normal | Cache data with normal eviction priority. This is the default eviction priority.\nevict_first | Data cached with this priority will be first in the eviction priority order and will likely be evicted when cache eviction is required. This priority is suitable for streaming data.\nevict_last | Data cached with this priority will be last in the eviction priority order and will likely be evicted only after other data with evict_normal or evict_first eviction priotity is already evicted. This priority is suitable for data that should remain persistent in cache.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#cache-eviction-priority-hints", "tokens": ["sm_70", "global"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Cache 驱逐优先级提示」，归在「指令」。重点关注 关键词 sm_70、global，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Cache 驱逐优先级提示」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：sm_70、global。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: mov", "titleZh": "数据搬移与转换指令：mov", "numberedTitle": "9.7.9.3. Data Movement and Conversion Instructions: mov", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "mov", "details": "mov\nSet a register variable with the value of a register variable or an immediate value.\nTake the non-generic address of a variable in global, local, or shared state space.\nSyntax\nDescription\nWrite register d with the value of a .\nOperand a may be a register, special register, variable with optional offset in an addressable memory space, or function name.\nFor variables declared in .const , .global , .local , and .shared state spaces, mov places the non-generic address of the variable (i.e., the address of the variable in its state space) into the destination register.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-mov", "tokens": ["const", "global", "local", "shared"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：mov」，归在「指令」。重点关注 关键词 const、global、local、shared，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：mov」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：const、global、local、shared。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: mov", "titleZh": "数据搬移与转换指令：mov", "numberedTitle": "9.7.9.4. Data Movement and Conversion Instructions: mov", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "mov", "details": "mov\nMove vector-to-scalar (pack) or scalar-to-vector (unpack).\nSyntax\nDescription\nWrite scalar register d with the packed value of vector register a , or write vector register d with the unpacked values from scalar register a .\nWhen destination operand d is a vector register, the sink symbol '_' may be used for one or more elements provided that at least one element is a scalar register.\nFor bit-size types, mov may be used to pack vector elements into a scalar register or unpack sub-fields of a scalar register into a vector.\nBoth the overall size of the vector and the size of the scalar must match the size of the instruction type.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-mov-2", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：mov」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：mov」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: shfl (deprecated)", "titleZh": "数据搬移与转换指令：shfl (deprecated)", "numberedTitle": "9.7.9.5. Data Movement and Conversion Instructions: shfl (deprecated)", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "shfl (deprecated)", "details": "shfl (deprecated)\nRegister data shuffle within threads of a warp.\nSyntax\nDeprecation Note\nThe shfl instruction without a .sync qualifier is deprecated in PTX ISA version 6.0.\nSupport for this instruction with .target lower than sm_70 may be removed in a future PTX ISA version.\nRemoval Note\nSupport for shfl instruction without a .sync qualifier is removed in PTX ISA version 6.4 for .target sm_70 or higher.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-shfl", "tokens": ["warp", "sync", "target", "sm_70"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：shfl (deprecated)」，归在「指令」。重点关注 关键词 warp、sync、target、sm_70，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：shfl (deprecated)」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：warp、sync、target、sm_70。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: shfl.sync", "titleZh": "数据搬移与转换指令：shfl.sync", "numberedTitle": "9.7.9.6. Data Movement and Conversion Instructions: shfl.sync", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "shfl.sync", "details": "shfl.sync\nRegister data shuffle within threads of a warp.\nSyntax\nDescription\nExchange register data between threads of a warp.\nshfl.sync will cause executing thread to wait until all non-exited threads corresponding to membermask have executed shfl.sync with the same qualifiers and same membermask value before resuming execution.\nOperand membermask specifies a 32-bit integer which is a mask indicating threads participating in barrier where the bit position corresponds to thread’s laneid .\nshfl.sync exchanges register data between threads in membermask .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-shfl-sync", "tokens": ["shfl.sync", "warp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：shfl.sync」，归在「指令」。重点关注 关键词 shfl.sync、warp，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：shfl.sync」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：shfl.sync、warp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: prmt", "titleZh": "数据搬移与转换指令：prmt", "numberedTitle": "9.7.9.7. Data Movement and Conversion Instructions: prmt", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "prmt", "details": "prmt\nPermute bytes from register pair.\nSyntax\nDescription\nPick four arbitrary bytes from two 32-bit registers, and reassemble them into a 32-bit destination register.\nIn the generic form (no mode specified), the permute control consists of four 4-bit selection values.\nThe bytes in the two source registers are numbered from 0 to 7: {b, a} = {{b7, b6, b5, b4}, {b3, b2, b1, b0}} .\nThe 3 lsbs of the selection value specify which of the 8 source bytes should be moved into the target position.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-prmt", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：prmt」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：prmt」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: ld", "titleZh": "数据搬移与转换指令：ld", "numberedTitle": "9.7.9.8. Data Movement and Conversion Instructions: ld", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "ld", "details": "ld\nLoad a register variable from an addressable state space variable.\nSyntax\nDescription\nLoad register variable d from the location specified by the source address operand a in specified state space.\nIf no state space is given, perform the load using Generic Addressing .\nIf no sub-qualifier is specified with .shared state space, then ::cta is assumed by default.\nSupported addressing modes for operand a and alignment requirements are described in Addresses as Operands", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-ld", "tokens": ["shared"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：ld」，归在「指令」。重点关注 关键词 shared，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：ld」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：shared。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: ld.global.nc", "titleZh": "数据搬移与转换指令：ld.global.nc", "numberedTitle": "9.7.9.9. Data Movement and Conversion Instructions: ld.global.nc", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "ld.global.nc", "details": "ld.global.nc\nLoad a register variable from global state space via non-coherent cache.\nSyntax\nDescription\nLoad register variable d from the location specified by the source address operand a in the global state space, and optionally cache in non-coherent read-only cache.\nThe address operand a shall contain a global address.\nSupported addressing modes for operand a and alignment requirements are described in Addresses as Operands .\nThe .v8 ( .vec ) qualifier is supported if:", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-ld-global-nc", "tokens": ["ld.global.nc", "vec"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：ld.global.nc」，归在「指令」。重点关注 关键词 ld.global.nc、vec，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：ld.global.nc」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：ld.global.nc、vec。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: ldu", "titleZh": "数据搬移与转换指令：ldu", "numberedTitle": "9.7.9.10. Data Movement and Conversion Instructions: ldu", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "ldu", "details": "ldu\nLoad read-only data from an address that is common across threads in the warp.\nSyntax\nDescription\nLoad read-only data into register variable d from the location specified by the source address operand a in the global state space, where the address is guaranteed to be the same across all threads in the warp.\nIf no state space is given, perform the load using Generic Addressing .\nSupported addressing modes for operand a and alignment requirements are described in Addresses as Operands .\nSemantics", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-ldu", "tokens": ["warp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：ldu」，归在「指令」。重点关注 关键词 warp，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：ldu」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：warp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: st", "titleZh": "数据搬移与转换指令：st", "numberedTitle": "9.7.9.11. Data Movement and Conversion Instructions: st", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "st", "details": "st\nStore data to an addressable state space variable.\nSyntax\nDescription\nStore the value of operand b in the location specified by the destination address operand a in specified state space.\nIf no state space is given, perform the store using Generic Addressing .\nIf no sub-qualifier is specified with .shared state space, then ::cta is assumed by default.\nSupported addressing modes for operand a and alignment requirements are described in Addresses as Operands .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-st", "tokens": ["shared"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：st」，归在「指令」。重点关注 关键词 shared，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：st」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：shared。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: st.async", "titleZh": "数据搬移与转换指令：st.async", "numberedTitle": "9.7.9.12. Data Movement and Conversion Instructions: st.async", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "st.async", "details": "st.async\nAsynchronous store operation.\nSyntax\nDescription\nst.async is a non-blocking instruction which initiates an asynchronous store operation that stores the value specified by source operand b to the destination memory location specified by operand a .\nst.async is performed in the generic proxy.\nOperands\na is a destination address, and must be either a register, or of the form register + immOff , as described in Addresses as Operands .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-st-async", "tokens": ["st.async"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：st.async」，归在「指令」。重点关注 关键词 st.async，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：st.async」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：st.async。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: multimem.st.async", "titleZh": "数据搬移与转换指令：multimem.st.async", "numberedTitle": "9.7.9.13. Data Movement and Conversion Instructions: multimem.st.async", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "multimem.st.async", "details": "multimem.st.async\nPerform asynchronous store with release ordering on the multimem address.\nSyntax\nDescription\nmultimem.st.async is a non-blocking instruction which initiates an asynchronous store operation that stores the value specified by source operand b to the memory locations residing on each GPU’s memory referred to by the destination multimem address operand a .\nAddress operand a must be a multimem address.\nOtherwise, the behavior is undefined.\nOperands", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-multimem-st-async", "tokens": ["multimem.st.async"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：multimem.st.async」，归在「指令」。重点关注 关键词 multimem.st.async，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：multimem.st.async」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：multimem.st.async。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: st.bulk", "titleZh": "数据搬移与转换指令：st.bulk", "numberedTitle": "9.7.9.14. Data Movement and Conversion Instructions: st.bulk", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "st.bulk", "details": "st.bulk\nInitializes a region of memory as specified by state space.\nSyntax\nDescription\nst.bulk instruction initializes a region of shared memory starting from the location specified by destination address operand a .\nThe 32-bit or 64-bit integer operand size specifies the amount of memory to be initialized in terms of number of bytes. size must be a multiple of 8.\nIf the value is not a multiple of 8, then the behavior is undefined.\nThe integer immediate operand initval specifies the initialization value for the memory locations.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-st-bulk", "tokens": ["st.bulk"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：st.bulk」，归在「指令」。重点关注 关键词 st.bulk，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：st.bulk」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：st.bulk。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: multimem.ld_reduce , multimem.st , multimem.red", "titleZh": "数据搬移与转换指令：multimem.ld_reduce , multimem.st , multimem.red", "numberedTitle": "9.7.9.15. Data Movement and Conversion Instructions: multimem.ld_reduce , multimem.st , multimem.red", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "The multimem.* operations operate on multimem addresses and accesses all of the multiple memory locations which the multimem address points to.", "details": "The multimem.* operations operate on multimem addresses and accesses all of the multiple memory locations which the multimem address points to.\nMultimem addresses can be accessed only by multimem.* operations.\nAccessing a multimem address with ld , st or any other memory operations results in undefined behavior.\nRefer to CUDA programming guide for creation and management of the multimem addresses.\nmultimem.ld_reduce , multimem.st , multimem.red\nPerform memory operations on the multimem address.\nSyntax\nDescription", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-multimem", "tokens": ["multimem.ld", "multimem.st", "multimem.red"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：multimem.ld_reduce , multimem.st , multimem.red」，归在「指令」。重点关注 关键词 multimem.ld、multimem.st、multimem.red，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：multimem.ld_reduce , multimem.st , multimem.red」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：multimem.ld、multimem.st、multimem.red。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: prefetch , prefetchu", "titleZh": "数据搬移与转换指令：prefetch , prefetchu", "numberedTitle": "9.7.9.16. Data Movement and Conversion Instructions: prefetch , prefetchu", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "prefetch , prefetchu", "details": "prefetch , prefetchu\nPrefetch line containing a generic address at a specified level of memory hierarchy, in specified state space.\nSyntax\nDescription\nThe prefetch instruction brings the cache line containing the specified address in global or local memory state space into the specified cache level.\nIf the .tensormap qualifier is specified then the prefetch instruction brings the cache line containing the specified address in the .const or .param memory state space for subsequent use by the cp.async.bulk.tensor instruction.\nIf no state space is given, the prefetch uses Generic Addressing .\nOptionally, the eviction priority to be applied on the prefetched cache line can be specified by the modifier .level::eviction_priority .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-prefetch-prefetchu", "tokens": ["tensormap", "const", "param", "cp.async.bulk.tensor", "level"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：prefetch , prefetchu」，归在「指令」。重点关注 关键词 tensormap、const、param、cp.async.bulk.tensor、level，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：prefetch , prefetchu」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tensormap、const、param、cp.async.bulk.tensor、level。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: applypriority", "titleZh": "数据搬移与转换指令：applypriority", "numberedTitle": "9.7.9.17. Data Movement and Conversion Instructions: applypriority", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "applypriority", "details": "applypriority\nApply the cache eviction priority to the specified address in the specified cache level.\nSyntax\nDescription\nThe applypriority instruction applies the cache eviction priority specified by the .level::eviction_priority qualifier to the address range [a..a+size) in the specified cache level.\nIf no state space is specified then Generic Addressing is used.\nIf the specified address does not fall within the address window of .global state space then the behavior is undefined.\nThe operand size is an integer constant that specifies the amount of data, in bytes, in the specified cache level on which the priority is to be applied.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-applypriority", "tokens": ["level", "global"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：applypriority」，归在「指令」。重点关注 关键词 level、global，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：applypriority」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：level、global。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: discard", "titleZh": "数据搬移与转换指令：discard", "numberedTitle": "9.7.9.18. Data Movement and Conversion Instructions: discard", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "discard", "details": "discard\nDiscard the data at the specified address range and cache level.\nSyntax\nDescription\nSemantically, this behaves like a weak write of an unstable indeterminate value : reads of memory locations with unstable indeterminate values may return different bit patterns each time until the memory is overwritten.\nThis operation hints to the implementation that data in the specified cache .level can be destructively discarded without writing it back to memory.\nThe operand size is an integer constant that specifies the length in bytes of the address range [a, a + size) to write unstable indeterminate values into.\nThe only supported value for the size operand is 128 .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-discard", "tokens": ["level"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：discard」，归在「指令」。重点关注 关键词 level，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：discard」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：level。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: createpolicy", "titleZh": "数据搬移与转换指令：createpolicy", "numberedTitle": "9.7.9.19. Data Movement and Conversion Instructions: createpolicy", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "createpolicy", "details": "createpolicy\nCreate a cache eviction policy for the specified cache level.\nSyntax\nDescription\nThe createpolicy instruction creates a cache eviction policy for the specified cache level in an opaque 64-bit register specified by the destination o
