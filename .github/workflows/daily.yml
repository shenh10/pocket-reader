name: Collect Daily Content
on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"
permissions:
  contents: read
concurrency:
  group: daily-content
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Update database for the content API
        working-directory: ai-infra-board
        env:
          DATABASE_URL: ${{ secrets.AI_INFRA_DATABASE_URL }}
          DATABASE_SSL: "true"
          DATABASE_POOL_MAX: "8"
          GITHUB_TOKEN: ${{ secrets.AI_INFRA_GITHUB_TOKEN || github.token }}
          TIMEZONE: Asia/Shanghai
          ENABLE_DESKTOP_NOTIFICATIONS: "false"
        run: |
          test -n "$DATABASE_URL"
          npm ci
          npm run db:setup
          npm run catch-up
      - name: Write evidence-backed code analyses
        working-directory: ai-infra-board
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.AI_INFRA_DATABASE_URL }}
          DATABASE_SSL: "true"
          GITHUB_TOKEN: ${{ secrets.AI_INFRA_GITHUB_TOKEN || github.token }}
          TIMEZONE: Asia/Shanghai
          DEEP_DIVE_API_KEY: ${{ secrets.DEEP_DIVE_API_KEY }}
          DEEP_DIVE_BASE_URL: ${{ vars.DEEP_DIVE_BASE_URL }}
          DEEP_DIVE_MODEL: ${{ vars.DEEP_DIVE_MODEL }}
        run: |
          if [ -z "$DEEP_DIVE_API_KEY" ] || [ -z "$DEEP_DIVE_BASE_URL" ] || [ -z "$DEEP_DIVE_MODEL" ]; then
            echo "::warning::Code analysis provider is not configured. Collected PRs remain explicitly unanalyzed."
            echo "Code deep dives: not configured; no template fallback." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm run deep-dive -- run --date yesterday
          npm run deep-dive -- run --date today
      - name: Enqueue the latest issue and deliver device notifications
        working-directory: ai-infra-board
        env:
          DATABASE_URL: ${{ secrets.AI_INFRA_DATABASE_URL }}
          DATABASE_SSL: "true"
          TIMEZONE: Asia/Shanghai
          JPUSH_APP_KEY: ${{ secrets.JPUSH_APP_KEY }}
          JPUSH_MASTER_SECRET: ${{ secrets.JPUSH_MASTER_SECRET }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
        run: npm run push:flush -- --enqueue-latest
