EVICE。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasAtomicsMode_t", "titleZh": "cublasAtomicsMode_t", "numberedTitle": "2.2.8. cublasAtomicsMode_t", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Datatypes Reference", "parentZh": "cuBLAS Datatypes Reference", "kind": "Types / Status", "kindZh": "类型 / 状态码", "summary": "The type indicates whether cuBLAS routines which has an alternate implementation using atomics can be used. The atomics mode can be set and queried using cublasSetAtomicsMode() and cublasGetAtomicsMode() and routines, respectively.", "details": "The type indicates whether cuBLAS routines which has an alternate implementation using atomics can be used.\nThe atomics mode can be set and queried using cublasSetAtomicsMode() and cublasGetAtomicsMode() and routines, respectively.\nValue | Meaning\nCUBLAS_ATOMICS_NOT_ALLOWED | The usage of atomics is not allowed.\nCUBLAS_ATOMICS_ALLOWED | The usage of atomics is allowed.", "source": "https://docs.nvidia.com/cuda/cublas/#cublasatomicsmode-t", "tokens": ["cublasAtomicsMode_t", "cuBLAS", "cublasSetAtomicsMode", "cublasGetAtomicsMode", "CUBLAS_ATOMICS_NOT_ALLOWED", "CUBLAS_ATOMICS_ALLOWED"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasAtomicsMode_t」，归在「类型 / 状态码」。重点关注 关键词 cublasAtomicsMode_t、cuBLAS、cublasSetAtomicsMode、cublasGetAtomicsMode、CUBLAS_ATOMICS_NOT_ALLOWED，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublasAtomicsMode_t」对应的官方条目，分类为「类型 / 状态码」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublasAtomicsMode_t、cuBLAS、cublasSetAtomicsMode、cublasGetAtomicsMode、CUBLAS_ATOMICS_NOT_ALLOWED、CUBLAS_ATOMICS_ALLOWED。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasGemmAlgo_t", "titleZh": "cublasGemmAlgo_t", "numberedTitle": "2.2.9. cublasGemmAlgo_t", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Datatypes Reference", "parentZh": "cuBLAS Datatypes Reference", "kind": "GEMM / Level-3", "kindZh": "GEMM / Level-3", "summary": "cublasGemmAlgo_t type is an enumerant to specify the algorithm for matrix-matrix multiplication on GPU architectures up to sm_75 . On sm_80 and newer GPU architectures, this enumerant has no effect. cuBLAS has the following algorithm options:", "details": "cublasGemmAlgo_t type is an enumerant to specify the algorithm for matrix-matrix multiplication on GPU architectures up to sm_75 .\nOn sm_80 and newer GPU architectures, this enumerant has no effect. cuBLAS has the following algorithm options:\nValue | Meaning\nCUBLAS_GEMM_DEFAULT | Apply Heuristics to select the GEMM algorithm\nCUBLAS_GEMM_ALGO0 to CUBLAS_GEMM_ALGO23 | Explicitly choose an Algorithm 0..23 . Note: Doesn’t have effect on NVIDIA Ampere architecture GPUs and newer.\nCUBLAS_GEMM_DEFAULT_TENSOR_OP [DEPRECATED] | This mode is deprecated and will be removed in a future release. Apply Heuristics to select the GEMM algorithm, while allowing use of reduced precision CUBLAS_COMPUTE_32F_FAST_16F kernels (for backward compatibility).\nCUBLAS_GEMM_ALGO0_TENSOR_OP to CUBLAS_GEMM_ALGO15_TENSOR_OP [DEPRECATED] | Those values are deprecated and will be removed in a future release. Explicitly choose a Tensor core GEMM Algorithm 0..15 . Allows use of reduced precision CUBLAS_COMPUTE_32F_FAST_16F kernels (for backward compatibility). Note: Doesn’t have effect on NVIDIA Ampere architecture GPUs and newer.\nCUBLAS_GEMM_AUTOTUNE | [EXPERIMENTAL] The library will benchmark a number of available algorithms and choose the optimal one for the given problem configuration. Solution is cached in cublas handle so that next calls with the problem size will use the cached configuration. Note: To avoid overwriting the user’s data, the library will allocate the amount of memory corresponding to the size of the output. Note: The benchmarking is not supported during stream capture; CUBLAS_STATUS_NOT_SUPPORTED will be returned under stream capture if no configuration was found in the cache for the given problem size.", "source": "https://docs.nvidia.com/cuda/cublas/#cublasgemmalgo-t", "tokens": ["cublasGemmAlgo_t", "sm_75", "sm_80", "cuBLAS", "CUBLAS_GEMM_DEFAULT", "CUBLAS_GEMM_ALGO0", "CUBLAS_GEMM_ALGO23", "CUBLAS_GEMM_DEFAULT_TENSOR_OP", "CUBLAS_COMPUTE_32F_FAST_16F", "CUBLAS_GEMM_ALGO0_TENSOR_OP", "CUBLAS_GEMM_ALGO15_TENSOR_OP", "CUBLAS_GEMM_AUTOTUNE"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasGemmAlgo_t」，归在「GEMM / Level-3」。重点关注 关键词 cublasGemmAlgo_t、sm_75、sm_80、cuBLAS、CUBLAS_GEMM_DEFAULT，适合用于定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。", "detailsZh": "中文提要：这是「cublasGemmAlgo_t」对应的官方条目，分类为「GEMM / Level-3」。\n阅读重点：定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。\n相关 API / 关键词：cublasGemmAlgo_t、sm_75、sm_80、cuBLAS、CUBLAS_GEMM_DEFAULT、CUBLAS_GEMM_ALGO0、CUBLAS_GEMM_ALGO23、CUBLAS_GEMM_DEFAULT_TENSOR_OP。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasMath_t", "titleZh": "cublasMath_t", "numberedTitle": "2.2.10. cublasMath_t", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Datatypes Reference", "parentZh": "cuBLAS Datatypes Reference", "kind": "Precision / Tensor Core", "kindZh": "精度 / Tensor Core", "summary": "cublasMath_t enumerate type is used in cublasSetMathMode() to choose compute precision modes as defined in the following table. Since this setting does not directly control the use of Tensor Cores, the mode CUBLAS_TENSOR_OP_MATH is being deprecated, and will be removed...", "details": "cublasMath_t enumerate type is used in cublasSetMathMode() to choose compute precision modes as defined in the following table.\nSince this setting does not directly control the use of Tensor Cores, the mode CUBLAS_TENSOR_OP_MATH is being deprecated, and will be removed in a future release.\nValue | Meaning\nCUBLAS_DEFAULT_MATH | This is the default and highest-performance mode that uses compute and intermediate storage precisions with at least the same number of mantissa and exponent bits as requested. Tensor Cores will be used whenever possible.\nCUBLAS_PEDANTIC_MATH | This mode uses the prescribed precision and standardized arithmetic for all phases of calculations and is primarily intended for numerical robustness studies, testing, and debugging. This mode might not be as performant as the other modes.\nCUBLAS_TF32_TENSOR_OP_MATH | Enable acceleration of single-precision routines using TF32 tensor cores. Note that input conversions round to nearest even.\nCUBLAS_FP32_EMULATED_BF16X9_MATH | Enable acceleration of single-precision routines using the BF16x9 algorithm. See Floating Point Emulation for more details. For single precision GEMM routines cuBLAS will use the CUBLAS_COMPUTE_32F_EMULATED_16BFX9 compute type.\nCUBLAS_FP64_EMULATED_FIXEDPOINT_MATH | Enable acceleration of double-precision routines using fixed-point emulation algorithms. See Floating Point Emulation for more details.", "source": "https://docs.nvidia.com/cuda/cublas/#cublasmath-t", "tokens": ["cublasMath_t", "cublasSetMathMode", "CUBLAS_TENSOR_OP_MATH", "CUBLAS_DEFAULT_MATH", "CUBLAS_PEDANTIC_MATH", "CUBLAS_TF32_TENSOR_OP_MATH", "CUBLAS_FP32_EMULATED_BF16X9_MATH", "cuBLAS", "CUBLAS_COMPUTE_32F_EMULATED_16BFX9", "CUBLAS_FP64_EMULATED_FIXEDPOINT_MATH"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasMath_t」，归在「精度 / Tensor Core」。重点关注 关键词 cublasMath_t、cublasSetMathMode、CUBLAS_TENSOR_OP_MATH、CUBLAS_DEFAULT_MATH、CUBLAS_PEDANTIC_MATH，适合用于理解 Tensor Core、数据类型、math mode 和精度/性能取舍。", "detailsZh": "中文提要：这是「cublasMath_t」对应的官方条目，分类为「精度 / Tensor Core」。\n阅读重点：理解 Tensor Core、数据类型、math mode 和精度/性能取舍。\n相关 API / 关键词：cublasMath_t、cublasSetMathMode、CUBLAS_TENSOR_OP_MATH、CUBLAS_DEFAULT_MATH、CUBLAS_PEDANTIC_MATH、CUBLAS_TF32_TENSOR_OP_MATH、CUBLAS_FP32_EMULATED_BF16X9_MATH、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasComputeType_t", "titleZh": "cublasComputeType_t", "numberedTitle": "2.2.11. cublasComputeType_t", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Datatypes Reference", "parentZh": "cuBLAS Datatypes Reference", "kind": "Precision / Tensor Core", "kindZh": "精度 / Tensor Core", "summary": "cublasComputeType_t enumerate type is used in cublasGemmEx() and cublasLtMatmul() (including all batched and strided batched variants) to choose compute precision modes as defined below.", "details": "cublasComputeType_t enumerate type is used in cublasGemmEx() and cublasLtMatmul() (including all batched and strided batched variants) to choose compute precision modes as defined below.\nValue | Meaning\nCUBLAS_COMPUTE_16F | This is the default and highest-performance mode for 16-bit half precision floating point and all compute and intermediate storage precisions with at least 16-bit half precision. Tensor Cores will be used whenever possible.\nCUBLAS_COMPUTE_16F_PEDANTIC | This mode uses 16-bit half precision floating point standardized arithmetic for all phases of calculations and is primarily intended for numerical robustness studies, testing, and debugging. This mode might not be as performant as the other modes since it disables use of tensor cores.\nCUBLAS_COMPUTE_32F | This is the default 32-bit single precision floating point and uses compute and intermediate storage precisions of at least 32-bits.\nCUBLAS_COMPUTE_32F_PEDANTIC | Uses 32-bit single precision floating point arithmetic for all phases of calculations and also disables algorithmic optimizations such as Gaussian complexity reduction (3M).\nCUBLAS_COMPUTE_32F_FAST_16F | Allows the library to use Tensor Cores with automatic down-conversion and 16-bit half-precision compute for 32-bit input and output matrices.\nCUBLAS_COMPUTE_32F_FAST_16BF | Allows the library to use Tensor Cores with automatic down-convesion and bfloat16 compute for 32-bit input and output matrices. See Alternate Floating Point section for more details on bfloat16.", "source": "https://docs.nvidia.com/cuda/cublas/#cublascomputetype-t", "tokens": ["cublasComputeType_t", "cublasGemmEx", "cublasLtMatmul", "CUBLAS_COMPUTE_16F", "CUBLAS_COMPUTE_16F_PEDANTIC", "CUBLA ot carry the type itself (e.g void *)", "details": "The cudaDataType_t type is an enumerant to specify the data precision.\nIt is used when the data reference does not carry the type itself (e.g void *)\nFor example, it is used in the routine cublasSgemmEx() .\nValue | Meaning\nCUDA_R_16F | The data type is a 16-bit real half precision floating-point\nCUDA_C_16F | The data type is a 32-bit structure comprised of two half precision floating-points representing a complex number.\nCUDA_R_16BF | The data type is a 16-bit real bfloat16 floating-point\nCUDA_C_16BF | The data type is a 32-bit structure comprised of two bfloat16 floating-points representing a complex number.", "source": "https://docs.nvidia.com/cuda/cublas/#cudadatatype-t", "tokens": ["cudaDataType_t", "cublasSgemmEx", "CUDA_R_16F", "CUDA_C_16F", "CUDA_R_16BF", "CUDA_C_16BF"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cudaDataType_t」，归在「类型 / 状态码」。重点关注 关键词 cudaDataType_t、cublasSgemmEx、CUDA_R_16F、CUDA_C_16F、CUDA_R_16BF，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cudaDataType_t」对应的官方条目，分类为「类型 / 状态码」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cudaDataType_t、cublasSgemmEx、CUDA_R_16F、CUDA_C_16F、CUDA_R_16BF、CUDA_C_16BF。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cudaEmulationStrategy_t", "titleZh": "cudaEmulationStrategy_t", "numberedTitle": "2.3.2. cudaEmulationStrategy_t", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "CUDA Datatypes Reference", "parentZh": "CUDA 数据类型参考", "kind": "Precision / Tensor Core", "kindZh": "精度 / Tensor Core", "summary": "The cudaEmulationStrategy_t is a parameter to specify how to leverage floating point emulation algorithms. This is equivalent to cublasEmulationStrategy_t .", "details": "The cudaEmulationStrategy_t is a parameter to specify how to leverage floating point emulation algorithms.\nThis is equivalent to cublasEmulationStrategy_t .", "source": "https://docs.nvidia.com/cuda/cublas/#cudaemulationstrategy-t", "tokens": ["cudaEmul text.\nIt allocates hardware resources on the host and device and must be called prior to making any other cuBLAS library calls.\nThe cuBLAS library context is tied to the current CUDA device.\nTo use the library on multiple devices, one cuBLAS handle needs to be created for each device.\nFor a given device, multiple cuBLAS handles with different configurations can be created.\nFor multi-threaded applications that use the same device from different threads, the recommended programming model is to create one cuBLAS handle per thread and use that cuBLAS handle for the entire life of the thread.\nBecause cublasCreate() allocates some internal resources and the release of those resources by calling cublasDestroy() will implicitly call cudaDeviceSynchronize() , it is recommended to minimize the number of times these functions are called.\nReturn Value | Meaning", "source": "https://docs.nvidia.com/cuda/cublas/#cublascreate", "tokens": ["cublasCreate", "cuBLAS", "cublasDestroy", "cudaDeviceSynchronize"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasCreate()」，归在「API 函数」。重点关注 关键词 cublasCreate、cuBLAS、cublasDestroy、cudaDeviceSynchronize，适合用于查询函数用途、参数语义和调用入口。", "detailsZh": "中文提要：这是「cublasCreate()」对应的官方条目，分类为「API 函数」。\n阅读重点：查询函数用途、参数语义和调用入口。\n相关 API / 关键词：cublasCreate、cuBLAS、cublasDestroy、cudaDeviceSynchronize。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasDestroy()", "titleZh": "cublasDestroy()", "numberedTitle": "2.4.2. cublasDestroy()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Helper Function Reference", "parentZh": "cuBLAS Helper Function Reference", "kind": "API Function", "kindZh": "API 函数", "summary": "This function releases hardware resources used by the cuBLAS library. This function is usually the last call with a particular handle to the cuBLAS library. Because cublasCreate() allocates some internal resources and the release of those resources by calling...", "details": "This function releases hardware resour arget()」对应的官方条目，分类为「API 函数」。\n阅读重点：查询函数用途、参数语义和调用入口。\n相关 API / 关键词：cublasSetSmCountTarget、cuBLAS、cudaDeviceGetAttribute、cublasSetStream、CUBLAS_STATUS_SUCCESS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasGetSmCountTarget()", "titleZh": "cublasGetSmCountTarget()", "numberedTitle": "2.4.25. cublasGetSmCountTarget()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Helper Function Reference", "parentZh": "cuBLAS Helper Function Reference", "kind": "API Function", "kindZh": "API 函数", "summary": "This function obtains the value previously programmed to the library handle.", "details": "This function obtains the value previously programmed to the library handle.\nReturn Value | Meaning\nCUBLAS_STATUS_SUCCESS | SM count target was returned successfully.\nCUBLAS_STATUS_INVALID_VALUE | smCountTarget is NULL.\nCUBLAS_STATUS_NOT_INITIALIZED | the library was not initialized.", "source": "https://docs.nvidia.com/cuda/cublas/#cublasgetsmcounttarget", "tokens": ["cublasGetSmCountTarget", "CUBLAS_STATUS_SUCCESS", "CUBLAS_STATUS_INVALID_VALUE", "CUBLAS_STATUS_NOT_INITIALIZED"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasGetSmCountTarget()」，归在「API 函数」。重点关注 关键词 cublasGetSmCountTarget、CUBLAS_STATUS_SUCCESS、CUBLAS_STATUS_INVALID_VALUE、CUBLAS_STATUS_NOT_INITIALIZED，适合用于查询函数用途、参数语义和调用入口。", "detailsZh": "中文提要：这是「cublasGetSmCountTarget()」对应的官方条目，分类为「API 函数」。\n阅读重点：查询函数用途、参数语义和调用入口。\n相关 API / 关键词：cublasGetSmCountTarget、CUBLAS_STATUS_SUCCESS、CUBLAS_STATUS_INVALID_VALUE、CUBLAS_STATUS_NOT_INITIALIZED。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasSetEmulationStrategy()", "titleZh": "cublasSetEmulationStrategy()", "numberedTitle": "2.4.26. cublasSetEmulationStrategy()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Helper Function Reference", "parentZh": "cuBLAS Helper Function Reference", "kind": "Precision / Tensor Core", "kindZh": "精度 / Tensor Core", "summary": "The cublasSetEmu gle-precision\ncuDoubleComplex | z or Z | complex double-precision\nWhen the parameters and returned values of the function differ, which sometimes happens for complex input, the < t > can also be Sc , Cs , Dz and Zd .", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-level-1-function-reference", "tokens": ["cuBLAS", "cuComplex", "cuDoubleComplex"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cuBLAS Level-1 Function Reference」，归在「BLAS Level-1」。重点关注 关键词 cuBLAS、cuComplex、cuDoubleComplex，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cuBLAS Level-1 Function Reference」对应的官方条目，分类为「BLAS Level-1」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS、cuComplex、cuDoubleComplex。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasI<t>amax()", "titleZh": "cublasI<t>amax()", "numberedTitle": "2.5.1. cublasI<t>amax()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Level-1 Function Reference", "parentZh": "cuBLAS Level-1 Function Reference", "kind": "BLAS Level-1", "kindZh": "BLAS Level-1", "summary": "This function supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function finds the (smallest) index of the element of the maximum magnitude.\nHence, the result is the first \\(i\\) such that \\(\\left| \\mathbf{Im}\\left( {x\\lbrack j\\rbrack} \\right) \\middle| + \\middle| \\mathbf{Re}\\left( {x\\lbrack j\\rbrack} \\right) \\right|\\) is maximum for \\(i = 1,\\ldots,n\\) and \\(j = 1 + \\left( {i - 1} \\right)*\\text{ incx}\\) .\nParam. | Memory | In/out | Meaning\nhandle | input | Handle to the cuBLAS library context.\nn | input | Number of elements in the vector x .\nx | device | input | < type > vector with elements.\nincx | input | Stride between consecutive elements of x .", "source": "https://docs.nvidia.com/cuda/cublas/#cublasi-t-amax", "tokens": ["cublasI<t>amax", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasI<t>amax()」，归在「BLAS Level-1」。重点关注 关键词 cublasI<t Level-1 Function Reference", "parentZh": "cuBLAS Level-1 Function Reference", "kind": "BLAS Level-1", "kindZh": "BLAS Level-1", "summary": "This function supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function computes the sum of the absolute values of the elements of vector x .\nHence, the result is \\(\\left. \\sum_{i = 1}^{n} \\middle| \\mathbf{Im}\\left( {x\\lbrack j\\rbrack} \\right) \\middle| + \\middle| \\mathbf{Re}\\left( {x\\lbrack j\\rbrack} \\right) \\right|\\) where \\(j = 1 + \\left( {i - 1} \\right)*\\text{incx}\\) .\nParam. | Memory | In/out | Meaning\nhandle | input | Handle to the cuBLAS library context.\nn | input | Number of elements in the vector x .\nx | device | input | < type > vector with elements.\nincx | input | Stride between consecutive elements of x .", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-t-asum", "tokens": ["cublas<t>asum", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublas<t>asum()」，归在「BLAS Level-1」。重点关注 关键词 cublas<t>asum、cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublas<t>asum()」对应的官方条目，分类为「BLAS Level-1」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublas<t>asum、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublas<t>axpy()", "titleZh": "cublas<t>axpy()", "numberedTitle": "2.5.4. cublas<t>axpy()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Level-1 Function Reference", "parentZh": "cuBLAS Level-1 Function Reference", "kind": "BLAS Level-1", "kindZh": "BLAS Level-1", "summary": "This function supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function multiplies the vector x by the scalar \\(\\alpha\\) and adds it to the vector y overwriting the latest vector with the result.\nHence, the performed operation is \\(\\mathbf{y}\\lbrack j\\rbrack = \\alpha \\times \\mathbf{x}\\lbrack k\\rbrack + \\mathbf{y}\\lbrack j\\rbrack\\) for \\(i = 1,\\ldots,n\\) , \\(k = 1 + \\left( {i - 1} \\right)*\\text{incx}\\) and \\(j = 1 + \\left( {i - 1} \\right)*\\text{incy}\\) .\nParam. | Memory | In/out | Meaning\nhandle | input | Handle to the cuBLAS library context.\nalpha | host or device | input | < type > scalar used for multiplication.\nn | input | Number of elements in the vector x and y .\nx | device | input | < type > vector with n elements.", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-t-axpy", "tokens": ["cublas<t>axpy", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublas<t>axpy()」，归在「BLAS Level-1」。重点关注 关键词 cublas<t>axpy、cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublas<t>axpy()」对应的官方条目，分类为「BLAS Level-1」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublas<t>axpy、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublas<t>copy()", "titleZh": "cublas<t>copy()", "numberedTitle": "2.5.5. cublas<t>copy()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Level-1 Function Reference", "parentZh": "cuBLAS Level-1 Function Reference", "kind": "BLAS Level-1", "kindZh": "BLAS Level-1", "summary": "This function supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function copies the vector x into the vector y .\nHence, the performed operation is \\(\\mathbf{y}\\lbrack j\\rbrack = \\mathbf{x}\\lbrack k\\rbrack\\) for \\(i = 1,\\ldots,n\\) , \\(k = 1 + \\left( {i - 1} \\right)*\\text{incx}\\) and \\(j = 1 + \\left( {i - 1} \\right)*\\text{incy}\\) .\nParam. | Memory | In/out | Meaning\nhandle | input | Handle to the cuBLAS library context.\nn | input | Number of elements in the vector x and y .\nx | device | input | < type > vector with n elements.\nincx | input | Stride between consecutive elements of x .", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-t-copy", "tokens": ["cublas<t>copy", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublas<t>copy()」，归在「BLAS Level-1」。重点关注 关键词 cublas<t>copy、cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublas<t>copy()」对应的官方条目，分类为「BLAS Level-1」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublas<t>copy、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublas<t>dot()", "titleZh": "cublas<t>dot()", "numberedTitle": "2.5.6. cublas<t>dot()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Level-1 Function Reference", "parentZh": "cuBLAS Level-1 Function Reference", "kind": "BLAS Level-1", "kindZh": "BLAS Level-1", "summary": "This function supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function computes the dot product of vectors x and y .\nHence, the result is \\(\\sum_{i = 1}^{n}\\left( {\\mathbf{x}\\lbrack k\\rbrack \\times \\mathbf{y}\\lbrack j\\rbrack} \\right)\\) where \\(k = 1 + \\left( {i - 1} \\right)*\\text{incx}\\) and \\(j = 1 + \\left( {i - 1} \\right)*\\text{incy}\\) .\nParam. | Memory | In/out | Meaning\nhandle | input | Handle to the cuBLAS library context.\nn | input | Number of elements in the vectors x and y .\nx | device | input | < type > vector with n elements.\nincx | input | Stride between consecutive elements of x .", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-t-dot", "tokens": ["cublas<t>dot", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublas<t>dot()」，归在「BLAS Level-1」。重点关注 关键词 cublas<t>dot、cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublas<t>dot()」对应的官方条目，分类为「BLAS Level-1」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublas<t>dot、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublas<t>nrm2()", "titleZh": "cublas<t>nrm2()", "numberedTitle": "2.5.7. cublas<t>nrm2()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Level-1 Function Reference", "parentZh": "cuBLAS Level-1 Function Reference", "kind": "BLAS Level-1", "kindZh": "BLAS Level-1", "summary": "This function supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function computes the Euclidean norm of the vector x .\nThe code uses a multiphase model of accumulation to avoid intermediate underflow and overflow, with the result being equivalent to \\(\\sqrt{\\sum_{i = 1}^{n}\\left( {\\mathbf{x}\\lbrack j\\rbrack \\times \\mathbf{x}\\lbrack j\\rbrack} \\right)}\\) where \\(j = 1 + \\left( {i - 1} \\right)*\\text{incx}\\) in exact arithmetic.\nParam. | Memory | In/out | Meaning\nhandle | input | Handle to the cuBLAS library context.\nn | input | Number of elements in the vector x .\nx | device | input | < type > vector with n elements.\nincx | input | Stride between consecutive elements of x .", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-t-nrm2", "tokens": ["cublas<t>nrm2", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublas<t>nrm2()」，归在「BLAS Level-1」。重点关注 关键词 cublas<t>nrm2、cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublas<t>nrm2()」对应的官方条目，分类为「BLAS Level-1」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublas<t>nrm2、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublas<t>rot()", "titleZh": "cublas<t>rot()", "numberedTitle": "2.5.8. cublas<t>rot()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Level-1 Function Reference", "parentZh": "cuBLAS Level-1 Function Reference", "kind": "BLAS Level-1", "kindZh": "BLAS Level-1", "summary": "This function supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function applies Givens rotation matrix (i.e., rotation in the x,y plane counter-clockwise by angle defined by \\(cos(alpha) = c\\) , \\(sin(alpha) = s\\) ):\n\\(G = \\begin{pmatrix} c & s \\\\ {- s} & c \\\\ \\end{pmatrix}\\)\nto vectors x and y .\nHence, the result is \\(\\mathbf{x}\\lbrack k\\rbrack = c \\times \\mathbf{x}\\lbrack k\\rbrack + s \\times \\mathbf{y}\\lbrack j\\rbrack\\) and \\(\\mathbf{y}\\lbrack j\\rbrack = - s \\times \\mathbf{x}\\lbrack k\\rbrack + c \\times \\mathbf{y}\\lbrack j\\rbrack\\) where \\(k = 1 + \\left( {i - 1} \\right)*\\text{incx}\\) and \\(j = 1 + \\left( {i - 1} \\right)*\\text{incy}\\) .\nNotice that the last two equations reflect 1-based indexing used for compatibility with Fortran.\nParam. | Memory | In/out | Meaning\nhandle | input | Handle to the cuBLAS library context.", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-t-rot", "tokens": ["cublas<t>rot", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublas<t>rot()」，归在「BLAS Level-1」。重点关注 关键词 cublas<t>rot、cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublas<t>rot()」对应的官方条目，分类为「BLAS Level-1」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublas<t>rot、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublas<t>rotg()", "titleZh": "cublas<t>rotg()", "numberedTitle": "2.5.9. cublas<t>rotg()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Level-1 Function Reference", "parentZh": "cuBLAS Level-1 Function Reference", "kind": "BLAS Level-1", "kindZh": "BLAS Level-1", "summary": "This function supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function constructs the Givens rotation matrix\n\\(G = \\begin{pmatrix} c & s \\\\ {- s} & c \\\\ \\end{pmatrix}\\)\nthat zeros out the second entry of a \\(2 \\times 1\\) vector \\(\\left( {a,b} \\right)^{T}\\) .\nThen, for real numbers we can write\n\\(\\begin{pmatrix} c & s \\\\ {- s} & c \\\\ \\end{pmatrix}\\begin{pmatrix} a \\\\ b \\\\ \\end{pmatrix} = \\begin{pmatrix} r \\\\ 0 \\\\ \\end{pmatrix}\\)\nwhere \\(c^{2} + s^{2} = 1\\) and \\(r = \\pm \\sqrt{a^{2} + b^{2}}\\) .\nThe parameters \\(a\\) and \\(b\\) are overwritten with \\(r\\) and \\(z\\) , respectively.", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-t-rotg", "tokens": ["cublas<t>rotg"], "summaryZ ion supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function scales the vector x by the scalar \\(\\alpha\\) and overwrites it with the result.\nHence, the performed operation is \\(\\mathbf{x}\\lbrack j\\rbrack = \\alpha \\times \\mathbf{x}\\lbrack j\\rbrack\\) for \\(i = 1,\\ldots,n\\) and \\(j = 1 + \\left( {i - 1} \\right)*\\text{incx}\\) .\nParam. | Memory | In/out | Meaning\nhandle | input | Handle to the cuBLAS library context.\nalpha | host or device | input | < type > scalar used for multiplication.\nn | input | Number of elements in the vector x .\nx | device | in/out | < type > vector with n elements.", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-t-scal", "tokens": ["cublas<t>scal", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublas<t>scal()」，归在「BLAS Level-1」。重点关注 关键词 cublas<t>scal、cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublas<t>scal()」对应的官方条目，分类为「BLAS Level-1」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublas<t>scal、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublas<t>swap()", "titleZh": "cublas<t>swap()", "numberedTitle": "2.5.13. cublas<t>swap()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Level-1 Function Reference", "parentZh": "cuBLAS Level-1 Function Reference", "kind": "BLAS Level-1", "kindZh": "BLAS Level-1", "summary": "This function supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function interchanges the elements of vector x and y .\nHence, the performed operation is \\(\\left. \\mathbf{y}\\lbrack j\\rbrack\\Leftrightarrow\\mathbf{x}\\lbrack k\\rbrack \\right.\\) for \\(i = 1,\\ldots,n\\) , \\(k = 1 + \\left( {i - 1} \\right)*\\text{incx}\\) and \\(j = 1 + \\left( {i - 1} \\right)*\\text{incy}\\) .\nParam. | Memory | In/out | Meaning\nhandle | input | Handle to the cuBLAS library context.\nn | input | Number of elements in the vectors x and y .\nx | device | in/out | < type > vector with n elements.\nincx | input | Stride between consecutive elements of x .", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-t-swap", "tokens": ["cublas<t>swap", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublas<t>swap()」，归在「BLAS Level-1」。重点关注 关键词 cublas<t>swap、cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublas<t>swap()」对应的官方条目，分类为「BLAS Level-1」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublas<t>swap、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cuBLAS Level-2 Function Reference", "titleZh": "cuBLAS Level-2 Function Reference", "numberedTitle": "2.6. cuBLAS Level-2 Function Reference", "level": "H2", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "", "parentZh": "", "kind": "BLAS Level-2", "kindZh": "BLAS Level-2", "summary": "In this chapter we describe the Level-2 Basic Linear Algebra Subprograms (BLAS2) functions that perform matrix-vector operations.", "details": "In this chapter we describe the Level-2 Basic Linear Algebra Subprograms (BLAS2) functions that perform matrix-vector operations.", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-level-2-function-reference", "tokens": ["cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cuBLAS Level-2 Function Reference」，归在「BLAS Level-2」。重点关注 关键词 cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cuBLAS Level-2 Function Reference」对应的官方条目，分类为「BLAS Level-2」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublas<t>gbmv()", "titleZh": "cublas<t>gbmv()", "numberedTitle": "2.6.1. cublas<t>gbmv()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Level-2 Function Reference", "parentZh": "cuBLAS Level-2 Function Reference", "kind": "BLAS Level-2", "kindZh": "BLAS Level-2", "summary": "This function supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function performs the banded matrix-vector multiplication\n\\(\\mathbf{y} = \\alpha\\text{ op}(A)\\mathbf{x} + \\beta\\mathbf{y}\\)\nwhere \\(A\\) is a banded matrix with \\(kl\\) subdiagonals and \\(ku\\) superdiagonals, \\(\\mathbf{x}\\) and \\(\\mathbf{y}\\) are vectors, and \\(\\alpha\\) and \\(\\beta\\) are scalars.\nAlso, for matrix \\(A\\)\n\\(\\text{ op}(A) = \\begin{cases} A & \\text{ if trans == $\\mathrm{CUBLAS\\_OP\\_N}$} \\\\ A^{T} & \\text{ if trans == $\\mathrm{CUBLAS\\_OP\\_T}$} \\\\ A^{H} & \\text{ if trans == $\\mathrm{CUBLAS\\_OP\\_C}$} \\\\ \\end{cases}\\)\nThe banded matrix \\(A\\) is stored column by column, with the main diagonal stored in row \\(ku + 1\\) (starting in first position), the first superdiagonal stored in row \\(ku\\) (starting in second position), the first subdiagonal stored in row \\(ku + 2\\) (starting in first position), etc.\nSo that in general, the element \\(A\\left( {i,j} \\right)\\) is stored in the memory location A(ku+1+i-j,j) for \\(j = 1,\\ldots,n\\) and \\(i \\in \\left\\lbrack {\\max\\left( {1,j - ku} \\right),\\min\\left( {m,j + kl} \\right)} \\right\\rbrack\\) .", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-t-gbmv", "tokens": ["cublas<t>gbmv"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublas<t>gbmv()」，归在「BLAS Level-2」。重点关注 关键词 cublas<t>gbmv，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublas<t>gbmv()」对应的官方条目，分类为「BLAS Level-2」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublas<t>gbmv。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublas<t>gemv()", "titleZh": "cublas<t>gemv()", "numberedTitle": "2.6.2. cublas<t>gemv()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Level-2 Function Reference", "parentZh": "cuBLAS Level-2 Function Reference", "kind": "BLAS Level-2", "kindZh": "BLAS Level-2", "summary": "This function supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function performs the matrix-vector multiplication\n\\(\\textbf{y} = \\alpha\\text{ op}(A)\\textbf{x} + \\beta\\textbf{y}\\)\nwhere \\(A\\) is a \\(m \\times n\\) matrix stored in column-major format, \\(\\mathbf{x}\\) and \\(\\mathbf{y}\\) are vectors, and \\(\\alpha\\) and \\(\\beta\\) are scalars.\nAlso, for matrix \\(A\\)\n\\(\\text{ op}(A) = \\begin{cases} A & \\text{ if trans == $\\mathrm{CUBLAS\\_OP\\_N}$} \\\\ A^{T} & \\text{ if trans == $\\mathrm{CUBLAS\\_OP\\_T}$} \\\\ A^{H} & \\text{ if trans == $\\mathrm{CUBLAS\\_OP\\_C}$} \\\\ \\end{cases}\\)\nParam. | Memory | In/out | Meaning\nhandle | input | Handle to the cuBLAS library context.", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-t-gemv", "tokens": ["cublas<t>gemv", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublas<t>gemv()」，归在「BLAS Level-2」。重点关注 关键词 cublas<t>gemv、cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublas<t>gemv()」对应的官方条目，分类为「BLAS Level-2」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublas<t>gemv、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublas<t>ger()", "titleZh": "cublas<t>ger()", "numberedTitle": "2.6.3. cublas<t>ger()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Level-2 Function Reference", "parentZh": "cuBLAS Level-2 Function Reference", "kind": "BLAS Level-2", "kindZh": "BLAS Level-2", "summary": "This function supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function performs the rank-1 update\n\\(A = \\begin{cases} {\\alpha\\mathbf{xy}^{T} + A} & \\text{if ger(),geru() is called} \\\\ {\\alpha\\mathbf{xy}^{H} + A} & \\text{if gerc() is called} \\\\ \\end{cases}\\)\nwhere \\(A\\) is a \\(m \\times n\\) matrix stored in column-major format, \\(\\mathbf{x}\\) and \\(\\mathbf{y}\\) are vectors, and \\(\\alpha\\) is a scalar.\nParam. | Memory | In/out | Meaning\nhandle | input | Handle to the cuBLAS library context.\nm | input | Number of rows of matrix A .\nn | input | Number of columns of matrix A .", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-t-ger", "tokens": ["cublas<t>ger", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublas<t>ger()」，归在「BLAS Level-2」。重点关注 关键词 cublas<t>ger、cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublas<t>ger()」对应的官方条目，分类为「BLAS Level-2」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublas<t>ger、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublas<t>sbmv()", "titleZh": "cublas<t>sbmv()", "numberedTitle": "2.6.4. cublas<t>sbmv()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Level-2 Function Reference", "parentZh": "cuBLAS Level-2 Function Reference", "kind": "BLAS Level-2", "kindZh": "BLAS Level-2", "summary": "This function supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function performs the symmetric banded matrix-vector multiplication\n\\(\\textbf{y} = \\alpha A\\textbf{x} + \\beta\\textbf{y}\\)\nwhere \\(A\\) is a \\(n \\times n\\) symmetric banded matrix with \\(k\\) subdiagonals and superdiagonals, \\(\\mathbf{x}\\) and \\(\\mathbf{y}\\) are vectors, and \\(\\alpha\\) and \\(\\beta\\) are scalars.\nIf uplo == CUBLAS_FILL_MODE_LOWER then the symmetric banded matrix \\(A\\) is stored column by column, with the main diagonal of the matrix stored in row 1, the first subdiagonal in row 2 (starting at first position), the second subdiagonal in row 3 (starting at first position), etc.\nSo that in general, the element \\(A(i,j)\\) is stored in the memory location A(1+i-j,j) for \\(j = 1,\\ldots,n\\) and \\(i \\in \\lbrack j,\\min(m,j + k)\\rbrack\\) .\nIf uplo == CUBLAS_FILL_MODE_UPPER then the symmetric banded matrix \\(A\\) is stored column by column, with the main diagonal of the matrix stored in row k + 1 , the first superdiagonal in row k (starting at second position), the second superdiagonal in row k-1 (starting at third position), etc.\nSo that in general, the element \\(A(i,j)\\) is stored in the memory location A(1+k+i-j,j) for \\(j = 1,\\ldots,n\\) and \\(i \\in \\lbrack\\max(1,j - k),j\\rbrack\\) .", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-t-sbmv", "tokens": ["cublas<t>sbmv", "CUBLAS_FILL_MODE_LOWER", "CUBLAS_FILL_MODE_UPPER"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublas<t>sbmv()」，归在「BLAS Level-2」。重点关注 关键词 cublas<t>sbmv、CUBLAS_FILL_MODE_LOWER、CUBLAS_FILL_MODE_UPPER，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublas<t>sbmv()」对应的官方条目，分类为「BLAS Level-2」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublas<t>sbmv、CUBLAS_FILL_MODE_LOWER、CUBLAS_FILL_MODE_UPPER。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublas<t>spmv()", "titleZh": "cublas<t>spmv()", "numberedTitle": "2.6.5. cublas<t>spmv()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Level-2 Function Reference", "parentZh": "cuBLAS Level-2 Function Reference", "kind": "BLAS Level-2", "kindZh": "BLAS Level-2", "summary": "This function supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function performs the symmetric packed matrix-vector multiplication\n\\(\\textbf{y} = \\alpha A\\textbf{x} + \\beta\\textbf{y}\\)\nwhere \\(A\\) is a \\(n \\times n\\) symmetric matrix stored in packed format, \\(\\mathbf{x}\\) and \\(\\mathbf{y}\\) are vectors, and \\(\\alpha\\) and \\(\\beta\\) are scalars.\nIf uplo == CUBLAS_FILL_MODE_LOWER then the elements in the lower triangular part of the symmetric matrix \\(A\\) are packed together column by column without gaps, so that the element \\(A(i,j)\\) is stored in the memory location AP[i+((2*n-j+1)*j)/2] for \\(j = 1,\\ldots,n\\) and \\(i \\geq j\\) .\nConsequently, the packed format requires only \\(\\frac{n(n + 1)}{2}\\) elements for storage.\nIf uplo == CUBLAS_FILL_MODE_UPPER then the elements in the upper triangular part of the symmetric matrix \\(A\\) are packed numberedTitle": "2.8.2. cublas<t>dgmm()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "BLAS-like Extension", "parentZh": "BLAS-like 扩展", "kind": "GEMM / Level-3", "kindZh": "GEMM / Level-3", "summary": "This function supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function performs the matrix-matrix multiplication\n\\(C = \\left\\{ \\begin{matrix} {A \\times diag(X)} & {\\text{if }\\textsf{mode == $\\mathrm{CUBLAS\\_SIDE\\_RIGHT}$}} \\\\ {diag(X) \\times A} & {\\text{if }\\textsf{mode == $\\mathrm{CUBLAS\\_SIDE\\_LEFT}$}} \\\\ \\end{matrix} \\right.\\)\nwhere \\(A\\) and \\(C\\) are matrices stored in column-major format with dimensions \\(m \\times n\\) . \\(X\\) is a vector of size \\(n\\) if mode == CUBLAS_SIDE_RIGHT and of size \\(m\\) if mode == CUBLAS_SIDE_LEFT . \\(X\\) is gathered from one-dimensional array x with stride incx .\nThe absolute value of incx is the stride and the sign of incx is direction of the stride.\n\\(X\\lbrack j\\rbrack = \\left\\{ \\begin{matrix} {x\\lbrack j \\times incx\\rbrack} & {\\text{if }incx \\geq 0} \\\\ {x\\lbrack(\\chi - 1) \\times |incx| - j \\times |incx|\\rbrack} & {\\text{if }incx < 0} \\\\ \\end{matrix} \\right.\\)\nwhere \\(\\chi = m\\) if mode == CUBLAS_SIDE_LEFT and \\(\\chi = n\\) if mode == CUBLAS_SIDE_RIGHT .\nExample 1: if the user wants to perform \\(diag(diag(B)) \\times A\\) , then \\(incx = ldb + 1\\) where \\(ldb\\) is leading dimension of matrix B , either row-major or column-major.", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-t-dgmm", "tokens": ["cublas<t>dgmm", "CUBLAS_SIDE_RIGHT", "CUBLAS_SIDE_LEFT"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublas<t>dgmm()」，归在「GEMM / Level-3」。重点关注 关键词 cublas<t>dgmm、CUBLAS_SIDE_RIGHT、CUBLAS_SIDE_LEFT，适合用于定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。", "detailsZh": "中文提要：这是「cublas<t>dgmm()」对应的官方条目，分类为「GEMM / Level-3」。\n阅读重点：定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。\n相关 API / 关键词：cublas<t>dgmm、CUBLAS_SIDE_RIGHT、CUBLAS_SIDE_LEFT。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublas<t>getrfBatched()", "titleZh": "cublas<t>getrfBatched()", "numberedTitle": "2.8.3. cublas<t>getrfBatched()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "BLAS-like Extension", "parentZh": "BLAS-like 扩展", "kind": "GEMM / Level-3", "kindZh": "GEMM / Level-3", "summary": "Aarray is an array of pointers to matrices stored in column-major format with dimensions nxn and leading dimension lda .", "details": "Aarray is an array of pointers to matrices stored in column-major format with dimensions nxn and leading dimension lda .\nThis function performs the LU factorization of each Aarray[i] for i = 0, …, batchSize-1 by the following equation\n\\(\\text{P}\\text{*}{Aarray}\\lbrack i\\rbrack = L\\text{*}U\\)\nwhere P is a permutation matrix which represents partial pivoting with row interchanges.\nL is a lower triangular matrix with unit diagonal and U is an upper triangular matrix.\nFormally P is written by a product of permutation matrices Pj , for j = 1,2,...,n , say P = P1 * P2 * P3 * .... * Pn .\nPj is a permutation matrix which interchanges two rows of vector x when performing Pj*x .\nL and U are written back to original matrix A , and diagonal elements of L are discarded.", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-t-getrfbatched", "tokens": ["cublas<t>getrfBatched"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublas<t>getrfBatched()」，归在「GEMM / Level-3」。重点关注 关键词 cublas<t>getrfBatched，适合用于定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。", "detailsZh": "中文提要：这是「cublas<t>getrfBatched()」对应的官方条目，分类为「GEMM / Level-3」。\n阅读重点：定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。\n相关 API / 关键词：cublas<t>getrfBatched。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublas<t>getrsBatched()", "titleZh": "cublas<t>getrsBatched()", "numberedTitle": "2.8.4. cublas<t>getrsBatched()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "BLAS-like Extension", "parentZh": "BLAS-like 扩展", "kind": "GEMM / Level-3", "kindZh": "GEMM / Level-3", "summary": "This function solves an array of systems of linear equations of the form:", "details": "This function solves an array of systems of linear equations of the form:\n\\(\\text{op}(A\\lbrack i \\rbrack) X\\lbrack i\\rbrack = B\\lbrack i\\rbrack\\)\nwhere \\(A\\lbrack i\\rbrack\\) is a matrix which has been LU factorized with pivoting, \\(X\\lbrack i\\rbrack\\) and \\(B\\lbrack i\\rbrack\\) are \\(n \\times {nrhs}\\) matrices.\nAlso, for matrix \\(A\\)\n\\(\\text{op}(A\\lbrack i\\rbrack) = \\left\\{ \\begin{matrix} {A\\lbrack i\\rbrack} & {\\text{if }\\textsf{trans == $\\mathrm{CUBLAS\\_OP\\_N}$}} \\\\ {A^{T}\\lbrack i\\rbrack} & {\\text{if }\\textsf{trans == $\\mathrm{CUBLAS\\_OP\\_T}$}} \\\\ {A^{H}\\lbrack i\\rbrack} & {\\text{if }\\textsf{trans == $\\mathrm{CUBLAS\\_OP\\_C}$}} \\\\ \\end{matrix} \\right.\\)\nThis function is intended to be used for matrices of small sizes where the launch overhead is a significant factor.\ncublas<t>getrsBatched() supports non-pivot LU factorization if devIpiv is NULL.\ncublas<t>getrsBatched() supports arbitrary dimension.", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-t-getrsbatched", "tokens": ["cublas<t>getrsBatched"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublas<t>getrsBatched()」，归在「GEMM / Level-3」。重点关注 关键词 cublas<t>getrsBatched，适合用于定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。", "detailsZh": "中文提要：这是「cublas<t>getrsBatched()」对应的官方条目，分类为「GEMM / Level-3」。\n阅读重点：定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。\n相关 API / 关键词：cublas<t>getrsBatched。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublas<t>getriBatched()", "titleZh": "cublas<t>getriBatched()", "numberedTitle": "2.8.5. cublas<t>getriBatched()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "BLAS-like Extension", "parentZh": "BLAS-like 扩展", "kind": "GEMM / Level-3", "kindZh": "GEMM / Level-3", "summary": "Aarray and Carray are arrays of pointers to matrices stored in column-major format with dimensions n*n and leading dimension lda and ldc respectively.", "details": "Aarray and Carray are arrays of pointers to matrices stored in column-major format with dimensions n*n and leading dimension lda and ldc respectively.\nThis function performs the inversion of matrices A[i] for i = 0, …, batchSize-1 .\nPrior to calling cublas<t>getriBatched, the matrix A[i] must be factorized first using the routine cublas<t>getrfBatched.\nAfter the call of cublas<t>getrfBatched, the matrix pointing by Aarray[i] will contain the LU factors of the matrix A[i] and the vector pointing by (PivotArray+i) will contain the pivoting sequence.\nFollowing the LU factorization, cublas<t>getriBatched uses forward and backward triangular solvers to complete inversion of matrices A[i] for i = 0, …, batchSize-1 .\nThe inversion is out-of-place, so memory space of Carray[i] cannot overlap memory space of Array[i].\nTypically all parameters in cublas<t>getrfBatched would be passed into cublas<t>getriBatched.\nFor example,", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-t-getribatched", "tokens": ["cublas<t>getriBatched", "cublas<t>getrfBatched"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublas<t>getriBatched()」，归在「GEMM / Level-3」。重点关注 关键词 cublas<t>getriBatched、cublas<t>getrfBatched，适合用于定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。", "detailsZh": "中文提要：这是「cublas<t>getriBatched()」对应的官方条目，分类为「GEMM / Level-3」。\n阅读重点：定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。\n相关 API / 关键词：cublas<t>getriBatched、cublas<t>getrfBatched。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublas<t>matinvBatched()", "titleZh": "cublas<t>matinvBatched()", "numberedTitle": "2.8.6. cublas<t>matinvBatched()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "BLAS-like Extension", "parentZh": "BLAS-like 扩展", "kind": "GEMM / Level-3", "kindZh": "GEMM / Level-3", "summary": "A and Ainv are arrays of pointers to matrices stored in column-major format with dimensions n*n and leading dimension lda and lda_inv respectively.", "details": "A and Ainv are arrays of pointers to matrices stored in column-major format with dimensions n*n and leading dimension lda and lda_inv respectively.\nThis function performs the inversion of matrices A[i] for i = 0, …, batchSize-1 .\nThis function is a short cut of cublas<t>getrfBatched() plus cublas<t>getriBatched() .\nHowever it doesn’t work if n is greater than 32.\nIf the matrix A[i] is singular, then info[i] reports singularity, the same as cublas<t>getrfBatched() .\nParam. | Memory | In/out | Meaning\nhandle | input | Handle to the cuBLAS library context.\nn | input | Number of rows and columns of A[i] .", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-t-matinvbatched", "tokens": ["cublas<t>matinvBatched", "cublas<t>getrfBatched", "cublas<t>getriBatched", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublas<t>matinvBatched()」，归在「GEMM / Level-3」。重点关注 关键词 cublas<t>matinvBatched、cublas<t>getrfBatched、cublas<t>getriBatched、cuBLAS，适合用于定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。", "detailsZh": "中文提要：这是「cublas<t>matinvBatched()」对应的官方条目，分类为「GEMM / Level-3」。\n阅读重点：定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。\n相关 API / 关键词：cublas<t>matinvBatched、cublas<t>getrfBatched、cublas<t>getriBatched、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublas<t>geqrfBatched()", "titleZh": "cublas<t>geqrfBatched()", "numberedTitle": "2.8.7. cublas<t>geqrfBatched()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "BLAS-like Extension", "parentZh": "BLAS-like 扩展", "kind": "GEMM / Level-3", "kindZh": "GEMM / Level-3", "summary": "Aarray is an array of pointers to matrices stored in column-major format with dimensions m x n and leading dimension lda . TauArray is an array of pointers to vectors of dimension of at least max (1, min(m, n) .", "details": "Aarray is an array of pointers to matrices stored in column-major format with dimensions m x n and leading dimension lda .\nTauArray is an array of pointers to vectors of dimension of at least max (1, min(m, n) .\nThis function performs the QR factorization of each Aarray[i] for i = 0, ...,batchSize-1 using Householder reflections.\nEach matrix Q[i] is represented as a product of elementary reflectors and is stored in the lower part of each Aarray[i] as follows :\nEach H[j][i] has the form\nwhere tau[j] is a real scalar, and v is a real vector with v(1:i-1) = 0 and v(i) = 1 ; v(i+1:m) is stored on exit in Aarray[j][i+1:m,i] , and tau in TauArray[j][i] .\nThis function is intended to be used for matrices of small sizes where the launch overhead is a significant factor.\ncublas<t>geqrfBatched supports arbitrary dimension.", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-t-geqrfbatched", "tokens": ["cublas<t>geqrfBatched"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublas<t>geqrfBatched()」，归在「GEMM / Level-3」。重点关注 关键词 cublas<t>geqrfBatched，适合用于定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。", "detailsZh": "中文提要：这是「cublas<t>geqrfBatched()」对应的官方条目，分类为「GEMM / Level-3」。\n阅读重点：定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。\n相关 API / 关键词：cublas<t>geqrfBatched。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublas<t>gelsBatched()", "titleZh": "cublas<t>gelsBatched()", "numberedTitle": "2.8.8. cublas<t>gelsBatched()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "BLAS-like Extension", "parentZh": "BLAS-like 扩展", "kind": "GEMM / Level-3", "kindZh": "GEMM / Level-3", "summary": "Aarray is an array of pointers to matrices stored in column-major format. Carray is an array of pointers to matrices stored in column-major format.", "details": "Aarray is an array of pointers to matrices stored in column-major format.\nCarray is an array of pointers to matrices stored in column-major format.\nThis function find the least squares solution of a batch of overdetermined systems: it solves the least squares problem described as follows :\nOn exit, each Aarray[i] is overwritten with their QR factorization and each Carray[i] is overwritten with the least square solution\ncublas<t>gelsBatched supports only the non-transpose operation and only solves over-determined systems (m >= n).\ncublas<t>gelsBatched only supports compute capability 2.0 or above.\nThis function is intended to be used for matrices of small sizes where the launch overhead is a significant factor.\nParam. | Memory | In/out | Meaning", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-t-gelsbatched", "tokens": ["cublas<t>gelsBatched"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublas<t>gelsBatched()」，归在「GEMM / Level-3」。重点关注 关键词 cublas<t>gelsBatched，适合用于定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。", "detailsZh": "中文提要：这是「cublas<t>gelsBatched()」对应的官方条目，分类为「GEMM / Level-3」。\n阅读重点：定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。\n相关 API / 关键词：cublas<t>gelsBatched。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublas<t>tpttr()", "titleZh": "cublas<t>tpttr()", "numberedTitle": "2.8.9. cublas<t>tpttr()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "BLAS-like Extension", "parentZh": "BLAS-like 扩展", "kind": "GEMM / Level-3", "kindZh": "GEMM / Level-3", "summary": "This function performs the conversion from the triangular packed format to the triangular format", "details": "This function performs the conversion from the triangular packed format to the triangular format\nIf uplo == CUBLAS_FILL_MODE_LOWER then the elements of AP are copied into the lower triangular part of the triangular matrix A and the upper part of A is left untouched.\nIf uplo == CUBLAS_FILL_MODE_UPPER then the elements of AP are copied into the upper triangular part of the triangular matrix A and the lower part of A is left untouched.\nParam. | Memory | In/out | Meaning\nhandle | input | Handle to the cuBLAS library context.\nuplo | input | Indicates if matrix AP contains lower or upper part of matrix A .\nn | input | Number of rows and columns of matrix A .\nAP | device | input | < type > array with \\(A\\) stored in packed format.", "source" \mathrm{CUBLAS\\_OP\\_T}$}} \\\\ A^{H} & {\\text{if }\\textsf{transa == $\\mathrm{CUBLAS\\_OP\\_C}$}} \\\\ \\end{matrix} \\right.\\)\nand \\(\\text{op}(B\\lbrack i\\rbrack)\\) is defined similarly for matrix \\(B\\lbrack i\\rbrack\\) .", "source": "https://docs.nvidia.com/cuda/cublas/#cublasgemmstridedbatchedex", "tokens": ["cublasGemmStridedBatchedEx", "cublas<t>gemmStridedBatched"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasGemmStridedBatchedEx()」，归在「GEMM / Level-3」。重点关注 关键词 cublasGemmStridedBatchedEx、cublas<t>gemmStridedBatched，适合用于定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。", "detailsZh": "中文提要：这是「cublasGemmStridedBatchedEx()」对应的官方条目，分类为「GEMM / Level-3」。\n阅读重点：定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。\n相关 API / 关键词：cublasGemmStridedBatchedEx、cublas<t>gemmStridedBatched。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasGemmGroupedBatchedEx()", "titleZh": "cublasGemmGroupedBatchedEx()", "numberedTitle": "2.8.15. cublasGemmGroupedBatchedEx()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "BLAS-like Extension", "parentZh": "BLAS-like 扩展", "kind": "GEMM / Level-3", "kindZh": "GEMM / Level-3", "summary": "This function supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function performs the matrix-matrix multiplication on groups of matrices.\nA given group is considered to be “uniform”, i.e. all instances have the same dimensions (m, n, k), leading dimensions (lda, ldb, ldc) and transpositions (transa, transb) for their respective A, B and C matrices.\nwhere \\(\\text{$\\mathrm{alpha\\_array}$}\\) and \\(\\text{$\\mathrm{beta\\_array}$}\\) are arrays of scaling factors, and \\(\\text{Aarray}\\) , \\(\\text{Barray}\\) and \\(\\text{Carray}\\) are arrays of pointers to matrices stored in column-major format.\nFor a given index, \\(\\text{idx}\\) , that is part of group \\(i\\) , the dimensions are:\nFor matrix \\(A[\\text{idx}]\\) in group \\(i\\)\n\\(\\text{op}(A[\\text{idx}]) = \\l r": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "BLAS-like Extension", "parentZh": "BLAS-like 扩展", "kind": "GEMM / Level-3", "kindZh": "GEMM / Level-3", "summary": "This function supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function is an API generalization of the routine cublas<t>nrm2() where input data, output data and compute type can be specified independently.\nThis function computes the Euclidean norm of the vector x .\nThe code uses a multiphase model of accumulation to avoid intermediate underflow and overflow, with the result being equivalent to \\(\\sqrt{\\sum_{i = 1}^{n}\\left( {\\mathbf{x}\\lbrack j\\rbrack \\times \\mathbf{x}\\lbrack j\\rbrack} \\right)}\\) where \\(j = 1 + \\left( {i - 1} \\right)*\\text{incx}\\) in exact arithmetic.\nParam. | Memory | In/out | Meaning\nhandle | input | Handle to the cuBLAS library context.\nn | input | Number of elements in the vector x .\nx | device | input | < type > vector with n elements.", "source": "https://docs.nvidia.com/cuda/cublas/#cublasnrm2ex", "tokens": ["cublasNrm2Ex", "cublas<t>nrm2", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasNrm2Ex()」，归在「GEMM / Level-3」。重点关注 关键词 cublasNrm2Ex、cublas<t>nrm2、cuBLAS，适合用于定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。", "detailsZh": "中文提要：这是「cublasNrm2Ex()」对应的官方条目，分类为「GEMM / Level-3」。\n阅读重点：定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。\n相关 API / 关键词：cublasNrm2Ex、cublas<t>nrm2、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasAxpyEx()", "titleZh": "cublasAxpyEx()", "numberedTitle": "2.8.21. cublasAxpyEx()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "BLAS-like Extension", "parentZh": "BLAS-like 扩展", "kind": "GEMM / Level-3", "kindZh": "GEMM / Level-3", "summary": "This function supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function is an API generalization of the routine cublas<t>axpy() where input data, output data and compute type can be specified independently.\nThis function multiplies the vector x by the scalar \\(\\alpha\\) and adds it to the vector y overwriting the latest vector with the result.\nHence, the performed operation is \\(\\mathbf{y}\\lbrack j\\rbrack = \\alpha \\times \\mathbf{x}\\lbrack k\\rbrack + \\mathbf{y}\\lbrack j\\rbrack\\) for \\(i = 1,\\ldots,n\\) , \\(k = 1 + \\left( {i - 1} \\right)*\\text{incx}\\) and \\(j = 1 + \\left( {i - 1} \\right)*\\text{incy}\\) .\nParam. | Memory | In/out | Meaning\nhandle | input | Handle to the cuBLAS library context.\nn | input | Number of elements in the vector x and y .\nalpha | host or device | input | < type > scalar used for multiplication.", "source": "https://docs.nvidia.com/cuda/cublas/#cublasaxpyex", "tokens": ["cublasAxpyEx", "cublas<t>axpy", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasAxpyEx()」，归在「GEMM / Level-3」。重点关注 关键词 cublasAxpyEx、cublas<t>axpy、cuBLAS，适合用于定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。", "detailsZh": "中文提要：这是「cublasAxpyEx()」对应的官方条目，分类为「GEMM / Level-3」。\n阅读重点：定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。\n相关 API / 关键词：cublasAxpyEx、cublas<t>axpy、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasDotEx()", "titleZh": "cublasDotEx()", "numberedTitle": "2.8.22. cublasDotEx()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "BLAS-like Extension", "parentZh": "BLAS-like 扩展", "kind": "GEMM / Level-3", "kindZh": "GEMM / Level-3", "summary": "These functions support the 64-bit Integer Interface .", "details": "These functions support the 64-bit Integer Interface .\nThese functions are an API generalization of the routines cublas<t>dot() and cublas<t>dotc() where input data, output data and compute type can be specified independently.\nNote: cublas<t>dotc() is dot product conjugated, cublas<t>dotu() is dot product unconjugated.\nThis function computes the dot product of vectors x and y .\nHence, the result is \\(\\sum_{i = 1}^{n}\\left( {\\mathbf{x}\\lbrack k\\rbrack \\times \\mathbf{y}\\lbrack j\\rbrack} \\right)\\) where \\(k = 1 + \\left( {i - 1} \\right)*\\text{incx}\\) and \\(j = 1 + \\left( {i - 1} \\right)*\\text{incy}\\) .\nParam. | Memory | In/out | Meaning\nhandle | input | Handle to the cuBLAS library context.\nn | input | Number of elements in the vectors x and y .", "source": "https://docs.nvidia.com/cuda/cublas/#cublasdotex", "tokens": ["cublasDotEx", "cublas<t>dot", "cublas<t>dotc", "cublas<t>dotu", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasDotEx()」，归在「GEMM / Level-3」。重点关注 关键词 cublasDotEx、cublas<t>dot、cublas<t>dotc、cublas<t>dotu、cuBLAS，适合用于定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。", "detailsZh": "中文提要：这是「cublasDotEx()」对应的官方条目，分类为「GEMM / Level-3」。\n阅读重点：定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。\n相关 API / 关键词：cublasDotEx、cublas<t>dot、cublas<t>dotc、cublas<t>dotu、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasRotEx()", "titleZh": "cublasRotEx()", "numberedTitle": "2.8.23. cublasRotEx()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "BLAS-like Extension", "parentZh": "BLAS-like 扩展", "kind": "GEMM / Level-3", "kindZh": "GEMM / Level-3", "summary": "This function supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function is an extension to the routine cublas<t>rot() where input data, output data, cosine/sine type, and compute type can be specified independently.\nThis function applies Givens rotation matrix (i.e., rotation in the x,y plane counter-clockwise by angle defined by \\(cos(alpha) = c\\) , \\(sin(alpha) = s\\) ):\n\\(G = \\begin{pmatrix} c & s \\\\ {- s} & c \\\\ \\end{pmatrix}\\)\nto vectors x and y .\nHence, the result is \\(\\mathbf{x}\\lbrack k\\rbrack = c \\times \\mathbf{x}\\lbrack k\\rbrack + s \\times \\mathbf{y}\\lbrack j\\rbrack\\) and \\(\\mathbf{y}\\lbrack j\\rbrack = - s \\times \\mathbf{x}\\lbrack k\\rbrack + c \\times \\mathbf{y}\\lbrack j\\rbrack\\) where \\(k = 1 + \\left( {i - 1} \\right)*\\text{incx}\\) and \\(j = 1 + \\left( {i - 1} \\right)*\\text{incy}\\) .\nNotice that the last two equations reflect 1-based indexing used for compatibility with Fortran.\nParam. | Memory | In/out | Meaning", "source": "https://docs.nvidia.com/cuda/cublas/#cublasrotex", "tokens": ["cublasRotEx", "cublas<t>rot"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasRotEx()」，归在「GEMM / Level-3」。重点关注 关键词 cublasRotEx、cublas<t>rot，适合用于定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。", "detailsZh": "中文提要：这是「cublasRotEx()」对应的官方条目，分类为「GEMM / Level-3」。\n阅读重点：定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。\n相关 API / 关键词：cublasRotEx、cublas<t>rot。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasScalEx()", "titleZh": "cublasScalEx()", "numberedTitle": "2.8.24. cublasScalEx()", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "BLAS-like Extension", "parentZh": "BLAS-like 扩展", "kind": "GEMM / Level-3", "kindZh": "GEMM / Level-3", "summary": "This function supports the 64-bit Integer Interface .", "details": "This function supports the 64-bit Integer Interface .\nThis function scales the vector x by the scalar \\(\\alpha\\) and overwrites it with the result.\nHence, the performed operation is \\(\\mathbf{x}\\lbrack j\\rbrack = \\alpha \\times \\mathbf{x}\\lbrack j\\rbrack\\) for \\(i = 1,\\ldots,n\\) and \\(j = 1 + \\left( {i - 1} \\right)*\\text{incx}\\) .\nParam. | Memory | In/out | Meaning\nhandle | input | Handle to the cuBLAS library context.\nn | input | Number of elements in the vector x .\nalpha | host or device | input | < type > scalar used for multiplication.\nalphaType | input | Enumerant specifying the datatype of scalar alpha .", "source": "https://docs.nvidia.com/cuda/cublas/#cublasscalex", "tokens": ["cublasScalEx", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasScalEx()」，归在「GEMM / Level-3」。重点关注 关键词 cublasScalEx、cuBLAS，适合用于定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。", "detailsZh": "中文提要：这是「cublasScalEx()」对应的官方条目，分类为「GEMM / Level-3」。\n阅读重点：定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。\n相关 API / 关键词：cublasScalEx、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Using the cuBLASLt API", "titleZh": "使用 cuBLASLt API", "numberedTitle": "3. Using the cuBLASLt API", "level": "H1", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "cuBLAS 文档章节：Using the cuBLASLt API", "details": "", "source": "https://docs.nvidia.com/cuda/cublas/#using-the-cublaslt-api", "tokens": ["cuBLASLt", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「使用 cuBLASLt API」，归在「指南章节」。重点关注 关键词 cuBLASLt、cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「使用 cuBLASLt API」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLASLt、cuBLAS。"}, {"title": "General Description", "titleZh": "总体说明", "numberedTitle": "3.1. General Description", "level": "H2", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "The cuBLASLt library is a new lightweight library dedicated to GEneral Matrix-to-matrix Multiply (GEMM) operations with a new flexible API. This new library adds flexibility in matrix data layouts, input types, compute types, and also in choosing the algorithmic...", "details": "The cuBLASLt library is a new lightweight library dedicated to GEneral Matrix-to-matrix Multiply (GEMM) operations with a new flexible API.\nThis new library adds flexibility in matrix data layouts, input types, compute types, and also in choosing the algorithmic implementations and heuristics through parameter programmability.\nOnce a set of options for the intended GEMM operation are identified by the user, these options can be used repeatedly for different inputs.\nThis is analogous to how cuFFT and FFTW first create a plan and reuse for same size and type FFTs with different input data.", "source": "https://docs.nvidia.com/cuda/cublas/#id16", "tokens": ["cuBLASLt", "cuFFT"], "summaryZh": "本条整理 cuBLAS 官方文档中的「总体说明」，归在「指南章节」。重点关注 关键词 cuBLASLt、cuFFT，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「总体说明」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLASLt、cuFFT。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Problem Size Limitations", "titleZh": "问题规模限制", "numberedTitle": "3.1.1. Problem Size Limitations", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "General Description", "parentZh": "总体说明", "kind": "Guide", "kindZh": "指南章节", "summary": "There are inherent problem size limitations that are a result of limitations in CUDA grid dimensions. For example, many kernels do not support batch sizes greater than 65535 due to a limitation on the z dimension of a grid. There are similar restriction on the m and n...", "details": "There are inherent problem size limitations that are a result of limitations in CUDA grid dimensions.\nFor example, many kernels do not support batch sizes greater than 65535 due to a limitation on the z dimension of a grid.\nIn cases where a problem cannot be run by a single kernel, cuBLASLt will attempt to decompose the problem into multiple sub-problems and solve it by running the kernel on each sub-problem.\nTo overcome these limitations, a user may want to partition the problem themself, launch kernels for each sub-problem, and compute any necessary reductions to combine the results.", "source": "https://docs.nvidia.com/cuda/cublas/#problem-size-limitations", "tokens": ["cuBLASLt"], "summaryZh": "本条整理 cuBLAS 官方文档中的「问题规模限制」，归在「指南章节」。重点关注 关键词 cuBLASLt，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「问题规模限制」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLASLt。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Heuristics Cache", "titleZh": "Heuristics Cache", "numberedTitle": "3.1.2. Heuristics Cache", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "General Description", "parentZh": "总体说明", "kind": "cuBLASLt / Matmul", "kindZh": "cuBLASLt / Matmul", "summary": "cuBLASLt uses heuristics to pick the most suitable matmul kernel for execution based on the problem sizes, GPU configuration, and other parameters. This requires performing some computations on the host CPU, which could take tens of microseconds. To overcome this...", "details": "cuBLASLt uses heuristics to pick the most suitable matmul kernel for execution based on the problem sizes, GPU configuration, and other parameters.\nThis requires performing some computations on the host CPU, which could take tens of microseconds.\nFor the cases where querying heuristics once and then reusing them is not feasible, cuBLASLt implements a heuristics cache that maps matmul problems to kernels previously selected by heuristics.\nThe heuristics cache uses an LRU-like eviction policy and is thread-safe.\nThe user can control the heuristics cache capacity with the CUBLASLT_HEURISTICS_CACHE_CAPACITY environment variable or with the cublasLtHeuristicsCacheSetCapacity() function which has higher precedence.\nThe capacity is measured in number of entries and might be rounded up to the nearest multiple of some factor for performance reasons.\nSee also: cublasLtHeuristicsCacheGetCapacity() , cublasLtHeuristicsCacheSetCapacity() .", "source": "https://docs.nvidia.com/cuda/cublas/#heuristics-cache", "tokens": ["cuBLASLt", "CUBLASLT_HEURISTICS_CACHE_CAPACITY", "cublasLtHeuristicsCacheSetCapacity", "cublasLtHeuristicsCacheGetCapacity"], "summaryZh": "本条整理 cuBLAS 官方文档中的「Heuristics Cache」，归在「cuBLASLt / Matmul」。重点关注 关键词 cuBLASLt、CUBLASLT_HEURISTICS_CACHE_CAPACITY、cublasLtHeuristicsCacheSetCapacity、cublasLtHeuristicsCacheGetCapacity，适合用于梳理 Lt Matmul、heuristics、preference 和 workspace 调优。", "detailsZh": "中文提要：这是「Heuristics Cache」对应的官方条目，分类为「cuBLASLt / Matmul」。\n阅读重点：梳理 Lt Matmul、heuristics、preference 和 workspace 调优。\n相关 API / 关键词：cuBLASLt、CUBLASLT_HEURISTICS_CACHE_CAPACITY、cublasLtHeuristicsCacheSetCapacity、cublasLtHeuristicsCacheGetCapacity。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cuBLASLt Logging", "titleZh": "cuBLASLt Logging", "numberedTitle": "3.1.3. cuBLASLt Logging", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "General Description", "parentZh": "总体说明", "kind": "Logging / Debug", "kindZh": "日志 / 调试", "summary": "cuBLASLt logging mechanism can be enabled by setting the following environment variables before launching the target application:", "details": "cuBLASLt logging mechanism can be enabled by setting the following environment variables before launching the target application:\nCUBLASLT_LOG_LEVEL=<level> where <level> is one of the following levels: 0 - Off - logging is disabled (default) 1 - Error - only errors will be logged 2 - Trace - API calls that launch CUDA kernels will log their parameters and important information 3 - Hints - hints that can potentially improve the application’s performance 4 - Info - provides general information about the library execution, may contain details about heuristic status 5 - API Trace - API calls will log their parameter and important information\nCUBLASLT_LOG_MASK=<mask> , where <mask> is a combination of the following flags: 0 - Off 1 - Error 2 - Trace 4 - Hints 8 - Info 16 - API Trace For example, use CUBLASLT_LOG_MASK=5 to enable Error and Hints messages.\nCUBLASLT_LOG_FILE=<file_name> , where <file_name> is a path to a logging file. The file name may contain %i , which will be replaced with the process ID. For example file_name_%i.log .\nIf CUBLASLT_LOG_FILE is not set, the log messages are printed to stdout.\nAnother option is to use the experimental cuBLASLt logging API.\nSee:\ncublasLtLoggerSetCallback() , cublasLtLoggerSetFile() , cublasLtLoggerOpenFile() , cublasLtLoggerSetLevel() , cublasLtLoggerSetMask() , cublasLtLoggerForceDisable()", "source": "https://docs.nvidia.com/cuda/cublas/#cublaslt-logging", "tokens": ["cuBLASLt", "CUBLASLT_LOG_LEVEL", "CUBLASLT_LOG_MASK", "CUBLASLT_LOG_FILE", "%i", "log", "cublasLtLoggerSetCallback", "cublasLtLoggerSetFile", "cublasLtLoggerOpenFile", "cublasLtLoggerSetLevel", "cublasLtLoggerSetMask", "cublasLtLoggerForceDisable"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cuBLASLt Logging」，归在「日志 / 调试」。重点关注 关键词 cuBLASLt、CUBLASLT_LOG_LEVEL、CUBLASLT_LOG_MASK、CUBLASLT_LOG_FILE、%i，适合用于打开日志、定位状态码和调试运行时问题。", "detailsZh": "中文提要：这是「cuBLASLt Logging」对应的官方条目，分类为「日志 / 调试」。\n阅读重点：打开日志、定位状态码和调试运行时问题。\n相关 API / 关键词：cuBLASLt、CUBLASLT_LOG_LEVEL、CUBLASLT_LOG_MASK、CUBLASLT_LOG_FILE、%i、log、cublasLtLoggerSetCallback、cublasLtLoggerSetFile。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Narrow Precision Data Types Usage", "titleZh": "窄精度数据类型用法", "numberedTitle": "3.1.4. Narrow Precision Data Types Usage", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "General Description", "parentZh": "总体说明", "kind": "Precision / Tensor Core", "kindZh": "精度 / Tensor Core", "summary": "What we call here narrow precision data types were first introduced as 8-bit floating point data types (FP8) with Ada and Hopper GPUs (compute capability 8.9 and above), and were designed to further accelerate matrix multiplications. There are two types of FP8...", "details": "What we call here narrow precision data types were first introduced as 8-bit floating point data types (FP8) with Ada and Hopper GPUs (compute capability 8.9 and above), and were designed to further accelerate matrix multiplications.\nThere are two types of FP8 available:\nCUDA_R_8F_E4M3 is designed to be accurate at a smaller dynamic range than half precision. The E4 and M3 indicate a 4-bit exponent and a 3-bit mantissa respectively. For more details, see __nv__fp8_e4m3 .\nCUDA_R_8F_E5M2 is designed to be accurate at a similar dynamic range as half precision. The E5 and M2 indicate a 5-bit exponent and a 2-bit mantissa respectively. For more information see __nv__fp8_e5m2 .\nWith the Blackwell GPUs (compute capability 10.0 and above), cuBLAS adds support for 4-bit floating data type (FP4) CUDA_R_4F_E2M1 .\nThe E2 and M1 indicate a 2-bit exponent and a 1-bit mantissa respectively.\nIn order to maintain accuracy, data in narrow precisions needs to be scaled or dequantized before and potentially quantized after computations. cuBLAS provides several modes how the scaling factors are applied, defined in cublasLtMatmulMatrixScale_t and configured via the CUBLASLT_MATMUL_DESC_{X}_SCALE_MODE attributes (here X stands for A , B , C , D , D_OUT , or EPILOGUE_AUX ; see cublasLtMatmulDescAttributes_t ).\nThe scaling modes overview is given in the next table, and more details are available in the subsequent sections.", "source": "https://docs.nvidia.com/cuda/cublas/#narrow-precision-data-types-usage", "tokens": ["CUDA_R_8F_E4M3", "CUDA_R_8F_E5M2", "cuBLAS", "CUDA_R_4F_E2M1", "cublasLtMatmulMatrixScale_t", "CUBLASLT_MATMUL_DESC_", "cublasLtMatmulDescAttributes_t"], "summaryZh": "本条整理 cuBLAS 官方文档中的「窄精度数据类型用法」，归在「精度 / Tensor Core」。重点关注 关键词 CUDA_R_8F_E4M3、CUDA_R_8F_E5M2、cuBLAS、CUDA_R_4F_E2M1、cublasLtMatmulMatrixScale_t，适合用于理解 Tensor Core、数据类型、math mode 和精度/性能取舍。", "detailsZh": "中文提要：这是「窄精度数据类型用法」对应的官方条目，分类为「精度 / Tensor Core」。\n阅读重点：理解 Tensor Core、数据类型、math mode 和精度/性能取舍。\n相关 API / 关键词：CUDA_R_8F_E4M3、CUDA_R_8F_E5M2、cuBLAS、CUDA_R_4F_E2M1、cublasLtMatmulMatrixScale_t、CUBLASLT_MATMUL_DESC_、cublasLtMatmulDescAttributes_t。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Tensorwide Scaling For FP8 Data Types", "titleZh": "Tensorwide Scaling For FP8 Data Types", "numberedTitle": "3.1.4.1. Tensorwide Scaling For FP8 Data Types", "level": "H4", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "Narrow Precision Data Types Usage", "parentZh": "窄精度数据类型用法", "kind": "Precision / Tensor Core", "kindZh": "精度 / Tensor Core", "summary": "Tensorwide scaling is enabled when CUBLASLT_MATMUL_DESC_{X}_SCALE_MODE attributes (here X stands for A , B , C , D , or EPILOGUE_AUX ; see cublasLtMatmulDescAttributes_t ) for all FP8-precision tensors are set to CUBLASLT_MATMUL_MATRIX_SCALE_SCALAR_32F (this is the...", "details": "Tensorwide scaling is enabled when CUBLASLT_MATMUL_DESC_{X}_SCALE_MODE attributes (here X stands for A , B , C , D , or EPILOGUE_AUX ; see cublasLtMatmulDescAttributes_t ) for all FP8-precision tensors are set to CUBLASLT_MATMUL_MATRIX_SCALE_SCALAR_32F (this is the default value for FP8 tensors).\nIn such case, the matmul operation in cuBLAS is defined in the following way (assuming, for exposition, that all tensors are using an FP8 precision):\nHere \\(A\\) , \\(B\\) , and \\(C\\) are input tensors, and \\(scale_A\\) , \\(scale_B\\) , \\(scale_C\\) , \\(scale_D\\) , \\(\\alpha\\) , and \\(\\beta\\) are input scalars.\nThis differs from the other matrix multiplication routines because of this addition of scaling factors for each matrix.\nFor such matrix multiplications, epilogues and the absolute maximums of intermediate values are computed as follows:\nHere \\(Aux\\) is an auxiliary output of matmul consisting of the values that are passed to an epilogue function like GELU, \\(scale_{Aux}\\) is an optional scaling factor that can be applied to \\(Aux\\) , and \\(amax_{Aux}\\) is the maximum absolute value in \\(Aux\\) before scaling.\nFor more information, see attributes CUBLASLT_MATMUL_DESC_AMAX_D_POINTER and CUBLASLT_MATMUL_DESC_EPILOGUE_AUX_AMAX_POINTER in cublasLtMatmulDescAttributes_t .", "source": "https://docs.nvidia.com/cuda/cublas/#tensorwide-scaling-for-fp8-data-types", "tokens": ["CUBLASLT_MATMUL_DESC_", "cublasLtMatmulDescAttributes_t", "CUBLASLT_MATMUL_MATRIX_SCALE_SCALAR_32F", "cuBLAS", "CUBLASLT_MATMUL_DESC_AMAX_D_POINTER", "CUBLASLT_MATMUL_DESC_EPILOGUE_AUX_AMAX_POINTER"], "summaryZh": "本条整理 cuBLAS 官方文档中的「Tensorwide Scaling For FP8 Data Types」，归在「精度 / Tensor Core」。重点关注 关键词 CUBLASLT_MATMUL_DESC_、cublasLtMatmulDescAttributes_t、CUBLASLT_MATMUL_MATRIX_SCALE_SCALAR_32F、cuBLAS、CUBLASLT_MATMUL_DESC_AMAX_D_POINTER，适合用于理解 Tensor Core、数据类型、math mode 和精度/性能取舍。", "detailsZh": "中文提要：这是「Tensorwide Scaling For FP8 Data Types」对应的官方条目，分类为「精度 / Tensor Core」。\n阅读重点：理解 Tensor Core、数据类型、math mode 和精度/性能取舍。\n相关 API / 关键词：CUBLASLT_MATMUL_DESC_、cublasLtMatmulDescAttributes_t、CUBLASLT_MATMUL_MATRIX_SCALE_SCALAR_32F、cuBLAS、CUBLASLT_MATMUL_DESC_AMAX_D_POINTER、CUBLASLT_MATMUL_DESC_EPILOGUE_AUX_AMAX_POINTER。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Experimental: Per-batch Tensorwide Scaling For FP8 Data Types", "titleZh": "Experimental: Per-batch Tensorwide Scaling For FP8 Data Types", "numberedTitle": "3.1.4.2. Experimental: Per-batch Tensorwide Scaling For FP8 Data Types", "level": "H4", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "Narrow Precision Data Types Usage", "parentZh": "窄精度数据类型用法", "kind": "Precision / Tensor Core", "kindZh": "精度 / Tensor Core", "summary": "Per-batch Tensorwide scaling is enabled when CUBLASLT_MATMUL_DESC_{X}_SCALE_MODE attributes (here X stands for A , B , C , D , or EPILOGUE_AUX ; see cublasLtMatmulDescAttributes_t ) for all FP8-precision tensors are set to...", "details": "Per-batch Tensorwide scaling is enabled when CUBLASLT_MATMUL_DESC_{X}_SCALE_MODE attributes (here X stands for A , B , C , D , or EPILOGUE_AUX ; see cublasLtMatmulDescAttributes_t ) for all FP8-precision tensors are set to CUBLASLT_MATMUL_MATRIX_SCALE_PER_BATCH_SCALAR_32F .\nPer-batch Tensorwide scaling is a variant of tensorwide scaling except that each matrix in the batch has its own scaling factor.\nWhen using per-batch Tensorwide scaling, the \\(scale_A\\) , \\(scale_B\\) , \\(scale_C\\) , \\(scale_D\\) , and \\(scale_{Aux}\\) must be device arrays of pointers of length CUBLASLT_MATRIX_LAYOUT_BATCH_COUNT .", "source": "https://docs.nvidia.com/cuda/cublas/#experimental-per-batch-tensorwide-scaling-for-fp8-data-types", "tokens": ["CUBLASLT_MATMUL_DESC_", "cublasLtMatmulDescAttributes_t", "CUBLASLT_MATMUL_MATRIX_SCALE_PER_BATCH_SCALAR_32F", "CUBLASLT_MATRIX_LAYOUT_BATCH_COUNT"], "summaryZh": "本条整理 cuBLAS
