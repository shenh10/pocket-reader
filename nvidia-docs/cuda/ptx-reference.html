ons on shared memory preserve subnormal inputs and results and don’t flush them to zero.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-4-2", "tokens": ["sm_53", "f16", "f16x2", "ld.param", "st.param", "add.f32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 4.2 变更记录」，归在「指南章节」。重点关注 关键词 sm_53、f16、f16x2、ld.param、st.param，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 4.2 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：sm_53、f16、f16x2、ld.param、st.param、add.f32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 4.1", "titleZh": "PTX ISA 4.1 变更记录", "numberedTitle": "13.32. Changes in PTX ISA Version 4.1", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 4.1 introduces the following new features:\nSupport for sm_37 and sm_52 target architectures.\nSupport for new fields array_size , num_mipmap_levels and num_samples for Textures, and the txq instruction support for querying these fields.\nSupport for new field array_size for Surfaces, and the suq instruction support for querying this field.\nSupport for special registers %total_smem_size and %dynamic_smem_size .\nSemantic Changes and Clarifications\nNone.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-4-1", "tokens": ["sm_37", "sm_52", "%total_smem_size", "%dynamic_smem_size"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 4.1 变更记录」，归在「指南章节」。重点关注 关键词 sm_37、sm_52、%total_smem_size、%dynamic_smem_size，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 4.1 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：sm_37、sm_52、%total_smem_size、%dynamic_smem_size。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 4.0", "titleZh": "PTX ISA 4.0 变更记录", "numberedTitle": "13.33. Changes in PTX ISA Version 4.0", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 4.0 introduces the following new features:\nSupport for sm_32 and sm_50 target architectures.\nSupport for 64bit performance counter special registers %pm0_64,..,%pm7_64 .\nA new istypep instruction.\nA new instruction, rsqrt.approx.ftz.f64 has been added to compute a fast approximation of the square root reciprocal of a value.\nSupport for a new directive .attribute for specifying special attributes of a variable.\nSupport for .managed variable attribute.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-4-0", "tokens": ["sm_32", "sm_50", "%pm0_64", "%pm7_64", "rsqrt.approx.ftz.f64", "attribute", "managed"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 4.0 变更记录」，归在「指南章节」。重点关注 关键词 sm_32、sm_50、%pm0_64、%pm7_64、rsqrt.approx.ftz.f64，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 4.0 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：sm_32、sm_50、%pm0_64、%pm7_64、rsqrt.approx.ftz.f64、attribute、managed。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 3.2", "titleZh": "PTX ISA 3.2 变更记录", "numberedTitle": "13.34. Changes in PTX ISA Version 3.2", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 3.2 introduces the following new features:\nThe texture instruction supports reads from multi-sample and multisample array textures.\nExtends .section debugging directive to include label + immediate expressions.\nExtends .file directive to include timestamp and file size information.\nSemantic Changes and Clarifications\nThe vavrg2 and vavrg4 instruction semantics were updated to indicate that instruction adds 1 only if Va[i] + Vb[i] is non-negative, and that the addition result is shifted by 1 (rather than being divided by 2).", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-3-2", "tokens": ["section", "file"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 3.2 变更记录」，归在「指南章节」。重点关注 关键词 section、file，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 3.2 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：section、file。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 3.1", "titleZh": "PTX ISA 3.1 变更记录", "numberedTitle": "13.35. Changes in PTX ISA Version 3.1", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 3.1 introduces the following new features:\nSupport for sm_35 target architecture.\nSupport for CUDA Dynamic Parallelism, which enables a kernel to create and synchronize new work.\nld.global.nc for loading read-only global data though the non-coherent texture cache.\nA new funnel shift instruction, shf .\nExtends atomic and reduction instructions to perform 64-bit {and, or, xor} operations, and 64-bit integer {min, max} operations.\nAdds support for mipmaps .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-3-1", "tokens": ["sm_35", "ld.global.nc"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 3.1 变更记录」，归在「指南章节」。重点关注 关键词 sm_35、ld.global.nc，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 3.1 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：sm_35、ld.global.nc。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 3.0", "titleZh": "PTX ISA 3.0 变更记录", "numberedTitle": "13.36. Changes in PTX ISA Version 3.0", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 3.0 introduces the following new features:\nSupport for sm_30 target architectures.\nSIMD video instructions.\nA new warp shuffle instruction.\nInstructions mad.cc and madc for efficient, extended-precision integer multiplication.\nSurface instructions with 3D and array geometries.\nThe texture instruction supports reads from cubemap and cubemap array textures.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-3-0", "tokens": ["sm_30", "warp", "mad.cc"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 3.0 变更记录」，归在「指南章节」。重点关注 关键词 sm_30、warp、mad.cc，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 3.0 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：sm_30、warp、mad.cc。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 2.3", "titleZh": "PTX ISA 2.3 变更记录", "numberedTitle": "13.37. Changes in PTX ISA Version 2.3", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX 2.3 adds support for texture arrays.\nThe texture array feature supports access to an array of 1D or 2D textures, where an integer indexes into the array of textures, and then one or two single-precision floating point coordinates are used to address within the selected 1D or 2D texture.\nPTX 2.3 adds a new directive, .address_size , for specifying the size of addresses.\nVariables in .const and .global state spaces are initialized to zero by default.\nSemantic Changes and Clarifications\nThe semantics of the .maxntid directive have been updated to match the current implementation.\nSpecifically, .maxntid only guarantees that the total number of threads in a thread block does not exceed the maximum.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-2-3", "tokens": ["address_size", "const", "global", "maxntid"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 2.3 变更记录」，归在「指南章节」。重点关注 关键词 address_size、const、global、maxntid，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 2.3 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：address_size、const、global、maxntid。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 2.2", "titleZh": "PTX ISA 2.2 变更记录", "numberedTitle": "13.38. Changes in PTX ISA Version 2.2", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX 2.2 adds a new directive for specifying kernel parameter attributes; specifically, there is a new directives for specifying that a kernel parameter is a pointer, for specifying to which state space the parameter points, and for optionally specifying the alignment of the memory to which the parameter points.\nPTX 2.2 adds a new field named force_unnormalized_coords to the .samplerref opaque type.\nThis field is used in the independent texturing mode to override the normalized_coords field in the texture header.\nPTX 2.2 deprecates explicit constant banks and supports a large, flat address space for the .const state space.\nLegacy PTX that uses explicit constant banks is still supported.\nPTX 2.2 adds a new tld4 instruction for loading a component ( r , g , b , or a ) from the four texels compising the bilinear interpolation footprint of a given texture location.\nThis instruction may be used to compute higher-precision bilerp results in software, or for performing higher-bandwidth texture loads.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-2-2", "tokens": ["samplerref", "const"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 2.2 变更记录」，归在「指南章节」。重点关注 关键词 samplerref、const，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 2.2 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：samplerref、const。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 2.1", "titleZh": "PTX ISA 2.1 变更记录", "numberedTitle": "13.39. Changes in PTX ISA Version 2.1", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nThe underlying, stack-based ABI is supported in PTX ISA version 2.1 for sm_2x targets.\nSupport for indirect calls has been implemented for sm_2x targets.\nNew directives, .branchtargets and .calltargets , have been added for specifying potential targets for indirect branches and indirect function calls.\nA .callprototype directive has been added for declaring the type signatures for indirect function calls.\nThe names of .global and .const variables can now be specified in variable initializers to represent their addresses.\nA set of thirty-two driver-specific execution environment special registers has been added.\nThese are named %envreg0..%envreg31 .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-2-1", "tokens": ["sm_2x", "branchtargets", "calltargets", "callprototype", "global", "const", "%envreg0", "%envreg31"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 2.1 变更记录」，归在「指南章节」。重点关注 关键词 sm_2x、branchtargets、calltargets、callprototype、global，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 2.1 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：sm_2x、branchtargets、calltargets、callprototype、global、const、%envreg0、%envreg31。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 2.0", "titleZh": "PTX ISA 2.0 变更记录", "numberedTitle": "13.40. Changes in PTX ISA Version 2.0", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nFloating Point Extensions\nThis section describes the floating-point changes in PTX ISA version 2.0 for sm_20 targets.\nThe goal is to achieve IEEE 754 compliance wherever possible, while maximizing backward compatibility with legacy PTX ISA version 1.x code and sm_1x targets.\nThe changes from PTX ISA version 1.x are as follows:\nSingle-precision instructions support subnormal numbers by default for sm_20 targets. The .ftz modifier may be used to enforce backward compatibility with sm_1x .\nSingle-precision add , sub , and mul now support .rm and .rp rounding modifiers for sm_20 targets.\nA single-precision fused multiply-add (fma) instruction has been added, with support for IEEE 754 compliant rounding modifiers and support for subnormal numbers. The fma.f32 instruction also supports .ftz and .sat modifiers. fma.f32 requires sm_20 . The mad.f32 instruction has been extended with rounding modifiers so that it’s synonymous with fma.f32 for sm_20 targets. Both fma.f32 and mad.f32 require a rounding modifier for sm_20 targets.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-2-0", "tokens": ["sm_20", "sm_1x", "ftz", "fma.f32", "sat", "mad.f32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 2.0 变更记录」，归在「指南章节」。重点关注 关键词 sm_20、sm_1x、ftz、fma.f32、sat，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 2.0 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：sm_20、sm_1x、ftz、fma.f32、sat、mad.f32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}], "stats": {"sourceTitle": "PTX ISA 速查，基于官方文档抽取并中文化整理。", "generatedAt": "2026-08-25 00:16 CST", "entryCount": 650, "kindCount": 7, "kinds": ["Guide", "Instructions", "Memory Model", "Programming Model", "Special Registers", "State / Types", "Syntax / Directives"], "kindCounts": {"Guide": 55, "Programming Model": 11, "Syntax / Directives": 54, "Instructions": 402, "State / Types": 55, "Memory Model": 39, "Special Registers": 34}, "kindLabels": {"Chapter": "章节", "Guide": "指南章节", "Instructi   <script>

    function renderCard(item) {
      const tokens = item.tokens.slice(0, 8).map(token => `<span class="token">${escapeHTML(token)}</span>`).join('');
      const displayTitle = item.titleZh || item.title;
      const originalTitle = '';
      const summaryText = item.summaryZh || item.summary;
      const detailsText = item.detailsZh || item.details || '暂无结构化摘录；请打开官方条目查看完整正文。';
      const details = codeify(detailsText);
      const kindLabel = item.kindZh || item.kind;
      const chapterLabel = item.chapterZh || item.chapter;
      const parentLabel = item.parentZh || item.parent;
      const snippet = item.snippet ? `<pre class="snippet"><code>${escapeHTML(item.snippet)}</code></pre>` : '';
      return `
        <article class="card">
          <div class="card-main">
            <div>
              <a class="card-title" href="${escapeHTML(item.source)}" target="_blank" rel="noreferrer">${escapeHTML(displayTitle)}${originalTitle}</a>
              <div class="tags">
                <span class="tag kind">${escapeHTML(kindLabel)}</span>
                <span class="tag">${escapeHTML(item.level)}</span>
                <span class="tag">${escapeHTML(chapterLabel)}</span>
                ${parentLabel ? `<span class="tag">${escapeHTML(parentLabel)}</span>` : ''}
              </div>
            </div>
            <div>
              <p class="summary">${escapeHTML(summaryText)}</p>
              <div class="tokens">${tokens}</div>
              ${snippet}
            </div>
          </div>
          <details>
            <summary>结构化摘录与官方锚点</summary>
            <div class="details">
              <div><b>摘录</b>${details}</div>
              <div><b>官方来源</b><a href="${escapeHTML(item.source)}" target="_blank" rel="noreferrer">打开官方条目</a></div>
            </div>
          </details>
        </article>
      `;
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      const filtered = entries.filter(item => {
        if (activeKind !== '全部' && item.kind !== activeKind) return false;
        if (onlySpecial.checked && !isSpecial(item)) return false;
        if (hasDetail.checked && !item.details) return false;
        return matches(item, query);
      });
      cards.innerHTML = filtered.map(renderCard).join('');
      empty.style.display = filtered.length ? 'none' : 'block';
      const activeLabel = activeKind === '全部' ? '全部' : (stats.kindLabels?.[activeKind] ?? activeKind);
      $('#result-count').textContent = `${activeLabel} · ${filtered.length} / ${entries.length}`;
    }

    function renderTopics() {
      const kinds = ['全部', ...stats.kinds];
      $('#topics').innerHTML = kinds.map(kind => {
        const pressed = kind === activeKind ? 'true' : 'false';
        const count = kind === '全部' ? entries.length : (stats.kindCounts?.[kind] ?? 0);
        const label = kind === '全部' ? '全部' : (stats.kindLabels?.[kind] ?? kind);
        return `<button class="topic" type="button" aria-pressed="${pressed}" data-kind="${escapeHTML(kind)}">${escapeHTML(label)}<span class="topic-count">${count}</span></button>`;
      }).join('');
      document.querySelectorAll('.topic').forEach(button => {
        button.addEventListener('click', () => {
          activeKind = button.dataset.kind;
          renderTopics();
          render();
          document.querySelector('.result-head')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
    }

    function renderGuide() {
      $('#guide-grid').innerHTML = groups.map(group => `
        <article class="guide-card">
          <h3>${escapeHTML(group.title)}</h3>
          <p>${escapeHTML(group.summary)}</p>
          <div class="chips">
            ${group.chips.map(chip => `<button class="chip" type="button" data-search="${escapeHTML(chip)}">${escapeHTML(chip)}</button>`).join('')}
          </div>
        </article>
      `).join('');
      document.querySelectorAll('.chip').forEach(button => {
        button.addEventListener('click', () => {
          activeKind = '全部';
          search.value = button.dataset.search;
          onlySpecial.checked = false;
          hasDetail.checked = false;
          renderTopics();
          render();
          document.querySelector('.result-head')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
          search.focus();
        });
      });
    }

    function hydrate() {
      root.style.setProperty('--accent', stats.accent);
      document.title = stats.title;
      $('#brand').textContent = `${stats.brand} · 官方文档整理`;
      $('#page-title').textContent = stats.title;
      $('#subtitle').textContent = stats.subtitle;
      $('#hero-code').textContent = stats.hero;
      $('#stat-entries').textContent = stats.entryCount;
      $('#stat-kinds').textContent = stats.kindCount;
      $('#stat-special').textContent = stats.specialCount;
      $('#stat-special-label').textContent = stats.specialLabel || '重点类条目';
      $('#stat-topkind').textContent = stats.topKinds[0]?.[1] ?? 0;
      $('#source-title').textContent = stats.sourceTitle;
      $('#source-url').href = stats.sourceUrl;
      $('#source-url').textContent = stats.sourceUrl;
      $('#generated-at').textContent = stats.generatedAt;
      $('#kind-list').innerHTML = stats.topKinds.map(([name, count]) => {
        const label = stats.kindLabels?.[name] ?? name;
        return `<div class="kind-row"><span>${escapeHTML(label)}</span><b>${count}</b></div>`;
      }).join('');
    }

    [search, onlySpecial, hasDetail].forEach(control => {
      control.addEventListener('input', render);
      control.addEventListener('change', render);
    });

    hydrate();
    renderTopics();
    renderGuide();
    render();
  </script>
</body>
</html>
