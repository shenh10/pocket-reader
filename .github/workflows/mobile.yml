name: Build Pocket Reader Mobile
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ai-infra-board/package-lock.json
            stockarena/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix ai-infra-board
          npm ci --prefix stockarena
      - name: Check content cache and routes
        run: npm run check
      - name: Bundle application UI and API client
        run: npm run mobile:sync
      - name: Build Android debug APK
        working-directory: android
        env:
          JPUSH_APP_KEY: ${{ secrets.JPUSH_APP_KEY }}
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify styles in the installed Android WebView
        env:
          JPUSH_APP_KEY: ${{ secrets.JPUSH_APP_KEY }}
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            bash scripts/test-android-webview.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-webview-checks
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            test-results/android/
      - uses: actions/upload-artifact@v7
        with:
          name: pocket-reader-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix ai-infra-board
          npm ci --prefix stockarena
      - name: Build application UI
        run: npm run build:mobile
      - name: Build website for browser checks
        run: |
          npm run build:web
          node scripts/check-bundle.mjs
          npx playwright install --with-deps chromium
      - name: Check mobile reading flows
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-browser-checks
          path: |
            playwright-report/
            test-results/
  ios:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix ai-infra-board
          npm ci --prefix stockarena
      - name: Bundle iOS application
        run: npm run mobile:sync:ios
      - name: Compile iOS simulator app
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath work/ios-build CODE_SIGNING_ALLOWED=NO build
