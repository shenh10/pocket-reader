perand cache_policy .\nThe cache eviction policy specifies how cache eviction priorities are applied to global memory addresses used in memory operations with .level::cache_hint qualifier.\nThere are two types of cache eviction policies:\nRange-based policy The cache eviction policy created using createpolicy.range specifies the cache eviction behaviors for the following three address ranges: [a .. a + (primary-size - 1)] referred to as primary range. [a + primary-size .. a + (total-size - 1)] referred to as trailing secondary range. [a - (total-size - primary-size) .. (a - 1)] referred to as preceding secondary range. When a range-based cache eviction policy is used in a memory operation with .level::cache_hint qualifier, the eviction priorities are applied as follows: If the memory address falls in the primary range, the eviction priority specified by .level::primary_priority is applied. If the memory address falls in any of the secondary ranges, the eviction priority specified by .level::secondary_priority is applied. If the memory address does not fall in either of the above ranges, then the applied eviction priority is unspecified. The 32-bit operand primary-size specifies the size, in bytes, of the primary range. The 32-bit operand total-size specifies the combined size, in bytes, of the address range including primary and secondary ranges. The value of primary-size must be less than or equal to the value of total-size . Maximum allowed value of total-size is 4GB. If .level::secondary_priority is not specified, then it defaults to .L2::evict_unchanged . If no state space is specified then Generic Addressing is used. If the specified address does not fall within the address window of .global state space then the behavior is undefined.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-createpolicy", "tokens": ["level", "createpolicy.range", "global"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：createpolicy」，归在「指令」。重点关注 关键词 level、createpolicy.range、global，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：createpolicy」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：level、createpolicy.range、global。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: isspacep", "titleZh": "数据搬移与转换指令：isspacep", "numberedTitle": "9.7.9.20. Data Movement and Conversion Instructions: isspacep", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "isspacep", "details": "isspacep\nQuery whether a generic address falls within a specified state space window.\nSyntax\nDescription\nWrite predicate register p with 1 if generic address a falls within the specified state space window and with 0 otherwise.\nDestination p has type .pred ; the source address operand must be of type .u32 or .u64 .\nisspacep.param{::entry} returns 1 if the generic address falls within the window of Kernel Function Parameters , otherwise returns 0 .\nIf .param is specified without any sub-qualifiers then it defaults to .param::entry .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-isspacep", "tokens": ["pred", "u32", "u64", "isspacep.param", "param"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：isspacep」，归在「指令」。重点关注 关键词 pred、u32、u64、isspacep.param、param，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：isspacep」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：pred、u32、u64、isspacep.param、param。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: cvta", "titleZh": "数据搬移与转换指令：cvta", "numberedTitle": "9.7.9.21. Data Movement and Conversion Instructions: cvta", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "cvta", "details": "cvta\nConvert address from .const , Kernel Function Parameters ( .param ), .global , .local , or .shared state space to generic, or vice-versa.\nTake the generic address of a variable declared in .const , Kernel Function Parameters ( .param ), .global , .local , or .shared state space.\nSyntax\nDescription\nConvert a const , Kernel Function Parameters ( .param ), global , local , or shared address to a generic address, or vice-versa.\nThe source and destination addresses must be the same size.\nFor variables declared in .const , Kernel Function Parameters ( .param ), .global , .local , or .shared state space, the generic address of the variable may be taken using cvta .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-cvta", "tokens": ["const", "param", "global", "local", "shared"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：cvta」，归在「指令」。重点关注 关键词 const、param、global、local、shared，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：cvta」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：const、param、global、local、shared。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: cvt", "titleZh": "数据搬移与转换指令：cvt", "numberedTitle": "9.7.9.22. Data Movement and Conversion Instructions: cvt", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "cvt", "details": "cvt\nConvert a value from one type to another.\nSyntax\nDescription\nConvert between different types and sizes.\nFor .f16x2 and .bf16x2 instruction type, two inputs a and b of .f32 type are converted into .f16 or .bf16 type and the converted values are packed in the destination register d , such that the value converted from input a is stored in the upper half of d and the value converted from input b is stored in the lower half of d\nFor .f16x2 instruction type, destination operand d has .f16x2 or .b32 type.\nFor .bf16 instruction type, operand d has .b16 type.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-cvt", "tokens": ["f16x2", "bf16x2", "f32", "f16", "bf16", "b32", "b16"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：cvt」，归在「指令」。重点关注 关键词 f16x2、bf16x2、f32、f16、bf16，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：cvt」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：f16x2、bf16x2、f32、f16、bf16、b32、b16。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: cvt.pack", "titleZh": "数据搬移与转换指令：cvt.pack", "numberedTitle": "9.7.9.23. Data Movement and Conversion Instructions: cvt.pack", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "cvt.pack", "details": "cvt.pack\nConvert two integer values from one integer type to another and pack the results.\nSyntax\nDescription\nConvert two 32-bit integers a and b into specified type and pack the results into d .\nDestination d is an unsigned 32-bit integer.\nSource operands a and b are integers of type .abType and the source operand c is an integer of type .cType .\nThe inputs a and b are converted to values of type specified by .convertType with saturation and the results after conversion are packed into lower bits of d .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-cvt-pack", "tokens": ["cvt.pack", "abType", "cType", "convertType"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：cvt.pack」，归在「指令」。重点关注 关键词 cvt.pack、abType、cType、convertType，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：cvt.pack」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：cvt.pack、abType、cType、convertType。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: mapa", "titleZh": "数据搬移与转换指令：mapa", "numberedTitle": "9.7.9.24. Data Movement and Conversion Instructions: mapa", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "mapa", "details": "mapa\nMap the address of the shared variable in the target CTA.\nSyntax\nDescription\nGet address in the CTA specified by operand b which corresponds to the address specified by operand a .\nInstruction type .type indicates the type of the destination operand d and the source operand a .\nWhen space is .shared::cluster , source a is either a shared memory variable or a register containing a valid shared memory address and register d contains a shared memory address.\nWhen the optional qualifier .space is not specified, both a and d are registers containing generic addresses pointing to shared memory.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-mapa", "tokens": ["type", "shared", "space"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：mapa」，归在「指令」。重点关注 关键词 type、shared、space，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：mapa」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：type、shared、space。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: getctarank", "titleZh": "数据搬移与转换指令：getctarank", "numberedTitle": "9.7.9.25. Data Movement and Conversion Instructions: getctarank", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "getctarank", "details": "getctarank\nGenerate the CTA rank of the address.\nSyntax\nDescription\nWrite the destination register d with the rank of the CTA which contains the address specified in operand a .\nInstruction type .type indicates the type of source operand a .\nWhen space is .shared::cluster , source a is either a shared memory variable or a register containing a valid shared memory address.\nWhen the optional qualifier .space is not specified, a is a register containing a generic addresses pointing to shared memory.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-getctarank", "tokens": ["type", "shared", "space"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：getctarank」，归在「指令」。重点关注 关键词 type、shared、space，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：getctarank」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：type、shared、space。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: Asynchronous copy", "titleZh": "数据搬移与转换指令：Asynchronous copy", "numberedTitle": "9.7.9.26. Data Movement and Conversion Instructions: Asynchronous copy", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "An asynchronous copy operation performs the underlying operation asynchronously in the background, thus allowing the issuing threads to perform subsequent tasks.", "details": "An asynchronous copy operation performs the underlying operation asynchronously in the background, thus allowing the issuing threads to perform subsequent tasks.\nAn asynchronous copy operation can be a bulk operation that operates on a large amount of data, or a non-bulk operation that operates on smaller sized data.\nThe amount of data handled by a bulk asynchronous operation must be a multiple of 16 bytes.\nAn asynchronous copy operation typically includes the following sequence:\nOptionally, reading from the tensormap.\nReading data from the source location(s).\nWriting data to the destination location(s).\nWrites being made visible to the executing thread or other threads.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-asynchronous-copy", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：Asynchronous copy」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：Asynchronous copy」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Completion Mechanisms for Asynchronous Copy Operations", "titleZh": "完成机制 for Asynchronous Copy 操作", "numberedTitle": "9.7.9.26.1. Completion Mechanisms for Asynchronous Copy Operations", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions: Asynchronous copy", "parentZh": "数据搬移与转换指令：Asynchronous copy", "kind": "Instructions", "kindZh": "指令", "summary": "A thread must explicitly wait for the completion of an asynchronous copy operation in order to access the result of the operation. Once an asynchronous copy operation is initiated, modifying the source memory location or tensor descriptor or reading from the...", "details": "A thread must explicitly wait for the completion of an asynchronous copy operation in order to access the result of the operation.\nOnce an asynchronous copy operation is initiated, modifying the source memory location or tensor descriptor or reading from the destination memory location before the asynchronous operation completes, exhibits undefined behavior.\nThis section describes two asynchronous copy operation completion mechanisms supported in PTX: Async-group mechanism and mbarrier-based mechanism.\nAsynchronous operations may be tracked by either of the completion mechanisms or both mechanisms.\nThe tracking mechanism is instruction/instruction-variant specific.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-asynchronous-copy-completion-mechanisms", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「完成机制 for Asynchronous Copy 操作」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「完成机制 for Asynchronous Copy 操作」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Async-group mechanism", "titleZh": "Async-group 机制", "numberedTitle": "9.7.9.26.1.1. Async-group mechanism", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Completion Mechanisms for Asynchronous Copy Operations", "parentZh": "完成机制 for Asynchronous Copy 操作", "kind": "Instructions", "kindZh": "指令", "summary": "When using the async-group completion mechanism, the issuing thread specifies a group of asynchronous operations, called async-group , using a commit operation and tracks the completion of this group using a wait operation. The thread issuing the asynchronous operation...", "details": "When using the async-group completion mechanism, the issuing thread specifies a group of asynchronous operations, called async-group , using a commit operation and tracks the completion of this group using a wait operation.\nThe thread issuing the asynchronous operation must create separate async-groups for bulk and non-bulk asynchronous operations.\nA commit operation creates a per-thread async-group containing all prior asynchronous operations tracked by async-group completion and initiated by the executing thread but none of the asynchronous operations following the commit operation.\nA committed asynchronous operation belongs to a single async-group .\nWhen an async-group completes, all the asynchronous operations belonging to that group are complete and the executing thread that initiated the asynchronous operations can read the result of the asynchronous operations.\nAll async-groups committed by an executing thread always complete in the order in which they were committed.\nA typical pattern of using async-group as the completion mechanism is as follows:\nInitiate the asynchronous operations.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-asynchronous-copy-completion-mechanisms-async-group", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Async-group 机制」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Async-group 机制」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Mbarrier-based mechanism", "titleZh": "基于 mbarrier 的机制", "numberedTitle": "9.7.9.26.1.2. Mbarrier-based mechanism", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Completion Mechanisms for Asynchronous Copy Operations", "parentZh": "完成机制 for Asynchronous Copy 操作", "kind": "Instructions", "kindZh": "指令", "summary": "A thread can track the completion of one or more asynchronous operations using the current phase of an mbarrier object . When the current phase of the mbarrier object is complete, it implies that all asynchronous operations tracked by this phase are complete, and all...", "details": "A thread can track the completion of one or more asynchronous operations using the current phase of an mbarrier object .\nWhen the current phase of the mbarrier object is complete, it implies that all asynchronous operations tracked by this phase are complete, and all threads participating in that mbarrier object can access the result of the asynchronous operations.\nThe mbarrier object to be used for tracking the completion of an asynchronous operation can be either specified along with the asynchronous operation as part of its syntax, or as a separate operation.\nFor bulk asynchronous operations and fabric operations, the mbarrier object must be specified in the asynchronous operation, whereas for non-bulk operations, it can be specified after the asynchronous operation.\nA typical pattern of using mbarrier-based completion mechanism is as follows:\nInitiate the asynchronous operations.\nSet up an mbarrier object to track the asynchronous operations in its current phase, either as part of the asynchronous operation or as a separate operation.\nWait for the mbarrier object to complete its current phase using mbarrier.test_wait or mbarrier.try_wait .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-asynchronous-copy-completion-mechanisms-mbarrier", "tokens": ["mbarrier.test", "mbarrier.try"], "summaryZh": "本条整理 PTX ISA 官方文档中的「基于 mbarrier 的机制」，归在「指令」。重点关注 关键词 mbarrier.test、mbarrier.try，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「基于 mbarrier 的机制」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mbarrier.test、mbarrier.try。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Async Proxy", "titleZh": "Async proxy", "numberedTitle": "9.7.9.26.2. Async Proxy", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions: Asynchronous copy", "parentZh": "数据搬移与转换指令：Asynchronous copy", "kind": "Instructions", "kindZh": "指令", "summary": "The cp{.reduce}.async.bulk operations are performed in the asynchronous proxy (or async proxy ).", "details": "The cp{.reduce}.async.bulk operations are performed in the asynchronous proxy (or async proxy ).\nAccessing the same memory location across multiple proxies needs a cross-proxy fence.\nFor the async proxy , fence.proxy.async should be used to synchronize memory between generic proxy and the async proxy .\nThe completion of a cp{.reduce}.async.bulk operation is followed by an implicit generic-async proxy fence.\nSo the result of the asynchronous operation is made visible to the generic proxy as soon as its completion is observed.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#async-proxy", "tokens": ["reduce", "async.bulk", "fence.proxy.async"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Async proxy」，归在「指令」。重点关注 关键词 reduce、async.bulk、fence.proxy.async，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Async proxy」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：reduce、async.bulk、fence.proxy.async。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: Non-bulk copy", "titleZh": "数据搬移与转换指令：Non-bulk copy", "numberedTitle": "9.7.9.26.3. Data Movement and Conversion Instructions: Non-bulk copy", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions: Asynchronous copy", "parentZh": "数据搬移与转换指令：Asynchronous copy", "kind": "Instructions", "kindZh": "指令", "summary": "PTX ISA 文档章节：Data Movement and Conversion Instructions: Non-bulk copy", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-non-bulk-copy", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：Non-bulk copy」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：Non-bulk copy」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。"}, {"title": "Data Movement and Conversion Instructions: cp.async", "titleZh": "数据搬移与转换指令：cp.async", "numberedTitle": "9.7.9.26.3.1. Data Movement and Conversion Instructions: cp.async", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions: Non-bulk copy", "parentZh": "数据搬移与转换指令：Non-bulk copy", "kind": "Instructions", "kindZh": "指令", "summary": "cp.async", "details": "cp.async\nInitiates an asynchronous copy operation from one state space to another.\nSyntax\nDescription\ncp.async is a non-blocking instruction which initiates an asynchronous copy operation of data from the location specified by source address operand src to the location specified by destination address operand dst .\nOperand src specifies a location in the global state space and dst specifies a location in the shared state space.\nOperand cp-size is an integer constant which specifies the size of data in bytes to be copied to the destination dst . cp-size can only be 4, 8 and 16.\nInstruction cp.async allows optionally specifying a 32-bit integer operand src-size .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-cp-async", "tokens": ["cp.async"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：cp.async」，归在「指令」。重点关注 关键词 cp.async，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：cp.async」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：cp.async。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: cp.async.commit_group", "titleZh": "数据搬移与转换指令：cp.async.commit_group", "numberedTitle": "9.7.9.26.3.2. Data Movement and Conversion Instructions: cp.async.commit_group", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions: Non-bulk copy", "parentZh": "数据搬移与转换指令：Non-bulk copy", "kind": "Instructions", "kindZh": "指令", "summary": "cp.async.commit_group", "details": "cp.async.commit_group\nCommits all prior initiated but uncommitted cp.async instructions into a cp.async-group .\nSyntax\nDescription\ncp.async.commit_group instruction creates a new cp.async-group per thread and batches all prior cp.async instructions initiated by the executing thread but not committed to any cp.async-group into the new cp.async-group .\nIf there are no uncommitted cp.async instructions then cp.async.commit_group results in an empty cp.async-group.\nAn executing thread can wait for the completion of all cp.async operations in a cp.async-group using cp.async.wait_group .\nThere is no memory ordering guarantee provided between any two cp.async operations within the same cp.async-group .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-cp-async-commit-group", "tokens": ["cp.async.commit", "cp.async", "cp.async.wait"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：cp.async.commit_group」，归在「指令」。重点关注 关键词 cp.async.commit、cp.async、cp.async.wait，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：cp.async.commit_group」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：cp.async.commit、cp.async、cp.async.wait。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: cp.async.wait_group / cp.async.wait_all", "titleZh": "数据搬移与转换指令：cp.async.wait_group / cp.async.wait_all", "numberedTitle": "9.7.9.26.3.3. Data Movement and Conversion Instructions: cp.async.wait_group / cp.async.wait_all", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions: Non-bulk copy", "parentZh": "数据搬移与转换指令：Non-bulk copy", "kind": "Instructions", "kindZh": "指令", "summary": "cp.async.wait_group , cp.async.wait_all", "details": "cp.async.wait_group , cp.async.wait_all\nWait for completion of prior asynchronous copy operations.\nSyntax\nDescription\ncp.async.wait_group instruction will cause executing thread to wait till only N or fewer of the most recent cp.async-group s are pending and all the prior cp.async-group s committed by the executing threads are complete.\nFor example, when N is 0, the executing thread waits on all the prior cp.async-group s to complete.\ncp.async.wait_all is equivalent to :\nAn empty cp.async-group is considered to be trivially complete.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-cp-async-wait-group", "tokens": ["cp.async.wait", "cp.async"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：cp.async.wait_group / cp.async.wait_all」，归在「指令」。重点关注 关键词 cp.async.wait、cp.async，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：cp.async.wait_group / cp.async.wait_all」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：cp.async.wait、cp.async。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: Bulk copy", "titleZh": "数据搬移与转换指令：Bulk copy", "numberedTitle": "9.7.9.26.4. Data Movement and Conversion Instructions: Bulk copy", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions: Asynchronous copy", "parentZh": "数据搬移与转换指令：Asynchronous copy", "kind": "Instructions", "kindZh": "指令", "summary": "PTX ISA 文档章节：Data Movement and Conversion Instructions: Bulk copy", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-bulk-copy", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：Bulk copy」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：Bulk copy」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。"}, {"title": "Data Movement and Conversion Instructions: cp.async.bulk", "titleZh": "数据搬移与转换指令：cp.async.bulk", "numberedTitle": "9.7.9.26.4.1. Data Movement and Conversion Instructions: cp.async.bulk", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions: Bulk copy", "parentZh": "数据搬移与转换指令：Bulk copy", "kind": "Instructions", "kindZh": "指令", "summary": "cp.async.bulk", "details": "cp.async.bulk\nInitiates an asynchronous copy operation from one state space to another.\nSyntax\nDescription\ncp.async.bulk is a non-blocking instruction which initiates an asynchronous bulk-copy operation from the location specified by source address operand srcMem to the location specified by destination address operand dstMem .\nThe direction of bulk-copy is from the state space specified by the .src modifier to the state space specified by the .dst modifiers.\nThe 32-bit operand size specifies the amount of memory to be copied, in terms of number of bytes. size must be a multiple of 16.\nIf the value is not a multiple of 16, then the behavior is undefined.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-cp-async-bulk", "tokens": ["cp.async.bulk", "src", "dst"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：cp.async.bulk」，归在「指令」。重点关注 关键词 cp.async.bulk、src、dst，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：cp.async.bulk」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：cp.async.bulk、src、dst。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: cp.reduce.async.bulk", "titleZh": "数据搬移与转换指令：cp.reduce.async.bulk", "numberedTitle": "9.7.9.26.4.2. Data Movement and Conversion Instructions: cp.reduce.async.bulk", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions: Bulk copy", "parentZh": "数据搬移与转换指令：Bulk copy", "kind": "Instructions", "kindZh": "指令", "summary": "cp.reduce.async.bulk", "details": "cp.reduce.async.bulk\nInitiates an asynchronous reduction operation.\nSyntax\nDescription\ncp.reduce.async.bulk is a non-blocking instruction which initiates an asynchronous reduction operation on an array of memory locations specified by the destination address operand dstMem with the source array whose location is specified by the source address operand srcMem .\nThe size of the source and the destination array must be the same and is specified by the operand size .\nEach data element in the destination array is reduced inline with the corresponding data element in the source array with the reduction operation specified by the modifier .redOp .\nThe type of each data element in the source and the destination array is specified by the modifier .type .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-cp-reduce-async-bulk", "tokens": ["cp.reduce.async.bulk", "redOp", "type"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：cp.reduce.async.bulk」，归在「指令」。重点关注 关键词 cp.reduce.async.bulk、redOp、type，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：cp.reduce.async.bulk」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：cp.reduce.async.bulk、redOp、type。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: cp.async.bulk.prefetch", "titleZh": "数据搬移与转换指令：cp.async.bulk.prefetch", "numberedTitle": "9.7.9.26.4.3. Data Movement and Conversion Instructions: cp.async.bulk.prefetch", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions: Bulk copy", "parentZh": "数据搬移与转换指令：Bulk copy", "kind": "Instructions", "kindZh": "指令", "summary": "cp.async.bulk.prefetch", "details": "cp.async.bulk.prefetch\nProvides a hint to the system to initiate the asynchronous prefetch of data to the cache.\nSyntax\nDescription\ncp.async.bulk.prefetch is a non-blocking instruction which may initiate an asynchronous prefetch of data from the location specified by source address operand srcMem , in .src statespace, to the L2 cache.\nThe 32-bit operand size specifies the amount of memory to be prefetched in terms of number of bytes. size must be a multiple of 16.\nIf the value is not a multiple of 16, then the behavior is undefined.\nWhen the optional argument cache_policy is specified, the qualifier .level::cache_hint is required.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-cp-async-bulk-prefetch", "tokens": ["cp.async.bulk.prefetch", "src", "level"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：cp.async.bulk.prefetch」，归在「指令」。重点关注 关键词 cp.async.bulk.prefetch、src、level，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：cp.async.bulk.prefetch」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：cp.async.bulk.prefetch、src、level。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: multimem.cp.async.bulk", "titleZh": "数据搬移与转换指令：multimem.cp.async.bulk", "numberedTitle": "9.7.9.26.4.4. Data Movement and Conversion Instructions: multimem.cp.async.bulk", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions: Bulk copy", "parentZh": "数据搬移与转换指令：Bulk copy", "kind": "Instructions", "kindZh": "指令", "summary": "multimem.cp.async.bulk", "details": "multimem.cp.async.bulk\nInitiates an asynchronous copy operation to a multimem address range.\nSyntax\nDescription\nInstruction multimem.cp.async.bulk initiates an asynchronous bulk-copy operation from source address range [srcMem, srcMem + size) to memory locations residing on each GPU’s memory referred to by the destination multimem address range [dstMem, dstMem + size) .\nThe direction of bulk-copy is from the state space specified by the .src modifier to the state space specified by the .dst modifiers.\nThe 32-bit operand size specifies the amount of memory to be copied, in terms of number of bytes.\nOperand size must be a multiple of 16 .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-multimem-cp-async-bulk", "tokens": ["multimem.cp.async.bulk", "src", "dst"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：multimem.cp.async.bulk」，归在「指令」。重点关注 关键词 multimem.cp.async.bulk、src、dst，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：multimem.cp.async.bulk」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：multimem.cp.async.bulk、src、dst。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: multimem.cp.reduce.async.bulk", "titleZh": "数据搬移与转换指令：multimem.cp.reduce.async.bulk", "numberedTitle": "9.7.9.26.4.5. Data Movement and Conversion Instructions: multimem.cp.reduce.async.bulk", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions: Bulk copy", "parentZh": "数据搬移与转换指令：Bulk copy", "kind": "Instructions", "kindZh": "指令", "summary": "multimem.cp.reduce.async.bulk", "details": "multimem.cp.reduce.async.bulk\nInitiates an asynchronous reduction operation to a multimem address range.\nSyntax\nDescription\nInstruction multimem.cp.reduce.async.bulk initiates an element-wise asynchronous reduction operation with elements from source memory address range [srcMem, srcMem + size) to memory locations residing on each GPU’s memory referred to by the multimem destination address range [dstMem, dstMem + size) .\nEach data element in the destination array is reduced inline with the corresponding data element in the source array with the reduction operation specified by the modifier .redOp .\nThe type of each data element in the source and the destination array is specified by the modifier .type .\nThe source address operand srcMem is in the state space specified by .src and the destination address operand dstMem is in the state specified by the .dst .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-multimem-cp-reduce-async-bulk", "tokens": ["multimem.cp.reduce.async.bulk", "redOp", "type", "src", "dst"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：multimem.cp.reduce.async.bulk」，归在「指令」。重点关注 关键词 multimem.cp.reduce.async.bulk、redOp、type、src、dst，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：multimem.cp.reduce.async.bulk」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：multimem.cp.reduce.async.bulk、redOp、type、src、dst。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: Tensor copy", "titleZh": "数据搬移与转换指令：Tensor copy", "numberedTitle": "9.7.9.26.5. Data Movement and Conversion Instructions: Tensor copy", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions: Asynchronous copy", "parentZh": "数据搬移与转换指令：Asynchronous copy", "kind": "Instructions", "kindZh": "指令", "summary": "PTX ISA 文档章节：Data Movement and Conversion Instructions: Tensor copy", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-tensor-copy", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：Tensor copy」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：Tensor copy」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。"}, {"title": "Restriction on Tensor Copy instructions", "titleZh": "Restriction on Tensor Copy 指令", "numberedTitle": "9.7.9.26.5.1. Restriction on Tensor Copy instructions", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions: Tensor copy", "parentZh": "数据搬移与转换指令：Tensor copy", "kind": "Instructions", "kindZh": "指令", "summary": "Following are the restrictions on the types .b4x16 , .b4x16_p64 , .b6x16_p32 and .b6p2x16 :", "details": "Following are the restrictions on the types .b4x16 , .b4x16_p64 , .b6x16_p32 and .b6p2x16 :\ncp.reduce.async.bulk doesn’t support the types .b4x16 , .b4x16_p64 , .b6x16_p32 and .b6p2x16 .\ncp.async.bulk.tensor with the direction .global.shared::cta doesn’t support the type .b4x16_p64 .\ncp.async.bulk.tensor with the direction .shared::cluster.global doesn’t support the sub-byte types on sm_120a .\nOOB-NaN fill mode doesn’t support the types .b4x16 , .b4x16_p64 , .b6x16_p32 and .b6p2x16 .\nBox-Size[0] must be exactly: 96B for b6x16_p32 and .b6p2x16 . 64B for b4x16_p64 .\nTensor-Size[0] must be a multiple of: 96B for b6x16_p32 and .b6p2x16 . 64B for b4x16_p64 .\nFor .b4x16_p64 , .b6x16_p32 and .b6p2x16 , the first coordinate in the tensorCoords argument vector must be a multiple of 128.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-tensor-copy-restrictions", "tokens": ["b4x16", "b4x16_p64", "b6x16_p32", "b6p2x16", "cp.reduce.async.bulk", "cp.async.bulk.tensor", "global.shared", "shared", "cluster.global", "sm_120a"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Restriction on Tensor Copy 指令」，归在「指令」。重点关注 关键词 b4x16、b4x16_p64、b6x16_p32、b6p2x16、cp.reduce.async.bulk，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Restriction on Tensor Copy 指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：b4x16、b4x16_p64、b6x16_p32、b6p2x16、cp.reduce.async.bulk、cp.async.bulk.tensor、global.shared、shared。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: cp.async.bulk.tensor", "titleZh": "数据搬移与转换指令：cp.async.bulk.tensor", "numberedTitle": "9.7.9.26.5.2. Data Movement and Conversion Instructions: cp.async.bulk.tensor", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions: Tensor copy", "parentZh": "数据搬移与转换指令：Tensor copy", "kind": "Instructions", "kindZh": "指令", "summary": "cp.async.bulk.tensor", "details": "cp.async.bulk.tensor\nInitiates an asynchronous copy operation on the tensor data from one state space to another.\nSyntax\nDescription\ncp.async.bulk.tensor is a non-blocking instruction which initiates an asynchronous copy operation of tensor data from the location in .src state space to the location in the .dst state space.\nThe operand dstMem specifies the location in the .dst state space into which the tensor data has to be copied and srcMem specifies the location in the .src state space from which the tensor data has to be copied.\nWhen .dst is specified as .shared::cta , the address dstMem must be in the shared memory of the executing CTA within the cluster, otherwise the behavior is undefined.\nWhen .dst is .shared::cta , the mbarrier object mbar must also reside in the shared memory of the executing CTA, otherwise behavior is undefined.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-cp-async-bulk-tensor", "tokens": ["cp.async.bulk.tensor", "src", "dst", "shared"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：cp.async.bulk.tensor」，归在「指令」。重点关注 关键词 cp.async.bulk.tensor、src、dst、shared，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：cp.async.bulk.tensor」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：cp.async.bulk.tensor、src、dst、shared。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: cp.reduce.async.bulk.tensor", "titleZh": "数据搬移与转换指令：cp.reduce.async.bulk.tensor", "numberedTitle": "9.7.9.26.5.3. Data Movement and Conversion Instructions: cp.reduce.async.bulk.tensor", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions: Tensor copy", "parentZh": "数据搬移与转换指令：Tensor copy", "kind": "Instructions", "kindZh": "指令", "summary": "cp.reduce.async.bulk.tensor", "details": "cp.reduce.async.bulk.tensor\nInitiates an asynchronous reduction operation on the tensor data.\nSyntax\nDescription\ncp.reduce.async.bulk.tensor is a non-blocking instruction which initiates an asynchronous reduction operation of tensor data in the .dst state space with tensor data in the .src state space.\nThe operand srcMem specifies the location of the tensor data in the .src state space using which the reduction operation has to be performed.\nThe operand tensorMap is the generic address of the opaque tensor-map object which resides in .param space or .const space or .global space.\nThe operand tensorMap specifies the properties of the tensor copy operation, as described in Tensor-map .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-cp-reduce-async-bulk-tensor", "tokens": ["cp.reduce.async.bulk.tensor", "dst", "src", "param", "const", "global"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：cp.reduce.async.bulk.tensor」，归在「指令」。重点关注 关键词 cp.reduce.async.bulk.tensor、dst、src、param、const，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：cp.reduce.async.bulk.tensor」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：cp.reduce.async.bulk.tensor、dst、src、param、const、global。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: cp.async.bulk.prefetch.tensor", "titleZh": "数据搬移与转换指令：cp.async.bulk.prefetch.tensor", "numberedTitle": "9.7.9.26.5.4. Data Movement and Conversion Instructions: cp.async.bulk.prefetch.tensor", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions: Tensor copy", "parentZh": "数据搬移与转换指令：Tensor copy", "kind": "Instructions", "kindZh": "指令", "summary": "cp.async.bulk.prefetch.tensor", "details": "cp.async.bulk.prefetch.tensor\nProvides a hint to the system to initiate the asynchronous prefetch of tensor data to the cache.\nSyntax\nDescription\ncp.async.bulk.prefetch.tensor is a non-blocking instruction which may initiate an asynchronous prefetch of tensor data from the location in .src statespace to the L2 cache.\nThe operand tensorMap is the generic address of the opaque tensor-map object which resides in .param space or .const space or .global space.\nThe operand tensorMap specifies the properties of the tensor copy operation, as described in Tensor-map .\nThe dimension of the tensor data is specified by the .dim modifier.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-cp-async-bulk-prefetch-tensor", "tokens": ["cp.async.bulk.prefetch.tensor", "src", "param", "const", "global", "dim"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：cp.async.bulk.prefetch.tensor」，归在「指令」。重点关注 关键词 cp.async.bulk.prefetch.tensor、src、param、const、global，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：cp.async.bulk.prefetch.tensor」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：cp.async.bulk.prefetch.tensor、src、param、const、global、dim。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: Bulk and Tensor copy completion instructions", "titleZh": "数据搬移与转换指令：Bulk and Tensor copy completion instructions", "numberedTitle": "9.7.9.26.6. Data Movement and Conversion Instructions: Bulk and Tensor copy completion instructions", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions: Asynchronous copy", "parentZh": "数据搬移与转换指令：Asynchronous copy", "kind": "Instructions", "kindZh": "指令", "summary": "PTX ISA 文档章节：Data Movement and Conversion Instructions: Bulk and Tensor copy completion instructions", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-bulk-tensor-copy-completion", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：Bulk and Tensor copy completion instructions」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：Bulk and Tensor copy completion instructions」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。"}, {"title": "Data Movement and Conversion Instructions: cp.async.bulk.commit_group", "titleZh": "数据搬移与转换指令：cp.async.bulk.commit_group", "numberedTitle": "9.7.9.26.6.1. Data Movement and Conversion Instructions: cp.async.bulk.commit_group", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions: Bulk and Tensor copy completion instructions", "parentZh": "数据搬移与转换指令：Bulk and Tensor copy completion instructions", "kind": "Instructions", "kindZh": "指令", "summary": "cp.async.bulk.commit_group", "details": "cp.async.bulk.commit_group\nCommits all prior initiated but uncommitted cp.async.bulk instructions into a cp.async.bulk-group .\nSyntax\nDescription\ncp.async.bulk.commit_group instruction creates a new per-thread bulk async-group and batches all prior cp{.reduce}.async.bulk{.prefetch}{.tensor} instructions satisfying the following conditions into the new bulk async-group :\nThe prior cp{.reduce}.async.bulk{.prefetch}{.tensor} instructions use bulk_group based completion mechanism, and\nThey are initiated by the executing thread but not committed to any bulk async-group .\nIf there are no uncommitted cp{.reduce}.async.bulk{.prefetch}{.tensor} instructions then cp.async.bulk.commit_group results in an empty bulk async-group .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-cp-async-bulk-commit-group", "tokens": ["cp.async.bulk.commit", "cp.async.bulk", "reduce", "async.bulk", "prefetch", "tensor"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：cp.async.bulk.commit_group」，归在「指令」。重点关注 关键词 cp.async.bulk.commit、cp.async.bulk、reduce、async.bulk、prefetch，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：cp.async.bulk.commit_group」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：cp.async.bulk.commit、cp.async.bulk、reduce、async.bulk、prefetch、tensor。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: cp.async.bulk.wait_group", "titleZh": "数据搬移与转换指令：cp.async.bulk.wait_group", "numberedTitle": "9.7.9.26.6.2. Data Movement and Conversion Instructions: cp.async.bulk.wait_group", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions: Bulk and Tensor copy completion instructions", "parentZh": "数据搬移与转换指令：Bulk and Tensor copy completion instructions", "kind": "Instructions", "kindZh": "指令", "summary": "cp.async.bulk.wait_group", "details": "cp.async.bulk.wait_group\nWait for completion of bulk async-groups .\nSyntax\nDescription\ncp.async.bulk.wait_group instruction will cause the executing thread to wait until only N or fewer of the most recent bulk async-groups are pending and all the prior bulk async-groups committed by the executing threads are complete.\nFor example, when N is 0, the executing thread waits on all the prior bulk async-groups to complete.\nBy default, cp.async.bulk.wait_group instruction will cause the executing thread to wait until completion of all the bulk async operations in the specified bulk async-group .\nA bulk async operation includes the following:", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-cp-async-bulk-wait-group", "tokens": ["cp.async.bulk.wait"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：cp.async.bulk.wait_group」，归在「指令」。重点关注 关键词 cp.async.bulk.wait，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：cp.async.bulk.wait_group」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：cp.async.bulk.wait。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Movement and Conversion Instructions: tensormap.replace", "titleZh": "数据搬移与转换指令：tensormap.replace", "numberedTitle": "9.7.9.27. Data Movement and Conversion Instructions: tensormap.replace", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement and Conversion Instructions", "parentZh": "数据搬移与转换指令", "kind": "Instructions", "kindZh": "指令", "summary": "tensormap.replace", "details": "tensormap.replace\nModifies the field of a tensor-map object.\nSyntax\nDescription\nThe tensormap.replace instruction replaces the field, specified by .field qualifier, of the tensor-map object at the location specified by the address operand addr with a new value.\nThe new value is specified by the argument new_val .\nQualifier .mode specifies the mode of the tensor-map object located at the address operand addr .\nInstruction type .b1024 indicates the size of the tensor-map object, which is 1024 bits.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#data-movement-and-conversion-instructions-tensormap-replace", "tokens": ["tensormap.replace", "field", "mode", "b1024"], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移与转换指令：tensormap.replace」，归在「指令」。重点关注 关键词 tensormap.replace、field、mode、b1024，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移与转换指令：tensormap.replace」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tensormap.replace、field、mode、b1024。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Fabric Instructions", "titleZh": "Fabric 指令", "numberedTitle": "9.7.10. Fabric Instructions", "level": "H3", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Instructions", "parentZh": "指令", "kind": "Instructions", "kindZh": "指令", "summary": "NVLink failures encountered by pointer-address-based memory operations are fatal to the application. The CUDA Compute Fabric Transport (CUDA CFT) programming model introduces fabric operations that report failures directly to the application, enabling them to be...", "details": "NVLink failures encountered by pointer-address-based memory operations are fatal to the application.\nThe CUDA Compute Fabric Transport (CUDA CFT) programming model introduces fabric operations that report failures directly to the application, enabling them to be resilient over NVLink failures.\nRefer to the Logical Endpoint section of the CUDA Driver API for the host-side programming model.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fabric-instructions", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Fabric 指令」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Fabric 指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "CFT Handles", "titleZh": "CFT handle", "numberedTitle": "9.7.10.1. CFT Handles", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Fabric Instructions", "parentZh": "Fabric 指令", "kind": "Instructions", "kindZh": "指令", "summary": "A CUDA Fabric Transport Handle is composed of two objects:", "details": "A CUDA Fabric Transport Handle is composed of two objects:\nleId , a logical endpoint identifier: a 32-bit unsigned integer reference to a logical endpoint\noff , a resource offset: a 64-bit unsigned integer reference to a resource within the logical endpoint.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#cft-handles", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「CFT handle」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「CFT handle」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "CFT Handles Overview", "titleZh": "CFT Handles 概览", "numberedTitle": "9.7.10.2. CFT Handles Overview", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Fabric Instructions", "parentZh": "Fabric 指令", "kind": "Instructions", "kindZh": "指令", "summary": "All fabric operations:", "details": "All fabric operations:\nMay fail and report a status that identifies success or potential failure of the operation, enabling applications to react accordingly.\nAre asynchronous operations, enabling the operation to make progress in the background.\nPerform some CFT Handle resource accesses via the fabric-proxy. Most fabric operations perform multiple accesses: CFT Handle resource accesses via fabric-proxy, and multiple pointer-based accesses via often multiple different proxies.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#cft-handles-overview", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「CFT Handles 概览」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「CFT Handles 概览」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Fabric Proxy", "titleZh": "Fabric proxy", "numberedTitle": "9.7.10.2.1. Fabric Proxy", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "CFT Handles Overview", "parentZh": "CFT Handles 概览", "kind": "Instructions", "kindZh": "指令", "summary": "Fabric operation accesses to CFT Handle resources are performed through the fabric-proxy. Cross-proxy fences between fabric-proxy and generic-proxy are available.", "details": "Fabric operation accesses to CFT Handle resources are performed through the fabric-proxy.\nCross-proxy fences between fabric-proxy and generic-proxy are available.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fabric-proxy", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Fabric proxy」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Fabric proxy」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Life of a Fabric Operation", "titleZh": "Life of a Fabric 操作", "numberedTitle": "9.7.10.3. Life of a Fabric Operation", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Fabric Instructions", "parentZh": "Fabric 指令", "kind": "Instructions", "kindZh": "指令", "summary": "The lifecycle of a handle starts and ends in the host,when the host-side of the CUDA application detects whether the system supports fabric operations, creates logical endpoints, binds resources to the logical endpoints, and shares them with other GPUs in the NVLink...", "details": "The lifecycle of a handle starts and ends in the host,when the host-side of the CUDA application detects whether the system supports fabric operations, creates logical endpoints, binds resources to the logical endpoints, and shares them with other GPUs in the NVLink domain.\nTo enable remote source accesses the logical endpoint readiness should be queried.\nThe lifecycle of fabric operations includes:\nThreads issue one or more fabric operations tracked by an mbarrier.layout::v1 .\nEach thread submits the fabric operations before the associated mbarrier phase completes.\nThreads arrive-on and expect-tx at the mbarrier phase to ensure it advances once the fabric operations complete.\nThreads wait until the mbarrier phase completes.\nThreads inspect the predicate report for errors, and handle them. The status report may contain additional information about the errors.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fabric-operations-lifecycle", "tokens": ["mbarrier.layout"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Life of a Fabric 操作」，归在「指令」。重点关注 关键词 mbarrier.layout，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Life of a Fabric 操作」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mbarrier.layout。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Issue a Fabric Operation", "titleZh": "Issue a Fabric 操作", "numberedTitle": "9.7.10.3.1. Issue a Fabric Operation", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Life of a Fabric Operation", "parentZh": "Life of a Fabric 操作", "kind": "Instructions", "kindZh": "指令", "summary": "A thread initiates fabric operations by executing any of the following fabric instructions:", "details": "A thread initiates fabric operations by executing any of the following fabric instructions:\nfabric.try_get : read from CFT Handle\nfabric.try_put : write to CFT Handle\nfabric.try_red : reduction to CFT Handle\nfabric.try_pullred : pull-reduction from CFT handle ( multimem.ld_reduce equivalent).", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#issue-fabric-operation", "tokens": ["fabric.try", "multimem.ld"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Issue a Fabric 操作」，归在「指令」。重点关注 关键词 fabric.try、multimem.ld，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Issue a Fabric 操作」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：fabric.try、multimem.ld。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Submit and then arrive at mbarrier", "titleZh": "提交后 arrive 到 mbarrier", "numberedTitle": "9.7.10.3.2. Submit and then arrive at mbarrier", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Life of a Fabric Operation", "parentZh": "Life of a Fabric 操作", "kind": "Instructions", "kindZh": "指令", "summary": "For any thread to observe completion of fabric operations via an mbarrier object, the issuing thread is required to submit those operations before the barrier phase tracking these operations advances. Otherwise, the behavior is undefined.", "details": "For any thread to observe completion of fabric operations via an mbarrier object, the issuing thread is required to submit those operations before the barrier phase tracking these operations advances.\nOtherwise, the behavior is undefined.\nA single arrive expect_tx operation can be issued for multiple and different types of fabric operations tracked by the same barrier.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fabric-submit-then-arrive-mbarrier", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「提交后 arrive 到 mbarrier」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「提交后 arrive 到 mbarrier」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Wait for completion", "titleZh": "等待完成", "numberedTitle": "9.7.10.3.3. Wait for completion", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Life of a Fabric Operation", "parentZh": "Life of a Fabric 操作", "kind": "Instructions", "kindZh": "指令", "summary": "Submitted fabric operations are guaranteed to eventually complete, and threads may block on the mbarrier to observe their completion and their report status.", "details": "Submitted fabric operations are guaranteed to eventually complete, and threads may block on the mbarrier to observe their completion and their report status.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fabric-wait-for-completion", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「等待完成」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「等待完成」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Inspect status and handle errors", "titleZh": "检查状态并处理错误", "numberedTitle": "9.7.10.3.4. Inspect status and handle errors", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Life of a Fabric Operation", "parentZh": "Life of a Fabric 操作", "kind": "Instructions", "kindZh": "指令", "summary": "A single operation like fabric.try_put may issue many requests, and each of the requests may fail for a different reason. The failures are reported on the mbarrier objects.", "details": "A single operation like fabric.try_put may issue many requests, and each of the requests may fail for a different reason.\nThe failures are reported on the mbarrier objects.\nMultiple different fabric operations may also be tracked by the same mbarrier object and fail for different reasons.\nThe mbarrier.try_wait.phase_type::primary operation that notifies the program of completion sets the report predicate if there were any errors; the opaque report value may contain more information.\nSee fabric reporting mechanism for details.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fabric-inspect-status-handle-errors", "tokens": ["fabric.try", "mbarrier.try", "wait.phase"], "summaryZh": "本条整理 PTX ISA 官方文档中的「检查状态并处理错误」，归在「指令」。重点关注 关键词 fabric.try、mbarrier.try、wait.phase，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「检查状态并处理错误」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：fabric.try、mbarrier.try、wait.phase。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Completion mechanisms of fabric operations", "titleZh": "完成机制 of fabric 操作", "numberedTitle": "9.7.10.4. Completion mechanisms of fabric operations", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Fabric Instructions", "parentZh": "Fabric 指令", "kind": "Instructions", "kindZh": "指令", "summary": "The completion of fabric operations can be tracked by mbarrier objects of type layout::v1 . For details refer to mbarrier based completion mechanism . Observing completion of a fabric operation provides ordering for all memory accesses and CFT Handle resource accesses...", "details": "The completion of fabric operations can be tracked by mbarrier objects of type layout::v1 .\nFor details refer to mbarrier based completion mechanism .\nIn addition to tracking the completion of the fabric operation, a subset of operation effects, such as waiting on reads from shared memory, waiting on changes in a counter value, etc., can also be tracked independently from the entire completion of the operation.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fabric-completion-mechanisms", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「完成机制 of fabric 操作」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「完成机制 of fabric 操作」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Fabric Reporting Mechanism", "titleZh": "Fabric Reporting 机制", "numberedTitle": "9.7.10.4.1. Fabric Reporting Mechanism", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Completion mechanisms of fabric operations", "parentZh": "完成机制 of fabric 操作", "kind": "Instructions", "kindZh": "指令", "summary": "Fabric operations tracked by mbarrier use the report::fabric reporting mechanism with the following semantics:", "details": "Fabric operations tracked by mbarrier use the report::fabric reporting mechanism with the following semantics:\nIf the operation succeeds, the payload report ( contents of the mbarrier object ) is not modified. In other words, report predicate and report value both remain unchanged.\nOtherwise, the operation fails, the mbarrier report predicate is set, and the opaque report value may contain more information, which may be decoded via the cudaFabricOpErrorStatusGet/Count APIs.\nThe behavior of a program that combines fabric operations specifying report::fabric with other operations specifying different reporting mechanism is undefined.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fabric-reporting-mechanism", "tokens": ["cudaFabricOpErrorStatusGet"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Fabric Reporting 机制」，归在「指令」。重点关注 关键词 cudaFabricOpErrorStatusGet，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Fabric Reporting 机制」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：cudaFabricOpErrorStatusGet。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Fabric-read completion mechanism", "titleZh": "Fabric-read 完成机制", "numberedTitle": "9.7.10.4.2. Fabric-read completion mechanism", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Completion mechanisms of fabric operations", "parentZh": "完成机制 of fabric 操作", "kind": "Instructions", "kindZh": "指令", "summary": "All fabric operations that read data from shared memory support tracking the completion of the read operation. This enables applications to reuse the shared memory read by these operations without waiting for the entire operation to complete. This is a partial...", "details": "All fabric operations that read data from shared memory support tracking the completion of the read operation.\nThis enables applications to reuse the shared memory read by these operations without waiting for the entire operation to complete.\nNote that since fabric.try_get does not read from shared memory - it writes to it - this completion mechanism does not provide any ordering for try_get operations.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fabric-read-completion-mechanism", "tokens": ["fabric.try"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Fabric-read 完成机制」，归在「指令」。重点关注 关键词 fabric.try，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Fabric-read 完成机制」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：fabric.try。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Counted completion mechanism", "titleZh": "计数式完成机制", "numberedTitle": "9.7.10.4.3. Counted completion mechanism", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Completion mechanisms of fabric operations", "parentZh": "完成机制 of fabric 操作", "kind": "Instructions", "kindZh": "指令", "summary": "Fabric operations support tracking the completion of the destination data accesses performed by try_put and try_red using a global memory counter. It enables programs to wait on data modifications by observing the counter updates. Multiple fabric operations may share...", "details": "Fabric operations support tracking the completion of the destination data accesses performed by try_put and try_red using a global memory counter.\nIt enables programs to wait on data modifications by observing the counter updates.\nThis mechanism increments a counter by one for each byte of data accessed.\nThe granularity at which counter updates occur is unspecified; updates may happen once per byte, once collectively at the end of the operation, or any granularity in between.\nIf counter and data overlap, the behavior is undefined.\nIf the logical endpoint lacks support for counted completion, the behavior is undefined (refer to the Logical Endpoint section of the CUDA Driver API for details).\nThis is a partial completion mechanism that programs can use to wait on destination data accesses.\nFor .multimem fabric operations with counted completion, counters only track accesses at their destination device.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fabric-counted-completion-mechanism", "tokens": ["multimem"], "summaryZh": "本条整理 PTX ISA 官方文档中的「计数式完成机制」，归在「指令」。重点关注 关键词 multimem，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「计数式完成机制」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：multimem。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Fabric operations", "titleZh": "Fabric 操作", "numberedTitle": "9.7.10.5. Fabric operations", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Fabric Instructions", "parentZh": "Fabric 指令", "kind": "Instructions", "kindZh": "指令", "summary": "PTX ISA 文档章节：Fabric operations", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fabric-operations", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Fabric 操作」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Fabric 操作」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。"}, {"title": "Fabric Instructions: fabric.try_get", "titleZh": "Fabric 指令：fabric.try_get", "numberedTitle": "9.7.10.5.1. Fabric Instructions: fabric.try_get", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Fabric operations", "parentZh": "Fabric 操作", "kind": "Instructions", "kindZh": "指令", "summary": "fabric.try_get", "details": "fabric.try_get\nAsynchronous copy from fabric handle.\nSyntax\nDescription\nAsynchronously copies size bytes from fabric handle [srcLeId, srcDataOff] to destination memory [dst] , where srcLeId is a 32-bit unsigned value denoting the logical endpoint identifier, and srcDataOff is a 64-bit unsigned value denoting the base offset of the resource to access within the logical endpoint associated with srcLeId .\nThe logical endpoint associated with srcLeId must be a unicast logical endpoint.\nThe size operand is 32 bits and specifies the number of bytes to be copied.\nIt must be a multiple of 16; otherwise, the behavior is undefined.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fabric-instructions-try-get", "tokens": ["fabric.try"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Fabric 指令：fabric.try_get」，归在「指令」。重点关注 关键词 fabric.try，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Fabric 指令：fabric.try_get」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：fabric.try。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Fabric Instructions: fabric.try_put", "titleZh": "Fabric 指令：fabric.try_put", "numberedTitle": "9.7.10.5.2. Fabric Instructions: fabric.try_put", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Fabric operations", "parentZh": "Fabric 操作", "kind": "Instructions", "kindZh": "指令", "summary": "fabric.try_put", "details": "fabric.try_put\nAsynchronous copy to fabric handle.\nSyntax\nDescription\nAsynchronously copies size bytes from [src] to destination fabric handle [dstLeId, dstDataOff] , where dstLeId is a 32-bit unsigned value denoting the logical endpoint identifier, and dstDataOff is a 64-bit unsigned value denoting the base offset of the resource to access within the logical endpoint associated with dstLeId .\nThe size operand is 32 bits and specifies the number of bytes to be copied.\nIt must be a multiple of 16; otherwise, the behavior is undefined.\nThe source pointer src and the destination handle offset dstDataOff must be 16-byte aligned.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fabric-instructions-try-put", "tokens": ["fabric.try"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Fabric 指令：fabric.try_put」，归在「指令」。重点关注 关键词 fabric.try，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Fabric 指令：fabric.try_put」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：fabric.try。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Fabric Instructions: fabric.try_red", "titleZh": "Fabric 指令：fabric.try_red", "numberedTitle": "9.7.10.5.3. Fabric Instructions: fabric.try_red", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Fabric operations", "parentZh": "Fabric 操作", "kind": "Instructions", "kindZh": "指令", "summary": "fabric.try_red", "details": "fabric.try_red\nAsynchronous copy to fabric handle with reduction.\nSyntax\nDescription\nAsynchronously copies size bytes from [src] to destination fabric handle [dstLeId, dstDataOff] with element-wise reduction, where dstLeId is a 32-bit unsigned value denoting the logical endpoint identifier, and dstDataOff is a 64-bit unsigned value denoting the base offset of the resource to access within the logical endpoint associated with dstLeId .\nThe size operand is 32 bits and specifies the number of bytes to be copied.\nIt must be a multiple of 16; otherwise, the behavior is undefined.\nThe source pointer src and the destination handle offset dstDataOff must be 16-byte aligned.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fabric-instructions-try-red", "tokens": ["fabric.try"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Fabric 指令：fabric.try_red」，归在「指令」。重点关注 关键词 fabric.try，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Fabric 指令：fabric.try_red」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：fabric.try。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Fabric Instructions: fabric.try_pullred", "titleZh": "Fabric 指令：fabric.try_pullred", "numberedTitle": "9.7.10.5.4. Fabric Instructions: fabric.try_pullred", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Fabric operations", "parentZh": "Fabric 操作", "kind": "Instructions", "kindZh": "指令", "summary": "fabric.try_pullred", "details": "fabric.try_pullred\nAsynchronous copy from fabric handle with pull-reduction.\nSyntax\nDescription\nInitiates asynchronous loads from multiple resources pointed to by multicast fabric handle [srcLeId, srcDataOff] , of size bytes, and performs element-wise reduction on data across each of the loads.\nThe result is stored in [dst, dst + size - 1] . srcLeId is a 32-bit unsigned value denoting the logical endpoint identifier, and srcDataOff is a 64-bit unsigned value denoting the base offset of the resources to access within the multicast logical endpoint associated with srcLeId .\nThe size operand is 32 bits and specifies the number of bytes to be copied.\nIt must be a multiple of 16; otherwise, the behavior is undefined.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fabric-instructions-try-pullred", "tokens": ["fabric.try"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Fabric 指令：fabric.try_pullred」，归在「指令」。重点关注 关键词 fabric.try，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Fabric 指令：fabric.try_pullred」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：fabric.try。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Fabric Instructions: fabric.submit", "titleZh": "Fabric 指令：fabric.submit", "numberedTitle": "9.7.10.5.5. Fabric Instructions: fabric.submit", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Fabric operations", "parentZh": "Fabric 操作", "kind": "Instructions", "kindZh": "指令", "summary": "fabric.submit", "details": "fabric.submit\nSubmits prior fabric operations issued by the current thread.\nSyntax\nDescription\nSubmits prior fabric operations issued by the current thread.\nFor any thread to observe completion of fabric operations via an mbarrier object, the issuing thread is required to submit those operations before the barrier phase tracking these operations advances.\nIf .op_restrict::fetching is specified, then only prior fabric.try_get and fabric.try_pullred operations issued by the current thread are submitted.\nOtherwise, all prior fabric operations issued by the current thread are submitted.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fabric-instructions-submit", "tokens": ["fabric.submit", "op_restrict", "fabric.try"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Fabric 指令：fabric.submit」，归在「指令」。重点关注 关键词 fabric.submit、op_restrict、fabric.try，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Fabric 指令：fabric.submit」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：fabric.submit、op_restrict、fabric.try。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Fabric Instructions: fabric.wait", "titleZh": "Fabric 指令：fabric.wait", "numberedTitle": "9.7.10.5.6. Fabric Instructions: fabric.wait", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Fabric operations", "parentZh": "Fabric 操作", "kind": "Instructions", "kindZh": "指令", "summary": "fabric.wait", "details": "fabric.wait\nWait on local shared-memory reads of submitted fabric operations.\nSyntax\nDescription\nFabric-read completion mechanism instruction fabric.wait waits on the local shared memory ( .shared::cta ) reads of submitted fabric operations.\nThis enables overwriting the shared memory read by these operations before they complete.\nPTX ISA Notes\nIntroduced in PTX ISA version 9.3.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fabric-instructions-wait", "tokens": ["fabric.wait", "shared"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Fabric 指令：fabric.wait」，归在「指令」。重点关注 关键词 fabric.wait、shared，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Fabric 指令：fabric.wait」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：fabric.wait、shared。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Control Flow Instructions", "titleZh": "控制流指令", "numberedTitle": "9.7.13. Control Flow Instructions", "level": "H3", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Instructions", "parentZh": "指令", "kind": "Instructions", "kindZh": "指令", "summary": "The following PTX instructions and syntax are for controlling execution in a PTX program:", "details": "The following PTX instructions and syntax are for controlling execution in a PTX program:\n{}\n@\nbra\ncall\nret\nexit", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#control-flow-instructions", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「控制流指令」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「控制流指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Control Flow Instructions: {}", "titleZh": "控制流指令：{}", "numberedTitle": "9.7.13.1. Control Flow Instructions: {}", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Control Flow Instructions", "parentZh": "控制流指令", "kind": "Instructions", "kindZh": "指令", "summary": "{}", "details": "{}\nInstruction grouping.\nSyntax\nDescription\nThe curly braces create a group of instructions, used primarily for defining a function body.\nThe curly braces also provide a mechanism for determining the scope of a variable: any variable declared within a scope is not available outside the scope.\nPTX ISA Notes\nIntroduced in PTX ISA version 1.0.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#control-flow-instructions-curly-braces", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「控制流指令：{}」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「控制流指令：{}」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Control Flow Instructions: @", "titleZh": "控制流指令：@", "numberedTitle": "9.7.13.2. Control Flow Instructions: @", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Control Flow Instructions", "parentZh": "控制流指令", "kind": "Instructions", "kindZh": "指令", "summary": "@", "details": "@\nPredicated execution.\nSyntax\nDescription\nExecute an instruction or instruction block for threads that have the guard predicate True .\nThreads with a False guard predicate do nothing.\nSemantics\nIf {!}p then instruction", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#control-flow-instructions-at", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「控制流指令：@」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「控制流指令：@」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Control Flow Instructions: bra", "titleZh": "控制流指令：bra", "numberedTitle": "9.7.13.3. Control Flow Instructions: bra", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Control Flow Instructions", "parentZh": "控制流指令", "kind": "Instructions", "kindZh": "指令", "summary": "bra", "details": "bra\nBranch to a target and continue execution there.\nSyntax\nDescription\nContinue execution at the target.\nConditional branches are specified by using a guard predicate.\nbra.uni is guaranteed to be non-divergent, i.e. all active threads in a warp that are currently executing this instruction have identical values for the guard predicate and branch target.\nSemantics", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#control-flow-instructions-bra", "tokens": ["bra.uni", "warp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「控制流指令：bra」，归在「指令」。重点关注 关键词 bra.uni、warp，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「控制流指令：bra」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：bra.uni、wa
