nel-parameter-attribute-ptr", "tokens": ["ptr", "space", "align"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Kernel 参数属性：.ptr」，归在「状态空间 / 类型」。重点关注 关键词 ptr、space、align，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Kernel 参数属性：.ptr」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：ptr、space、align。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Device Function Parameters", "titleZh": "Device 函数参数", "numberedTitle": "5.1.6.4. Device Function Parameters", "level": "H4", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Parameter State Space", "parentZh": "Parameter 状态空间", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "PTX ISA version 2.0 extended the use of parameter space to device function parameters. The most common use is for passing objects by value that do not fit within a PTX register, such as C structures larger than 8 bytes. In this case, a byte array in parameter space is...", "details": "PTX ISA version 2.0 extended the use of parameter space to device function parameters.\nThe most common use is for passing objects by value that do not fit within a PTX register, such as C structures larger than 8 bytes.\nExample\nSee the section on function call syntax for more details.\nFunction input parameters may be read via ld.param and function return parameters may be written using st.param ; it is illegal to write to an input parameter or read from a return parameter.\nAside from passing structures by value, .param space is also required whenever a formal parameter has its address taken within the called function.\nIn PTX, the address of a function input parameter may be moved into a register using the mov instruction.\nExample", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#device-function-parameters", "tokens": ["ld.param", "st.param", "param"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Device 函数参数」，归在「状态空间 / 类型」。重点关注 关键词 ld.param、st.param、param，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Device 函数参数」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：ld.param、st.param、param。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Shared State Space", "titleZh": "Shared 状态空间", "numberedTitle": "5.1.7. Shared State Space", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "State Spaces", "parentZh": "状态空间", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "The shared ( .shared ) state space is a memory that is owned by an executing CTA and is accessible to the threads of all the CTAs within a cluster. An address in shared memory can be read and written by any thread in a CTA cluster.", "details": "The shared ( .shared ) state space is a memory that is owned by an executing CTA and is accessible to the threads of all the CTAs within a cluster.\nAn address in shared memory can be read and written by any thread in a CTA cluster.\nAdditional sub-qualifiers ::cta or ::cluster can be specified on instructions with .shared state space to indicate whether the address belongs to the shared memory window of the executing CTA or of any CTA in the cluster respectively.\nThe addresses in the .shared::cta window also fall within the .shared::cluster window.\nVariables declared in .shared state space refer to the memory addresses in the current CTA.\nInstruction mapa gives the .shared::cluster address of the corresponding variable in another CTA in the cluster.\nShared memory typically has some optimizations to support the sharing.\nOne example is broadcast; where all threads read from the same address.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#shared-state-space", "tokens": ["shared"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Shared 状态空间」，归在「状态空间 / 类型」。重点关注 关键词 shared，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Shared 状态空间」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：shared。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Types", "titleZh": "类型", "numberedTitle": "5.2. Types", "level": "H2", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "", "parentZh": "", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "PTX ISA 文档章节：Types", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#types", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「类型」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「类型」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。"}, {"title": "Fundamental Types", "titleZh": "基础类型", "numberedTitle": "5.2.1. Fundamental Types", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Types", "parentZh": "类型", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "In PTX, the fundamental types reflect the native data types supported by the target architectures. A fundamental type specifies both a basic type and a size. Register variables are always of a fundamental type, and instructions operate on these types. The same...", "details": "In PTX, the fundamental types reflect the native data types supported by the target architectures.\nA fundamental type specifies both a basic type and a size.\nTable 8 lists the fundamental type specifiers for each basic type:\nBasic Type | Fundamental Type Specifiers\nSigned integer | .s8 , .s16 , .s32 , .s64\nUnsigned integer | .u8 , .u16 , .u32 , .u64\nFloating-point | .f16 , .f16x2 , .f32 , .f64\nBits (untyped) | .b8 , .b16 , .b32 , .b64 , .b128", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fundamental-types", "tokens": ["s16", "s32", "s64", "u16", "u32", "u64", "f16", "f16x2", "f32", "f64", "b16", "b32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「基础类型」，归在「状态空间 / 类型」。重点关注 关键词 s16、s32、s64、u16、u32，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「基础类型」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：s16、s32、s64、u16、u32、u64、f16、f16x2。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Restricted Use of Sub-Word Sizes", "titleZh": "子字尺寸的受限使用", "numberedTitle": "5.2.2. Restricted Use of Sub-Word Sizes", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Types", "parentZh": "类型", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "The .u8 , .s8 , and .b8 instruction types are restricted to ld , st , add , sub , min , max , neg and cvt instructions. The .f16 floating-point type is allowed in half precision floating point instructions and texture fetch instructions. The .f16x2 floating point type...", "details": "The .u8 , .s8 , and .b8 instruction types are restricted to ld , st , add , sub , min , max , neg and cvt instructions.\nThe .f16 floating-point type is allowed in half precision floating point instructions and texture fetch instructions.\nFor convenience, ld , st , and cvt instructions permit source and destination data operands to be wider than the instruction-type size, so that narrow values may be loaded, stored, and converted using regular-width registers.\nFor example, 8-bit or 16-bit values may be held directly in 32-bit or 64-bit registers when being loaded, stored, or converted to other types and sizes.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#restricted-use-of-sub-word-sizes", "tokens": ["f16", "f16x2"], "summaryZh": "本条整理 PTX ISA 官方文档中的「子字尺寸的受限使用」，归在「状态空间 / 类型」。重点关注 关键词 f16、f16x2，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「子字尺寸的受限使用」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：f16、f16x2。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Alternate Floating-Point Data Formats", "titleZh": "可选浮点数据格式", "numberedTitle": "5.2.3. Alternate Floating-Point Data Formats", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Types", "parentZh": "类型", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "The fundamental floating-point types supported in PTX have implicit bit representations that indicate the number of bits used to store exponent and mantissa. For example, the .f16 type indicates 5 bits reserved for exponent and 10 bits reserved for mantissa. In...", "details": "The fundamental floating-point types supported in PTX have implicit bit representations that indicate the number of bits used to store exponent and mantissa.\nFor example, the .f16 type indicates 5 bits reserved for exponent and 10 bits reserved for mantissa.\nAlternate data formats cannot be used as fundamental types.\nThey are supported as source or destination formats by certain instructions.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#alternate-floating-point-data-formats", "tokens": ["f16"], "summaryZh": "本条整理 PTX ISA 官方文档中的「可选浮点数据格式」，归在「状态空间 / 类型」。重点关注 关键词 f16，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「可选浮点数据格式」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：f16。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Fixed-point Data format", "titleZh": "定点数据格式", "numberedTitle": "5.2.4. Fixed-point Data format", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Types", "parentZh": "类型", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "PTX supports following fixed-point data formats:", "details": "PTX supports following fixed-point data formats:", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fixed-point-data-formats", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「定点数据格式」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「定点数据格式」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Packed Data Types", "titleZh": "Packed 数据类型", "numberedTitle": "5.2.5. Packed Data Types", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Types", "parentZh": "类型", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "Certain PTX instructions operate on two or more sets of inputs in parallel, and produce two or more sets of outputs. Such instructions can use the data stored in a packed format. PTX supports either two or four values of the same scalar data type to be packed into a...", "details": "Certain PTX instructions operate on two or more sets of inputs in parallel, and produce two or more sets of outputs.\nSuch instructions can use the data stored in a packed format.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#packed-data-types", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Packed 数据类型」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Packed 数据类型」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Packed Floating Point Data Types", "titleZh": "Packed 浮点类型", "numberedTitle": "5.2.5.1. Packed Floating Point Data Types", "level": "H4", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Packed Data Types", "parentZh": "Packed 数据类型", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "PTX supports various variants of packed floating point data types. Out of them, only .f16x2 is supported as a fundamental type, while others cannot be used as fundamental types - they are supported as instruction types on certain instructions. When using an instruction...", "details": "PTX supports various variants of packed floating point data types.\nOut of them, only .f16x2 is supported as a fundamental type, while others cannot be used as fundamental types - they are supported as instruction types on certain instructions.\nPacked floating point type | Number of elements contained in a packed format | Type of each element | Register variable type to be used in the declaration\n.f16x2 | Two | .f16 | .f16x2 or .b32\n.f32x2 | .f32 | .b64\n.bf16x2 | .bf16 | .b32\n.e4m3x2 | .e4m3 | .b16\n.e5m2x2 | .e5m2", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#packed-floating-point-data-types", "tokens": ["f16x2", "f16", "b32", "f32x2", "f32", "b64", "bf16x2", "bf16", "e4m3x2", "e4m3", "b16", "e5m2x2"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Packed 浮点类型」，归在「状态空间 / 类型」。重点关注 关键词 f16x2、f16、b32、f32x2、f32，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Packed 浮点类型」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：f16x2、f16、b32、f32x2、f32、b64、bf16x2、bf16。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Packed Integer Data Types", "titleZh": "Packed 整数类型", "numberedTitle": "5.2.5.2. Packed Integer Data Types", "level": "H4", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Packed Data Types", "parentZh": "Packed 数据类型", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "PTX supports four variants of packed integer data types: .u16x2 , .s16x2 , .u8x4 , and .s8x4 . The .u16x2 , .s16x2 packed data types consist of two .u16 or .s16 values. The .u8x4 , .s8x4 packed data types consist of four .u8 or .s8 values. A register variable...", "details": "PTX supports four variants of packed integer data types: .u16x2 , .s16x2 , .u8x4 , and .s8x4 .\nThe .u16x2 , .s16x2 packed data types consist of two .u16 or .s16 values.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#packed-integer-data-types", "tokens": ["u16x2", "s16x2", "u8x4", "s8x4", "u16", "s16"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Packed 整数类型」，归在「状态空间 / 类型」。重点关注 关键词 u16x2、s16x2、u8x4、s8x4、u16，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Packed 整数类型」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：u16x2、s16x2、u8x4、s8x4、u16、s16。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Packed Fixed-Point Data Types", "titleZh": "Packed 定点类型", "numberedTitle": "5.2.5.3. Packed Fixed-Point Data Types", "level": "H4", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Packed Data Types", "parentZh": "Packed 数据类型", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "PTX supports .s2f6x2 packed fixed-point data type consisting of two .s2f6 packed fixed-point values. A register variable containing .s2f6x2 value must be declared with .b16 type. Packed fixed-point data type cannot be used as fundamental type and is only supported as...", "details": "PTX supports .s2f6x2 packed fixed-point data type consisting of two .s2f6 packed fixed-point values.\nA register variable containing .s2f6x2 value must be declared with .b16 type.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#packed-fixed-point-data-types", "tokens": ["s2f6x2", "s2f6", "b16"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Packed 定点类型」，归在「状态空间 / 类型」。重点关注 关键词 s2f6x2、s2f6、b16，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Packed 定点类型」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：s2f6x2、s2f6、b16。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Variables", "titleZh": "变量", "numberedTitle": "5.4. Variables", "level": "H2", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "", "parentZh": "", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "In PTX, a variable declaration describes both the variable’s type and its state space. In addition to fundamental types, PTX supports types for simple aggregate objects such as vectors and arrays.", "details": "In PTX, a variable declaration describes both the variable’s type and its state space.\nIn addition to fundamental types, PTX supports types for simple aggregate objects such as vectors and arrays.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#variables", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「变量」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「变量」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Variable Declarations", "titleZh": "变量声明", "numberedTitle": "5.4.1. Variable Declarations", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Variables", "parentZh": "变量", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "All storage for data is specified with variable declarations. Every variable must reside in one of the state spaces enumerated in the previous section.", "details": "All storage for data is specified with variable declarations.\nEvery variable must reside in one of the state spaces enumerated in the previous section.\nA variable declaration names the space in which the variable resides, its type and size, its name, an optional array size, an optional initializer, and an optional fixed address for the variable.\nPredicate variables may only be declared in the register state space.\nExamples", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#variable-declarations", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「变量声明」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「变量声明」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Vectors", "titleZh": "Vector", "numberedTitle": "5.4.2. Vectors", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Variables", "parentZh": "变量", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "Limited-length vector types are supported. Vectors of length 2 and 4 of any non-predicate fundamental type can be declared by prefixing the type with .v2 or .v4 . Vectors must be based on a fundamental type, and they may reside in the register space. Vectors cannot...", "details": "Limited-length vector types are supported.\nVectors of length 2 and 4 of any non-predicate fundamental type can be declared by prefixing the type with .v2 or .v4 .\nExamples\nBy default, vector variables are aligned to a multiple of their overall size (vector length times base-type size), to enable vector load and store instructions which require addresses aligned to a multiple of the access size.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#vectors", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Vector」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Vector」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Array Declarations", "titleZh": "数组声明", "numberedTitle": "5.4.3. Array Declarations", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Variables", "parentZh": "变量", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "Array declarations are provided to allow the programmer to reserve space. To declare an array, the variable name is followed with dimensional declarations similar to fixed-size array declarations in C. The size of each dimension is a constant expression.", "details": "Array declarations are provided to allow the programmer to reserve space.\nTo declare an array, the variable name is followed with dimensional declarations similar to fixed-size array declarations in C.\nExamples\nThe size of the array specifies how many elements should be reserved.\nFor the declaration of array kernel above, 19*19 = 361 halfwords are reserved, for a total of 722 bytes.\nWhen declared with an initializer, the first dimension of the array may be omitted.\nThe size of the first array dimension is determined by the number of elements in the array initializer.\nExamples", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#array-declarations", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「数组声明」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「数组声明」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Initializers", "titleZh": "初始化器", "numberedTitle": "5.4.4. Initializers", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Variables", "parentZh": "变量", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "Declared variables may specify an initial value using a syntax similar to C/C++, where the variable name is followed by an equals sign and the initial value or values for the variable. A scalar takes a single value, while vectors and arrays take nested lists of values...", "details": "Declared variables may specify an initial value using a syntax similar to C/C++, where the variable name is followed by an equals sign and the initial value or values for the variable.\nA scalar takes a single value, while vectors and arrays take nested lists of values inside of curly braces (the nesting matches the dimensionality of the declaration).\nAs in C, array initializers may be incomplete, i.e., the number of initializer elements may be less than the extent of the corresponding array dimension, with remaining array locations initialized to the default value for the specified array type.\nExamples\nis equivalent to\nCurrently, variable initialization is supported only for constant and global state spaces.\nVariables in constant and global state spaces with no explicit initializer are initialized to zero by default.\nVariable names appearing in initializers represent the address of the variable; this can be used to statically initialize a pointer to a variable.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#initializers", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「初始化器」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「初始化器」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Alignment", "titleZh": "对齐", "numberedTitle": "5.4.5. Alignment", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Variables", "parentZh": "变量", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "Byte alignment of storage for all addressable variables can be specified in the variable declaration. Alignment is specified using an optional .align byte-count specifier immediately following the state-space specifier. The variable will be aligned to an address which...", "details": "Byte alignment of storage for all addressable variables can be specified in the variable declaration.\nAlignment is specified using an optional .align byte-count specifier immediately following the state-space specifier.\nThe default alignment for scalar and array variables is to a multiple of the base-type size.\nThe default alignment for vector variables is to a multiple of the overall vector size.\nExamples\nNote that all PTX instructions that access memory require that the address be aligned to a multiple of the access size.\nThe access size of a memory instruction is the total number of bytes accessed in memory.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#alignment", "tokens": ["align"], "summaryZh": "本条整理 PTX ISA 官方文档中的「对齐」，归在「状态空间 / 类型」。重点关注 关键词 align，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「对齐」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：align。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parameterized Variable Names", "titleZh": "参数化变量名", "numberedTitle": "5.4.6. Parameterized Variable Names", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Variables", "parentZh": "变量", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "Since PTX supports virtual registers, it is quite common for a compiler frontend to generate a large number of register names. Rather than require explicit declaration of every name, PTX supports a syntax for creating a set of variables having a common prefix string...", "details": "Since PTX supports virtual registers, it is quite common for a compiler frontend to generate a large number of register names.\nRather than require explicit declaration of every name, PTX supports a syntax for creating a set of variables having a common prefix string appended with integer suffixes.\nFor example, suppose a program uses a large number, say one hundred, of .b32 variables, named %r0 , %r1 , …, %r99 .\nThese 100 register variables can be declared as follows:\nThis shorthand syntax may be used with any of the fundamental types and with any state space, and may be preceded by an alignment specifier.\nArray variables cannot be declared this way, nor are initializers permitted.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parameterized-variable-names", "tokens": ["b32", "%r0", "%r1", "%r99"], "summaryZh": "本条整理 PTX ISA 官方文档中的「参数化变量名」，归在「状态空间 / 类型」。重点关注 关键词 b32、%r0、%r1、%r99，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「参数化变量名」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：b32、%r0、%r1、%r99。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Variable Attributes", "titleZh": "变量属性", "numberedTitle": "5.4.7. Variable Attributes", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Variables", "parentZh": "变量", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "Variables may be declared with an optional .attribute directive which allows specifying special attributes of variables. Keyword .attribute is followed by attribute specification inside parenthesis. Multiple attributes are separated by comma.", "details": "Variables may be declared with an optional .attribute directive which allows specifying special attributes of variables.\nKeyword .attribute is followed by attribute specification inside parenthesis.\nVariable and Function Attribute Directive: .attribute describes the .attribute directive.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#variable-attributes", "tokens": ["attribute"], "summaryZh": "本条整理 PTX ISA 官方文档中的「变量属性」，归在「状态空间 / 类型」。重点关注 关键词 attribute，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「变量属性」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：attribute。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Variable and Function Attribute Directive: .attribute", "titleZh": "变量与函数属性 directive：.attribute", "numberedTitle": "5.4.8. Variable and Function Attribute Directive: .attribute", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Variables", "parentZh": "变量", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": ".attribute", "details": ".attribute\nVariable and function attributes\nDescription\nUsed to specify special attributes of a variable or a function.\nThe following attributes are supported.\nPTX ISA Notes\nIntroduced in PTX ISA version 4.0.\nSupport for function attributes introduced in PTX ISA version 8.0.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#variable-and-function-attribute-directive-attribute", "tokens": ["attribute"], "summaryZh": "本条整理 PTX ISA 官方文档中的「变量与函数属性 directive：.attribute」，归在「状态空间 / 类型」。重点关注 关键词 attribute，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「变量与函数属性 directive：.attribute」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：attribute。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Tensors", "titleZh": "Tensor", "numberedTitle": "5.5. Tensors", "level": "H2", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "", "parentZh": "", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "A tensor is a multi-dimensional matrix structure in the memory. Tensor is defined by the following properties:", "details": "A tensor is a multi-dimensional matrix structure in the memory.\nTensor is defined by the following properties:\nDimensionality\nDimension sizes across each dimension\nIndividual element types\nTensor stride across each dimension\nPTX supports instructions which can operate on the tensor data.\nPTX Tensor instructions include:", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensors", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Tensor」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Tensor」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Tensor Dimension, size and format", "titleZh": "Tensor 维度、尺寸与格式", "numberedTitle": "5.5.1. Tensor Dimension, size and format", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Tensors", "parentZh": "Tensor", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "Tensors can have dimensions: 1D, 2D, 3D, 4D or 5D.", "details": "Tensors can have dimensions: 1D, 2D, 3D, 4D or 5D.\nEach dimension has a size which represents the number of elements along the dimension.\nThe elements can have one the following types:\nBit-sized type: .b32 , .b64\nSub-byte types: .b4x16 , .b4x16_p64 , .b6x16_p32 , .b6p2x16\nInteger: .u8 , .u16 , .u32 , .s32 , .u64 , .s64\nFloating point and alternate floating point: .f16 , .bf16 , .tf32 , .f32 , .f64 (rounded to nearest even).\nTensor can have padding at the end in each of the dimensions to provide alignment for the data in the subsequent dimensions.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-dimension-size-format", "tokens": ["b32", "b64", "b4x16", "b4x16_p64", "b6x16_p32", "b6p2x16", "u16", "u32", "s32", "u64", "s64", "f16"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Tensor 维度、尺寸与格式」，归在「状态空间 / 类型」。重点关注 关键词 b32、b64、b4x16、b4x16_p64、b6x16_p32，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Tensor 维度、尺寸与格式」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：b32、b64、b4x16、b4x16_p64、b6x16_p32、b6p2x16、u16、u32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Sub-byte Types", "titleZh": "Sub-byte 类型", "numberedTitle": "5.5.1.1. Sub-byte Types", "level": "H4", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Tensor Dimension, size and format", "parentZh": "Tensor 维度、尺寸与格式", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "PTX ISA 文档章节：Sub-byte Types", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-dimension-size-format-sub-bytes", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Sub-byte 类型」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Sub-byte 类型」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。"}, {"title": "Padding and alignment of the sub-byte types", "titleZh": "Sub-byte 类型的 padding 与对齐", "numberedTitle": "5.5.1.1.1. Padding and alignment of the sub-byte types", "level": "H5", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Sub-byte Types", "parentZh": "Sub-byte 类型", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "The sub-byte types are expected to packed contiguously in the global memory and the Tensor copy instruction will expand them by appending empty spaces as shown below:", "details": "The sub-byte types are expected to packed contiguously in the global memory and the Tensor copy instruction will expand them by appending empty spaces as shown below:\nType .b4x16 : With this type, there is no padding involved and the packed sixteen .b4 elements in a 64-bits container is copied as is between the shared memory and the global memory.\nType .b4x16_p64 : With this type, sixteen contiguous 4-bits of data is copied from global memory to the shared memory with the append of 64-bits of padding as shown in Figure 5 Figure 5 Layout for .b4x16_p64 The padded region that gets added is un-initialized.\nType .b6x16_p32 : With this type, sixteen 6-bits of data is copied from global memory to the shared memory with an append of 32-bits of padding as shown in Figure 6 Figure 6 Layout for .b6x16_p32 The padded region that gets added is un-initialized.\nType .b6p2x16 : With this type, sixteen elements, each containing 6-bits of data at the LSB and 2-bits of padding at the MSB, are copied from shared memory into the global memory by discarding the 2-bits of padding data and packing the 6-bits data contiguously as shown in Figure 7 Figure 7 Layout for .b6p2x16\nIn case of .b6x16_p32 and .b4x16_p64 , the padded region that gets added is un-initialized.\nThe types .b6x16_p32 and .b6p2x16 share the same encoding value in the descriptor (value 15) as the two types are applicable for different types of tensor copy operations:\nType | Valid Tensor Copy Direction", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-dimension-size-format-sub-bytes-padding-align", "tokens": ["b4x16", "b4x16_p64", "b6x16_p32", "b6p2x16"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Sub-byte 类型的 padding 与对齐」，归在「状态空间 / 类型」。重点关注 关键词 b4x16、b4x16_p64、b6x16_p32、b6p2x16，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Sub-byte 类型的 padding 与对齐」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：b4x16、b4x16_p64、b6x16_p32、b6p2x16。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Tensor Access Modes", "titleZh": "Tensor 访问模式", "numberedTitle": "5.5.2. Tensor Access Modes", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Tensors", "parentZh": "Tensor", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "Tensor data can be accessed in two modes:", "details": "Tensor data can be accessed in two modes:\nTiled mode: In tiled mode, the source multi-dimensional tensor layout is preserved at the destination.\nIm2col mode: In im2col mode, the elements in the Bounding Box of the source tensor are rearranged into columns at the destination. Refer here for more details.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-access-modes", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Tensor 访问模式」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Tensor 访问模式」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Tiled Mode", "titleZh": "Tiled 模式", "numberedTitle": "5.5.3. Tiled Mode", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Tensors", "parentZh": "Tensor", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "This section talks about how Tensor and Tensor access work in tiled mode.", "details": "This section talks about how Tensor and Tensor access work in tiled mode.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-tiled-mode", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Tiled 模式」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Tiled 模式」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Bounding Box", "titleZh": "Bounding Box", "numberedTitle": "5.5.3.1. Bounding Box", "level": "H4", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Tiled Mode", "parentZh": "Tiled 模式", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "A tensor can be accessed in chunks known as Bounding Box . The Bounding Box has the same dimensionality as the tensor they are accessing into. Size of each bounding Box must be a multiple of 16 bytes. The address of the bounding Box must also be aligned to 16 bytes.", "details": "A tensor can be accessed in chunks known as Bounding Box .\nThe Bounding Box has the same dimensionality as the tensor they are accessing into.\nBounding Box has the following access properties:\nBounding Box dimension sizes\nOut of boundary access mode\nTraversal strides\nThe tensor-coordinates, specified in the PTX tensor instructions, specify the starting offset of the bounding box.\nStarting offset of the bounding box along with the rest of the bounding box information together are used to determine the elements which are to be accessed.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-tiled-mode-bounding-box", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Bounding Box」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Bounding Box」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Traversal-Stride", "titleZh": "Traversal-Stride", "numberedTitle": "5.5.3.2. Traversal-Stride", "level": "H4", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Tiled Mode", "parentZh": "Tiled 模式", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "While the Bounding Box is iterating the tensor across a dimension, the traversal stride specifies the exact number of elements to be skipped. If no jump over is required, default value of 1 must be specified.", "details": "While the Bounding Box is iterating the tensor across a dimension, the traversal stride specifies the exact number of elements to be skipped.\nIf no jump over is required, default value of 1 must be specified.\nThe traversal stride in dimension 0 can be used for the Interleave layout .\nFor non-interleaved layout, the traversal stride in dimension 0 must always be 1.\nFigure 8 illustrates tensor, tensor size, tensor stride, Bounding Box size and traversal stride.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-tiled-mode-traversal-stride", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Traversal-Stride」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Traversal-Stride」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Out of Boundary Access", "titleZh": "越界访问", "numberedTitle": "5.5.3.3. Out of Boundary Access", "level": "H4", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Tiled Mode", "parentZh": "Tiled 模式", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "PTX Tensor operation can detect and handle the case when the Bounding Box crosses the tensor boundary in any dimension. There are 2 modes:", "details": "PTX Tensor operation can detect and handle the case when the Bounding Box crosses the tensor boundary in any dimension.\nThere are 2 modes:\nZero fill mode: Elements in the Bounding Box which fall outside of the tensor boundary are set to 0.\nOOB-NaN fill mode: Elements in the Bounding Box which fall outside of the tensor boundary are set to a special NaN called OOB-NaN .\nFigure 9 shows an example of the out of boundary access.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-tiled-mode-oob-access", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「越界访问」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「越界访问」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": ".tile::scatter4 and .tile::gather4 modes", "titleZh": ".tile::scatter4 and .tile::gather4 modes", "numberedTitle": "5.5.3.4. .tile::scatter4 and .tile::gather4 modes", "level": "H4", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Tiled Mode", "parentZh": "Tiled 模式", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "These modes are similar to the tiled mode with restriction that these modes work only on 2D tensor data. Tile::scatter4 and Tile::gather4 modes are used to access multiple non-contiguous rows of tensor data.", "details": "These modes are similar to the tiled mode with restriction that these modes work only on 2D tensor data.\nTile::scatter4 and Tile::gather4 modes are used to access multiple non-contiguous rows of tensor data.\nIn Tile::scatter4 mode single 2D source tensor is divided into four rows in the 2D destination tensor.\nIn Tile::gather4 mode four rows in the source 2D tensor are combined to form single 2D destination tensor.\nThese modes work on four rows and hence the instruction will take:\nfour tensor coordinates across the dimension 0\none tensor coordinate across the dimension 1\nThe interleave layout is not supported for .tile::scatter4 and .tile::gather4 modes.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-tiled-scatter4-gather4-modes", "tokens": ["tile"], "summaryZh": "本条整理 PTX ISA 官方文档中的「.tile::scatter4 and .tile::gather4 modes」，归在「状态空间 / 类型」。重点关注 关键词 tile，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「.tile::scatter4 and .tile::gather4 modes」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：tile。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Bounding Box", "titleZh": "Bounding Box", "numberedTitle": "5.5.3.4.1. Bounding Box", "level": "H5", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": ".tile::scatter4 and .tile::gather4 modes", "parentZh": ".tile::scatter4 and .tile::gather4 modes", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "For Tile::scatter4 and Tile::gather4 modes, four request coordinates will form four Bounding Boxes in the tensor space.", "details": "For Tile::scatter4 and Tile::gather4 modes, four request coordinates will form four Bounding Boxes in the tensor space.\nFigure 10 shows an example of the same with start coordinates (1, 2), (1, 5), (1, 0) and (1, 9).\nThe size of the bounding box in the dimension 0 represents the length of the rows.\nThe size of the bounding box in the dimension 1 must be one.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-tiled-scatter4-gather4-modes-bounding-box", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Bounding Box」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Bounding Box」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "im2col mode", "titleZh": "im2col 模式", "numberedTitle": "5.5.4. im2col mode", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Tensors", "parentZh": "Tensor", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "Im2col mode supports the following tensor dimensions : 3D, 4D and 5D. In this mode, the tensor data is treated as a batch of images with the following properties:", "details": "Im2col mode supports the following tensor dimensions : 3D, 4D and 5D.\nIn this mode, the tensor data is treated as a batch of images with the following properties:\nN : number of images in the batch\nD, H, W : size of a 3D image (depth, height and width)\nC: channels per image element\nThe above properties are associated with 3D, 4D and 5D tensors as follows:\nDimension | N/D/H/W/C applicability\n3D | NWC", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-im2col-mode", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「im2col 模式」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「im2col 模式」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Bounding Box", "titleZh": "Bounding Box", "numberedTitle": "5.5.4.1. Bounding Box", "level": "H4", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "im2col mode", "parentZh": "im2col 模式", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "In im2col mode, the Bounding Box is defined in DHW space. Boundaries along other dimensions are specified by Pixels-per-Column and Channels-per-Pixel parameters as described below.", "details": "In im2col mode, the Bounding Box is defined in DHW space.\nBoundaries along other dimensions are specified by Pixels-per-Column and Channels-per-Pixel parameters as described below.\nThe dimensionality of the Bounding Box is two less than the tensor dimensionality.\nThe following properties describe how to access of the elements in im2col mode:\nBounding-Box Lower-Corner\nBounding-Box Upper-Corner\nPixels-per-Column\nChannels-per-Pixel", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-im2col-mode-bounding-box", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Bounding Box」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Bounding Box」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Traversal Stride", "titleZh": "Traversal stride", "numberedTitle": "5.5.4.2. Traversal Stride", "level": "H4", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "im2col mode", "parentZh": "im2col 模式", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "The traversal stride, in im2col mode, does not impact the total number of elements (or pixels) being accessed unlike the tiled mode. Pixels-per-Column determines the total number of elements being accessed, in im2col mode.", "details": "The traversal stride, in im2col mode, does not impact the total number of elements (or pixels) being accessed unlike the tiled mode.\nPixels-per-Column determines the total number of elements being accessed, in im2col mode.\nThe number of elements traversed along the D, H and W dimensions is strided by the traversal stride for that dimension.\nThe following example with Figure 15 illustrates accesse with traversal-strides:", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-im2col-mode-traversal-stride", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Traversal stride」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Traversal stride」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Out of Boundary Access", "titleZh": "越界访问", "numberedTitle": "5.5.4.3. Out of Boundary Access", "level": "H4", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "im2col mode", "parentZh": "im2col 模式", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "In im2col mode, when the number of requested pixels in NDHW space specified by Pixels-per-Column exceeds the number of available pixels in the image batch then out-of-bounds access is performed.", "details": "In im2col mode, when the number of requested pixels in NDHW space specified by Pixels-per-Column exceeds the number of available pixels in the image batch then out-of-bounds access is performed.\nSimilar to tiled mode, zero fill or OOB-NaN fill can be performed based on the Fill-Mode specified.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-im2col-mode-oob-access", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「越界访问」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「越界访问」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "im2col::w and im2col::w::128 modes", "titleZh": "im2col::w and im2col::w::128 modes", "numberedTitle": "5.5.5. im2col::w and im2col::w::128 modes", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Tensors", "parentZh": "Tensor", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "These modes are similar to the im2col mode with the restriction that elements are accessed across the W dimension only while keeping the H and D dimension constant.", "details": "These modes are similar to the im2col mode with the restriction that elements are accessed across the W dimension only while keeping the H and D dimension constant.\nAll the constraints and rules of the im2col mode apply to these modes as well.\nNote that the valid Swizzling Modes must be set.\nThe number of elements accessed in the im2col::w::128 mode is fixed and is equal to 128.\nThe number of elements accessed in the im2col::w mode depends on the Pixels-per-Column field in the TensorMap.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-im2col-w-w128-modes", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「im2col::w and im2col::w::128 modes」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「im2col::w and im2col::w::128 modes」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Bounding Box", "titleZh": "Bounding Box", "numberedTitle": "5.5.5.1. Bounding Box", "level": "H4", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "im2col::w and im2col::w::128 modes", "parentZh": "im2col::w and im2col::w::128 modes", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "In these modes, the size of the bounding box in D and H dimensions are 1.", "details": "In these modes, the size of the bounding box in D and H dimensions are 1.\nThe D and H dimensions in the tensor coordinates argument in the PTX instruction specify the position of the bounding box in the tensor space.\nThe Bounding-Box Lower-Corner-W and Bounding-Box Upper-Corner-W specify the two opposite corners of the Bounding Box in the W dimension.\nThe W dimension in the tensor coordinates argument in the PTX instruction specify the location of the first element that is to be accessed in the bounding box.\nNumber of pixels loaded in im2col::w mode is as specified by Pixels-per-Column in the TensorMap.\nNumber of pixels loaded in im2col::w::128 mode is always 128.\nFigure 16 shows an example of the im2col::w and im2col::w:128 modes.\nThe first element can lie outside of the Bounding Box in the W-dimension only and only on the left side of the Bounding Box.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-im2col-w-w128-modes-bounding-box", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Bounding Box」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Bounding Box」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Traversal Stride", "titleZh": "Traversal stride", "numberedTitle": "5.5.5.2. Traversal Stride", "level": "H4", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "im2col::w and im2col::w::128 modes", "parentZh": "im2col::w and im2col::w::128 modes", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "This is similar to im2col mode with the exception of that the number of elements traversed along only the W dimension is strided by the traversal stride as specified in the TensorMap.", "details": "This is similar to im2col mode with the exception of that the number of elements traversed along only the W dimension is strided by the traversal stride as specified in the TensorMap.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-im2col-w-w128-modes-traversal-stride", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Traversal stride」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Traversal stride」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "wHalo", "titleZh": "wHalo", "numberedTitle": "5.5.5.3. wHalo", "level": "H4", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "im2col::w and im2col::w::128 modes", "parentZh": "im2col::w and im2col::w::128 modes", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "In im2col::w mode, the wHalo argument in the PTX instruction specifies how many filter halo elements must be loaded at the end of the image.", "details": "In im2col::w mode, the wHalo argument in the PTX instruction specifies how many filter halo elements must be loaded at the end of the image.\nIn im2col::w::128 mode, the halo elements are loaded after every 32 elements in the bounding box along the W dimension.\nThe wHalo argument in the PTX instruction specifies how many halo elements must be loaded after every 32 elements.\nFollowing is an example of .im2col::w mode access:\nA tensor copy operation with the above parameters loads 128 pixels and the two halo pixels as shown in Figure 18 .\nThe halo pixels are always loaded in the shared memory next to the main row pixels as shown in Figure 18 .\nFollowing is an example of .im2col::w::128 mode access:\nA tensor copy operation with the above parameters loads 128 elements such that after every 32 elements, wHalo number of elements are loaded as shown in Figure 19 .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-im2col-w-w128-modes-whalo", "tokens": ["im2col"], "summaryZh": "本条整理 PTX ISA 官方文档中的「wHalo」，归在「状态空间 / 类型」。重点关注 关键词 im2col，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「wHalo」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：im2col。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "wOffset", "titleZh": "wOffset", "numberedTitle": "5.5.5.4. wOffset", "level": "H4", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "im2col::w and im2col::w::128 modes", "parentZh": "im2col::w and im2col::w::128 modes", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "In the convolution calculations, the same elements along the W dimension are reused for different locations within the convolution filter footprint. Based on the number of times a pixel is used, the pixels may be loaded into different shared memory buffers. Each buffer...", "details": "In the convolution calculations, the same elements along the W dimension are reused for different locations within the convolution filter footprint.\nBased on the number of times a pixel is used, the pixels may be loaded into different shared memory buffers.\nThe wOffset argument in the tensor copy and prefetch instruction adjusts the source pixel location for each buffer.\nThe exact position of the buffer is adjusted along the W dimension using the following formula:\nFollowing are examples of tensor copy to multiple buffers with various wHalo and wOffset values:\nExample 1:\nExample 2:", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-im2col-w-w128-modes-woffset", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「wOffset」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「wOffset」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Interleave layout", "titleZh": "Interleave 布局", "numberedTitle": "5.5.6. Interleave layout", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Tensors", "parentZh": "Tensor", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "Tensor can be interleaved and the following interleave layouts are supported:", "details": "Tensor can be interleaved and the following interleave layouts are supported:\nNo interleave (NDHWC)\n8 byte interleave (NC/8DHWC8) : C8 utilizes 16 bytes in memory assuming 2B per channel.\n16 byte interleave (NC/16HWC16) : C16 utilizes 32 bytes in memory assuming 4B per channel.\nThe C information is organized in slices where sequential C elements are grouped in 16 byte or 32 byte quantities.\nIf the total number of channels is not a multiple of the number of channels per slice, then the last slice must be padded with zeros to make it complete 16B or 32B slice.\nInterleaved layouts are supported only for the dimensionalities : 3D, 4D and 5D.\nThe interleave layout is not supported for .im2col::w and .im2col::w::128 modes.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-interleaved-layout", "tokens": ["im2col"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Interleave 布局」，归在「状态空间 / 类型」。重点关注 关键词 im2col，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Interleave 布局」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：im2col。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Swizzling Modes", "titleZh": "Swizzling 模式", "numberedTitle": "5.5.7. Swizzling Modes", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Tensors", "parentZh": "Tensor", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "The layout of the data in the shared memory can be different to that of global memory, for access performance reasons. The following describes various swizzling modes:", "details": "The layout of the data in the shared memory can be different to that of global memory, for access performance reasons.\nThe following describes various swizzling modes:\nNo swizzle mode: There is no swizzling in this mode and the destination data layout is exactly similar to the source data layout. 0 1 2 3 4 5 6 7 0 1 2 3 4 5 6 7 … Pattern repeats …\n32 byte swizzle mode: The following table, where each elements (numbered cell) is 16 byte and the starting address is 256 bytes aligned, shows the pattern of the destination data layout: 0 1 2 3 4 5 6 7 1 0 3 2 5 4 7 6 … Pattern repeats … An example of the 32 byte swizzle mode for NC/(32B)HWC(32B) tensor of 1x2x10x10xC16 dimension, with the innermost dimension holding slice of 16 channels with 2 byte/channel, is shown in Figure 25 . Figure 25 32-byte swizzle mode example Figure 26 shows the two fragments of the tensor : one for C/(32B) = 0 and another for C/(32B) = 1. Figure 26 32-byte swizzle mode fragments Figure 27 shows the destination data layout with 32 byte swizzling. Figure 27 32-byte swizzle mode destination data layout\n64 byte swizzle mode: The following table, where each elements (numbered cell) is 16 byte and the starting address is 512 bytes aligned, shows the pattern of the destination data layout: 0 1 2 3 4 5 6 7 1 0 3 2 5 4 7 6 2 3 0 1 6 7 4 5 3 2 1 0 7 6 5 4 … Pattern repeats … An example of the 64 byte swizzle mode for NHWC tensor of 1x10x10x64 dimension, with 2 bytes / channel and 32 channels, is shown in Figure 28 . Figure 28 64-byte swizzle mode example Each colored cell represents 8 channels. Figure 29 shows the source data layout. Figure 29 64-byte swizzle mode source data layout Figure 30 shows the destination data layout with 64 byte swizzling. Figure 30 64-byte swizzle mode destination data layout\n96 byte swizzle mode: The following table where each element (numbered cell) is 16 byte shows the swizzling pattern at the destination data layout: 0 1 2 3 4 5 6 7 1 0 3 2 5 4 7 6 … Pattern repeats … An example of the data layout in global memory and its swizzled data layout in shared memory where each element (colored cell) is 16 bytes and the starting address is 256 bytes aligned is shown in Figure 31 . Figure 31 96-byte swizzle mode example\n128 byte swizzle mode: The 128-byte swizzling mode supports the following sub-modes: 16-byte atomicity sub-mode: In this sub-mode, the 16-byte of data is kept intact while swizzling. The following table, where each elements (numbered cell) is 16 byte and the starting address is 1024 bytes aligned, shows the pattern of the destination data layout: 0 1 2 3 4 5 6 7 1 0 3 2 5 4 7 6 2 3 0 1 6 7 4 5 3 2 1 0 7 6 5 4 4 5 6 7 0 1 2 3 5 4 7 6 1 0 3 2 6 7 4 5 2 3 0 1 7 6 5 4 3 2 1 0 … Pattern repeats … An example of the 128 byte swizzle mode for NHWC tensor of 1x10x10x64 dimension, with 2 bytes / channel and 64 channels, is shown in Figure 32 . Figure 32 128-byte swizzle mode example Each colored cell represents 8 channels. Figure 33 shows the source data layout. Figure 33 128-byte swizzle mode source data layout Figure 34 shows the destination data layout with 128 byte swizzling. Figure 34 128-byte swizzle mode destination data layout 32-byte atomicity sub-mode: In this sub-mode, the 32-byte of data is kept intact while swizzling. The following table where each element (numbered cell) is 16 byte shows the swizzling pattern at the destination data layout: 0 1 2 3 4 5 6 7 2 3 0 1 6 7 4 5 4 5 6 7 0 1 2 3 6 7 4 5 2 3 0 1 … Pattern repeats … This sub-mode requires 32 byte alignment at shared memory. An example of the data layout in global memory and its swizzled data layout in shared memory where each element (colored cell) is 16 bytes is shown in Figure 35 Figure 35 128-byte swizzle mode example with 32-byte atomicity 32-byte atomicity with 8-byte flip sub-mode: The swizzling pattern for this sub-mode is similar to the 32-byte atomicity sub-mode except that there is a flip of adjacent 8-bytes within the 16-byte data at every alternate shared memory line. Note that this mode is legal only when cp.async.bulk.tensor specifies the copy direction as .shared::cluster.global or otherwise .shared::cta.global . An example of the data layout in global memory and its swizzled data layout in shared memory where each element (colored cell) is 16 bytes (two 8-byte sub-elements for each 16-byte colored cell are shown to show the flip) is shown in Figure 36 Figure 36 128-byte swizzle mode example with 32-byte atomicity with 8-byte flip 64-byte atomicity sub-mode: In this sub-mode, the 64-byte of data is kept intact while swizzling. The following table where each element (numbered cell) is 16 byte shows the swizzling pattern at the destination data layout: 0 1 2 3 4 5 6 7 4 5 6 7 0 1 2 3 … Pattern repeats … This sub-mode requires 64-byte alignment at shared memory. An example of the data layout in global memory and its swizzled data layout in shared memory where each element (colored cell) is 16 bytes is shown in Figure 37 Figure 37 128-byte swizzle mode example with 64-byte atomicity\nTable 14 lists the valid combination of swizzle-atomicity with the swizzling-mode.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-swizzling-modes", "tokens": ["cp.async.bulk.tensor", "shared", "cluster.global", "cta.global"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Swizzling 模式」，归在「状态空间 / 类型」。重点关注 关键词 cp.async.bulk.tensor、shared、cluster.global、cta.global，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Swizzling 模式」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：cp.async.bulk.tensor、shared、cluster.global、cta.global。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Tensor-map", "titleZh": "Tensor-map", "numberedTitle": "5.5.8. Tensor-map", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Tensors", "parentZh": "Tensor", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "The tensor-map is a 128-byte opaque object either in .const space or .param (kernel function parameter) space or .global space which describes the tensor properties and the access properties of the tensor data described in previous sections.", "details": "The tensor-map is a 128-byte opaque object either in .const space or .param (kernel function parameter) space or .global space which describes the tensor properties and the access properties of the tensor data described in previous sections.\nTensor-Map can be created using CUDA APIs.\nRefer to CUDA programming guide for more details.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-tensormap", "tokens": ["const", "param", "global"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Tensor-map」，归在「状态空间 / 类型」。重点关注 关键词 const、param、global，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Tensor-map」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：const、param、global。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Instruction Operands", "titleZh": "指令操作数", "numberedTitle": "6. Instruction Operands", "level": "H1", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "", "parentZh": "", "kind": "Instructions", "kindZh": "指令", "summary": "PTX ISA 文档章节：Instruction Operands", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#instruction-operands", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「指令操作数」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「指令操作数」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。"}, {"title": "Operand Type Information", "titleZh": "操作数类型信息", "numberedTitle": "6.1. Operand Type Information", "level": "H2", "chapter": "Instruction Operands", "chapterZh": "指令操作数", "parent": "", "parentZh": "", "kind": "Instructions", "kindZh": "指令", "summary": "All operands in instructions have a known type from their declarations. Each operand type must be compatible with the type determined by the instruction template and instruction type. There is no automatic conversion between types.", "details": "All operands in instructions have a known type from their declarations.\nEach operand type must be compatible with the type determined by the instruction template and instruction type.\nThe bit-size type is compatible with every type having the same size.\nInteger types of a common size are compatible with each other.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#operand-type-information", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「操作数类型信息」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「操作数类型信息」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Source Operands", "titleZh": "源操作数", "numberedTitle": "6.2. Source Operands", "level": "H2", "chapter": "Instruction Operands", "chapterZh": "指令操作数", "parent": "", "parentZh": "", "kind": "Instructions", "kindZh": "指令", "summary": "The source operands are denoted in the instruction descriptions by the names a , b , and c . PTX describes a load-store machine, so operands for ALU instructions must all be in variables declared in the .reg register state space. For most operations, the sizes of the...", "details": "The source operands are denoted in the instruction descriptions by the names a , b , and c .\nPTX describes a load-store machine, so operands for ALU instructions must all be in variables declared in the .reg register state space.\nThe cvt (convert) instruction takes a variety of operand types and sizes, as its job is to convert from nearly any data type to any other data type (and size).\nThe ld , st , mov , and cvt instructions copy data from one location to another.\nInstructions ld and st move data from/to addressable state spaces to/from registers.\nMost instructions have an optional predicate guard that controls conditional execution, and a few instructions have additional predicate source operands.\nPredicate operands are denoted by the names p , q , r , s .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#source-operands", "tokens": ["reg"], "summaryZh": "本条整理 PTX ISA 官方文档中的「源操作数」，归在「指令」。重点关注 关键词 reg，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「源操作数」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：reg。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Destination Operands", "titleZh": "目标操作数", "numberedTitle": "6.3. Destination Operands", "level": "H2", "chapter": "Instruction Operands", "chapterZh": "指令操作数", "parent": "", "parentZh": "", "kind": "Instructions", "kindZh": "指令", "summary": "PTX instructions that produce a single result store the result in the field denoted by d (for destination) in the instruction descriptions. The result operand is a scalar or vector variable in the register state space.", "details": "PTX instructions that produce a single result store the result in the field denoted by d (for destination) in the instruction descriptions.\nThe result operand is a scalar or vector variable in the register state space.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#destination-operands", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「目标操作数」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「目标操作数」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Using Addresses, Arrays, and Vectors", "titleZh": "使用地址、数组与 Vector", "numberedTitle": "6.4. Using Addresses, Arrays, and Vectors", "level": "H2", "chapter": "Instruction Operands", "chapterZh": "指令操作数", "parent": "", "parentZh": "", "kind": "Instructions", "kindZh": "指令", "summary": "Using scalar variables as operands is straightforward. The interesting capabilities begin with addresses, arrays, and vectors.", "details": "Using scalar variables as operands is straightforward.\nThe interesting capabilities begin with addresses, arrays, and vectors.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#using-addresses-arrays-and-vectors", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「使用地址、数组与 Vector」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「使用地址、数组与 Vector」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Addresses as Operands", "titleZh": "作为操作数的地址", "numberedTitle": "6.4.1. Addresses as Operands", "level": "H3", "chapter": "Instruction Operands", "chapterZh": "指令操作数", "parent": "Using Addresses, Arrays, and Vectors", "parentZh": "使用地址、数组与 Vector", "kind": "Instructions", "kindZh": "指令", "summary": "All the memory instructions take an address operand that specifies the memory location being accessed. This addressable operand is one of:", "details": "All the memory instructions take an address operand that specifies the memory location being accessed.\nThis addressable operand is one of:\nThe register containing an address may be declared as a bit-size type or integer type.\nThe access size of a memory instruction is the total number of bytes accessed in memory.\nFor example, the access size of ld.v4.b32 is 16 bytes, while the access size of atom.f16x2 is 4 bytes.\nThe address must be naturally aligned to a multiple of the access size.\nIf an address is not properly aligned, the resulting behavior is undefined.\nThe address size may be either 32-bit or 64-bit. 128-bit adresses are not supported.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#addresses-as-operands", "tokens": ["ld.v4.b32", "atom.f16x2"], "summaryZh": "本条整理 PTX ISA 官方文档中的「作为操作数的地址」，归在「指令」。重点关注 关键词 ld.v4.b32、atom.f16x2，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「作为操作数的地址」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：ld.v4.b32、atom.f16x2。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Generic Addressing", "titleZh": "Generic Addressing", "numberedTitle": "6.4.1.1. Generic Addressing", "level": "H4", "chapter": "Instruction Operands", "chapterZh": "指令操作数", "parent": "Addresses as Operands", "parentZh": "作为操作数的地址", "kind": "Instructions", "kindZh": "指令", "summary": "If a memory instruction does not specify a state space, the operation is performed using generic addressing. The state spaces .const , Kernel Function Parameters ( .param ), .local and .shared are modeled as windows within the generic address space. Each window is...", "details": "If a memory instruction does not specify a state space, the operation is performed using generic addressing.\nThe state spaces .const , Kernel Function Parameters ( .param ), .local and .shared are modeled as windows within the generic address space.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#generic-addressing", "tokens": ["const", "param", "local", "shared"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Generic Addressing」，归在「指令」。重点关注 关键词 const、param、local、shared，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Generic Addressing」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：const、param、local、shared。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Arrays as Operands", "titleZh": "作为操作数的数组", "numberedTitle": "6.4.2. Arrays as Operands", "level": "H3", "chapter": "Instruction Operands", "chapterZh": "指令操作数", "parent": "Using Addresses, Arrays, and Vectors", "parentZh": "使用地址、数组与 Vector", "kind": "Instructions", "kindZh": "指令", "summary": "Arrays of all types can be declared, and the identifier becomes an address constant in the space where the array is declared. The size of the array is a constant in the program.", "details": "Arrays of all types can be declared, and the identifier becomes an address constant in the space where the array is declared.\nThe size of the array is a constant in the program.\nArray elements can be accessed using an explicitly calculated byte address, or by indexing into the array using square-bracket notation.\nThe expression within square brackets is either a constant integer, a register variable, or a simple register with constant offset expression, where the offset is a constant expression that is either added or subtracted from a register variable.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#arrays-as-operands", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「作为操作数的数组」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「作为操作数的数组」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Vectors as Operands", "titleZh": "作为操作数的 Vector", "numberedTitle": "6.4.3. Vectors as Operands", "level": "H3", "chapter": "Instruction Operands", "chapterZh": "指令操作数", "parent": "Using Addresses, Arrays, and Vectors", "parentZh": "使用地址、数组与 Vector", "kind": "Instructions", "kindZh": "指令", "summary": "Vector operands can be specified as source and destination operands for instructions. However, when specified as destination operand, all elements in vector expression must be unique, otherwise behavior is undefined. Vectors may also be passed as arguments to called...", "details": "Vector operands can be specified as source and destination operands for instructions.\nHowever, when specified as destination operand, all elements in vector expression must be unique, otherwise behavior is undefined.\nVector elements can be extracted from the vector with the suffixes .x , .y , .z and .w , as well as the typical color fields .r , .g , .b and .a .\nA brace-enclosed list is used for pattern matching to pull apart vectors.\nVector loads and stores can be used to implement wide loads and stores, which may improve memory performance.\nThe registers in the load/store operations can be a vector, or a brace-enclosed list of similarly typed scalars.\nElements in a brace-enclosed vector, say {Ra, Rb, Rc, Rd}, correspond to extracted elements as follows:", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#vectors-as-operands", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「作为操作数的 Vector」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「作为操作数的 Vector」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Labels and Function Names as Operands", "titleZh": "Label 与函数名操作数", "numberedTitle": "6.4.4. Labels and Function Names as Operands", "level": "H3", "chapter": "Instruction Operands", "chapterZh": "指令操作数", "parent": "Using Addresses, Arrays, and Vectors", "parentZh": "使用地址、数组与 Vector", "kind": "Instructions", "kindZh": "指令", "summary": "Labels and function names can be used only in bra / brx.idx and call instructions respectively. Function names can be used in mov instruction to get the address of the function into a register, for use in an indirect call.", "details": "Labels and function names can be used only in bra / brx.idx and call instructions respectively.\nFunction names can be used in mov instruction to get the address of the function into a register, for use in an indirect call.\nBeginning in PTX ISA version 3.1, the mov instruction may be used to take the address of kernel functions, to be passed to a system call that initiates a kernel launch from the GPU.\nThis feature is part of the support for CUDA Dynamic Parallelism.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#labels-and-function-names-as-operands", "tokens": ["brx.idx"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Label 与函数名操作数」，归在「指令」。重点关注 关键词 brx.idx，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Label 与函数名操作数」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：brx.idx。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Type Conversion", "titleZh": "类型转换", "numberedTitle": "6.5. Type Conversion", "level": "H2", "chapter": "Instruction Operands", "chapterZh": "指令操作数", "parent": "", "parentZh": "", "kind": "Instructions", "kindZh": "指令", "summary": "All operands to all arithmetic, logic, and data movement instruction must be of the same type and size, except for operations where changing the size and/or type is part of the definition of the instruction. Operands of different sizes or types must be converted prior...", "details": "All operands to all arithmetic, logic, and data movement instruction must be of the same type and size, except for operations where changing the size and/or type is part of the definition of the instruction.\nOperands of different sizes or types must be converted prior to the operation.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#type-conversion", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「类型转换」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「类型转换」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Scalar Conversions", "titleZh": "标量转换", "numberedTitle": "6.5.1. Scalar Conversions", "level": "H3", "chapter": "Instruction Operands", "chapterZh": "指令操作数", "parent": "Type Conversion", "parentZh": "类型转换", "kind": "Instructions", "kindZh": "指令", "summary": "Table 15 and Table 16 show what precision and format the cvt instruction uses given operands of differing types. For example, if a cvt.s32.u16 instruction is given a u16 source operand and s32 as a destination operand, the u16 is zero-extended to s32 .", "details": "Table 15 and Table 16 show what precision and format the cvt instruction uses given operands of differing types.\nFor example, if a cvt.s32.u16 instruction is given a u16 source operand and s32 as a destination operand, the u16 is zero-extended to s32 .\nConversions to floating-point that are beyond the range of floating-point numbers are represented with the maximum floating-point value (IEEE 754 Inf for f32 and f64 , and ~131,000 for f16 ).\nDestination Format\ns8 | s16 | s32 | s64 | u8 | u16 | u32 | u64 | f16 | f32 | f64 | bf16 | tf32\nSource Format | s8 | – | sext | sext | sext | – | sext | sext | sext | s2f | s2f | s2f | s2f | –\ns16 | chop 1 | – | sext | sext | chop 1 | – | sext | sext | s2f | s2f | s2f | s2f | –\ns32 | chop 1 | chop 1 | – | sext | chop 1 | chop 1 | – | sext | s2f | s2f | s2f | s2f | –", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#scalar-conversions", "tokens": ["cvt.s32.u16"], "summaryZh": "本条整理 PTX ISA 官方文档中的「标量转换」，归在「指令」。重点关注 关键词 cvt.s32.u16，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「标量转换」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：cvt.s32.u16。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Rounding Modifiers", "titleZh": "舍入修饰符", "numberedTitle": "6.5.2. Rounding Modifiers", "level": "H3", "chapter": "Instruction Operands", "chapterZh": "指令操作数", "parent": "Type Conversion", "parentZh": "类型转换", "kind": "Instructions", "kindZh": "指令", "summary": "Conversion instructions may specify a rounding modifier. In PTX, there are four integer rounding modifiers and six floating-point rounding modifiers. Table 17 and Table 18 summarize the rounding modifiers.", "details": "Conversion instructions may specify a rounding modifier.\nIn PTX, there are four integer rounding modifiers and six floating-point rounding modifiers.\nModifier | Description\n.rn | rounds to nearest even\n.rna | rounds to nearest, ties away from zero\n.rz | rounds towards zero\n.rm | rounds towards negative infinity\n.rp | rounds towards positive infinity", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#rounding-modifiers", "tokens": ["rna"], "summaryZh": "本条整理 PTX ISA 官方文档中的「舍入修饰符」，归在「指令」。重点关注 关键词 rna，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「舍入修饰符」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：rna。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Operand Costs", "titleZh": "操作数成本", "numberedTitle": "6.6. Operand Costs", "level": "H2", "chapter": "Instruction Operands", "chapterZh": "指令操作数", "parent"
