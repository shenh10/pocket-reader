{\\text{if }\\textsf{transa == $\\mathrm{CUBLAS\\_OP\\_C}$}} \\\\ \\end{matrix} \\right.\\)\nNotice that in order to achieve better parallelism, similarly to the cublas API, cuBLASXt API differs from the BLAS API for this routine.\nThe BLAS API assumes an in-place implementation (with results written back to B), while the cuBLASXt API assumes an out-of-place implementation (with results written into C).\nParam. | Memory | In/out | Meaning", "source": "https://docs.nvidia.com/cuda/cublas/#cublasxt-t-trmm", "tokens": ["cublasXt<t>trmm", "cublas", "cuBLASXt"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasXt<t>trmm()」，归在「精度 / Tensor Core」。重点关注 关键词 cublasXt<t>trmm、cublas、cuBLASXt，适合用于理解 Tensor Core、数据类型、math mode 和精度/性能取舍。", "detailsZh": "中文提要：这是「cublasXt<t>trmm()」对应的官方条目，分类为「精度 / Tensor Core」。\n阅读重点：理解 Tensor Core、数据类型、math mode 和精度/性能取舍。\n相关 API / 关键词：cublasXt<t>trmm、cublas、cuBLASXt。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasXt<t>spmm()", "titleZh": "cublasXt<t>spmm()", "numberedTitle": "4.4.12. cublasXt<t>spmm()", "level": "H3", "chapter": "Using the cuBLASXt API", "chapterZh": "使用 cuBLASXt API", "parent": "cuBLASXt API Math Functions Reference", "parentZh": "cuBLASXt API Math Functions Reference", "kind": "Precision / Tensor Core", "kindZh": "精度 / Tensor Core", "summary": "This function performs the symmetric packed matrix-matrix multiplication", "details": "This function performs the symmetric packed matrix-matrix multiplication\n\\(C = \\left\\{ \\begin{matrix} {\\alpha AB + \\beta C} & {\\text{if }\\textsf{side == $\\mathrm{CUBLAS\\_SIDE\\_LEFT}$}} \\\\ {\\alpha BA + \\beta C} & {\\text{if }\\textsf{side == $\\mathrm{CUBLAS\\_SIDE\\_RIGHT}$}} \\\\ \\end{matrix} \\right.\\)\nwhere \\(A\\) is a \\(n \\times n\\) symmetric matrix stored in packed format, \\(B\\) and \\(C\\) are \\(m \\times n\\) matrices, and \\(\\alpha\\) and \\(\\beta\\) are scalars.\nIf uplo == CUBLAS_FILL_MODE_LOWER then the elements in the lower triangular part of the symmetric matrix \\(A\\) are packed together column by column without gaps, so that the element \\(A(i,j)\\) is stored in the memory location AP[i+((2*n-j+1)*j)/2] for \\(j = 1,\\ldots,n\\) and \\(i \\geq j\\) .\nConsequently, the packed format requires only \\(\\frac{n(n + 1)}{2}\\) elements for storage.\nIf uplo == CUBLAS_FILL_MODE_UPPER then the elements in the upper triangular part of the symmetric matrix \\(A\\) are packed together column by column without gaps, so that the element \\(A(i,j)\\) is stored in the memory location AP[i+(j*(j+1))/2] for \\(j = 1,\\ldots,n\\) and \\(i \\leq j\\) .\nConsequently, the packed format requires only \\(\\frac{n(n + 1)}{2}\\) elements for storage.\nParam. | Memory | In/out | Meaning", "source": "https://docs.nvidia.com/cuda/cublas/#cublasxt-t-spmm", "tokens": ["cublasXt<t>spmm", "CUBLAS_FILL_MODE_LOWER", "CUBLAS_FILL_MODE_UPPER"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasXt<t>spmm()」，归在「精度 / Tensor Core」。重点关注 关键词 cublasXt<t>spmm、CUBLAS_FILL_MODE_LOWER、CUBLAS_FILL_MODE_UPPER，适合用于理解 Tensor Core、数据类型、math mode 和精度/性能取舍。", "detailsZh": "中文提要：这是「cublasXt<t>spmm()」对应的官方条目，分类为「精度 / Tensor Core」。\n阅读重点：理解 Tensor Core、数据类型、math mode 和精度/性能取舍。\n相关 API / 关键词：cublasXt<t>spmm、CUBLAS_FILL_MODE_LOWER、CUBLAS_FILL_MODE_UPPER。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Using the cuBLASDx API", "titleZh": "使用 cuBLASDx API", "numberedTitle": "5. Using the cuBLASDx API", "level": "H1", "chapter": "Using the cuBLASXt API", "chapterZh": "使用 cuBLASXt API", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "The cuBLASDx library (preview) is a device side API extension for performing BLAS calculations inside CUDA kernels. By fusing numerical operations you can decrease latency and further improve performance of your applications.", "details": "The cuBLASDx library (preview) is a device side API extension for performing BLAS calculations inside CUDA kernels.\nBy fusing numerical operations you can decrease latency and further improve performance of your applications.\nYou can access cuBLASDx documentation here .\ncuBLASDx is not a part of the CUDA Toolkit. You can download cuBLASDx separately from here .", "source": "https://docs.nvidia.com/cuda/cublas/#using-the-cublasdx-api", "tokens": ["cuBLASDx"], "summaryZh": "本条整理 cuBLAS 官方文档中的「使用 cuBLASDx API」，归在「指南章节」。重点关注 关键词 cuBLASDx，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「使用 cuBLASDx API」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLASDx。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Using the cuBLAS Legacy API", "titleZh": "使用 cuBLAS Legacy API", "numberedTitle": "6. Using the cuBLAS Legacy API", "level": "H1", "chapter": "Using the cuBLASDx API", "chapterZh": "使用 cuBLASDx API", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "This section does not provide a full reference of each Legacy API datatype and entry point. Instead, it describes how to use the API, especially where this is different from the regular cuBLAS API.", "details": "This section does not provide a full reference of each Legacy API datatype and entry point.\nInstead, it describes how to use the API, especially where this is different from the regular cuBLAS API.\nNote that in this section, all references to the “cuBLAS Library” refer to the Legacy cuBLAS API only.", "source": "https://docs.nvidia.com/cuda/cublas/#using-the-cublas-legacy-api", "tokens": ["cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「使用 cuBLAS Legacy API」，归在「指南章节」。重点关注 关键词 cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「使用 cuBLAS Legacy API」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Error Status", "titleZh": "错误状态", "numberedTitle": "6.1. Error Status", "level": "H2", "chapter": "Using the cuBLAS Legacy API", "chapterZh": "使用 cuBLAS Legacy API", "parent": "", "parentZh": "", "kind": "Types / Status", "kindZh": "类型 / 状态码", "summary": "The cublasStatus type is used for function status returns. The cuBLAS Library helper functions return status directly, while the status of core functions can be retrieved using cublasGetError() . Notice that reading the error status via cublasGetError() , resets the...", "details": "The cublasStatus type is used for function status returns.\nThe cuBLAS Library helper functions return status directly, while the status of core functions can be retrieved using cublasGetError() .\nValue | Meaning\nCUBLAS_STATUS_SUCCESS | the operation completed successfully\nCUBLAS_STATUS_NOT_INITIALIZED | the library was not initialized\nCUBLAS_STATUS_ALLOC_FAILED | the resource allocation failed\nCUBLAS_STATUS_INVALID_VALUE | an invalid numerical value was used as an argument\nCUBLAS_STATUS_ARCH_MISMATCH | an absent device architectural feature is required", "source": "https://docs.nvidia.com/cuda/cublas/#id125", "tokens": ["cublasStatus", "cuBLAS", "cublasGetError", "CUBLAS_STATUS_SUCCESS", "CUBLAS_STATUS_NOT_INITIALIZED", "CUBLAS_STATUS_ALLOC_FAILED", "CUBLAS_STATUS_INVALID_VALUE", "CUBLAS_STATUS_ARCH_MISMATCH"], "summaryZh": "本条整理 cuBLAS 官方文档中的「错误状态」，归在「类型 / 状态码」。重点关注 关键词 cublasStatus、cuBLAS、cublasGetError、CUBLAS_STATUS_SUCCESS、CUBLAS_STATUS_NOT_INITIALIZED，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「错误状态」对应的官方条目，分类为「类型 / 状态码」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublasStatus、cuBLAS、cublasGetError、CUBLAS_STATUS_SUCCESS、CUBLAS_STATUS_NOT_INITIALIZED、CUBLAS_STATUS_ALLOC_FAILED、CUBLAS_STATUS_INVALID_VALUE、CUBLAS_STATUS_ARCH_MISMATCH。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Initialization and Shutdown", "titleZh": "初始化与关闭", "numberedTitle": "6.2. Initialization and Shutdown", "level": "H2", "chapter": "Using the cuBLAS Legacy API", "chapterZh": "使用 cuBLAS Legacy API", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "The functions cublasInit() and cublasShutdown() are used to initialize and shutdown the cuBLAS library. It is recommended for cublasInit() to be called before any other function is invoked. It allocates hardware resources on the GPU device that is currently bound to...", "details": "The functions cublasInit() and cublasShutdown() are used to initialize and shutdown the cuBLAS library.\nIt is recommended for cublasInit() to be called before any other function is invoked.\nThe legacy initialization and shutdown functions are similar to the cuBLAS library API routines cublasCreate() and cublasDestroy() .", "source": "https://docs.nvidia.com/cuda/cublas/#initialization-and-shutdown", "tokens": ["cublasInit", "cublasShutdown", "cuBLAS", "cublasCreate", "cublasDestroy"], "summaryZh": "本条整理 cuBLAS 官方文档中的「初始化与关闭」，归在「指南章节」。重点关注 关键词 cublasInit、cublasShutdown、cuBLAS、cublasCreate、cublasDestroy，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「初始化与关闭」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublasInit、cublasShutdown、cuBLAS、cublasCreate、cublasDestroy。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Thread Safety", "titleZh": "线程安全", "numberedTitle": "6.3. Thread Safety", "level": "H2", "chapter": "Using the cuBLAS Legacy API", "chapterZh": "使用 cuBLAS Legacy API", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "The legacy API is not thread safe when used with multiple host threads and devices. It is recommended to be used only when utmost compatibility with Fortran is required and when a single host thread is used to setup the library and make all the functions calls.", "details": "The legacy API is not thread safe when used with multiple host threads and devices.\nIt is recommended to be used only when utmost compatibility with Fortran is required and when a single host thread is used to setup the library and make all the functions calls.", "source": "https://docs.nvidia.com/cuda/cublas/#id126", "tokens": [], "summaryZh": "本条整理 cuBLAS 官方文档中的「线程安全」，归在「指南章节」。重点关注 指南章节，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「线程安全」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Memory Management", "titleZh": "Memory 管理", "numberedTitle": "6.4. Memory Management", "level": "H2", "chapter": "Using the cuBLAS Legacy API", "chapterZh": "使用 cuBLAS Legacy API", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "The memory used by the legacy cuBLAS library API is allocated and released using functions cublasAlloc() and cublasFree() , respectively. These functions create and destroy an object in the GPU memory space capable of holding an array of n elements, where each element...", "details": "The memory used by the legacy cuBLAS library API is allocated and released using functions cublasAlloc() and cublasFree() , respectively.\nThese functions create and destroy an object in the GPU memory space capable of holding an array of n elements, where each element requires elemSize bytes of storage.\nThe function cublasAlloc() is a wrapper around the function cudaMalloc() , therefore device pointers returned by cublasAlloc() can be passed to any CUDA™ device kernel functions.\nHowever, these device pointers can not be dereferenced in the host code.", "source": "https://docs.nvidia.com/cuda/cublas/#memory-management", "tokens": ["cuBLAS", "cublasAlloc", "cublasFree", "cudaMalloc"], "summaryZh": "本条整理 cuBLAS 官方文档中的「Memory 管理」，归在「指南章节」。重点关注 关键词 cuBLAS、cublasAlloc、cublasFree、cudaMalloc，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「Memory 管理」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS、cublasAlloc、cublasFree、cudaMalloc。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Scalar Parameters", "titleZh": "标量参数", "numberedTitle": "6.5. Scalar Parameters", "level": "H2", "chapter": "Using the cuBLAS Legacy API", "chapterZh": "使用 cuBLAS Legacy API", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "In the legacy cuBLAS API, scalar parameters are passed by value from the host. Also, the few functions that do return a scalar result, such as dot() and nrm2(), return the resulting value on the host, and hence these routines will wait for kernel execution on the...", "details": "In the legacy cuBLAS API, scalar parameters are passed by value from the host.\nAlso, the few functions that do return a scalar result, such as dot() and nrm2(), return the resulting value on the host, and hence these routines will wait for kernel execution on the device to complete before returning, which makes parallelism with streams impractical.", "source": "https://docs.nvidia.com/cuda/cublas/#id127", "tokens": ["cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「标量参数」，归在「指南章节」。重点关注 关键词 cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「标量参数」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Helper Functions", "titleZh": "辅助函数", "numberedTitle": "6.6. Helper Functions", "level": "H2", "chapter": "Using the cuBLAS Legacy API", "chapterZh": "使用 cuBLAS Legacy API", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "In this section we list the helper functions provided by the legacy cuBLAS API and their functionality. For the exact prototypes of these functions please refer to the legacy cuBLAS API header file “cublas.h”.", "details": "In this section we list the helper functions provided by the legacy cuBLAS API and their functionality.\nFor the exact prototypes of these functions please refer to the legacy cuBLAS API header file “cublas.h”.\nHelper function | Meaning\ncublasInit() | initialize the library\ncublasShutdown() | shuts down the library\ncublasGetError() | retrieves the error status of the library\ncublasSetKernelStream() | sets the stream to be used by the library\ncublasAlloc() | allocates the device memory for the library", "source": "https://docs.nvidia.com/cuda/cublas/#helper-functions", "tokens": ["cuBLAS", "cublas", "cublasInit", "cublasShutdown", "cublasGetError", "cublasSetKernelStream", "cublasAlloc"], "summaryZh": "本条整理 cuBLAS 官方文档中的「辅助函数」，归在「指南章节」。重点关注 关键词 cuBLAS、cublas、cublasInit、cublasShutdown、cublasGetError，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「辅助函数」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS、cublas、cublasInit、cublasShutdown、cublasGetError、cublasSetKernelStream、cublasAlloc。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Level-1,2,3 Functions", "titleZh": "Level-1/2/3 函数", "numberedTitle": "6.7. Level-1,2,3 Functions", "level": "H2", "chapter": "Using the cuBLAS Legacy API", "chapterZh": "使用 cuBLAS Legacy API", "parent": "", "parentZh": "", "kind": "BLAS Level-1", "kindZh": "BLAS Level-1", "summary": "The Level-1,2,3 cuBLAS functions (also called core functions) have the same name and behavior as the ones listed in the chapters 3, 4 and 5 in this document. Please refer to the legacy cuBLAS API header file “cublas.h” for their exact prototype. Also, the next section...", "details": "The Level-1,2,3 cuBLAS functions (also called core functions) have the same name and behavior as the ones listed in the chapters 3, 4 and 5 in this document.\nPlease refer to the legacy cuBLAS API header file “cublas.h” for their exact prototype.", "source": "https://docs.nvidia.com/cuda/cublas/#level-1-2-3-functions", "tokens": ["cuBLAS", "cublas"], "summaryZh": "本条整理 cuBLAS 官方文档中的「Level-1/2/3 函数」，归在「BLAS Level-1」。重点关注 关键词 cuBLAS、cublas，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「Level-1/2/3 函数」对应的官方条目，分类为「BLAS Level-1」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS、cublas。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Converting Legacy to the cuBLAS API", "titleZh": "从 Legacy 迁移到 cuBLAS API", "numberedTitle": "6.8. Converting Legacy to the cuBLAS API", "level": "H2", "chapter": "Using the cuBLAS Legacy API", "chapterZh": "使用 cuBLAS Legacy API", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "There are a few general rules that can be used to convert from legacy to the cuBLAS API:", "details": "There are a few general rules that can be used to convert from legacy to the cuBLAS API:\nExchange the header file “cublas.h” for “cublas_v2.h”.\nExchange the type cublasStatus for cublasStatus_t .\nExchange the function cublasSetKernelStream() for cublasSetStream() .\nExchange the function cublasAlloc() and cublasFree() for cudaMalloc() and cudaFree() , respectively. Notice that cudaMalloc() expects the size of the allocated memory to be provided in bytes (usually simply provide n x elemSize to allocate n elements, each of size elemSize bytes).\nDeclare the cublasHandle_t cuBLAS library handle.\nInitialize the handle using cublasCreate() . Also, release the handle once finished using cublasDestroy() .\nAdd the handle as the first parameter to all the cuBLAS library function calls.", "source": "https://docs.nvidia.com/cuda/cublas/#converting-legacy-to-the-cublas-api", "tokens": ["cuBLAS", "cublas", "cublas_v2", "cublasStatus", "cublasStatus_t", "cublasSetKernelStream", "cublasSetStream", "cublasAlloc", "cublasFree", "cudaMalloc", "cudaFree", "cublasHandle_t"], "summaryZh": "本条整理 cuBLAS 官方文档中的「从 Legacy 迁移到 cuBLAS API」，归在「指南章节」。重点关注 关键词 cuBLAS、cublas、cublas_v2、cublasStatus、cublasStatus_t，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「从 Legacy 迁移到 cuBLAS API」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS、cublas、cublas_v2、cublasStatus、cublasStatus_t、cublasSetKernelStream、cublasSetStream、cublasAlloc。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Examples", "titleZh": "示例", "numberedTitle": "6.9. Examples", "level": "H2", "chapter": "Using the cuBLAS Legacy API", "chapterZh": "使用 cuBLAS Legacy API", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "For sample code references that use the legacy cuBLAS API please see the two examples below. They show an application written in C using the legacy cuBLAS library API with two indexing styles (Example A.1. “Application Using C and cuBLAS: 1-based indexing” and Example...", "details": "For sample code references that use the legacy cuBLAS API please see the two examples below.\nThey show an application written in C using the legacy cuBLAS library API with two indexing styles (Example A.1. “Application Using C and cuBLAS: 1-based indexing” and Example A.2. “Application Using C and cuBLAS: 0-based Indexing”).\nExample A.1.\nApplication Using C and cuBLAS: 1-based indexing\nExample A.2.\nApplication Using C and cuBLAS: 0-based indexing", "source": "https://docs.nvidia.com/cuda/cublas/#examples", "tokens": ["cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「示例」，归在「指南章节」。重点关注 关键词 cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「示例」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cuBLAS Fortran Bindings", "titleZh": "cuBLAS Fortran Bindings", "numberedTitle": "7. cuBLAS Fortran Bindings", "level": "H1", "chapter": "Using the cuBLAS Legacy API", "chapterZh": "使用 cuBLAS Legacy API", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "The cuBLAS library is implemented using the C-based CUDA toolchain. Thus, it provides a C-style API. This makes interfacing to applications written in C and C++ trivial, but the library can also be used by applications written in Fortran. In particular, the cuBLAS...", "details": "The cuBLAS library is implemented using the C-based CUDA toolchain.\nThus, it provides a C-style API.\nsymbol names (capitalization, name decoration)\nargument passing (by value or reference)\npassing of string arguments (length information)\npassing of pointer arguments (size of the pointer)\nreturning floating-point or compound data types (for example single-precision or complex data types)\nTo provide maximum flexibility in addressing those differences, the cuBLAS Fortran interface is provided in the form of wrapper functions and is part of the Toolkit delivery.", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-fortran-bindings", "tokens": ["cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cuBLAS Fortran Bindings」，归在「指南章节」。重点关注 关键词 cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cuBLAS Fortran Bindings」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Interaction with Other Libraries and Tools", "titleZh": "与其他库和工具交互", "numberedTitle": "8. Interaction with Other Libraries and Tools", "level": "H1", "chapter": "cuBLAS Fortran Bindings", "chapterZh": "cuBLAS Fortran Bindings", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "This section describes important requirements and recommendations that ensure correct use of cuBLAS with other libraries and utilities.", "details": "This section describes important requirements and recommendations that ensure correct use of cuBLAS with other libraries and utilities.", "source": "https://docs.nvidia.com/cuda/cublas/#interaction-with-other-libraries-and-tools", "tokens": ["cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「与其他库和工具交互」，归在「指南章节」。重点关注 关键词 cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「与其他库和工具交互」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "nvprune", "titleZh": "nvprune", "numberedTitle": "8.1. nvprune", "level": "H2", "chapter": "Interaction with Other Libraries and Tools", "chapterZh": "与其他库和工具交互", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "nvprune enables pruning relocatable host objects and static libraries to only contain device code for the specific target architectures. In case of cuBLAS, particular care must be taken if using nvprune with compute capabilities, whose minor revision number is...", "details": "nvprune enables pruning relocatable host objects and static libraries to only contain device code for the specific target architectures.\nIn case of cuBLAS, particular care must be taken if using nvprune with compute capabilities, whose minor revision number is different than 0.\nFor     }

    function matches(item, query) {
      if (!query) return true;
      const haystack = [
        item.title,
        item.titleZh,
        item.numberedTitle,
        item.kind,
        item.kindZh,
        item.chapter,
        item.chapterZh,
        item.parent,
        item.parentZh,
        item.summary,
        item.summaryZh,
        item.details,
        item.detailsZh,
        item.tokens.join(' ')
      ].join(' ').toLowerCase();
      return haystack.includes(query);
    }

    function renderCard(item) {
      const tokens = item.tokens.slice(0, 8).map(token => `<span class="token">${escapeHTML(token)}</span>`).join('');
      const displayTitle = item.titleZh || item.title;
      const originalTitle = '';
      const summaryText = item.summaryZh || item.summary;
      const detailsText = item.detailsZh || item.details || '暂无结构化摘录；请打开官方条目查看完整正文。';
      const details = codeify(detailsText);
      const kindLabel = item.kindZh || item.kind;
      const chapterLabel = item.chapterZh || item.chapter;
      const parentLabel = item.parentZh || item.parent;
      const snippet = item.snippet ? `<pre class="snippet"><code>${escapeHTML(item.snippet)}</code></pre>` : '';
      return `
        <article class="card">
          <div class="card-main">
            <div>
              <a class="card-title" href="${escapeHTML(item.source)}" target="_blank" rel="noreferrer">${escapeHTML(displayTitle)}${originalTitle}</a>
              <div class="tags">
                <span class="tag kind">${escapeHTML(kindLabel)}</span>
                <span class="tag">${escapeHTML(item.level)}</span>
                <span class="tag">${escapeHTML(chapterLabel)}</span>
                ${parentLabel ? `<span class="tag">${escapeHTML(parentLabel)}</span>` : ''}
              </div>
            </div>
            <div>
              <p class="summary">${escapeHTML(summaryText)}</p>
              <div class="tokens">${tokens}</div>
              ${snippet}
            </div>
          </div>
          <details>
            <summary>结构化摘录与官方锚点</summary>
            <div class="details">
              <div><b>摘录</b>${details}</div>
              <div><b>官方来源</b><a href="${escapeHTML(item.source)}" target="_blank" rel="noreferrer">打开官方条目</a></div>
            </div>
          </details>
        </article>
      `;
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      const filtered = entries.filter(item => {
        if (activeKind !== '全部' && item.kind !== activeKind) return false;
        if (onlySpecial.checked && !isSpecial(item)) return false;
        if (hasDetail.checked && !item.details) return false;
        return matches(item, query);
      });
      cards.innerHTML = filtered.map(renderCard).join('');
      empty.style.display = filtered.length ? 'none' : 'block';
      const activeLabel = activeKind === '全部' ? '全部' : (stats.kindLabels?.[activeKind] ?? activeKind);
      $('#result-count').textContent = `${activeLabel} · ${filtered.length} / ${entries.length}`;
    }

    function renderTopics() {
      const kinds = ['全部', ...stats.kinds];
      $('#topics').innerHTML = kinds.map(kind => {
        const pressed = kind === activeKind ? 'true' : 'false';
        const count = kind === '全部' ? entries.length : (stats.kindCounts?.[kind] ?? 0);
        const label = kind === '全部' ? '全部' : (stats.kindLabels?.[kind] ?? kind);
        return `<button class="topic" type="button" aria-pressed="${pressed}" data-kind="${escapeHTML(kind)}">${escapeHTML(label)}<span class="topic-count">${count}</span></button>`;
      }).join('');
      document.querySelectorAll('.topic').forEach(button => {
        button.addEventListener('click', () => {
          activeKind = button.dataset.kind;
          renderTopics();
          render();
          document.querySelector('.result-head')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
    }

    function renderGuide() {
      $('#guide-grid').innerHTML = groups.map(group => `
        <article class="guide-card">
          <h3>${escapeHTML(group.title)}</h3>
          <p>${escapeHTML(group.summary)}</p>
          <div class="chips">
            ${group.chips.map(chip => `<button class="chip" type="button" data-search="${escapeHTML(chip)}">${escapeHTML(chip)}</button>`).join('')}
          </div>
        </article>
      `).join('');
      document.querySelectorAll('.chip').forEach(button => {
        button.addEventListener('click', () => {
          activeKind = '全部';
          search.value = button.dataset.search;
          onlySpecial.checked = false;
          hasDetail.checked = false;
          renderTopics();
          render();
          document.querySelector('.result-head')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
          search.focus();
        });
      });
    }

    function hydrate() {
      root.style.setProperty('--accent', stats.accent);
      document.title = stats.title;
      $('#brand').textContent = `${stats.brand} · 官方文档整理`;
      $('#page-title').textContent = stats.title;
      $('#subtitle').textContent = stats.subtitle;
      $('#hero-code').textContent = stats.hero;
      $('#stat-entries').textContent = stats.entryCount;
      $('#stat-kinds').textContent = stats.kindCount;
      $('#stat-special').textContent = stats.specialCount;
      $('#stat-special-label').textContent = stats.specialLabel || '重点类条目';
      $('#stat-topkind').textContent = stats.topKinds[0]?.[1] ?? 0;
      $('#source-title').textContent = stats.sourceTitle;
      $('#source-url').href = stats.sourceUrl;
      $('#source-url').textContent = stats.sourceUrl;
      $('#generated-at').textContent = stats.generatedAt;
      $('#kind-list').innerHTML = stats.topKinds.map(([name, count]) => {
        const label = stats.kindLabels?.[name] ?? name;
        return `<div class="kind-row"><span>${escapeHTML(label)}</span><b>${count}</b></div>`;
      }).join('');
    }

    [search, onlySpecial, hasDetail].forEach(control => {
      control.addEventListener('input', render);
      control.addEventListener('change', render);
    });

    hydrate();
    renderTopics();
    renderGuide();
    render();
  </script>
</body>
</html>
