n Figure 217 .", "details": "Layout organization for M = 32 is shown in Figure 217 .\nAddresses for the above region to be used in tcgen05.ld / tcgen05.st is shown in Figure 218", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-data-path-layout-g", "tokens": ["tcgen05.ld", "tcgen05.st"], "summaryZh": "本条整理 PTX ISA 官方文档中的「布局 G (M = 32)」，归在「指令」。重点关注 关键词 tcgen05.ld、tcgen05.st，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「布局 G (M = 32)」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.ld、tcgen05.st。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Shared Memory Layout and Swizzling", "titleZh": "共享内存布局与 Swizzling", "numberedTitle": "9.7.17.10.6. Shared Memory Layout and Swizzling", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Matrix Multiply and accumulate Operations", "parentZh": "第五代 TensorCore 矩阵乘加操作", "kind": "Instructions", "kindZh": "指令", "summary": "If the bit Transpose A Matrix / Transpose B Matrix in the Instruction descriptor is 0, then K-major is used for matrix A / B respectively. If the bit Transpose A Matrix in the Instruction descriptor is 1 then M-major is used for matrix A . If the bit Transpose B Matrix...", "details": "If the bit Transpose A Matrix / Transpose B Matrix in the Instruction descriptor is 0, then K-major is used for matrix A / B respectively.\nIf the bit Transpose A Matrix in the Instruction descriptor is 1 then M-major is used for matrix A .\nIn a column-major default BLAS library such as cuBLAS, the matrices A and B with and without transpose can be classified as either K-Major or M-or-N-Major as shown in the following table:\nNon-Transposed | Transposed\nA | K-major | M-major\nB | K-major | N-major\nTo avoid confusion with A , B , row-major , col-major , transpose , and non-transpose , we will use MN-Major and K-Major throughout this section.\nThe matrices in the shared memory are made up of one or more “swizzle layout atom”.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-shared-memory-layout-swizzling", "tokens": ["cuBLAS"], "summaryZh": "本条整理 PTX ISA 官方文档中的「共享内存布局与 Swizzling」，归在「指令」。重点关注 关键词 cuBLAS，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「共享内存布局与 Swizzling」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Block Scaling for tcgen05.mma", "titleZh": "线程块 Scaling for tcgen05.mma", "numberedTitle": "9.7.17.10.7. Block Scaling for tcgen05.mma", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Matrix Multiply and accumulate Operations", "parentZh": "第五代 TensorCore 矩阵乘加操作", "kind": "Instructions", "kindZh": "指令", "summary": "The tcgen05.mma instructions with the following .kind qualifier:", "details": "The tcgen05.mma instructions with the following .kind qualifier:\n.kind::mxf8f6f4\n.kind::mxf4\n.kind::mxf4nvf4\nperform matrix multiplication with block scaling.\nThis operation has the following form:\n(A * scale_A) * (B * scale_B) + D\nwhere scale_A and scale_B are matrices residing in Tensor Memory .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-block-scaling", "tokens": ["tcgen05.mma", "kind"], "summaryZh": "本条整理 PTX ISA 官方文档中的「线程块 Scaling for tcgen05.mma」，归在「指令」。重点关注 关键词 tcgen05.mma、kind，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「线程块 Scaling for tcgen05.mma」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.mma、kind。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Valid combinations of scale_vectorsize with types and MMA-Kind", "titleZh": "Valid combinations of scale_vectorsize with types and MMA-Kind", "numberedTitle": "9.7.17.10.7.1. Valid combinations of scale_vectorsize with types and MMA-Kind", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Block Scaling for tcgen05.mma", "parentZh": "线程块 Scaling for tcgen05.mma", "kind": "Instructions", "kindZh": "指令", "summary": "The shape of scale_A and scale_B matrices depend on the .scale_vectorsize as shown in Table 59 .", "details": "The shape of scale_A and scale_B matrices depend on the .scale_vectorsize as shown in Table 59 .\n.scale_vectorsize | .kind::* | K | Shape of scale_A | Shape of scale_B\n.scale_vec::1X | .kind::mxf8f6f4 | All supported values of K | M x 1 | 1 x N\n.scale_vec::2X | .kind::mxf4 , .kind::mxf4nvf4 | All supported values of K | M x 2 | 2 x N\n.scale_vec::4X | .kind::mxf4nvf4 | All supported values of K | M x 4 | 4 x N\n.block16 | .kind::mxf4nvf4 | K = 96 | M x 6 | 6 x N\nAll supported values of K except 96 | M x 4 | 4 x N\n.block32 | .kind::mxf4 , .kind::mxf4nvf4 | K = 96 | M x 3 | 3 x N", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-mma-scale-valid-vec-size", "tokens": ["scale_vectorsize", "kind", "scale_vec", "block16", "block32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Valid combinations of scale_vectorsize with types and MMA-Kind」，归在「指令」。重点关注 关键词 scale_vectorsize、kind、scale_vec、block16、block32，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Valid combinations of scale_vectorsize with types and MMA-Kind」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：scale_vectorsize、kind、scale_vec、block16、block32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Scale Factor A ID", "titleZh": "Scale factor A ID", "numberedTitle": "9.7.17.10.7.2. Scale Factor A ID", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Block Scaling for tcgen05.mma", "parentZh": "线程块 Scaling for tcgen05.mma", "kind": "Instructions", "kindZh": "指令", "summary": "The value of the scale factor A ID selects the sub-columns in the Tensor Memory to form the scale factor A matrix, which is used to scale the matrix A .", "details": "The value of the scale factor A ID selects the sub-columns in the Tensor Memory to form the scale factor A matrix, which is used to scale the matrix A .\nThe following shows the scale factor matrix layout for various scale vector sizes:", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-mma-scale-factor-a", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Scale factor A ID」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Scale factor A ID」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Scale Factor B ID", "titleZh": "Scale factor B ID", "numberedTitle": "9.7.17.10.7.3. Scale Factor B ID", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Block Scaling for tcgen05.mma", "parentZh": "线程块 Scaling for tcgen05.mma", "kind": "Instructions", "kindZh": "指令", "summary": "The value of the scale factor B ID selects the sub-columns in the Tensor Memory to form the scale factor B matrix, which is used to scale the matrix B .", "details": "The value of the scale factor B ID selects the sub-columns in the Tensor Memory to form the scale factor B matrix, which is used to scale the matrix B .\nThe following shows the scale factor matrix layout for various scale vector sizes:", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-mma-scale-factor-b", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Scale factor B ID」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Scale factor B ID」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Sparse Matrices", "titleZh": "稀疏矩阵", "numberedTitle": "9.7.17.10.8. Sparse Matrices", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Matrix Multiply and accumulate Operations", "parentZh": "第五代 TensorCore 矩阵乘加操作", "kind": "Instructions", "kindZh": "指令", "summary": "This instruction tcgen05.mma.sp can be used when the matrix A is a structured sparse matrix with 50% zeros in each row distributed as per its sparse granularity.", "details": "This instruction tcgen05.mma.sp can be used when the matrix A is a structured sparse matrix with 50% zeros in each row distributed as per its sparse granularity.\nIn a MxNxK sparse tcgen05.mma.sp operation, the matrix A of shape MxK is stored in a packed form as Mx(K/2) in memory.\nFor each K-wide row of matrix A , 50% of elements are zeros and the remaining K/2 non-zero elements are stored in memory.\nGranularity of sparse matrix A is defined as the ratio of the number of non-zero elements in a sub-chunk of the matrix row to the total number of elements in that sub-chunk where the size of the sub-chunk is shape-specific.\nThe following table lists the granularity of different tcgen05.mma.sp variants:\n.kind of tcgen05.mma | Sparse Granularity\n.kind::tf32 | 1:2\n.kind::f16 | 2:4", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-sparse-matrices", "tokens": ["tcgen05.mma.sp", "kind", "tcgen05.mma"], "summaryZh": "本条整理 PTX ISA 官方文档中的「稀疏矩阵」，归在「指令」。重点关注 关键词 tcgen05.mma.sp、kind、tcgen05.mma，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「稀疏矩阵」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.mma.sp、kind、tcgen05.mma。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Sparse tcgen05.mma.sp with .kind::tf32", "titleZh": "Sparse tcgen05.mma.sp with .kind::tf32", "numberedTitle": "9.7.17.10.8.1. Sparse tcgen05.mma.sp with .kind::tf32", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Sparse Matrices", "parentZh": "稀疏矩阵", "kind": "Instructions", "kindZh": "指令", "summary": "For .kind::tf32 , matrix A is structured sparse at a granularity of 1:2 . In other words, each chunk of two adjacent elements in a row of matrix A has one zero and one non-zero element. Only the non-zero element is stored in memory and the 4-bit index in the metadata...", "details": "For .kind::tf32 , matrix A is structured sparse at a granularity of 1:2 .\nIn other words, each chunk of two adjacent elements in a row of matrix A has one zero and one non-zero element.\n0b1110\n0b0100\nRest of the values result in undefined behavior.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-sparse-matrices-kind-tf32", "tokens": ["tcgen05.mma.sp", "kind"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Sparse tcgen05.mma.sp with .kind::tf32」，归在「指令」。重点关注 关键词 tcgen05.mma.sp、kind，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Sparse tcgen05.mma.sp with .kind::tf32」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.mma.sp、kind。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Sparse tcgen05.mma.sp with .kind::f16 , .kind::f8f6f4 , .kind::mxf8f6f4 , .kind::i8", "titleZh": "Sparse tcgen05.mma.sp with .kind::f16 , .kind::f8f6f4 , .kind::mxf8f6f4 , .kind::i8", "numberedTitle": "9.7.17.10.8.2. Sparse tcgen05.mma.sp with .kind::f16 , .kind::f8f6f4 , .kind::mxf8f6f4 , .kind::i8", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Sparse Matrices", "parentZh": "稀疏矩阵", "kind": "Instructions", "kindZh": "指令", "summary": "For the following .kind variants of tcgen05.mma :", "details": "For the following .kind variants of tcgen05.mma :\n.kind::f16\n.kind::f8f6f4\n.kind::mxf8f6f4\n.kind::i8\nmatrix A is structured sparse at a granularity of 2:4 .\nIn other words, each chunk of four adjacent elements in a row of matrix A has two zero and two non-zero elements.\n0b0100", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-sparse-matrices-kind-f16-f8f8f4-mxf8f6f4", "tokens": ["tcgen05.mma.sp", "kind", "tcgen05.mma"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Sparse tcgen05.mma.sp with .kind::f16 , .kind::f8f6f4 , .kind::mxf8f6f4 , .kind::i8」，归在「指令」。重点关注 关键词 tcgen05.mma.sp、kind、tcgen05.mma，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Sparse tcgen05.mma.sp with .kind::f16 , .kind::f8f6f4 , .kind::mxf8f6f4 , .kind::i8」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.mma.sp、kind、tcgen05.mma。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Sparse tcgen05.mma.sp with .kind::mxf4 and .kind::mxf4nvf4", "titleZh": "Sparse tcgen05.mma.sp with .kind::mxf4 and .kind::mxf4nvf4", "numberedTitle": "9.7.17.10.8.3. Sparse tcgen05.mma.sp with .kind::mxf4 and .kind::mxf4nvf4", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Sparse Matrices", "parentZh": "稀疏矩阵", "kind": "Instructions", "kindZh": "指令", "summary": "For .kind::mxf4 and .kind::mxf4nvf4 , matrix A is pair-wise structured sparse at a granularity of 4:8 . In other words, each chunk of eight adjacent elements in a row of matrix A has four zero and four non-zero elements. The zero and non-zero elements are clustered in...", "details": "For .kind::mxf4 and .kind::mxf4nvf4 , matrix A is pair-wise structured sparse at a granularity of 4:8 .\nIn other words, each chunk of eight adjacent elements in a row of matrix A has four zero and four non-zero elements.\n0b0100\n0b1000\n0b1100\n0b1001\n0b1101\n0b0110", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-sparse-matrices-kind-mxf4", "tokens": ["tcgen05.mma.sp", "kind"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Sparse tcgen05.mma.sp with .kind::mxf4 and .kind::mxf4nvf4」，归在「指令」。重点关注 关键词 tcgen05.mma.sp、kind，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Sparse tcgen05.mma.sp with .kind::mxf4 and .kind::mxf4nvf4」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.mma.sp、kind。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Sparsity selector", "titleZh": "稀疏选择器", "numberedTitle": "9.7.17.10.8.4. Sparsity selector", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Sparse Matrices", "parentZh": "稀疏矩阵", "kind": "Instructions", "kindZh": "指令", "summary": "The value of the sparsity selector selects the sub-columns in the Tensor Memory to form the sparsity metadata matrix, which is used with matrix A to form the multiplicand matrix.", "details": "The value of the sparsity selector selects the sub-columns in the Tensor Memory to form the sparsity metadata matrix, which is used with matrix A to form the multiplicand matrix.\nThe following shows the sparse metadata matrix layout in Tensor Memory for various MMA variants:", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-sparse-matrices-sparsity-selector", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「稀疏选择器」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「稀疏选择器」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Alignment restriction", "titleZh": "对齐限制", "numberedTitle": "9.7.17.10.8.5. Alignment restriction", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Sparse Matrices", "parentZh": "稀疏矩阵", "kind": "Instructions", "kindZh": "指令", "summary": "The layouts which utilize only half the datapath lanes as specified in Data Path Layout Organization , i.e. Layout F and Layout C , must use the same alignment across matrices A, D and the sparsity metadata matrix.", "details": "The layouts which utilize only half the datapath lanes as specified in Data Path Layout Organization , i.e.\nLayout F and Layout C , must use the same alignment across matrices A, D and the sparsity metadata matrix.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-sparse-matrices-alignment-restriction", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「对齐限制」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「对齐限制」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "TensorCore 5th Generation of MMA Instructions", "titleZh": "第五代 TensorCore MMA 指令", "numberedTitle": "9.7.17.10.9. TensorCore 5th Generation of MMA Instructions", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Matrix Multiply and accumulate Operations", "parentZh": "第五代 TensorCore 矩阵乘加操作", "kind": "Instructions", "kindZh": "指令", "summary": "PTX ISA 文档章节：TensorCore 5th Generation of MMA Instructions", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-mma-instructions", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「第五代 TensorCore MMA 指令」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「第五代 TensorCore MMA 指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。"}, {"title": "TensorCore 5th Generation Instructions: tcgen05.mma", "titleZh": "第五代 TensorCore 指令：tcgen05.mma", "numberedTitle": "9.7.17.10.9.1. TensorCore 5th Generation Instructions: tcgen05.mma", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation of MMA Instructions", "parentZh": "第五代 TensorCore MMA 指令", "kind": "Instructions", "kindZh": "指令", "summary": "tcgen05.mma", "details": "tcgen05.mma\nPerform the 5 th generation of matrix multiply and accumulate operation.\nSyntax\nDescription\nInstruction tcgen05.mma is an asynchronous instruction which initiates an MxNxK matrix multiply and accumulate operation, D = A*B+D where the A matrix is MxK , the B matrix is KxN , and the D matrix is MxN .\nThe operation of the form D = A*B is issued when the input predicate argument enable-input-d is false.\nThe optional immediate argument scale-input-d can be specified to scale the input matrix D as follows: D = A*B+D * (2 ^ - scale-input-d)\nThe valid range of values for argument scale-input-d is [0, 15].", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-mma-instructions-mma", "tokens": ["tcgen05.mma"], "summaryZh": "本条整理 PTX ISA 官方文档中的「第五代 TensorCore 指令：tcgen05.mma」，归在「指令」。重点关注 关键词 tcgen05.mma，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「第五代 TensorCore 指令：tcgen05.mma」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.mma。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "TensorCore 5th Generation Instructions: tcgen05.mma.sp", "titleZh": "第五代 TensorCore 指令：tcgen05.mma.sp", "numberedTitle": "9.7.17.10.9.2. TensorCore 5th Generation Instructions: tcgen05.mma.sp", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation of MMA Instructions", "parentZh": "第五代 TensorCore MMA 指令", "kind": "Instructions", "kindZh": "指令", "summary": "tcgen05.mma.sp", "details": "tcgen05.mma.sp\nPerform the 5 th generation of matrix multiply and accumulate operation with sparse A matrix.\nSyntax\nDescription\nInstruction tcgen05.mma.sp is an asynchronous instruction which initiates an MxNxK matrix multiply and accumulate operation of the form D = A*B+D where the A matrix is Mx(K/2) , the B matrix is KxN , and the D matrix is MxN .\nSparse Matrices describes the details of the sparsity.\nThe operation of the form D = A*B is issued when the input predicate argument enable-input-d is false.\nThe optional immediate argument scale-input-d can be specified to scale the input matrix D as follows: D = A*B+D * (2 ^ - scale-input-d)", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-mma-instructions-mma-sp", "tokens": ["tcgen05.mma.sp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「第五代 TensorCore 指令：tcgen05.mma.sp」，归在「指令」。重点关注 关键词 tcgen05.mma.sp，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「第五代 TensorCore 指令：tcgen05.mma.sp」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.mma.sp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "TensorCore 5th Generation Instructions: tcgen05.mma.ws", "titleZh": "第五代 TensorCore 指令：tcgen05.mma.ws", "numberedTitle": "9.7.17.10.9.3. TensorCore 5th Generation Instructions: tcgen05.mma.ws", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation of MMA Instructions", "parentZh": "第五代 TensorCore MMA 指令", "kind": "Instructions", "kindZh": "指令", "summary": "tcgen05.mma.ws", "details": "tcgen05.mma.ws\nPerform the 5 th generation of weight stationary convolution matrix multiply and accumulate operation.\nSyntax\nDescription\nInstruction tcgen05.mma.ws is an asynchronous instruction which initiates an MxNxK matrix multiply and accumulate operation, D = A*B+D where the A matrix is MxK , the B matrix is KxN , and the D matrix is MxN .\nThe operation of the form D = A*B is issued when the input predicate argument enable-input-d is false.\nThe 32-bit register operand idesc is the instruction descriptor as described in Instruction descriptor , specifies the shapes, exact types, sparsity and other details of the input matrices, output matrix and the matrix multiply and accumulate operation.\nThe qualifier .cta_group::1 specifies that the matrix multiply and accumulate operation is performed on the Tensor Memory of the executing thread’s CTA only.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-mma-instructions-mma-ws", "tokens": ["tcgen05.mma.ws", "cta_group"], "summaryZh": "本条整理 PTX ISA 官方文档中的「第五代 TensorCore 指令：tcgen05.mma.ws」，归在「指令」。重点关注 关键词 tcgen05.mma.ws、cta_group，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「第五代 TensorCore 指令：tcgen05.mma.ws」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.mma.ws、cta_group。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "TensorCore 5th Generation Instructions: tcgen05.mma.ws.sp", "titleZh": "第五代 TensorCore 指令：tcgen05.mma.ws.sp", "numberedTitle": "9.7.17.10.9.4. TensorCore 5th Generation Instructions: tcgen05.mma.ws.sp", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation of MMA Instructions", "parentZh": "第五代 TensorCore MMA 指令", "kind": "Instructions", "kindZh": "指令", "summary": "tcgen05.mma.ws.sp", "details": "tcgen05.mma.ws.sp\nPerform the 5 th generation of weight stationary convolution matrix multiply and accumulate operation with sparse A matrix.\nSyntax\nDescription\nInstruction tcgen05.mma.ws.sp is an asynchronous instruction which initiates an MxNxK matrix multiply and accumulate operation, D = A*B+D where the A matrix is Mx(K/2) , the B matrix is KxN , and the D matrix is MxN .\nSparse Matrices describes the details of the sparsity.\nThe operation of the form D = A*B is issued when the input predicate argument enable-input-d is false.\nThe 32-bit register operand idesc is the instruction descriptor as described in Instruction descriptor , specifies the shapes, exact types, sparsity and other details of the input matrices, output matrix and the matrix multiply and accumulate operation.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-mma-instructions-mma-ws-sp", "tokens": ["tcgen05.mma.ws.sp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「第五代 TensorCore 指令：tcgen05.mma.ws.sp」，归在「指令」。重点关注 关键词 tcgen05.mma.ws.sp，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「第五代 TensorCore 指令：tcgen05.mma.ws.sp」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.mma.ws.sp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "TensorCore 5th Generation Specialized Synchronization Operations", "titleZh": "第五代 TensorCore 专用同步操作", "numberedTitle": "9.7.17.11. TensorCore 5th Generation Specialized Synchronization Operations", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Family Instructions", "parentZh": "第五代 TensorCore 指令族", "kind": "Instructions", "kindZh": "指令", "summary": "PTX ISA 文档章节：TensorCore 5th Generation Specialized Synchronization Operations", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-special-sync-operations", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「第五代 TensorCore 专用同步操作」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「第五代 TensorCore 专用同步操作」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。"}, {"title": "TensorCore 5th Generation Instructions: tcgen05.fence", "titleZh": "第五代 TensorCore 指令：tcgen05.fence", "numberedTitle": "9.7.17.11.1. TensorCore 5th Generation Instructions: tcgen05.fence", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Specialized Synchronization Operations", "parentZh": "第五代 TensorCore 专用同步操作", "kind": "Instructions", "kindZh": "指令", "summary": "tcgen05.fence", "details": "tcgen05.fence\nSpecialized fence for the asynchronous tcgen05 operations.\nSyntax\nDescription\nThe instruction tcgen05.fence::before_thread_sync orders all the prior asynchronous tcgen05 operations with respect to the subsequent tcgen05 and the execution ordering operations.\nThe instruction tcgen05.fence::after_thread_sync orders all the subsequent asynchronous tcgen05 operations with respect to the prior tcgen05 and the execution ordering operations.\nThe tcgen05.fence::* instructions compose with execution ordering instructions across a thread scope and provide ordering between tcgen05 instructions across the same scope.\nThe tcgen05.fence::before_thread_sync instructions behave as code motion fence for prior tcgen05 instructions as they cannot be hoisted across.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-special-sync-operations-fence", "tokens": ["tcgen05.fence"], "summaryZh": "本条整理 PTX ISA 官方文档中的「第五代 TensorCore 指令：tcgen05.fence」，归在「指令」。重点关注 关键词 tcgen05.fence，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「第五代 TensorCore 指令：tcgen05.fence」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.fence。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "TensorCore 5th Generation Async Synchronization Operations", "titleZh": "第五代 TensorCore 异步同步操作", "numberedTitle": "9.7.17.12. TensorCore 5th Generation Async Synchronization Operations", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Family Instructions", "parentZh": "第五代 TensorCore 指令族", "kind": "Instructions", "kindZh": "指令", "summary": "PTX ISA 文档章节：TensorCore 5th Generation Async Synchronization Operations", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen-async-sync-operations", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「第五代 TensorCore 异步同步操作」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「第五代 TensorCore 异步同步操作」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。"}, {"title": "TensorCore 5th Generation Instructions: tcgen05.commit", "titleZh": "第五代 TensorCore 指令：tcgen05.commit", "numberedTitle": "9.7.17.12.1. TensorCore 5th Generation Instructions: tcgen05.commit", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Async Synchronization Operations", "parentZh": "第五代 TensorCore 异步同步操作", "kind": "Instructions", "kindZh": "指令", "summary": "tcgen05.commit", "details": "tcgen05.commit\nMakes the mbarrier object track the completion of all prior async-tcgen05 operations initiated by the executing thread.\nSyntax\nDescription\nThe instruction tcgen05.commit is an asynchronous instruction which makes the mbarrier object, specified by the address operand mbar , track the completion of all the prior asynchronous tcgen05 operations, as listed in mbarrier based completion mechanism , initiated by the executing thread.\nUpon the completion of the tracked asynchronous tcgen05 operations, the signal specified by the .completion_mechanism is triggered by the system on the mbarrier object.\nThe instruction tcgen05.commit.cta_group::1 tracks for the completion of all prior asynchronous tcgen05 operations with .cta_group::1 issued by the current thread.\nSimilarly, the instruction tcgen05.commit.cta_group::2 tracks for the completion of all prior asynchronous tcgen05 operations with .cta_group::2 issued by the current thread.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen-async-sync-operations-commit", "tokens": ["tcgen05.commit", "completion_mechanism", "tcgen05.commit.cta", "cta_group"], "summaryZh": "本条整理 PTX ISA 官方文档中的「第五代 TensorCore 指令：tcgen05.commit」，归在「指令」。重点关注 关键词 tcgen05.commit、completion_mechanism、tcgen05.commit.cta、cta_group，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「第五代 TensorCore 指令：tcgen05.commit」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.commit、completion_mechanism、tcgen05.commit.cta、cta_group。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Stack Manipulation Instructions", "titleZh": "栈操作指令", "numberedTitle": "9.7.18. Stack Manipulation Instructions", "level": "H3", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Instructions", "parentZh": "指令", "kind": "Instructions", "kindZh": "指令", "summary": "The stack manipulation instructions can be used to dynamically allocate and deallocate memory on the stack frame of the current function.", "details": "The stack manipulation instructions can be used to dynamically allocate and deallocate memory on the stack frame of the current function.\nThe stack manipulation instrucitons are:\nstacksave\nstackrestore\nalloca", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#stack-manipulation-instructions", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「栈操作指令」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「栈操作指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Stack Manipulation Instructions: stacksave", "titleZh": "栈操作指令：stacksave", "numberedTitle": "9.7.18.1. Stack Manipulation Instructions: stacksave", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Stack Manipulation Instructions", "parentZh": "栈操作指令", "kind": "Instructions", "kindZh": "指令", "summary": "stacksave", "details": "stacksave\nSave the value of stack pointer into a register.\nSyntax\nDescription\nCopies the current value of stack pointer into the destination register d .\nPointer returned by stacksave can be used in a subsequent stackrestore instruction to restore the stack pointer.\nDestination operand d has the same type as the instruction type.\nSemantics", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#stack-manipulation-instructions-stacksave", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「栈操作指令：stacksave」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「栈操作指令：stacksave」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Stack Manipulation Instructions: stackrestore", "titleZh": "栈操作指令：stackrestore", "numberedTitle": "9.7.18.2. Stack Manipulation Instructions: stackrestore", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Stack Manipulation Instructions", "parentZh": "栈操作指令", "kind": "Instructions", "kindZh": "指令", "summary": "stackrestore", "details": "stackrestore\nUpdate the stack pointer with a new value.\nSyntax\nDescription\nSets the current stack pointer to source register a .\nWhen stackrestore is used with operand a written by a prior stacksave instruction, it will effectively restore the state of stack as it was before stacksave was executed.\nNote that if stackrestore is used with an arbitrary value of a , it may cause corruption of stack pointer.\nOperand a has the same type as the instruction type.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#stack-manipulation-instructions-stackrestore", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「栈操作指令：stackrestore」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「栈操作指令：stackrestore」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Stack Manipulation Instructions: alloca", "titleZh": "栈操作指令：alloca", "numberedTitle": "9.7.18.3. Stack Manipulation Instructions: alloca", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Stack Manipulation Instructions", "parentZh": "栈操作指令", "kind": "Instructions", "kindZh": "指令", "summary": "alloca", "details": "alloca\nDynamically allocate memory on stack.\nSyntax\nDescription\nThe alloca instruction dynamically allocates memory on the stack frame of the current function and updates the stack pointer accordingly.\nThe returned pointer ptr points to local memory and can be used in the address operand of ld.local and st.local instructions.\nIf sufficient memory is unavailable for allocation on the stack, then execution of alloca may result in stack overflow.\nIn such cases, attempting to access the allocated memory with ptr will result in undefined program behavior.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#stack-manipulation-instructions-alloca", "tokens": ["ld.local", "st.local"], "summaryZh": "本条整理 PTX ISA 官方文档中的「栈操作指令：alloca」，归在「指令」。重点关注 关键词 ld.local、st.local，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「栈操作指令：alloca」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：ld.local、st.local。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Miscellaneous Instructions", "titleZh": "杂项指令", "numberedTitle": "9.7.20. Miscellaneous Instructions", "level": "H3", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Instructions", "parentZh": "指令", "kind": "Instructions", "kindZh": "指令", "summary": "The Miscellaneous instructions are:", "details": "The Miscellaneous instructions are:\nbrkpt\nnanosleep\npmevent\ntrap\nsetmaxnreg", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#miscellaneous-instructions", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「杂项指令」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「杂项指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Miscellaneous Instructions: brkpt", "titleZh": "杂项指令：brkpt", "numberedTitle": "9.7.20.1. Miscellaneous Instructions: brkpt", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Miscellaneous Instructions", "parentZh": "杂项指令", "kind": "Instructions", "kindZh": "指令", "summary": "brkpt", "details": "brkpt\nBreakpoint.\nSyntax\nDescription\nSuspends execution.\nPTX ISA Notes\nIntroduced in PTX ISA version 1.0.\nTarget ISA Notes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#miscellaneous-instructions-brkpt", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「杂项指令：brkpt」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「杂项指令：brkpt」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Miscellaneous Instructions: nanosleep", "titleZh": "杂项指令：nanosleep", "numberedTitle": "9.7.20.2. Miscellaneous Instructions: nanosleep", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Miscellaneous Instructions", "parentZh": "杂项指令", "kind": "Instructions", "kindZh": "指令", "summary": "nanosleep", "details": "nanosleep\nSuspend the thread for an approximate delay given in nanoseconds.\nSyntax\nDescription\nSuspends the thread for a sleep duration approximately close to the delay t , specified in nanoseconds. t may be a register or an immediate value.\nThe sleep duration is approximated, but guaranteed to be in the interval [0, 2*t] .\nThe maximum sleep duration is 1 millisecond.\nPTX ISA Notes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#miscellaneous-instructions-nanosleep", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「杂项指令：nanosleep」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「杂项指令：nanosleep」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Miscellaneous Instructions: pmevent", "titleZh": "杂项指令：pmevent", "numberedTitle": "9.7.20.3. Miscellaneous Instructions: pmevent", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Miscellaneous Instructions", "parentZh": "杂项指令", "kind": "Instructions", "kindZh": "指令", "summary": "pmevent", "details": "pmevent\nTrigger one or more Performance Monitor events.\nSyntax\nDescription\nTriggers one or more of a fixed number of performance monitor events, with event index or mask specified by immediate operand a .\npmevent (without modifier .mask ) triggers a single performance monitor event indexed by immediate operand a , in the range 0..15 .\npmevent.mask triggers one or more of the performance monitor events.\nEach bit in the 16-bit immediate operand a controls an event.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#miscellaneous-instructions-pmevent", "tokens": ["mask", "pmevent.mask"], "summaryZh": "本条整理 PTX ISA 官方文档中的「杂项指令：pmevent」，归在「指令」。重点关注 关键词 mask、pmevent.mask，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「杂项指令：pmevent」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mask、pmevent.mask。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Miscellaneous Instructions: trap", "titleZh": "杂项指令：trap", "numberedTitle": "9.7.20.4. Miscellaneous Instructions: trap", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Miscellaneous Instructions", "parentZh": "杂项指令", "kind": "Instructions", "kindZh": "指令", "summary": "trap", "details": "trap\nPerform trap operation.\nSyntax\nDescription\nAbort execution and generate an interrupt to the host CPU.\nPTX ISA Notes\nIntroduced in PTX ISA version 1.0.\nTarget ISA Notes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#miscellaneous-instructions-trap", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「杂项指令：trap」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「杂项指令：trap」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Miscellaneous Instructions: setmaxnreg", "titleZh": "杂项指令：setmaxnreg", "numberedTitle": "9.7.20.5. Miscellaneous Instructions: setmaxnreg", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Miscellaneous Instructions", "parentZh": "杂项指令", "kind": "Instructions", "kindZh": "指令", "summary": "setmaxnreg", "details": "setmaxnreg\nHint to change the number of registers owned by the warp.\nSyntax\nDescription\nsetmaxnreg provides a hint to the system to update the maximum number of per-thread registers owned by the executing warp to the value specified by the imm-reg-count operand.\nQualifier .dec is used to release extra registers such that the absolute per-thread maximum register count is reduced from its current value to imm-reg-count .\nQualifier .inc is used to request additional registers such that the absolute per-thread maximum register count is increased from its current value to imm-reg-count .\nA pool of available registers is maintained per-CTA.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#miscellaneous-instructions-setmaxnreg", "tokens": ["warp", "dec", "inc"], "summaryZh": "本条整理 PTX ISA 官方文档中的「杂项指令：setmaxnreg」，归在「指令」。重点关注 关键词 warp、dec、inc，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「杂项指令：setmaxnreg」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：warp、dec、inc。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Special Registers", "titleZh": "特殊寄存器", "numberedTitle": "10. Special Registers", "level": "H1", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "", "parentZh": "", "kind": "Special Registers", "kindZh": "特殊寄存器", "summary": "PTX includes a number of predefined, read-only variables, which are visible as special registers and accessed through mov or cvt instructions.", "details": "PTX includes a number of predefined, read-only variables, which are visible as special registers and accessed through mov or cvt instructions.\nThe special registers are:\n%tid\n%ntid\n%laneid\n%warpid\n%nwarpid\n%ctaid", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#special-registers", "tokens": ["%tid", "%ntid", "%laneid", "%warpid", "%nwarpid", "%ctaid"], "summaryZh": "本条整理 PTX ISA 官方文档中的「特殊寄存器」，归在「特殊寄存器」。重点关注 关键词 %tid、%ntid、%laneid、%warpid、%nwarpid，适合用于查特殊寄存器含义和可见范围。", "detailsZh": "中文提要：这是「特殊寄存器」对应的官方条目，分类为「特殊寄存器」。\n阅读重点：查特殊寄存器含义和可见范围。\n相关 API / 关键词：%tid、%ntid、%laneid、%warpid、%nwarpid、%ctaid。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Special Registers: %tid", "titleZh": "特殊寄存器：%tid", "numberedTitle": "10.1. Special Registers: %tid", "level": "H2", "chapter": "Special Registers", "chapterZh": "特殊寄存器", "parent": "", "parentZh": "", "kind": "Special Registers", "kindZh": "特殊寄存器", "summary": "%tid", "details": "%tid\nThread identifier within a CTA.\nSyntax (predefined)\nDescription\nA predefined, read-only, per-thread special register initialized with the thread identifier within the CTA.\nThe %tid special register contains a 1D, 2D, or 3D vector to match the CTA shape; the %tid value in unused dimensions is 0 .\nEvery thread in the CTA has a unique %tid .\n%tid component values range from 0 through %ntid-1 in each CTA dimension.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#special-registers-tid", "tokens": ["%tid", "%ntid"], "summaryZh": "本条整理 PTX ISA 官方文档中的「特殊寄存器：%tid」，归在「特殊寄存器」。重点关注 关键词 %tid、%ntid，适合用于查特殊寄存器含义和可见范围。", "detailsZh": "中文提要：这是「特殊寄存器：%tid」对应的官方条目，分类为「特殊寄存器」。\n阅读重点：查特殊寄存器含义和可见范围。\n相关 API / 关键词：%tid、%ntid。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Special Registers: %ntid", "titleZh": "特殊寄存器：%ntid", "numberedTitle": "10.2. Special Registers: %ntid", "level": "H2", "chapter": "Special Registers", "chapterZh": "特殊寄存器", "parent": "", "parentZh": "", "kind": "Special Registers", "kindZh": "特殊寄存器", "summary": "%ntid", "details": "%ntid\nNumber of thread IDs per CTA.\nSyntax (predefined)\nDescription\nA predefined, read-only special register initialized with the number of thread ids in each CTA dimension.\nThe %ntid special register contains a 3D CTA shape vector that holds the CTA dimensions.\nMaximum values of %ntid.{x,y,z} are as follows:\n.target architecture | %ntid.x | %ntid.y | %ntid.z", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#special-registers-ntid", "tokens": ["%ntid", "target"], "summaryZh": "本条整理 PTX ISA 官方文档中的「特殊寄存器：%ntid」，归在「特殊寄存器」。重点关注 关键词 %ntid、target，适合用于查特殊寄存器含义和可见范围。", "detailsZh": "中文提要：这是「特殊寄存器：%ntid」对应的官方条目，分类为「特殊寄存器」。\n阅读重点：查特殊寄存器含义和可见范围。\n相关 API / 关键词：%ntid、target。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Special Registers: %laneid", "titleZh": "特殊寄存器：%laneid", "numberedTitle": "10.3. Special Registers: %laneid", "level": "H2", "chapter": "Special Registers", "chapterZh": "特殊寄存器", "parent": "", "parentZh": "", "kind": "Special Registers", "kindZh": "特殊寄存器", "summary": "%laneid", "details": "%laneid\nLane Identifier.\nSyntax (predefined)\nDescription\nA predefined, read-only special register that returns the thread’s lane within the warp.\nThe lane identifier ranges from zero to WARP_SZ-1 .\nPTX ISA Notes\nIntroduced in PTX ISA version 1.3.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#special-registers-laneid", "tokens": ["%laneid", "warp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「特殊寄存器：%laneid」，归在「特殊寄存器」。重点关注 关键词 %laneid、warp，适合用于查特殊寄存器含义和可见范围。", "detailsZh": "中文提要：这是「特殊寄存器：%laneid」对应的官方条目，分类为「特殊寄存器」。\n阅读重点：查特殊寄存器含义和可见范围。\n相关 API / 关键词：%laneid、warp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Special Registers: %warpid", "titleZh": "特殊寄存器：%warpid", "numberedTitle": "10.4. Special Registers: %warpid", "level": "H2", "chapter": "Special Registers", "chapterZh": "特殊寄存器", "parent": "", "parentZh": "", "kind": "Special Registers", "kindZh": "特殊寄存器", "summary": "%warpid", "details": "%warpid\nWarp identifier.\nSyntax (predefined)\nDescription\nA predefined, read-only special register that returns the thread’s warp identifier.\nThe warp identifier provides a unique warp number within a CTA but not across CTAs within a grid.\nNote that %warpid returns the location of a thread at the moment when read, but its value may change during execution, e.g., due to rescheduling of threads following preemption.\nFor this reason, %ctaid and %tid should be used to compute a virtual warp index if such a value is needed in kernel code; %warpid is intended mainly to enable profiling and diagnostic code to sample and log information such as work place mapping and load distribution.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#special-registers-warpid", "tokens": ["%warpid", "warp", "%ctaid", "%tid"], "summaryZh": "本条整理 PTX ISA 官方文档中的「特殊寄存器：%warpid」，归在「特殊寄存器」。重点关注 关键词 %warpid、warp、%ctaid、%tid，适合用于查特殊寄存器含义和可见范围。", "detailsZh": "中文提要：这是「特殊寄存器：%warpid」对应的官方条目，分类为「特殊寄存器」。\n阅读重点：查特殊寄存器含义和可见范围。\n相关 API / 关键词：%warpid、warp、%ctaid、%tid。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Special Registers: %nwarpid", "titleZh": "特殊寄存器：%nwarpid", "numberedTitle": "10.5. Special Registers: %nwarpid", "level": "H2", "chapter": "Special Registers", "chapterZh": "特殊寄存器", "parent": "", "parentZh": "", "kind": "Special Registers", "kindZh": "特殊寄存器", "summary": "%nwarpid", "details": "%nwarpid\nNumber of warp identifiers.\nSyntax (predefined)\nDescription\nA predefined, read-only special register that returns the maximum number of warp identifiers.\nPTX ISA Notes\nIntroduced in PTX ISA version 2.0.\nTarget ISA Notes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#special-registers-nwarpid", "tokens": ["%nwarpid", "warp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「特殊寄存器：%nwarpid」，归在「特殊寄存器」。重点关注 关键词 %nwarpid、warp，适合用于查特殊寄存器含义和可见范围。", "detailsZh": "中文提要：这是「特殊寄存器：%nwarpid」对应的官方条目，分类为「特殊寄存器」。\n阅读重点：查特殊寄存器含义和可见范围。\n相关 API / 关键词：%nwarpid、warp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Special Registers: %ctaid", "titleZh": "特殊寄存器：%ctaid", "numberedTitle": "10.6. Special Registers: %ctaid", "level": "H2", "chapter": "Special Registers", "chapterZh": "特殊寄存器", "parent": "", "parentZh": "", "kind": "Special Registers", "kindZh": "特殊寄存器", "summary": "%ctaid", "details": "%ctaid\nCTA identifier within a grid.\nSyntax (predefined)\nDescription\nA predefined, read-only special register initialized with the CTA identifier within the CTA grid.\nThe %ctaid special register contains a 1D, 2D, or 3D vector, depending on the shape and rank of the CTA grid.\nIt is guaranteed that:\nPTX ISA Notes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#special-registers-ctaid", "tokens": ["%ctaid"], "summaryZh": "本条整理 PTX ISA 官方文档中的「特殊寄存器：%ctaid」，归在「特殊寄存器」。重点关注 关键词 %ctaid，适合用于查特殊寄存器含义和可见范围。", "detailsZh": "中文提要：这是「特殊寄存器：%ctaid」对应的官方条目，分类为「特殊寄存器」。\n阅读重点：查特殊寄存器含义和可见范围。\n相关 API / 关键词：%ctaid。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Special Registers: %nctaid", "titleZh": "特殊寄存器：%nctaid", "numberedTitle": "10.7. Special Registers: %nctaid", "level": "H2", "chapter": "Special Registers", "chapterZh": "特殊寄存器", "parent": "", "parentZh": "", "kind": "Special Registers", "kindZh": "特殊寄存器", "summary": "%nctaid", "details": "%nctaid\nNumber of CTA ids per grid.\nSyntax (predefined)\nDescription\nA predefined, read-only special register initialized with the number of CTAs in each grid dimension.\nThe %nctaid special register contains a 3D grid shape vector, with each element having a value of at least 1 .\nMaximum values of %nctaid.{x,y,z} are as follows:\n.target architecture | %nctaid.x | %nctaid.y | %nctaid.z", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#special-registers-nctaid", "tokens": ["%nctaid", "target"], "summaryZh": "本条整理 PTX ISA 官方文档中的「特殊寄存器：%nctaid」，归在「特殊寄存器」。重点关注 关键词 %nctaid、target，适合用于查特殊寄存器含义和可见范围。", "detailsZh": "中文提要：这是「特殊寄存器：%nctaid」对应的官方条目，分类为「特殊寄存器」。\n阅读重点：查特殊寄存器含义和可见范围。\n相关 API / 关键词：%nctaid、target。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Special Registers: %smid", "titleZh": "特殊寄存器：%smid", "numberedTitle": "10.8. Special Registers: %smid", "level": "H2", "chapter": "Special Registers", "chapterZh": "特殊寄存器", "parent": "", "parentZh": "", "kind": "Special Registers", "kindZh": "特殊寄存器", "summary": "%smid", "details": "%smid\nSM identifier.\nSyntax (predefined)\nDescription\nA predefined, read-only special register that returns the processor (SM) identifier on which a particular thread is executing.\nThe SM identifier ranges from 0 to %nsmid-1 .\nNotes\nNote that %smid returns the location of a thread at the moment when read, but its value may change during execution, e.g. due to rescheduling of threads following preemption.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#special-registers-smid", "tokens": ["%smid", "%nsmid"], "summaryZh": "本条整理 PTX ISA 官方文档中的「特殊寄存器：%smid」，归在「特殊寄存器」。重点关注 关键词 %smid、%nsmid，适合用于查特殊寄存器含义和可见范围。", "detailsZh": "中文提要：这是「特殊寄存器：%smid」对应的官方条目，分类为「特殊寄存器」。\n阅读重点：查特殊寄存器含义和可见范围。\n相关 API / 关键词：%smid、%nsmid。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Special Registers: %nsmid", "titleZh": "特殊寄存器：%nsmid", "numberedTitle": "10.9. Special Registers: %nsmid", "level": "H2", "chapter": "Special Registers", "chapterZh": "特殊寄存器", "parent": "", "parentZh": "", "kind": "Special Registers", "kindZh": "特殊寄存器", "summary": "%nsmid", "details": "%nsmid\nNumber of SM identifiers.\nSyntax (predefined)\nDescription\nA predefined, read-only special register that returns the maximum number of SM identifiers.\nThe SM identifier numbering is not guaranteed to be contiguous, so %nsmid may be larger than the physical number of SMs in the device.\nPTX ISA Notes\nIntroduced in PTX ISA version 2.0.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#special-registers-nsmid", "tokens": ["%nsmid"], "summaryZh": "本条整理 PTX ISA 官方文档中的「特殊寄存器：%nsmid」，归在「特殊寄存器」。重点关注 关键词 %nsmid，适合用于查特殊寄存器含义和可见范围。", "detailsZh": "中文提要：这是「特殊寄存器：%nsmid」对应的官方条目，分类为「特殊寄存器」。\n阅读重点：查特殊寄存器含义和可见范围。\n相关 API / 关键词：%nsmid。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Special Registers: %gridid", "titleZh": "特殊寄存器：%gridid", "numberedTitle": "10.10. Special Registers: %gridid", "level": "H2", "chapter": "Special Registers", "chapterZh": "特殊寄存器", "parent": "", "parentZh": "", "kind": "Special Registers", "kindZh": "特殊寄存器", "summary": "%gridid", "details": "%gridid\nGrid identifier.\nSyntax (predefined)\nDescription\nA predefined, read-only special register initialized with the per-grid temporal grid identifier.\nThe %gridid le": "Special Registers: %clock , %clock_hi", "titleZh": "特殊寄存器：%clock , %clock_hi", "numberedTitle": "10.23. Special Registers: %clock , %clock_hi", "level": "H2", "chapter": "Special Registers", "chapterZh": "特殊寄存器", "parent": "", "parentZh": "", "kind": "Special Registers", "kindZh": "特殊寄存器", "summary": "%clock , %clock_hi", "details": "%clock , %clock_hi\nSyntax (predefined)\nDescription\nSpecial register %clock and %clock_hi are unsigned 32-bit read-only cycle counters that wrap silently.\nPTX ISA Notes\n%clock introduced in PTX ISA version 1.0.\n%clock_hi introduced in PTX ISA version 5.0.\nTarget ISA Notes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#special-registers-clock", "tokens": ["%clock", "%clock_hi"], "summaryZh": "本条整理 PTX ISA 官方文档中的「特殊寄存器：%clock , %clock_hi」，归在「特殊寄存器」。重点关注 关键词 %clock、%clock_hi，适合用于查特殊寄存器含义和可见范围。", "detailsZh": "中文提要：这是「特殊寄存器：%clock , %clock_hi」对应的官方条目，分类为「特殊寄存器」。\n阅读重点：查特殊寄存器含义和可见范围。\n相关 API / 关键词：%clock、%clock_hi。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Special Registers: %clock64", "titleZh": "特殊寄存器：%clock64", "numberedTitle": "10.24. Special Registers: %clock64", "level": "H2", "chapter": "Special Registers", "chapterZh": "特殊寄存器", "parent": "", "parentZh": "", "kind": "Special Registers", "kindZh": "特殊寄存器", "summary": "%clock64", "details": "%clock64\nA predefined, read-only 64-bit unsigned cycle counter.\nSyntax (predefined)\nDescription\nSpecial register %clock64 is an unsigned 64-bit read-only cycle counter that wraps silently.\nNotes\nThe lower 32-bits of %clock64 are identical to %clock .\nThe upper 32-bits of %clock64 are identical to %clock_hi .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#special-registers-clock64", "tokens": ["%clock64", "%clock", "%clock_hi"], "summaryZh": "本条整理 PTX ISA 官方文档中的「特殊寄存器：%clock64」，归在「特殊寄存器」。重点关注 关键词 %clock64、%clock、%clock_hi，适合用于查特殊寄存器含义和可见范围。", "detailsZh": "中文提要：这是「特殊寄存器：%clock64」对应的官方条目，分类为「特殊寄存器」。\n阅读重点：查特殊寄存器含义 ed in PTX ISA version 3.1.\nTarget ISA Notes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#special-registers-globaltimer", "tokens": ["%globaltimer", "%globaltimer_lo", "%globaltimer_hi"], "summaryZh": "本条整理 PTX ISA 官方文档中的「特殊寄存器：%globaltimer , %globaltimer_lo , %globaltimer_hi」，归在「特殊寄存器」。重点关注 关键词 %globaltimer、%globaltimer_lo、%globaltimer_hi，适合用于查特殊寄存器含义和可见范围。", "detailsZh": "中文提要：这是「特殊寄存器：%globaltimer , %globaltimer_lo , %globaltimer_hi」对应的官方条目，分类为「特殊寄存器」。\n阅读重点：查特殊寄存器含义和可见范围。\n相关 API / 关键词：%globaltimer、%globaltimer_lo、%globaltimer_hi。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Special Registers: %reserved_smem_offset_begin , %reserved_smem_offset_end , %reserved_smem_offset_cap , %reserved_smem_offset_<2>", "titleZh": "特殊寄存器：%reserved_smem_offset_begin , %reserved_smem_offset_end , %reserved_smem_offset_cap , %reserved_smem_offset_<2>", "numberedTitle": "10.29. Special Registers: %reserved_smem_offset_begin , %reserved_smem_offset_end , %reserved_smem_offset_cap , %reserved_smem_offset_<2>", "level": "H2", "chapter": "Special Registers", "chapterZh": "特殊寄存器", "parent": "", "parentZh": "", "kind": "Special Registers", "kindZh": "特殊寄存器", "summary": "%reserved_smem_offset_begin , %reserved_smem_offset_end , %reserved_smem_offset_cap , %reserved_smem_offset_<2>", "details": "%reserved_smem_offset_begin , %reserved_smem_offset_end , %reserved_smem_offset_cap , %reserved_smem_offset_<2>\nSyntax (predefined)\nDescription\nThese are predefined, read-only special registers containing information about the shared memory region which is reserved for the NVIDIA system software use.\nThis region of shared memory is not available to users, and accessing this region from user code results in undefined behavior.\nPTX ISA Notes\nIntroduced in PTX ISA version 7.6.\nTarget ISA Notes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#special-registers-reserved-smem", "tokens": ["%reserved_smem_offset_begin", "%reserved_smem_offset_end", "%reserved_smem_offset_cap", "%reserved_smem_offset_"], "summaryZh": "本条整理 PTX ISA 官方文档中的「特殊寄存器：%reserved_smem_offset_begin , %reserved_smem_offset_end , %reserved_smem_offset_cap , %reserved_smem_offset_<2>」，归在「特殊寄存器」。重点关注 关键词 %reserved_smem_offset_begin、%reserved_smem_offset_end、%reserved_smem_offset_cap、%reserved_smem_offset_，适合用于查特殊寄存器含义和可见范围。", "detailsZh": "中文提要：这是「特殊寄存器：%reserved_smem_offset_begin , %reserved_smem_offset_end , %reserved_smem_offset_cap , %reserved_smem_offset_<2>」对应的官方条目，分类为「特殊寄存器」。\n阅读重点：查特殊寄存器含义和可见范围。\n相关 API / 关键词：%reserved_smem_offset_begin、%reserved_smem_offset_end、%reserved_smem_offset_cap、%reserved_smem_offset_。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Special Registers: %total_smem_size", "titleZh": "特殊寄存器：%total_smem_size", "numberedTitle": "10.30. Special Registers: %total_smem_size", "level": "H2", "chapter": "Special Registers", "chapterZh": "特殊寄存器", "parent": "", "parentZh": "", "kind": "Special Registers", "kindZh": "特殊寄存器", "summary": "%total_smem_size", "details": "%total_smem_size\nTotal size of shared memory used by a CTA of a kernel.\nSyntax (predefined)\nDescription\nA predefined, read-only special register initialized with total size of shared memory allocated (statically and dynamically, excluding the shared memory reserved for the NVIDIA system software use) for the CTA of a kernel at launch time.\nSize is returned in multiples of shared memory allocation unit size supported by target architecture.\nAllocation unit values are as follows:\nTarget architecture | Shared memory allocation unit size", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#special-registers-total-smem-size", "tokens": ["%total_smem_size"], "summaryZh": "本条整理 PTX ISA 官方文档中的「特殊寄存器：%total_smem_size」，归在「特殊寄存器」。重点关注 关键词 %total_smem_size，适合用于查特殊寄存器含义和可见范围。", "detailsZh": "中文提要：这是「特殊寄存器：%total_smem_size」对应的官方条目，分类为「特殊寄存器」。\n阅读重点：查特殊寄存器含义和可见范围。\n相关 API / 关键词：%total_smem_size。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Special Registers: %aggr_smem_size", "titleZh": "特殊寄存器：%aggr_smem_size", "numberedTitle": "10.31. Special Registers: %aggr_smem_size", "level": "H2", "chapter": "Special Registers", "chapterZh": "特殊寄存器", "parent": "", "parentZh": "", "kind": "Special Registers", "kindZh": "特殊寄存器", "summary": "%aggr_smem_size", "details": "%aggr_smem_size\nTotal size of shared memory used by a CTA of a kernel.\nSyntax (predefined)\nDescription\nA predefined, read-only special register initialized with total aggregated size of shared memory consisting of the size of user shared memory allocated (statically and dynamically) at launch time and the size of shared memory region which is reserved for the NVIDIA system software use.\nPTX ISA Notes\nIntroduced in PTX ISA version 8.1.\nTarget ISA Notes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#special-registers-aggr-smem-size", "tokens": ["%aggr_smem_size"], "summaryZh": "本条整理 PTX ISA 官方文档中的「特殊寄存器：%aggr_smem_size」，归在「特殊寄存器」。重点关注 关键词 %aggr_smem_size，适合用于查特殊寄存器含义和可见范围。", "detailsZh": "中文提要：这是「特殊寄存器：%aggr_smem_size」对应的官方条目，分类为「特殊寄存器」。\n阅读重点：查特殊寄存器含义和可见范围。\n相关 API / 关键词：%aggr_smem_size。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Special Registers: %dynamic_smem_size", "titleZh": "特殊寄存器：%dynamic_smem_size", "numberedTitle": "10.32. Special Registers: %dynamic_smem_size", "level": "H2", "chapter": "Special Registers", "chapterZh": "特殊寄存器", "parent": "", "parentZh": "", "kind": "Special Registers", "kindZh": "特殊寄存器", "summary": "%dynamic_smem_size", "details": "%dynamic_smem_size\nSize of shared memory allocated dynamically at kernel launch.\nSyntax (predefined)\nDescription\nSize of shared memory allocated dynamically at kernel launch.\nA predefined, read-only special register initialized with size of shared memory allocated dynamically for the CTA of a kernel at launch time.\nPTX ISA Notes\nIntroduced in PTX ISA version 4.1.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#special-registers-dynamic-smem-size", "tokens": ["%dynamic_smem_size"], "summaryZh": "本条整理 PTX ISA 官方文档中的「特殊寄存器：%dynamic_smem_size」，归在「特殊寄存器」。重点关注 关键词 %dynamic_smem_size，适合用于查特殊寄存器含义和可见范围。", "detailsZh": "中文提要：这是「特殊寄存器：%dynamic_smem_size」对应的官方条目，分类为「特殊寄存器」。\n阅读重点：查特殊寄存器含义和可见范围。\n相关 API / 关键词：%dynamic_smem_size。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Special Registers: %current_graph_exec", "titleZh": "特殊寄存器：%current_graph_exec", "numberedTitle": "10.33. Special Registers: %current_graph_exec", "level": "H2", "chapter": "Special Registers", "chapterZh": "特殊寄存器", "parent": "", "parentZh": "", "kind": "Special Registers", "kindZh": "特殊寄存器", "summary": "%current_graph_exec", "details": "%current_graph_exec\nAn Identifier for currently executing CUDA device graph.\nSyntax (predefined)\nDescription\nA predefined, read-only special register initialized with the identifier referring to the CUDA device graph being currently executed.\nThis register is 0 if the executing kernel is not part of a CUDA device graph.\nRefer to the CUDA Programming Guide for more details on CUDA device graphs.\nPTX ISA Notes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#special-registers-current-graph-exec", "tokens": ["%current_graph_exec"], "summaryZh": "本条整理 PTX ISA 官方文档中的「特殊寄存器：%current_graph_exec」，归在「特殊寄存器」。重点关注 关键词 %current_graph_exec，适合用于查特殊寄存器含义和可见范围。", "detailsZh": "中文提要：这是「特殊寄存器：%current_graph_exec」对应的官方条目，分类为「特殊寄存器」。\n阅读重点：查特殊寄存器含义和可见范围。\n相关 API / 关键词：%current_graph_exec。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Directives", "titleZh": "Directive", "numberedTitle": "11. Directives", "level": "H1", "chapter": "Special Registers", "chapterZh": "特殊寄存器", "parent": "", "parentZh": "", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "PTX ISA 文档章节：Directives", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#directives", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Directive」，归在「语法 / Directive」。重点关注 语法 / Directive，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「Directive」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。"}, {"title": "PTX Module Directives", "titleZh": "PTX 模块 Directive", "numberedTitle": "11.1. PTX Module Directives", "level": "H2", "chapter": "Directives", "chapterZh": "Directive", "parent": "", "parentZh": "", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "The following directives declare the PTX ISA version of the code in the module, the target architecture for which the code was generated, and the size of addresses within the PTX module.", "details": "The following directives declare the PTX ISA version of the code in the module, the target architecture for which the code was generated, and the size of addresses within the PTX module.\n.version\n.target\n.address_size", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#ptx-module-directives", "tokens": ["version", "target", "address_size"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX 模块 Directive」，归在「语法 / Directive」。重点关注 关键词 version、target、address_size，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「PTX 模块 Directive」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：version、target、address_size。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "PTX Module Directives: .version", "titleZh": "PTX 模块 Directive：.version", "numberedTitle": "11.1.1. PTX Module Directives: .version", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "PTX Module Directives", "parentZh": "PTX 模块 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".version", "details": ".version\nPTX ISA version number.\nSyntax\nDescription\nSpecifies the PTX language version number.\nThe major number is incremented when there are incompatible changes to the PTX language, such as changes to the syntax or semantics.\nThe version major number is used by the PTX compiler to ensure correct execution of legacy PTX code.\nThe minor number is incremented when new features are added to PTX.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#ptx-module-directives-version", "tokens": ["version"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX 模块 Directive：.version」，归在「语法 / Directive」。重点关注 关键词 version，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「PTX 模块 Directive：.version」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：version。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "PTX Module Directives: .target", "titleZh": "PTX 模块 Directive：.target", "numberedTitle": "11.1.2. PTX Module Directives: .target", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "PTX Module Directives", "parentZh": "PTX 模块 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".target", "details": ".target\nArchitecture and Platform target.\nSyntax\nDescription\nSpecifies the set of features in the target architecture for which the current PTX code was generated.\nIn general, generations of SM architectures follow an onion layer model, where each generation adds new features and retains all features of previous generations.\nTarget architectures with suffix “ a ”, such as sm_90a , include architecture-specific features that are supported on the specified architecture only, hence such targets do not follow the onion layer model.\nTherefore, PTX code generated for such targets cannot be run on later generation devices.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#ptx-module-directives-target", "tokens": ["target", "sm_90a"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX 模块 Directive：.target」，归在「语法 / Directive」。重点关注 关键词 target、sm_90a，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「PTX 模块 Directive：.target」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：target、sm_90a。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "PTX Module Directives: .address_size", "titleZh": "PTX Module Directives: .address_size", "numberedTitle": "11.1.3. PTX Module Directives: .address_size", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "PTX Module Directives", "parentZh": "PTX 模块 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".address_size", "details": ".address_size\nAddress size used throughout PTX module.\nSyntax\nDescription\nSpecifies the address size assumed throughout the module by the PTX code and the binary DWARF information in PTX.\nRedefinition of this directive within a module is not allowed.\nIn the presence of separate compilation all modules must specify (or default to) the same address size.\nThe .address_size directive is optional, but it must immediately follow the .target directive if present within a module.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#ptx-module-directives-address-size", "tokens": ["address_size", "target"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX Module Directives: .address_size」，归在「语法 / Directive」。重点关注 关键词 address_size、target，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「PTX Module Directives: .address_size」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：address_size、target。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Specifying Kernel Entry Points and Functions", "titleZh": "Specifying Kernel Entry Points 与函数", "numberedTitle": "11.2. Specifying Kernel Entry Points and Functions", "level": "H2", "chapter": "Directives", "chapterZh": "Directive", "parent": "", "parentZh": "", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "The following directives specify kernel entry points and functions.", "details": "The following directives specify kernel entry points and functions.\n.entry\n.func", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#specifying-kernel-entry-points-and-functions", "tokens": ["entry", "func"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Specifying Kernel Entry Points 与函数」，归在「语法 / Directive」。重点关注 关键词 entry、func，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「Specifying Kernel Entry Points 与函数」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：entry、func。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Kernel and Function Directives: .entry", "titleZh": "Kernel 与函数 Directive：.entry", "numberedTitle": "11.2.1. Kernel and Function Directives: .entry", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Specifying Kernel Entry Points and Functions", "parentZh": "Specifying Kernel Entry Points 与函数", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".entry", "details": ".entry\nKernel entry point and body, with optional parameters.\nSyntax\nDescription\nDefines a kernel entry point name, parameters, and body for the kernel function.\nParameters are passed via .param space memory and are listed within an optional parenthesized parameter list.\nParameters may be referenced by name within the kernel body and loaded into registers using ld.param{::entry} instructions.\nIn addition to normal parameters, opaque .texref , .samplerref , and .surfref variables may be passed as parameters.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#kernel-and-function-directives-entry", "tokens": ["entry", "param", "ld.param", "texref", "samplerref", "surfref"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Kernel 与函数 Directive：.entry」，归在「语法 / Directive」。重点关注 关键词 entry、param、ld.param、texref、samplerref，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「Kernel 与函数 Directive：.entry」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：entry、param、ld.param、texref、samplerref、surfref。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Kernel and Function Directives: .func", "titleZh": "Kernel 与函数 Directive：.func", "numberedTitle": "11.2.2. Kernel and Function Directives: .func", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Specifying Kernel Entry Points and Functions", "parentZh": "Specifying Kernel Entry Points 与函数", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".func", "details": ".func\nFunction definition.\nSyntax\nDescription\nDefines a function, including input and return parameters and optional function body.\nAn optional .noreturn directive indicates that the function does not return to the caller function.\n.noreturn directive cannot be specified on functions which have return parameters.\nAn optional .attribute directive specifies additional information associated with the function.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#kernel-and-function-directives-func", "tokens": ["func", "noreturn", "attribute"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Kernel 与函数 Directive：.func」，归在「语法 / Directive」。重点关注 关键词 func、noreturn、attribute，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「Kernel 与函数 Directive：.func」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：func、noreturn、attribute。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Kernel and Function Directives: .alias", "titleZh": "Kernel 与函数 Directive：.alias", "numberedTitle": "11.2.3. Kernel and Function Directives: .alias", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Specifying Kernel Entry Points and Functions", "parentZh": "Specifying Kernel Entry Points 与函数", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".alias", "details": ".alias\nDefine an alias to existing function symbol.\nSyntax\nDescription\n.alias is a module scope directive that defines identifier fAlias to be an alias to function specified by fAliasee .\nBoth fAlias and fAliasee are non-entry function symbols.\nIdentifier fAlias is a function declaration without body.\nIdentifier fAliasee is a function symbol which must be defined in the same module as .alias declaration.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#kernel-and-function-directives-alias", "tokens": ["alias"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Kernel 与函数 Directive：.alias」，归在「语法 / Directive」。重点关注 关键词 alias，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「Kernel 与函数 Directive：.alias」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：alias。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Control Flow Directives", "titleZh": "控制流 Directive", "numberedTitle": "11.3. Control Flow Directives", "level": "H2", "chapter": "Directives", "chapterZh": "Directive", "parent": "", "parentZh": "", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "PTX provides directives for specifying potential targets for brx.idx and call instructions. See the descriptions of brx.idx and call for more information.", "details": "PTX provides directives for specifying potential targets for brx.idx and call instructions.\nSee the descriptions of brx.idx and call for more information.\n.branchtargets\n.calltargets\n.callprototype", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#control-flow-directives", "tokens": ["brx.idx", "branchtargets", "calltargets", "callprototype"], "summaryZh": "本条整理 PTX ISA 官方文档中的「控制流 Directive」，归在「语法 / Directive」。重点关注 关键词 brx.idx、branchtargets、calltargets、callprototype，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「控制流 Directive」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：brx.idx、branchtargets、calltargets、callprototype。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Control Flow Directives: .branchtargets", "titleZh": "控制流 Directive：.branchtargets", "numberedTitle": "11.3.1. Control Flow Directives: .branchtargets", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Control Flow Directives", "parentZh": "控制流 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".branchtargets", "details": ".branchtargets\nDeclare a list of potential branch targets.\nSyntax\nDescription\nDeclares a list of potential branch targets for a subsequent brx.idx , and associates the list with the label at the start of the line.\nAll control flow labels in the list must occur within the same function as the declaration.\nThe list of labels may use the compact, shorthand syntax for enumerating a range of labels having a common prefix, similar to the syntax described in Parameterized Variable Names .\nPTX ISA Notes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#control-flow-directives-branchtargets", "tokens": ["branchtargets", "brx.idx"], "summaryZh": "本条整理 PTX ISA 官方文档中的「控制流 Directive：.branchtargets」，归在「语法 / Directive」。重点关注 关键词 branchtargets、brx.idx，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「控制流 Directive：.branchtargets」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：branchtargets、brx.idx。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Control Flow Directives: .calltargets", "titleZh": "控制流 Directive：.calltargets", "numberedTitle": "11.3.2. Control Flow Directives: .calltargets", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Control Flow Directives", "parentZh": "控制流 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".calltargets", "details": ".calltargets\nDeclare a list of potential call targets.\nSyntax\nDescription\nDeclares a list of potential call targets for a subsequent indirect call, and associates the list with the label at the start of the line.\nAll functions named in the list must be declared prior to the .calltargets directive, and all functions must have the same type signature.\nPTX ISA Notes\nIntroduced in PTX ISA version 2.1.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#control-flow-directives-calltargets", "tokens": ["calltargets"], "summaryZh": "本条整理 PTX ISA 官方文档中的「控制流 Directive：.calltargets」，归在「语法 / Directive」。重点关注 关键词 calltargets，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「控制流 Directive：.calltargets」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：calltargets。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Control Flow Directives: .callprototype", "titleZh": "控制流 Directive：.callprototype", "numberedTitle": "11.3.3. Control Flow Directives: .callprototype", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Control Flow Directives", "parentZh": "控制流 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".callprototype", "details": ".callprototype\nDeclare a prototype for use in an indirect call.\nSyntax\nDescription\nDefines a prototype with no specific function name, and associates the prototype with a label.\nThe prototype may then be used in indirect call instructions where there is incomplete knowledge of the possible call targets.\nParameters may have either base types in the register or parameter state spaces, or array types in parameter state space.\nThe sink symbol '_' may be used to avoid dummy parameter names.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#control-flow-directives-callprototype", "tokens": ["callprototype"], "summaryZh": "本条整理 PTX ISA 官方文档中的「控制流 Directive：.callprototype」，归在「语法 / Directive」。重点关注 关键词 callprototype，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「控制流 Directive：.callprototype」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：callprototype。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Performance-Tuning Directives", "titleZh": "性能调优 Directive", "numberedTitle": "11.4. Performance-Tuning Directives", "level": "H2", "chapter": "Directives", "chapterZh": "Directive", "parent": "", "parentZh": "", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "To provide a mechanism for low-level performance tuning, PTX supports the following directives, which pass information to the optimizing backend compiler.", "details": "To provide a mechanism for low-level performance tuning, PTX supports the following directives, which pass information to the optimizing backend compiler.\n.maxnreg\n.maxntid\n.reqntid\n.minnctapersm\n.maxnctapersm (deprecated)\n.pragma\n.abi_preserve", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#performance-tuning-directives", "tokens": ["maxnreg", "maxntid", "reqntid", "minnctapersm", "maxnctapersm", "pragma", "abi_preserve"], "summaryZh": "本条整理 PTX ISA 官方文档中的「性能调优 Directive」，归在「语法 / Directive」。重点关注 关键词 maxnreg、maxntid、reqntid、minnctapersm、maxnctapersm，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「性能调优 Directive」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：maxnreg、maxntid、reqntid、minnctapersm、maxnctapersm、pragma、abi_preserve。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Performance-Tuning Directives: .maxnreg", "titleZh": "性能调优 Directive：.maxnreg", "numberedTitle": "11.4.1. Performance-Tuning Directives: .maxnreg", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Performance-Tuning Directives", "parentZh": "性能调优 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".maxnreg", "details": ".maxnreg\nMaximum number of registers that can be allocated per thread.\nSyntax\nDescription\nDeclare the maximum number of registers per thread in a CTA.\nSemantics\nThe compiler guarantees that this limit will not be exceeded.\nThe actual number of registers used may be less; for example, the backend may be able to compile to fewer registers, or the maximum number of registers may be further constrained by .maxntid and .maxctapersm .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#performance-tuning-directives-maxnreg", "tokens": ["maxnreg", "maxntid", "maxctapersm"], "summaryZh": "本条整理 PTX ISA 官方文档中的「性能调优 Directive：.maxnreg」，归在「语法 / Directive」。重点关注 关键词 maxnreg、maxntid、maxctapersm，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「性能调优 Directive：.maxnreg」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：maxnreg、maxntid、maxctapersm。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Performance-Tuning Directives: .maxntid", "titleZh": "性能调优 Directive：.maxntid", "numberedTitle": "11.4.2. Performance-Tuning Directives: .maxntid", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Performance-Tuning Directives", "parentZh": "性能调优 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".maxntid", "details": ".maxntid\nMaximum number of threads in the thread block (CTA).\nSyntax\nDescription\nDeclare the maximum number of threads in the thread block (CTA).\nThis maximum is specified by giving the maximum extent of each dimension of the 1D, 2D, or 3D CTA.\nSemantics\nThe maximum number of threads in the thread block, computed as the product of the maximum extent specified for each dimension, is guaranteed not to be exceeded in any invocation of the kernel in which this directive appears.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#performance-tuning-directives-maxntid", "tokens": ["maxntid"], "summaryZh": "本条整理 PTX ISA 官方文档中的「性能调优 Directive：.maxntid」，归在「语法 / Directive」。重点关注 关键词 maxntid，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「性能调优 Directive：.maxntid」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：maxntid。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Performance-Tuning Directives: .reqntid", "titleZh": "性能调优 Directive：.reqntid", "numberedTitle": "11.4.3. Performance-Tuning Directives: .reqntid", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Performance-Tuning Directives", "parentZh": "性能调优 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Di
