rective", "summary": ".reqntid", "details": ".reqntid\nNumber of threads in the thread block (CTA).\nSyntax\nDescription\nDeclare the number of threads in the thread block (CTA) by specifying the extent of each dimension of the 1D, 2D, or 3D CTA.\nThe total number of threads is the product of the number of threads in each dimension.\nSemantics\nThe size of each CTA dimension specified in any invocation of the kernel is required to be equal to that specified in this directive.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#performance-tuning-directives-reqntid", "tokens": ["reqntid"], "summaryZh": "本条整理 PTX ISA 官方文档中的「性能调优 Directive：.reqntid」，归在「语法 / Directive」。重点关注 关键词 reqntid，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「性能调优 Directive：.reqntid」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：reqntid。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Performance-Tuning Directives: .minnctapersm", "titleZh": "性能调优 Directive：.minnctapersm", "numberedTitle": "11.4.4. Performance-Tuning Directives: .minnctapersm", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Performance-Tuning Directives", "parentZh": "性能调优 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".minnctapersm", "details": ".minnctapersm\nMinimum number of CTAs per SM.\nSyntax\nDescription\nDeclare the minimum number of CTAs from the kernel’s grid to be mapped to a single multiprocessor (SM).\nNotes\nOptimizations based on .minnctapersm need either .maxntid or .reqntid to be specified as well.\nIf the total number of threads on a single SM resulting from .minnctapersm and .maxntid / .reqntid exceed maximum number of threads supported by an SM then directive .minnctapersm will be ignored.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#performance-tuning-directives-minnctapersm", "tokens": ["minnctapersm", "maxntid", "reqntid"], "summaryZh": "本条整理 PTX ISA 官方文档中的「性能调优 Directive：.minnctapersm」，归在「语法 / Directive」。重点关注 关键词 minnctapersm、maxntid、reqntid，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「性能调优 Directive：.minnctapersm」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：minnctapersm、maxntid、reqntid。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Performance-Tuning Directives: .maxnctapersm (deprecated)", "titleZh": "性能调优 Directive：.maxnctapersm （已弃用）", "numberedTitle": "11.4.5. Performance-Tuning Directives: .maxnctapersm (deprecated)", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Performance-Tuning Directives", "parentZh": "性能调优 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".maxnctapersm", "details": ".maxnctapersm\nMaximum number of CTAs per SM.\nSyntax\nDescription\nDeclare the maximum number of CTAs from the kernel’s grid that may be mapped to a single multiprocessor (SM).\nNotes\nOptimizations based on .maxnctapersm generally need .maxntid to be specified as well.\nThe optimizing backend compiler uses .maxntid and .maxnctapersm to compute an upper-bound on per-thread register usage so that the specified number of CTAs can be mapped to a single multiprocessor.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#performance-tuning-directives-maxnctapersm", "tokens": ["maxnctapersm", "maxntid"], "summaryZh": "本条整理 PTX ISA 官方文档中的「性能调优 Directive：.maxnctapersm （已弃用）」，归在「语法 / Directive」。重点关注 关键词 maxnctapersm、maxntid，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「性能调优 Directive：.maxnctapersm （已弃用）」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：maxnctapersm、maxntid。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Performance-Tuning Directives: .noreturn", "titleZh": "性能调优 Directive：.noreturn", "numberedTitle": "11.4.6. Performance-Tuning Directives: .noreturn", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Performance-Tuning Directives", "parentZh": "性能调优 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".noreturn", "details": ".noreturn\nIndicate that the function does not return to its caller function.\nSyntax\nDescription\nIndicate that the function does not return to its caller function.\nSemantics\nAn optional .noreturn directive indicates that the function does not return to caller function.\n.noreturn directive can only be specified on device functions and must appear between a .func directive and its body.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#performance-tuning-directives-noreturn", "tokens": ["noreturn", "func"], "summaryZh": "本条整理 PTX ISA 官方文档中的「性能调优 Directive：.noreturn」，归在「语法 / Directive」。重点关注 关键词 noreturn、func，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「性能调优 Directive：.noreturn」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：noreturn、func。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Performance-Tuning Directives: .pragma", "titleZh": "性能调优 Directive：.pragma", "numberedTitle": "11.4.7. Performance-Tuning Directives: .pragma", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Performance-Tuning Directives", "parentZh": "性能调优 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".pragma", "details": ".pragma\nPass directives to PTX backend compiler.\nSyntax\nDescription\nPass module-scoped, entry-scoped, or statement-level directives to the PTX backend compiler.\nThe .pragma directive may occur at module-scope, at entry-scope, or at statement-level.\nSemantics\nThe interpretation of .pragma directive strings is implementation-specific and has no impact on PTX semantics.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#performance-tuning-directives-pragma", "tokens": ["pragma"], "summaryZh": "本条整理 PTX ISA 官方文档中的「性能调优 Directive：.pragma」，归在「语法 / Directive」。重点关注 关键词 pragma，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「性能调优 Directive：.pragma」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：pragma。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Performance-Tuning Directives: .abi_preserve", "titleZh": "Performance-Tuning Directives: .abi_preserve", "numberedTitle": "11.4.8. Performance-Tuning Directives: .abi_preserve", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Performance-Tuning Directives", "parentZh": "性能调优 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".abi_preserve", "details": ".abi_preserve\nSpecify number of general purpose registers that should be preserved by the callers of this function.\nSyntax\nDescription\nIt is an architecture agnostic value specifying actual number of general purpose registers.\nInternally ABI defines some general purpose registers as preserved (callee save) registers.\n.abi_preserve directive can only be specified on device functions and must appear between a .func directive and its body.\nSemantics", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#performance-tuning-directives-abi-preserve", "tokens": ["abi_preserve", "func"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Performance-Tuning Directives: .abi_preserve」，归在「语法 / Directive」。重点关注 关键词 abi_preserve、func，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「Performance-Tuning Directives: .abi_preserve」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：abi_preserve、func。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Performance-Tuning Directives: .abi_preserve_control", "titleZh": "Performance-Tuning Directives: .abi_preserve_control", "numberedTitle": "11.4.9. Performance-Tuning Directives: .abi_preserve_control", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Performance-Tuning Directives", "parentZh": "性能调优 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".abi_preserve_control", "details": ".abi_preserve_control\nSpecify number of control registers that should be preserved by the callers of this function.\nSyntax\nDescription\nIt is an architecture agnostic value specifying the number of divergent program points that happen in the calltree leading to current function call.\nInternally ABI defines some control registers as preserved (callee save) registers.\n.abi_preserve_control directive can only be specified on device functions and must appear between a .func directive and its body.\nSemantics", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#performance-tuning-directives-abi-preserve-control", "tokens": ["abi_preserve_control", "func"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Performance-Tuning Directives: .abi_preserve_control」，归在「语法 / Directive」。重点关注 关键词 abi_preserve_control、func，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「Performance-Tuning Directives: .abi_preserve_control」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：abi_preserve_control、func。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Debugging Directives", "titleZh": "调试 Directive", "numberedTitle": "11.5. Debugging Directives", "level": "H2", "chapter": "Directives", "chapterZh": "Directive", "parent": "", "parentZh": "", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "DWARF-format debug information is passed through PTX modules using the following directives:", "details": "DWARF-format debug information is passed through PTX modules using the following directives:\n@@DWARF\n.section\n.file\n.loc\nThe .section directive was introduced in PTX ISA version 2.0 and replaces the @@DWARF syntax.\nThe @@DWARF syntax was deprecated in PTX ISA version 2.0 but is supported for legacy PTX ISA version 1.x code.\nBeginning with PTX ISA version 3.0, PTX files containing DWARF debug information should include the .target debug platform option.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#debugging-directives", "tokens": ["section", "file", "loc", "target"], "summaryZh": "本条整理 PTX ISA 官方文档中的「调试 Directive」，归在「语法 / Directive」。重点关注 关键词 section、file、loc、target，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「调试 Directive」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：section、file、loc、target。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Debugging Directives: @@dwarf", "titleZh": "调试 Directive：@@dwarf", "numberedTitle": "11.5.1. Debugging Directives: @@dwarf", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Debugging Directives", "parentZh": "调试 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "@@dwarf", "details": "@@dwarf\nDWARF-format information.\nSyntax\nPTX ISA Notes\nIntroduced in PTX ISA version 1.2.\nDeprecated as of PTX ISA version 2.0, replaced by .section directive.\nTarget ISA Notes\nSupported on all target architectures.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#debugging-directives-atatdwarf", "tokens": ["section"], "summaryZh": "本条整理 PTX ISA 官方文档中的「调试 Directive：@@dwarf」，归在「语法 / Directive」。重点关注 关键词 section，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「调试 Directive：@@dwarf」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：section。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Debugging Directives: .section", "titleZh": "调试 Directive：.section", "numberedTitle": "11.5.2. Debugging Directives: .section", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Debugging Directives", "parentZh": "调试 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".section", "details": ".section\nPTX section definition.\nSyntax\nPTX ISA Notes\nIntroduced in PTX ISA version 2.0, replaces @@DWARF syntax.\nlabel+imm expression introduced in PTX ISA version 3.2.\nSupport for .b16 integers in dwarf-lines introduced in PTX ISA version 6.0.\nSupport for defining label inside the DWARF section is introduced in PTX ISA version 7.2.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#debugging-directives-section", "tokens": ["section", "b16"], "summaryZh": "本条整理 PTX ISA 官方文档中的「调试 Directive：.section」，归在「语法 / Directive」。重点关注 关键词 section、b16，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「调试 Directive：.section」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：section、b16。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Debugging Directives: .file", "titleZh": "调试 Directive：.file", "numberedTitle": "11.5.3. Debugging Directives: .file", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Debugging Directives", "parentZh": "调试 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".file", "details": ".file\nSource file name.\nSyntax\nDescription\nAssociates a source filename with an integer index.\n.loc directives reference source files by index.\n.file directive allows optionally specifying an unsigned number representing time of last modification and an unsigned integer representing size in bytes of source file. timestamp and file_size value can be 0 to indicate this information is not available.\ntimestamp value is in format of C and C++ data type time_t .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#debugging-directives-file", "tokens": ["file", "loc"], "summaryZh": "本条整理 PTX ISA 官方文档中的「调试 Directive：.file」，归在「语法 / Directive」。重点关注 关键词 file、loc，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「调试 Directive：.file」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：file、loc。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Debugging Directives: .loc", "titleZh": "调试 Directive：.loc", "numberedTitle": "11.5.4. Debugging Directives: .loc", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Debugging Directives", "parentZh": "调试 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".loc", "details": ".loc\nSource file location.\nSyntax\nDescription\nDeclares the source file location (source file, line number, and column position) to be associated with lexically subsequent PTX instructions.\n.loc refers to file_index which is defined by a .file directive.\nTo indicate PTX instructions that are generated from a function that got inlined, additional attribute .inlined_at can be specified as part of the .loc directive.\n.inlined_at attribute specifies source location at which the specified function is inlined. file_index2 , line_number2 , and column_position2 specify the location at which function is inlined.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#debugging-directives-loc", "tokens": ["loc", "file", "inlined_at"], "summaryZh": "本条整理 PTX ISA 官方文档中的「调试 Directive：.loc」，归在「语法 / Directive」。重点关注 关键词 loc、file、inlined_at，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「调试 Directive：.loc」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：loc、file、inlined_at。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Linking Directives", "titleZh": "链接 Directive", "numberedTitle": "11.6. Linking Directives", "level": "H2", "chapter": "Directives", "chapterZh": "Directive", "parent": "", "parentZh": "", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "PTX ISA 文档章节：Linking Directives", "details": ".extern\n.visible\n.weak", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#linking-directives", "tokens": ["extern", "visible", "weak"], "summaryZh": "本条整理 PTX ISA 官方文档中的「链接 Directive」，归在「语法 / Directive」。重点关注 关键词 extern、visible、weak，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「链接 Directive」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：extern、visible、weak。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Linking Directives: .extern", "titleZh": "链接 Directive：.extern", "numberedTitle": "11.6.1. Linking Directives: .extern", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Linking Directives", "parentZh": "链接 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".extern", "details": ".extern\nExternal symbol declaration.\nSyntax\nDescription\nDeclares identifier to be defined external to the current module.\nThe module defining such identifier must define it as .weak or .visible only once in a single object file.\nPTX ISA Notes\nIntroduced in PTX ISA version 1.0.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#linking-directives-extern", "tokens": ["extern", "weak", "visible"], "summaryZh": "本条整理 PTX ISA 官方文档中的「链接 Directive：.extern」，归在「语法 / Directive」。重点关注 关键词 extern、weak、visible，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「链接 Directive：.extern」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：extern、weak、visible。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Linking Directives: .visible", "titleZh": "链接 Directive：.visible", "numberedTitle": "11.6.2. Linking Directives: .visible", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Linking Directives", "parentZh": "链接 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".visible", "details": ".visible\nVisible (externally) symbol declaration.\nSyntax\nDescription\nDeclares identifier to be globally visible.\nUnlike C, where identifiers are globally visible unless declared static, PTX identifiers are visible only within the current module unless declared .visible outside the current.\nPTX ISA Notes\nIntroduced in PTX ISA version 1.0.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#linking-directives-visible", "tokens": ["visible"], "summaryZh": "本条整理 PTX ISA 官方文档中的「链接 Directive：.visible」，归在「语法 / Directive」。重点关注 关键词 visible，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「链接 Directive：.visible」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：visible。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Linking Directives: .weak", "titleZh": "链接 Directive：.weak", "numberedTitle": "11.6.3. Linking Directives: .weak", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Linking Directives", "parentZh": "链接 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".weak", "details": ".weak\nVisible (externally) symbol declaration.\nSyntax\nDescription\nDeclares identifier to be globally visible but weak .\nWeak symbols are similar to globally visible symbols, except during linking, weak symbols are only chosen after globally visible symbols during symbol resolution.\nPTX ISA Notes\nIntroduced in PTX ISA version 3.1.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#linking-directives-weak", "tokens": ["weak"], "summaryZh": "本条整理 PTX ISA 官方文档中的「链接 Directive：.weak」，归在「语法 / Directive」。重点关注 关键词 weak，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「链接 Directive：.weak」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：weak。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Linking Directives: .common", "titleZh": "链接 Directive：.common", "numberedTitle": "11.6.4. Linking Directives: .common", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Linking Directives", "parentZh": "链接 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".common", "details": ".common\nVisible (externally) symbol declaration.\nSyntax\nDescription\nDeclares identifier to be globally visible but “common”.\nCommon symbols are similar to globally visible symbols.\nHowever multiple object files may declare the same common symbol and they may have different types and sizes and references to a symbol get resolved against a common symbol with the largest size.\nOnly one object file can initialize a common symbol and that must have the largest size among all other definitions of that common symbol from different object files.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#linking-directives-common", "tokens": ["common"], "summaryZh": "本条整理 PTX ISA 官方文档中的「链接 Directive：.common」，归在「语法 / Directive」。重点关注 关键词 common，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「链接 Directive：.common」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：common。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Cluster Dimension Directives", "titleZh": "集群 Dimension Directive", "numberedTitle": "11.7. Cluster Dimension Directives", "level": "H2", "chapter": "Directives", "chapterZh": "Directive", "parent": "", "parentZh": "", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "The following directives specify information about clusters:", "details": "The following directives specify information about clusters:\n.reqnctapercluster\n.explicitcluster\n.maxclusterrank\nThe .reqnctapercluster directive specifies the number of CTAs in the cluster.\nThe .explicitcluster directive specifies that the kernel should be launched with explicit cluster details.\nThe cluster dimension directives can be applied only on kernel functions.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#cluster-dimension-directives", "tokens": ["reqnctapercluster", "explicitcluster", "maxclusterrank"], "summaryZh": "本条整理 PTX ISA 官方文档中的「集群 Dimension Directive」，归在「语法 / Directive」。重点关注 关键词 reqnctapercluster、explicitcluster、maxclusterrank，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「集群 Dimension Directive」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：reqnctapercluster、explicitcluster、maxclusterrank。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Cluster Dimension Directives: .reqnctapercluster", "titleZh": "集群 Dimension Directive：.reqnctapercluster", "numberedTitle": "11.7.1. Cluster Dimension Directives: .reqnctapercluster", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Cluster Dimension Directives", "parentZh": "集群 Dimension Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".reqnctapercluster", "details": ".reqnctapercluster\nDeclare the number of CTAs in the cluster.\nSyntax\nDescription\nSet the number of thread blocks (CTAs) in the cluster by specifying the extent of each dimension of the 1D, 2D, or 3D cluster.\nThe total number of CTAs is the product of the number of CTAs in each dimension.\nSemantics\nIf cluster dimension is explicitly specified at launch time, it should be equal to the values specified in this directive.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#cluster-dimension-directives-reqnctapercluster", "tokens": ["reqnctapercluster"], "summaryZh": "本条整理 PTX ISA 官方文档中的「集群 Dimension Directive：.reqnctapercluster」，归在「语法 / Directive」。重点关注 关键词 reqnctapercluster，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「集群 Dimension Directive：.reqnctapercluster」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：reqnctapercluster。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Cluster Dimension Directives: .explicitcluster", "titleZh": "集群 Dimension Directive：.explicitcluster", "numberedTitle": "11.7.2. Cluster Dimension Directives: .explicitcluster", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Cluster Dimension Directives", "parentZh": "集群 Dimension Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".explicitcluster", "details": ".explicitcluster\nDeclare that Kernel must be launched with cluster dimensions explicitly specified.\nSyntax\nDescription\nDeclares that this Kernel should be launched with cluster dimension explicitly specified.\nSemantics\nKernels with .explicitcluster directive must be launched with cluster dimension explicitly specified (either at launch time or via .reqnctapercluster ), otherwise program will fail with runtime error or kernel launch failure.\nPTX ISA Notes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#cluster-dimension-directives-explicitcluster", "tokens": ["explicitcluster", "reqnctapercluster"], "summaryZh": "本条整理 PTX ISA 官方文档中的「集群 Dimension Directive：.explicitcluster」，归在「语法 / Directive」。重点关注 关键词 explicitcluster、reqnctapercluster，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「集群 Dimension Directive：.explicitcluster」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：explicitcluster、reqnctapercluster。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Cluster Dimension Directives: .maxclusterrank", "titleZh": "集群 Dimension Directive：.maxclusterrank", "numberedTitle": "11.7.3. Cluster Dimension Directives: .maxclusterrank", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Cluster Dimension Directives", "parentZh": "集群 Dimension Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".maxclusterrank", "details": ".maxclusterrank\nDeclare the maximum number of CTAs that can be part of the cluster.\nSyntax\nDescription\nDeclare the maximum number of thread blocks (CTAs) allowed to be part of the cluster.\nSemantics\nProduct of the number of CTAs in each cluster dimension specified in any invocation of the kernel is required to be less or equal to that specified in this directive.\nOtherwise invocation will result in a runtime error or kernel launch failure.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#cluster-dimension-directives-maxclusterrank", "tokens": ["maxclusterrank"], "summaryZh": "本条整理 PTX ISA 官方文档中的「集群 Dimension Directive：.maxclusterrank」，归在「语法 / Directive」。重点关注 关键词 maxclusterrank，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「集群 Dimension Directive：.maxclusterrank」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：maxclusterrank。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Miscellaneous Directives", "titleZh": "杂项 Directive", "numberedTitle": "11.8. Miscellaneous Directives", "level": "H2", "chapter": "Directives", "chapterZh": "Directive", "parent": "", "parentZh": "", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "PTX provides the following miscellaneous directives:", "details": "PTX provides the following miscellaneous directives:\n.blocksareclusters\n.language", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#miscellaneous-directives", "tokens": ["blocksareclusters", "language"], "summaryZh": "本条整理 PTX ISA 官方文档中的「杂项 Directive」，归在「语法 / Directive」。重点关注 关键词 blocksareclusters、language，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「杂项 Directive」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：blocksareclusters、language。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Miscellaneous Directives: .blocksareclusters", "titleZh": "杂项 Directive：.blocksareclusters", "numberedTitle": "11.8.1. Miscellaneous Directives: .blocksareclusters", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Miscellaneous Directives", "parentZh": "杂项 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".blocksareclusters", "details": ".blocksareclusters\nSpecify that CUDA thread blocks are mapped to clusters.\nSyntax\nDescription\nDefault behavior of CUDA API is to specify the grid launch configuration by specifying the number of thread blocks and the number of threads per block.\nWhen .blocksareclusters directive is specified, it implies that the grid launch configuration for the corresponding .entry function is specifying the number of clusters, i.e. the launch configuration is specifying number of clusters instead of the number of thread blocks.\nIn this case, the number of thread blocks per cluster is specified by .reqnctapercluster directive and the thread block size is specified with the .reqntid directive.\n.blocksareclusters directive is only allowed for .entry functions and also needs .reqntid and .reqnctapercluster directives to be specified.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#miscellaneous-directives-blocksareclusters", "tokens": ["blocksareclusters", "entry", "reqnctapercluster", "reqntid"], "summaryZh": "本条整理 PTX ISA 官方文档中的「杂项 Directive：.blocksareclusters」，归在「语法 / Directive」。重点关注 关键词 blocksareclusters、entry、reqnctapercluster、reqntid，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「杂项 Directive：.blocksareclusters」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：blocksareclusters、entry、reqnctapercluster、reqntid。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Miscellaneous Directives: .language", "titleZh": "杂项 Directive：.language", "numberedTitle": "11.8.2. Miscellaneous Directives: .language", "level": "H3", "chapter": "Directives", "chapterZh": "Directive", "parent": "Miscellaneous Directives", "parentZh": "杂项 Directive", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": ".language", "details": ".language\nSpecify the source language(s) used to generate the kernel or function.\nSyntax\nDescription\nThe .language directive declares the source language(s) from which the code for the corresponding .entry or .func function was generated.\nThe directive accepts a comma-separated list of language codes, specified as either quoted string names or unsigned integer values.\nThe .language directive is allowed for both .entry and .func functions and must appear between the function directive and its body.\nIf the .language directive is not specified, the language defaults to \"ptx\" .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#miscellaneous-directives-language", "tokens": ["language", "entry", "func"], "summaryZh": "本条整理 PTX ISA 官方文档中的「杂项 Directive：.language」，归在「语法 / Directive」。重点关注 关键词 language、entry、func，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「杂项 Directive：.language」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：language、entry、func。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Descriptions of .pragma Strings", "titleZh": ".pragma 字符串说明", "numberedTitle": "12. Descriptions of .pragma Strings", "level": "H1", "chapter": "Directives", "chapterZh": "Directive", "parent": "", "parentZh": "", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "This section describes the .pragma strings defined by ptxas.", "details": "This section describes the .pragma strings defined by ptxas.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#descriptions-pragma-strings", "tokens": ["pragma"], "summaryZh": "本条整理 PTX ISA 官方文档中的「.pragma 字符串说明」，归在「语法 / Directive」。重点关注 关键词 pragma，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「.pragma 字符串说明」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：pragma。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Pragma Strings: \"nounroll\"", "titleZh": "Pragma 字符串：\"nounroll\"", "numberedTitle": "12.1. Pragma Strings: \"nounroll\"", "level": "H2", "chapter": "Descriptions of .pragma Strings", "chapterZh": ".pragma 字符串说明", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "\"nounroll\"", "details": "\"nounroll\"\nDisable loop unrolling in the optimizing backend compiler.\nSyntax\nDescription\nThe \"nounroll\" pragma is a directive to disable loop unrolling in the optimizing backend compiler.\nThe \"nounroll\" pragma is allowed at module, entry-function, and statement levels, with the following meanings:\nNote that in order to have the desired effect at statement level, the \"nounroll\" directive must appear before any instruction statements in the loop header basic block for the desired loop.\nThe loop header block is defined as the block that dominates all blocks in the loop body and is the target of the loop backedge.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#pragma-strings-nounroll", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Pragma 字符串：\"nounroll\"」，归在「指南章节」。重点关注 指南章节，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「Pragma 字符串：\"nounroll\"」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Pragma Strings: \"used_bytes_mask\"", "titleZh": "Pragma Strings: \"used_bytes_mask\"", "numberedTitle": "12.2. Pragma Strings: \"used_bytes_mask\"", "level": "H2", "chapter": "Descriptions of .pragma Strings", "chapterZh": ".pragma 字符串说明", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "\"used_bytes_mask\"", "details": "\"used_bytes_mask\"\nMask for indicating used bytes in data of ld operation.\nSyntax\nDescription\nThe \"used_bytes_mask\" pragma is a directive that specifies used bytes in a load operation based on the mask provided.\n\"used_bytes_mask\" pragma needs to be specified prior to a load instruction for which information about bytes used from the load operation is needed.\nPragma is ignored if instruction following it is not a load instruction.\nFor a load instruction without this pragma, all bytes from the load operation are assumed to be used.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#pragma-strings-used-bytes-mask", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Pragma Strings: \"used_bytes_mask\"」，归在「指南章节」。重点关注 指南章节，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「Pragma Strings: \"used_bytes_mask\"」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Pragma Strings: \"enable_smem_spilling\"", "titleZh": "Pragma Strings: \"enable_smem_spilling\"", "numberedTitle": "12.3. Pragma Strings: \"enable_smem_spilling\"", "level": "H2", "chapter": "Descriptions of .pragma Strings", "chapterZh": ".pragma 字符串说明", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "\"enable_smem_spilling\"", "details": "\"enable_smem_spilling\"\nEnable shared memory spilling for CUDA kernels.\nSyntax\nDescription\nThe \"enable_smem_spilling\" pragma is a directive that enables register spilling into shared memory.\nDuring the spilling process, registers are first spilled into shared memory, and once the allocated shared memory is full, any additional spills are redirected to local memory.\nThe \"enable_smem_spilling\" pragma is only allowed within the function scope.\nWhen applied, it enables shared memory spilling for the specified function.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#pragma-strings-enable-smem-spilling", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Pragma Strings: \"enable_smem_spilling\"」，归在「指南章节」。重点关注 指南章节，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「Pragma Strings: \"enable_smem_spilling\"」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Pragma Strings: \"frequency\"", "titleZh": "Pragma 字符串：\"frequency\"", "numberedTitle": "12.4. Pragma Strings: \"frequency\"", "level": "H2", "chapter": "Descriptions of .pragma Strings", "chapterZh": ".pragma 字符串说明", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "\"frequency\"", "details": "\"frequency\"\nSpecify frequency for basic block execution.\nSyntax\nDescription\nThe \"frequency\" pragma is a directive that specifies the number of times a basic block is executed by an executing thread.\nThe optimizing compiler backend treats this pragma as a hint which will be used for optimizations.\nOperand n is a 64-bit non-negative integer constant that specifies the execution frequency.\nNote that in order to have the desired effect of this pragma, it should be specified at the start of the basic block.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#pragma-strings-frequency", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Pragma 字符串：\"frequency\"」，归在「指南章节」。重点关注 指南章节，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「Pragma 字符串：\"frequency\"」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Pragma Strings: \"mma_throughput\"", "titleZh": "Pragma Strings: \"mma_throughput\"", "numberedTitle": "12.5. Pragma Strings: \"mma_throughput\"", "level": "H2", "chapter": "Descriptions of .pragma Strings", "chapterZh": ".pragma 字符串说明", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "\"mma_throughput\"", "details": "\"mma_throughput\"\nEnable compiler loop optimizations for mma operations.\nSyntax\nDescription\nThe \"mma_throughput\" pragma is a directive to enable loop optimizations in compiler for mma operations.\nThis pragma is only allowed at entry-function scope.\nCompiler optimizations are enabled for the entry function specifying the pragma.\nPTX ISA Notes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#pragma-strings-mma-throughput", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Pragma Strings: \"mma_throughput\"」，归在「指南章节」。重点关注 指南章节，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「Pragma Strings: \"mma_throughput\"」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Release Notes", "titleZh": "版本记录", "numberedTitle": "13. Release Notes", "level": "H1", "chapter": "Descriptions of .pragma Strings", "chapterZh": ".pragma 字符串说明", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "This section describes the history of change in the PTX ISA and implementation. The first section describes ISA and implementation changes in the current release of PTX ISA version 9.3, and the remaining sections provide a record of changes in previous releases of PTX...", "details": "This section describes the history of change in the PTX ISA and implementation.\nThe first section describes ISA and implementation changes in the current release of PTX ISA version 9.3, and the remaining sections provide a record of changes in previous releases of PTX ISA versions back to PTX ISA version 2.0.\nTable 62 shows the PTX release history.\nPTX ISA Version | CUDA Release | Supported Targets\nPTX ISA 1.0 | CUDA 1.0 | sm_{10,11}\nPTX ISA 1.1 | CUDA 1.1 | sm_{10,11}\nPTX ISA 1.2 | CUDA 2.0 | sm_{10,11,12,13}\nPTX ISA 1.3 | CUDA 2.1 | sm_{10,11,12,13}", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#release-notes", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「版本记录」，归在「指南章节」。重点关注 指南章节，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「版本记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 9.3", "titleZh": "PTX ISA 9.3 变更记录", "numberedTitle": "13.1. Changes in PTX ISA Version 9.3", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 9.3 introduces the following new features:\nAdds support for mma_throughput pragma.\nAdds support for clmad instruction.\nAdds support for .phase_type::* qualifier for mbarrier.test_wait and mbarrier.try_wait instructions.\nAdds support for reportPredicate and reportValue operands for mbarrier.test_wait and mbarrier.try_wait instructions.\nAdds support for .layout qualifier for mbarrier instructions and support for mbarrier.check_layout instruction.\nAdds support for multimem.st.async and multimem.red.async instructions.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-9-3", "tokens": ["phase_type", "mbarrier.test", "mbarrier.try", "layout", "mbarrier.check", "multimem.st.async", "multimem.red.async"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 9.3 变更记录」，归在「指南章节」。重点关注 关键词 phase_type、mbarrier.test、mbarrier.try、layout、mbarrier.check，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 9.3 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：phase_type、mbarrier.test、mbarrier.try、layout、mbarrier.check、multimem.st.async、multimem.red.async。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 9.2", "titleZh": "PTX ISA 9.2 变更记录", "numberedTitle": "13.2. Changes in PTX ISA Version 9.2", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 9.2 introduces the following new features:\nAdds support for .u8x4 and .s8x4 instruction types for add , sub , min , max , neg instructions.\nAdds support for add.sat.{u16x2/s16x2/u32} instruction.\nAdds support for .b128 type for st.async instruction.\nAdds support for .ignore_oob qualifier for cp.async.bulk instruction.\nAdds support for .bf16x2 destination type for cvt instruction with .e4m3x2 , .e5m2x2 , .e3m2x2 , .e2m3x2 , .e2m1x2 source types.\nSemantic Changes and Clarifications", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-9-2", "tokens": ["u8x4", "s8x4", "add.sat", "b128", "st.async", "ignore_oob", "cp.async.bulk", "bf16x2", "e4m3x2", "e5m2x2", "e3m2x2", "e2m3x2"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 9.2 变更记录」，归在「指南章节」。重点关注 关键词 u8x4、s8x4、add.sat、b128、st.async，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 9.2 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：u8x4、s8x4、add.sat、b128、st.async、ignore_oob、cp.async.bulk、bf16x2。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 9.1", "titleZh": "PTX ISA 9.1 变更记录", "numberedTitle": "13.3. Changes in PTX ISA Version 9.1", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 9.1 introduces the following new features:\nAdds support for .volatile qualifier with .local state space for ld and st instructions.\nAdds support for .f16x2 and .bf16x2 source types for cvt instruction with destination types .e2m1x2 , .e2m3x2 , .e3m2x2 , .e4m3x2 , .e5m2x2 .\nAdds support for .scale_vec::4X with .ue8m0 as .stype with .kind::mxf4nvf4 for mma / mma.sp instructions.\nAdds support for .s2f6x2 instruction type for cvt instruction.\nAdds support for multimem.cp.async.bulk and multimem.cp.reduce.async.bulk instructions.\nSemantic Changes and Clarifications", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-9-1", "tokens": ["volatile", "local", "f16x2", "bf16x2", "e2m1x2", "e2m3x2", "e3m2x2", "e4m3x2", "e5m2x2", "scale_vec", "ue8m0", "stype"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 9.1 变更记录」，归在「指南章节」。重点关注 关键词 volatile、local、f16x2、bf16x2、e2m1x2，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 9.1 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：volatile、local、f16x2、bf16x2、e2m1x2、e2m3x2、e3m2x2、e4m3x2。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 9.0", "titleZh": "PTX ISA 9.0 变更记录", "numberedTitle": "13.4. Changes in PTX ISA Version 9.0", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 9.0 introduces the following new features:\nAdds support for sm_88 target architecture.\nAdds support for sm_110 target architecture.\nAdds support for target sm_110f that supports family-specific features.\nAdds support for target sm_110a that supports architecture-specific features.\nAdds support for pragma enable_smem_spilling that is used to enable shared memory spilling for a function.\nAdds support for pragma frequency that is used to specify the execution frequency of a basic block.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-9-0", "tokens": ["sm_88", "sm_110", "sm_110f", "sm_110a"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 9.0 变更记录」，归在「指南章节」。重点关注 关键词 sm_88、sm_110、sm_110f、sm_110a，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 9.0 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：sm_88、sm_110、sm_110f、sm_110a。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 8.8", "titleZh": "PTX ISA 8.8 变更记录", "numberedTitle": "13.5. Changes in PTX ISA Version 8.8", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 8.8 introduces the following new features:\nAdds support for sm_103 target architecture.\nAdds support for target sm_103a that supports architecture-specific features.\nAdds support for sm_121 target architecture.\nAdds support for target sm_121a that supports architecture-specific features.\nIntroduces family-specific target architectures that are represented with “f” suffix. PTX for family-specific targets is compatible with all subsequent targets in same family. Adds support for sm_100f , sm_101f , sm_103f , sm_120f , sm_121f .\nExtends min and max instructions to support three input arguments.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-8-8", "tokens": ["sm_103", "sm_103a", "sm_121", "sm_121a", "sm_100f", "sm_101f", "sm_103f", "sm_120f", "sm_121f"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 8.8 变更记录」，归在「指南章节」。重点关注 关键词 sm_103、sm_103a、sm_121、sm_121a、sm_100f，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 8.8 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：sm_103、sm_103a、sm_121、sm_121a、sm_100f、sm_101f、sm_103f、sm_120f。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 8.7", "titleZh": "PTX ISA 8.7 变更记录", "numberedTitle": "13.6. Changes in PTX ISA Version 8.7", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 8.7 introduces the following new features:\nAdds support for sm_120 target architecture.\nAdds support for target sm_120a that supports architecture-specific features.\nExtends tcgen05.mma instruction to add support for .kind::mxf4nvf4 and .scale_vec::4X qualifiers.\nExtends mma instructions to support .f16 type accumulator and shape .m16n8k16 with FP8 types .e4m3 and .e5m2 .\nExtends cvt instruction to add support for .rs rounding mode and destination types .e2m1x4 , .e4m3x4 , .e5m2x4 , .e3m2x4 , .e2m3x4 .\nExtends support for st.async and red.async instructions to add support for .mmio , .release , .global and .scope qualifiers.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-8-7", "tokens": ["sm_120", "sm_120a", "tcgen05.mma", "kind", "scale_vec", "f16", "m16n8k16", "e4m3", "e5m2", "e2m1x4", "e4m3x4", "e5m2x4"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 8.7 变更记录」，归在「指南章节」。重点关注 关键词 sm_120、sm_120a、tcgen05.mma、kind、scale_vec，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 8.7 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：sm_120、sm_120a、tcgen05.mma、kind、scale_vec、f16、m16n8k16、e4m3。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 8.6", "titleZh": "PTX ISA 8.6 变更记录", "numberedTitle": "13.7. Changes in PTX ISA Version 8.6", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 8.6 introduces the following new features:\nAdds support for sm_100 target architecture.\nAdds support for target sm_100a that supports architecture-specific features.\nAdds support for sm_101 target architecture.\nAdds support for target sm_101a that supports architecture-specific features.\nExtends cp.async.bulk and cp.async.bulk.tensor instructions to add .shared::cta as destination state space.\nExtends fence instruction to add support for .acquire and .release qualifiers.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-8-6", "tokens": ["sm_100", "sm_100a", "sm_101", "sm_101a", "cp.async.bulk", "cp.async.bulk.tensor", "shared", "acquire", "release"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 8.6 变更记录」，归在「指南章节」。重点关注 关键词 sm_100、sm_100a、sm_101、sm_101a、cp.async.bulk，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 8.6 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：sm_100、sm_100a、sm_101、sm_101a、cp.async.bulk、cp.async.bulk.tensor、shared、acquire。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 8.5", "titleZh": "PTX ISA 8.5 变更记录", "numberedTitle": "13.8. Changes in PTX ISA Version 8.5", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 8.5 introduces the following new features:\nAdds support for mma.sp::ordered_metadata instruction.\nSemantic Changes and Clarifications\nValues 0b0000 , 0b0101 , 0b1010 , 0b1111 for sparsity metadata (operand e ) of instruction mma.sp are invalid and their usage results in undefined behavior.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-8-5", "tokens": ["mma.sp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 8.5 变更记录」，归在「指南章节」。重点关注 关键词 mma.sp，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 8.5 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：mma.sp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 8.4", "titleZh": "PTX ISA 8.4 变更记录", "numberedTitle": "13.9. Changes in PTX ISA Version 8.4", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 8.4 introduces the following new features:\nExtends ld , st and atom instructions with .b128 type to support .sys scope.\nExtends integer wgmma.mma_async instruction to support .u8.s8 and .s8.u8 as .atype and .btype respectively.\nExtends mma , mma.sp instructions to support FP8 types .e4m3 and .e5m2 .\nSemantic Changes and Clarifications\nNone.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-8-4", "tokens": ["b128", "sys", "wgmma.mma", "u8.s8", "s8.u8", "atype", "btype", "mma.sp", "e4m3", "e5m2"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 8.4 变更记录」，归在「指南章节」。重点关注 关键词 b128、sys、wgmma.mma、u8.s8、s8.u8，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 8.4 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：b128、sys、wgmma.mma、u8.s8、s8.u8、atype、btype、mma.sp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 8.3", "titleZh": "PTX ISA 8.3 变更记录", "numberedTitle": "13.10. Changes in PTX ISA Version 8.3", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 8.3 introduces the following new features:\nAdds support for pragma used_bytes_mask that is used to specify mask for used bytes for a load operation.\nExtends isspacep , cvta.to , ld and st instructions to accept ::entry and ::func sub-qualifiers with .param state space qualifier.\nAdds support for .b128 type on instructions ld , ld.global.nc , ldu , st , mov and atom .\nAdd support for instructions tensormap.replace , tensormap.cp_fenceproxy and support for qualifier .to_proxykind::from_proxykind on instruction fence.proxy to support modifying tensor-map .\nSemantic Changes and Clarifications\nNone.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-8-3", "tokens": ["cvta.to", "param", "b128", "ld.global.nc", "tensormap.replace", "tensormap.cp", "to_proxykind", "fence.proxy"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 8.3 变更记录」，归在「指南章节」。重点关注 关键词 cvta.to、param、b128、ld.global.nc、tensormap.replace，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 8.3 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：cvta.to、param、b128、ld.global.nc、tensormap.replace、tensormap.cp、to_proxykind、fence.proxy。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 8.2", "titleZh": "PTX ISA 8.2 变更记录", "numberedTitle": "13.11. Changes in PTX ISA Version 8.2", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 8.2 introduces the following new features:\nAdds support for .mmio qualifier on ld and st instructions.\nExtends lop3 instruction to allow predicate destination.\nExtends multimem.ld_reduce instruction to support .acc::f32 qualifer to allow .f32 precision of the intermediate accumulation.\nExtends the asynchronous warpgroup-level matrix multiply-and-accumulate operation wgmma.mma_async to support .sp modifier that allows matrix multiply-accumulate operation when input matrix A is sparse.\nSemantic Changes and Clarifications\nThe .multicast::cluster qualifier on cp.async.bulk and cp.async.bulk.tensor instructions is optimized for target architecture sm_90a and may have substantially reduced performance on other targets and hence .multicast::cluster is advised to be used with sm_90a .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-8-2", "tokens": ["mmio", "multimem.ld", "acc", "f32", "warpgroup", "wgmma.mma", "multicast", "cp.async.bulk", "cp.async.bulk.tensor", "sm_90a"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 8.2 变更记录」，归在「指南章节」。重点关注 关键词 mmio、multimem.ld、acc、f32、warpgroup，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 8.2 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：mmio、multimem.ld、acc、f32、warpgroup、wgmma.mma、multicast、cp.async.bulk。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 8.1", "titleZh": "PTX ISA 8.1 变更记录", "numberedTitle": "13.12. Changes in PTX ISA Version 8.1", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 8.1 introduces the following new features:\nAdds support for st.async and red.async instructions for asynchronous store and asynchronous reduction operations respectively on shared memory.\nAdds support for .oob modifier on half-precision fma instruction.\nAdds support for .satfinite saturation modifer on cvt instruction for .f16 , .bf16 and .tf32 formats.\nExtends support for cvt with .e4m3 / .e5m2 to sm_89 .\nExtends atom and red instructions to support vector types.\nAdds support for special register %aggr_smem_size .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-8-1", "tokens": ["st.async", "red.async", "oob", "satfinite", "f16", "bf16", "tf32", "e4m3", "e5m2", "sm_89", "%aggr_smem_size"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 8.1 变更记录」，归在「指南章节」。重点关注 关键词 st.async、red.async、oob、satfinite、f16，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 8.1 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：st.async、red.async、oob、satfinite、f16、bf16、tf32、e4m3。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 8.0", "titleZh": "PTX ISA 8.0 变更记录", "numberedTitle": "13.13. Changes in PTX ISA Version 8.0", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 8.0 introduces the following new features:\nAdds support for target sm_90a that supports architecture-specific features.\nAdds support for asynchronous warpgroup-level matrix multiply-and-accumulate operation wgmma .\nExtends the asynchronous copy operations with bulk operations that operate on large data, including tensor data.\nIntroduces packed integer types .u16x2 and .s16x2 .\nExtends integer arithmetic instruction add to allow packed integer types .u16x2 and .s16x2 .\nExtends integer arithmetic instructions min and max to allow packed integer types .u16x2 and .s16x2 , as well as saturation modifier .relu on .s16x2 and .s32 types.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-8-0", "tokens": ["sm_90a", "warpgroup", "u16x2", "s16x2", "relu", "s32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 8.0 变更记录」，归在「指南章节」。重点关注 关键词 sm_90a、warpgroup、u16x2、s16x2、relu，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 8.0 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：sm_90a、warpgroup、u16x2、s16x2、relu、s32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 7.8", "titleZh": "PTX ISA 7.8 变更记录", "numberedTitle": "13.14. Changes in PTX ISA Version 7.8", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 7.8 introduces the following new features:\nAdds support for sm_89 target architecture.\nAdds support for sm_90 target architecture.\nExtends bar and barrier instructions to accept optional scope qualifier .cta .\nExtends .shared state space qualifier with optional sub-qualifier ::cta .\nAdds support for movmatrix instruction which transposes a matrix in registers across a warp.\nAdds support for stmatrix instruction which stores one or more matrices to shared memory.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-7-8", "tokens": ["sm_89", "sm_90", "cta", "shared", "warp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 7.8 变更记录」，归在「指南章节」。重点关注 关键词 sm_89、sm_90、cta、shared、warp，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 7.8 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：sm_89、sm_90、cta、shared、warp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 7.7", "titleZh": "PTX ISA 7.7 变更记录", "numberedTitle": "13.15. Changes in PTX ISA Version 7.7", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 7.7 introduces the following new features:\nExtends isspacep and cvta instructions to include the .param state space for kernel function parameters.\nSemantic Changes and Clarifications\nNone.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-7-7", "tokens": ["param"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 7.7 变更记录」，归在「指南章节」。重点关注 关键词 param，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 7.7 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：param。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 7.6", "titleZh": "PTX ISA 7.6 变更记录", "numberedTitle": "13.16. Changes in PTX ISA Version 7.6", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 7.6 introduces the following new features:\nSupport for szext instruction which performs sign-extension or zero-extension on a specified value.\nSupport for bmsk instruction which creates a bitmask of the specified width starting at the specified bit position.\nSupport for special registers %reserved_smem_offset_begin , %reserved_smem_offset_end , %reserved_smem_offset_cap , %reserved_smem_offset<2> .\nSemantic Changes and Clarifications\nNone.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-7-6", "tokens": ["%reserved_smem_offset_begin", "%reserved_smem_offset_end", "%reserved_smem_offset_cap", "%reserved_smem_offset"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 7.6 变更记录」，归在「指南章节」。重点关注 关键词 %reserved_smem_offset_begin、%reserved_smem_offset_end、%reserved_smem_offset_cap、%reserved_smem_offset，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 7.6 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：%reserved_smem_offset_begin、%reserved_smem_offset_end、%reserved_smem_offset_cap、%reserved_smem_offset。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 7.5", "titleZh": "PTX ISA 7.5 变更记录", "numberedTitle": "13.17. Changes in PTX ISA Version 7.5", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 7.5 introduces the following new features:\nDebug information enhancements to support label difference and negative values in the .section debugging directive.\nSupport for ignore-src operand on cp.async instruction.\nExtensions to the memory consistency model to introduce the following new concepts: A memory proxy as an abstract label for different methods of memory access. Virtual aliases as distinct memory addresses accessing the same physical memory location.\nSupport for new fence.proxy and membar.proxy instructions to allow synchronization of memory accesses performed via virtual aliases.\nSemantic Changes and Clarifications\nNone.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-7-5", "tokens": ["section", "cp.async", "fence.proxy", "membar.proxy"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 7.5 变更记录」，归在「指南章节」。重点关注 关键词 section、cp.async、fence.proxy、membar.proxy，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 7.5 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：section、cp.async、fence.proxy、membar.proxy。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 7.4", "titleZh": "PTX ISA 7.4 变更记录", "numberedTitle": "13.18. Changes in PTX ISA Version 7.4", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 7.4 introduces the following new features:\nSupport for sm_87 target architecture.\nSupport for .level::eviction_priority qualifier which allows specifying cache eviction priority hints on ld , ld.global.nc , st , and prefetch instructions.\nSupport for .level::prefetch_size qualifier which allows specifying data prefetch hints on ld and cp.async instructions.\nSupport for createpolicy instruction which allows construction of different types of cache eviction policies.\nSupport for .level::cache_hint qualifier which allows the use of cache eviction policies with ld , ld.global.nc , st , atom , red and cp.async instructions.\nSupport for applypriority and discard operations on cached data.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-7-4", "tokens": ["sm_87", "level", "ld.global.nc", "cp.async"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 7.4 变更记录」，归在「指南章节」。重点关注 关键词 sm_87、level、ld.global.nc、cp.async，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 7.4 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：sm_87、level、ld.global.nc、cp.async。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 7.3", "titleZh": "PTX ISA 7.3 变更记录", "numberedTitle": "13.19. Changes in PTX ISA Version 7.3", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 7.3 introduces the following new features:\nExtends mask() operator used in initializers to also support integer constant expression.\nAdds support for stack manpulation instructions that allow manipulating stack using stacksave and stackrestore instructions and allocation of per-thread stack using alloca instruction.\nSemantic Changes and Clarifications\nThe unimplemented version of alloca from the older PTX ISA specification has been replaced with new stack manipulation instructions in PTX ISA version 7.3.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-7-3", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 7.3 变更记录」，归在「指南章节」。重点关注 指南章节，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 7.3 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 7.2", "titleZh": "PTX ISA 7.2 变更记录", "numberedTitle": "13.20. Changes in PTX ISA Version 7.2", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 7.2 introduces the following new features:\nEnhances .loc directive to represent inline function information.\nAdds support to define labels inside the debug sections.\nExtends min and max instructions to support .xorsign and .abs modifiers.\nSemantic Changes and Clarifications\nNone.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-7-2", "tokens": ["loc", "xorsign", "abs"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 7.2 变更记录」，归在「指南章节」。重点关注 关键词 loc、xorsign、abs，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 7.2 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：loc、xorsign、abs。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 7.1", "titleZh": "PTX ISA 7.1 变更记录", "numberedTitle": "13.21. Changes in PTX ISA Version 7.1", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 7.1 introduces the following new features:\nSupport for sm_86 target architecture.\nAdds a new operator, mask() , to extract a specific byte from variable’s address used in initializers.\nExtends tex and tld4 instructions to return an optional predicate that indicates if data at specified coordinates is resident in memory.\nExtends single-bit wmma and mma instructions to support .and operation.\nExtends mma instruction to support .sp modifier that allows matrix multiply-accumulate operation when input matrix A is sparse.\nExtends mbarrier.test_wait instruction to test the completion of specific phase parity.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-7-1", "tokens": ["sm_86", "and", "mbarrier.test"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 7.1 变更记录」，归在「指南章节」。重点关注 关键词 sm_86、and、mbarrier.test，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 7.1 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：sm_86、and、mbarrier.test。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 7.0", "titleZh": "PTX ISA 7.0 变更记录", "numberedTitle": "13.22. Changes in PTX ISA Version 7.0", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 7.0 introduces the following new features:\nSupport for sm_80 target architecture.\nAdds support for asynchronous copy instructions that allow copying of data asynchronously from one state space to another.\nAdds support for mbarrier instructions that allow creation of mbarrier objects in memory and use of these objects to synchronize threads and asynchronous copy operations initiated by threads.\nAdds support for redux.sync instruction which allows reduction operation across threads in a warp.\nAdds support for new alternate floating-point data formats .bf16 and .tf32 .\nExtends wmma instruction to support .f64 type with shape .m8n8k4 .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-7-0", "tokens": ["sm_80", "redux.sync", "warp", "bf16", "tf32", "f64", "m8n8k4"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 7.0 变更记录」，归在「指南章节」。重点关注 关键词 sm_80、redux.sync、warp、bf16、tf32，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 7.0 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：sm_80、redux.sync、warp、bf16、tf32、f64、m8n8k4。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 6.5", "titleZh": "PTX ISA 6.5 变更记录", "numberedTitle": "13.23. Changes in PTX ISA Version 6.5", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 6.5 introduces the following new features:\nAdds support for integer destination types for half precision comparison instruction set .\nExtends abs instruction to support .f16 and .f16x2 types.\nAdds support for cvt.pack instruction which allows converting two integer values and packing the results together.\nAdds new shapes .m16n8k8 , .m8n8k16 and .m8n8k32 on the mma instruction.\nAdds support for ldmatrix instruction which loads one or more matrices from shared memory for mma instruction.\nRemoved Features", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-6-5", "tokens": ["f16", "f16x2", "cvt.pack", "m16n8k8", "m8n8k16", "m8n8k32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 6.5 变更记录」，归在「指南章节」。重点关注 关键词 f16、f16x2、cvt.pack、m16n8k8、m8n8k16，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 6.5 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：f16、f16x2、cvt.pack、m16n8k8、m8n8k16、m8n8k32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 6.4", "titleZh": "PTX ISA 6.4 变更记录", "numberedTitle": "13.24. Changes in PTX ISA Version 6.4", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 6.4 introduces the following new features:\nAdds support for .noreturn directive which can be used to indicate a function does not return to it’s caller function.\nAdds support for mma instruction which allows performing matrix multiply-and-accumulate operation.\nDeprecated Features\nPTX ISA version 6.4 deprecates the following features:\nSupport for .satfinite qualifier on floating point wmma.mma instruction.\nRemoved Features", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-6-4", "tokens": ["noreturn", "satfinite", "wmma.mma"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 6.4 变更记录」，归在「指南章节」。重点关注 关键词 noreturn、satfinite、wmma.mma，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 6.4 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：noreturn、satfinite、wmma.mma。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 6.3", "titleZh": "PTX ISA 6.3 变更记录", "numberedTitle": "13.25. Changes in PTX ISA Version 6.3", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 6.3 introduces the following new features:\nSupport for sm_75 target architecture.\nAdds support for a new instruction nanosleep that suspends a thread for a specified duration.\nAdds support for .alias directive which allows definining alias to function symbol.\nExtends atom instruction to perform .f16 addition operation and .cas.b16 operation.\nExtends red instruction to perform .f16 addition operation.\nThe wmma instructions are extended to support multiplicand matrices of type .s8 , .u8 , .s4 , .u4 , .b1 and accumulator matrices of type .s32 .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-6-3", "tokens": ["sm_75", "alias", "f16", "cas.b16", "s32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 6.3 变更记录」，归在「指南章节」。重点关注 关键词 sm_75、alias、f16、cas.b16、s32，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 6.3 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：sm_75、alias、f16、cas.b16、s32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 6.2", "titleZh": "PTX ISA 6.2 变更记录", "numberedTitle": "13.26. Changes in PTX ISA Version 6.2", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 6.2 introduces the following new features:\nA new instruction activemask for querying active threads in a warp.\nExtends atomic and reduction instructions to perform .f16x2 addition operation with mandatory .noftz qualifier.\nDeprecated Features\nPTX ISA version 6.2 deprecates the following features:\nThe use of shfl and vote instructions without the .sync is deprecated retrospectively from PTX ISA version 6.0, which introduced the sm_70 architecture that implements Independent Thread Scheduling .\nSemantic Changes and Clarifications", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-6-2", "tokens": ["warp", "f16x2", "noftz", "sync", "sm_70"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 6.2 变更记录」，归在「指南章节」。重点关注 关键词 warp、f16x2、noftz、sync、sm_70，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 6.2 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：warp、f16x2、noftz、sync、sm_70。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 6.1", "titleZh": "PTX ISA 6.1 变更记录", "numberedTitle": "13.27. Changes in PTX ISA Version 6.1", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 6.1 introduces the following new features:\nSupport for sm_72 target architecture.\nSupport for new matrix shapes 32x8x16 and 8x32x16 in wmma instruction.\nSemantic Changes and Clarifications\nNone.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-6-1", "tokens": ["sm_72"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 6.1 变更记录」，归在「指南章节」。重点关注 关键词 sm_72，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 6.1 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：sm_72。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 6.0", "titleZh": "PTX ISA 6.0 变更记录", "numberedTitle": "13.28. Changes in PTX ISA Version 6.0", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 6.0 introduces the following new features:\nSupport for sm_70 target architecture.\nSpecifies the memory consistency model for programs running on sm_70 and later architectures.\nVarious extensions to memory instructions to specify memory synchronization semantics and scopes at which such synchronization can be observed.\nNew instruction wmma for matrix operations which allows loading matrices from memory, performing multiply-and-accumulate on them and storing result in memory.\nSupport for new barrier instruction.\nExtends neg instruction to support .f16 and .f16x2 types.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-6-0", "tokens": ["sm_70", "f16", "f16x2"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 6.0 变更记录」，归在「指南章节」。重点关注 关键词 sm_70、f16、f16x2，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 6.0 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：sm_70、f16、f16x2。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 5.0", "titleZh": "PTX ISA 5.0 变更记录", "numberedTitle": "13.29. Changes in PTX ISA Version 5.0", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 5.0 introduces the following new features:\nSupport for sm_60 , sm_61 , sm_62 target architecture.\nExtends atomic and reduction instructions to perform double-precision add operation.\nExtends atomic and reduction instructions to specify scope modifier.\nA new .common directive to permit linking multiple object files containing declarations of the same symbol with different size.\nA new dp4a instruction which allows 4-way dot product with accumulate operation.\nA new dp2a instruction which allows 2-way dot product with accumulate operation.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-5-0", "tokens": ["sm_60", "sm_61", "sm_62", "common"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 5.0 变更记录」，归在「指南章节」。重点关注 关键词 sm_60、sm_61、sm_62、common，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 5.0 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：sm_60、sm_61、sm_62、common。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 4.3", "titleZh": "PTX ISA 4.3 变更记录", "numberedTitle": "13.30. Changes in PTX ISA Version 4.3", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 4.3 introduces the following new features:\nA new lop3 instruction which allows arbitrary logical operation on 3 inputs.\nAdds support for 64-bit computations in extended precision arithmetic instructions.\nExtends tex.grad instruction to support cube and acube geometries.\nExtends tld4 instruction to support a2d , cube and acube geometries.\nExtends tex and tld4 instructions to support optional operands for offset vector and depth compare.\nExtends txq instruction to support querying texture fields from specific LOD.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-in-ptx-isa-version-4-3", "tokens": ["tex.grad"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 4.3 变更记录」，归在「指南章节」。重点关注 关键词 tex.grad，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 4.3 变更记录」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：tex.grad。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes in PTX ISA Version 4.2", "titleZh": "PTX ISA 4.2 变更记录", "numberedTitle": "13.31. Changes in PTX ISA Version 4.2", "level": "H2", "chapter": "Release Notes", "chapterZh": "版本记录", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "New Features", "details": "New Features\nPTX ISA version 4.2 introduces the following new features:\nSupport for sm_53 target architecture.\nSupport for arithmetic, comparsion and texture instructions for .f16 and .f16x2 types.\nSupport for memory_layout field for surfaces and suq instruction support for querying this field.\nSemantic Changes and Clarifications\nSemantics for parameter passing under ABI were updated to indicate ld.param and st.param instructions used for argument passing cannot be predicated.\nSemantics of {atom/red}.add.f32 were updated to indicate subnormal inputs and results are flushed to sign-preserving zero for atomic operations on global memory; whereas atomic operati
