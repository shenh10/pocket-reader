services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-infra-board-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_infra_board
      POSTGRES_USER: aiinfra
      POSTGRES_PASSWORD: aiinfra
    ports:
      - "54329:5432"
    volumes:
      - ai_infra_board_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiinfra -d ai_infra_board"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_infra_board_pg:
