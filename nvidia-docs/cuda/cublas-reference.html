<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CUDA 文档速查</title>
  <style>
    :root {
      --paper: #f6f7f2;
      --surface: #ffffff;
      --ink: #151713;
      --muted: #62695f;
      --line: #d8ddd2;
      --line-strong: #a9b4a4;
      --green: #67b340;
      --cyan: #2d8b94;
      --amber: #c8841e;
      --rust: #b95138;
      --charcoal: #20241d;
      --shadow: 0 18px 45px rgba(18, 23, 16, .10);
      --mono: "JetBrains Mono", "Iosevka", "SFMono-Regular", Consolas, monospace;
      --sans: "Avenir Next", "DIN Alternate", "Gill Sans", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: 0;
      background:
        linear-gradient(90deg, rgba(32, 36, 29, .055) 1px, transparent 1px) 0 0 / 24px 24px,
        linear-gradient(0deg, rgba(32, 36, 29, .04) 1px, transparent 1px) 0 0 / 24px 24px,
        var(--paper);
    }

    a { color: inherit; }
    code {
      font-family: var(--mono);
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .top {
      background: var(--charcoal);
      color: #f4f7ef;
      border-bottom: 6px solid var(--accent, var(--green));
      overflow: hidden;
      position: relative;
    }

    .top::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 82% 28%, rgba(103,179,64,.16), transparent 24%),
        repeating-linear-gradient(90deg, rgba(255,255,255,.045) 0 1px, transparent 1px 70px);
      pointer-events: none;
    }

    .hero {
      width: min(1480px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 320px;
      padding: 42px 0 34px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, .62fr);
      gap: 34px;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 20px;
      color: #cfd8c8;
      font-family: var(--mono);
      font-size: 12px;
      text-transform: uppercase;
    }

    .signal {
      width: 9px;
      height: 9px;
      background: var(--accent, var(--green));
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent, var(--green)) 25%, transparent);
      display: inline-block;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 6vw, 84px);
      line-height: .92;
      font-weight: 900;
    }

    .hero p {
      max-width: 860px;
      color: #dfe6da;
      font-size: 18px;
      line-height: 1.62;
      margin: 20px 0 0;
    }

    .machine {
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.06);
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.22);
    }

    .machine-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .machine-cell {
      min-height: 86px;
      border: 1px solid rgba(255,255,255,.22);
      display: grid;
      place-items: center;
      color: #eaf1e6;
      font: 900 13px var(--mono);
      text-align: center;
      padding: 10px;
    }

    .machine-code {
      margin-top: 12px;
      color: #cfd8c8;
      font: 800 12px var(--mono);
      overflow-wrap: anywhere;
    }

    .main {
      width: min(1480px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: -48px;
      position: relative;
      z-index: 2;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      min-height: 106px;
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stat strong {
      color: var(--accent, var(--green));
      font: 900 clamp(28px, 4vw, 40px) var(--mono);
      line-height: 1;
    }

    .stat span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .controls {
      margin-top: 22px;
      background: rgba(255,255,255,.9);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 5;
      backdrop-filter: blur(14px);
    }

    .control-grid {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 14px;
      align-items: center;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    input[type="search"] {
      width: 100%;
      height: 48px;
      border: 1px solid var(--line-strong);
      background: #fbfcfa;
      color: var(--ink);
      font: 800 16px var(--mono);
      padding: 0 14px;
      outline: none;
    }

    input[type="search"]:focus {
      border-color: var(--accent, var(--green));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent, var(--green)) 20%, transparent);
    }

    .checks {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .check {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: #fbfcfa;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .check input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent, var(--green));
    }

    .topics {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .topic {
      min-height: 36px;
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--ink);
      font-weight: 900;
      font-size: 13px;
      padding: 0 12px;
      cursor: pointer;
    }

    .topic[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .topic-count {
      margin-left: 6px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 800;
    }

    .topic[aria-pressed="true"] .topic-count {
      color: rgba(255, 255, 255, .72);
    }

    .guide {
      margin-top: 22px;
      border: 1px solid var(--line);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .guide-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--accent, var(--green)) 18%, transparent), transparent 54%),
        #fff;
    }

    .guide-head h2 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.05;
    }

    .guide-head p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.55;
      max-width: 900px;
      font-size: 14px;
    }

    .guide-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
    }

    .guide-card {
      background: #fff;
      padding: 16px;
      min-height: 198px;
      border-top: 5px solid var(--accent, var(--green));
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 10px;
    }

    .guide-card h3 {
      margin: 0;
      font-size: 18px;
      line-height: 1.15;
    }

    .guide-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 13px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      align-content: start;
      gap: 6px;
    }

    .chip {
      border: 1px solid var(--line-strong);
      background: #fbfcfa;
      color: var(--ink);
      min-height: 28px;
      padding: 0 8px;
      font: 800 12px var(--mono);
      cursor: pointer;
      max-width: 100%;
      overflow-wrap: anywhere;
      text-align: left;
    }

    .chip:hover,
    .chip:focus {
      outline: none;
      border-color: var(--accent, var(--green));
      color: var(--accent, var(--green));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent, var(--green)) 18%, transparent);
    }

    .layout {
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr);
      gap: 22px;
      align-items: start;
      margin-top: 22px;
    }

    .side {
      background: #fff;
      border: 1px solid var(--line);
      padding: 18px;
      position: sticky;
      top: 142px;
    }

    .side h2 {
      margin: 0 0 12px;
      font-size: 22px;
      line-height: 1.05;
    }

    .side p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
    }

    .kind-list {
      display: grid;
      gap: 8px;
      margin-top: 16px;
    }

    .kind-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }

    .kind-row b {
      color: var(--ink);
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 10px;
    }

    .result-head h2 {
      margin: 0;
      font-size: 24px;
    }

    .result-count {
      color: var(--muted);
      font: 800 13px var(--mono);
      text-align: right;
    }

    .cards {
      display: grid;
      gap: 10px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(18, 23, 16, .05);
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
      max-width: 100%;
      min-width: 0;
    }

    .card:hover {
      border-color: var(--line-strong);
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }

    .card-main {
      display: grid;
      grid-template-columns: minmax(280px, .9fr) minmax(0, 1.1fr);
      gap: 18px;
      padding: 16px;
      min-width: 0;
    }

    .card-main > *,
    details,
    .details,
    .details > div {
      min-width: 0;
    }

    .card-title {
      display: inline-block;
      color: var(--ink);
      font: 900 clamp(16px, 2vw, 21px) var(--mono);
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .card-title:hover { color: var(--accent, var(--green)); }

    .original-title {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: #fbfcfa;
      font-size: 12px;
      font-weight: 800;
      padding: 0 8px;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .tag.kind {
      border-color: color-mix(in srgb, var(--accent, var(--green)) 35%, var(--line));
      color: var(--accent, var(--green));
    }

    .summary {
      margin: 0;
      color: #30372d;
      line-height: 1.55;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .tokens {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 12px;
      min-width: 0;
    }

    .token {
      font: 800 12px var(--mono);
      color: var(--muted);
      background: #eef3ea;
      padding: 3px 6px;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .snippet {
      margin: 12px 0 0;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent, var(--green));
      background: #f7faf4;
      padding: 10px 12px;
      color: #273021;
      font: 800 12px/1.45 var(--mono);
      white-space: pre-wrap;
      overflow-x: auto;
      max-height: 220px;
    }

    details {
      border-top: 1px solid var(--line);
      padding: 0 16px 14px;
    }

    summary {
      cursor: pointer;
      font-size: 13px;
      color: var(--accent, var(--green));
      font-weight: 900;
      padding: 12px 0 4px;
    }

    .details {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .details b {
      display: block;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .details a {
      color: var(--accent, var(--green));
      font-weight: 900;
    }

    .empty {
      display: none;
      border: 1px dashed var(--line-strong);
      background: rgba(255,255,255,.74);
      padding: 42px 20px;
      text-align: center;
      color: var(--muted);
      font-weight: 800;
    }

    .footer {
      width: min(1480px, calc(100% - 32px));
      margin: 0 auto;
      padding: 0 0 44px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 1100px) {
      .guide-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero { grid-template-columns: 1fr; }
      .machine { max-width: 620px; }
      .layout { grid-template-columns: 1fr; }
      .side { position: static; }
      .card-main { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      .hero, .main, .footer { width: min(100% - 22px, 1480px); }
      .stats { grid-template-columns: 1fr; margin-top: 14px; }
      .controls { position: static; }
      .control-grid, .guide-head, .details { grid-template-columns: 1fr; }
      .checks { justify-content: flex-start; }
      .guide-grid { grid-template-columns: 1fr; }
      .result-head { align-items: start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="top">
    <section class="hero">
      <div>
        <div class="eyebrow"><span class="signal"></span><span id="brand"></span></div>
        <h1 id="page-title"></h1>
        <p id="subtitle"></p>
      </div>
      <aside class="machine" aria-label="visual index">
        <div class="machine-grid">
          <div class="machine-cell">API</div>
          <div class="machine-cell">TYPES</div>
          <div class="machine-cell">PERF</div>
          <div class="machine-cell">ISA</div>
        </div>
        <div class="machine-code" id="hero-code"></div>
      </aside>
    </section>
  </header>

  <main class="main">
    <section class="stats">
      <div class="stat"><strong id="stat-entries">0</strong><span>索引条目</span></div>
      <div class="stat"><strong id="stat-kinds">0</strong><span>主题分类</span></div>
      <div class="stat"><strong id="stat-special">0</strong><span id="stat-special-label">重点类条目</span></div>
      <div class="stat"><strong id="stat-topkind">0</strong><span>最大分类条目数</span></div>
    </section>

    <section class="controls">
      <div class="control-grid">
        <div>
          <label for="search">搜索标题 / 摘要 / token</label>
          <input id="search" type="search" autocomplete="off" placeholder="例如 GEMM、workspace、mma、%tid、CUBLAS_LOG">
        </div>
        <div class="checks">
          <label class="check"><input id="only-special" type="checkbox"> 只看重点类</label>
          <label class="check"><input id="has-detail" type="checkbox"> 有结构化摘录</label>
        </div>
      </div>
      <div id="topics" class="topics"></div>
    </section>

    <section class="guide">
      <div class="guide-head">
        <div>
          <h2>高信号入口</h2>
          <p>这些 chip 是从官方文档中最常用于调优、排障或理解语义的入口抽出来的；点击后会直接筛到相关章节或条目。</p>
        </div>
      </div>
      <div id="guide-grid" class="guide-grid"></div>
    </section>

    <section class="layout">
      <aside class="side">
        <h2>整理口径</h2>
        <p id="source-title"></p>
        <p>条目来自官方单页 HTML 的章节标题、函数/指令小节、环境变量表和短摘要。页面保留官方锚点，长正文请跳回源文档。</p>
        <div id="kind-list" class="kind-list"></div>
      </aside>

      <section>
        <div class="result-head">
          <h2>索引列表</h2>
          <div id="result-count" class="result-count"></div>
        </div>
        <div id="cards" class="cards"></div>
        <div id="empty" class="empty">没有匹配的条目。</div>
      </section>
    </section>
  </main>

  <footer class="footer">
    来源：<a id="source-url" href="#" target="_blank" rel="noreferrer"></a>。页面生成时间：<span id="generated-at"></span>。
  </footer>

  <script type="application/json" id="cuda-docs-data">{"entries": [{"title": "Introduction", "titleZh": "介绍", "numberedTitle": "1. Introduction", "level": "H1", "chapter": "cuBLAS", "chapterZh": "cuBLAS", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "The cuBLAS library is an implementation of BLAS (Basic Linear Algebra Subprograms) on top of the NVIDIA®CUDA™ runtime. It allows the user to access the computational resources of NVIDIA Graphics Processing Unit (GPU).", "details": "The cuBLAS library is an implementation of BLAS (Basic Linear Algebra Subprograms) on top of the NVIDIA®CUDA™ runtime.\nIt allows the user to access the computational resources of NVIDIA Graphics Processing Unit (GPU).\nThe cuBLAS Library exposes four sets of APIs:\nThe cuBLAS API , which is simply called cuBLAS API in this document (starting with CUDA 6.0),\nThe cuBLASXt API (starting with CUDA 6.0), and\nThe cuBLASLt API (starting with CUDA 10.1)\nThe cuBLASDx API (not shipped with the CUDA Toolkit)\nTo use the cuBLAS API, the application must allocate the required matrices and vectors in the GPU memory space, fill them with data, call the sequence of desired cuBLAS functions, and then upload the results from the GPU memory space back to the host.", "source": "https://docs.nvidia.com/cuda/cublas/#introduction", "tokens": ["cuBLAS", "cuBLASXt", "cuBLASLt", "cuBLASDx"], "summaryZh": "本条整理 cuBLAS 官方文档中的「介绍」，归在「指南章节」。重点关注 关键词 cuBLAS、cuBLASXt、cuBLASLt、cuBLASDx，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「介绍」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS、cuBLASXt、cuBLASLt、cuBLASDx。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Data Layout", "titleZh": "数据布局", "numberedTitle": "1.1. Data Layout", "level": "H2", "chapter": "Introduction", "chapterZh": "介绍", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "For maximum compatibility with existing Fortran environments, the cuBLAS library uses column-major storage, and 1-based indexing. Since C and C++ use row-major storage, applications written in these languages can not use the native array semantics for two-dimensional...", "details": "For maximum compatibility with existing Fortran environments, the cuBLAS library uses column-major storage, and 1-based indexing.\nSince C and C++ use row-major storage, applications written in these languages can not use the native array semantics for two-dimensional arrays.\nHere, ld refers to the leading dimension of the matrix, which in the case of column-major storage is the number of rows of the allocated matrix (even if only a submatrix of it is being used).\nFor natively written C and C++ code, one would most likely choose 0-based indexing, in which case the array index of a matrix element in row “i” and column “j” can be computed via the following macro", "source": "https://docs.nvidia.com/cuda/cublas/#data-layout", "tokens": ["cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「数据布局」，归在「指南章节」。重点关注 关键词 cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「数据布局」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "New and Legacy cuBLAS API", "titleZh": "新旧 cuBLAS API", "numberedTitle": "1.2. New and Legacy cuBLAS API", "level": "H2", "chapter": "Introduction", "chapterZh": "介绍", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "Starting with version 4.0, the cuBLAS Library provides a new API, in addition to the existing legacy API. This section discusses why a new API is provided, the advantages of using it, and the differences with the existing legacy API.", "details": "Starting with version 4.0, the cuBLAS Library provides a new API, in addition to the existing legacy API.\nThis section discusses why a new API is provided, the advantages of using it, and the differences with the existing legacy API.\nThe new cuBLAS library API can be used by including the header file cublas_v2.h .\nIt has the following features that the legacy cuBLAS API does not have:\nThe handle to the cuBLAS library context is initialized using the function and is explicitly passed to every subsequent library function call. This allows the user to have more control over the library setup when using multiple host threads and multiple GPUs. This also allows the cuBLAS APIs to be reentrant.\nThe scalars \\(\\alpha\\) and \\(\\beta\\) can be passed by reference on the host or the device, instead of only being allowed to be passed by value on the host. This change allows library functions to execute asynchronously using streams even when \\(\\alpha\\) and \\(\\beta\\) are generated by a previous kernel.\nWhen a library routine returns a scalar result, it can be returned by reference on the host or the device, instead of only being allowed to be returned by value only on the host. This change allows library routines to be called asynchronously when the scalar result is generated and returned by reference on the device resulting in maximum parallelism.\nThe error status cublasStatus_t is returned by all cuBLAS library function calls. This change facilitates debugging and simplifies software development. Note that cublasStatus was renamed cublasStatus_t to be more consistent with other types in the cuBLAS library.", "source": "https://docs.nvidia.com/cuda/cublas/#new-and-legacy-cublas-api", "tokens": ["cuBLAS", "cublas_v2", "cublasStatus_t", "cublasStatus"], "summaryZh": "本条整理 cuBLAS 官方文档中的「新旧 cuBLAS API」，归在「指南章节」。重点关注 关键词 cuBLAS、cublas_v2、cublasStatus_t、cublasStatus，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「新旧 cuBLAS API」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS、cublas_v2、cublasStatus_t、cublasStatus。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Example Code", "titleZh": "示例代码", "numberedTitle": "1.3. Example Code", "level": "H2", "chapter": "Introduction", "chapterZh": "介绍", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "For sample code references please see the two examples below. They show an application written in C using the cuBLAS library API with two indexing styles (Example 1. “Application Using C and cuBLAS: 1-based indexing” and Example 2. “Application Using C and cuBLAS:...", "details": "For sample code references please see the two examples below.\nThey show an application written in C using the cuBLAS library API with two indexing styles (Example 1. “Application Using C and cuBLAS: 1-based indexing” and Example 2. “Application Using C and cuBLAS: 0-based Indexing”).", "source": "https://docs.nvidia.com/cuda/cublas/#example-code", "tokens": ["cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「示例代码」，归在「指南章节」。重点关注 关键词 cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「示例代码」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Forward Compatibility", "titleZh": "前向兼容", "numberedTitle": "1.4. Forward Compatibility", "level": "H2", "chapter": "Introduction", "chapterZh": "介绍", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "cuBLAS library can work on future GPUs in most cases thanks to PTX JIT. However, there are certain limitations:", "details": "cuBLAS library can work on future GPUs in most cases thanks to PTX JIT.\nHowever, there are certain limitations:\nThere are no performance guarantees: running on new hardware may be slower despite better theoretical peaks.\nThere is limited forward compatibility for narrow precisions (FP4 and FP8) and tiled 8-bit integer layouts.", "source": "https://docs.nvidia.com/cuda/cublas/#forward-compatibility", "tokens": ["cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「前向兼容」，归在「指南章节」。重点关注 关键词 cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「前向兼容」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Floating Point Emulation", "titleZh": "浮点仿真", "numberedTitle": "1.5. Floating Point Emulation", "level": "H2", "chapter": "Introduction", "chapterZh": "介绍", "parent": "", "parentZh": "", "kind": "Precision / Tensor Core", "kindZh": "精度 / Tensor Core", "summary": "Floating point emulation was first introduced in CUDA 12.9 and is used to further accelerate matrix multiplication for higher precision data types. Floating point emulation works by first transforming the inputs into multiple lower precision values, then leverages...", "details": "Floating point emulation was first introduced in CUDA 12.9 and is used to further accelerate matrix multiplication for higher precision data types.\nFloating point emulation works by first transforming the inputs into multiple lower precision values, then leverages lower precision hardware units to compute partial results, and finally recombines the results back into full precision.\nFloating Point Emulation Algorithm | Precision Emulated | Supported compute capabilities | CUDA Version\nBF16x9 | FP32 | 10.0, 10.3 | 12.9+\nFixed-Point | FP64 | 8.x, 9.0, 10.0, 11.0, 12.x | 13.0u2+\nTo enable floating point emulation without any code changes, the following environment variables can be used.\nEnvironment Variable | Description\nCUBLAS_EMULATION_STRATEGY | An environment variable for overriding the default emulation strategy. The valid values are performant and eager ; see cublasEmulationStrategy_t for more details.", "source": "https://docs.nvidia.com/cuda/cublas/#floating-point-emulation", "tokens": ["CUBLAS_EMULATION_STRATEGY", "cublasEmulationStrategy_t"], "summaryZh": "本条整理 cuBLAS 官方文档中的「浮点仿真」，归在「精度 / Tensor Core」。重点关注 关键词 CUBLAS_EMULATION_STRATEGY、cublasEmulationStrategy_t，适合用于理解 Tensor Core、数据类型、math mode 和精度/性能取舍。", "detailsZh": "中文提要：这是「浮点仿真」对应的官方条目，分类为「精度 / Tensor Core」。\n阅读重点：理解 Tensor Core、数据类型、math mode 和精度/性能取舍。\n相关 API / 关键词：CUBLAS_EMULATION_STRATEGY、cublasEmulationStrategy_t。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "BF16x9", "titleZh": "BF16x9", "numberedTitle": "1.5.1. BF16x9", "level": "H3", "chapter": "Introduction", "chapterZh": "介绍", "parent": "Floating Point Emulation", "parentZh": "浮点仿真", "kind": "Precision / Tensor Core", "kindZh": "精度 / Tensor Core", "summary": "The BF16x9 algorithm is used for emulating FP32 arithmetic. An FP32 value can be exactly represented as three BF16 values as follows:", "details": "The BF16x9 algorithm is used for emulating FP32 arithmetic.\nAn FP32 value can be exactly represented as three BF16 values as follows:\nWe can fully reconstruct the FP32 value from the BF16 values without any loss of accuracy.\nUsing this, we define an FMA operation ( d = ab + c ) as follows:\nIn practice, the BF16 tensor cores are utilized rather than FMA units and this idea naturally extends into complex arithmetic as well.\nWhile BF16x9 can be supported on all hardware, it only provides a performance advantage when peak BF16 throughput is more than nine times greater than peak FP32 throughput.\nIt also requires special hardware features to apply the additional scaling factors in a performant manner.", "source": "https://docs.nvidia.com/cuda/cublas/#bf16x9", "tokens": [], "summaryZh": "本条整理 cuBLAS 官方文档中的「BF16x9」，归在「精度 / Tensor Core」。重点关注 精度 / Tensor Core，适合用于理解 Tensor Core、数据类型、math mode 和精度/性能取舍。", "detailsZh": "中文提要：这是「BF16x9」对应的官方条目，分类为「精度 / Tensor Core」。\n阅读重点：理解 Tensor Core、数据类型、math mode 和精度/性能取舍。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Fixed-Point", "titleZh": "定点", "numberedTitle": "1.5.2. Fixed-Point", "level": "H3", "chapter": "Introduction", "chapterZh": "介绍", "parent": "Floating Point Emulation", "parentZh": "浮点仿真", "kind": "Precision / Tensor Core", "kindZh": "精度 / Tensor Core", "summary": "Fixed-point emulation is used for emulating FP64 arithmetic and follows the Ozaki Scheme . Fixed-point representations emulate floating point through the addition of a shared power of two scaling factor and by encoding the remaining dynamic range of floating point...", "details": "Fixed-point emulation is used for emulating FP64 arithmetic and follows the Ozaki Scheme .\nFixed-point representations emulate floating point through the addition of a shared power of two scaling factor and by encoding the remaining dynamic range of floating point within mantissa bits.\nDue to the large dynamic range of FP64, there is no single configuration of fixed-point which is both performant and accurate for all floating point inputs.\nTherefore, we enable two flavors of fixed-point emulation: Dynamic Mantissa Control and Fixed Mantissa Control .", "source": "https://docs.nvidia.com/cuda/cublas/#fixed-point", "tokens": [], "summaryZh": "本条整理 cuBLAS 官方文档中的「定点」，归在「精度 / Tensor Core」。重点关注 精度 / Tensor Core，适合用于理解 Tensor Core、数据类型、math mode 和精度/性能取舍。", "detailsZh": "中文提要：这是「定点」对应的官方条目，分类为「精度 / Tensor Core」。\n阅读重点：理解 Tensor Core、数据类型、math mode 和精度/性能取舍。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Dynamic Mantissa Control", "titleZh": "动态尾数控制", "numberedTitle": "1.5.2.1. Dynamic Mantissa Control", "level": "H4", "chapter": "Introduction", "chapterZh": "介绍", "parent": "Fixed-Point", "parentZh": "定点", "kind": "Guide", "kindZh": "指南章节", "summary": "Dynamic mantissa control represents the cuBLAS library default mantissa control. Our automatic dynamic precision framework computes the proper number of fixed-point mantissa bits required to maintain equal or better accuracy than FP64. If the number of required...", "details": "Dynamic mantissa control represents the cuBLAS library default mantissa control.\nOur automatic dynamic precision framework computes the proper number of fixed-point mantissa bits required to maintain equal or better accuracy than FP64.", "source": "https://docs.nvidia.com/cuda/cublas/#dynamic-mantissa-control", "tokens": ["cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「动态尾数控制」，归在「指南章节」。重点关注 关键词 cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「动态尾数控制」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Fixed Mantissa Control", "titleZh": "固定尾数控制", "numberedTitle": "1.5.2.2. Fixed Mantissa Control", "level": "H4", "chapter": "Introduction", "chapterZh": "介绍", "parent": "Fixed-Point", "parentZh": "定点", "kind": "Guide", "kindZh": "指南章节", "summary": "Fixed mantissa control can be leveraged to further accelerate fixed-point emulation. The user can provide the number of mantissa bits for the fixed-point representation via cublasSetFixedPointEmulationMaxMantissaBitCount() ; however, without the automatic dynamic...", "details": "Fixed mantissa control can be leveraged to further accelerate fixed-point emulation.\nThe user can provide the number of mantissa bits for the fixed-point representation via cublasSetFixedPointEmulationMaxMantissaBitCount() ; however, without the automatic dynamic precision framework, it is not possible to guarantee equal or better accuracy than FP64 arithmetic.", "source": "https://docs.nvidia.com/cuda/cublas/#fixed-mantissa-control", "tokens": ["cublasSetFixedPointEmulationMaxMantissaBitCount"], "summaryZh": "本条整理 cuBLAS 官方文档中的「固定尾数控制」，归在「指南章节」。重点关注 关键词 cublasSetFixedPointEmulationMaxMantissaBitCount，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「固定尾数控制」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublasSetFixedPointEmulationMaxMantissaBitCount。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Representation and Mappings", "titleZh": "表示与映射", "numberedTitle": "1.5.2.3. Representation and Mappings", "level": "H4", "chapter": "Introduction", "chapterZh": "介绍", "parent": "Fixed-Point", "parentZh": "定点", "kind": "Guide", "kindZh": "指南章节", "summary": "The fixed-point representation consists of a shared scaling factor for elements in the same row or column of a matrix, a sign bit, and mantissa bits. We store the sign bit and mantissa bits within 8-bit integers. Each matrix of 8-bit integers are referred to as a slice...", "details": "The fixed-point representation consists of a shared scaling factor for elements in the same row or column of a matrix, a sign bit, and mantissa bits.\nWe store the sign bit and mantissa bits within 8-bit integers.", "source": "https://docs.nvidia.com/cuda/cublas/#representation-and-mappings", "tokens": [], "summaryZh": "本条整理 cuBLAS 官方文档中的「表示与映射」，归在「指南章节」。重点关注 指南章节，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「表示与映射」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Fixed-Point Workspace Requirements", "titleZh": "定点仿真 Workspace 要求", "numberedTitle": "1.5.2.4. Fixed-Point Workspace Requirements", "level": "H4", "chapter": "Introduction", "chapterZh": "介绍", "parent": "Fixed-Point", "parentZh": "定点", "kind": "Workspace / Reproducibility", "kindZh": "Workspace / 可复现", "summary": "When fixed-point emulation is used, the library requires workspace memory to store internal fixed-point representations and intermediate results. The amount of memory required depends on problem size, mantissa bit count, GPU architecture, and library version, but never...", "details": "When fixed-point emulation is used, the library requires workspace memory to store internal fixed-point representations and intermediate results.\nThe amount of memory required depends on problem size, mantissa bit count, GPU architecture, and library version, but never exceeds 8 GB.", "source": "https://docs.nvidia.com/cuda/cublas/#fixed-point-workspace-requirements", "tokens": [], "summaryZh": "本条整理 cuBLAS 官方文档中的「定点仿真 Workspace 要求」，归在「Workspace / 可复现」。重点关注 Workspace / 可复现，适合用于处理 workspace、可复现性和多 stream 行为。", "detailsZh": "中文提要：这是「定点仿真 Workspace 要求」对应的官方条目，分类为「Workspace / 可复现」。\n阅读重点：处理 workspace、可复现性和多 stream 行为。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Fixed-Point Performance Guide", "titleZh": "定点仿真性能指南", "numberedTitle": "1.5.2.5. Fixed-Point Performance Guide", "level": "H4", "chapter": "Introduction", "chapterZh": "介绍", "parent": "Fixed-Point", "parentZh": "定点", "kind": "Guide", "kindZh": "指南章节", "summary": "Fixed-point emulation allows users to make performance and precision trade-offs for further acceleration. For dynamic mantissa control, users are able to configure the automatic dynamic precision framework to use fewer or more bits than the accuracy of native FP64...", "details": "Fixed-point emulation allows users to make performance and precision trade-offs for further acceleration.\nFor dynamic mantissa control, users are able to configure the automatic dynamic precision framework to use fewer or more bits than the accuracy of native FP64 requires with cublasSetFixedPointEmulationMantissaBitOffset() .\nWhen the per-handle workspace is insufficient to meet the fixed-point workspace requirements , the library dynamically allocates additional memory with cudaMallocAsync() .\nThis dynamically allocated memory is freed on stream synchronizations including cudaDeviceSynchronize , cudaStreamSynchronize , and cudaStreamWaitEvent .\nReducing the number of CUDA stream synchronizations\nManually managing memory and providing workspace with cublasSetWorkspace()\nAllowing the default memory pool to retain memory between synchronizations\nIf cudaMallocAsync() fails to satisfy the request, the library falls back to non-emulated routines for affected calls.", "source": "https://docs.nvidia.com/cuda/cublas/#fixed-point-performance-guide", "tokens": ["cublasSetFixedPointEmulationMantissaBitOffset", "cudaMallocAsync", "cudaDeviceSynchronize", "cudaStreamSynchronize", "cudaStreamWaitEvent", "cublasSetWorkspace"], "summaryZh": "本条整理 cuBLAS 官方文档中的「定点仿真性能指南」，归在「指南章节」。重点关注 关键词 cublasSetFixedPointEmulationMantissaBitOffset、cudaMallocAsync、cudaDeviceSynchronize、cudaStreamSynchronize、cudaStreamWaitEvent，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「定点仿真性能指南」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublasSetFixedPointEmulationMantissaBitOffset、cudaMallocAsync、cudaDeviceSynchronize、cudaStreamSynchronize、cudaStreamWaitEvent、cublasSetWorkspace。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Default Library Configurations", "titleZh": "默认库配置", "numberedTitle": "1.5.3. Default Library Configurations", "level": "H3", "chapter": "Introduction", "chapterZh": "介绍", "parent": "Floating Point Emulation", "parentZh": "浮点仿真", "kind": "Precision / Tensor Core", "kindZh": "精度 / Tensor Core", "summary": "Library default values for emulation are subject to change.", "details": "Library default values for emulation are subject to change.\nAPI | Mantissa Control | Default Behavior\ncublasGetEmulationStrategy() | Not applicable | CUBLAS_EMULATION_STRATEGY_DEFAULT\ncublasGetEmulationSpecialValuesSupport() | Not applicable | CUBLAS_EMULATION_SPECIAL_VALUES_SUPPORT_DEFAULT\ncublasGetFixedPointEmulationMantissaControl() | Not applicable | CUDA_EMULATION_MANTISSA_CONTROL_DYNAMIC\ncublasGetFixedPointEmulationMaxMantissaBitCount() | CUDA_EMULATION_MANTISSA_CONTROL_DYNAMIC | 79\ncublasGetFixedPointEmulationMaxMantissaBitCount() | CUDA_EMULATION_MANTISSA_CONTROL_FIXED | 55\ncublasGetFixedPointEmulationMantissaBitOffset() | Not applicable | 0", "source": "https://docs.nvidia.com/cuda/cublas/#default-library-configurations", "tokens": ["cublasGetEmulationStrategy", "CUBLAS_EMULATION_STRATEGY_DEFAULT", "cublasGetEmulationSpecialValuesSupport", "CUBLAS_EMULATION_SPECIAL_VALUES_SUPPORT_DEFAULT", "cublasGetFixedPointEmulationMantissaControl", "CUDA_EMULATION_MANTISSA_CONTROL_DYNAMIC", "cublasGetFixedPointEmulationMaxMantissaBitCount", "CUDA_EMULATION_MANTISSA_CONTROL_FIXED", "cublasGetFixedPointEmulationMantissaBitOffset"], "summaryZh": "本条整理 cuBLAS 官方文档中的「默认库配置」，归在「精度 / Tensor Core」。重点关注 关键词 cublasGetEmulationStrategy、CUBLAS_EMULATION_STRATEGY_DEFAULT、cublasGetEmulationSpecialValuesSupport、CUBLAS_EMULATION_SPECIAL_VALUES_SUPPORT_DEFAULT、cublasGetFixedPointEmulationMantissaControl，适合用于理解 Tensor Core、数据类型、math mode 和精度/性能取舍。", "detailsZh": "中文提要：这是「默认库配置」对应的官方条目，分类为「精度 / Tensor Core」。\n阅读重点：理解 Tensor Core、数据类型、math mode 和精度/性能取舍。\n相关 API / 关键词：cublasGetEmulationStrategy、CUBLAS_EMULATION_STRATEGY_DEFAULT、cublasGetEmulationSpecialValuesSupport、CUBLAS_EMULATION_SPECIAL_VALUES_SUPPORT_DEFAULT、cublasGetFixedPointEmulationMantissaControl、CUDA_EMULATION_MANTISSA_CONTROL_DYNAMIC、cublasGetFixedPointEmulationMaxMantissaBitCount、CUDA_EMULATION_MANTISSA_CONTROL_FIXED。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Support For Floating Point Special Values", "titleZh": "浮点特殊值支持", "numberedTitle": "1.5.4. Support For Floating Point Special Values", "level": "H3", "chapter": "Introduction", "chapterZh": "介绍", "parent": "Floating Point Emulation", "parentZh": "浮点仿真", "kind": "Precision / Tensor Core", "kindZh": "精度 / Tensor Core", "summary": "The implementations of floating point emulation algorithms maintain the accuracy of the emulated precision for both normal and denormalized values but may not adhere to the IEEE-754 standard with respect to \\(\\text{Inf}\\) , \\(\\text{NaN}\\) , or signed zeros. If the...", "details": "The implementations of floating point emulation algorithms maintain the accuracy of the emulated precision for both normal and denormalized values but may not adhere to the IEEE-754 standard with respect to \\(\\text{Inf}\\) , \\(\\text{NaN}\\) , or signed zeros.\nIf the underlying emulated algorithm cannot implicitly support a given special value, and the library is configured to support it (see cublasSetEmulationSpecialValuesSupport() ), then extra steps are taken to support it.\nFloating Point Emulation Algorithm | Implicitly Supported Special Values\nBF16x9 | \\(\\text{NaN}\\)\nFixed-Point | None", "source": "https://docs.nvidia.com/cuda/cublas/#support-for-floating-point-special-values", "tokens": ["cublasSetEmulationSpecialValuesSupport"], "summaryZh": "本条整理 cuBLAS 官方文档中的「浮点特殊值支持」，归在「精度 / Tensor Core」。重点关注 关键词 cublasSetEmulationSpecialValuesSupport，适合用于理解 Tensor Core、数据类型、math mode 和精度/性能取舍。", "detailsZh": "中文提要：这是「浮点特殊值支持」对应的官方条目，分类为「精度 / Tensor Core」。\n阅读重点：理解 Tensor Core、数据类型、math mode 和精度/性能取舍。\n相关 API / 关键词：cublasSetEmulationSpecialValuesSupport。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Using the cuBLAS API", "titleZh": "使用 cuBLAS API", "numberedTitle": "2. Using the cuBLAS API", "level": "H1", "chapter": "Introduction", "chapterZh": "介绍", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "cuBLAS 文档章节：Using the cuBLAS API", "details": "", "source": "https://docs.nvidia.com/cuda/cublas/#using-the-cublas-api", "tokens": ["cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「使用 cuBLAS API」，归在「指南章节」。重点关注 关键词 cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「使用 cuBLAS API」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS。"}, {"title": "General Description", "titleZh": "总体说明", "numberedTitle": "2.1. General Description", "level": "H2", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "This section describes how to use the cuBLAS library API.", "details": "This section describes how to use the cuBLAS library API.", "source": "https://docs.nvidia.com/cuda/cublas/#general-description", "tokens": ["cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「总体说明」，归在「指南章节」。重点关注 关键词 cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「总体说明」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Error Status", "titleZh": "错误状态", "numberedTitle": "2.1.1. Error Status", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "General Description", "parentZh": "总体说明", "kind": "Types / Status", "kindZh": "类型 / 状态码", "summary": "All cuBLAS library function calls return the error status cublasStatus_t .", "details": "All cuBLAS library function calls return the error status cublasStatus_t .", "source": "https://docs.nvidia.com/cuda/cublas/#error-status", "tokens": ["cuBLAS", "cublasStatus_t"], "summaryZh": "本条整理 cuBLAS 官方文档中的「错误状态」，归在「类型 / 状态码」。重点关注 关键词 cuBLAS、cublasStatus_t，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「错误状态」对应的官方条目，分类为「类型 / 状态码」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS、cublasStatus_t。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cuBLAS Context", "titleZh": "cuBLAS Context", "numberedTitle": "2.1.2. cuBLAS Context", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "General Description", "parentZh": "总体说明", "kind": "Guide", "kindZh": "指南章节", "summary": "The application must initialize a handle to the cuBLAS library context by calling the cublasCreate() function. Then, the handle is explicitly passed to every subsequent library function call. Once the application finishes using the library, it must call the function...", "details": "The application must initialize a handle to the cuBLAS library context by calling the cublasCreate() function.\nThen, the handle is explicitly passed to every subsequent library function call.\nThis approach allows the user to explicitly control the library setup when using multiple host threads and multiple GPUs.\nFor example, the application can use cudaSetDevice() to associate different devices with different host threads and in each of those host threads it can initialize a unique handle to the cuBLAS library context, which will use the particular device associated with that host thread.\nThe device associated with a particular cuBLAS context is assumed to remain unchanged between the corresponding cublasCreate() and cublasDestroy() calls.\nIn order for the cuBLAS library to use a different device in the same host thread, the application must set the new device to be used by calling cudaSetDevice() and then create another cuBLAS context, which will be associated with the new device, by calling cublasCreate() .\nA cuBLAS library context is tightly coupled with the CUDA context that is current at the time of the cublasCreate() call.\nAn application that uses multiple CUDA contexts is required to create a cuBLAS context per CUDA context and make sure the former never outlives the latter.", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-context", "tokens": ["cuBLAS", "cublasCreate", "cudaSetDevice", "cublasDestroy"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cuBLAS Context」，归在「指南章节」。重点关注 关键词 cuBLAS、cublasCreate、cudaSetDevice、cublasDestroy，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cuBLAS Context」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS、cublasCreate、cudaSetDevice、cublasDestroy。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Thread Safety", "titleZh": "线程安全", "numberedTitle": "2.1.3. Thread Safety", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "General Description", "parentZh": "总体说明", "kind": "Guide", "kindZh": "指南章节", "summary": "The library is thread safe and its functions can be called from multiple host threads, even with the same handle. When multiple threads share the same handle, extreme care needs to be taken when the handle configuration is changed because that change will affect...", "details": "The library is thread safe and its functions can be called from multiple host threads, even with the same handle.\nWhen multiple threads share the same handle, extreme care needs to be taken when the handle configuration is changed because that change will affect potentially subsequent cuBLAS calls in all threads.\nAdditional considerations apply when the same handle is used from multiple threads with a user provided workspace.\nSee cublasSetWorkspace() for details.", "source": "https://docs.nvidia.com/cuda/cublas/#thread-safety", "tokens": ["cuBLAS", "cublasSetWorkspace"], "summaryZh": "本条整理 cuBLAS 官方文档中的「线程安全」，归在「指南章节」。重点关注 关键词 cuBLAS、cublasSetWorkspace，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「线程安全」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS、cublasSetWorkspace。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Results Reproducibility", "titleZh": "结果可复现性", "numberedTitle": "2.1.4. Results Reproducibility", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "General Description", "parentZh": "总体说明", "kind": "Workspace / Reproducibility", "kindZh": "Workspace / 可复现", "summary": "By design, all cuBLAS API routines from a given toolkit version, generate the same bit-wise results at every run when executed on GPUs with the same architecture and the same number of SMs. However, bit-wise reproducibility is not guaranteed across toolkit versions...", "details": "By design, all cuBLAS API routines from a given toolkit version, generate the same bit-wise results at every run when executed on GPUs with the same architecture and the same number of SMs.\nHowever, bit-wise reproducibility is not guaranteed across toolkit versions because the implementation might differ due to some implementation changes.\nThis guarantee no longer holds when multiple CUDA streams are active or fixed-point emulation is used.\nIf multiple concurrent streams are active, the library may optimize total performance by picking different internal implementations.\nAny of those settings will allow for deterministic behavior even with multiple concurrent streams sharing a single cuBLAS handle.\nThis behavior is expected to change in a future release.\nFor some routines such as cublas<t>symv() and cublas<t>hemv() , an alternate significantly faster routine can be chosen using the routine cublasSetAtomicsMode() .\nIn that case, the results are not guaranteed to be bit-wise reproducible because atomics are used for the computation.", "source": "https://docs.nvidia.com/cuda/cublas/#results-reproducibility", "tokens": ["cuBLAS", "cublas<t>symv", "cublas<t>hemv", "cublasSetAtomicsMode"], "summaryZh": "本条整理 cuBLAS 官方文档中的「结果可复现性」，归在「Workspace / 可复现」。重点关注 关键词 cuBLAS、cublas<t>symv、cublas<t>hemv、cublasSetAtomicsMode，适合用于处理 workspace、可复现性和多 stream 行为。", "detailsZh": "中文提要：这是「结果可复现性」对应的官方条目，分类为「Workspace / 可复现」。\n阅读重点：处理 workspace、可复现性和多 stream 行为。\n相关 API / 关键词：cuBLAS、cublas<t>symv、cublas<t>hemv、cublasSetAtomicsMode。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Scalar Parameters", "titleZh": "标量参数", "numberedTitle": "2.1.5. Scalar Parameters", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "General Description", "parentZh": "总体说明", "kind": "Guide", "kindZh": "指南章节", "summary": "There are two categories of the functions that use scalar parameters :", "details": "There are two categories of the functions that use scalar parameters :\nFunctions that take alpha and/or beta parameters by reference on the host or the device as scaling factors, such as gemm .\nFunctions that return a scalar result on the host or the device such as amax() , amin , asum() , rotg() , rotmg() , dot() and nrm2() .\nFor the functions of the first category, when the pointer mode is set to CUBLAS_POINTER_MODE_HOST , the scalar parameters alpha and/or beta can be on the stack or allocated on the heap, shouldn’t be placed in managed memory.\nUnderneath, the CUDA kernels related to those functions will be launched with the value of alpha and/or beta .\nFor the functions of the second category, when the pointer mode is set to CUBLAS_POINTER_MODE_HOST , these functions block the CPU, until the GPU has completed its computation and the results have been copied back to the Host.\nWhen the pointer mode is set to CUBLAS_POINTER_MODE_DEVICE , these functions return immediately.\nIn either case, the pointer mode CUBLAS_POINTER_MODE_DEVICE allows the library functions to execute completely asynchronously from the Host even when alpha and/or beta are generated by a previous kernel.", "source": "https://docs.nvidia.com/cuda/cublas/#scalar-parameters", "tokens": ["CUBLAS_POINTER_MODE_HOST", "CUBLAS_POINTER_MODE_DEVICE"], "summaryZh": "本条整理 cuBLAS 官方文档中的「标量参数」，归在「指南章节」。重点关注 关键词 CUBLAS_POINTER_MODE_HOST、CUBLAS_POINTER_MODE_DEVICE，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「标量参数」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：CUBLAS_POINTER_MODE_HOST、CUBLAS_POINTER_MODE_DEVICE。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallelism with Streams", "titleZh": "Stream 并行", "numberedTitle": "2.1.6. Parallelism with Streams", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "General Description", "parentZh": "总体说明", "kind": "Guide", "kindZh": "指南章节", "summary": "If the application uses the results computed by multiple independent tasks, CUDA™ streams can be used to overlap the computation performed in these tasks.", "details": "If the application uses the results computed by multiple independent tasks, CUDA™ streams can be used to overlap the computation performed in these tasks.\nThe application can conceptually associate each stream with each task.\nIn order to achieve the overlap of computation between the tasks, the user should create CUDA™ streams using the function cudaStreamCreate() and set the stream to be used by each individual cuBLAS library routine by calling cublasSetStream() just before calling the actual cuBLAS routine.\nWe recommend using the new cuBLAS API with scalar parameters and results passed by reference in the device memory to achieve maximum overlap of the computation when using streams.\nA particular application of streams, batching of multiple small kernels, is described in the following section.", "source": "https://docs.nvidia.com/cuda/cublas/#parallelism-with-streams", "tokens": ["cudaStreamCreate", "cuBLAS", "cublasSetStream"], "summaryZh": "本条整理 cuBLAS 官方文档中的「Stream 并行」，归在「指南章节」。重点关注 关键词 cudaStreamCreate、cuBLAS、cublasSetStream，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「Stream 并行」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cudaStreamCreate、cuBLAS、cublasSetStream。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Batching Kernels", "titleZh": "批量 Kernel", "numberedTitle": "2.1.7. Batching Kernels", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "General Description", "parentZh": "总体说明", "kind": "Guide", "kindZh": "指南章节", "summary": "In this section, we explain how to use streams to batch the execution of small kernels. For instance, suppose that we have an application where we need to make many small independent matrix-matrix multiplications with dense matrices.", "details": "In this section, we explain how to use streams to batch the execution of small kernels.\nFor instance, suppose that we have an application where we need to make many small independent matrix-matrix multiplications with dense matrices.\nIt is clear that even with millions of small independent matrices we will not be able to achieve the same GFLOPS rate as with a one large matrix.\nFor example, a single \\(n \\times n\\) large matrix-matrix multiplication performs \\(n^{3}\\) operations for \\(n^{2}\\) input size, while 1024 \\(\\frac{n}{32} \\times \\frac{n}{32}\\) small matrix-matrix multiplications perform \\(1024\\left( \\frac{n}{32} \\right)^{3} = \\frac{n^{3}}{32}\\) operations for the same input size.\nThe architecture family of GPUs allows us to execute multiple kernels simultaneously.\nHence, in order to batch the execution of independent kernels, we can run each of them in a separate stream.", "source": "https://docs.nvidia.com/cuda/cublas/#batching-kernels", "tokens": [], "summaryZh": "本条整理 cuBLAS 官方文档中的「批量 Kernel」，归在「指南章节」。重点关注 指南章节，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「批量 Kernel」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Cache Configuration", "titleZh": "Cache 配置", "numberedTitle": "2.1.8. Cache Configuration", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "General Description", "parentZh": "总体说明", "kind": "Guide", "kindZh": "指南章节", "summary": "On some devices, L1 cache and shared memory use the same hardware resources. The cache configuration can be set directly with the CUDA Runtime function cudaDeviceSetCacheConfig. The cache configuration can also be set specifically for some functions using the routine...", "details": "On some devices, L1 cache and shared memory use the same hardware resources.\nThe cache configuration can be set directly with the CUDA Runtime function cudaDeviceSetCacheConfig.\nBecause switching from one configuration to another can affect kernels concurrency, the cuBLAS Library does not set any cache configuration preference and relies on the current setting.\nHowever, some cuBLAS routines, especially Level-3 routines, rely heavily on shared memory.", "source": "https://docs.nvidia.com/cuda/cublas/#cache-configuration", "tokens": ["cudaDeviceSetCacheConfig", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「Cache 配置」，归在「指南章节」。重点关注 关键词 cudaDeviceSetCacheConfig、cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「Cache 配置」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cudaDeviceSetCacheConfig、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Static Library Support", "titleZh": "静态库支持", "numberedTitle": "2.1.9. Static Library Support", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "General Description", "parentZh": "总体说明", "kind": "Guide", "kindZh": "指南章节", "summary": "The cuBLAS Library is also delivered in a static form as libcublas_static.a on Linux. The static cuBLAS library and all other static math libraries depend on a common thread abstraction layer library called libculibos.a .", "details": "The cuBLAS Library is also delivered in a static form as libcublas_static.a on Linux.\nThe static cuBLAS library and all other static math libraries depend on a common thread abstraction layer library called libculibos.a .\nFor example, on Linux, to compile a small application using cuBLAS, against the dynamic library, the following command can be used:\nWhereas to compile against the static cuBLAS library, the following command must be used:\nIt is also possible to use the native Host C++ compiler.\nDepending on the Host operating system, some additional libraries like pthread or dl might be needed on the linking line.\nNote that in the latter case, the library cuda is not needed.\nThe CUDA Runtime will try to open explicitly the cuda library if needed.", "source": "https://docs.nvidia.com/cuda/cublas/#static-library-support", "tokens": ["cuBLAS", "cublas_static", "libculibos.a", "cuda"], "summaryZh": "本条整理 cuBLAS 官方文档中的「静态库支持」，归在「指南章节」。重点关注 关键词 cuBLAS、cublas_static、libculibos.a、cuda，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「静态库支持」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS、cublas_static、libculibos.a、cuda。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "GEMM Algorithms Numerical Behavior", "titleZh": "GEMM 算法数值行为", "numberedTitle": "2.1.10. GEMM Algorithms Numerical Behavior", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "General Description", "parentZh": "总体说明", "kind": "GEMM / Level-3", "kindZh": "GEMM / Level-3", "summary": "Some GEMM algorithms split the computation along the dimension K to increase the GPU occupancy, especially when the dimension K is large compared to dimensions M and N. When this type of algorithm is chosen by the cuBLAS heuristics or explicitly by the user, the...", "details": "Some GEMM algorithms split the computation along the dimension K to increase the GPU occupancy, especially when the dimension K is large compared to dimensions M and N.\nWhen this type of algorithm is chosen by the cuBLAS heuristics or explicitly by the user, the results of each split is summed deterministically into the resulting matrix to get the final result.\nFor the routines cublas<t>gemmEx() and cublasGemmEx() , when the compute type is greater than the output type, the sum of the split chunks can potentially lead to some intermediate overflows thus producing a final resulting matrix with some overflows.\nThose overflows might not have occurred if all the dot products had been accumulated in the compute type before being converted at the end in the output type.", "source": "https://docs.nvidia.com/cuda/cublas/#gemm-algorithms-numerical-behavior", "tokens": ["cuBLAS", "cublas<t>gemmEx", "cublasGemmEx"], "summaryZh": "本条整理 cuBLAS 官方文档中的「GEMM 算法数值行为」，归在「GEMM / Level-3」。重点关注 关键词 cuBLAS、cublas<t>gemmEx、cublasGemmEx，适合用于定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。", "detailsZh": "中文提要：这是「GEMM 算法数值行为」对应的官方条目，分类为「GEMM / Level-3」。\n阅读重点：定位 GEMM、batched GEMM 和高吞吐矩阵乘路径。\n相关 API / 关键词：cuBLAS、cublas<t>gemmEx、cublasGemmEx。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Tensor Core Usage", "titleZh": "Tensor Core 使用", "numberedTitle": "2.1.11. Tensor Core Usage", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "General Description", "parentZh": "总体说明", "kind": "Precision / Tensor Core", "kindZh": "精度 / Tensor Core", "summary": "Tensor cores were first introduced with Volta GPUs (compute capability 7.0 and above) and significantly accelerate matrix multiplications. Starting with cuBLAS version 11.0.0, the library may automatically make use of Tensor Core capabilities wherever possible, unless...", "details": "Tensor cores were first introduced with Volta GPUs (compute capability 7.0 and above) and significantly accelerate matrix multiplications.\nStarting with cuBLAS version 11.0.0, the library may automatically make use of Tensor Core capabilities wherever possible, unless they are explicitly disabled by selecting pedantic compute modes in cuBLAS (see cublasSetMathMode() , cublasMath_t ).\nIt should be noted that the library will pick a Tensor Core enabled implementation wherever it determines that it would provide the best performance.\nThe best performance when using Tensor Cores can be achieved when the matrix dimensions and pointers meet certain memory alignment requirements.\nSpecifically, all of the following conditions must be satisfied to get the most performance out of Tensor Cores:\n((op_A == CUBLAS_OP_N ? m : k) * AtypeSize) % 16 == 0\n((op_B == CUBLAS_OP_N ? k : n) * BtypeSize) % 16 == 0\n(m * CtypeSize) % 16 == 0", "source": "https://docs.nvidia.com/cuda/cublas/#tensor-core-usage", "tokens": ["cuBLAS", "cublasSetMathMode", "cublasMath_t", "CUBLAS_OP_N"], "summaryZh": "本条整理 cuBLAS 官方文档中的「Tensor Core 使用」，归在「精度 / Tensor Core」。重点关注 关键词 cuBLAS、cublasSetMathMode、cublasMath_t、CUBLAS_OP_N，适合用于理解 Tensor Core、数据类型、math mode 和精度/性能取舍。", "detailsZh": "中文提要：这是「Tensor Core 使用」对应的官方条目，分类为「精度 / Tensor Core」。\n阅读重点：理解 Tensor Core、数据类型、math mode 和精度/性能取舍。\n相关 API / 关键词：cuBLAS、cublasSetMathMode、cublasMath_t、CUBLAS_OP_N。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "CUDA Graphs Support", "titleZh": "CUDA Graph 支持", "numberedTitle": "2.1.12. CUDA Graphs Support", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "General Description", "parentZh": "总体说明", "kind": "Guide", "kindZh": "指南章节", "summary": "cuBLAS routines can be captured in CUDA Graph stream capture without restrictions in most situations.", "details": "cuBLAS routines can be captured in CUDA Graph stream capture without restrictions in most situations.\nThe exception are routines that output results into host buffers (e.g. cublas<t>dot() while pointer mode CUBLAS_POINTER_MODE_HOST is configured), as it enforces synchronization.\nFor input coefficients (such as alpha , beta ) behavior depends on the pointer mode setting:\nIn the case of CUBLAS(LT)_POINTER_MODE_HOST , coefficient values are captured in the graph.\nIn the case of pointer modes with device pointers, coefficient value is accessed using the device pointer at the time of graph execution.", "source": "https://docs.nvidia.com/cuda/cublas/#cuda-graphs-support", "tokens": ["cuBLAS", "cublas<t>dot", "CUBLAS_POINTER_MODE_HOST"], "summaryZh": "本条整理 cuBLAS 官方文档中的「CUDA Graph 支持」，归在「指南章节」。重点关注 关键词 cuBLAS、cublas<t>dot、CUBLAS_POINTER_MODE_HOST，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「CUDA Graph 支持」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS、cublas<t>dot、CUBLAS_POINTER_MODE_HOST。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "64-bit Integer Interface", "titleZh": "64-bit 整数接口", "numberedTitle": "2.1.13. 64-bit Integer Interface", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "General Description", "parentZh": "总体说明", "kind": "Guide", "kindZh": "指南章节", "summary": "cuBLAS version 12 introduced 64-bit integer capable functions. Each 64-bit integer function is equivalent to a 32-bit integer function with the following changes:", "details": "cuBLAS version 12 introduced 64-bit integer capable functions.\nEach 64-bit integer function is equivalent to a 32-bit integer function with the following changes:\nThe function name has _64 suffix.\nThe dimension (problem size) data type changed from int to int64_t . Examples of dimension: m , n , and k .\nThe leading dimension data type changed from int to int64_t . Examples of leading dimension: lda , ldb , and ldc .\nThe vector increment data type changed from int to int64_t . Examples of vector increment: incx and incy .\nFor example, consider the following 32-bit integer functions:\nThe equivalent 64-bit integer functions are:", "source": "https://docs.nvidia.com/cuda/cublas/#bit-integer-interface", "tokens": ["cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「64-bit 整数接口」，归在「指南章节」。重点关注 关键词 cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「64-bit 整数接口」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cuBLAS Datatypes Reference", "titleZh": "cuBLAS Datatypes Reference", "numberedTitle": "2.2. cuBLAS Datatypes Reference", "level": "H2", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "", "parentZh": "", "kind": "Types / Status", "kindZh": "类型 / 状态码", "summary": "cuBLAS 文档章节：cuBLAS Datatypes Reference", "details": "", "source": "https://docs.nvidia.com/cuda/cublas/#cublas-datatypes-reference", "tokens": ["cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cuBLAS Datatypes Reference」，归在「类型 / 状态码」。重点关注 关键词 cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cuBLAS Datatypes Reference」对应的官方条目，分类为「类型 / 状态码」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLAS。"}, {"title": "cublasHandle_t", "titleZh": "cublasHandle_t", "numberedTitle": "2.2.1. cublasHandle_t", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Datatypes Reference", "parentZh": "cuBLAS Datatypes Reference", "kind": "Types / Status", "kindZh": "类型 / 状态码", "summary": "The cublasHandle_t type is a pointer type to an opaque structure holding the cuBLAS library context. The cuBLAS library context must be initialized using cublasCreate() and the returned handle must be passed to all subsequent library function calls. The context should...", "details": "The cublasHandle_t type is a pointer type to an opaque structure holding the cuBLAS library context.\nThe cuBLAS library context must be initialized using cublasCreate() and the returned handle must be passed to all subsequent library function calls.", "source": "https://docs.nvidia.com/cuda/cublas/#cublashandle-t", "tokens": ["cublasHandle_t", "cuBLAS", "cublasCreate"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasHandle_t」，归在「类型 / 状态码」。重点关注 关键词 cublasHandle_t、cuBLAS、cublasCreate，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublasHandle_t」对应的官方条目，分类为「类型 / 状态码」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublasHandle_t、cuBLAS、cublasCreate。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasStatus_t", "titleZh": "cublasStatus_t", "numberedTitle": "2.2.2. cublasStatus_t", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Datatypes Reference", "parentZh": "cuBLAS Datatypes Reference", "kind": "Types / Status", "kindZh": "类型 / 状态码", "summary": "The type is used for function status returns. All cuBLAS library functions return their status, which can have the following values.", "details": "The type is used for function status returns.\nAll cuBLAS library functions return their status, which can have the following values.\nValue | Meaning\nCUBLAS_STATUS_SUCCESS | The operation completed successfully.\nCUBLAS_STATUS_NOT_INITIALIZED | The cuBLAS library was not initialized. This is usually caused by the lack of a prior cublasCreate() call, an error in the CUDA Runtime API called by the cuBLAS routine, or an error in the hardware setup. To correct: call cublasCreate() before the function call; and check that the hardware, an appropriate version of the driver, and the cuBLAS library are correctly installed.\nCUBLAS_STATUS_ALLOC_FAILED | Resource allocation failed inside the cuBLAS library. This is usually caused by a cudaMalloc() failure. To correct: prior to the function call, deallocate previously allocated memory as much as possible.\nCUBLAS_STATUS_INVALID_VALUE | An unsupported value or parameter was passed to the function (a negative vector size, for example). To correct: ensure that all the parameters being passed have valid values.\nCUBLAS_STATUS_ARCH_MISMATCH | The function requires a feature absent from the device architecture; usually caused by compute capability lower than 5.0. To correct: compile and run the application on a device with appropriate compute capability.", "source": "https://docs.nvidia.com/cuda/cublas/#cublasstatus-t", "tokens": ["cublasStatus_t", "cuBLAS", "CUBLAS_STATUS_SUCCESS", "CUBLAS_STATUS_NOT_INITIALIZED", "cublasCreate", "CUBLAS_STATUS_ALLOC_FAILED", "cudaMalloc", "CUBLAS_STATUS_INVALID_VALUE", "CUBLAS_STATUS_ARCH_MISMATCH"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasStatus_t」，归在「类型 / 状态码」。重点关注 关键词 cublasStatus_t、cuBLAS、CUBLAS_STATUS_SUCCESS、CUBLAS_STATUS_NOT_INITIALIZED、cublasCreate，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublasStatus_t」对应的官方条目，分类为「类型 / 状态码」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublasStatus_t、cuBLAS、CUBLAS_STATUS_SUCCESS、CUBLAS_STATUS_NOT_INITIALIZED、cublasCreate、CUBLAS_STATUS_ALLOC_FAILED、cudaMalloc、CUBLAS_STATUS_INVALID_VALUE。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasOperation_t", "titleZh": "cublasOperation_t", "numberedTitle": "2.2.3. cublasOperation_t", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Datatypes Reference", "parentZh": "cuBLAS Datatypes Reference", "kind": "Types / Status", "kindZh": "类型 / 状态码", "summary": "The cublasOperation_t type indicates which operation needs to be performed with the dense matrix. Its values correspond to Fortran characters ‘N’ or ‘n’ (non-transpose), ‘T’ or ‘t’ (transpose) and ‘C’ or ‘c’ (conjugate transpose) that are often used as parameters to...", "details": "The cublasOperation_t type indicates which operation needs to be performed with the dense matrix.\nIts values correspond to Fortran characters ‘N’ or ‘n’ (non-transpose), ‘T’ or ‘t’ (transpose) and ‘C’ or ‘c’ (conjugate transpose) that are often used as parameters to legacy BLAS implementations.\nValue | Meaning\nCUBLAS_OP_N | The non-transpose operation is selected.\nCUBLAS_OP_T | The transpose operation is selected.\nCUBLAS_OP_C | The conjugate transpose operation is selected.", "source": "https://docs.nvidia.com/cuda/cublas/#cublasoperation-t", "tokens": ["cublasOperation_t", "CUBLAS_OP_N", "CUBLAS_OP_T", "CUBLAS_OP_C"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasOperation_t」，归在「类型 / 状态码」。重点关注 关键词 cublasOperation_t、CUBLAS_OP_N、CUBLAS_OP_T、CUBLAS_OP_C，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublasOperation_t」对应的官方条目，分类为「类型 / 状态码」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublasOperation_t、CUBLAS_OP_N、CUBLAS_OP_T、CUBLAS_OP_C。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasFillMode_t", "titleZh": "cublasFillMode_t", "numberedTitle": "2.2.4. cublasFillMode_t", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Datatypes Reference", "parentZh": "cuBLAS Datatypes Reference", "kind": "Types / Status", "kindZh": "类型 / 状态码", "summary": "The type indicates which part (lower or upper) of the dense matrix was filled and consequently should be used by the function. Its values correspond to Fortran characters L or l (lower) and U or u (upper) that are often used as parameters to legacy BLAS implementations.", "details": "The type indicates which part (lower or upper) of the dense matrix was filled and consequently should be used by the function.\nIts values correspond to Fortran characters L or l (lower) and U or u (upper) that are often used as parameters to legacy BLAS implementations.\nValue | Meaning\nCUBLAS_FILL_MODE_LOWER | The lower part of the matrix is filled.\nCUBLAS_FILL_MODE_UPPER | The upper part of the matrix is filled.\nCUBLAS_FILL_MODE_FULL | The full matrix is filled.", "source": "https://docs.nvidia.com/cuda/cublas/#cublasfillmode-t", "tokens": ["cublasFillMode_t", "CUBLAS_FILL_MODE_LOWER", "CUBLAS_FILL_MODE_UPPER", "CUBLAS_FILL_MODE_FULL"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasFillMode_t」，归在「类型 / 状态码」。重点关注 关键词 cublasFillMode_t、CUBLAS_FILL_MODE_LOWER、CUBLAS_FILL_MODE_UPPER、CUBLAS_FILL_MODE_FULL，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublasFillMode_t」对应的官方条目，分类为「类型 / 状态码」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublasFillMode_t、CUBLAS_FILL_MODE_LOWER、CUBLAS_FILL_MODE_UPPER、CUBLAS_FILL_MODE_FULL。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasDiagType_t", "titleZh": "cublasDiagType_t", "numberedTitle": "2.2.5. cublasDiagType_t", "level": "H3", "chapter": "Using the cuBLAS API", "chapterZh": "使用 cuBLAS API", "parent": "cuBLAS Datatypes Reference", "parentZh": "cuBLAS Datatypes Reference", "kind": "Types / Status", "kindZh": "类型 / 状态码", "summary": "The type indicates whether the main diagonal of the dense matrix is unity and consequently should not be touched or modified by the function. Its values correspond to Fortran characters ‘N’ or ‘n’ (non-unit) and ‘U’ or ‘u’ (unit) that are often used as parameters to...", "details": "The type indicates whether the main diagonal of t
