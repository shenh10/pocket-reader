: "", "parentZh": "", "kind": "Instructions", "kindZh": "指令", "summary": "Operands from different state spaces affect the speed of an operation. Registers are fastest, while global memory is slowest. Much of the delay to memory can be hidden in a number of ways. The first is to have multiple threads of execution so that the hardware can...", "details": "Operands from different state spaces affect the speed of an operation.\nRegisters are fastest, while global memory is slowest.\nSpace | Time | Notes\nRegister | 0\nShared | 0\nConstant | 0 | Amortized cost is low, first access is high\nLocal | > 100 clocks\nParameter | 0", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#operand-costs", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「操作数成本」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「操作数成本」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Abstracting the ABI", "titleZh": "抽象 ABI", "numberedTitle": "7. Abstracting the ABI", "level": "H1", "chapter": "Instruction Operands", "chapterZh": "指令操作数", "parent": "", "parentZh": "", "kind": "Instructions", "kindZh": "指令", "summary": "Rather than expose details of a particular calling convention, stack layout, and Application Binary Interface (ABI), PTX provides a slightly higher-level abstraction and supports multiple ABI implementations. In this section, we describe the features of PTX needed to...", "details": "Rather than expose details of a particular calling convention, stack layout, and Application Binary Interface (ABI), PTX provides a slightly higher-level abstraction and supports multiple ABI implementations.\nIn this section, we describe the features of PTX needed to achieve this hiding of the ABI.\nRefer to PTX Writers Guide to Interoperability for details on generating PTX compliant with Application Binary Interface (ABI) for the CUDA ® architecture.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#abstracting-abi", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「抽象 ABI」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「抽象 ABI」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Function Declarations and Definitions", "titleZh": "函数 Declarations 与 Definitions", "numberedTitle": "7.1. Function Declarations and Definitions", "level": "H2", "chapter": "Abstracting the ABI", "chapterZh": "抽象 ABI", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "In PTX, functions are declared and defined using the .func directive. A function declaration specifies an optional list of return parameters, the function name, and an optional list of input parameters; together these specify the function’s interface, or prototype. A...", "details": "In PTX, functions are declared and defined using the .func directive.\nA function declaration specifies an optional list of return parameters, the function name, and an optional list of input parameters; together these specify the function’s interface, or prototype.\nThe simplest function has no parameters or return values, and is represented in PTX as follows:\nHere, execution of the call instruction transfers control to foo , implicitly saving the return address.\nExecution of the ret instruction within foo transfers control to the instruction following the call.\nScalar and vector base-type input and return parameters may be represented simply as register variables.\nAt the call, arguments may be register variables or constants, and return values may be placed directly into register variables.\nExample", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#function-declarations-and-definitions", "tokens": ["func"], "summaryZh": "本条整理 PTX ISA 官方文档中的「函数 Declarations 与 Definitions」，归在「指南章节」。重点关注 关键词 func，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「函数 Declarations 与 Definitions」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：func。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Changes from PTX ISA Version 1.x", "titleZh": "从 PTX ISA 1.x 开始的变更", "numberedTitle": "7.1.1. Changes from PTX ISA Version 1.x", "level": "H3", "chapter": "Abstracting the ABI", "chapterZh": "抽象 ABI", "parent": "Function Declarations and Definitions", "parentZh": "函数 Declarations 与 Definitions", "kind": "Guide", "kindZh": "指南章节", "summary": "In PTX ISA version 1.x, formal parameters were restricted to .reg state space, and there was no support for array parameters. Objects such as C structures were flattened and passed or returned using multiple registers. PTX ISA version 1.x supports multiple return...", "details": "In PTX ISA version 1.x, formal parameters were restricted to .reg state space, and there was no support for array parameters.\nObjects such as C structures were flattened and passed or returned using multiple registers.\nBeginning with PTX ISA version 2.0, formal parameters may be in either .reg or .param state space, and .param space parameters support arrays.\nFor targets sm_20 or higher, PTX restricts functions to a single return value, and a .param byte array should be used to return objects that do not fit into a register.\nPTX ISA versions prior to 3.0 permitted variables in .reg and .local state spaces to be defined at module scope.\nWhen compiling to use the ABI, PTX ISA version 3.0 and later disallows module-scoped .reg and .local variables and restricts their use to within function scope.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#changes-from-ptx-isa-version-1-x", "tokens": ["reg", "param", "sm_20", "local"], "summaryZh": "本条整理 PTX ISA 官方文档中的「从 PTX ISA 1.x 开始的变更」，归在「指南章节」。重点关注 关键词 reg、param、sm_20、local，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「从 PTX ISA 1.x 开始的变更」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：reg、param、sm_20、local。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Variadic Functions", "titleZh": "Variadic 函数", "numberedTitle": "7.2. Variadic Functions", "level": "H2", "chapter": "Abstracting the ABI", "chapterZh": "抽象 ABI", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "PTX version 6.0 supports passing unsized array parameter to a function which can be used to implement variadic functions.", "details": "PTX version 6.0 supports passing unsized array parameter to a function which can be used to implement variadic functions.\nRefer to Kernel and Function Directives: .func for details", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#variadic-functions", "tokens": ["func"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Variadic 函数」，归在「指南章节」。重点关注 关键词 func，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「Variadic 函数」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：func。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Alloca", "titleZh": "Alloca", "numberedTitle": "7.3. Alloca", "level": "H2", "chapter": "Abstracting the ABI", "chapterZh": "抽象 ABI", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "PTX provides alloca instruction for allocating storage at runtime on the per-thread local memory stack. The allocated stack memory can be accessed with ld.local and st.local instructions using the pointer returned by alloca .", "details": "PTX provides alloca instruction for allocating storage at runtime on the per-thread local memory stack.\nThe allocated stack memory can be accessed with ld.local and st.local instructions using the pointer returned by alloca .\nIn order to facilitate deallocation of memory allocated with alloca , PTX provides two additional instructions: stacksave which allows reading the value of stack pointer in a local variable, and stackrestore which can restore the stack pointer with the saved value.\nalloca , stacksave , and stackrestore instructions are described in Stack Manipulation Instructions .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#alloca", "tokens": ["ld.local", "st.local"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Alloca」，归在「指南章节」。重点关注 关键词 ld.local、st.local，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「Alloca」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：ld.local、st.local。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Memory Consistency Model", "titleZh": "内存一致性模型", "numberedTitle": "8. Memory Consistency Model", "level": "H1", "chapter": "Abstracting the ABI", "chapterZh": "抽象 ABI", "parent": "", "parentZh": "", "kind": "Memory Model", "kindZh": "内存模型", "summary": "In multi-threaded executions, the side-effects of memory operations performed by each thread become visible to other threads in a partial and non-identical order. This means that any two operations may appear to happen in no order, or in different orders, to different...", "details": "In multi-threaded executions, the side-effects of memory operations performed by each thread become visible to other threads in a partial and non-identical order.\nThis means that any two operations may appear to happen in no order, or in different orders, to different threads.\nIn the absence of any constraint, each read operation returns the value committed by some write operation to the same memory location, including the initial write to that memory location.\nThe memory consistency model effectively constrains the set of such candidate writes from which a read operation can return a value.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#memory-consistency-model", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「内存一致性模型」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「内存一致性模型」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Scope and applicability of the model", "titleZh": "模型的 scope 与适用范围", "numberedTitle": "8.1. Scope and applicability of the model", "level": "H2", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "", "parentZh": "", "kind": "Memory Model", "kindZh": "内存模型", "summary": "The constraints specified under this model apply to PTX programs with any PTX ISA version number, running on sm_70 or later architectures.", "details": "The constraints specified under this model apply to PTX programs with any PTX ISA version number, running on sm_70 or later architectures.\nThe memory consistency model does not apply to texture (including ld.global.nc ) and surface accesses.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#scope-and-applicability", "tokens": ["sm_70", "ld.global.nc"], "summaryZh": "本条整理 PTX ISA 官方文档中的「模型的 scope 与适用范围」，归在「内存模型」。重点关注 关键词 sm_70、ld.global.nc，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「模型的 scope 与适用范围」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n相关 API / 关键词：sm_70、ld.global.nc。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Limitations on atomicity at system scope", "titleZh": "system scope 原子性的限制", "numberedTitle": "8.1.1. Limitations on atomicity at system scope", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Scope and applicability of the model", "parentZh": "模型的 scope 与适用范围", "kind": "Memory Model", "kindZh": "内存模型", "summary": "When communicating with the host CPU, certain strong operations with system scope may not be performed atomically on some systems. For more details on atomicity guarantees to host memory, see the CUDA Atomicity Requirements .", "details": "When communicating with the host CPU, certain strong operations with system scope may not be performed atomically on some systems.\nFor more details on atomicity guarantees to host memory, see the CUDA Atomicity Requirements .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#limitations-system-scope-atomicity", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「system scope 原子性的限制」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「system scope 原子性的限制」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Memory operations", "titleZh": "Memory 操作", "numberedTitle": "8.2. Memory operations", "level": "H2", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "", "parentZh": "", "kind": "Memory Model", "kindZh": "内存模型", "summary": "The fundamental storage unit in the PTX memory model is a byte, consisting of 8 bits. Each state space available to a PTX program is a sequence of contiguous bytes in memory. Every byte in a PTX state space has a unique address relative to all threads that have access...", "details": "The fundamental storage unit in the PTX memory model is a byte, consisting of 8 bits.\nEach state space available to a PTX program is a sequence of contiguous bytes in memory.\nEach PTX memory instruction specifies an address operand and a data type.\nThe address operand contains a virtual address that gets converted to a physical address during memory access.\nThe memory consistency model specification uses the terms “address” or “memory address” to indicate a virtual address, and the term “memory location” to indicate a physical memory location.\nEach PTX memory instruction also specifies the operation — either a read, a write or an atomic read-modify-write — to be performed on all the bytes in the corresponding memory location.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#memory-operations", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Memory 操作」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「Memory 操作」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Overlap", "titleZh": "重叠访问", "numberedTitle": "8.2.1. Overlap", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Memory operations", "parentZh": "Memory 操作", "kind": "Memory Model", "kindZh": "内存模型", "summary": "Two memory locations are said to overlap when the starting address of one location is within the range of bytes constituting the other location. Two memory operations are said to overlap when the range of virtual addresses accessed by the two operations intersect. The...", "details": "Two memory locations are said to overlap when the starting address of one location is within the range of bytes constituting the other location.\nTwo memory operations are said to overlap when the range of virtual addresses accessed by the two operations intersect.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#overlap", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「重叠访问」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「重叠访问」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Aliases", "titleZh": "Alias", "numberedTitle": "8.2.2. Aliases", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Memory operations", "parentZh": "Memory 操作", "kind": "Memory Model", "kindZh": "内存模型", "summary": "Two distinct virtual addresses are said to be aliases if they map to the same memory location.", "details": "Two distinct virtual addresses are said to be aliases if they map to the same memory location.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#aliases", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Alias」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「Alias」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Multimem Addresses", "titleZh": "Multimem 地址", "numberedTitle": "8.2.3. Multimem Addresses", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Memory operations", "parentZh": "Memory 操作", "kind": "Memory Model", "kindZh": "内存模型", "summary": "A multimem address is a virtual address which points to multiple distinct memory locations across devices.", "details": "A multimem address is a virtual address which points to multiple distinct memory locations across devices.\nOnly multimem. * operations are valid on multimem addresses.\nThat is, the behavior of accessing a multimem address in any other memory operation is undefined.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#multimem-addresses", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Multimem 地址」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「Multimem 地址」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Memory Operations on Vector Data Types", "titleZh": "Memory 操作 on Vector 数据类型", "numberedTitle": "8.2.4. Memory Operations on Vector Data Types", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Memory operations", "parentZh": "Memory 操作", "kind": "Memory Model", "kindZh": "内存模型", "summary": "The memory consistency model relates operations executed on memory locations with scalar data types, which have a maximum size and alignment of 64 bits. Memory operations with a vector data type are modelled as a set of equivalent memory operations with a scalar data...", "details": "The memory consistency model relates operations executed on memory locations with scalar data types, which have a maximum size and alignment of 64 bits.\nMemory operations with a vector data type are modelled as a set of equivalent memory operations with a scalar data type, executed in an unspecified order on the elements in the vector.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#memory-operations-on-vector-data-types", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Memory 操作 on Vector 数据类型」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「Memory 操作 on Vector 数据类型」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Memory Operations on Packed Data Types", "titleZh": "Memory 操作 on Packed 数据类型", "numberedTitle": "8.2.5. Memory Operations on Packed Data Types", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Memory operations", "parentZh": "Memory 操作", "kind": "Memory Model", "kindZh": "内存模型", "summary": "A packed data type consists of two values of the same scalar data type, as described in Packed Data Types . These values are accessed in adjacent memory locations. A memory operation on a packed data type is modelled as a pair of equivalent memory operations on the...", "details": "A packed data type consists of two values of the same scalar data type, as described in Packed Data Types .\nThese values are accessed in adjacent memory locations.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#memory-operations-on-packed-data-types", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Memory 操作 on Packed 数据类型」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「Memory 操作 on Packed 数据类型」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Initialization", "titleZh": "初始化", "numberedTitle": "8.2.6. Initialization", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Memory operations", "parentZh": "Memory 操作", "kind": "Memory Model", "kindZh": "内存模型", "summary": "Each byte in memory is initialized by a hypothetical write W0 executed before starting any thread in the program. If the byte is included in a program variable, and that variable has an initial value, then W0 writes the corresponding initial value for that byte; else...", "details": "Each byte in memory is initialized by a hypothetical write W0 executed before starting any thread in the program.\nIf the byte is included in a program variable, and that variable has an initial value, then W0 writes the corresponding initial value for that byte; else W0 is assumed to have written an unknown but constant value to the byte.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#initialization", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「初始化」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「初始化」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "State spaces", "titleZh": "状态空间", "numberedTitle": "8.3. State spaces", "level": "H2", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "", "parentZh": "", "kind": "Memory Model", "kindZh": "内存模型", "summary": "The relations defined in the memory consistency model are independent of state spaces. In particular, causality order closes over all memory operations across all the state spaces. But the side-effect of a memory operation in one state space can be observed directly...", "details": "The relations defined in the memory consistency model are independent of state spaces.\nIn particular, causality order closes over all memory operations across all the state spaces.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#memory-consistency-state-spaces", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「状态空间」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「状态空间」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Operation types", "titleZh": "操作类型", "numberedTitle": "8.4. Operation types", "level": "H2", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "", "parentZh": "", "kind": "Memory Model", "kindZh": "内存模型", "summary": "For simplicity, the rest of the document refers to the following operation types, instead of mentioning specific instructions that give rise to them.", "details": "For simplicity, the rest of the document refers to the following operation types, instead of mentioning specific instructions that give rise to them.\nOperation Type | Instruction/Operation\natomic operation | atom or red instruction.\nread operation | All variants of ld instruction and atom instruction (but not red instruction).\nwrite operation | All variants of st instruction, and atomic operations if they result in a write.\nmemory operation | A read or write operation.\nvolatile operation | An instruction with .volatile qualifier.\nacquire operation | A memory operation with .acquire or .acq_rel qualifier.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#operation-types", "tokens": ["volatile", "acquire", "acq_rel"], "summaryZh": "本条整理 PTX ISA 官方文档中的「操作类型」，归在「内存模型」。重点关注 关键词 volatile、acquire、acq_rel，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「操作类型」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n相关 API / 关键词：volatile、acquire、acq_rel。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "mmio Operation", "titleZh": "mmio 操作", "numberedTitle": "8.4.1. mmio Operation", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Operation types", "parentZh": "操作类型", "kind": "Memory Model", "kindZh": "内存模型", "summary": "An mmio operation is a memory operation with .mmio qualifier specified. It is usually performed on a memory location which is mapped to the control registers of peer I/O devices. It can also be used for communication between threads but has poor performance relative to...", "details": "An mmio operation is a memory operation with .mmio qualifier specified.\nIt is usually performed on a memory location which is mapped to the control registers of peer I/O devices.\nThe semantic meaning of mmio operations cannot be defined precisely as it is defined by the underlying I/O device.\nFor formal specification of semantics of mmio operation from Memory Consistency Model perspective, it is equivalent to the semantics of a strong operation.\nWrites are always performed and are never combined within the scope specified.\nReads are always performed, and are not forwarded, prefetched, combined, or allowed to hit any cache within the scope specified. As an exception, in some implementations, the surrounding locations may also be loaded. In such cases the amount of data loaded is implementation specific and varies between 32 and 128 bytes in size.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#mmio-operation", "tokens": ["mmio"], "summaryZh": "本条整理 PTX ISA 官方文档中的「mmio 操作」，归在「内存模型」。重点关注 关键词 mmio，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「mmio 操作」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n相关 API / 关键词：mmio。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "volatile Operation", "titleZh": "volatile 操作", "numberedTitle": "8.4.2. volatile Operation", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Operation types", "parentZh": "操作类型", "kind": "Memory Model", "kindZh": "内存模型", "summary": "A volatile operation is a memory operation with .volatile qualifier specified. The semantics of volatile operations are equivalent to a relaxed memory operation with system-scope but with the following extra implementation-specific constraints:", "details": "A volatile operation is a memory operation with .volatile qualifier specified.\nThe semantics of volatile operations are equivalent to a relaxed memory operation with system-scope but with the following extra implementation-specific constraints:\nThe number of volatile instructions (not operations) executed by a program is preserved. Hardware may combine and merge volatile operations issued by multiple different volatile instructions , that is, the number of volatile operations in the program is not preserved.\nVolatile instructions are not re-ordered around other volatile instructions , but the memory operations performed by those instructions may be re-ordered around each other.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#volatile-operation", "tokens": ["volatile"], "summaryZh": "本条整理 PTX ISA 官方文档中的「volatile 操作」，归在「内存模型」。重点关注 关键词 volatile，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「volatile 操作」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n相关 API / 关键词：volatile。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Scope", "titleZh": "Scope", "numberedTitle": "8.5. Scope", "level": "H2", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "", "parentZh": "", "kind": "Memory Model", "kindZh": "内存模型", "summary": "Each strong operation must specify a scope , which is the set of threads that may interact directly with that operation and establish any of the relations described in the memory consistency model. There are four scopes:", "details": "Each strong operation must specify a scope , which is the set of threads that may interact directly with that operation and establish any of the relations described in the memory consistency model.\nThere are four scopes:\nScope | Description\n.cta | The set of all threads executing in the same CTA as the current thread.\n.cluster | The set of all threads executing in the same cluster as the current thread.\n.gpu | The set of all threads in the current program executing on the same compute device as the current thread. This also includes other kernel grids invoked by the host program on the same compute device.\n.sys | The set of all threads in the current program, including all kernel grids invoked by the host program on all compute devices, and all threads constituting the host program itself.\nNote that the warp is not a scope ; the CTA is the smallest collection of threads that qualifies as a scope in the memory consistency model.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#scope", "tokens": ["cta", "cluster", "gpu", "sys", "warp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Scope」，归在「内存模型」。重点关注 关键词 cta、cluster、gpu、sys、warp，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「Scope」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n相关 API / 关键词：cta、cluster、gpu、sys、warp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Proxies", "titleZh": "Proxy", "numberedTitle": "8.6. Proxies", "level": "H2", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "", "parentZh": "", "kind": "Memory Model", "kindZh": "内存模型", "summary": "A memory proxy , or a proxy is an abstract label applied to a method of memory access. When two memory operations use distinct methods of memory access, they are said to be different proxies .", "details": "A memory proxy , or a proxy is an abstract label applied to a method of memory access.\nWhen two memory operations use distinct methods of memory access, they are said to be different proxies .\nA proxy fence is required to synchronize memory operations across different proxies .\nAlthough virtual aliases use the generic method of memory access, since using distinct virtual addresses behaves as if using different proxies , they require a proxy fence to establish memory ordering.\nUnless otherwise specified, memory operations as defined in Operation types use generic method of memory access, i.e. a generic proxy .\nOperations using methods of access distinct from the generic method include:\ntextures and surface accesses,\naccesses to the same location via the same proxy using distinct virtual memory addresses,", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#proxies", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Proxy」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「Proxy」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Strong Proxy Accesses", "titleZh": "Strong proxy 访问", "numberedTitle": "8.6.1. Strong Proxy Accesses", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Proxies", "parentZh": "Proxy", "kind": "Memory Model", "kindZh": "内存模型", "summary": "Strong modifications through", "details": "Strong modifications through\ngeneric-proxy,\nasync-proxy,\ntensormap-proxy,\nfabric-proxy,\neventually become observable by strong accesses to the same location performed via a different proxy in that list, if modification and access are:\nsystem-scope - even if these used distinct memory addresses - or\ngpu-scope if the different proxies involved are in the following list: async-proxy, generic-proxy.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#strong-proxy-accesses", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Strong proxy 访问」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「Strong proxy 访问」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Morally strong operations", "titleZh": "Morally strong 操作", "numberedTitle": "8.7. Morally strong operations", "level": "H2", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "", "parentZh": "", "kind": "Memory Model", "kindZh": "内存模型", "summary": "Two operations are said to be morally strong relative to each other if they satisfy all of the following conditions:", "details": "Two operations are said to be morally strong relative to each other if they satisfy all of the following conditions:\nThe operations are related in program order (i.e, they are both executed by the same thread), or each operation is strong and specifies a scope that includes the thread executing the other operation.\nBoth operations are performed via the same proxy .\nIf both are memory operations, then they overlap completely.\nMost (but not all) of the axioms in the memory consistency model depend on relations between morally strong operations.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#morally-strong-operations", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Morally strong 操作」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「Morally strong 操作」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Conflict and Data-races", "titleZh": "冲突与数据竞争", "numberedTitle": "8.7.1. Conflict and Data-races", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Morally strong operations", "parentZh": "Morally strong 操作", "kind": "Memory Model", "kindZh": "内存模型", "summary": "Two overlapping memory operations are said to conflict when at least one of them is a write .", "details": "Two overlapping memory operations are said to conflict when at least one of them is a write .\nTwo conflicting memory operations are said to be in a data-race if they are not related in causality order and they are not morally strong .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#conflict-and-data-races", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「冲突与数据竞争」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「冲突与数据竞争」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Limitations on Mixed-size Data-races", "titleZh": "mixed-size 数据竞争限制", "numberedTitle": "8.7.2. Limitations on Mixed-size Data-races", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Morally strong operations", "parentZh": "Morally strong 操作", "kind": "Memory Model", "kindZh": "内存模型", "summary": "A data-race between operations that overlap completely is called a uniform-size data-race , while a data-race between operations that overlap partially is called a mixed-size data-race .", "details": "A data-race between operations that overlap completely is called a uniform-size data-race , while a data-race between operations that overlap partially is called a mixed-size data-race .\nThe axioms in the memory consistency model do not apply if a PTX program contains one or more mixed-size data-races .\nBut these axioms are sufficient to describe the behavior of a PTX program with only uniform-size data-races .\nAtomicity of mixed-size RMW operations\nIn any program with or without mixed-size data-races , the following property holds for every pair of overlapping atomic operations A1 and A2 such that each specifies a scope that includes the other: Either the read-modify-write operation specified by A1 is performed completely before A2 is initiated, or vice versa.\nThis property holds irrespective of whether the two operations A1 and A2 overlap partially or completely.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#mixed-size-limitations", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「mixed-size 数据竞争限制」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「mixed-size 数据竞争限制」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Release and Acquire Patterns", "titleZh": "Release / Acquire 模式", "numberedTitle": "8.8. Release and Acquire Patterns", "level": "H2", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "", "parentZh": "", "kind": "Memory Model", "kindZh": "内存模型", "summary": "Some sequences of instructions give rise to patterns that participate in memory synchronization as described later. The release pattern makes prior operations from the current thread 1 visible to some operations from other threads. The acquire pattern makes some...", "details": "Some sequences of instructions give rise to patterns that participate in memory synchronization as described later.\nThe release pattern makes prior operations from the current thread 1 visible to some operations from other threads.\nA release pattern on a location M consists of one of the following:\nA release operation on M E.g.: st.release [M]; or atom.release [M]; or mbarrier.arrive.release [M];\nOr a release or acquire-release operation on M followed by a strong write on M in program order E.g.: st.release [M] ; st.relaxed [M];\nOr a release or acquire-release memory fence followed by a strong write on M in program order E.g.: fence.release; st.relaxed [M]; or fence.release; atom.relaxed [M];\nOr a release or acquire-release memory fence followed in program order by an asynchronous operation that performs a strong write on M E.g.: fence.release; cp.async.bulk.global.shared.relaxed.sys.b128 [M];\nOr a release asynchronous operation that performs a strong write on M E.g.: st.async.release.sys [M];", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#release-acquire-patterns", "tokens": ["st.release", "atom.release", "mbarrier.arrive.release", "st.relaxed", "fence.release", "atom.relaxed", "cp.async.bulk.global.shared.relaxed.sys.b128", "st.async.release.sys"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Release / Acquire 模式」，归在「内存模型」。重点关注 关键词 st.release、atom.release、mbarrier.arrive.release、st.relaxed、fence.release，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「Release / Acquire 模式」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n相关 API / 关键词：st.release、atom.release、mbarrier.arrive.release、st.relaxed、fence.release、atom.relaxed、cp.async.bulk.global.shared.relaxed.sys.b128、st.async.release.sys。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Ordering of memory operations", "titleZh": "排序 of memory 操作", "numberedTitle": "8.9. Ordering of memory operations", "level": "H2", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "", "parentZh": "", "kind": "Memory Model", "kindZh": "内存模型", "summary": "The sequence of operations performed by each thread is captured as program order while memory synchronization across threads is captured as causality order . The visibility of the side-effects of memory operations to other memory operations is captured as communication...", "details": "The sequence of operations performed by each thread is captured as program order while memory synchronization across threads is captured as causality order .\nThe visibility of the side-effects of memory operations to other memory operations is captured as communication order .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#ordering-memory-operations", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「排序 of memory 操作」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「排序 of memory 操作」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Program Order", "titleZh": "Program order", "numberedTitle": "8.9.1. Program Order", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Ordering of memory operations", "parentZh": "排序 of memory 操作", "kind": "Memory Model", "kindZh": "内存模型", "summary": "The program order relates all operations performed by a thread to the order in which a sequential processor will execute instructions in the corresponding PTX source. It is a transitive relation that forms a total order over the operations performed by the thread, but...", "details": "The program order relates all operations performed by a thread to the order in which a sequential processor will execute instructions in the corresponding PTX source.\nIt is a transitive relation that forms a total order over the operations performed by the thread, but does not relate operations from different threads.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#program-order", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Program order」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「Program order」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Asynchronous Operations", "titleZh": "异步操作", "numberedTitle": "8.9.1.1. Asynchronous Operations", "level": "H4", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Program Order", "parentZh": "Program order", "kind": "Memory Model", "kindZh": "内存模型", "summary": "Some PTX instructions (all variants of cp.async , cp.async.bulk , cp.reduce.async.bulk , wgmma.mma_async ) perform operations that are asynchronous to the thread that executed the instruction. These asynchronous operations are ordered after prior instructions in the...", "details": "Some PTX instructions (all variants of cp.async , cp.async.bulk , cp.reduce.async.bulk , wgmma.mma_async ) perform operations that are asynchronous to the thread that executed the instruction.\nThese asynchronous operations are ordered after prior instructions in the same thread (except in the case of wgmma.mma_async ), but they are not part of the program order for that thread.\nFor example, the loads and stores performed as part of a cp.async are ordered with respect to each other, but not to those of any other cp.async instructions initiated by the same thread, nor any other instruction subsequently issued by the thread with the exception of cp.async.commit_group or cp.async.mbarrier.arrive .\nThe asynchronous mbarrier arrive-on operation performed by a cp.async.mbarrier.arrive instruction is ordered with respect to the memory operations performed by all prior cp.async operations initiated by the same thread, but not to those of any other instruction issued by the thread.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#program-order-async-operations", "tokens": ["cp.async", "cp.async.bulk", "cp.reduce.async.bulk", "wgmma.mma", "cp.async.commit", "cp.async.mbarrier.arrive"], "summaryZh": "本条整理 PTX ISA 官方文档中的「异步操作」，归在「内存模型」。重点关注 关键词 cp.async、cp.async.bulk、cp.reduce.async.bulk、wgmma.mma、cp.async.commit，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「异步操作」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n相关 API / 关键词：cp.async、cp.async.bulk、cp.reduce.async.bulk、wgmma.mma、cp.async.commit、cp.async.mbarrier.arrive。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Observation Order", "titleZh": "Observation order", "numberedTitle": "8.9.2. Observation Order", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Ordering of memory operations", "parentZh": "排序 of memory 操作", "kind": "Memory Model", "kindZh": "内存模型", "summary": "Observation order relates a write W to a read R through an optional sequence of atomic read-modify-write operations.", "details": "Observation order relates a write W to a read R through an optional sequence of atomic read-modify-write operations.\nA write W precedes a read R in observation order if:\nR and W are morally strong and R reads the value written by W, or\nFor some atomic operation Z, W precedes Z and Z precedes R in observation order .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#observation-order", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Observation order」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「Observation order」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Fence-SC Order", "titleZh": "Fence-SC order", "numberedTitle": "8.9.3. Fence-SC Order", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Ordering of memory operations", "parentZh": "排序 of memory 操作", "kind": "Memory Model", "kindZh": "内存模型", "summary": "The Fence-SC order is an acyclic partial order, determined at runtime, that relates every pair of morally strong fence.sc operations.", "details": "The Fence-SC order is an acyclic partial order, determined at runtime, that relates every pair of morally strong fence.sc operations.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fence-sc-order", "tokens": ["fence.sc"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Fence-SC order」，归在「内存模型」。重点关注 关键词 fence.sc，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「Fence-SC order」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n相关 API / 关键词：fence.sc。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Memory synchronization", "titleZh": "内存同步", "numberedTitle": "8.9.4. Memory synchronization", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Ordering of memory operations", "parentZh": "排序 of memory 操作", "kind": "Memory Model", "kindZh": "内存模型", "summary": "Synchronizing operations performed by different threads synchronize with each other at runtime as described here. The effect of such synchronization is to establish causality order across threads.", "details": "Synchronizing operations performed by different threads synchronize with each other at runtime as described here.\nThe effect of such synchronization is to establish causality order across threads.\nA fence.sc operation X synchronizes with a fence.sc operation Y if X precedes Y in the Fence-SC order.\nA bar{.cta}.sync or bar{.cta}.red or bar{.cta}.arrive operation synchronizes with a bar{.cta}.sync or bar{.cta}.red operation executed on the same barrier.\nA barrier.cluster.arrive operation synchronizes with a barrier.cluster.wait operation.\nA release pattern X synchronizes with an acquire pattern Y, if a write operation in X precedes a read operation in Y in observation order , and the first operation in X and the last operation in Y are morally strong .\nAPI synchronization\nA synchronizes relation can also be established by certain CUDA APIs.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#memory-synchronization", "tokens": ["fence.sc", "cta", "sync", "red", "arrive", "barrier.cluster.arrive", "barrier.cluster.wait"], "summaryZh": "本条整理 PTX ISA 官方文档中的「内存同步」，归在「内存模型」。重点关注 关键词 fence.sc、cta、sync、red、arrive，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「内存同步」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n相关 API / 关键词：fence.sc、cta、sync、red、arrive、barrier.cluster.arrive、barrier.cluster.wait。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Causality Order", "titleZh": "Causality order", "numberedTitle": "8.9.5. Causality Order", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Ordering of memory operations", "parentZh": "排序 of memory 操作", "kind": "Memory Model", "kindZh": "内存模型", "summary": "Causality order captures how memory operations become visible across threads through synchronizing operations. The axiom “Causality” uses this order to constrain the set of write operations from which a read operation may read a value.", "details": "Causality order captures how memory operations become visible across threads through synchronizing operations.\nThe axiom “Causality” uses this order to constrain the set of write operations from which a read operation may read a value.\nRelations in the causality order primarily consist of relations in Base causality order 1 , which is a transitive order, determined at runtime.\nBase causality order\nAn operation X precedes an operation Y in base causality order if:\nX precedes Y in program order , or\nX synchronizes with Y, or\nFor some operation Z, X precedes Z in program order and Z precedes Y in base causality order , or X precedes Z in base causality order and Z precedes Y in program order , or X precedes Z in base causality order and Z precedes Y in base causality order .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#causality-order", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Causality order」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「Causality order」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Coherence Order", "titleZh": "Coherence order", "numberedTitle": "8.9.6. Coherence Order", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Ordering of memory operations", "parentZh": "排序 of memory 操作", "kind": "Memory Model", "kindZh": "内存模型", "summary": "There exists a partial transitive order that relates overlapping write operations, determined at runtime, called the coherence order 1 . Two overlapping write operations are related in coherence order if they are morally strong or if they are related in causality order...", "details": "There exists a partial transitive order that relates overlapping write operations, determined at runtime, called the coherence order 1 .\nTwo overlapping write operations are related in coherence order if they are morally strong or if they are related in causality order .\n1 Coherence order cannot be observed directly since it consists entirely of write operations.\nIt may be observed indirectly by its use in constraining the set of candidate writes that a read operation may read from.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#coherence-order", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Coherence order」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「Coherence order」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Communication Order", "titleZh": "通信 Order", "numberedTitle": "8.9.7. Communication Order", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Ordering of memory operations", "parentZh": "排序 of memory 操作", "kind": "Memory Model", "kindZh": "内存模型", "summary": "The communication order is a non-transitive order, determined at runtime, that relates write operations to other overlapping memory operations.", "details": "The communication order is a non-transitive order, determined at runtime, that relates write operations to other overlapping memory operations.\nA write W precedes an overlapping read R in communication order if R returns the value of any byte that was written by W.\nA write W precedes a write W’ in communication order if W precedes W’ in coherence order .\nA read R precedes an overlapping write W in communication order if, for any byte accessed by both R and W, R returns the value written by a write W’ that precedes W in coherence order .\nCommunication order captures the visibility of memory operations — when a memory operation X1 precedes a memory operation X2 in communication order , X1 is said to be visible to X2.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#communication-order", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「通信 Order」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「通信 Order」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Axioms", "titleZh": "公理", "numberedTitle": "8.10. Axioms", "level": "H2", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "", "parentZh": "", "kind": "Memory Model", "kindZh": "内存模型", "summary": "PTX ISA 文档章节：Axioms", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#axioms", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「公理」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「公理」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。"}, {"title": "Coherence", "titleZh": "一致性", "numberedTitle": "8.10.1. Coherence", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Axioms", "parentZh": "公理", "kind": "Memory Model", "kindZh": "内存模型", "summary": "If a write W precedes an overlapping write W’ in causality order , then W must precede W’ in coherence order .", "details": "If a write W precedes an overlapping write W’ in causality order , then W must precede W’ in coherence order .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#coherence-axiom", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「一致性」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「一致性」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Fence-SC", "titleZh": "Fence-SC", "numberedTitle": "8.10.2. Fence-SC", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Axioms", "parentZh": "公理", "kind": "Memory Model", "kindZh": "内存模型", "summary": "Fence-SC order cannot contradict causality order . For a pair of morally strong fence.sc operations F1 and F2, if F1 precedes F2 in causality order , then F1 must precede F2 in Fence-SC order.", "details": "Fence-SC order cannot contradict causality order .\nFor a pair of morally strong fence.sc operations F1 and F2, if F1 precedes F2 in causality order , then F1 must precede F2 in Fence-SC order.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#fence-sc-axiom", "tokens": ["fence.sc"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Fence-SC」，归在「内存模型」。重点关注 关键词 fence.sc，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「Fence-SC」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n相关 API / 关键词：fence.sc。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Atomicity", "titleZh": "原子性", "numberedTitle": "8.10.3. Atomicity", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Axioms", "parentZh": "公理", "kind": "Memory Model", "kindZh": "内存模型", "summary": "Single-Copy Atomicity", "details": "Single-Copy Atomicity\nConflicting morally strong operations are performed with single-copy atomicity .\nWhen a read R and a write W are morally strong , then the following two communications cannot both exist in the same execution, for the set of bytes accessed by both R and W:\nR reads any byte from W.\nR reads any byte from any write W’ which precedes W in coherence order .\nAtomicity of read-modify-write (RMW) operations\nWhen an atomic operation A and a write W overlap and are morally strong , then the following two communications cannot both exist in the same execution, for the set of bytes accessed by both A and W:\nA reads any byte from a write W’ that precedes W in coherence order .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#atomicity-axiom", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「原子性」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「原子性」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "No Thin Air", "titleZh": "No-thin-air", "numberedTitle": "8.10.4. No Thin Air", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Axioms", "parentZh": "公理", "kind": "Memory Model", "kindZh": "内存模型", "summary": "Values may not appear “out of thin air”: an execution cannot speculatively produce a value in such a way that the speculation becomes self-satisfying through chains of instruction dependencies and inter-thread communication. This matches both programmer intuition and...", "details": "Values may not appear “out of thin air”: an execution cannot speculatively produce a value in such a way that the speculation becomes self-satisfying through chains of instruction dependencies and inter-thread communication.\nThis matches both programmer intuition and hardware reality, but is necessary to state explicitly when performing formal analysis.\nLitmus Test: Load Buffering with true dependencies\n. global . u32 x = 0 ; . global . u32 y = 0 ;\nT1 | T2\nA1 : ld . global . u32 % r0 , [ x ]; B1 : st . global . u32 [ y ], % r0 ; | A2 : ld . global . u32 % r1 , [ y ]; B2 : st . global . u32 [ x ], % r1 ;\nFINAL STATE : x == 0 AND y == 0\nThe litmus test known as “LB+deps” (Load Buffering with dependencies) checks such forbidden values that may arise out of thin air.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#no-thin-air-axiom", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「No-thin-air」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「No-thin-air」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Sequential Consistency Per Location", "titleZh": "Sequential 一致性 Per Location", "numberedTitle": "8.10.5. Sequential Consistency Per Location", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Axioms", "parentZh": "公理", "kind": "Memory Model", "kindZh": "内存模型", "summary": "Within any set of overlapping memory operations that are pairwise morally strong , communication order cannot contradict program order , i.e., a concatenation of program order between overlapping operations and morally strong relations in communication order cannot...", "details": "Within any set of overlapping memory operations that are pairwise morally strong , communication order cannot contradict program order , i.e., a concatenation of program order between overlapping operations and morally strong relations in communication order cannot result in a cycle.\nThis ensures that each program slice of overlapping pairwise morally strong operations is strictly sequentially-consistent .\nLitmus Test: CoRR\n. global . u32 x = 0 ;\nT1 | T2\nW1 : st . global . relaxed . sys . u32 [ x ], 1 ; | R1 : ld . global . relaxed . sys . u32 % r0 , [ x ]; R2 : ld . global . relaxed . sys . u32 % r1 , [ x ];\nIF % r0 == 1 THEN % r1 == 1\nThe litmus test “CoRR” (Coherent Read-Read), demonstrates one consequence of this guarantee.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#sc-per-loc-axiom", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Sequential 一致性 Per Location」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「Sequential 一致性 Per Location」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Causality", "titleZh": "因果性", "numberedTitle": "8.10.6. Causality", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Axioms", "parentZh": "公理", "kind": "Memory Model", "kindZh": "内存模型", "summary": "Relations in communication order cannot contradict causality order . This constrains the set of candidate write operations that a read operation may read from:", "details": "Relations in communication order cannot contradict causality order .\nThis constrains the set of candidate write operations that a read operation may read from:\nIf a read R precedes an overlapping write W in causality order , then R cannot read from W.\nIf a write W precedes an overlapping read R in causality order , then for any byte accessed by both R and W, R cannot read from any write W’ that precedes W in coherence order .\nLitmus Test: Message Passing\n. global . u32 data = 0 ; . global . u32 flag = 0 ;\nT1 | T2\nW1 : st . global . u32 [ data ], 1 ; F1 : fence . sys ; W2 : st . global . relaxed . sys . u32 [ flag ], 1 ; | R1 : ld . global . relaxed . sys . u32 % r0 , [ flag ]; F2 : fence . sys ; R2 : ld . global . u32 % r1 , [ data ];", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#causality-axiom", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「因果性」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「因果性」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Special Cases", "titleZh": "特殊情况", "numberedTitle": "8.11. Special Cases", "level": "H2", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "", "parentZh": "", "kind": "Memory Model", "kindZh": "内存模型", "summary": "PTX ISA 文档章节：Special Cases", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#special-cases", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「特殊情况」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「特殊情况」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。"}, {"title": "Reductions do not form Acquire Patterns", "titleZh": "Reduction 不形成 Acquire 模式", "numberedTitle": "8.11.1. Reductions do not form Acquire Patterns", "level": "H3", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "Special Cases", "parentZh": "特殊情况", "kind": "Memory Model", "kindZh": "内存模型", "summary": "Atomic reduction operations like red do not form acquire patterns with acquire fences.", "details": "Atomic reduction operations like red do not form acquire patterns with acquire fences.\nLitmus Test: Message Passing with a Red Instruction\n. global . u32 x = 0 ; . global . u32 flag = 0 ;\nT1 | T2\nW1 : st . u32 [ x ], 42 ; W2 : st . release . gpu . u32 [ flag ], 1 ; | RMW1 : red . sys . global . add . u32 [ flag ], 1 ; F2 : fence . acquire . gpu ; R2 : ld . weak . u32 % r1 , [ x ];\n% r1 == 0 AND flag == 2\nThe litmus test known as “MP” (Message Passing) demonstrates the consequence of reductions being excluded from acquire patterns.\nIt is possible to observe the outcome where R2 reads the value 0 from x and flag has the final value of 2 .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#red-read", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Reduction 不形成 Acquire 模式」，归在「内存模型」。重点关注 内存模型，适合用于理解 scope、proxy、fence、atomic 与内存一致性。", "detailsZh": "中文提要：这是「Reduction 不形成 Acquire 模式」对应的官方条目，分类为「内存模型」。\n阅读重点：理解 scope、proxy、fence、atomic 与内存一致性。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Instruction Set", "titleZh": "指令集", "numberedTitle": "9. Instruction Set", "level": "H1", "chapter": "Memory Consistency Model", "chapterZh": "内存一致性模型", "parent": "", "parentZh": "", "kind": "Instructions", "kindZh": "指令", "summary": "PTX ISA 文档章节：Instruction Set", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#instruction-set", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「指令集」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「指令集」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。"}, {"title": "Format and Semantics of Instruction Descriptions", "titleZh": "指令描述格式与语义", "numberedTitle": "9.1. Format and Semantics of Instruction Descriptions", "level": "H2", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "", "parentZh": "", "kind": "Instructions", "kindZh": "指令", "summary": "This section describes each PTX instruction. In addition to the name and the format of the instruction, the semantics are described, followed by some examples that attempt to show several possible instantiations of the instruction.", "details": "This section describes each PTX instruction.\nIn addition to the name and the format of the instruction, the semantics are described, followed by some examples that attempt to show several possible instantiations of the instruction.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#format-and-semantics-of-instruction-descriptions", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「指令描述格式与语义」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「指令描述格式与语义」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "PTX Instructions", "titleZh": "PTX 指令", "numberedTitle": "9.2. PTX Instructions", "level": "H2", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "", "parentZh": "", "kind": "Instructions", "kindZh": "指令", "summary": "PTX instructions generally have from zero to four operands, plus an optional guard predicate appearing after an @ symbol to the left of the opcode :", "details": "PTX instructions generally have from zero to four operands, plus an optional guard predicate appearing after an @ symbol to the left of the opcode :\n@p opcode;\n@p opcode a;\n@p opcode d, a;\n@p opcode d, a, b;\n@p opcode d, a, b, c;\nFor instructions that create a result value, the d operand is the destination operand, while a , b , and c are source operands.\nThe setp instruction writes two destination registers.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#ptx-instructions", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX 指令」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「PTX 指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Predicated Execution", "titleZh": "Predicated 执行", "numberedTitle": "9.3. Predicated Execution", "level": "H2", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "", "parentZh": "", "kind": "Instructions", "kindZh": "指令", "summary": "In PTX, predicate registers are virtual and have .pred as the type specifier. So, predicate registers can be declared as", "details": "In PTX, predicate registers are virtual and have .pred as the type specifier.\nSo, predicate registers can be declared as\nAll instructions have an optional guard predicate which controls conditional execution of the instruction.\nThe syntax to specify conditional execution is to prefix an instruction with @{!}p , where p is a predicate variable, optionally negated.\nPredicates are most commonly set as the result of a comparison performed by the setp instruction.\nAs an example, consider the high-level code\nThis can be written in PTX as\nTo get a conditional branch or conditional function call, use a predicate to control the execution of the branch or call instructions.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#predicated-execution", "tokens": ["pred"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Predicated 执行」，归在「指令」。重点关注 关键词 pred，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Predicated 执行」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：pred。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Comparisons", "titleZh": "比较", "numberedTitle": "9.3.1. Comparisons", "level": "H3", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Predicated Execution", "parentZh": "Predicated 执行", "kind": "Instructions", "kindZh": "指令", "summary": "PTX ISA 文档章节：Comparisons", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#comparisons", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「比较」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「比较」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。"}, {"title": "Integer and Bit-Size Comparisons", "titleZh": "整数与 bit-size 比较", "numberedTitle": "9.3.1.1. Integer and Bit-Size Comparisons", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Comparisons", "parentZh": "比较", "kind": "Instructions", "kindZh": "指令", "summary": "The signed integer comparisons are the traditional eq (equal), ne (not-equal), lt (less-than), le (less-than-or-equal), gt (greater-than), and ge (greater-than-or-equal). The unsigned comparisons are eq , ne , lo (lower), ls (lower-or-same), hi (higher), and hs...", "details": "The signed integer comparisons are the traditional eq (equal), ne (not-equal), lt (less-than), le (less-than-or-equal), gt (greater-than), and ge (greater-than-or-equal).\nThe unsigned comparisons are eq , ne , lo (lower), ls (lower-or-same), hi (higher), and hs (higher-or-same).\nTable 22 shows the operators for signed integer, unsigned integer, and bit-size types.\nMeaning | Signed Operator | Unsigned Operator | Bit-Size Operator\na == b | eq | eq | eq\na != b | ne | ne | ne\na < b | lt | lo | n/a\na <= b | le | ls | n/a", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-and-bit-size-comparisons", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「整数与 bit-size 比较」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「整数与 bit-size 比较」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Floating Point Comparisons", "titleZh": "浮点比较", "numberedTitle": "9.3.1.2. Floating Point Comparisons", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Comparisons", "parentZh": "比较", "kind": "Instructions", "kindZh": "指令", "summary": "The ordered floating-point comparisons are eq , ne , lt , le , gt , and ge . If either operand is NaN , the result is False . Table 23 lists the floating-point comparison operators.", "details": "The ordered floating-point comparisons are eq , ne , lt , le , gt , and ge .\nIf either operand is NaN , the result is False .\nMeaning | Floating-Point Operator\na == b && !isNaN(a) && !isNaN(b) | eq\na != b && !isNaN(a) && !isNaN(b) | ne\na < b && !isNaN(a) && !isNaN(b) | lt\na <= b && !isNaN(a) && !isNaN(b) | le\na > b && !isNaN(a) && !isNaN(b) | gt", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#floating-point-comparisons", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「浮点比较」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「浮点比较」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Manipulating Predicates", "titleZh": "操作 Predicate", "numberedTitle": "9.3.2. Manipulating Predicates", "level": "H3", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Predicated Execution", "parentZh": "Predicated 执行", "kind": "Instructions", "kindZh": "指令", "summary": "Predicate values may be computed and manipulated using the following instructions: and , or , xor , not , and mov .", "details": "Predicate values may be computed and manipulated using the following instructions: and , or , xor , not , and mov .\nThere is no direct conversion between predicates and integer values, and no direct way to load or store predicate register values.\nHowever, setp can be used to generate a predicate from an integer, and the predicate-based select ( selp ) instruction can be used to generate an integer value based on the value of a predicate; for example:", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#manipulating-predicates", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「操作 Predicate」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「操作 Predicate」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Type Information for Instructions and Operands", "titleZh": "指令与操作数的类型信息", "numberedTitle": "9.4. Type Information for Instructions and Operands", "level": "H2", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "", "parentZh": "", "kind": "Instructions", "kindZh": "指令", "summary": "Typed instructions must have a type-size modifier. For example, the add instruction requires type and size information to properly perform the addition operation (signed, unsigned, float, different sizes), and this information must be specified as a suffix to the...", "details": "Typed instructions must have a type-size modifier.\nFor example, the add instruction requires type and size information to properly perform the addition operation (signed, unsigned, float, different sizes), and this information must be specified as a suffix to the opcode.\nExample\nSome instructions require multiple type-size modifiers, most notably the data conversion instruction cvt .\nIt requires separate type-size modifiers for the result and source, and these are placed in the same order as the operands.\nIn general, an operand’s type must agree with the corresponding instruction-type modifier.\nThe rules for operand and instruction type conformance are as follows:\nBit-size types agree with any type of the same size.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#type-information-for-instructions-and-operands", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「指令与操作数的类型信息」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「指令与操作数的类型信息」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Operand Size Exceeding Instruction-Type Size", "titleZh": "操作数尺寸超过指令类型尺寸", "numberedTitle": "9.4.1. Operand Size Exceeding Instruction-Type Size", "level": "H3", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Type Information for Instructions and Operands", "parentZh": "指令与操作数的类型信息", "kind": "Instructions", "kindZh": "指令", "summary": "For convenience, ld , st , and cvt instructions permit source and destination data operands to be wider than the instruction-type size, so that narrow values may be loaded, stored, and converted using regular-width registers. For example, 8-bit or 16-bit values may be...", "details": "For convenience, ld , st , and cvt instructions permit source and destination data operands to be wider than the instruction-type size, so that narrow values may be loaded, stored, and converted using regular-width registers.\nFor example, 8-bit or 16-bit values may be held directly in 32-bit or 64-bit registers when being loaded, stored, or converted to other types and sizes.\nWhen a source operand has a size that exceeds the instruction-type size, the source data is truncated (chopped) to the appropriate number of bits specified by the instruction type-size.\nTable 27 summarizes the relaxed type-checking rules for source operands.\nNote that some combinations may still be invalid for a particular instruction; for example, the cvt instruction does not support .bX instruction types, so those rows are invalid for cvt .\nSource Operand Type\nb8 | b16 | b32 | b64 | b128 | s8 | s16 | s32 | s64 | u8 | u16 | u32 | u64 | f16 | f32 | f64\nInstruction Type | b8 | – | chop | chop | chop | chop | – | chop | chop | chop | – | chop | chop | chop | chop | chop | chop", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#operand-size-exceeding-instruction-type-size", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「操作数尺寸超过指令类型尺寸」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「操作数尺寸超过指令类型尺寸」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Divergence of Threads in Control Constructs", "titleZh": "控制结构中的线程分歧", "numberedTitle": "9.5. Divergence of Threads in Control Constructs", "level": "H2", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "", "parentZh": "", "kind": "Instructions", "kindZh": "指令", "summary": "Threads in a CTA execute together, at least in appearance, until they come to a conditional control construct such as a conditional branch, conditional function call, or conditional return. If threads execute down different control flow paths, the threads are called...", "details": "Threads in a CTA execute together, at least in appearance, until they come to a conditional control construct such as a conditional branch, conditional function call, or conditional return.\nIf threads execute down different control flow paths, the threads are called divergent .\nA CTA with divergent threads may have lower performance than a CTA with uniformly executing threads, so it is important to have divergent threads re-converge as soon as possible.\nAll control constructs are assumed to be divergent points unless the control-flow instruction is marked as uniform, using the .uni suffix.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#divergence-of-threads-in-control-constructs", "tokens": ["uni"], "summaryZh": "本条整理 PTX ISA 官方文档中的「控制结构中的线程分歧」，归在「指令」。重点关注 关键词 uni，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「控制结构中的线程分歧」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：uni。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Semantics", "titleZh": "语义", "numberedTitle": "9.6. Semantics", "level": "H2", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "", "parentZh": "", "kind": "Instructions", "kindZh": "指令", "summary": "The goal of the semantic description of an instruction is to describe the results in all cases in as simple language as possible. The semantics are described using C, until C is not expressive enough.", "details": "The goal of the semantic description of an instruction is to describe the results in all cases in as simple language as possible.\nThe semantics are described using C, until C is not expressive enough.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#semantics", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「语义」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「语义」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Machine-Specific Semantics of 16-bit Code", "titleZh": "16-bit 代码的机器相关语义", "numberedTitle": "9.6.1. Machine-Specific Semantics of 16-bit Code", "level": "H3", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Semantics", "parentZh": "语义", "kind": "Instructions", "kindZh": "指令", "summary": "A PTX program may execute on a GPU with either a 16-bit or a 32-bit data path. When executing on a 32-bit data path, 16-bit registers in PTX are mapped to 32-bit physical registers, and 16-bit computations are promoted to 32-bit computations. This can lead to...", "details": "A PTX program may execute on a GPU with either a 16-bit or a 32-bit data path.\nWhen executing on a 32-bit data path, 16-bit registers in PTX are mapped to 32-bit physical registers, and 16-bit computations are promoted to 32-bit computations.\nAt the PTX language level, one solution would be to define semantics for 16-bit code that is consistent with execution on a 16-bit data path.\nThis approach introduces a performance penalty for 16-bit code executing on a 32-bit data path, since the translated code would require many additional masking instructions to suppress extra precision bits in the high-order half-word of 32-bit registers.\nRather than introduce a performance penalty for 16-bit code running on 32-bit GPUs, the semantics of 16-bit instructions in PTX is machine-specific.\nA compiler or programmer may chose to enforce portable, machine-independent 16-bit semantics by adding explicit conversions to 16-bit values at appropriate points in the program to guarantee portability of the code.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#machine-specific-semantics-of-16-bit-code", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「16-bit 代码的机器相关语义」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「16-bit 代码的机器相关语义」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Instructions", "titleZh": "指令", "numberedTitle": "9.7. Instructions", "level": "H2", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "", "parentZh": "", "kind": "Instructions", "kindZh": "指令", "summary": "All PTX instructions may be predicated. In the following descriptions, the optional guard predicate is omitted from the syntax.", "details": "All PTX instructions may be predicated.\nIn the following descriptions, the optional guard predicate is omitted from the syntax.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#instructions", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「指令」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Arithmetic Instructions", "titleZh": "整数算术指令", "numberedTitle": "9.7.1. Integer Arithmetic Instructions", "level": "H3", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Instructions", "parentZh": "指令", "kind": "Instructions", "kindZh": "指令", "summary": "Integer arithmetic instructions operate on the integer types in register and constant immediate forms. The integer arithmetic instructions are:", "details": "Integer arithmetic instructions operate on the integer types in register and constant immediate forms.\nThe integer arithmetic instructions are:\nadd\nsub\nmul\nmad\nclmad\nmul24", "source": "https
