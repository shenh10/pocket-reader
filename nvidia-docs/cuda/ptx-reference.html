<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CUDA 文档速查</title>
  <style>
    :root {
      --paper: #f6f7f2;
      --surface: #ffffff;
      --ink: #151713;
      --muted: #62695f;
      --line: #d8ddd2;
      --line-strong: #a9b4a4;
      --green: #67b340;
      --cyan: #2d8b94;
      --amber: #c8841e;
      --rust: #b95138;
      --charcoal: #20241d;
      --shadow: 0 18px 45px rgba(18, 23, 16, .10);
      --mono: "JetBrains Mono", "Iosevka", "SFMono-Regular", Consolas, monospace;
      --sans: "Avenir Next", "DIN Alternate", "Gill Sans", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: 0;
      background:
        linear-gradient(90deg, rgba(32, 36, 29, .055) 1px, transparent 1px) 0 0 / 24px 24px,
        linear-gradient(0deg, rgba(32, 36, 29, .04) 1px, transparent 1px) 0 0 / 24px 24px,
        var(--paper);
    }

    a { color: inherit; }
    code {
      font-family: var(--mono);
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .top {
      background: var(--charcoal);
      color: #f4f7ef;
      border-bottom: 6px solid var(--accent, var(--green));
      overflow: hidden;
      position: relative;
    }

    .top::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 82% 28%, rgba(103,179,64,.16), transparent 24%),
        repeating-linear-gradient(90deg, rgba(255,255,255,.045) 0 1px, transparent 1px 70px);
      pointer-events: none;
    }

    .hero {
      width: min(1480px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 320px;
      padding: 42px 0 34px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, .62fr);
      gap: 34px;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 20px;
      color: #cfd8c8;
      font-family: var(--mono);
      font-size: 12px;
      text-transform: uppercase;
    }

    .signal {
      width: 9px;
      height: 9px;
      background: var(--accent, var(--green));
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent, var(--green)) 25%, transparent);
      display: inline-block;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 6vw, 84px);
      line-height: .92;
      font-weight: 900;
    }

    .hero p {
      max-width: 860px;
      color: #dfe6da;
      font-size: 18px;
      line-height: 1.62;
      margin: 20px 0 0;
    }

    .machine {
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.06);
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.22);
    }

    .machine-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .machine-cell {
      min-height: 86px;
      border: 1px solid rgba(255,255,255,.22);
      display: grid;
      place-items: center;
      color: #eaf1e6;
      font: 900 13px var(--mono);
      text-align: center;
      padding: 10px;
    }

    .machine-code {
      margin-top: 12px;
      color: #cfd8c8;
      font: 800 12px var(--mono);
      overflow-wrap: anywhere;
    }

    .main {
      width: min(1480px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: -48px;
      position: relative;
      z-index: 2;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      min-height: 106px;
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stat strong {
      color: var(--accent, var(--green));
      font: 900 clamp(28px, 4vw, 40px) var(--mono);
      line-height: 1;
    }

    .stat span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .controls {
      margin-top: 22px;
      background: rgba(255,255,255,.9);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 5;
      backdrop-filter: blur(14px);
    }

    .control-grid {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 14px;
      align-items: center;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    input[type="search"] {
      width: 100%;
      height: 48px;
      border: 1px solid var(--line-strong);
      background: #fbfcfa;
      color: var(--ink);
      font: 800 16px var(--mono);
      padding: 0 14px;
      outline: none;
    }

    input[type="search"]:focus {
      border-color: var(--accent, var(--green));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent, var(--green)) 20%, transparent);
    }

    .checks {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .check {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: #fbfcfa;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .check input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent, var(--green));
    }

    .topics {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .topic {
      min-height: 36px;
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--ink);
      font-weight: 900;
      font-size: 13px;
      padding: 0 12px;
      cursor: pointer;
    }

    .topic[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .topic-count {
      margin-left: 6px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 800;
    }

    .topic[aria-pressed="true"] .topic-count {
      color: rgba(255, 255, 255, .72);
    }

    .guide {
      margin-top: 22px;
      border: 1px solid var(--line);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .guide-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--accent, var(--green)) 18%, transparent), transparent 54%),
        #fff;
    }

    .guide-head h2 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.05;
    }

    .guide-head p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.55;
      max-width: 900px;
      font-size: 14px;
    }

    .guide-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
    }

    .guide-card {
      background: #fff;
      padding: 16px;
      min-height: 198px;
      border-top: 5px solid var(--accent, var(--green));
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 10px;
    }

    .guide-card h3 {
      margin: 0;
      font-size: 18px;
      line-height: 1.15;
    }

    .guide-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 13px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      align-content: start;
      gap: 6px;
    }

    .chip {
      border: 1px solid var(--line-strong);
      background: #fbfcfa;
      color: var(--ink);
      min-height: 28px;
      padding: 0 8px;
      font: 800 12px var(--mono);
      cursor: pointer;
      max-width: 100%;
      overflow-wrap: anywhere;
      text-align: left;
    }

    .chip:hover,
    .chip:focus {
      outline: none;
      border-color: var(--accent, var(--green));
      color: var(--accent, var(--green));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent, var(--green)) 18%, transparent);
    }

    .layout {
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr);
      gap: 22px;
      align-items: start;
      margin-top: 22px;
    }

    .side {
      background: #fff;
      border: 1px solid var(--line);
      padding: 18px;
      position: sticky;
      top: 142px;
    }

    .side h2 {
      margin: 0 0 12px;
      font-size: 22px;
      line-height: 1.05;
    }

    .side p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
    }

    .kind-list {
      display: grid;
      gap: 8px;
      margin-top: 16px;
    }

    .kind-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }

    .kind-row b {
      color: var(--ink);
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 10px;
    }

    .result-head h2 {
      margin: 0;
      font-size: 24px;
    }

    .result-count {
      color: var(--muted);
      font: 800 13px var(--mono);
      text-align: right;
    }

    .cards {
      display: grid;
      gap: 10px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(18, 23, 16, .05);
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
      max-width: 100%;
      min-width: 0;
    }

    .card:hover {
      border-color: var(--line-strong);
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }

    .card-main {
      display: grid;
      grid-template-columns: minmax(280px, .9fr) minmax(0, 1.1fr);
      gap: 18px;
      padding: 16px;
      min-width: 0;
    }

    .card-main > *,
    details,
    .details,
    .details > div {
      min-width: 0;
    }

    .card-title {
      display: inline-block;
      color: var(--ink);
      font: 900 clamp(16px, 2vw, 21px) var(--mono);
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .card-title:hover { color: var(--accent, var(--green)); }

    .original-title {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: #fbfcfa;
      font-size: 12px;
      font-weight: 800;
      padding: 0 8px;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .tag.kind {
      border-color: color-mix(in srgb, var(--accent, var(--green)) 35%, var(--line));
      color: var(--accent, var(--green));
    }

    .summary {
      margin: 0;
      color: #30372d;
      line-height: 1.55;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .tokens {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 12px;
      min-width: 0;
    }

    .token {
      font: 800 12px var(--mono);
      color: var(--muted);
      background: #eef3ea;
      padding: 3px 6px;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .snippet {
      margin: 12px 0 0;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent, var(--green));
      background: #f7faf4;
      padding: 10px 12px;
      color: #273021;
      font: 800 12px/1.45 var(--mono);
      white-space: pre-wrap;
      overflow-x: auto;
      max-height: 220px;
    }

    details {
      border-top: 1px solid var(--line);
      padding: 0 16px 14px;
    }

    summary {
      cursor: pointer;
      font-size: 13px;
      color: var(--accent, var(--green));
      font-weight: 900;
      padding: 12px 0 4px;
    }

    .details {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .details b {
      display: block;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .details a {
      color: var(--accent, var(--green));
      font-weight: 900;
    }

    .empty {
      display: none;
      border: 1px dashed var(--line-strong);
      background: rgba(255,255,255,.74);
      padding: 42px 20px;
      text-align: center;
      color: var(--muted);
      font-weight: 800;
    }

    .footer {
      width: min(1480px, calc(100% - 32px));
      margin: 0 auto;
      padding: 0 0 44px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 1100px) {
      .guide-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero { grid-template-columns: 1fr; }
      .machine { max-width: 620px; }
      .layout { grid-template-columns: 1fr; }
      .side { position: static; }
      .card-main { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      .hero, .main, .footer { width: min(100% - 22px, 1480px); }
      .stats { grid-template-columns: 1fr; margin-top: 14px; }
      .controls { position: static; }
      .control-grid, .guide-head, .details { grid-template-columns: 1fr; }
      .checks { justify-content: flex-start; }
      .guide-grid { grid-template-columns: 1fr; }
      .result-head { align-items: start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="top">
    <section class="hero">
      <div>
        <div class="eyebrow"><span class="signal"></span><span id="brand"></span></div>
        <h1 id="page-title"></h1>
        <p id="subtitle"></p>
      </div>
      <aside class="machine" aria-label="visual index">
        <div class="machine-grid">
          <div class="machine-cell">API</div>
          <div class="machine-cell">TYPES</div>
          <div class="machine-cell">PERF</div>
          <div class="machine-cell">ISA</div>
        </div>
        <div class="machine-code" id="hero-code"></div>
      </aside>
    </section>
  </header>

  <main class="main">
    <section class="stats">
      <div class="stat"><strong id="stat-entries">0</strong><span>索引条目</span></div>
      <div class="stat"><strong id="stat-kinds">0</strong><span>主题分类</span></div>
      <div class="stat"><strong id="stat-special">0</strong><span id="stat-special-label">重点类条目</span></div>
      <div class="stat"><strong id="stat-topkind">0</strong><span>最大分类条目数</span></div>
    </section>

    <section class="controls">
      <div class="control-grid">
        <div>
          <label for="search">搜索标题 / 摘要 / token</label>
          <input id="search" type="search" autocomplete="off" placeholder="例如 GEMM、workspace、mma、%tid、CUBLAS_LOG">
        </div>
        <div class="checks">
          <label class="check"><input id="only-special" type="checkbox"> 只看重点类</label>
          <label class="check"><input id="has-detail" type="checkbox"> 有结构化摘录</label>
        </div>
      </div>
      <div id="topics" class="topics"></div>
    </section>

    <section class="guide">
      <div class="guide-head">
        <div>
          <h2>高信号入口</h2>
          <p>这些 chip 是从官方文档中最常用于调优、排障或理解语义的入口抽出来的；点击后会直接筛到相关章节或条目。</p>
        </div>
      </div>
      <div id="guide-grid" class="guide-grid"></div>
    </section>

    <section class="layout">
      <aside class="side">
        <h2>整理口径</h2>
        <p id="source-title"></p>
        <p>条目来自官方单页 HTML 的章节标题、函数/指令小节、环境变量表和短摘要。页面保留官方锚点，长正文请跳回源文档。</p>
        <div id="kind-list" class="kind-list"></div>
      </aside>

      <section>
        <div class="result-head">
          <h2>索引列表</h2>
          <div id="result-count" class="result-count"></div>
        </div>
        <div id="cards" class="cards"></div>
        <div id="empty" class="empty">没有匹配的条目。</div>
      </section>
    </section>
  </main>

  <footer class="footer">
    来源：<a id="source-url" href="#" target="_blank" rel="noreferrer"></a>。页面生成时间：<span id="generated-at"></span>。
  </footer>

  <script type="application/json" id="cuda-docs-data">{"entries": [{"title": "Introduction", "titleZh": "介绍", "numberedTitle": "1. Introduction", "level": "H1", "chapter": "PTX ISA", "chapterZh": "PTX ISA", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "This document describes PTX, a low-level parallel thread execution virtual machine and instruction set architecture (ISA). PTX exposes the GPU as a data-parallel computing device .", "details": "This document describes PTX, a low-level parallel thread execution virtual machine and instruction set architecture (ISA).\nPTX exposes the GPU as a data-parallel computing device .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#introduction", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「介绍」，归在「指南章节」。重点关注 指南章节，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「介绍」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Scalable Data-Parallel Computing using GPUs", "titleZh": "使用 GPU 的可扩展数据并行计算", "numberedTitle": "1.1. Scalable Data-Parallel Computing using GPUs", "level": "H2", "chapter": "Introduction", "chapterZh": "介绍", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "Driven by the insatiable market demand for real-time, high-definition 3D graphics, the programmable GPU has evolved into a highly parallel, multithreaded, many-core processor with tremendous computational horsepower and very high memory bandwidth. The GPU is especially...", "details": "Driven by the insatiable market demand for real-time, high-definition 3D graphics, the programmable GPU has evolved into a highly parallel, multithreaded, many-core processor with tremendous computational horsepower and very high memory bandwidth.\nThe GPU is especially well-suited to address problems that can be expressed as data-parallel computations - the same program is executed on many data elements in parallel - with high arithmetic intensity - the ratio of arithmetic operations to memory operations.\nData-parallel processing maps data elements to parallel processing threads.\nMany applications that process large data sets can use a data-parallel programming model to speed up the computations.\nPTX defines a virtual machine and ISA for general purpose parallel thread execution.\nPTX programs are translated at install time to the target hardware instruction set.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#scalable-data-parallel-computing-using-gpus", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「使用 GPU 的可扩展数据并行计算」，归在「指南章节」。重点关注 指南章节，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「使用 GPU 的可扩展数据并行计算」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Goals of PTX", "titleZh": "PTX 的目标", "numberedTitle": "1.2. Goals of PTX", "level": "H2", "chapter": "Introduction", "chapterZh": "介绍", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "PTX provides a stable programming model and instruction set for general purpose parallel programming. It is designed to be efficient on NVIDIA GPUs supporting the computation features defined by the NVIDIA Tesla architecture. High level language compilers for languages...", "details": "PTX provides a stable programming model and instruction set for general purpose parallel programming.\nIt is designed to be efficient on NVIDIA GPUs supporting the computation features defined by the NVIDIA Tesla architecture.\nThe goals for PTX include the following:\nProvide a stable ISA that spans multiple GPU generations.\nAchieve performance in compiled applications comparable to native GPU performance.\nProvide a machine-independent ISA for C/C++ and other compilers to target.\nProvide a code distribution ISA for application and middleware developers.\nProvide a common source-level ISA for optimizing code generators and translators, which map PTX to specific target machines.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#goals-of-ptx", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX 的目标」，归在「指南章节」。重点关注 指南章节，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX 的目标」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "PTX ISA Version 9.3", "titleZh": "PTX ISA 9.3 版本", "numberedTitle": "1.3. PTX ISA Version 9.3", "level": "H2", "chapter": "Introduction", "chapterZh": "介绍", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "PTX ISA version 9.3 introduces the following new features:", "details": "PTX ISA version 9.3 introduces the following new features:\nAdds support for mma_throughput pragma.\nAdds support for clmad instruction.\nAdds support for .phase_type::* qualifier for mbarrier.test_wait and mbarrier.try_wait instructions.\nAdds support for reportPredicate and reportValue operands for mbarrier.test_wait and mbarrier.try_wait instructions.\nAdds support for .layout qualifier for mbarrier instructions and support for mbarrier.check_layout instruction.\nAdds support for multimem.st.async and multimem.red.async instructions.\nAdds support for .sem and .scope qualifiers for cp.async.bulk , cp.reduce.async.bulk , multimem.cp.async.bulk and multimem.cp.reduce.async.bulk instructions.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#ptx-isa-version-9-3", "tokens": ["phase_type", "mbarrier.test", "mbarrier.try", "layout", "mbarrier.check", "multimem.st.async", "multimem.red.async", "sem", "scope", "cp.async.bulk", "cp.reduce.async.bulk", "multimem.cp.async.bulk"], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX ISA 9.3 版本」，归在「指南章节」。重点关注 关键词 phase_type、mbarrier.test、mbarrier.try、layout、mbarrier.check，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「PTX ISA 9.3 版本」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n相关 API / 关键词：phase_type、mbarrier.test、mbarrier.try、layout、mbarrier.check、multimem.st.async、multimem.red.async、sem。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Document Structure", "titleZh": "文档结构", "numberedTitle": "1.4. Document Structure", "level": "H2", "chapter": "Introduction", "chapterZh": "介绍", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "The information in this document is organized into the following Chapters:", "details": "The information in this document is organized into the following Chapters:\nProgramming Model outlines the programming model.\nPTX Machine Model gives an overview of the PTX virtual machine model.\nSyntax describes the basic syntax of the PTX language.\nState Spaces, Types, and Variables describes state spaces, types, and variable declarations.\nInstruction Operands describes instruction operands.\nAbstracting the ABI describes the function and call syntax, calling convention, and PTX support for abstracting the Application Binary Interface (ABI) .\nInstruction Set describes the instruction set.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#document-structure", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「文档结构」，归在「指南章节」。重点关注 指南章节，适合用于定位 PTX ISA 官方章节和相关语义。", "detailsZh": "中文提要：这是「文档结构」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 PTX ISA 官方章节和相关语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Programming Model", "titleZh": "编程模型", "numberedTitle": "2. Programming Model", "level": "H1", "chapter": "Introduction", "chapterZh": "介绍", "parent": "", "parentZh": "", "kind": "Programming Model", "kindZh": "编程模型", "summary": "PTX ISA 文档章节：Programming Model", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#programming-model", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「编程模型」，归在「编程模型」。重点关注 编程模型，适合用于定位线程层次、warp、CTA、cluster 等执行模型。", "detailsZh": "中文提要：这是「编程模型」对应的官方条目，分类为「编程模型」。\n阅读重点：定位线程层次、warp、CTA、cluster 等执行模型。"}, {"title": "A Highly Multithreaded Coprocessor", "titleZh": "高度多线程协处理器", "numberedTitle": "2.1. A Highly Multithreaded Coprocessor", "level": "H2", "chapter": "Programming Model", "chapterZh": "编程模型", "parent": "", "parentZh": "", "kind": "Programming Model", "kindZh": "编程模型", "summary": "The GPU is a compute device capable of executing a very large number of threads in parallel. It operates as a coprocessor to the main CPU, or host: In other words, data-parallel, compute-intensive portions of applications running on the host are off-loaded onto the...", "details": "The GPU is a compute device capable of executing a very large number of threads in parallel.\nIt operates as a coprocessor to the main CPU, or host: In other words, data-parallel, compute-intensive portions of applications running on the host are off-loaded onto the device.\nMore precisely, a portion of an application that is executed many times, but independently on different data, can be isolated into a kernel function that is executed on the GPU as many different threads.\nTo that effect, such a function is compiled to the PTX instruction set and the resulting kernel is translated at install time to the target GPU instruction set.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#highly-multithreaded-coprocessor", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「高度多线程协处理器」，归在「编程模型」。重点关注 编程模型，适合用于定位线程层次、warp、CTA、cluster 等执行模型。", "detailsZh": "中文提要：这是「高度多线程协处理器」对应的官方条目，分类为「编程模型」。\n阅读重点：定位线程层次、warp、CTA、cluster 等执行模型。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Thread Hierarchy", "titleZh": "线程层次", "numberedTitle": "2.2. Thread Hierarchy", "level": "H2", "chapter": "Programming Model", "chapterZh": "编程模型", "parent": "", "parentZh": "", "kind": "Programming Model", "kindZh": "编程模型", "summary": "The batch of threads that executes a kernel is organized as a grid. A grid consists of either cooperative thread arrays or clusters of cooperative thread arrays as described in this section and illustrated in Figure 1 and Figure 2 . Cooperative thread arrays (CTAs)...", "details": "The batch of threads that executes a kernel is organized as a grid.\nA grid consists of either cooperative thread arrays or clusters of cooperative thread arrays as described in this section and illustrated in Figure 1 and Figure 2 .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#thread-hierarchy", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「线程层次」，归在「编程模型」。重点关注 编程模型，适合用于定位线程层次、warp、CTA、cluster 等执行模型。", "detailsZh": "中文提要：这是「线程层次」对应的官方条目，分类为「编程模型」。\n阅读重点：定位线程层次、warp、CTA、cluster 等执行模型。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Cooperative Thread Arrays", "titleZh": "CTA（协作线程数组）", "numberedTitle": "2.2.1. Cooperative Thread Arrays", "level": "H3", "chapter": "Programming Model", "chapterZh": "编程模型", "parent": "Thread Hierarchy", "parentZh": "线程层次", "kind": "Programming Model", "kindZh": "编程模型", "summary": "The Parallel Thread Execution (PTX) programming model is explicitly parallel: a PTX program specifies the execution of a given thread of a parallel thread array. A cooperative thread array , or CTA, is an array of threads that execute a kernel concurrently or in...", "details": "The Parallel Thread Execution (PTX) programming model is explicitly parallel: a PTX program specifies the execution of a given thread of a parallel thread array.\nA cooperative thread array , or CTA, is an array of threads that execute a kernel concurrently or in parallel.\nThreads within a CTA can communicate with each other.\nTo coordinate the communication of the threads within the CTA, one can specify synchronization points where threads wait until all threads in the CTA have arrived.\nEach thread has a unique thread identifier within the CTA.\nPrograms use a data parallel decomposition to partition inputs, work, and results across the threads of the CTA.\nEach CTA has a 1D, 2D, or 3D shape specified by a three-element vector ntid (with elements ntid.x , ntid.y , and ntid.z ).\nThe vector ntid specifies the number of threads in each CTA dimension.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#cooperative-thread-arrays", "tokens": ["ntid.x", "ntid.y", "ntid.z"], "summaryZh": "本条整理 PTX ISA 官方文档中的「CTA（协作线程数组）」，归在「编程模型」。重点关注 关键词 ntid.x、ntid.y、ntid.z，适合用于定位线程层次、warp、CTA、cluster 等执行模型。", "detailsZh": "中文提要：这是「CTA（协作线程数组）」对应的官方条目，分类为「编程模型」。\n阅读重点：定位线程层次、warp、CTA、cluster 等执行模型。\n相关 API / 关键词：ntid.x、ntid.y、ntid.z。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Cluster of Cooperative Thread Arrays", "titleZh": "CTA Cluster", "numberedTitle": "2.2.2. Cluster of Cooperative Thread Arrays", "level": "H3", "chapter": "Programming Model", "chapterZh": "编程模型", "parent": "Thread Hierarchy", "parentZh": "线程层次", "kind": "Programming Model", "kindZh": "编程模型", "summary": "Cluster is a group of CTAs that run concurrently or in parallel and can synchronize and communicate with each other via shared memory. The executing CTA has to make sure that the shared memory of the peer CTA exists before communicating with it via shared memory and...", "details": "Cluster is a group of CTAs that run concurrently or in parallel and can synchronize and communicate with each other via shared memory.\nThe executing CTA has to make sure that the shared memory of the peer CTA exists before communicating with it via shared memory and the peer CTA hasn’t exited before completing the shared memory operation.\nThreads within the different CTAs in a cluster can synchronize and communicate with each other via shared memory.\nCluster-wide barriers can be used to synchronize all the threads within the cluster.\nCluster level is applicable only on target architecture sm_90 or higher.\nSpecifying cluster level during launch time is optional.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#cluster-of-cooperative-thread-arrays", "tokens": ["sm_90"], "summaryZh": "本条整理 PTX ISA 官方文档中的「CTA Cluster」，归在「编程模型」。重点关注 关键词 sm_90，适合用于定位线程层次、warp、CTA、cluster 等执行模型。", "detailsZh": "中文提要：这是「CTA Cluster」对应的官方条目，分类为「编程模型」。\n阅读重点：定位线程层次、warp、CTA、cluster 等执行模型。\n相关 API / 关键词：sm_90。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Grid of Clusters", "titleZh": "Cluster Grid", "numberedTitle": "2.2.3. Grid of Clusters", "level": "H3", "chapter": "Programming Model", "chapterZh": "编程模型", "parent": "Thread Hierarchy", "parentZh": "线程层次", "kind": "Programming Model", "kindZh": "编程模型", "summary": "There is a maximum number of threads that a CTA can contain and a maximum number of CTAs that a cluster can contain. However, clusters with CTAs that execute the same kernel can be batched together into a grid of clusters, so that the total number of threads that can...", "details": "There is a maximum number of threads that a CTA can contain and a maximum number of CTAs that a cluster can contain.\nHowever, clusters with CTAs that execute the same kernel can be batched together into a grid of clusters, so that the total number of threads that can be launched in a single kernel invocation is very large.\nEach cluster has a unique cluster identifier ( clusterid ) within a grid of clusters.\nEach grid of clusters has a 1D, 2D , or 3D shape specified by the parameter nclusterid .\nEach CTA has a unique identifier ( ctaid ) within a grid.\nEach grid of CTAs has 1D, 2D, or 3D shape specified by the parameter nctaid .\nEach kernel is executed as a batch of threads organized as a grid of clusters consisting of CTAs where cluster is optional level and is applicable only for target architectures sm_90 and higher.\nFigure 1 shows a grid consisting of CTAs and Figure 2 shows a grid consisting of clusters.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#grid-of-clusters", "tokens": ["sm_90"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Cluster Grid」，归在「编程模型」。重点关注 关键词 sm_90，适合用于定位线程层次、warp、CTA、cluster 等执行模型。", "detailsZh": "中文提要：这是「Cluster Grid」对应的官方条目，分类为「编程模型」。\n阅读重点：定位线程层次、warp、CTA、cluster 等执行模型。\n相关 API / 关键词：sm_90。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Memory Hierarchy", "titleZh": "内存层次", "numberedTitle": "2.3. Memory Hierarchy", "level": "H2", "chapter": "Programming Model", "chapterZh": "编程模型", "parent": "", "parentZh": "", "kind": "Programming Model", "kindZh": "编程模型", "summary": "PTX threads may access data from multiple state spaces during their execution as illustrated by Figure 3 where cluster level is introduced from target architecture sm_90 onwards. Each thread has a private local memory. Each thread block (CTA) has a shared memory...", "details": "PTX threads may access data from multiple state spaces during their execution as illustrated by Figure 3 where cluster level is introduced from target architecture sm_90 onwards.\nEach thread has a private local memory.\nThere are additional state spaces accessible by all threads: the constant, param, texture, and surface state spaces.\nConstant and texture memory are read-only; surface memory is readable and writable.\nThe global, constant, and texture state spaces are persistent across kernel launches by the same application.\nBoth the host and the device maintain their own local memory, referred to as host memory and device memory , respectively.\nThe device memory may be mapped and read or written by the host, or, for more efficient transfer, copied from the host memory through optimized API calls that utilize the device’s high-performance Direct Memory Access (DMA) engine.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#memory-hierarchy", "tokens": ["sm_90"], "summaryZh": "本条整理 PTX ISA 官方文档中的「内存层次」，归在「编程模型」。重点关注 关键词 sm_90，适合用于定位线程层次、warp、CTA、cluster 等执行模型。", "detailsZh": "中文提要：这是「内存层次」对应的官方条目，分类为「编程模型」。\n阅读重点：定位线程层次、warp、CTA、cluster 等执行模型。\n相关 API / 关键词：sm_90。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "PTX Machine Model", "titleZh": "PTX 机器模型", "numberedTitle": "3. PTX Machine Model", "level": "H1", "chapter": "Programming Model", "chapterZh": "编程模型", "parent": "", "parentZh": "", "kind": "Programming Model", "kindZh": "编程模型", "summary": "PTX ISA 文档章节：PTX Machine Model", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#ptx-machine-model", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「PTX 机器模型」，归在「编程模型」。重点关注 编程模型，适合用于定位线程层次、warp、CTA、cluster 等执行模型。", "detailsZh": "中文提要：这是「PTX 机器模型」对应的官方条目，分类为「编程模型」。\n阅读重点：定位线程层次、warp、CTA、cluster 等执行模型。"}, {"title": "A Set of SIMT Multiprocessors", "titleZh": "一组 SIMT 多处理器", "numberedTitle": "3.1. A Set of SIMT Multiprocessors", "level": "H2", "chapter": "PTX Machine Model", "chapterZh": "PTX 机器模型", "parent": "", "parentZh": "", "kind": "Programming Model", "kindZh": "编程模型", "summary": "The NVIDIA GPU architecture is built around a scalable array of multithreaded Streaming Multiprocessors (SMs) . When a host program invokes a kernel grid, the blocks of the grid are enumerated and distributed to multiprocessors with available execution capacity. The...", "details": "The NVIDIA GPU architecture is built around a scalable array of multithreaded Streaming Multiprocessors (SMs) .\nWhen a host program invokes a kernel grid, the blocks of the grid are enumerated and distributed to multiprocessors with available execution capacity.\nA multiprocessor consists of multiple Scalar Processor (SP) cores, a multithreaded instruction unit, and on-chip shared memory.\nThe multiprocessor creates, manages, and executes concurrent threads in hardware with zero scheduling overhead.\nTo manage hundreds of threads running several different programs, the multiprocessor employs an architecture we call SIMT (single-instruction, multiple-thread) .\nThe multiprocessor maps each thread to one scalar processor core, and each scalar thread executes independently with its own instruction address and register state.\nWhen a multiprocessor is given one or more thread blocks to execute, it splits them into warps that get scheduled by the SIMT unit.\nThe way a block is split into warps is always the same; each warp contains threads of consecutive, increasing thread IDs with the first warp containing thread 0.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#set-of-simt-multiprocessors", "tokens": ["warps", "warp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「一组 SIMT 多处理器」，归在「编程模型」。重点关注 关键词 warps、warp，适合用于定位线程层次、warp、CTA、cluster 等执行模型。", "detailsZh": "中文提要：这是「一组 SIMT 多处理器」对应的官方条目，分类为「编程模型」。\n阅读重点：定位线程层次、warp、CTA、cluster 等执行模型。\n相关 API / 关键词：warps、warp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Independent Thread Scheduling", "titleZh": "独立线程调度", "numberedTitle": "3.2. Independent Thread Scheduling", "level": "H2", "chapter": "PTX Machine Model", "chapterZh": "PTX 机器模型", "parent": "", "parentZh": "", "kind": "Programming Model", "kindZh": "编程模型", "summary": "On architectures prior to Volta, warps used a single program counter shared amongst all 32 threads in the warp together with an active mask specifying the active threads of the warp. As a result, threads from the same warp in divergent regions or different states of...", "details": "On architectures prior to Volta, warps used a single program counter shared amongst all 32 threads in the warp together with an active mask specifying the active threads of the warp.\nAs a result, threads from the same warp in divergent regions or different states of execution cannot signal each other or exchange data, and algorithms requiring fine-grained sharing of data guarded by locks or mutexes can easily lead to deadlock, depending on which warp the contending threads come from.\nStarting with the Volta architecture, Independent Thread Scheduling allows full concurrency between threads, regardless of warp.\nWith Independent Thread Scheduling , the GPU maintains execution state per thread, including a program counter and call stack, and can yield execution at a per-thread granularity, either to make better use of execution resources or to allow one thread to wait for data to be produced by another.\nIndependent Thread Scheduling can lead to a rather different set of threads participating in the executed code than intended if the developer made assumptions about warp-synchronicity of previous hardware architectures.\nIn particular, any warp-synchronous code (such as synchronization-free, intra-warp reductions) should be revisited to ensure compatibility with Volta and beyond.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#independent-thread-scheduling", "tokens": ["warps", "warp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「独立线程调度」，归在「编程模型」。重点关注 关键词 warps、warp，适合用于定位线程层次、warp、CTA、cluster 等执行模型。", "detailsZh": "中文提要：这是「独立线程调度」对应的官方条目，分类为「编程模型」。\n阅读重点：定位线程层次、warp、CTA、cluster 等执行模型。\n相关 API / 关键词：warps、warp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "On-chip Shared Memory", "titleZh": "片上共享内存", "numberedTitle": "3.3. On-chip Shared Memory", "level": "H2", "chapter": "PTX Machine Model", "chapterZh": "PTX 机器模型", "parent": "", "parentZh": "", "kind": "Programming Model", "kindZh": "编程模型", "summary": "As illustrated by Figure 4 , each multiprocessor has on-chip memory of the four following types:", "details": "As illustrated by Figure 4 , each multiprocessor has on-chip memory of the four following types:\nOne set of local 32-bit registers per processor,\nA parallel data cache or shared memory that is shared by all scalar processor cores and is where the shared memory space resides,\nA read-only constant cache that is shared by all scalar processor cores and speeds up reads from the constant memory space, which is a read-only region of device memory,\nA read-only texture cache that is shared by all scalar processor cores and speeds up reads from the texture memory space, which is a read-only region of device memory; each multiprocessor accesses the texture cache via a texture unit that implements the various addressing modes and data filtering.\nThe local and global memory spaces are read-write regions of device memory.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#on-chip-shared-memory", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「片上共享内存」，归在「编程模型」。重点关注 编程模型，适合用于定位线程层次、warp、CTA、cluster 等执行模型。", "detailsZh": "中文提要：这是「片上共享内存」对应的官方条目，分类为「编程模型」。\n阅读重点：定位线程层次、warp、CTA、cluster 等执行模型。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Syntax", "titleZh": "语法", "numberedTitle": "4. Syntax", "level": "H1", "chapter": "PTX Machine Model", "chapterZh": "PTX 机器模型", "parent": "", "parentZh": "", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "PTX programs are a collection of text source modules (files). PTX source modules have an assembly-language style syntax with instruction operation codes and operands. Pseudo-operations specify symbol and addressing management. The ptxas optimizing backend compiler...", "details": "PTX programs are a collection of text source modules (files).\nPTX source modules have an assembly-language style syntax with instruction operation codes and operands.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#syntax", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「语法」，归在「语法 / Directive」。重点关注 语法 / Directive，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「语法」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Source Format", "titleZh": "源文件格式", "numberedTitle": "4.1. Source Format", "level": "H2", "chapter": "Syntax", "chapterZh": "语法", "parent": "", "parentZh": "", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "Source modules are ASCII text. Lines are separated by the newline character ( \\n ).", "details": "Source modules are ASCII text.\nLines are separated by the newline character ( \\n ).\nAll whitespace characters are equivalent; whitespace is ignored except for its use in separating tokens in the language.\nThe C preprocessor cpp may be used to process PTX source modules.\nLines beginning with # are preprocessor directives.\n#include , #define , #if , #ifdef , #else , #endif , #line , #file\nC: A Reference Manual by Harbison and Steele provides a good description of the C preprocessor.\nPTX is case sensitive and uses lowercase for keywords.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#source-format", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「源文件格式」，归在「语法 / Directive」。重点关注 语法 / Directive，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「源文件格式」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Comments", "titleZh": "注释", "numberedTitle": "4.2. Comments", "level": "H2", "chapter": "Syntax", "chapterZh": "语法", "parent": "", "parentZh": "", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "Comments in PTX follow C/C++ syntax, using non-nested /* and */ for comments that may span multiple lines, and using // to begin a comment that extends up to the next newline character, which terminates the current line. Comments cannot occur within character...", "details": "Comments in PTX follow C/C++ syntax, using non-nested /* and */ for comments that may span multiple lines, and using // to begin a comment that extends up to the next newline character, which terminates the current line.\nComments cannot occur within character constants, string literals, or within other comments.\nComments in PTX are treated as whitespace.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#comments", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「注释」，归在「语法 / Directive」。重点关注 语法 / Directive，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「注释」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Statements", "titleZh": "语句", "numberedTitle": "4.3. Statements", "level": "H2", "chapter": "Syntax", "chapterZh": "语法", "parent": "", "parentZh": "", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "A PTX statement is either a directive or an instruction. Statements begin with an optional label and end with a semicolon.", "details": "A PTX statement is either a directive or an instruction.\nStatements begin with an optional label and end with a semicolon.\nExamples", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#statements", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「语句」，归在「语法 / Directive」。重点关注 语法 / Directive，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「语句」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Directive Statements", "titleZh": "Directive 语句", "numberedTitle": "4.3.1. Directive Statements", "level": "H3", "chapter": "Syntax", "chapterZh": "语法", "parent": "Statements", "parentZh": "语句", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "Directive keywords begin with a dot, so no conflict is possible with user-defined identifiers. The directives in PTX are listed in Table 1 and described in State Spaces, Types, and Variables and Directives .", "details": "Directive keywords begin with a dot, so no conflict is possible with user-defined identifiers.\nThe directives in PTX are listed in Table 1 and described in State Spaces, Types, and Variables and Directives .\n.address_size | .explicitcluster | .maxnreg | .section\n.alias | .extern | .maxntid | .shared\n.align | .file | .minnctapersm | .sreg\n.branchtargets | .func | .noreturn | .target\n.callprototype | .global | .param | .tex\n.calltargets | .loc | .pragma | .version", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#directive-statements", "tokens": ["address_size", "explicitcluster", "maxnreg", "section", "alias", "extern", "maxntid", "shared", "align", "file", "minnctapersm", "sreg"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Directive 语句」，归在「语法 / Directive」。重点关注 关键词 address_size、explicitcluster、maxnreg、section、alias，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「Directive 语句」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：address_size、explicitcluster、maxnreg、section、alias、extern、maxntid、shared。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Instruction Statements", "titleZh": "指令语句", "numberedTitle": "4.3.2. Instruction Statements", "level": "H3", "chapter": "Syntax", "chapterZh": "语法", "parent": "Statements", "parentZh": "语句", "kind": "Instructions", "kindZh": "指令", "summary": "Instructions are formed from an instruction opcode followed by a comma-separated list of zero or more operands, and terminated with a semicolon. Operands may be register variables, constant expressions, address expressions, or label names. Instructions have an optional...", "details": "Instructions are formed from an instruction opcode followed by a comma-separated list of zero or more operands, and terminated with a semicolon.\nOperands may be register variables, constant expressions, address expressions, or label names.\nThe destination operand is first, followed by source operands.\nInstruction keywords are listed in Table 2 .\nAll instruction keywords are reserved tokens in PTX.\nabs | cvta | min | shfl | vadd\nactivemask | discard | mma | shl | vadd2\nadd | div | mov | shr | vadd4", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#instruction-statements", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「指令语句」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「指令语句」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Identifiers", "titleZh": "标识符", "numberedTitle": "4.4. Identifiers", "level": "H2", "chapter": "Syntax", "chapterZh": "语法", "parent": "", "parentZh": "", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "User-defined identifiers follow extended C++ rules: they either start with a letter followed by zero or more letters, digits, underscore, or dollar characters; or they start with an underscore, dollar, or percentage character followed by one or more letters, digits,...", "details": "User-defined identifiers follow extended C++ rules: they either start with a letter followed by zero or more letters, digits, underscore, or dollar characters; or they start with an underscore, dollar, or percentage character followed by one or more letters, digits, underscore, or dollar characters:\nPTX does not specify a maximum length for identifiers and suggests that all implementations support a minimum length of at least 1024 characters.\nMany high-level languages such as C and C++ follow similar rules for identifier names, except that the percentage sign is not allowed.\nPTX allows the percentage sign as the first character of an identifier.\nPTX predefines one constant and a small number of special registers that begin with the percentage sign, listed in Table 3 .\n%aggr_smem_size | %dynamic_smem_size | %lanemask_gt | %reserved_smem_offset_begin\n%clock | %envreg<32> | %lanemask_le | %reserved_smem_offset_cap\n%clock64 | %globaltimer | %lanemask_lt | %reserved_smem_offset_end", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#identifiers", "tokens": ["%aggr_smem_size", "%dynamic_smem_size", "%lanemask_gt", "%reserved_smem_offset_begin", "%clock", "%envreg", "%lanemask_le", "%reserved_smem_offset_cap", "%clock64", "%globaltimer", "%lanemask_lt", "%reserved_smem_offset_end"], "summaryZh": "本条整理 PTX ISA 官方文档中的「标识符」，归在「语法 / Directive」。重点关注 关键词 %aggr_smem_size、%dynamic_smem_size、%lanemask_gt、%reserved_smem_offset_begin、%clock，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「标识符」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：%aggr_smem_size、%dynamic_smem_size、%lanemask_gt、%reserved_smem_offset_begin、%clock、%envreg、%lanemask_le、%reserved_smem_offset_cap。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Constants", "titleZh": "常量", "numberedTitle": "4.5. Constants", "level": "H2", "chapter": "Syntax", "chapterZh": "语法", "parent": "", "parentZh": "", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "PTX supports integer and floating-point constants and constant expressions. These constants may be used in data initialization and as operands to instructions. Type checking rules remain the same for integer, floating-point, and bit-size types. For predicate-type data...", "details": "PTX supports integer and floating-point constants and constant expressions.\nThese constants may be used in data initialization and as operands to instructions.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#constants", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「常量」，归在「语法 / Directive」。重点关注 语法 / Directive，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「常量」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Constants", "titleZh": "Integer 常量", "numberedTitle": "4.5.1. Integer Constants", "level": "H3", "chapter": "Syntax", "chapterZh": "语法", "parent": "Constants", "parentZh": "常量", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "Integer constants are 64-bits in size and are either signed or unsigned, i.e., every integer constant has type .s64 or .u64 . The signed/unsigned nature of an integer constant is needed to correctly evaluate constant expressions containing operations such as division...", "details": "Integer constants are 64-bits in size and are either signed or unsigned, i.e., every integer constant has type .s64 or .u64 .\nThe signed/unsigned nature of an integer constant is needed to correctly evaluate constant expressions containing operations such as division and ordered comparisons, where the behavior of the operation depends on the operand types.\nInteger literals may be written in decimal, hexadecimal, octal, or binary notation.\nThe syntax follows that of C.\nInteger literals are non-negative and have a type determined by their magnitude and optional type suffix as follows: literals are signed ( .s64 ) unless the value cannot be fully represented in .s64 or the unsigned suffix is specified, in which case the literal is unsigned ( .u64 ).\nThe predefined integer constant WARP_SZ specifies the number of threads per warp for the target platform; to date, all target architectures have a WARP_SZ value of 32.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-constants", "tokens": ["s64", "u64", "warp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Integer 常量」，归在「语法 / Directive」。重点关注 关键词 s64、u64、warp，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「Integer 常量」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：s64、u64、warp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Floating-Point Constants", "titleZh": "Floating-Point 常量", "numberedTitle": "4.5.2. Floating-Point Constants", "level": "H3", "chapter": "Syntax", "chapterZh": "语法", "parent": "Constants", "parentZh": "常量", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "Floating-point constants are represented as 64-bit double-precision values, and all floating-point constant expressions are evaluated using 64-bit double precision arithmetic. The only exception is the 32-bit hex notation for expressing an exact single-precision...", "details": "Floating-point constants are represented as 64-bit double-precision values, and all floating-point constant expressions are evaluated using 64-bit double precision arithmetic.\nThe only exception is the 32-bit hex notation for expressing an exact single-precision floating-point value; such values retain their exact 32-bit single-precision value and may not be used in constant expressions.\nFloating-point literals may be written with an optional decimal point and an optional signed exponent.\nUnlike C and C++, there is no suffix letter to specify size; literals are always represented in 64-bit double-precision format.\nPTX includes a second representation of floating-point constants for specifying the exact machine representation using a hexadecimal constant.\nTo specify IEEE 754 double-precision floating point values, the constant begins with 0d or 0D followed by 16 hex digits.\nExample", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#floating-point-constants", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Floating-Point 常量」，归在「语法 / Directive」。重点关注 语法 / Directive，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「Floating-Point 常量」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Predicate Constants", "titleZh": "Predicate 常量", "numberedTitle": "4.5.3. Predicate Constants", "level": "H3", "chapter": "Syntax", "chapterZh": "语法", "parent": "Constants", "parentZh": "常量", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "In PTX, integer constants may be used as predicates. For predicate-type data initializers and instruction operands, integer constants are interpreted as in C, i.e., zero values are False and non-zero values are True .", "details": "In PTX, integer constants may be used as predicates.\nFor predicate-type data initializers and instruction operands, integer constants are interpreted as in C, i.e., zero values are False and non-zero values are True .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#predicate-constants", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Predicate 常量」，归在「语法 / Directive」。重点关注 语法 / Directive，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「Predicate 常量」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Constant Expressions", "titleZh": "常量表达式", "numberedTitle": "4.5.4. Constant Expressions", "level": "H3", "chapter": "Syntax", "chapterZh": "语法", "parent": "Constants", "parentZh": "常量", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "In PTX, constant expressions are formed using operators as in C and are evaluated using rules similar to those in C, but simplified by restricting types and sizes, removing most casts, and defining full semantics to eliminate cases where expression evaluation in C is...", "details": "In PTX, constant expressions are formed using operators as in C and are evaluated using rules similar to those in C, but simplified by restricting types and sizes, removing most casts, and defining full semantics to eliminate cases where expression evaluation in C is implementation dependent.\nConstant expressions are formed from constant literals, unary plus and minus, basic arithmetic operators (addition, subtraction, multiplication, division), comparison operators, the conditional ternary operator ( ?: ), and parentheses.\nInteger constant expressions also allow unary logical negation ( ! ), bitwise complement ( ~ ), remainder ( % ), shift operators ( << and >> ), bit-type operators ( & , | , and ^ ), and logical operators ( && , || ).\nConstant expressions in PTX do not support casts between integer and floating-point.\nConstant expressions are evaluated using the same operator precedence as in C.\nTable 4 gives operator precedence and associativity.\nKind | Operator Symbols | Operator Names | Associates\nPrimary | () | parenthesis | n/a", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#constant-expressions", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「常量表达式」，归在「语法 / Directive」。重点关注 语法 / Directive，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「常量表达式」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Integer Constant Expression Evaluation", "titleZh": "Integer 常量表达式求值", "numberedTitle": "4.5.5. Integer Constant Expression Evaluation", "level": "H3", "chapter": "Syntax", "chapterZh": "语法", "parent": "Constants", "parentZh": "常量", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "Integer constant expressions are evaluated at compile time according to a set of rules that determine the type (signed .s64 versus unsigned .u64 ) of each sub-expression. These rules are based on the rules in C, but they’ve been simplified to apply only to 64-bit...", "details": "Integer constant expressions are evaluated at compile time according to a set of rules that determine the type (signed .s64 versus unsigned .u64 ) of each sub-expression.\nThese rules are based on the rules in C, but they’ve been simplified to apply only to 64-bit integers, and behavior is fully defined in all cases (specifically, for remainder and shift operators).\nLiterals are signed unless unsigned is needed to prevent overflow, or unless the literal uses a U suffix. For example: 42 , 0x1234 , 0123 are signed. 0xfabc123400000000 , 42U , 0x1234U are unsigned.\nUnary plus and minus preserve the type of the input operand. For example: +123 , -1 , -(-42) are signed. -1U , -0xfabc123400000000 are unsigned.\nUnary logical negation ( ! ) produces a signed result with value 0 or 1 .\nUnary bitwise complement ( ~ ) interprets the source operand as unsigned and produces an unsigned result.\nSome binary operators require normalization of source operands. This normalization is known as the usual arithmetic conversions and simply converts both operands to unsigned type if either operand is unsigned.\nAddition, subtraction, multiplication, and division perform the usual arithmetic conversions and produce a result with the same type as the converted operands. That is, the operands and result are unsigned if either source operand is unsigned, and is otherwise signed.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#integer-constant-expression-evaluation", "tokens": ["s64", "u64"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Integer 常量表达式求值」，归在「语法 / Directive」。重点关注 关键词 s64、u64，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「Integer 常量表达式求值」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：s64、u64。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Summary of Constant Expression Evaluation Rules", "titleZh": "摘要 of 常量表达式求值规则", "numberedTitle": "4.5.6. Summary of Constant Expression Evaluation Rules", "level": "H3", "chapter": "Syntax", "chapterZh": "语法", "parent": "Constants", "parentZh": "常量", "kind": "Syntax / Directives", "kindZh": "语法 / Directive", "summary": "Table 5 contains a summary of the constant expression evaluation rules.", "details": "Table 5 contains a summary of the constant expression evaluation rules.\nKind | Operator | Operand Types | Operand Interpretation | Result Type\nPrimary | () | any type | same as source | same as source\nconstant literal | n/a | n/a | .u64 , .s64 , or .f64\nUnary | +- | any type | same as source | same as source\n! | integer | zero or non-zero | .s64\n~ | integer | .u64 | .u64\nCast | (.u64) | integer | .u64 | .u64", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#summary-of-constant-expression-evaluation-rules", "tokens": ["u64", "s64", "f64"], "summaryZh": "本条整理 PTX ISA 官方文档中的「摘要 of 常量表达式求值规则」，归在「语法 / Directive」。重点关注 关键词 u64、s64、f64，适合用于查 PTX 语法、directive 和声明格式。", "detailsZh": "中文提要：这是「摘要 of 常量表达式求值规则」对应的官方条目，分类为「语法 / Directive」。\n阅读重点：查 PTX 语法、directive 和声明格式。\n相关 API / 关键词：u64、s64、f64。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "State Spaces, Types, and Variables", "titleZh": "状态空间、类型与变量", "numberedTitle": "5. State Spaces, Types, and Variables", "level": "H1", "chapter": "Syntax", "chapterZh": "语法", "parent": "", "parentZh": "", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "While the specific resources available in a given target GPU will vary, the kinds of resources will be common across platforms, and these resources are abstracted in PTX through state spaces and data types.", "details": "While the specific resources available in a given target GPU will vary, the kinds of resources will be common across platforms, and these resources are abstracted in PTX through state spaces and data types.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#state-spaces-types-and-variables", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「状态空间、类型与变量」，归在「状态空间 / 类型」。重点关注 状态空间 / 类型，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「状态空间、类型与变量」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "State Spaces", "titleZh": "状态空间", "numberedTitle": "5.1. State Spaces", "level": "H2", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "", "parentZh": "", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "A state space is a storage area with particular characteristics. All variables reside in some state space. The characteristics of a state space include its size, addressability, access speed, access rights, and level of sharing between threads.", "details": "A state space is a storage area with particular characteristics.\nAll variables reside in some state space.\nThe state spaces defined in PTX are a byproduct of parallel programming and graphics programming.\nThe list of state spaces is shown in Table 6 ,and properties of state spaces are shown in Table 7 .\nName | Description\n.reg | Registers, fast.\n.sreg | Special registers. Read-only; pre-defined; platform-specific.\n.const | Shared, read-only memory.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#state-spaces", "tokens": ["reg", "sreg", "const"], "summaryZh": "本条整理 PTX ISA 官方文档中的「状态空间」，归在「状态空间 / 类型」。重点关注 关键词 reg、sreg、const，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「状态空间」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：reg、sreg、const。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Register State Space", "titleZh": "Register 状态空间", "numberedTitle": "5.1.1. Register State Space", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "State Spaces", "parentZh": "状态空间", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "Registers ( .reg state space) are fast storage locations. The number of registers is limited, and will vary from platform to platform. When the limit is exceeded, register variables will be spilled to memory, causing changes in performance. For each architecture, there...", "details": "Registers ( .reg state space) are fast storage locations.\nThe number of registers is limited, and will vary from platform to platform.\nRegisters may be typed (signed integer, unsigned integer, floating point, predicate) or untyped.\nRegister size is restricted; aside from predicate registers which are 1-bit, scalar registers have a width of 8-, 16-, 32-, 64-, or 128-bits, and vector registers have a width of 16-, 32-, 64-, or 128-bits.\nRegisters differ from the other state spaces in that they are not fully addressable, i.e., it is not possible to refer to the address of a register.\nWhen compiling to use the Application Binary Interface (ABI), register variables are restricted to function scope and may not be declared at module scope.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#register-state-space", "tokens": ["reg"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Register 状态空间」，归在「状态空间 / 类型」。重点关注 关键词 reg，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Register 状态空间」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：reg。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Special Register State Space", "titleZh": "特殊寄存器状态空间", "numberedTitle": "5.1.2. Special Register State Space", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "State Spaces", "parentZh": "状态空间", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "The special register ( .sreg ) state space holds predefined, platform-specific registers, such as grid, cluster, CTA, and thread parameters, clock counters, and performance monitoring registers. All special registers are predefined.", "details": "The special register ( .sreg ) state space holds predefined, platform-specific registers, such as grid, cluster, CTA, and thread parameters, clock counters, and performance monitoring registers.\nAll special registers are predefined.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#special-register-state-space", "tokens": ["sreg"], "summaryZh": "本条整理 PTX ISA 官方文档中的「特殊寄存器状态空间」，归在「状态空间 / 类型」。重点关注 关键词 sreg，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「特殊寄存器状态空间」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：sreg。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Constant State Space", "titleZh": "Constant 状态空间", "numberedTitle": "5.1.3. Constant State Space", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "State Spaces", "parentZh": "状态空间", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "The constant ( .const ) state space is a read-only memory initialized by the host. Constant memory is accessed with a ld.const instruction. Constant memory is restricted in size, currently limited to 64 KB which can be used to hold statically-sized constant variables....", "details": "The constant ( .const ) state space is a read-only memory initialized by the host.\nConstant memory is accessed with a ld.const instruction.\nStatically-sized constant variables have an optional variable initializer; constant variables with no explicit initializer are initialized to zero by default.\nConstant buffers allocated by the driver are initialized by the host, and pointers to such buffers are passed to the kernel as parameters.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#constant-state-space", "tokens": ["const", "ld.const"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Constant 状态空间」，归在「状态空间 / 类型」。重点关注 关键词 const、ld.const，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Constant 状态空间」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：const、ld.const。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Banked Constant State Space (deprecated)", "titleZh": "Banked Constant 状态空间（已弃用）", "numberedTitle": "5.1.3.1. Banked Constant State Space (deprecated)", "level": "H4", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Constant State Space", "parentZh": "Constant 状态空间", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "Previous versions of PTX exposed constant memory as a set of eleven 64 KB banks, with explicit bank numbers required for variable declaration and during access.", "details": "Previous versions of PTX exposed constant memory as a set of eleven 64 KB banks, with explicit bank numbers required for variable declaration and during access.\nPrior to PTX ISA version 2.2, the constant memory was organized into fixed size banks.\nThere were eleven 64 KB banks, and banks were specified using the .const[bank] modifier, where bank ranged from 0 to 10.\nBy convention, bank zero was used for all statically-sized constant variables.\nThe remaining banks were used to declare incomplete constant arrays (as in C, for example), where the size is not known at compile time.\nresulted in const_buffer pointing to the start of constant bank two.\nThis pointer could then be used to access the entire 64 KB constant bank.\nTo access data in contant banks 1 through 10, the bank number was required in the state space of the load instruction.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#banked-constant-state-space-deprecated", "tokens": ["const"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Banked Constant 状态空间（已弃用）」，归在「状态空间 / 类型」。重点关注 关键词 const，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Banked Constant 状态空间（已弃用）」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：const。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Global State Space", "titleZh": "Global 状态空间", "numberedTitle": "5.1.4. Global State Space", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "State Spaces", "parentZh": "状态空间", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "The global ( .global ) state space is memory that is accessible by all threads in a context. It is the mechanism by which threads in different CTAs, clusters, and grids can communicate. Use ld.global , st.global , and atom.global to access global variables.", "details": "The global ( .global ) state space is memory that is accessible by all threads in a context.\nIt is the mechanism by which threads in different CTAs, clusters, and grids can communicate.\nGlobal variables have an optional variable initializer; global variables with no explicit initializer are initialized to zero by default.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#global-state-space", "tokens": ["global", "ld.global", "st.global", "atom.global"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Global 状态空间」，归在「状态空间 / 类型」。重点关注 关键词 global、ld.global、st.global、atom.global，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Global 状态空间」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：global、ld.global、st.global、atom.global。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Local State Space", "titleZh": "Local 状态空间", "numberedTitle": "5.1.5. Local State Space", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "State Spaces", "parentZh": "状态空间", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "The local state space ( .local ) is private memory for each thread to keep its own data. It is typically standard memory with cache. The size is limited, as it must be allocated on a per-thread basis. Use ld.local and st.local to access local variables.", "details": "The local state space ( .local ) is private memory for each thread to keep its own data.\nIt is typically standard memory with cache.\nWhen compiling to use the Application Binary Interface (ABI) , .local state-space variables must be declared within function scope and are allocated on the stack.\nIn implementations that do not support a stack, all local memory variables are stored at fixed addresses, recursive function calls are not supported, and .local variables may be declared at module scope.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#local-state-space", "tokens": ["local", "ld.local", "st.local"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Local 状态空间」，归在「状态空间 / 类型」。重点关注 关键词 local、ld.local、st.local，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Local 状态空间」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：local、ld.local、st.local。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parameter State Space", "titleZh": "Parameter 状态空间", "numberedTitle": "5.1.6. Parameter State Space", "level": "H3", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "State Spaces", "parentZh": "状态空间", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "The parameter ( .param ) state space is used (1) to pass input arguments from the host to the kernel, (2a) to declare formal input and return parameters for device functions called from within kernel execution, and (2b) to declare locally-scoped byte array variables...", "details": "The parameter ( .param ) state space is used (1) to pass input arguments from the host to the kernel, (2a) to declare formal input and return parameters for device functions called from within kernel execution, and (2b) to declare locally-scoped byte array variables that serve as function call arguments, typically for passing large structures by value to a function.\nKernel function parameters differ from device function parameters in terms of access and sharing (read-only versus read-write, per-kernel versus per-thread).", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parameter-state-space", "tokens": ["param"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Parameter 状态空间」，归在「状态空间 / 类型」。重点关注 关键词 param，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Parameter 状态空间」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：param。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Kernel Function Parameters", "titleZh": "Kernel 函数参数", "numberedTitle": "5.1.6.1. Kernel Function Parameters", "level": "H4", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Parameter State Space", "parentZh": "Parameter 状态空间", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "Each kernel function definition includes an optional list of parameters. These parameters are addressable, read-only variables declared in the .param state space. Values passed from the host to the kernel are accessed through these parameter variables using ld.param...", "details": "Each kernel function definition includes an optional list of parameters.\nThese parameters are addressable, read-only variables declared in the .param state space.\nThe address of a kernel parameter may be moved into a register using the mov instruction.\nThe resulting address is in the .param state space and is accessed using ld.param instructions.\nExample\nExample\nKernel function parameters may represent normal data values, or they may hold addresses to objects in constant, global, local, or shared state spaces.\nIn the case of pointers, the compiler and runtime system need information about which parameters are pointers, and to which state space they point.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#kernel-function-parameters", "tokens": ["param", "ld.param"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Kernel 函数参数」，归在「状态空间 / 类型」。重点关注 关键词 param、ld.param，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Kernel 函数参数」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：param、ld.param。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Kernel Function Parameter Attributes", "titleZh": "Kernel 函数参数属性", "numberedTitle": "5.1.6.2. Kernel Function Parameter Attributes", "level": "H4", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Parameter State Space", "parentZh": "Parameter 状态空间", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": "Kernel function parameters may be declared with an optional .ptr attribute to indicate that a parameter is a pointer to memory, and also indicate the state space and alignment of the memory being pointed to. Kernel Parameter Attribute: .ptr describes the .ptr kernel...", "details": "Kernel function parameters may be declared with an optional .ptr attribute to indicate that a parameter is a pointer to memory, and also indicate the state space and alignment of the memory being pointed to.\nKernel Parameter Attribute: .ptr describes the .ptr kernel parameter attribute.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#kernel-function-parameter-attributes", "tokens": ["ptr"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Kernel 函数参数属性」，归在「状态空间 / 类型」。重点关注 关键词 ptr，适合用于查状态空间、类型、变量和地址空间语义。", "detailsZh": "中文提要：这是「Kernel 函数参数属性」对应的官方条目，分类为「状态空间 / 类型」。\n阅读重点：查状态空间、类型、变量和地址空间语义。\n相关 API / 关键词：ptr。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Kernel Parameter Attribute: .ptr", "titleZh": "Kernel 参数属性：.ptr", "numberedTitle": "5.1.6.3. Kernel Parameter Attribute: .ptr", "level": "H4", "chapter": "State Spaces, Types, and Variables", "chapterZh": "状态空间、类型与变量", "parent": "Parameter State Space", "parentZh": "Parameter 状态空间", "kind": "State / Types", "kindZh": "状态空间 / 类型", "summary": ".ptr", "details": ".ptr\nKernel parameter alignment attribute.\nSyntax\nDescription\nUsed to specify the state space and, optionally, the alignment of memory pointed to by a pointer type kernel parameter.\nThe alignment value N , if present, must be a power of two.\nSpaces between .ptr , .space , and .align may be eliminated to improve readability.\nPTX ISA Notes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#ker
