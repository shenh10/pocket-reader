vectors of length \\(M\\) and \\(N\\) respectively.", "source": "https://docs.nvidia.com/cuda/cublas/#outer-vector-scaling-for-fp8-data-types", "tokens": ["CUDA_R_16F", "CUDA_R_16BF", "CUDA_R_32F", "CUBLASLT_MATMUL_DESC_A_SCALE_MODE", "CUBLASLT_MATMUL_DESC_B_SCALE_MODE", "CUBLASLT_MATMUL_MATRIX_SCALE_OUTER_VEC_32F"], "summaryZh": "本条整理 cuBLAS 官方文档中的「Outer Vector Scaling for FP8 Data Types」，归在「精度 / Tensor Core」。重点关注 关键词 CUDA_R_16F、CUDA_R_16BF、CUDA_R_32F、CUBLASLT_MATMUL_DESC_A_SCALE_MODE、CUBLASLT_MATMUL_DESC_B_SCALE_MODE，适合用于理解 Tensor Core、数据类型、math mode 和精度/性能取舍。", "detailsZh": "中文提要：这是「Outer Vector Scaling for FP8 Data Types」对应的官方条目，分类为「精度 / Tensor Core」。\n阅读重点：理解 Tensor Core、数据类型、math mode 和精度/性能取舍。\n相关 API / 关键词：CUDA_R_16F、CUDA_R_16BF、CUDA_R_32F、CUBLASLT_MATMUL_DESC_A_SCALE_MODE、CUBLASLT_MATMUL_DESC_B_SCALE_MODE、CUBLASLT_MATMUL_MATRIX_SCALE_OUTER_VEC_32F。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "16/32-Element 1D Block Scaling for FP8 and FP4 Data Types", "titleZh": "16/32-Element 1D Block Scaling for FP8 and FP4 Data Types", "numberedTitle": "3.1.4.4. 16/32-Element 1D Block Scaling for FP8 and FP4 Data Types", "level": "H4", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "Narrow Precision Data Types Usage", "parentZh": "窄精度数据类型用法", "kind": "Precision / Tensor Core", "kindZh": "精度 / Tensor Core", "summary": "1D block scaling aims to overcome limitations of having a single scalar to scale a whole tensor. It is described in more details in the OCP MXFP specification, so we give just a brief overview here. Block scaling means that elements within the same 16- or 32-element...", "details": "1D block scaling aims to overcome limitations of having a single scalar to scale a whole tensor.\nIt is described in more details in the OCP MXFP specification, so we give just a brief overview here.\nCurrently, block scaling is supported for FP8-precision and FP4-precision tensors and mixing precisions is not supported.\nTo enable block scaling, the CUBLASLT_MATMUL_DESC_{X}_SCALE_MODE attributes (here X stands for A , B , C , DOUT , or EPILOGUE_AUX ; see cublasLtMatmulDescAttributes_t ) must be set to CUBLASLT_MATMUL_MATRIX_SCALE_VEC32_UE8M0 for all FP8-precision tensors or to CUBLASLT_MATMUL_MATRIX_SCALE_VEC16_UE4M3 for all FP4-precision tensors.\nWith block scaling, the matmul operation in cuBLAS is defined in the following way (assuming, for exposition, that all tensors are using a narrow precision).\nWe loosely follow the OCP MXFP specification notation.\nFirst, a scaled block (or an MX-compliant format vector in the OCP MXFP specification) is a tuple \\(x = \\left(S^x, \\left[x^i\\right]_{i=1}^k\\right)\\) , where \\(S^x\\) is a shared scaling factor, and each \\(x^i\\) is stored using an FP8 or FP4 data type.\nA dot product of two scaled blocks \\(x = \\left(S^x, \\left[x^i\\right]_{i=1}^{k}\\right)\\) and \\(y = \\left(S^y, \\left[y^i\\right]_{i=1}^{k}\\right)\\) is defined as follows:", "source": "https://docs.nvidia.com/cuda/cublas/#element-1d-block-scaling-for-fp8-and-fp4-data-types", "tokens": ["CUBLASLT_MATMUL_DESC_", "cublasLtMatmulDescAttributes_t", "CUBLASLT_MATMUL_MATRIX_SCALE_VEC32_UE8M0", "CUBLASLT_MATMUL_MATRIX_SCALE_VEC16_UE4M3", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「16/32-Element 1D Block Scaling for FP8 and FP4 Data Types」，归在「精度 / Tensor Core」。重点关注 关键词 CUBLASLT_MATMUL_DESC_、cublasLtMatmulDescAttributes_t、CUBLASLT_MATMUL_MATRIX_SCALE_VEC32_UE8M0、CUBLASLT_MATMUL_MATRIX_SCALE_VEC16_UE4M3、cuBLAS，适合用于理解 Tensor Core、数据类型、math mode 和精度/性能取舍。", "detailsZh": "中文提要：这是「16/32-Element 1D Block Scaling for FP8 and FP4 Data Types」对应的官方条目，分类为「精度 / Tensor Core」。\n阅读重点：理解 Tensor Core、数据类型、math mode 和精度/性能取舍。\n相关 API / 关键词：CUBLASLT_MATMUL_DESC_、cublasLtMatmulDescAttributes_t、CUBLASLT_MATMUL_MATRIX_SCALE_VEC32_UE8M0、CUBLASLT_MATMUL_MATRIX_SCALE_VEC16_UE4M3、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "1D Block Quantization", "titleZh": "1D Block 量化", "numberedTitle": "3.1.4.4.1. 1D Block Quantization", "level": "H5", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "16/32-Element 1D Block Scaling for FP8 and FP4 Data Types", "parentZh": "16/32-Element 1D Block Scaling for FP8 and FP4 Data Types", "kind": "Guide", "kindZh": "指南章节", "summary": "Consider a single block of \\(k\\) elements of \\(D\\) in the \\(M\\) dimension: \\(D^b_{fp32} = \\left[d^i_{fp32}\\right]_{i=1}^k\\) . Quantization of partial blocks is performed as if the missing values are zero. Let \\(Amax(DType)\\) be the maximal value representable in the...", "details": "Consider a single block of \\(k\\) elements of \\(D\\) in the \\(M\\) dimension: \\(D^b_{fp32} = \\left[d^i_{fp32}\\right]_{i=1}^k\\) .\nQuantization of partial blocks is performed as if the missing values are zero.\nThe following computations steps are common to all combinations of output and scaling factors data types.\nCompute the block absolute maximum value \\(Amax(D^b_{fp32}) = max(\\{|d_i|\\}_{i=1}^k)\\) .\nCompute the block scaling factor in single precision as \\(S^b_{fp32} = \\frac{Amax(D^b_{fp32})}{Amax(DType)}\\) .\nComputing scaling and conversion factors for FP8 with UE8M0 scales\nComputations consist of the following steps:\nExtract the block scaling factor exponent without bias adjustment as an integer \\(E^b_{int}\\) and mantissa as a fixed point number \\(M^b_{fixp}\\) from \\(S^b_{fp32}\\) (the actual implementation operates on bit representation directly).", "source": "https://docs.nvidia.com/cuda/cublas/#d-block-quantization", "tokens": [], "summaryZh": "本条整理 cuBLAS 官方文档中的「1D Block 量化」，归在「指南章节」。重点关注 指南章节，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「1D Block 量化」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "1D Block Scaling Factors Layout", "titleZh": "1D Block scaling factor 布局", "numberedTitle": "3.1.4.4.2. 1D Block Scaling Factors Layout", "level": "H5", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "16/32-Element 1D Block Scaling for FP8 and FP4 Data Types", "parentZh": "16/32-Element 1D Block Scaling for FP8 and FP4 Data Types", "kind": "Guide", "kindZh": "指南章节", "summary": "Scaling factors are stored using a tiled layout. The following figure shows how each 128x4 tile is laid out in memory. The offset in memory is increasing from left to right, and then from top to bottom.", "details": "Scaling factors are stored using a tiled layout.\nThe following figure shows how each 128x4 tile is laid out in memory.\nThe following pseudocode can be used to translate from inner (K for A and B, and M for C or D) and outer (M for A, and N for B, C and D) indices to linear offset within a tile and back:\nA single tile of scaling factors is applied to a 128x64 block when the scaling mode is CUBLASLT_MATMUL_MATRIX_SCALE_VEC16_UE4M3 and to a 128x128 block when it is CUBLASLT_MATMUL_MATRIX_SCALE_VEC32_UE8M0 .\nMultiple blocks are arranged in the row-major manner.\nThe next picture shows an example.\nIn general, for a scaling factors tensor with sf_inner_dim scaling factors per row, offset of a block with top left coordinate (sf_outer, sf_inner) (using the same correspondence to matrix coordinates as noted above) can be computed using the following pseudocode:", "source": "https://docs.nvidia.com/cuda/cublas/#d-block-scaling-factors-layout", "tokens": ["CUBLASLT_MATMUL_MATRIX_SCALE_VEC16_UE4M3", "CUBLASLT_MATMUL_MATRIX_SCALE_VEC32_UE8M0"], "summaryZh": "本条整理 cuBLAS 官方文档中的「1D Block scaling factor 布局」，归在「指南章节」。重点关注 关键词 CUBLASLT_MATMUL_MATRIX_SCALE_VEC16_UE4M3、CUBLASLT_MATMUL_MATRIX_SCALE_VEC32_UE8M0，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「1D Block scaling factor 布局」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：CUBLASLT_MATMUL_MATRIX_SCALE_VEC16_UE4M3、CUBLASLT_MATMUL_MATRIX_SCALE_VEC32_UE8M0。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "128-element 1D and 128x128 2D Block Scaling For FP8 Data Types", "titleZh": "128-element 1D and 128x128 2D Block Scaling For FP8 Data Types", "numberedTitle": "3.1.4.5. 128-element 1D and 128x128 2D Block Scaling For FP8 Data Types", "level": "H4", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "Narrow Precision Data Types Usage", "parentZh": "窄精度数据类型用法", "kind": "Precision / Tensor Core", "kindZh": "精度 / Tensor Core", "summary": "These two scaling modes apply principles of the scaling approach described 16/32-Element 1D Block Scaling for FP8 and FP4 Data Types to the Hopper GPU architecture. However, here the scaling data type is CUDA_R_32F , and different scaling modes can be used for \\(A\\)...", "details": "These two scaling modes apply principles of the scaling approach described 16/32-Element 1D Block Scaling for FP8 and FP4 Data Types to the Hopper GPU architecture.\nHowever, here the scaling data type is CUDA_R_32F , and different scaling modes can be used for \\(A\\) and \\(B\\) , and the only supported precisions for \\(D\\) are CUDA_R_16F , CUDA_R_16BF , and CUDA_R_32F .\nTo enable this scaling mode, the CUBLASLT_MATMUL_DESC_{X}_SCALE_MODE attributes (here X stands for A or B ), must be set to CUBLASLT_MATMUL_MATRIX_SCALE_VEC128_32F or CUBLASLT_MATMUL_MATRIX_SCALE_BLK128x128_32F , while all the other scaling modes must not be modified.\nThe following table shows supported combinations:\nCUBLASLT_MATMUL_DESC_A_SCALE_MODE | CUBLASLT_MATMUL_DESC_B_SCALE_MODE | Supported?\nCUBLASLT_MATMUL_MATRIX_SCALE_VEC128_32F | CUBLASLT_MATMUL_MATRIX_SCALE_VEC128_32F | Yes\nCUBLASLT_MATMUL_MATRIX_SCALE_VEC128_32F | CUBLASLT_MATMUL_MATRIX_SCALE_BLK128x128_32F | Yes\nCUBLASLT_MATMUL_MATRIX_SCALE_BLK128x128_32F | CUBLASLT_MATMUL_MATRIX_SCALE_VEC128_32F | Yes", "source": "https://docs.nvidia.com/cuda/cublas/#element-1d-and-128x128-2d-block-scaling-for-fp8-data-types", "tokens": ["CUDA_R_32F", "CUDA_R_16F", "CUDA_R_16BF", "CUBLASLT_MATMUL_DESC_", "CUBLASLT_MATMUL_MATRIX_SCALE_VEC128_32F", "CUBLASLT_MATMUL_MATRIX_SCALE_BLK128", "CUBLASLT_MATMUL_DESC_A_SCALE_MODE", "CUBLASLT_MATMUL_DESC_B_SCALE_MODE"], "summaryZh": "本条整理 cuBLAS 官方文档中的「128-element 1D and 128x128 2D Block Scaling For FP8 Data Types」，归在「精度 / Tensor Core」。重点关注 关键词 CUDA_R_32F、CUDA_R_16F、CUDA_R_16BF、CUBLASLT_MATMUL_DESC_、CUBLASLT_MATMUL_MATRIX_SCALE_VEC128_32F，适合用于理解 Tensor Core、数据类型、math mode 和精度/性能取舍。", "detailsZh": "中文提要：这是「128-element 1D and 128x128 2D Block Scaling For FP8 Data Types」对应的官方条目，分类为「精度 / Tensor Core」。\n阅读重点：理解 Tensor Core、数据类型、math mode 和精度/性能取舍。\n相关 API / 关键词：CUDA_R_32F、CUDA_R_16F、CUDA_R_16BF、CUBLASLT_MATMUL_DESC_、CUBLASLT_MATMUL_MATRIX_SCALE_VEC128_32F、CUBLASLT_MATMUL_MATRIX_SCALE_BLK128、CUBLASLT_MATMUL_DESC_A_SCALE_MODE、CUBLASLT_MATMUL_DESC_B_SCALE_MODE。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Scaling factors layouts", "titleZh": "Scaling factor 布局", "numberedTitle": "3.1.4.5.1. Scaling factors layouts", "level": "H5", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "128-element 1D and 128x128 2D Block Scaling For FP8 Data Types", "parentZh": "128-element 1D and 128x128 2D Block Scaling For FP8 Data Types", "kind": "Guide", "kindZh": "指南章节", "summary": "Then for the CUBLASLT_MATMUL_MATRIX_SCALE_VEC128_32F scaling mode, the scaling factors are:", "details": "Then for the CUBLASLT_MATMUL_MATRIX_SCALE_VEC128_32F scaling mode, the scaling factors are:\n\\(M\\) -major for \\(A\\) with shape \\(M \\times L\\) ( \\(M\\) -major means that elements along the \\(M\\) dimension are contiguous in memory),\n\\(N\\) -major for \\(B\\) with shape \\(N \\times L\\) .\nFor the CUBLASLT_MATMUL_MATRIX_SCALE_BLK128x128_32F scaling mode, the scaling factors are \\(K\\) -major and the stride between the consecutive columns must be a multiple of 4.\nLet \\(L_4 = \\lceil L \\rceil_4\\) , where the \\(\\lceil \\cdot \\rceil_4\\) denotes rounding up to the nearest multiple of 4.\nfor \\(A\\) , the shape of the scaling factors is \\(L_4 \\times \\lceil \\frac{M}{128} \\rceil\\) ,\nfor \\(B\\) , the shape of the scaling factors is \\(L_4 \\times \\lceil \\frac{N}{128} \\rceil\\) .", "source": "https://docs.nvidia.com/cuda/cublas/#scaling-factors-layouts", "tokens": ["CUBLASLT_MATMUL_MATRIX_SCALE_VEC128_32F", "CUBLASLT_MATMUL_MATRIX_SCALE_BLK128"], "summaryZh": "本条整理 cuBLAS 官方文档中的「Scaling factor 布局」，归在「指南章节」。重点关注 关键词 CUBLASLT_MATMUL_MATRIX_SCALE_VEC128_32F、CUBLASLT_MATMUL_MATRIX_SCALE_BLK128，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「Scaling factor 布局」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：CUBLASLT_MATMUL_MATRIX_SCALE_VEC128_32F、CUBLASLT_MATMUL_MATRIX_SCALE_BLK128。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Disabling CPU Instructions", "titleZh": "禁用 CPU 指令", "numberedTitle": "3.1.5. Disabling CPU Instructions", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "General Description", "parentZh": "总体说明", "kind": "Guide", "kindZh": "指南章节", "summary": "As mentioned in the Heuristics Cache section, cuBLASLt heuristics perform some compute-intensive operations on the host CPU. To speed-up the operations, the implementation detects CPU capabilities and may use special instructions, such as Advanced Vector Extensions...", "details": "As mentioned in the Heuristics Cache section, cuBLASLt heuristics perform some compute-intensive operations on the host CPU.\nTo speed-up the operations, the implementation detects CPU capabilities and may use special instructions, such as Advanced Vector Extensions (AVX) on x86-64 CPUs.\nThe user can optionally instruct the cuBLASLt library to not use some CPU instructions with the CUBLASLT_DISABLE_CPU_INSTRUCTIONS_MASK environment variable or with the cublasLtDisableCpuInstructionsSetMask() function which has higher precedence.\nThe default mask is 0, meaning that there are no restrictions.\nPlease check cublasLtDisableCpuInstructionsSetMask() for more information.", "source": "https://docs.nvidia.com/cuda/cublas/#disabling-cpu-instructions", "tokens": ["cuBLASLt", "CUBLASLT_DISABLE_CPU_INSTRUCTIONS_MASK", "cublasLtDisableCpuInstructionsSetMask"], "summaryZh": "本条整理 cuBLAS 官方文档中的「禁用 CPU 指令」，归在「指南章节」。重点关注 关键词 cuBLASLt、CUBLASLT_DISABLE_CPU_INSTRUCTIONS_MASK、cublasLtDisableCpuInstructionsSetMask，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「禁用 CPU 指令」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLASLt、CUBLASLT_DISABLE_CPU_INSTRUCTIONS_MASK、cublasLtDisableCpuInstructionsSetMask。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cuBLASLt Code Examples", "titleZh": "cuBLASLt Code Examples", "numberedTitle": "3.2. cuBLASLt Code Examples", "level": "H2", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "Please visit https://github.com/NVIDIA/CUDALibrarySamples/tree/main/cuBLASLt for updated code examples.", "details": "Please visit https://github.com/NVIDIA/CUDALibrarySamples/tree/main/cuBLASLt for updated code examples.", "source": "https://docs.nvidia.com/cuda/cublas/#cublaslt-code-examples", "tokens": ["cuBLASLt", "github.com"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cuBLASLt Code Examples」，归在「指南章节」。重点关注 关键词 cuBLASLt、github.com，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cuBLASLt Code Examples」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLASLt、github.com。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cuBLASLt Datatypes Reference", "titleZh": "cuBLASLt Datatypes Reference", "numberedTitle": "3.3. cuBLASLt Datatypes Reference", "level": "H2", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "", "parentZh": "", "kind": "Types / Status", "kindZh": "类型 / 状态码", "summary": "cuBLAS 文档章节：cuBLASLt Datatypes Reference", "details": "", "source": "https://docs.nvidia.com/cuda/cublas/#cublaslt-datatypes-reference", "tokens": ["cuBLASLt", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cuBLASLt Datatypes Reference」，归在「类型 / 状态码」。重点关注 关键词 cuBLASLt、cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cuBLASLt Datatypes Reference」对应的官方条目，分类为「类型 / 状态码」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLASLt、cuBLAS。"}, {"title": "cublasLtClusterShape_t", "titleZh": "cublasLtClusterShape_t", "numberedTitle": "3.3.1. cublasLtClusterShape_t", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "cuBLASLt Datatypes Reference", "parentZh": "cuBLASLt Datatypes Reference", "kind": "Types / Status", "kindZh": "类型 / 状态码", "summary": "cublasLtClusterShape_t is an enumerated type used to configure thread block cluster dimensions. Thread block clusters add an optional hierarchical level and are made up of thread blocks. Similar to thread blocks, these can be one, two, or three-dimensional. See also...", "details": "cublasLtClusterShape_t is an enumerated type used to configure thread block cluster dimensions.\nThread block clusters add an optional hierarchical level and are made up of thread blocks.\nValue | Description\nCUBLASLT_CLUSTER_SHAPE_AUTO | Cluster shape is automatically selected.\nCUBLASLT_CLUSTER_SHAPE_1x1x1 | Cluster shape is 1 x 1 x 1.\nCUBLASLT_CLUSTER_SHAPE_1x2x1 | Cluster shape is 1 x 2 x 1.\nCUBLASLT_CLUSTER_SHAPE_1x4x1 | Cluster shape is 1 x 4 x 1.\nCUBLASLT_CLUSTER_SHAPE_2x1x1 | Cluster shape is 2 x 1 x 1.", "source": "https://docs.nvidia.com/cuda/cublas/#cublasltclustershape-t", "tokens": ["cublasLtClusterShape_t", "CUBLASLT_CLUSTER_SHAPE_AUTO", "CUBLASLT_CLUSTER_SHAPE_1", "CUBLASLT_CLUSTER_SHAPE_2"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtClusterShape_t」，归在「类型 / 状态码」。重点关注 关键词 cublasLtClusterShape_t、CUBLASLT_CLUSTER_SHAPE_AUTO、CUBLASLT_CLUSTER_SHAPE_1、CUBLASLT_CLUSTER_SHAPE_2，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublasLtClusterShape_t」对应的官方条目，分类为「类型 / 状态码」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublasLtClusterShape_t、CUBLASLT_CLUSTER_SHAPE_AUTO、CUBLASLT_CLUSTER_SHAPE_1、CUBLASLT_CLUSTER_SHAPE_2。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasLtEpilogue_t", "titleZh": "cublasLtEpilogue_t", "numberedTitle": "3.3.2. cublasLtEpilogue_t", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "cuBLASLt Datatypes Reference", "parentZh": "cuBLASLt Datatypes Reference", "kind": "Logging / Debug", "kindZh": "日志 / 调试", "summary": "The cublasLtEpilogue_t is an enum type to set the postprocessing options for the epilogue.", "details": "The cublasLtEpilogue_t is an enum type to set the postprocessing options for the epilogue.\nValue | Description\nCUBLASLT_EPILOGUE_DEFAULT = 1 | No special postprocessing, just scale and quantize the results if necessary.\nCUBLASLT_EPILOGUE_RELU = 2 | Apply ReLU point-wise transform to the results ( x := max(x, 0) ).\nCUBLASLT_EPILOGUE_RELU_AUX = CUBLASLT_EPILOGUE_RELU | 128 | Apply ReLU point-wise transform to the results ( x := max(x, 0) ). This epilogue mode produces an extra output, see CUBLASLT_MATMUL_DESC_EPILOGUE_AUX_POINTER of cublasLtMatmulDescAttributes_t .\nCUBLASLT_EPILOGUE_BIAS = 4 | Apply (broadcast) bias from the bias vector. Bias vector length must match matrix D rows, and it must be packed (such as stride between vector elements is 1). Bias vector is broadcast to all columns and added before applying the final postprocessing.\nCUBLASLT_EPILOGUE_RELU_BIAS = CUBLASLT_EPILOGUE_RELU = CUBLASLT_EPILOGUE_BIAS | Apply bias and then ReLU transform.\nCUBLASLT_EPILOGUE_RELU_AUX_BIAS = CUBLASLT_EPILOGUE_RELU_AUX = CUBLASLT_EPILOGUE_BIAS | Apply bias and then ReLU transform. This epilogue mode produces an extra output, see CUBLASLT_MATMUL_DESC_EPILOGUE_AUX_POINTER of cublasLtMatmulDescAttributes_t .", "source": "https://docs.nvidia.com/cuda/cublas/#cublasltepilogue-t", "tokens": ["cublasLtEpilogue_t", "CUBLASLT_EPILOGUE_DEFAULT", "CUBLASLT_EPILOGUE_RELU", "CUBLASLT_EPILOGUE_RELU_AUX", "CUBLASLT_MATMUL_DESC_EPILOGUE_AUX_POINTER", "cublasLtMatmulDescAttributes_t", "CUBLASLT_EPILOGUE_BIAS", "CUBLASLT_EPILOGUE_RELU_BIAS", "CUBLASLT_EPILOGUE_RELU_AUX_BIAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtEpilogue_t」，归在「日志 / 调试」。重点关注 关键词 cublasLtEpilogue_t、CUBLASLT_EPILOGUE_DEFAULT、CUBLASLT_EPILOGUE_RELU、CUBLASLT_EPILOGUE_RELU_AUX、CUBLASLT_MATMUL_DESC_EPILOGUE_AUX_POINTER，适合用于打开日志、定位状态码和调试运行时问题。", "detailsZh": "中文提要：这是「cublasLtEpilogue_t」对应的官方条目，分类为「日志 / 调试」。\n阅读重点：打开日志、定位状态码和调试运行时问题。\n相关 API / 关键词：cublasLtEpilogue_t、CUBLASLT_EPILOGUE_DEFAULT、CUBLASLT_EPILOGUE_RELU、CUBLASLT_EPILOGUE_RELU_AUX、CUBLASLT_MATMUL_DESC_EPILOGUE_AUX_POINTER、cublasLtMatmulDescAttributes_t、CUBLASLT_EPILOGUE_BIAS、CUBLASLT_EPILOGUE_RELU_BIAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasLtHandle_t", "titleZh": "cublasLtHandle_t", "numberedTitle": "3.3.3. cublasLtHandle_t", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "cuBLASLt Datatypes Reference", "parentZh": "cuBLASLt Datatypes Reference", "kind": "Types / Status", "kindZh": "类型 / 状态码", "summary": "The cublasLtHandle_t type is a pointer type to an opaque structure holding the cuBLASLt library context. Use cublasLtCreate() to initialize the cuBLASLt library context and return a handle to an opaque structure holding the cuBLASLt library context, and use...", "details": "The cublasLtHandle_t type is a pointer type to an opaque structure holding the cuBLASLt library context.\nUse cublasLtCreate() to initialize the cuBLASLt library context and return a handle to an opaque structure holding the cuBLASLt library context, and use cublasLtDestroy() to destroy a previously created cuBLASLt library context descriptor and release the resources.", "source": "https://docs.nvidia.com/cuda/cublas/#cublaslthandle-t", "tokens": ["cublasLtHandle_t", "cuBLASLt", "cublasLtCreate", "cublasLtDestroy"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtHandle_t」，归在「类型 / 状态码」。重点关注 关键词 cublasLtHandle_t、cuBLASLt、cublasLtCreate、cublasLtDestroy，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublasLtHandle_t」对应的官方条目，分类为「类型 / 状态码」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublasLtHandle_t、cuBLASLt、cublasLtCreate、cublasLtDestroy。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasLtLoggerCallback_t", "titleZh": "cublasLtLoggerCallback_t", "numberedTitle": "3.3.4. cublasLtLoggerCallback_t", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "cuBLASLt Datatypes Reference", "parentZh": "cuBLASLt Datatypes Reference", "kind": "Logging / Debug", "kindZh": "日志 / 调试", "summary": "cublasLtLoggerCallback_t is a callback function pointer type. A callback function can be set using cublasLtLoggerSetCallback() .", "details": "cublasLtLoggerCallback_t is a callback function pointer type.\nA callback function can be set using cublasLtLoggerSetCallback() .\nParameters :\nParameter | Memory | Input / Output | Description\nlogLevel | Output | See cuBLASLt Logging .\nfunctionName | Output | The name of the API that logged this message.\nmessage | Output | The log message.", "source": "https://docs.nvidia.com/cuda/cublas/#cublasltloggercallback-t", "tokens": ["cublasLtLoggerCallback_t", "cublasLtLoggerSetCallback", "cuBLASLt"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtLoggerCallback_t」，归在「日志 / 调试」。重点关注 关键词 cublasLtLoggerCallback_t、cublasLtLoggerSetCallback、cuBLASLt，适合用于打开日志、定位状态码和调试运行时问题。", "detailsZh": "中文提要：这是「cublasLtLoggerCallback_t」对应的官方条目，分类为「日志 / 调试」。\n阅读重点：打开日志、定位状态码和调试运行时问题。\n相关 API / 关键词：cublasLtLoggerCallback_t、cublasLtLoggerSetCallback、cuBLASLt。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasLtMatmulAlgo_t", "titleZh": "cublasLtMatmulAlgo_t", "numberedTitle": "3.3.5. cublasLtMatmulAlgo_t", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "cuBLASLt Datatypes Reference", "parentZh": "cuBLASLt Datatypes Reference", "kind": "cuBLASLt / Matmul", "kindZh": "cuBLASLt / Matmul", "summary": "cublasLtMatmulAlgo_t is an opaque structure holding the description of the matrix multiplication algorithm. This structure can be trivially serialized and later restored for use with the same version of cuBLAS library to save on selecting the right configuration again.", "details": "cublasLtMatmulAlgo_t is an opaque structure holding the description of the matrix multiplication algorithm.\nThis structure can be trivially serialized and later restored for use with the same version of cuBLAS library to save on selecting the right configuration again.", "source": "https://docs.nvidia.com/cuda/cublas/#cublasltmatmulalgo-t", "tokens": ["cublasLtMatmulAlgo_t", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtMatmulAlgo_t」，归在「cuBLASLt / Matmul」。重点关注 关键词 cublasLtMatmulAlgo_t、cuBLAS，适合用于梳理 Lt Matmul、heuristics、preference 和 workspace 调优。", "detailsZh": "中文提要：这是「cublasLtMatmulAlgo_t」对应的官方条目，分类为「cuBLASLt / Matmul」。\n阅读重点：梳理 Lt Matmul、heuristics、preference 和 workspace 调优。\n相关 API / 关键词：cublasLtMatmulAlgo_t、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasLtMatmulAlgoCapAttributes_t", "titleZh": "cublasLtMatmulAlgoCapAttributes_t", "numberedTitle": "3.3.6. cublasLtMatmulAlgoCapAttributes_t", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "cuBLASLt Datatypes Reference", "parentZh": "cuBLASLt Datatypes Reference", "kind": "cuBLASLt / Matmul", "kindZh": "cuBLASLt / Matmul", "summary": "cublasLtMatmulAlgoCapAttributes_t enumerates matrix multiplication algorithm capability attributes that can be retrieved from an initialized cublasLtMatmulAlgo_t descriptor using cublasLtMatmulAlgoCapGetAttribute() .", "details": "cublasLtMatmulAlgoCapAttributes_t enumerates matrix multiplication algorithm capability attributes that can be retrieved from an initialized cublasLtMatmulAlgo_t descriptor using cublasLtMatmulAlgoCapGetAttribute() .\nValue | Description | Data Type\nCUBLASLT_ALGO_CAP_SPLITK_SUPPORT | Support for split-K. Boolean (0 or 1) to express if split-K implementation is supported. 0 means no support, and supported otherwise. See CUBLASLT_ALGO_CONFIG_SPLITK_NUM of cublasLtMatmulAlgoConfigAttributes_t . | int32_t\nCUBLASLT_ALGO_CAP_REDUCTION_SCHEME_MASK | Mask to express the types of reduction schemes supported, see cublasLtReductionScheme_t . If the reduction scheme is not masked out then it is supported. For example: int isReductionSchemeComputeTypeSupported ? (reductionSchemeMask & CUBLASLT_REDUCTION_SCHEME_COMPUTE_TYPE) == CUBLASLT_REDUCTION_SCHEME_COMPUTE_TYPE ? 1 : 0; | uint32_t\nCUBLASLT_ALGO_CAP_CTA_SWIZZLING_SUPPORT | Support for CTA-swizzling. Boolean (0 or 1) to express if CTA-swizzling implementation is supported. 0 means no support, and 1 means supported value of 1; other values are reserved. See also CUBLASLT_ALGO_CONFIG_CTA_SWIZZLING of cublasLtMatmulAlgoConfigAttributes_t . | uint32_t\nCUBLASLT_ALGO_CAP_STRIDED_BATCH_SUPPORT | Support strided batch. 0 means no support, supported otherwise. | int32_t\nCUBLASLT_ALGO_CAP_POINTER_ARRAY_BATCH_SUPPORT | Support pointer array batch. 0 means no support, supported otherwise. | int32_t\nCUBLASLT_ALGO_CAP_POINTER_ARRAY_GROUPED_SUPPORT | Experimental: Support pointer array grouped batch. 0 means no support, supported otherwise. See CUBLASLT_BATCH_MODE_GROUPED of cublasLtBatchMode_t . | int32_t", "source": "https://docs.nvidia.com/cuda/cublas/#cublasltmatmulalgocapattributes-t", "tokens": ["cublasLtMatmulAlgoCapAttributes_t", "cublasLtMatmulAlgo_t", "cublasLtMatmulAlgoCapGetAttribute", "CUBLASLT_ALGO_CAP_SPLITK_SUPPORT", "CUBLASLT_ALGO_CONFIG_SPLITK_NUM", "cublasLtMatmulAlgoConfigAttributes_t", "CUBLASLT_ALGO_CAP_REDUCTION_SCHEME_MASK", "cublasLtReductionScheme_t", "CUBLASLT_REDUCTION_SCHEME_COMPUTE_TYPE", "CUBLASLT_ALGO_CAP_CTA_SWIZZLING_SUPPORT", "CUBLASLT_ALGO_CONFIG_CTA_SWIZZLING", "CUBLASLT_ALGO_CAP_STRIDED_BATCH_SUPPORT"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtMatmulAlgoCapAttributes_t」，归在「cuBLASLt / Matmul」。重点关注 关键词 cublasLtMatmulAlgoCapAttributes_t、cublasLtMatmulAlgo_t、cublasLtMatmulAlgoCapGetAttribute、CUBLASLT_ALGO_CAP_SPLITK_SUPPORT、CUBLASLT_ALGO_CONFIG_SPLITK_NUM，适合用于梳理 Lt Matmul、heuristics、preference 和 work ed according to CUBLASLT_ALGO_CONFIG_REDUCTION_SCHEME . | uint32_t\nCUBLASLT_ALGO_CONFIG_REDUCTION_SCHEME | Reduction scheme to use when splitK value > 1. Default: CUBLASLT_REDUCTION_SCHEME_NONE . See cublasLtReductionScheme_t . | uint32_t", "source": "https://docs.nvidia.com/cuda/cublas/#cublasltmatmulalgoconfigattributes-t", "tokens": ["cublasLtMatmulAlgoConfigAttributes_t", "cuBLASLt", "CUBLASLT_ALGO_CONFIG_ID", "cublasLtMatmulAlgoGetIds", "cublasLtMatmulAlgoInit", "CUBLASLT_ALGO_CONFIG_TILE_ID", "cublasLtMatmulTile_t", "CUBLASLT_MATMUL_TILE_UNDEFINED", "CUBLASLT_ALGO_CONFIG_STAGES_ID", "cublasLtMatmulStages_t", "CUBLASLT_MATMUL_STAGES_UNDEFINED", "CUBLASLT_ALGO_CONFIG_SPLITK_NUM"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtMatmulAlgoConfigAttributes_t」，归在「cuBLASLt / Matmul」。重点关注 关键词 cublasLtMatmulAlgoConfigAttributes_t、cuBLASLt、CUBLASLT_ALGO_CONFIG_ID、cublasLtMatmulAlgoGetIds、cublasLtMatmulAlgoInit，适合用于梳理 Lt Matmul、heuristics、preference 和 workspace 调优。", "detailsZh": "中文提要：这是「cublasLtMatmulAlgoConfigAttributes_t」对应的官方条目，分类为「cuBLASLt / Matmul」。\n阅读重点：梳理 Lt Matmul、heuristics、preference 和 workspace 调优。\n相关 API / 关键词：cublasLtMatmulAlgoConfigAttributes_t、cuBLASLt、CUBLASLT_ALGO_CONFIG_ID、cublasLtMatmulAlgoGetIds、cublasLtMatmulAlgoInit、CUBLASLT_ALGO_CONFIG_TILE_ID、cublasLtMatmulTile_t、CUBLASLT_MATMUL_TILE_UNDEFINED。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasLtMatmulDesc_t", "titleZh": "cublasLtMatmulDesc_t", "numberedTitle": "3.3.8. cublasLtMatmulDesc_t", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "cuBLASLt Datatypes Reference", "parentZh": "cuBLASLt Datatypes Reference", "kind": "cuBLASLt / Matmul", "kindZh": "cuBLASLt / Matmul", "summary": "The cublasLtMatmulDesc_t is a pointer to an opaque structure holding the description of the matrix multiplication operation cublasLtMatmul() . A descriptor can be created by calling cublasLtMatmulDescCreate() and destroyed by calling cublasLtMatmulDescDestroy() .", "details": "The cublasLtMatmulDesc_t is a pointer to an opaque structure holding the description of the matrix multiplication operation cublasLtMatmul() .\nA descriptor can be created by calling cublasLtMatmulDescCreate() and destroyed by calling cublasLtMatmulDescDestroy() .", "source": "https://docs.nvidia.com/cuda/cublas/#cublasltmatmuldesc-t", "tokens": ["cublasLtMatmulDesc_t", "cublasLtMatmul", "cublasLtMatmulDescCreate", "cublasLtMatmulDescDestroy"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtMatmulDesc_t」，归在「cuBLASLt / Matmul」。重点关注 关键词 cublasLtMatmulDesc_t、cublasLtMatmul、cublasLtMatmulDescCreate、cublasLtMatmulDescDestroy，适合用于梳理 Lt Matmul、heuristics、preference 和 workspace 调优。", "detailsZh": "中文提要：这是「cublasLtMatmulDesc_t」对应的官方条目，分类为「cuBLASLt / Matmul」。\n阅读重点：梳理 Lt Matmul、heuristics、preference 和 workspace 调优。\n相关 API / 关键词：cublasLtMatmulDesc_t、cublasLtMatmul、cublasLtMatmulDescCreate、cublasLtMatmulDescDestroy。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasLtMatmulDescAttributes_t", "titleZh": "cublasLtMatmulDescAttributes_t", "numberedTitle": "3.3.9. cublasLtMatmulDescAttributes_t", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "cuBLASLt Datatypes Reference", "parentZh": "cuBLASLt Datatypes Reference", "kind": "cuBLASLt / Matmul", "kindZh": "cuBLASLt / Matmul", "summary": "cublasLtMatmulDescAttributes_t is a descriptor structure containing the attributes that define the specifics of the matrix multiply operation. Use cublasLtMatmulDescGetAttribute() and cublasLtMatmulDescSetAttribute() to get and set the attribute value of a matmul...", "details": "cublasLtMatmulDescAttributes_t is a descriptor structure containing the attributes that define the specifics of the matrix multiply operation.\nUse cublasLtMatmulDescGetAttribute() and cublasLtMatmulDescSetAttribute() to get and set the attribute value of a matmul descriptor.\nValue | Description | Data Type\nCUBLASLT_MATMUL_DESC_COMPUTE_TYPE | Compute type. Defines the data type used for multiply and accumulate operations, and the accumulator during the matrix multiplication. See cublasComputeType_t . | int32_t\nCUBLASLT_MATMUL_DESC_SCALE_TYPE | Scale type. Defines the data type of the scaling factors alpha and beta . The accumulator value and the value from matrix C are typically converted to scale type before final scaling. The value is then converted from scale type to the type of matrix D before storing in memory. The default value depends on CUBLASLT_MATMUL_DESC_COMPUTE_TYPE . See cudaDataType_t . | int32_t\nCUBLASLT_MATMUL_DESC_POINTER_MODE | Specifies alpha and beta are passed by reference, whether they are scalars on the host or on the device, or device vectors. Default value is: CUBLASLT_POINTER_MODE_HOST (i.e., on the host). See cublasLtPointerMode_t . | int32_t\nCUBLASLT_MATMUL_DESC_TRANSA | Specifies the type of transformation operation that should be performed on matrix A. Default value is: CUBLAS_OP_N (i.e., non-transpose operation). See cublasOperation_t . | int32_t\nCUBLASLT_MATMUL_DESC_TRANSB | Specifies the type of transformation operation that should be performed on matrix B. Default value is: CUBLAS_OP_N (i.e., non-transpose operation). See cublasOperation_t . | int32_t", "source": "https://docs.nvidia.com/cuda/cublas/#cublasltmatmuldescattributes-t", "tokens": ["cublasLtMatmulDescAttributes_t", "cublasLtMatmulDescGetAttribute", "cublasLtMatmulDescSetAttribute", "CUBLASLT_MATMUL_DESC_COMPUTE_TYPE", "cublasComputeType_t", "CUBLASLT_MATMUL_DESC_SCALE_TYPE", "cudaDataType_t", "CUBLASLT_MATMUL_DESC_POINTER_MODE", "CUBLASLT_POINTER_MODE_HOST", "cublasLtPointerMode_t", "CUBLASLT_MATMUL_DESC_TRANSA", "CUBLAS_OP_N"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtMatmulDescAttributes_t」，归在「cuBLASLt / Matmul」。重点关注 关键词 cublasLtMatmulDescAttributes_t、cublasLtMatmulDescGetAttribute、cublasLtMatmulDescSetAttribute、CUBLASLT_MATMUL_DESC_COMPUTE_TYPE、cublasComputeType_t，适合用于梳理 Lt Matmul、heuristics、preference 和 workspace 调优。", "detai LASLT_MATMUL_PREF_REDUCTION_SCHEME_MASK | Reduction scheme mask. See cublasLtReductionScheme_t . Only algorithm configurations specifying CUBLASLT_ALGO_CONFIG_REDUCTION_SCHEME that is not masked out by this attribute are allowed. For example, a mask value of 0x03 will allow only INPLACE and COMPUTE_TYPE reduction schemes. Default is CUBLASLT_REDUCTION_SCHEME_MASK (i.e., allows all reduction schemes). | uint32_t\nCUBLASLT_MATMUL_PREF_MIN_ALIGNMENT_A_BYTES | Minimum buffer alignment for matrix A (in bytes). Selecting a smaller value will exclude algorithms that can not work with matrix A, which is not as strictly aligned as the algorithms need. Default is 256 bytes. | uint32_t\nCUBLASLT_MATMUL_PREF_MIN_ALIGNMENT_B_BYTES | Minimum buffer alignment for matrix B (in bytes). Selecting a smaller value will exclude algorithms that can not work with matrix B, which is not as strictly aligned as the algorithms need. Default is 256 bytes. | uint32_t", "source": "https://docs.nvidia.com/cuda/cublas/#cublasltmatmulpreferenceattributes-t", "tokens": ["cublasLtMatmulPreferenceAttributes_t", "cublasLtMatmulPreferenceGetAttribute", "cublasLtMatmulPreferenceSetAttribute", "CUBLASLT_MATMUL_PREF_SEARCH_MODE", "cublasLtMatmulSearch_t", "CUBLASLT_SEARCH_BEST_FIT", "CUBLASLT_MATMUL_PREF_MAX_WORKSPACE_BYTES", "CUBLASLT_MATMUL_PREF_REDUCTION_SCHEME_MASK", "cublasLtReductionScheme_t", "CUBLASLT_ALGO_CONFIG_REDUCTION_SCHEME", "CUBLASLT_REDUCTION_SCHEME_MASK", "CUBLASLT_MATMUL_PREF_MIN_ALIGNMENT_A_BYTES"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtMatmulPreferenceAttributes_t」，归在「cuBLASLt / Matmul」。重点关注 关键词 cublasLtMatmulPreferenceAttributes_t、cublasLtMatmulPreferenceGetAttribute、cublasLtMatmulPreferenceSetAttribute、CUBLASLT_MATMUL_PREF_SEARCH_MODE、cublasLtMatmulSearch_t，适合用于梳理 Lt Matmul、heuristics、preference 和 workspace 调优。", "detailsZh": "中文提要：这是「cublasLtMatmulPreferenceAttributes_t」对应的官方条目，分类为「cuBLASLt / Matmul」。\n阅读重点：梳理 Lt Matmul、heuristics、preference 和 workspace 调优。\n相关 API / 关键词：cublasLt algorithms.\nFlags below can be combined using the bit OR operator “|”.\nValue | Description\nCUBLASLT_NUMERICAL_IMPL_FLAGS_FMA | Specify that the implementation is based on [H,F,D]FMA (fused multiply-add) family instructions.\nCUBLASLT_NUMERICAL_IMPL_FLAGS_HMMA | Specify that the implementation is based on HMMA (tensor operation) family instructions.\nCUBLASLT_NUMERICAL_IMPL_FLAGS_IMMA | Specify that the implementation is based on IMMA (integer tensor operation) family instructions.\nCUBLASLT_NUMERICAL_IMPL_FLAGS_DMMA | Specify that the implementation is based on DMMA (double precision tensor operation) family instructions.\nCUBLASLT_NUMERICAL_IMPL_FLAGS_TENSOR_OP_MASK | Mask to filter implementations using any of the above kinds of tensor operations.", "source": "https://docs.nvidia.com/cuda/cublas/#cublasltnumericalimplflags-t", "tokens": ["cublasLtNumericalImplFlags_t", "CUBLASLT_NUMERICAL_IMPL_FLAGS_FMA", "CUBLASLT_NUMERICAL_IMPL_FLAGS_HMMA", "CUBLASLT_NUMERICAL_IMPL_FLAGS_IMMA", "CUBLASLT_NUMERICAL_IMPL_FLAGS_DMMA", "CUBLASLT_NUMERICAL_IMPL_FLAGS_TENSOR_OP_MASK"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtNumericalImplFlags_t」，归在「类型 / 状态码」。重点关注 关键词 cublasLtNumericalImplFlags_t、CUBLASLT_NUMERICAL_IMPL_FLAGS_FMA、CUBLASLT_NUMERICAL_IMPL_FLAGS_HMMA、CUBLASLT_NUMERICAL_IMPL_FLAGS_IMMA、CUBLASLT_NUMERICAL_IMPL_FLAGS_DMMA，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublasLtNumericalImplFlags_t」对应的官方条目，分类为「类型 / 状态码」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublasLtNumericalImplFlags_t、CUBLASLT_NUMERICAL_IMPL_FLAGS_FMA、CUBLASLT_NUMERICAL_IMPL_FLAGS_HMMA、CUBLASLT_NUMERICAL_IMPL_FLAGS_IMMA、CUBLASLT_NUMERICAL_IMPL_FLAGS_DMMA、CUBLASLT_NUMERICAL_IMPL_FLAGS_TENSOR_OP_MASK。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasLtMatrixLayout_t", "titleZh": "cublasLtMatrixLayout_t", "numberedTitle": "3.3.18. cublasLtMatrixLayout_t", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "cuBLASLt Datatypes Reference", "parentZh": " he attribute value of a matrix layout...", "details": "cublasLtMatrixLayoutAttribute_t is a descriptor structure containing the attributes that define the details of the matrix operation.\nUse cublasLtMatrixLayoutGetAttribute() and cublasLtMatrixLayoutSetAttribute() to get and set the attribute value of a matrix layout descriptor.\nValue | Description | Data Type\nCUBLASLT_MATRIX_LAYOUT_TYPE | Specifies the data precision type. See cudaDataType_t . | uint32_t\nCUBLASLT_MATRIX_LAYOUT_ORDER | Specifies the memory order of the data of the matrix. Default value is CUBLASLT_ORDER_COL . See cublasLtOrder_t . | int32_t\nCUBLASLT_MATRIX_LAYOUT_ROWS | Describes the number of rows in the matrix. Normally only values that can be expressed as int32_t are supported. | uint64_t\nCUBLASLT_MATRIX_LAYOUT_COLS | Describes the number of columns in the matrix. Normally only values that can be expressed as int32_t are supported. | uint64_t\nCUBLASLT_MATRIX_LAYOUT_LD | The leading dimension of the matrix. For CUBLASLT_ORDER_COL this is the stride (in elements) of matrix column. See also cublasLtOrder_t . Currently only non-negative values are supported. Must be large enough so that matrix memory locations are not overlapping (e.g., greater or equal to CUBLASLT_MATRIX_LAYOUT_ROWS in case of CUBLASLT_ORDER_COL ). | int64_t", "source": "https://docs.nvidia.com/cuda/cublas/#cublasltmatrixlayoutattribute-t", "tokens": ["cublasLtMatrixLayoutAttribute_t", "cublasLtMatrixLayoutGetAttribute", "cublasLtMatrixLayoutSetAttribute", "CUBLASLT_MATRIX_LAYOUT_TYPE", "cudaDataType_t", "CUBLASLT_MATRIX_LAYOUT_ORDER", "CUBLASLT_ORDER_COL", "cublasLtOrder_t", "CUBLASLT_MATRIX_LAYOUT_ROWS", "CUBLASLT_MATRIX_LAYOUT_COLS", "CUBLASLT_MATRIX_LAYOUT_LD"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtMatrixLayoutAttribute_t」，归在「类型 / 状态码」。重点关注 关键词 cublasLtMatrixLayoutAttribute_t、cublasLtMatrixLayoutGetAttribute、cublasLtMatrixLayoutSetAttribute、CUBLASLT_MATRIX_LAYOUT_TYPE、cudaDataType_t，适合用于定位 cuBLAS 官方章节和相关 API。", "deta uBLASLt Datatypes Reference", "kind": "Types / Status", "kindZh": "类型 / 状态码", "summary": "The cublasLtMatrixTransformDesc_t is a pointer to an opaque structure holding the description of a matrix transformation operation. Use cublasLtMatrixTransformDescCreate() to create one instance of the descriptor and cublasLtMatrixTransformDescDestroy() to destroy a...", "details": "The cublasLtMatrixTransformDesc_t is a pointer to an opaque structure holding the description of a matrix transformation operation.\nUse cublasLtMatrixTransformDescCreate() to create one instance of the descriptor and cublasLtMatrixTransformDescDestroy() to destroy a previously created descriptor and release the resources.", "source": "https://docs.nvidia.com/cuda/cublas/#cublasltmatrixtransformdesc-t", "tokens": ["cublasLtMatrixTransformDesc_t", "cublasLtMatrixTransformDescCreate", "cublasLtMatrixTransformDescDestroy"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtMatrixTransformDesc_t」，归在「类型 / 状态码」。重点关注 关键词 cublasLtMatrixTransformDesc_t、cublasLtMatrixTransformDescCreate、cublasLtMatrixTransformDescDestroy，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublasLtMatrixTransformDesc_t」对应的官方条目，分类为「类型 / 状态码」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublasLtMatrixTransformDesc_t、cublasLtMatrixTransformDescCreate、cublasLtMatrixTransformDescDestroy。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasLtMatrixTransformDescAttributes_t", "titleZh": "cublasLtMatrixTransformDescAttributes_t", "numberedTitle": "3.3.22. cublasLtMatrixTransformDescAttributes_t", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "cuBLASLt Datatypes Reference", "parentZh": "cuBLASLt Datatypes Reference", "kind": "Types / Status", "kindZh": "类型 / 状态码", "summary": "cublasLtMatrixTransformDescAttributes_t is a descriptor structure containing the attributes that define the specifics of the matrix transform operation. Use cublasLtMatrixTransformDescGetAttribute() and cublasLtMatrixTransformDescSetAttribute() to set the attribute...", "details": "cublasLtMatrixTransformDescAttributes_t is a descriptor structure containing the attributes that define the specifics of the matrix transform operation.\nUse cublasLtMatrixTransformDescGetAttribute() and cublasLtMatrixTransformDescSetAttribute() to set the attribute value of a matrix transform descriptor.\nValue | Description | Data Type\nCUBLASLT_MATRIX_TRANSFORM_DESC_SCALE_TYPE | Scale type. Inputs are converted to the scale type for scaling and summation, and results are then converted to the output type to store in the memory. For the supported data types see cudaDataType_t . | int32_t\nCUBLASLT_MATRIX_TRANSFORM_DESC_POINTER_MODE | Specifies the scalars alpha and beta are passed by reference whether on the host or on the device. Default value is: CUBLASLT_POINTER_MODE_HOST (i.e., on the host). See cublasLtPointerMode_t . | int32_t\nCUBLASLT_MATRIX_TRANSFORM_DESC_TRANSA | Specifies the type of operation that should be performed on the matrix A. Default value is: CUBLAS_OP_N (i.e., non-transpose operation). See cublasOperation_t . | int32_t\nCUBLASLT_MATRIX_TRANSFORM_DESC_TRANSB | Specifies the type of operation that should be performed on the matrix B. Default value is: CUBLAS_OP_N (i.e., non-transpose operation). See cublasOperation_t . | int32_t", "source": "https://docs.nvidia.com/cuda/cublas/#cublasltmatrixtransformdescattributes-t", "tokens": ["cublasLtMatrixTransformDescAttributes_t", "cublasLtMatrixTransformDescGetAttribute", "cublasLtMatrixTransformDescSetAttribute", "CUBLASLT_MATRIX_TRANSFORM_DESC_SCALE_TYPE", "cudaDataType_t", "CUBLASLT_MATRIX_TRANSFORM_DESC_POINTER_MODE", "CUBLASLT_POINTER_MODE_HOST", "cublasLtPointerMode_t", "CUBLASLT_MATRIX_TRANSFORM_DESC_TRANSA", "CUBLAS_OP_N", "cublasOperation_t", "CUBLASLT_MATRIX_TRANSFORM_DESC_TRANSB"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtMatrixTransformDescAttributes_t」，归在「类型 / 状态码」。重点关注 关键词 cublasLtMatrixTransformDescAttributes_t、cublasLtMatrixTransformDescGetAttribute、cublasLtMatrixTransformDescSetAttribute、CUBLASLT_MATRIX_TRANSFORM_DESC_SCALE_TYPE、cudaDataType_t，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublasLtMatrixTransformDescAttributes_t」对应的官方条目，分类为「类型 / 状态码」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublasLtMatrixTransformDescAttributes_t、cublasLtMatrixTransformDescGetAttribute、cublasLtMatrixTransformDescSetAttribute、CUBLASLT_MATRIX_TRANSFORM_DESC_SCALE_TYPE、cudaDataType_t、CUBLASLT_MATRIX_TRANSFORM_DESC_POINTER_MODE、CUBLASLT_POINTER_MODE_HOST、cublasLtPointerMode_t。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasLtOrder_t", "titleZh": "cublasLtOrder_t", "numberedTitle": "3.3.23. cublasLtOrder_t", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "cuBLASLt Datatypes Reference", "parentZh": "cuBLASLt Datatypes Reference", "kind": "Types / Status", "kindZh": "类型 / 状态码", "summary": "cublasLtOrder_t is an enumerated type used to indicate the data ordering of the matrix.", "details": "cublasLtOrder_t is an enumerated type used to indicate the data ordering of the matrix.\nValue | Description\nCUBLASLT_ORDER_COL | Data is ordered in column-major format. The leading dimension is the stride (in elements) to the beginning of next column in memory.\nCUBLASLT_ORDER_ROW | Data is ordered in row-major format. The leading dimension is the stride (in elements) to the beginning of next row in memory.\nCUBLASLT_ORDER_COL32 | Data is ordered in column-major ordered tiles of 32 columns. The leading dimension is the stride (in elements) to the beginning of next group of 32-columns. For example, if the matrix has 33 columns and 2 rows, then the leading dimension must be at least 32 * 2 = 64 .\nCUBLASLT_ORDER_COL4_4R2_8C | Data is ordered in column-major ordered tiles of composite tiles with total 32 columns and 8 rows. A tile is composed of interleaved inner tiles of 4 columns within 4 even or odd rows in an alternating pattern. The leading dimension is the stride (in elements) to the beginning of the first 32 column x 8 row tile for the next 32-wide group of columns. For example, if the matrix has 33 columns and 1 row, the leading dimension must be at least (32 * 8) * 1 = 256 .\nCUBLASLT_ORDER_COL32_2R_4R4 | Data is ordered in column-major ordered tiles of composite tiles with total 32 columns ands 32 rows. Element offset within the tile is calculated as (((row % 8) / 2 * 4 + row / 8) * 2 + row % 2) * 32 + col . Leading dimension is the stride (in elements) to the beginning of the first 32 column x 32 row tile for the next 32-wide group of columns. E.g. if matrix has 33 columns and 1 row, then its leading dimensions must be at least (32 * 32) * 1 = 1024 .", "source": "https://docs.nvidia.com/cuda/cublas/#cublasltorder-t", "tokens": ["cublasLtOrder_t", "CUBLASLT_ORDER_COL", "CUBLASLT_ORDER_ROW", "CUBLASLT_ORDER_COL32", "CUBLASLT_ORDER_COL4_4R2_8C", "CUBLASLT_ORDER_COL32_2R_4R4"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtOrder_t」，归在「类型 / 状态码」。重点关注 关键词 cublasLtOrder_t、CUBLASLT_ORDER_COL、CUBLASLT_ORDER_ROW、CUBLASLT_ORDER_COL32、CUBLASLT_ORDER_COL4_4R2_8C，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublasLtOrder_t」对应的官方条目，分类为「类型 / 状态码」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublasLtOrder_t、CUBLASLT_ORDER_COL、CUBLASLT_ORDER_ROW、CUBLASLT_ORDER_COL32、CUBLASLT_ORDER_COL4_4R2_8C、CUBLASLT_ORDER_COL32_2R_4R4。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasLtPointerMode_t", "titleZh": "cublasLtPointerMode_t", "numberedTitle": "3.3.24. cublasLtPointerMode_t", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "cuBLASLt Datatypes Reference", "parentZh": "cuBLASLt Datatypes Reference", "kind": "Types / Status", "kindZh": "类型 / 状态码", "summary": "cublasLtPointerMode_t is an enumerated type used to set the pointer mode for the scaling factors alpha and beta .", "details": "cublasLtPointerMode_t is an enumerated type used to set the pointer mode for the scaling factors alpha and beta .\nValue | Description\nCUBLASLT_POINTER_MODE_HOST = CUBLAS_POINTER_MODE_HOST | Matches CUBLAS_POINTER_MODE_HOST , and the pointer targets a single value host memory.\nCUBLASLT_POINTER_MODE_DEVICE = CUBLAS_POINTER_MODE_DEVICE | Matches CUBLAS_POINTER_MODE_DEVICE , and the pointer targets a single value device memory.\nCUBLASLT_POINTER_MODE_DEVICE_VECTOR = 2 | Pointers target device memory vectors of length equal to the number of rows of matrix D.\nCUBLASLT_POINTER_MODE_ALPHA_DEVICE_VECTOR_BETA_ZERO = 3 | alpha pointer targets a device memory vector of length equal to the number of rows of matrix D, and beta is zero.\nCUBLASLT_POINTER_MODE_ALPHA_DEVICE_VECTOR_BETA_HOST = 4 | alpha pointer targets a device memory vector of length equal to the number of rows of matrix D, and beta is a single value in host memory.", "source": "https://docs.nvidia.com/cuda/cublas/#cublasltpointermode-t", "tokens": ["cublasLtPointerMode_t", "CUBLASLT_POINTER_MODE_HOST", "CUBLAS_POINTER_MODE_HOST", "CUBLASLT_POINTER_MODE_DEVICE", "CUBLAS_POINTER_MODE_DEVICE", "CUBLASLT_POINTER_MODE_DEVICE_VECTOR", "CUBLASLT_POINTER_MODE_ALPHA_DEVICE_VECTOR_BETA_ZERO", "CUBLASLT_POINTER_MODE_ALPHA_DEVICE_VECTOR_BETA_HOST"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtPointerMode_t」，归在「类型 / 状态码」。重点关注 关键词 cublasLtPointerMode_t、CUBLASLT_POINTER_MODE_HOST、CUBLAS_POINTER_MODE_HOST、CUBLASLT_POINTER_MODE_DEVICE、CUBLAS_POINTER_MODE_DEVICE，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublasLtPointerMode_t」对应的官方条目，分类为「类型 / 状态码」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublasLtPointerMode_t、CUBLASLT_POINTER_MODE_HOST、CUBLAS_POINTER_MODE_HOST、CUBLASLT_POINTER_MODE_DEVICE、CUBLAS_POINTER_MODE_DEVICE、CUBLASLT_POINTER_MODE_DEVICE_VECTOR、CUBLASLT_POINTER_MODE_ALPHA_DEVICE_VECTOR_BETA_ZERO、CUBLASLT_POINTER_MODE_ALPHA_DEVICE_VECTOR_BETA_HOST。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasLtPointerModeMask_t", "titleZh": "cublasLtPointerModeMask_t", "numberedTitle": "3.3.25. cublasLtPointerModeMask_t", "level": API。\n相关 API / 关键词：cublasLtPointerModeMask_t、CUBLASLT_POINTER_MODE_MASK_HOST、CUBLASLT_POINTER_MODE_HOST、cublasLtPointerMode_t、CUBLASLT_POINTER_MODE_MASK_DEVICE、CUBLASLT_POINTER_MODE_DEVICE、CUBLASLT_POINTER_MODE_MASK_DEVICE_VECTOR、CUBLASLT_POINTER_MODE_DEVICE_VECTOR。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasLtReductionScheme_t", "titleZh": "cublasLtReductionScheme_t", "numberedTitle": "3.3.26. cublasLtReductionScheme_t", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "cuBLASLt Datatypes Reference", "parentZh": "cuBLASLt Datatypes Reference", "kind": "Types / Status", "kindZh": "类型 / 状态码", "summary": "cublasLtReductionScheme_t is an enumerated type used to specify a reduction scheme for the portions of the dot-product calculated in parallel (i.e., “split - K”).", "details": "cublasLtReductionScheme_t is an enumerated type used to specify a reduction scheme for the portions of the dot-product calculated in parallel (i.e., “split - K”).\nValue | Description\nCUBLASLT_REDUCTION_SCHEME_NONE | Do not apply reduction. The dot-product will be performed in one sequence.\nCUBLASLT_REDUCTION_SCHEME_INPLACE | Reduction is performed “in place” using the output buffer, parts are added up in the output data type. Workspace is only used for counters that guarantee sequentiality.\nCUBLASLT_REDUCTION_SCHEME_COMPUTE_TYPE | Reduction done out of place in a user-provided workspace. The intermediate results are stored in the compute type in the workspace and reduced in a separate step.\nCUBLASLT_REDUCTION_SCHEME_OUTPUT_TYPE | Reduction done out of place in a user-provided workspace. The intermediate results are stored in the output type in the workspace and reduced in a separate step.\nCUBLASLT_REDUCTION_SCHEME_MASK | Allows all reduction schemes.", "source": "https://docs.nvidia.com/cuda/cublas/#cublasltreductionscheme-t", "tokens": ["cublasLtReductionScheme_t", "CUBLASLT_REDUCTION_SCHEME_NONE", "CUBLASLT_REDUCTION_SCHEME_INPLACE", "CUBLASLT_REDUCTION_SCHEME_COMPUTE_TYPE", "CUBLASLT_REDUCTION_SCHEME_OUTPUT_TYPE", "CUBLASLT_REDUCTION_SCHEME_MASK"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtReductionScheme_t」，归在「类型 / 状态码」。重点关注 关键词 cublasLtReductionScheme_t、CUBLASLT_REDUCTION_SCHEME_NONE、CUBLASLT_REDUCTION_SCHEME_INPLACE、CUBLASLT_REDUCTION_SCHEME_COMPUTE_TYPE、CUBLASLT_REDUCTION_SCHEME_OUTPUT_TYPE，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublasLtReductionScheme_t」对应的官方条目，分类为「类型 / 状态码」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublasLtReductionScheme_t、CUBLASLT_REDUCTION_SCHEME_NONE、CUBLASLT_REDUCTION_SCHEME_INPLACE、CUBLASLT_REDUCTION_SCHEME_COMPUTE_TYPE、CUBLASLT_REDUCTION_SCHEME_OUTPUT_TYPE、CUBLASLT_REDUCTION_SCHEME_MASK。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasLtMatmulMatrixScale_t", "titleZh": "cublasLtMatmulMatrixScale_t", "numberedTitle": "3.3.27. cublasLtMatmulMatrixScale_t", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "cuBLASLt Datatypes Reference", "parentZh": "cuBLASLt Datatypes Reference", "kind": "cuBLASLt / Matmul", "kindZh": "cuBLASLt / Matmul", "summary": "cublasLtMatmulMatrixScale_t is an enumerated type used to specify scaling mode that defines how scaling factor pointers are interpreted.", "details": "cublasLtMatmulMatrixScale_t is an enumerated type used to specify scaling mode that defines how scaling factor pointers are interpreted.\nValue | Description\nCUBLASLT_MATMUL_MATRIX_SCALE_SCALAR_32F | Scaling factors are single-precision scalars applied to the whole tensors (this mode is the default for fp8). This is the only value valid for CUBLASLT_MATMUL_DESC_D_SCALE_MODE when the D tensor uses a narrow precision data type.\nCUBLASLT_MATMUL_MATRIX_SCALE_VEC16_UE4M3 | Scaling factors are tensors that contain a dedicated scaling factor stored as an 8-bit CUDA_R_8F_UE4M3 value for each 16-element block in the innermost dimension of the corresponding data tensor.\nCUBLASLT_MATMUL_MATRIX_SCALE_VEC32_UE8M0 | Scaling factors are tensors that contain a dedicated scaling factor stored as an 8-bit CUDA_R_8F_UE8M0 value for each 32-element block in the innermost dimension of the corresponding data tensor.\nCUBLASLT_MATMUL_MATRIX_SCALE_OUTER_VEC_32F | Scaling factors are vectors of CUDA_R_32F values. This mode is only applicable to matrices A and B, in which case the vectors are expected to have M and N elements respectively, and each (i, j)-th element of product of A and B is multiplied by i-th element of A scale and j-th element of B scale.\nCUBLASLT_MATMUL_MATRIX_SCALE_VEC128_32F | Scaling factors are tensors that contain a dedicated CUDA_R_32F scaling factor for each 128-element block in the innermost dimension of the corresponding data tensor.\nCUBLASLT_MATMUL_MATRIX_SCALE_BLK128x128_32F | Scaling factors are tensors that contain a dedicated CUDA_R_32F scaling factor for each 128x128-element block in the the corresponding data tensor.", "source": "https://docs.nvidia.com/cuda/cublas/#cublasltmatmulmatrixscale-t", "tokens": ["cublasLtMatmulMatrixScale_t", "CUBLASLT_MATMUL_MATRIX_SCALE_SCALAR_32F", "CUBLASLT_MATMUL_DESC_D_SCALE_MODE", "CUBLASLT_MATMUL_MATRIX_SCALE_VEC16_UE4M3", "CUDA_R_8F_UE4M3", "CUBLASLT_MATMUL_MATRIX_SCALE_VEC32_UE8M0", "CUDA_R_8F_UE8M0", "CUBLASLT_MATMUL_MATRIX_SCALE_OUTER_VEC_32F", "CUDA_R_32F", "CUBLASLT_MATMUL_MATRIX_SCALE_VEC128_32F", "CUBLASLT_MATMUL_MATRIX_SCALE_BLK128"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtMatmulMatrixScale_t」，归在「cuBLASLt / Matmul」。重点关注 关键词 cublasLtMatmulMatrixScale_t、CUBLASLT_MATMUL_MATRIX_SCALE_SCALAR_32F、CUBLASLT_MATMUL_DESC_D_SCALE_MODE、CUBLASLT_MATMUL_MATRIX_SCALE_VEC16_UE4M3、CUDA_R_8F_UE4M3，适合用于梳理 Lt Matmul、heuristics、preference 和 workspace 调优。", "detailsZh": "中文提要：这是「cublasLtMatmulMatrixScale_t」对应的官方条目，分类为「cuBLASLt / Matmul」。\n阅读重点：梳理 Lt Matmul、heuristics、preference 和 workspace 调优。\n相关 API / 关键词：cublasLtMatmulMatrixScale_t、CUBLASLT_MATMUL_MATRIX_SCALE_SCALAR_32F、CUBLASLT_MATMUL_DESC_D_SCALE_MODE、CUBLASLT_MATMUL_MATRIX_SCALE_VEC16_UE4M3、CUDA_R_8F_UE4M3、CUBLASLT_MATMUL_MATRIX_SCALE_VEC32_UE8M0、CUDA_R_8F_UE8M0、CUBLASLT_MATMUL_MATRIX_SCALE_OUTER_VEC_32F。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasLtBatchMode_t", "titleZh": "cublasLtBatchMode_t", "numberedTitle": "3.3.28. cublasLtBatchMode_t", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "cuBLASLt Datatypes Reference", "parentZh": "cuBLASLt Datatypes Reference", "kind": "Types / Status", "kindZh": "类型 / 状态码", "summary": "cuBLAS 文档章节：cublasLtBatchMode_t", "details": "Value | Description\nCUBLASLT_BATCH_MODE_STRIDED | The matrices of each instance of the batch are located at fixed offsets in number of elements from their locations in the previous instance.\nCUBLASLT_BATCH_MODE_POINTER_ARRAY | The address of the matrix of each instance of the batch are read from device arrays of pointers.\nCUBLASLT_BATCH_MODE_GROUPED | Experimental: The address of the matrix of each instance of the group are read from device arrays of pointers. Each group can have different columns, rows, and leading dimensions. See cublasLtMatrixLayout_t for more details.", "source": "https://docs.nvidia.com/cuda/cublas/#cublasltbatchmode-t", "tokens": ["cublasLtBatchMode_t", "cuBLAS", "CUBLASLT_BATCH_MODE_STRIDED", "CUBLASLT_BATCH_MODE_POINTER_ARRAY", "CUBLASLT_BATCH_MODE_GROUPED", "cublasLtMatrixLayout_t"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtBatchMode_t」，归在「类型 / 状态码」。重点关注 关键词 cublasLtBatchMode_t、cuBLAS、CUBLASLT_BATCH_MODE_STRIDED、CUBLASLT_BATCH_MODE_POINTER_ARRAY、CUBLASLT_BATCH_MODE_GROUPED，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cublasLtBatchMode_t」对应的官方条目，分类为「类型 / 状态码」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cublasLtBatchMode_t、cuBLAS、CUBLASLT_BATCH_MODE_STRIDED、CUBLASLT_BATCH_MODE_POINTER_ARRAY、CUBLASLT_BATCH_MODE_GROUPED、cublasLtMatrixLayout_t。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasLtEmulationDesc_t", "titleZh": "cublasLtEmulationDesc_t", "numberedTitle": "3.3.29. cublasLtEmulationDesc_t", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "cuBLASLt Datatypes Reference", "parentZh": "cuBLASLt Datatypes Reference", "kind": "Precision / Tensor Core", "kindZh": "精度 / Tensor Core", "summary": "cublasLtEmulationDesc_t is a pointer to an opaque structure holding the emulation descriptor. Use cublasLtEmulationDescCreate() to create a new emulation descriptor, and cublasLtEmulationDescDestroy() to destroy it and release the resources.", "details": "cublasLtEmulationDesc_t is a pointer to an opaque structure holding the emulation descriptor.\nUse cublasLtEmulationDescCreate() to create a new emulation descriptor, and cublasLtEmulationDescDestroy() to destroy it and release the resources.", "source": "https://docs.nvidia.com/cuda/cublas/#cublasltemulationdesc-t", "tokens": ["cublasLtEmulationDesc_t", "cublasLtEmulationDescCreate", "cublasLtEmulationDescDestroy"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtEmulationDesc_t」，归在「精度 / Tensor Core」。重点关注 关键词 cublasLtEmulationDesc_t、cublasLtEmulationDescCreate、cublasLtEmulationDescDestroy，适合用于理解 Tensor Core、数据类型、math mode 和精度/性能取舍。", "detailsZh": "中文提要：这是「cublasLtEmulationDesc_t」对应的官方条目，分类为「精度 / Tensor Core」。\n阅读重点：理解 Tensor Core、数据类型、math mode 和精度/性能取舍。\n相关 API / 关键词：cublasLtEmulationDesc_t、cublasLtEmulationDescCreate、cublasLtEmulationDescDestroy。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cublasLtEmulationDescAttributes_t", "titleZh": "cublasLtEmulationDescAttributes_t", "numberedTitle": "3.3.30. cublasLtEmulationDescAttributes_t", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "cuBLASLt Datatypes Reference", "parentZh": "cuBLASLt Datatypes Reference", "kind": "Precision / Tensor Core", "kindZh": "精度 / Tensor Core", "summary": "cublasLtEmulationDescAttributes_t is an enumerated type used to configure floating point emulation parameters. See Floating Point Emulation documentation for more details.", "details": "cublasLtEmulationDescAttributes_t is an enumerated type used to configure floating point emulation parameters.\nSee Floating Point Emulation documentation for more details.\nValue | Description | Data Type\nCUBLASLT_EMULATION_DESC_STRATEGY | Strategy, see cublasEmulationStrategy_t . Defines when to use floating point emulation algorithms. Default: EMULATION_STRATEGY_DEFAULT . | int32_t\nCUBLASLT_EMULATION_DESC_SPECIAL_VALUES_SUPPORT | Special values support, see cudaEmulationSpecialValuesSupport_t . Defines a bit mask of special cases in floating-point representations that must be supported. Default: EMULATION_SPECIAL_VALUES_SUPPORT_DEFAULT . | int32_t\nCUBLASLT_EMULATION_DESC_FIXEDPOINT_MANTISSA_CONTROL | Mantissa control, see cudaEmulationMantissaControl_t . For fixed-point emulation, defines how to compute the number of retained mantissa bits. See Floating Point Emulation documentation for more details. | int32_t\nCUBLASLT_EMULATION_DESC_FIXEDPOINT_MAX_MANTISSA_BIT_COUNT | For fixed-point emulation only. An int32_t representing the maximum (up to quantization) number of mantissa bits to retain during fixed-point emulation. A default value of 0 allows the library to select a reasonable value based on device properties. Default: 0. | int32_t\nCUBLASLT_EMULATION_DESC_FIXEDPOINT_MANTISSA_BIT_OFFSET | This parameter is for fixed-point emulation with CUDA_EMULATION_MANTISSA_CONTROL_DYNAMIC mantissa control (see cudaEmulationMantissaControl_t ). An integer which can be used to bias the number of recommended mantissa bits. Default: 0. | int32_t", "source": "https://docs.nvidia.com/cuda/cublas/#cublasltemulationdescattributes-t", "tokens": ["cublasLtEmulationDescAttributes_t", "CUBLASLT_EMULATION_DESC_STRATEGY", "cublasEmulationStrategy_t", "CUBLASLT_EMULATION_DESC_SPECIAL_VALUES_SUPPORT", "cudaEmulationSpecialValuesSupport_t", "CUBLASLT_EMULATION_DESC_FIXEDPOINT_MANTISSA_CONTROL", "cudaEmulationMantissaControl_t", "CUBLASLT_EMULATION_DESC_FIXEDPOINT_MAX_MANTISSA_BIT_COUNT", "CUBLASLT_EMULATION_DESC_FIXEDPOINT_MANTISSA_BIT_OFFSET", "CUDA_EMULATION_MANTISSA_CONTROL_DYNAMIC"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cublasLtEmulationDescAttributes_t」，归在「精度 / Tensor Core」。重点关注 关键词 cublasLtEmulationDescAttributes_t、CUBLASLT_EMULATION_DESC_STRATEGY、cublasEmulationStrategy_t、CUBLASLT_EMULATION_DESC_SPECIAL_VALUES_SUPPORT、cudaEmulationSpecialValuesSupport_t，适合用于理解 Tensor Core、数据类型、math mode 和精度/性能取舍。", "detailsZh": "中文提要：这是「cublasLtEmulationDescAttributes_t」对应的官方条目，分类为「精度 / Tensor Core」。\n阅读重点：理解 Tensor Core、数据类型、math mode 和精度/性能取舍。\n相关 API / 关键词：cublasLtEmulationDescAttributes_t、CUBLASLT_EMULATION_DESC_STRATEGY、cublasEmulationStrategy_t、CUBLASLT_EMULATION_DESC_SPECIAL_VALUES_SUPPORT、cudaEmulationSpecialValuesSupport_t、CUBLASLT_EMULATION_DESC_FIXEDPOINT_MANTISSA_CONTROL、cudaEmulationMantissaControl_t、CUBLASLT_EMULATION_DESC_FIXEDPOINT_MAX_MANTISSA_BIT_COUNT。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cuBLASLt API Reference", "titleZh": "cuBLASLt API Reference", "numberedTitle": "3.4. cuBLASLt API Reference", "level": "H2", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "", "parentZh": "", "kind": "Guide", "kindZh": "指南章节", "summary": "cuBLAS 文档章节：cuBLASLt API Reference", "details": "", "source": "https://docs.nvidia.com/cuda/cublas/#cublaslt-api-reference", "tokens": ["cuBLASLt", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cuBLASLt API Reference」，归在「指南章节」。重点关注 关键词 cuBLASLt、cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cuBLASLt API Reference」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLASLt、cuBLAS。"}, {"title": "cublasLtCreate()", "titleZh": "cublasLtCreate()", "numberedTitle": "3.4.1. cublasLtCreate()", "level": "H3", "chapter": "Using the cuBLASLt API", "chapterZh": "使用 cuBLASLt API", "parent": "cuBLASLt API Reference", "parentZh": "cuBLASLt API 参考", "kind": "API Function", "kindZh": "API 函数", "summary": "This function initializes the cuBLASLt library and creates a han \n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Tiling design approach", "titleZh": "Tiling 设计思路", "numberedTitle": "4.1.1. Tiling design approach", "level": "H3", "chapter": "Using the cuBLASXt API", "chapterZh": "使用 cuBLASXt API", "parent": "General description", "parentZh": "总体说明", "kind": "Guide", "kindZh": "指南章节", "summary": "To be able to share the workload between multiple GPUs, the cuBLASXt API uses a tiling strategy : every matrix is divided in square tiles of user-controllable dimension BlockDim x BlockDim. The resulting matrix tiling defines the static scheduling policy : each...", "details": "To be able to share the workload between multiple GPUs, the cuBLASXt API uses a tiling strategy : every matrix is divided in square tiles of user-controllable dimension BlockDim x BlockDim.\nThe resulting matrix tiling defines the static scheduling policy : each resulting tile is affected to a GPU in a round robin fashion One CPU thread is created per GPU and is responsible to do the proper memory transfers and cuBLAS operations to compute all the tiles that it is responsible for.\nWhen the tile dimension is not an exact multiple of the dimensions of C, some tiles are partially filled on the right border or/and the bottom border.\nThe current implementation does not pad the incomplete tiles but simply keep track of those incomplete tiles by doing the right reduced cuBLAS operations : this way, no extra computation is done.\nWhen one or more matrices are located on some GPU devices, the same tiling approach and workload sharing is applied.\nThe memory transfers are in this case done between devices.\nThe matrices can be located on any GPU device, and do not have to be located on the same GPU device.\nFurthermore, the matrices can even be located on a GPU device that do not participate to the computation.", "source": "https://docs.nvidia.com/cuda/cublas/#tiling-design-approach", "tokens": ["cuBLASXt", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「Tiling 设计思路」，归在「指南章节」。重点关注 关键词 cuBLASXt、cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「Tiling 设计思路」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLASXt、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Hybrid CPU-GPU computation", "titleZh": "CPU-GPU 混合计算", "numberedTitle": "4.1.2. Hybrid CPU-GPU computation", "level": "H3", "chapter": "Using the cuBLASXt API", "chapterZh": "使用 cuBLASXt API", "parent": "General description", "parentZh": "总体说明", "kind": "Guide", "kindZh": "指南章节", "summary": "In the case of very large problems, the cuBLASXt API offers the possibility to offload some of the computation to the host CPU. This feature can be setup with the routines cublasXtSetCpuRoutine() and cublasXtSetCpuRatio() The workload affected to the CPU is put aside :...", "details": "In the case of very large problems, the cuBLASXt API offers the possibility to offload some of the computation to the host CPU.\nThis feature can be setup with the routines cublasXtSetCpuRoutine() and cublasXtSetCpuRatio() The workload affected to the CPU is put aside : it is simply a percentage of the resulting matrix taken from the bottom and the right side whichever dimension is bigger.\nIf any of the matrices is located on a GPU device, the feature is ignored and all computation will be done only on the GPUs\nThis feature should be used with caution because it could interfere with the CPU threads responsible of feeding the GPUs.\nCurrently, only the routine cublasXt<t>gemm() supports this feature.", "source": "https://docs.nvidia.com/cuda/cublas/#hybrid-cpu-gpu-computation", "tokens": ["cuBLASXt", "cublasXtSetCpuRoutine", "cublasXtSetCpuRatio", "cublasXt<t>gemm"], "summaryZh": "本条整理 cuBLAS 官方文档中的「CPU-GPU 混合计算」，归在「指南章节」。重点关注 关键词 cuBLASXt、cublasXtSetCpuRoutine、cublasXtSetCpuRatio、cublasXt<t>gemm，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「CPU-GPU 混合计算」对应的官方条目，分类为「指南章节」。\n阅读重点：定位 cuBLAS 官方章节和相关 API。\n相关 API / 关键词：cuBLASXt、cublasXtSetCpuRoutine、cublasXtSetCpuRatio、cublasXt<t>gemm。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Results reproducibility", "titleZh": "结果可复现性", "numberedTitle": "4.1.3. Results reproducibility", "level": "H3", "chapter": "Using the cuBLASXt API", "chapterZh": "使用 cuBLASXt API", "parent": "General description", "parentZh": "总体说明", "kind": "Workspace / Reproducibility", "kindZh": "Workspace / 可复现", "summary": "Currently all cuBLASXt API routines from a given toolkit version, generate the same bit-wise results when the following conditions are respected :", "details": "Currently all cuBLASXt API routines from a given toolkit version, generate the same bit-wise results when the following conditions are respected :\nall GPUs participating to the computation have the same compute capabilities and the same number of SMs.\nthe tiles size is kept the same between run.\neither the CPU hybrid computation is not used or the CPU Blas provided is also guaranteed to produce reproducible results.", "source": "https://docs.nvidia.com/cuda/cublas/#id122", "tokens": ["cuBLASXt"], "summaryZh": "本条整理 cuBLAS 官方文档中的「结果可复现性」，归在「Workspace / 可复现」。重点关注 关键词 cuBLASXt，适合用于处理 workspace、可复现性和多 stream 行为。", "detailsZh": "中文提要：这是「结果可复现性」对应的官方条目，分类为「Workspace / 可复现」。\n阅读重点：处理 workspace、可复现性和多 stream 行为。\n相关 API / 关键词：cuBLASXt。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "cuBLASXt API Datatypes Reference", "titleZh": "cuBLASXt API Datatypes Reference", "numberedTitle": "4.2. cuBLASXt API Datatypes Reference", "level": "H2", "chapter": "Using the cuBLASXt API", "chapterZh": "使用 cuBLASXt API", "parent": "", "parentZh": "", "kind": "Types / Status", "kindZh": "类型 / 状态码", "summary": "cuBLAS 文档章节：cuBLASXt API Datatypes Reference", "details": "", "source": "https://docs.nvidia.com/cuda/cublas/#cublasxt-api-datatypes-reference", "tokens": ["cuBLASXt", "cuBLAS"], "summaryZh": "本条整理 cuBLAS 官方文档中的「cuBLASXt API Datatypes Reference」，归在「类型 / 状态码」。重点关注 关键词 cuBLASXt、cuBLAS，适合用于定位 cuBLAS 官方章节和相关 API。", "detailsZh": "中文提要：这是「cuBLASXt API Datatypes Reference」对应
