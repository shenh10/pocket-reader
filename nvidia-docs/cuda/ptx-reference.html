rp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Control Flow Instructions: brx.idx", "titleZh": "控制流指令：brx.idx", "numberedTitle": "9.7.13.4. Control Flow Instructions: brx.idx", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Control Flow Instructions", "parentZh": "控制流指令", "kind": "Instructions", "kindZh": "指令", "summary": "brx.idx", "details": "brx.idx\nBranch to a label indexed from a list of potential branch targets.\nSyntax\nDescription\nIndex into a list of possible destination labels, and continue execution from the chosen label.\nConditional branches are specified by using a guard predicate.\nbrx.idx.uni guarantees that the branch is non-divergent, i.e. all active threads in a warp that are currently executing this instruction have identical values for the guard predicate and the index argument.\nThe index operand is a .u32 register.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#control-flow-instructions-brx-idx", "tokens": ["brx.idx", "brx.idx.uni", "warp", "u32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「控制流指令：brx.idx」，归在「指令」。重点关注 关键词 brx.idx、brx.idx.uni、warp、u32，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「控制流指令：brx.idx」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：brx.idx、brx.idx.uni、warp、u32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Control Flow Instructions: call", "titleZh": "控制流指令：call", "numberedTitle": "9.7.13.5. Control Flow Instructions: call", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Control Flow Instructions", "parentZh": "控制流指令", "kind": "Instructions", "kindZh": "指令", "summary": "call", "details": "call\nCall a function, recording the return location.\nSyntax\nDescription\nThe call instruction stores the address of the next instruction, so execution can resume at that point after executing a ret instruction.\nA call is assumed to be divergent unless the .uni suffix is present.\nFor direct calls, the called location func must be a symbolic function name; for indirect calls, the called location fptr must be an address of a function held in a register.\nInput arguments and return values are optional.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#control-flow-instructions-call", "tokens": ["uni"], "summaryZh": "本条整理 PTX ISA 官方文档中的「控制流指令：call」，归在「指令」。重点关注 关键词 uni，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「控制流指令：call」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：uni。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Control Flow Instructions: ret", "titleZh": "控制流指令：ret", "numberedTitle": "9.7.13.6. Control Flow Instructions: ret", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Control Flow Instructions", "parentZh": "控制流指令", "kind": "Instructions", "kindZh": "指令", "summary": "ret", "details": "ret\nReturn from function to instruction after call.\nSyntax\nDescription\nReturn execution to caller’s environment.\nA divergent return suspends threads until all threads are ready to return to the caller.\nA ret is assumed to be divergent unless the .uni suffix is present, indicating that the return is guaranteed to be non-divergent.\nAny values returned from a function should be moved into the return parameter variables prior to executing the ret instruction.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#control-flow-instructions-ret", "tokens": ["uni"], "summaryZh": "本条整理 PTX ISA 官方文档中的「控制流指令：ret」，归在「指令」。重点关注 关键词 uni，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「控制流指令：ret」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：uni。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Control Flow Instructions: exit", "titleZh": "控制流指令：exit", "numberedTitle": "9.7.13.7. Control Flow Instructions: exit", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Control Flow Instructions", "parentZh": "控制流指令", "kind": "Instructions", "kindZh": "指令", "summary": "exit", "details": "exit\nTerminate a thread.\nSyntax\nDescription\nEnds execution of a thread.\nBarriers exclusively waiting on arrivals from exited threads are always released.\nPTX ISA Notes\nIntroduced in PTX ISA version 1.0.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#control-flow-instructions-exit", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「控制流指令：exit」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「控制流指令：exit」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions", "titleZh": "并行同步与通信指令", "numberedTitle": "9.7.14. Parallel Synchronization and Communication Instructions", "level": "H3", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Instructions", "parentZh": "指令", "kind": "Instructions", "kindZh": "指令", "summary": "These instructions are:", "details": "These instructions are:\nbar{.cta} , barrier{.cta}\nbar.warp.sync\nbarrier.cluster\nmembar\natom\nred\nred.async", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions", "tokens": ["cta", "bar.warp.sync", "barrier.cluster", "red.async"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令」，归在「指令」。重点关注 关键词 cta、bar.warp.sync、barrier.cluster、red.async，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：cta、bar.warp.sync、barrier.cluster、red.async。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: bar , barrier", "titleZh": "并行同步与通信指令：bar , barrier", "numberedTitle": "9.7.14.1. Parallel Synchronization and Communication Instructions: bar , barrier", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions", "parentZh": "并行同步与通信指令", "kind": "Instructions", "kindZh": "指令", "summary": "bar , bar.cta , barrier , barrier.cta", "details": "bar , bar.cta , barrier , barrier.cta\nBarrier synchronization.\nSyntax\nDescription\nPerforms barrier synchronization and communication within a CTA.\nEach CTA instance has sixteen barriers numbered 0..15 .\nbarrier{.cta} instructions can be used by the threads within the CTA for synchronization and communication.\nOperands a , b , and d have type .u32 ; operands p and c are predicates.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-bar", "tokens": ["bar.cta", "barrier.cta", "cta", "u32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：bar , barrier」，归在「指令」。重点关注 关键词 bar.cta、barrier.cta、cta、u32，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：bar , barrier」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：bar.cta、barrier.cta、cta、u32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: bar.warp.sync", "titleZh": "并行同步与通信指令：bar.warp.sync", "numberedTitle": "9.7.14.2. Parallel Synchronization and Communication Instructions: bar.warp.sync", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions", "parentZh": "并行同步与通信指令", "kind": "Instructions", "kindZh": "指令", "summary": "bar.warp.sync", "details": "bar.warp.sync\nBarrier synchronization for threads in a warp.\nSyntax\nDescription\nbar.warp.sync will cause executing thread to wait until all threads corresponding to membermask have executed a bar.warp.sync with the same membermask value before resuming execution.\nOperand membermask specifies a 32-bit integer which is a mask indicating threads participating in barrier where the bit position corresponds to thread’s laneid .\nThe behavior of bar.warp.sync is undefined if the executing thread is not in the membermask .\nbar.warp.sync also guarantee memory ordering among threads participating in barrier.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-bar-warp-sync", "tokens": ["bar.warp.sync", "warp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：bar.warp.sync」，归在「指令」。重点关注 关键词 bar.warp.sync、warp，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：bar.warp.sync」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：bar.warp.sync、warp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: barrier.cluster", "titleZh": "并行同步与通信指令：barrier.cluster", "numberedTitle": "9.7.14.3. Parallel Synchronization and Communication Instructions: barrier.cluster", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions", "parentZh": "并行同步与通信指令", "kind": "Instructions", "kindZh": "指令", "summary": "barrier.cluster", "details": "barrier.cluster\nBarrier synchronization within a cluster.\nSyntax\nDescription\nPerforms barrier synchronization and communication within a cluster.\nbarrier.cluster instructions can be used by the threads within the cluster for synchronization and communication.\nbarrier.cluster.arrive instruction marks warps’ arrival at barrier without causing executing thread to wait for threads of other participating warps.\nbarrier.cluster.wait instruction causes the executing thread to wait for all non-exited threads of the cluster to perform barrier.cluster.arrive .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-barrier-cluster", "tokens": ["barrier.cluster", "barrier.cluster.arrive", "warps", "barrier.cluster.wait"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：barrier.cluster」，归在「指令」。重点关注 关键词 barrier.cluster、barrier.cluster.arrive、warps、barrier.cluster.wait，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：barrier.cluster」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：barrier.cluster、barrier.cluster.arrive、warps、barrier.cluster.wait。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: membar / fence", "titleZh": "并行同步与通信指令：membar / fence", "numberedTitle": "9.7.14.4. Parallel Synchronization and Communication Instructions: membar / fence", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions", "parentZh": "并行同步与通信指令", "kind": "Instructions", "kindZh": "指令", "summary": "membar , fence", "details": "membar , fence\nEnforce an ordering of memory operations.\nSyntax\nDescription\nThe membar instruction guarantees that prior memory accesses requested by this thread ( ld , st , atom and red instructions) are performed at the specified level , before later memory operations requested by this thread following the membar instruction.\nThe level qualifier specifies the set of threads that may observe the ordering effect of this operation.\nA memory read (e.g., by ld or atom ) has been performed when the value read has been transmitted from memory and cannot be modified by another thread at the indicated level.\nA memory write (e.g., by st , red or atom ) has been performed when the value written has become visible to other threads at the specified level, that is, when the previous value can no longer be read.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-membar", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：membar / fence」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：membar / fence」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: atom", "titleZh": "并行同步与通信指令：atom", "numberedTitle": "9.7.14.5. Parallel Synchronization and Communication Instructions: atom", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions", "parentZh": "并行同步与通信指令", "kind": "Instructions", "kindZh": "指令", "summary": "atom", "details": "atom\nAtomic reduction operations for thread-to-thread communication.\nSyntax\nAtomic operation with scalar type:\nAtomic operation with vector type:\nDescription\nAtomically loads the original value at location a into destination register d , performs a reduction operation with operand b and the value in location a , and stores the result of the specified operation at location a , overwriting the original value.\nFor the .cas (compare-and-swap) operation, operand b is the compare value and operand c is the swap value.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-atom", "tokens": ["cas"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：atom」，归在「指令」。重点关注 关键词 cas，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：atom」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：cas。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: red", "titleZh": "并行同步与通信指令：red", "numberedTitle": "9.7.14.6. Parallel Synchronization and Communication Instructions: red", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions", "parentZh": "并行同步与通信指令", "kind": "Instructions", "kindZh": "指令", "summary": "red", "details": "red\nReduction operations on global and shared memory.\nSyntax\nReduction operation with scalar type:\nReduction operation with vector type:\nDescription\nPerforms a reduction operation with operand b and the value in location a , and stores the result of the specified operation at location a , overwriting the original value.\nOperand a specifies a location in the specified state space.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-red", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：red」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：red」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: red.async", "titleZh": "并行同步与通信指令：red.async", "numberedTitle": "9.7.14.7. Parallel Synchronization and Communication Instructions: red.async", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions", "parentZh": "并行同步与通信指令", "kind": "Instructions", "kindZh": "指令", "summary": "red.async", "details": "red.async\nAsynchronous reduction operation.\nSyntax\nDescription\nred.async is a non-blocking instruction which initiates an asynchronous reduction operation specified by .op , with the operand b and the value at destination shared memory location specified by operand a .\nred.async is performed in the generic proxy.\nOperands\na is a destination address, and must be either a register, or of the form register + immOff , as described in Addresses as Operands .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-red-async", "tokens": ["red.async"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：red.async」，归在「指令」。重点关注 关键词 red.async，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：red.async」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：red.async。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: multimem.red.async", "titleZh": "并行同步与通信指令：multimem.red.async", "numberedTitle": "9.7.14.8. Parallel Synchronization and Communication Instructions: multimem.red.async", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions", "parentZh": "并行同步与通信指令", "kind": "Instructions", "kindZh": "指令", "summary": "multimem.red.async", "details": "multimem.red.async\nPerform asynchronous reduction with release ordering on the multimem address.\nSyntax\nDescription\nmultimem.red.async is a non-blocking instruction which initiates an asynchronous reduction operation specified by .op , with operand b and the value at memory locations residing on each GPU’s memory referred to by the destination multimem address operand a .\nAddress operand a must be a multimem address.\nOtherwise, the behavior is undefined.\nOperands", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-multimem-red-async", "tokens": ["multimem.red.async"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：multimem.red.async」，归在「指令」。重点关注 关键词 multimem.red.async，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：multimem.red.async」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：multimem.red.async。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: vote (deprecated)", "titleZh": "并行同步与通信指令：vote (deprecated)", "numberedTitle": "9.7.14.9. Parallel Synchronization and Communication Instructions: vote (deprecated)", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions", "parentZh": "并行同步与通信指令", "kind": "Instructions", "kindZh": "指令", "summary": "vote (deprecated)", "details": "vote (deprecated)\nVote across thread group.\nSyntax\nDeprecation Note\nThe vote instruction without a .sync qualifier is deprecated in PTX ISA version 6.0.\nSupport for this instruction with .target lower than sm_70 may be removed in a future PTX ISA version.\nRemoval Note\nSupport for vote instruction without a .sync qualifier is removed in PTX ISA version 6.4 for .target sm_70 or higher.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-vote", "tokens": ["sync", "target", "sm_70"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：vote (deprecated)」，归在「指令」。重点关注 关键词 sync、target、sm_70，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：vote (deprecated)」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：sync、target、sm_70。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: vote.sync", "titleZh": "并行同步与通信指令：vote.sync", "numberedTitle": "9.7.14.10. Parallel Synchronization and Communication Instructions: vote.sync", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions", "parentZh": "并行同步与通信指令", "kind": "Instructions", "kindZh": "指令", "summary": "vote.sync", "details": "vote.sync\nVote across thread group.\nSyntax\nDescription\nvote.sync will cause executing thread to wait until all non-exited threads corresponding to membermask have executed vote.sync with the same qualifiers and same membermask value before resuming execution.\nOperand membermask specifies a 32-bit integer which is a mask indicating threads participating in this instruction where the bit position corresponds to thread’s laneid .\nOperand a is a predicate register.\nIn the mode form, vote.sync performs a reduction of the source predicate across all non-exited threads in membermask .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-vote-sync", "tokens": ["vote.sync"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：vote.sync」，归在「指令」。重点关注 关键词 vote.sync，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：vote.sync」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：vote.sync。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: match.sync", "titleZh": "并行同步与通信指令：match.sync", "numberedTitle": "9.7.14.11. Parallel Synchronization and Communication Instructions: match.sync", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions", "parentZh": "并行同步与通信指令", "kind": "Instructions", "kindZh": "指令", "summary": "match.sync", "details": "match.sync\nBroadcast and compare a value across threads in warp.\nSyntax\nDescription\nmatch.sync will cause executing thread to wait until all non-exited threads from membermask have executed match.sync with the same qualifiers and same membermask value before resuming execution.\nOperand membermask specifies a 32-bit integer which is a mask indicating threads participating in this instruction where the bit position corresponds to thread’s laneid.\nmatch.sync performs broadcast and compare of operand a across all non-exited threads in membermask and sets destination d and optional predicate p based on mode.\nOperand a has instruction type and d has .b32 type.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-match-sync", "tokens": ["match.sync", "warp", "b32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：match.sync」，归在「指令」。重点关注 关键词 match.sync、warp、b32，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：match.sync」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：match.sync、warp、b32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: activemask", "titleZh": "并行同步与通信指令：activemask", "numberedTitle": "9.7.14.12. Parallel Synchronization and Communication Instructions: activemask", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions", "parentZh": "并行同步与通信指令", "kind": "Instructions", "kindZh": "指令", "summary": "activemask", "details": "activemask\nQueries the active threads within a warp.\nSyntax\nDescription\nactivemask queries predicated-on active threads from the executing warp and sets the destination d with 32-bit integer mask where bit position in the mask corresponds to the thread’s laneid .\nDestination d is a 32-bit destination register.\nAn active thread will contribute 1 for its entry in the result and exited or inactive or predicated-off thread will contribute 0 for its entry in the result.\nPTX ISA Notes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-activemask", "tokens": ["warp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：activemask」，归在「指令」。重点关注 关键词 warp，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：activemask」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：warp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: redux.sync", "titleZh": "并行同步与通信指令：redux.sync", "numberedTitle": "9.7.14.13. Parallel Synchronization and Communication Instructions: redux.sync", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions", "parentZh": "并行同步与通信指令", "kind": "Instructions", "kindZh": "指令", "summary": "redux.sync", "details": "redux.sync\nPerform reduction operation on the data from each predicated active thread in the thread group.\nSyntax\nDescription\nredux.sync will cause the executing thread to wait until all non-exited threads corresponding to membermask have executed redux.sync with the same qualifiers and same membermask value before resuming execution.\nOperand membermask specifies a 32-bit integer which is a mask indicating threads participating in this instruction where the bit position corresponds to thread’s laneid .\nredux.sync performs a reduction operation .op of the 32 bit source register src across all non-exited threads in the membermask .\nThe result of the reduction operation is written to the 32 bit destination register dst .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-redux-sync", "tokens": ["redux.sync"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：redux.sync」，归在「指令」。重点关注 关键词 redux.sync，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：redux.sync」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：redux.sync。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: griddepcontrol", "titleZh": "并行同步与通信指令：griddepcontrol", "numberedTitle": "9.7.14.14. Parallel Synchronization and Communication Instructions: griddepcontrol", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions", "parentZh": "并行同步与通信指令", "kind": "Instructions", "kindZh": "指令", "summary": "griddepcontrol", "details": "griddepcontrol\nControl execution of dependent grids.\nSyntax\nDescription\nThe griddepcontrol instruction allows the dependent grids and prerequisite grids as defined by the runtime, to control execution in the following way:\n.launch_dependents modifier signals that specific dependents the runtime system designated to react to this instruction can be scheduled as soon as all other CTAs in the grid issue the same instruction or have completed.\nThe dependent may launch before the completion of the current grid.\n.wait modifier causes the executing thread to wait until all prerequisite grids in flight have completed and all the memory operations from the prerequisite grids are performed and made visible to the current grid.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-griddepcontrol", "tokens": ["launch_dependents", "wait"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：griddepcontrol」，归在「指令」。重点关注 关键词 launch_dependents、wait，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：griddepcontrol」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：launch_dependents、wait。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: elect.sync", "titleZh": "并行同步与通信指令：elect.sync", "numberedTitle": "9.7.14.15. Parallel Synchronization and Communication Instructions: elect.sync", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions", "parentZh": "并行同步与通信指令", "kind": "Instructions", "kindZh": "指令", "summary": "elect.sync", "details": "elect.sync\nElect a leader thread from a set of threads.\nSyntax\nDescription\nelect.sync elects one predicated active leader thread from among a set of threads specified by membermask . laneid of the elected thread is returned in the 32-bit destination operand d .\nThe sink symbol ‘_’ can be used for destination operand d .\nOperand membermask specifies a 32-bit integer indicating the set of threads from which a leader is to be elected.\nThe behavior is undefined if the executing thread is not in membermask .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-elect-sync", "tokens": ["elect.sync"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：elect.sync」，归在「指令」。重点关注 关键词 elect.sync，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：elect.sync」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：elect.sync。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: mbarrier", "titleZh": "并行同步与通信指令：mbarrier", "numberedTitle": "9.7.14.16. Parallel Synchronization and Communication Instructions: mbarrier", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions", "parentZh": "并行同步与通信指令", "kind": "Instructions", "kindZh": "指令", "summary": "mbarrier is a barrier created in shared memory that supports :", "details": "mbarrier is a barrier created in shared memory that supports :\nSynchronizing any subset of threads within a CTA\nOne-way synchronization of threads across CTAs of a cluster. As noted in mbarrier support with shared memory , threads can perform only arrive operations but not *_wait on an mbarrier located in shared::cluster space.\nWaiting for completion of asynchronous memory operations initiated by a thread and making them visible to other threads.\nAn mbarrier object is an opaque object in memory which can be initialized and invalidated using :\nmbarrier.init\nmbarrier.inval\nOperations supported on mbarrier object s are :", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier", "tokens": ["mbarrier.init", "mbarrier.inval"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：mbarrier」，归在「指令」。重点关注 关键词 mbarrier.init、mbarrier.inval，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：mbarrier」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mbarrier.init、mbarrier.inval。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Size and alignment of mbarrier object", "titleZh": "mbarrier 对象大小与对齐", "numberedTitle": "9.7.14.16.1. Size and alignment of mbarrier object", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "An mbarrier object is an opaque object with the following type and alignment requirements :", "details": "An mbarrier object is an opaque object with the following type and alignment requirements :\nType | Alignment (bytes) | Memory space\n.b64 | 8 | .shared", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-size-alignment", "tokens": ["b64", "shared"], "summaryZh": "本条整理 PTX ISA 官方文档中的「mbarrier 对象大小与对齐」，归在「指令」。重点关注 关键词 b64、shared，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「mbarrier 对象大小与对齐」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：b64、shared。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Layouts of the mbarrier object", "titleZh": "布局 of mbarrier object", "numberedTitle": "9.7.14.16.2. Layouts of the mbarrier object", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "An opaque mbarrier object supports two different layouts:", "details": "An opaque mbarrier object supports two different layouts:\n.layout::v0\n.layout::v1\nThe exact layout of the mbarrier object can be specified at the time of creation.\nThe asynchronous operations that can be tracked by an mbarrier object depend on the layout.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-object-layout", "tokens": ["layout"], "summaryZh": "本条整理 PTX ISA 官方文档中的「布局 of mbarrier object」，归在「指令」。重点关注 关键词 layout，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「布局 of mbarrier object」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：layout。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Contents of the mbarrier object", "titleZh": "mbarrier 对象内容", "numberedTitle": "9.7.14.16.3. Contents of the mbarrier object", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "An opaque mbarrier object irrespective of the layout keeps track of the following information :", "details": "An opaque mbarrier object irrespective of the layout keeps track of the following information :\nCurrent primary and conditional phases of the mbarrier object\nCount of pending arrivals for the current phase of the mbarrier object\nCount of expected arrivals for the next phase of the mbarrier object\nCount of pending asynchronous memory operations (or transactions) tracked by the current phase of the mbarrier object . This is also referred to as tx-count .\nHowever, an mbarrier object with .layout::v1 additionally keeps track of the following information:\nPayload report corresponding to each primary phase\nAn mbarrier object progresses through a sequence of phases where each phase is defined by threads performing an expected number of arrive-on operations.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-contents", "tokens": ["layout"], "summaryZh": "本条整理 PTX ISA 官方文档中的「mbarrier 对象内容」，归在「指令」。重点关注 关键词 layout，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「mbarrier 对象内容」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：layout。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Lifecycle of the mbarrier object", "titleZh": "mbarrier 对象生命周期", "numberedTitle": "9.7.14.16.4. Lifecycle of the mbarrier object", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "The mbarrier object must be initialized prior to use.", "details": "The mbarrier object must be initialized prior to use.\nAn mbarrier object is used to synchronize threads, track asynchronous memory operations.\nAn mbarrier object may be used to perform a sequence of such synchronizations.\nAn mbarrier object must be invalidated to repurpose its memory for any purpose, including repurposing it for another mbarrier object.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-lifecycle", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「mbarrier 对象生命周期」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「mbarrier 对象生命周期」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Phases of the mbarrier object", "titleZh": "mbarrier 对象 phase", "numberedTitle": "9.7.14.16.5. Phases of the mbarrier object", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "PTX ISA 文档章节：Phases of the mbarrier object", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-phase", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「mbarrier 对象 phase」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「mbarrier 对象 phase」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。"}, {"title": "Primary phase", "titleZh": "Primary phase", "numberedTitle": "9.7.14.16.5.1. Primary phase", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Phases of the mbarrier object", "parentZh": "mbarrier 对象 phase", "kind": "Instructions", "kindZh": "指令", "summary": "The primary phase of an mbarrier object is the number of times the mbarrier object has been used to synchronize threads and asynchronous operations. In each primary phase {0, 1, 2, …}, threads perform in program order :", "details": "The primary phase of an mbarrier object is the number of times the mbarrier object has been used to synchronize threads and asynchronous operations.\nIn each primary phase {0, 1, 2, …}, threads perform in program order :\narrive-on operations to complete the current primary phase and\ntest_wait / try_wait operations to check for the completion of the current primary phase.\nAn mbarrier object is automatically reinitialized upon completion of the current primary phase for immediate use in the next phase.\nThe current primary phase is incomplete and all prior primary phases are complete.\nFor each primary phase of the mbarrier object, at least one test_wait or try_wait operation must be performed which returns True for waitComplete before an arrive-on operation in the subsequent primary phase.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-primary-phase", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Primary phase」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Primary phase」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Conditional phase", "titleZh": "Conditional phase", "numberedTitle": "9.7.14.16.5.2. Conditional phase", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Phases of the mbarrier object", "parentZh": "mbarrier 对象 phase", "kind": "Instructions", "kindZh": "指令", "summary": "The primary phase of an mbarrier object advances upon completion of arrivals, and transaction-count updates of asynchronous operations tracked by the mbarrier. The conditional phase advances if the primary phase advances, and no asynchronous operation tracked by the...", "details": "The primary phase of an mbarrier object advances upon completion of arrivals, and transaction-count updates of asynchronous operations tracked by the mbarrier.\nThe conditional phase advances if the primary phase advances, and no asynchronous operation tracked by the mbarrier prevents it via a report-on operation.\nMbarrier objects with .layout::v0 do not support tracking asynchronous operations that could prevent the conditional phase from advancing via report-on , resulting in both phases advancing in unison.\nThat is, either both phase advance, or no phase advances.\nMbarrier objects with .layout::v1 support tracking asynchronous operations that can prevent the conditional phase from advancing via a report-on operation.\nIf the primary phase advances, but the conditional phase does not advance, the payload report is non-zero and may contain more information.\nAn mbarrier object is automatically reinitialized upon completion of the current primary phase for immediate use in the next phase.\nRefer Phase Completion of the mbarrier object for more details on conditional phase completion.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-conditional-phase", "tokens": ["layout"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Conditional phase」，归在「指令」。重点关注 关键词 layout，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Conditional phase」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：layout。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Tracking asynchronous operations by the mbarrier object", "titleZh": "Tracking 异步操作 by mbarrier object", "numberedTitle": "9.7.14.16.6. Tracking asynchronous operations by the mbarrier object", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "Starting with the Hopper architecture ( sm_9x ), mbarrier object supports a new count, called tx-count , which is used for tracking the completion of asynchronous memory operations or transactions. tx-count tracks the number of asynchronous transactions, in units...", "details": "Starting with the Hopper architecture ( sm_9x ), mbarrier object supports a new count, called tx-count , which is used for tracking the completion of asynchronous memory operations or transactions. tx-count tracks the number of asynchronous transactions, in units specified by the asynchronous memory operation, that are outstanding and yet to be complete.\nThe tx-count of an mbarrier object must be set to the total amount of asynchronous memory operations, in units as specified by the asynchronous operations, to be tracked by the current phase.\nUpon completion of each of the asynchronous operations, the complete-tx operation will be performed on the mbarrier object and thus progress the mbarrier towards the completion of the current phase.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-tracking-async-operations", "tokens": ["sm_9x"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Tracking 异步操作 by mbarrier object」，归在「指令」。重点关注 关键词 sm_9x，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Tracking 异步操作 by mbarrier object」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：sm_9x。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "expect-tx operation", "titleZh": "expect-tx 操作", "numberedTitle": "9.7.14.16.6.1. expect-tx operation", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Tracking asynchronous operations by the mbarrier object", "parentZh": "Tracking 异步操作 by mbarrier object", "kind": "Instructions", "kindZh": "指令", "summary": "The expect-tx operation, with an expectCount argument, increases the tx-count of an mbarrier object by the value specified by expectCount . This sets the current phase of the mbarrier object to expect and track the completion of additional asynchronous transactions.", "details": "The expect-tx operation, with an expectCount argument, increases the tx-count of an mbarrier object by the value specified by expectCount .\nThis sets the current phase of the mbarrier object to expect and track the completion of additional asynchronous transactions.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-expect-tx-operation", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「expect-tx 操作」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「expect-tx 操作」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "complete-tx operation", "titleZh": "complete-tx 操作", "numberedTitle": "9.7.14.16.6.2. complete-tx operation", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Tracking asynchronous operations by the mbarrier object", "parentZh": "Tracking 异步操作 by mbarrier object", "kind": "Instructions", "kindZh": "指令", "summary": "The complete-tx operation, with an completeCount argument, on an mbarrier object consists of the following:", "details": "The complete-tx operation, with an completeCount argument, on an mbarrier object consists of the following:", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-complete-tx-operation", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「complete-tx 操作」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「complete-tx 操作」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Tracking successful completion of an operation using the mbarrier object", "titleZh": "Tracking successful completion of an 操作使用 mbarrier object", "numberedTitle": "9.7.14.16.7. Tracking successful completion of an operation using the mbarrier object", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "An mbarrier object with layout .layout::v1 can track asynchronous operations that prevent the conditional phase from advancing and provide additional information via the payload report on completion.", "details": "An mbarrier object with layout .layout::v1 can track asynchronous operations that prevent the conditional phase from advancing and provide additional information via the payload report on completion.\nThe mbarrier.test_wait and mbarrier.try_wait instructions with .phase_type::primary allow observing primary phase completion and the payload report.\nThe payload report consists of a report predicate ( reportPredicate ) and a report value ( reportValue ).\nThe mbarrier.test_wait and mbarrier.try_wait instructions with .phase_type::conditional allow observing the conditional phase advance which means the payload report was zero.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-tracking", "tokens": ["layout", "mbarrier.test", "mbarrier.try", "phase_type"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Tracking successful completion of an 操作使用 mbarrier object」，归在「指令」。重点关注 关键词 layout、mbarrier.test、mbarrier.try、phase_type，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Tracking successful completion of an 操作使用 mbarrier object」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：layout、mbarrier.test、mbarrier.try、phase_type。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Phase Completion of the mbarrier object", "titleZh": "mbarrier 对象 phase 完成", "numberedTitle": "9.7.14.16.8. Phase Completion of the mbarrier object", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "The requirements for completion of the current phase are described below. Upon completion of the current phase, the phase transitions to the subsequent phase as described below.", "details": "The requirements for completion of the current phase are described below.\nUpon completion of the current phase, the phase transitions to the subsequent phase as described below.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-phase-completion", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「mbarrier 对象 phase 完成」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「mbarrier 对象 phase 完成」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Arrive-on operation on mbarrier object", "titleZh": "Arrive-on 操作 on mbarrier object", "numberedTitle": "9.7.14.16.9. Arrive-on operation on mbarrier object", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "An arrive-on operation, with an optional count argument, on an mbarrier object consists of the following 2 steps :", "details": "An arrive-on operation, with an optional count argument, on an mbarrier object consists of the following 2 steps :\nmbarrier signalling: Signals the arrival of the executing thread OR completion of the asynchronous instruction which signals the arrive-on operation initiated by the executing thread on the mbarrier object . As a result of this, the pending arrival count is decremented by count . If the count argument is not specified, then it defaults to 1.\nmbarrier potentially completing the current phase: If the current phase has been completed then the mbarrier transitions to the next phase. Refer to Phase Completion of the mbarrier object for details on phase completion requirements and phase transition process.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-arrive-on", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Arrive-on 操作 on mbarrier object」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Arrive-on 操作 on mbarrier object」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Report-on operation on mbarrier object", "titleZh": "Report-on 操作 on mbarrier object", "numberedTitle": "9.7.14.16.10. Report-on operation on mbarrier object", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "The report-on operation on an mbarrier object signals miscellaneous information regarding asynchronous operation. For example, such a miscellaneous information can be about errors, warnings encountered; otherwise, it can as well be any extra information conveyed by...", "details": "The report-on operation on an mbarrier object signals miscellaneous information regarding asynchronous operation.\nFor example, such a miscellaneous information can be about errors, warnings encountered; otherwise, it can as well be any extra information conveyed by asynchronous operation.\nThe miscellaneous information reported by asynchronous operation via report-on mbarrer operation would be updated in the payload report.\nThe following asynchronous operations can potentially issue report-on operation on an associated mbarrier object :\nFabric operations such as fabric.try_get , fabric.try_put , fabric.try_red , fabric.try_pullred . Refer to Fabric Reporting Mechanism for more details.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-report-on", "tokens": ["fabric.try"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Report-on 操作 on mbarrier object」，归在「指令」。重点关注 关键词 fabric.try，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Report-on 操作 on mbarrier object」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：fabric.try。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "mbarrier support with shared memory", "titleZh": "mbarrier 与共享内存支持", "numberedTitle": "9.7.14.16.11. mbarrier support with shared memory", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "The following table summarizes the support of various mbarrier operations on mbarrier objects located at different shared memory locations:", "details": "The following table summarizes the support of various mbarrier operations on mbarrier objects located at different shared memory locations:\nmbarrier operations | .shared::cta | .shared::cluster\nmbarrier.arrive , mbarrier.arrive_drop | Supported | Supported, cannot return result\nmbarrier.expect_tx | Supported | Supported\nmbarrier.complete_tx | Supported | Supported\nOther mbarrier operations | Supported | Not supported", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-smem", "tokens": ["shared", "mbarrier.arrive", "mbarrier.expect", "mbarrier.complete"], "summaryZh": "本条整理 PTX ISA 官方文档中的「mbarrier 与共享内存支持」，归在「指令」。重点关注 关键词 shared、mbarrier.arrive、mbarrier.expect、mbarrier.complete，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「mbarrier 与共享内存支持」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：shared、mbarrier.arrive、mbarrier.expect、mbarrier.complete。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: mbarrier.init", "titleZh": "并行同步与通信指令：mbarrier.init", "numberedTitle": "9.7.14.16.12. Parallel Synchronization and Communication Instructions: mbarrier.init", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "mbarrier.init", "details": "mbarrier.init\nInitialize the mbarrier object .\nSyntax\nDescription\nmbarrier.init initializes the mbarrier object at the location specified by the address operand addr with the unsigned 32-bit integer count .\nThe .layout qualifier specifies the layout that is used to initialize the mbarrier object.\nThe valid range of values for the operand count varies depending upon .layout as specified below:\n[1, …, 2 20 - 1] for mbarrier with .layout::v0", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-init", "tokens": ["mbarrier.init", "layout"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：mbarrier.init」，归在「指令」。重点关注 关键词 mbarrier.init、layout，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：mbarrier.init」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mbarrier.init、layout。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: mbarrier.inval", "titleZh": "并行同步与通信指令：mbarrier.inval", "numberedTitle": "9.7.14.16.13. Parallel Synchronization and Communication Instructions: mbarrier.inval", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "mbarrier.inval", "details": "mbarrier.inval\nInvalidates the mbarrier object .\nSyntax\nDescription\nmbarrier.inval invalidates the mbarrier object at the location specified by the address operand addr .\nThe invalidation is supported for all layouts described in Layouts of the mbarrier object .\nAn mbarrier object must be invalidated before using its memory location for any other purpose.\nPerforming any mbarrier operation except mbarrier.init on a memory location that does not contain a valid mbarrier object , results in undefined behaviour.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-inval", "tokens": ["mbarrier.inval", "mbarrier.init"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：mbarrier.inval」，归在「指令」。重点关注 关键词 mbarrier.inval、mbarrier.init，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：mbarrier.inval」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mbarrier.inval、mbarrier.init。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: mbarrier.expect_tx", "titleZh": "并行同步与通信指令：mbarrier.expect_tx", "numberedTitle": "9.7.14.16.14. Parallel Synchronization and Communication Instructions: mbarrier.expect_tx", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "mbarrier.expect_tx", "details": "mbarrier.expect_tx\nPerfoms expect-tx operation on the mbarrier object .\nSyntax\nDescription\nA thread executing mbarrier.expect_tx performs an expect-tx operation on the mbarrier object at the location specified by the address operand addr .\nThe 32-bit unsigned integer operand txCount specifies the expectCount argument to the expect-tx operation.\nIf no state space is specified then Generic Addressing is used.\nIf the address specified by addr does not fall within the address window of .shared::cta or .shared::cluster state space then the behavior is undefined.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-expect-tx", "tokens": ["mbarrier.expect", "shared"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：mbarrier.expect_tx」，归在「指令」。重点关注 关键词 mbarrier.expect、shared，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：mbarrier.expect_tx」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mbarrier.expect、shared。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: mbarrier.complete_tx", "titleZh": "并行同步与通信指令：mbarrier.complete_tx", "numberedTitle": "9.7.14.16.15. Parallel Synchronization and Communication Instructions: mbarrier.complete_tx", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "mbarrier.complete_tx", "details": "mbarrier.complete_tx\nPerfoms complete-tx operation on the mbarrier object .\nSyntax\nDescription\nA thread executing mbarrier.complete_tx performs a complete-tx operation on the mbarrier object at the location specified by the address operand addr .\nThe 32-bit unsigned integer operand txCount specifies the completeCount argument to the complete-tx operation.\nmbarrier.complete_tx does not involve any asynchronous memory operations and only simulates the completion of an asynchronous memory operation and its side effect of signaling to the mbarrier object .\nIf no state space is specified then Generic Addressing is used.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-complete-tx", "tokens": ["mbarrier.complete"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：mbarrier.complete_tx」，归在「指令」。重点关注 关键词 mbarrier.complete，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：mbarrier.complete_tx」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mbarrier.complete。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: mbarrier.arrive", "titleZh": "并行同步与通信指令：mbarrier.arrive", "numberedTitle": "9.7.14.16.16. Parallel Synchronization and Communication Instructions: mbarrier.arrive", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "mbarrier.arrive", "details": "mbarrier.arrive\nPerforms arrive-on operation on the mbarrier object .\nSyntax\nDescription\nA thread executing mbarrier.arrive performs an arrive-on operation on the mbarrier object at the location specified by the address operand addr .\nThe 32-bit unsigned integer operand count specifies the count argument to the arrive-on operation.\nIf no state space is specified then Generic Addressing is used.\nIf the address specified by addr does not fall within the address window of .shared::cta state space then the behavior is undefined.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-arrive", "tokens": ["mbarrier.arrive", "shared"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：mbarrier.arrive」，归在「指令」。重点关注 关键词 mbarrier.arrive、shared，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：mbarrier.arrive」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mbarrier.arrive、shared。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: mbarrier.arrive_drop", "titleZh": "并行同步与通信指令：mbarrier.arrive_drop", "numberedTitle": "9.7.14.16.17. Parallel Synchronization and Communication Instructions: mbarrier.arrive_drop", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "mbarrier.arrive_drop", "details": "mbarrier.arrive_drop\nDecrements the expected count of the mbarrier object and performs arrive-on operation .\nSyntax\nDescription\nA thread executing mbarrier.arrive_drop on the mbarrier object at the location specified by the address operand addr performs the following steps:\nDecrements the expected arrival count of the mbarrier object by the value specified by the 32-bit integer operand count . If count operand is not specified, it defaults to 1.\nPerforms an arrive-on operation on the mbarrier object . The operand count specifies the count argument to the arrive-on operation .\nThe decrement done in the expected arrivals count of the mbarrier object will be for all the subsequent phases of the mbarrier object .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-arrive-drop", "tokens": ["mbarrier.arrive"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：mbarrier.arrive_drop」，归在「指令」。重点关注 关键词 mbarrier.arrive，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：mbarrier.arrive_drop」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mbarrier.arrive。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: cp.async.mbarrier.arrive", "titleZh": "并行同步与通信指令：cp.async.mbarrier.arrive", "numberedTitle": "9.7.14.16.18. Parallel Synchronization and Communication Instructions: cp.async.mbarrier.arrive", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "cp.async.mbarrier.arrive", "details": "cp.async.mbarrier.arrive\nMakes the mbarrier object track all prior cp.async operations initiated by the executing thread.\nSyntax\nDescription\nCauses an arrive-on operation to be triggered by the system on the mbarrier object upon the completion of all prior cp.async operations initiated by the executing thread.\nThe mbarrier object is at the location specified by the operand addr .\nWhen .noinc modifier is not specified, the pending count of the mbarrier object is incremented by 1 prior to the asynchronous arrive-on operation .\nThis results in a zero-net change for the pending count from the asynchronous arrive-on operation during the current phase.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-cp-async-mbarrier-arrive", "tokens": ["cp.async.mbarrier.arrive", "cp.async", "noinc"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：cp.async.mbarrier.arrive」，归在「指令」。重点关注 关键词 cp.async.mbarrier.arrive、cp.async、noinc，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：cp.async.mbarrier.arrive」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：cp.async.mbarrier.arrive、cp.async、noinc。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: mbarrier.test_wait / mbarrier.try_wait", "titleZh": "并行同步与通信指令：mbarrier.test_wait / mbarrier.try_wait", "numberedTitle": "9.7.14.16.19. Parallel Synchronization and Communication Instructions: mbarrier.test_wait / mbarrier.try_wait", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "mbarrier.test_wait , mbarrier.try_wait", "details": "mbarrier.test_wait , mbarrier.try_wait\nChecks whether the mbarrier object has completed the phase.\nSyntax\nDescription\nThe test_wait and try_wait operations test for the completion of the current or the immediately preceding phase of an mbarrier object at the location specified by the operand addr .\nmbarrier.test_wait is a non-blocking instruction which tests for the completion of the phase.\nmbarrier.try_wait is a potentially blocking instruction which tests for the completion of the phase.\nIf the phase is not complete, the executing thread may be suspended.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-test-wait-try-wait", "tokens": ["mbarrier.test", "mbarrier.try"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：mbarrier.test_wait / mbarrier.try_wait」，归在「指令」。重点关注 关键词 mbarrier.test、mbarrier.try，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：mbarrier.test_wait / mbarrier.try_wait」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mbarrier.test、mbarrier.try。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: mbarrier.pending_count", "titleZh": "并行同步与通信指令：mbarrier.pending_count", "numberedTitle": "9.7.14.16.20. Parallel Synchronization and Communication Instructions: mbarrier.pending_count", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "mbarrier.pending_count", "details": "mbarrier.pending_count\nQuery the pending arrival count from the opaque mbarrier state.\nSyntax\nDescription\nThe pending count can be queried from the opaque mbarrier state using mbarrier.pending_count .\nThe state operand is a 64-bit register that must be the result of a prior mbarrier.arrive.noComplete or mbarrier.arrive_drop.noComplete instruction.\nOtherwise, the behavior is undefined.\nThe destination register count is a 32-bit unsigned integer representing the pending count of the mbarrier object prior to the arrive-on operation from which the state register was obtained.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-pending-count", "tokens": ["mbarrier.pending", "mbarrier.arrive.no", "mbarrier.arrive", "drop.no"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：mbarrier.pending_count」，归在「指令」。重点关注 关键词 mbarrier.pending、mbarrier.arrive.no、mbarrier.arrive、drop.no，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：mbarrier.pending_count」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mbarrier.pending、mbarrier.arrive.no、mbarrier.arrive、drop.no。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: mbarrier.check_layout", "titleZh": "并行同步与通信指令：mbarrier.check_layout", "numberedTitle": "9.7.14.16.21. Parallel Synchronization and Communication Instructions: mbarrier.check_layout", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions: mbarrier", "parentZh": "并行同步与通信指令：mbarrier", "kind": "Instructions", "kindZh": "指令", "summary": "mbarrier.check_layout", "details": "mbarrier.check_layout\nCheck the layout of the mbarrier object .\nSyntax\nDescription\nThe layout of the opaque mbarrier object can be queried using mbarrier.check_layout .\nThe address operand addr specifies the memory location of the mbarrier object whose layout is being inspected.\nThe instruction sets the predicate operand p to True if the layout of the mbarrier object exactly matches the .layout qualifier.\nIf no state space is specified then Generic Addressing is used.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-mbarrier-check-layout", "tokens": ["mbarrier.check", "layout"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：mbarrier.check_layout」，归在「指令」。重点关注 关键词 mbarrier.check、layout，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：mbarrier.check_layout」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mbarrier.check、layout。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: tensormap.cp_fenceproxy", "titleZh": "并行同步与通信指令：tensormap.cp_fenceproxy", "numberedTitle": "9.7.14.17. Parallel Synchronization and Communication Instructions: tensormap.cp_fenceproxy", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions", "parentZh": "并行同步与通信指令", "kind": "Instructions", "kindZh": "指令", "summary": "tensormap.cp_fenceproxy", "details": "tensormap.cp_fenceproxy\nA fused copy and fence operation.\nSyntax\nDescription\nThe tensormap.cp_fenceproxy instructions perform the following operations in order :\nCopies data of size specified by the size argument, in bytes, from the location specified by the address operand src in shared memory to the location specified by the address operand dst in the global memory, in the generic proxy.\nEstablishes a uni-directional proxy release pattern on the ordering from the copy operation to the subsequent access performed in the tensormap proxy on the address dst .\nThe valid value of immediate operand size is 128.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-tensormap-cp-fenceproxy", "tokens": ["tensormap.cp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：tensormap.cp_fenceproxy」，归在「指令」。重点关注 关键词 tensormap.cp，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：tensormap.cp_fenceproxy」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tensormap.cp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: clusterlaunchcontrol.try_cancel", "titleZh": "并行同步与通信指令：clusterlaunchcontrol.try_cancel", "numberedTitle": "9.7.14.18. Parallel Synchronization and Communication Instructions: clusterlaunchcontrol.try_cancel", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions", "parentZh": "并行同步与通信指令", "kind": "Instructions", "kindZh": "指令", "summary": "clusterlaunchcontrol.try_cancel", "details": "clusterlaunchcontrol.try_cancel\nRequests cancellation of cluster which is not launched yet.\nSyntax\nDescription\nThe clusterlaunchcontrol.try_cancel instruction requests atomically cancelling the launch of a cluster that has not started running yet.\nIt asynchronously writes an opaque response to shared memory indicating whether the operation succeeded or failed.\nOn success, the opaque response contains the ctaid of the first CTA of the canceled cluster; no other successful response from other clusterlaunchcontrol.try_cancel operations from the same grid will contain that id.\nThe mandatory .async qualifier indicates that the instruction will initiate the cancellation operation asynchronously and control will return to the executing thread before the requested operation is complete.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-clusterlaunchcontrol-try-cancel", "tokens": ["clusterlaunchcontrol.try", "async"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：clusterlaunchcontrol.try_cancel」，归在「指令」。重点关注 关键词 clusterlaunchcontrol.try、async，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：clusterlaunchcontrol.try_cancel」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：clusterlaunchcontrol.try、async。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Parallel Synchronization and Communication Instructions: clusterlaunchcontrol.query_cancel", "titleZh": "并行同步与通信指令：clusterlaunchcontrol.query_cancel", "numberedTitle": "9.7.14.19. Parallel Synchronization and Communication Instructions: clusterlaunchcontrol.query_cancel", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Parallel Synchronization and Communication Instructions", "parentZh": "并行同步与通信指令", "kind": "Instructions", "kindZh": "指令", "summary": "clusterlaunchcontrol.query_cancel", "details": "clusterlaunchcontrol.query_cancel\nQueries response of clusterlaunchcontrol.try_cancel operation.\nSyntax\nDescription\nInstruction clusterlaunchcontrol.query_cancel can be used to decode opaque response written by instruction clusterlaunchcontrol.try_cancel .\nAfter loading response from clusterlaunchcontrol.try_cancel instruction into 16-byte register it can be further queried using clusterlaunchcontrol.query_cancel instruction as follows:\nclusterlaunchcontrol.query_cancel.is_canceled.pred.b128 : If the cluster is canceled successfully, predicate p is set to true ; otherwise, it is set to false .\nIf the request succeeded, the instruction clusterlaunchcontrol.query_cancel.get_first_ctaid extracts the CTA id of the first CTA in the canceled cluster.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#parallel-synchronization-and-communication-instructions-clusterlaunchcontrol-query-cancel", "tokens": ["clusterlaunchcontrol.query", "clusterlaunchcontrol.try", "cancel.is", "canceled.pred.b128", "cancel.get"], "summaryZh": "本条整理 PTX ISA 官方文档中的「并行同步与通信指令：clusterlaunchcontrol.query_cancel」，归在「指令」。重点关注 关键词 clusterlaunchcontrol.query、clusterlaunchcontrol.try、cancel.is、canceled.pred.b128、cancel.get，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「并行同步与通信指令：clusterlaunchcontrol.query_cancel」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：clusterlaunchcontrol.query、clusterlaunchcontrol.try、cancel.is、canceled.pred.b128、cancel.get。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Warp Level Matrix Multiply-Accumulate Instructions", "titleZh": "Warp 级矩阵乘加指令", "numberedTitle": "9.7.15. Warp Level Matrix Multiply-Accumulate Instructions", "level": "H3", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Instructions", "parentZh": "指令", "kind": "Instructions", "kindZh": "指令", "summary": "The matrix multiply and accumulate operation has the following form:", "details": "The matrix multiply and accumulate operation has the following form:\nwhere D and C are called accumulators and may refer to the same matrix.\nPTX provides two ways to perform matrix multiply-and-accumulate computation:\nUsing wmma instructions: This warp-level computation is performed collectively by all threads in the warp as follows: Load matrices A, B and C from memory into registers using the wmma.load operation. When the operation completes, the destination registers in each thread hold a fragment of the loaded matrix. Perform the matrix multiply and accumulate operation using the wmma.mma operation on the loaded matrices. When the operation completes, the destination registers in each thread hold a fragment of the result matrix returned by the wmma.mma operation. Store result Matrix D back to memory using the wmma.store operation. Alternately, result matrix D can also be used as argument C for a subsequent wmma.mma operation. The wmma.load and wmma.store instructions implicitly handle the organization of matrix elements when loading the input matrices from memory for the wmma.mma operation and when storing the result back to memory.\nUsing mma instruction: Similar to wmma , mma also requires computation to be performed collectively by all threads in the warp however distribution of matrix elements across different threads in warp needs to be done explicitly before invoking the mma operation. The mma instruction supports both dense as well as sparse matrix A. The sparse variant can be used when A is a structured sparse matrix as described in Sparse matrix storage .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#warp-level-matrix-instructions", "tokens": ["warp", "wmma.load", "wmma.mma", "wmma.store"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Warp 级矩阵乘加指令」，归在「指令」。重点关注 关键词 warp、wmma.load、wmma.mma、wmma.store，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Warp 级矩阵乘加指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：warp、wmma.load、wmma.mma、wmma.store。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Matrix Shape", "titleZh": "矩阵 Shape", "numberedTitle": "9.7.15.1. Matrix Shape", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Warp Level Matrix Multiply-Accumulate Instructions", "parentZh": "Warp 级矩阵乘加指令", "kind": "Instructions", "kindZh": "指令", "summary": "The matrix multiply and accumulate operations support a limited set of shapes for the operand matrices A, B and C. The shapes of all three matrix operands are collectively described by the tuple MxNxK , where A is an MxK matrix, B is a KxN matrix, while C and D are MxN...", "details": "The matrix multiply and accumulate operations support a limited set of shapes for the operand matrices A, B and C.\nThe shapes of all three matrix operands are collectively described by the tuple MxNxK , where A is an MxK matrix, B is a KxN matrix, while C and D are MxN matrices.\nThe following matrix shapes are supported for the specified types:\nInstruction | Scale | Sparsity | Multiplicand Data-type | Shape | PTX ISA version\nwmma | NA | Dense | Floating-point - .f16 | .m16n16k16 , .m8n32k16 , and .m32n8k16 | PTX ISA version 6.0\nwmma | Dense | Alternate floating-point format - .bf16 | .m16n16k16 , .m8n32k16 , and .m32n8k16 | PTX ISA version 7.0\nwmma | Dense | Alternate floating-point format - .tf32 | .m16n16k8 | PTX ISA version 7.0\nwmma | Dense | Integer - .u8 / .s8 | .m16n16k16 , .m8n32k16 , and .m32n8k16 | PTX ISA version 6.3", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#warp-level-matrix-shape", "tokens": ["f16", "m16n16k16", "m8n32k16", "m32n8k16", "bf16", "tf32", "m16n16k8"], "summaryZh": "本条整理 PTX ISA 官方文档中的「矩阵 Shape」，归在「指令」。重点关注 关键词 f16、m16n16k16、m8n32k16、m32n8k16、bf16，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「矩阵 Shape」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：f16、m16n16k16、m8n32k16、m32n8k16、bf16、tf32、m16n16k8。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Matrix Data-types", "titleZh": "矩阵数据类型", "numberedTitle": "9.7.15.2. Matrix Data-types", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Warp Level Matrix Multiply-Accumulate Instructions", "parentZh": "Warp 级矩阵乘加指令", "kind": "Instructions", "kindZh": "指令", "summary": "The matrix multiply and accumulate operation is supported separately on integer, floating-point, sub-byte integer and single bit data-types. All operands must contain the same basic type kind, i.e., integer or floating-point.", "details": "The matrix multiply and accumulate operation is supported separately on integer, floating-point, sub-byte integer and single bit data-types.\nAll operands must contain the same basic type kind, i.e., integer or floating-point.\nFor floating-point matrix multiply and accumulate operation, different matrix operands may have different precision, as described later.\nData-type | Multiplicands (A or B) | Accumulators (C or D)\nInteger | .u8 , .s8 | .s32\nFloating Point | .f16 | .f16 , .f32\nAlternate floating Point | .bf16 | .f32\nAlternate floating Point | .tf32 | .f32", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#warp-level-matrix-data-types", "tokens": ["s32", "f16", "f32", "bf16", "tf32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「矩阵数据类型」，归在「指令」。重点关注 关键词 s32、f16、f32、bf16、tf32，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「矩阵数据类型」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：s32、f16、f32、bf16、tf32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Block Scaling for mma.sync", "titleZh": "线程块 Scaling for mma.sync", "numberedTitle": "9.7.15.3. Block Scaling for mma.sync", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Warp Level Matrix Multiply-Accumulate Instructions", "parentZh": "Warp 级矩阵乘加指令", "kind": "Instructions", "kindZh": "指令", "summary": "The mma instruction with the following .kind qualifier:", "details": "The mma instruction with the following .kind qualifier:\n.kind::mxf8f6f4\n.kind::mxf4\n.kind::mxf4nvf4\nperform matrix multiplication with block scaling.\nThis operation has the following form: D = (A * scale_A) * (B * scale_B) + C .\nFor a scale_A matrix of shape M x SFA_N , each row of matrix A is divided into SFA_N number of chunks and each chunk of a row is multiplied with the corresponding element (henceforth referred as SF_A ) from the same row of scale_A .\nSimilarly, for a scale_B matrix of shape SFB_M x N , each column of matrix B is divided into the SFB_M number of chunks and each chunk of a column is multiplied with the corresponding element (henceforth referred as SF_B ) from the sam
