name: Deploy Pocket Reader
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install frontend dependencies
        run: |
          npm ci
          npm ci --prefix stockarena
          npm ci --prefix ai-infra-board
      - name: Build website against the content service
        env:
          VITE_SUPABASE_URL: ${{ secrets.STOCKARENA_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STOCKARENA_SUPABASE_ANON_KEY }}
        run: npm run build:web
      - name: Publish signed mobile pages from the same source
        env:
          POCKET_UPDATE_PRIVATE_KEY: ${{ secrets.POCKET_UPDATE_PRIVATE_KEY }}
        run: |
          node scripts/build-site.mjs --native --reuse-builds
          npm run build:update
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify published mobile update
        run: node scripts/verify-live-update.mjs
