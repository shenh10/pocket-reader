d Data Movement Shape", "parentZh": "Matrix 与数据搬移 Shape", "kind": "Instructions", "kindZh": "指令", "summary": "The data movement shape indicates the dimension of the data to be moved to or from the Tensor Memory . These shapes are described as a tuple lane x size where:", "details": "The data movement shape indicates the dimension of the data to be moved to or from the Tensor Memory .\nThese shapes are described as a tuple lane x size where:\nlane indicates the number of rows in the Tensor Memory ; and\nsize indicates the amount of data, in units of bits (b), across the columns in the Tensor Memory .\nThe following shapes are supported by various tcgen05 operations:\nShape | tcgen05.<op>\n.16x64b , .16x128b , .16x256b , .16x32bx2 , .32x32b | .ld / .st\n.4x256b , .32x128b , .64x128b , .128x256b , .128x128b | .cp", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-data-movement-shape", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「数据搬移 Shape」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「数据搬移 Shape」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Memory Layout", "titleZh": "Memory 布局", "numberedTitle": "9.7.17.2.3.1. Memory Layout", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Data Movement Shape", "parentZh": "数据搬移 Shape", "kind": "Instructions", "kindZh": "指令", "summary": "The following shows the layout of the matrix fragments across threads of the warp.", "details": "The following shows the layout of the matrix fragments across threads of the warp.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-memory-layout", "tokens": ["warp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Memory 布局」，归在「指令」。重点关注 关键词 warp，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Memory 布局」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：warp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Major-ness supported by Strides", "titleZh": "Stride 支持的 major-ness", "numberedTitle": "9.7.17.3. Major-ness supported by Strides", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Family Instructions", "parentZh": "第五代 TensorCore 指令族", "kind": "Instructions", "kindZh": "指令", "summary": "There are two strides involved while accessing a matrix from shared memory:", "details": "There are two strides involved while accessing a matrix from shared memory:\nLeading dimension stride (byte offset or absolute address)\nStride dimension byte offset", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-majorness-supported-by-strides", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Stride 支持的 major-ness」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Stride 支持的 major-ness」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Leading Dimension Stride: relative offset or absolute address", "titleZh": "leading dimension stride：相对 offset 或绝对地址", "numberedTitle": "9.7.17.3.1. Leading Dimension Stride: relative offset or absolute address", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Major-ness supported by Strides", "parentZh": "Stride 支持的 major-ness", "kind": "Instructions", "kindZh": "指令", "summary": "There are two modes of Leading Dimension Strides as described below. Bit #52 in the Shared memory descriptor is used to distinguish between two modes.", "details": "There are two modes of Leading Dimension Strides as described below.\nBit #52 in the Shared memory descriptor is used to distinguish between two modes.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-leading-dimension-byte-offset", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「leading dimension stride：相对 offset 或绝对地址」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「leading dimension stride：相对 offset 或绝对地址」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Relative offset mode", "titleZh": "相对 offset mode", "numberedTitle": "9.7.17.3.1.1. Relative offset mode", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Leading Dimension Stride: relative offset or absolute address", "parentZh": "leading dimension stride：相对 offset 或绝对地址", "kind": "Instructions", "kindZh": "指令", "summary": "In this mode, the leading dimension stride is specified as a relative byte offset between the columns as explained in the below table. The leading dimension stride can either be specified as a relative offset between the columns or as an absolute byte address of next...", "details": "In this mode, the leading dimension stride is specified as a relative byte offset between the columns as explained in the below table.\nThe leading dimension stride can either be specified as a relative offset between the columns or as an absolute byte address of next buffer.\nMajor-ness | Definition\nK-Major | No-Swizzling: the stride from the first column to the second column of the 8x2 tile in the 128-bit element type normalized matrix. Swizzled layouts: not used, assumed to be 1.\nMN-Major | Interleave: stride from the first 8 columns to the next 8 columns. Swizzled layouts: stride from the first (swizzle-byte-size/16) rows to the next (swizzle-byte-size/16) rows.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-leading-dimension-byte-offset-relative-offset", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「相对 offset mode」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「相对 offset mode」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Absolute address mode for K dimension being 48B", "titleZh": "绝对地址 mode for K dimension being 48B", "numberedTitle": "9.7.17.3.1.2. Absolute address mode for K dimension being 48B", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Leading Dimension Stride: relative offset or absolute address", "parentZh": "leading dimension stride：相对 offset 或绝对地址", "kind": "Instructions", "kindZh": "指令", "summary": "The tcgen05.mma instruction with K-dimension of 48B would overflow the 128B shared memory boundary if the data is packed contiguously.", "details": "The tcgen05.mma instruction with K-dimension of 48B would overflow the 128B shared memory boundary if the data is packed contiguously.\nIn this case, the absolute address mode can be used to break up the data in the shared memory into two chunks such that both these chunks are laid out within the aligned 128-byte address boundary.\nThe leading dimension absolute address can point to the second data chunk in the shared memory.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-leading-dimension-byte-offset-absolute-address", "tokens": ["tcgen05.mma"], "summaryZh": "本条整理 PTX ISA 官方文档中的「绝对地址 mode for K dimension being 48B」，归在「指令」。重点关注 关键词 tcgen05.mma，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「绝对地址 mode for K dimension being 48B」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.mma。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Stride Dimension Byte Offset", "titleZh": "Stride 维度 byte offset", "numberedTitle": "9.7.17.3.2. Stride Dimension Byte Offset", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Major-ness supported by Strides", "parentZh": "Stride 支持的 major-ness", "kind": "Instructions", "kindZh": "指令", "summary": "The stride dimension byte offset is defined differently for transposed and non-transposed matrices. The stride dimension byte offset is defined as follows for matrices whose element types are normalized to 128-bits:", "details": "The stride dimension byte offset is defined differently for transposed and non-transposed matrices.\nThe stride dimension byte offset is defined as follows for matrices whose element types are normalized to 128-bits:\nMajor-ness | Definition\nK-Major | The offset from the first 8 rows to the next 8 rows.\nMN-Major | Interleave: offset from the first row to the next row. Swizzled layout: offset from the first 8 columns to the next 8 columns", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-stride-dimension-byte-offset", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Stride 维度 byte offset」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Stride 维度 byte offset」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Canonical Layouts", "titleZh": "规范布局", "numberedTitle": "9.7.17.3.3. Canonical Layouts", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Major-ness supported by Strides", "parentZh": "Stride 支持的 major-ness", "kind": "Instructions", "kindZh": "指令", "summary": "In terms of CuTe layouts the canonical layout can be expressed as follows:", "details": "In terms of CuTe layouts the canonical layout can be expressed as follows:\nMajor- ness | Swizzling mode | Canonical Layout without swizzling | Swizzling on the previous column\nMN- major | No-swizzling or Interleaved | ((T,1,m),(8,k)):((1,T,SBO),(1T,LBO)) | Swizzle<0, 4, 3>\n32B Swizzling | ((T,2,m),(8,k)):((1,T,LBO),(2T,SBO)) | Swizzle<1, 4, 3>\n64B Swizzling | ((T,4,m),(8,k)):((1,T,LBO),(4T,SBO)) | Swizzle<2, 4, 3>\n128B Swizzling | ((T,8,m),(8,k)):((1,T,LBO),(8T,SBO)) | Swizzle<3, 4, 3>\nK- major | No-swizzling or Interleaved | ((8,m),(T,2k)):((1T,SBO),(1,LBO)) | Swizzle<0, 4, 3>\n32B Swizzling | ((8,m),(T,2k)):((2T,SBO),(1,T)) | Swizzle<1, 4, 3>", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-canonical-layouts", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「规范布局」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「规范布局」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Matrix Descriptors", "titleZh": "矩阵 descriptor", "numberedTitle": "9.7.17.4. Matrix Descriptors", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Family Instructions", "parentZh": "第五代 TensorCore 指令族", "kind": "Instructions", "kindZh": "指令", "summary": "There are three kinds of matrix descriptors used by the tcgen05 family of instructions.", "details": "There are three kinds of matrix descriptors used by the tcgen05 family of instructions.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-matrix-descriptors", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「矩阵 descriptor」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「矩阵 descriptor」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Shared memory descriptor", "titleZh": "共享内存 descriptor", "numberedTitle": "9.7.17.4.1. Shared memory descriptor", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Matrix Descriptors", "parentZh": "矩阵 descriptor", "kind": "Instructions", "kindZh": "指令", "summary": "The shared memory descriptor describes the properties of multiplicand matrix in shared memory including its location in the shared memory of the current CTA . It is a 64-bit value contained in a register with the following layout:", "details": "The shared memory descriptor describes the properties of multiplicand matrix in shared memory including its location in the shared memory of the current CTA .\nIt is a 64-bit value contained in a register with the following layout:\nBit-field | Size in bits | Description\n0-13 | 14 | matrix-descriptor-encode (Matrix start address)\n14-15 | 2 | Reserved - Must be 0\n16-29 | 14 | matrix-descriptor-encode ( Leading dimension byte offset relative ) OR matrix-descriptor-encode ( Leading dimension byte address absolute )\n30-31 | 2 | Reserved - Must be 0\n32-45 | 14 | matrix-descriptor-encode ( Stride dimension byte offset )", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-shared-memory-descriptor", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「共享内存 descriptor」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「共享内存 descriptor」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Target ISA Note", "titleZh": "目标 ISA 说明", "numberedTitle": "9.7.17.4.1.1. Target ISA Note", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Shared memory descriptor", "parentZh": "共享内存 descriptor", "kind": "Instructions", "kindZh": "指令", "summary": "PTX ISA 文档章节：Target ISA Note", "details": "The byte address mode for the leading dimension stride is supported on sm_103a .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-shared-memory-descriptor-target-isa-note", "tokens": ["sm_103a"], "summaryZh": "本条整理 PTX ISA 官方文档中的「目标 ISA 说明」，归在「指令」。重点关注 关键词 sm_103a，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「目标 ISA 说明」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：sm_103a。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Instruction descriptor", "titleZh": "指令 descriptor", "numberedTitle": "9.7.17.4.2. Instruction descriptor", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Matrix Descriptors", "parentZh": "矩阵 descriptor", "kind": "Instructions", "kindZh": "指令", "summary": "The instruction descriptor describes the shapes, types and other details of all the matrices and the matrix-multiplication-and-accumulation operation. It is a 32-bit value in registers and the exact layout is dependent on the MMA-Kind:", "details": "The instruction descriptor describes the shapes, types and other details of all the matrices and the matrix-multiplication-and-accumulation operation.\nIt is a 32-bit value in registers and the exact layout is dependent on the MMA-Kind:\nBits | Size (bits) | Description | Values\n.kind::tf32 | .kind::f16 | .kind::f8f6f4 | .kind::i8\n0-1 | 2 | Sparsity selector , if Sparsity is enabled | 0-3\n2 | 1 | Sparsity | Dense = 0 Sparse = 1\n3 | 1 | Saturate for integer types | 0 (NA) | No Saturate = 0 Saturate = 1\n4-5 | 2 | dtype (Matrix D type) | F32 = 1 | F16 = 0 F32 = 1 | S32 = 2", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-instruction-descriptor", "tokens": ["kind"], "summaryZh": "本条整理 PTX ISA 官方文档中的「指令 descriptor」，归在「指令」。重点关注 关键词 kind，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「指令 descriptor」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：kind。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Zero-Column Mask Descriptor", "titleZh": "Zero-column mask descriptor（零列掩码 descriptor）", "numberedTitle": "9.7.17.4.3. Zero-Column Mask Descriptor", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Matrix Descriptors", "parentZh": "矩阵 descriptor", "kind": "Instructions", "kindZh": "指令", "summary": "The zero-column mask descriptor is used to generate a mask that specifies which columns of B matrix will have zero value for the MMA operation regardless of the values present in the shared memory. The total size of the generated mask is N-bits.", "details": "The zero-column mask descriptor is used to generate a mask that specifies which columns of B matrix will have zero value for the MMA operation regardless of the values present in the shared memory.\nThe total size of the generated mask is N-bits.\nA 0-bit in the mask specifies that values of the corresponding column in matrix B should be used for the MMA operation.\nA 1-bit in the mask specifies 0s must be used for the entire column for the MMA operation.\nThe zero-column mask descriptor is a 64-bit value in registers with the following layout:\nBits | Size (bits) | Field Name | Description\n0-7 | 8 | Start Count 0 (sc0) | Specifies the LSBs that must be skipped for sub-mask mask-i\n8-15 | 8 | Start Count 1 (sc1)", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-zero-column-mask-descriptor", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Zero-column mask descriptor（零列掩码 descriptor）」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Zero-column mask descriptor（零列掩码 descriptor）」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Issue Granularity", "titleZh": "发射粒度", "numberedTitle": "9.7.17.5. Issue Granularity", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Family Instructions", "parentZh": "第五代 TensorCore 指令族", "kind": "Instructions", "kindZh": "指令", "summary": "Each of the tcgen05 operation has different requirements for the number of threads/warps that needs to issue them.", "details": "Each of the tcgen05 operation has different requirements for the number of threads/warps that needs to issue them.\nThe following table lists the execution granularity requirements of each of the tcgen05 operation:\ntcgen05 operation | .cta_group | Issue Granularity\n. mma , . cp , . shift , . commit | ::1 | An issue from a single thread in the current CTA would initiate the base operation.\n::2 | Issue from a single thread from the CTA-Pair would initiate the base operation. When the current CTA issues the operation, the peer CTA should be active and should not have exited.\n. alloc , . dealloc , . relinquish_alloc_permit | ::1 | Issue from a single warp in the current CTA would initiate the allocation management instruction.\n::2 | Issue from two warps, one in each of the current CTA and its Peer CTA , in order to collectively perform the operation, i.e., the first warp to perform the operation could block until the the second warp in the Peer CTA also performs the operation (see examples below).\n. ld , . st , . wait :: { ld , st } | N/A | Issue from a warp in the current CTA can access only 1/4 of the Tensor Memory of the current CTA. So, a warpgroup is needed to access the entire Tensor Memory of the current CTA.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-issue-granularity", "tokens": ["warps", "cta_group", "warp", "warpgroup"], "summaryZh": "本条整理 PTX ISA 官方文档中的「发射粒度」，归在「指令」。重点关注 关键词 warps、cta_group、warp、warpgroup，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「发射粒度」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：warps、cta_group、warp、warpgroup。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "CTA Pair", "titleZh": "CTA Pair", "numberedTitle": "9.7.17.5.1. CTA Pair", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Issue Granularity", "parentZh": "发射粒度", "kind": "Instructions", "kindZh": "指令", "summary": "Any 2 CTAs within the cluster whose %cluster_ctarank differs by the last bit only is said to form a CTA pair.", "details": "Any 2 CTAs within the cluster whose %cluster_ctarank differs by the last bit only is said to form a CTA pair.\nWithin a CTA pair, the CTA whose last bit in the %cluster_ctarank is:\n0 is termed the even numbered CTA within the CTA pair.\n1 is termed as the odd numbered CTA within the CTA pair.\nMost of the tcgen05 operations can either execute at a single CTA level granularity OR at a CTA pair level granularity.\nWhen a tcgen05 operation is performed at CTA pair granularity, the Tensor Memory of both the CTAs within the CTA pair are accessed.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-cta-pair", "tokens": ["%cluster_ctarank"], "summaryZh": "本条整理 PTX ISA 官方文档中的「CTA Pair」，归在「指令」。重点关注 关键词 %cluster_ctarank，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「CTA Pair」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：%cluster_ctarank。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Peer CTA", "titleZh": "Peer CTA", "numberedTitle": "9.7.17.5.2. Peer CTA", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Issue Granularity", "parentZh": "发射粒度", "kind": "Instructions", "kindZh": "指令", "summary": "The peer CTA of the odd CTA within the CTA pair is the even CTA in the same pair. Similarly, the peer CTA of the even CTA within the CTA pair is the odd CTA in the same pair.", "details": "The peer CTA of the odd CTA within the CTA pair is the even CTA in the same pair.\nSimilarly, the peer CTA of the even CTA within the CTA pair is the odd CTA in the same pair.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-peer-cta", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Peer CTA」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Peer CTA」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Memory Consistency Model for 5th generation of TensorCore operations", "titleZh": "内存一致性 Model for 5th generation of TensorCore 操作", "numberedTitle": "9.7.17.6. Memory Consistency Model for 5th generation of TensorCore operations", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Family Instructions", "parentZh": "第五代 TensorCore 指令族", "kind": "Instructions", "kindZh": "指令", "summary": "Ordering of tcgen05 instructions is described in terms of two key concepts:", "details": "Ordering of tcgen05 instructions is described in terms of two key concepts:\nPipelined tcgen05 instructions\nSpecialized tcgen05-specific inter-thread synchronization mechanisms.\nThese concepts combine to form four canonical synchronization patterns, as described further below.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-memory-consistency-model", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「内存一致性 Model for 5th generation of TensorCore 操作」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「内存一致性 Model for 5th generation of TensorCore 操作」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Asynchronous Operations", "titleZh": "异步操作", "numberedTitle": "9.7.17.6.1. Asynchronous Operations", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Memory Consistency Model for 5th generation of TensorCore operations", "parentZh": "内存一致性 Model for 5th generation of TensorCore 操作", "kind": "Instructions", "kindZh": "指令", "summary": "The tcgen05 family of instructions are divided into 2 categories:", "details": "The tcgen05 family of instructions are divided into 2 categories:\nAsynchronous instructions: These tcgen05 operations are not inherently ordered with respect to other tcgen05 operations in the same thread (unless pipelined as mentioned below).\nSynchronous instructions: These tcgen05 operations are inherently ordered with respect to other tcgen05 operations in the same order. The Tensor Memory allocation related instructions that access shared memory maintain same-address ordering with respect to non- tcgen05 instructions.\nThe following table lists the category of each of the tcgen05 instruction:\ntcgen05.* operation | Category\n.alloc | Synchronous instructions\n.dealloc\n.relinquish_alloc_permit", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-memory-consistency-model-async-operations", "tokens": ["alloc", "dealloc", "relinquish_alloc_permit"], "summaryZh": "本条整理 PTX ISA 官方文档中的「异步操作」，归在「指令」。重点关注 关键词 alloc、dealloc、relinquish_alloc_permit，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「异步操作」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：alloc、dealloc、relinquish_alloc_permit。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Pipelined tcgen05 Instructions", "titleZh": "Pipeline 化 tcgen05 指令", "numberedTitle": "9.7.17.6.2. Pipelined tcgen05 Instructions", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Memory Consistency Model for 5th generation of TensorCore operations", "parentZh": "内存一致性 Model for 5th generation of TensorCore 操作", "kind": "Instructions", "kindZh": "指令", "summary": "The asynchronous tcgen05 operations may execute and complete in a different order than they were issued. However, some specific pairs of the asynchronous tcgen05 instructions form tcgen05 pipelines, where in the two asynchronous operations are guaranteed to execute in...", "details": "The asynchronous tcgen05 operations may execute and complete in a different order than they were issued.\nHowever, some specific pairs of the asynchronous tcgen05 instructions form tcgen05 pipelines, where in the two asynchronous operations are guaranteed to execute in the same order as the instructions that issued them.\ntcgen05.mma.cta_group::N -> tcgen05.mma.cta_group::N (same N and accumulator, shape and kind)\ntcgen05.cp.cta_group::N -> tcgen05.mma.cta_group::N (same N)\ntcgen05.shift.cta_group::N -> tcgen05.mma.cta_group::N (same N)\ntcgen05.shift.cta_group::N -> tcgen05.cp.4x256b.cta_group::N (same N)\ntcgen05.mma.cta_group::N -> tcgen05.shift.cta_group::N (same N)", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-memory-consistency-model-pipelined-instructions", "tokens": ["tcgen05.mma.cta", "tcgen05.cp.cta", "tcgen05.shift.cta", "tcgen05.cp.4x256b.cta"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Pipeline 化 tcgen05 指令」，归在「指令」。重点关注 关键词 tcgen05.mma.cta、tcgen05.cp.cta、tcgen05.shift.cta、tcgen05.cp.4x256b.cta，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Pipeline 化 tcgen05 指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.mma.cta、tcgen05.cp.cta、tcgen05.shift.cta、tcgen05.cp.4x256b.cta。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Implicitly pipelined tcgen05 Instructions", "titleZh": "Implicitly Pipeline 化 tcgen05 指令", "numberedTitle": "9.7.17.6.2.1. Implicitly pipelined tcgen05 Instructions", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Pipelined tcgen05 Instructions", "parentZh": "Pipeline 化 tcgen05 指令", "kind": "Instructions", "kindZh": "指令", "summary": "Instructions tcgen05.commit and tcgen05.wait are implicitly pipelined with respect to previously issued tcgen05.{mma,cp,shift} and tcgen05.{ld,st} instructions respectively that they track from the same thread.", "details": "Instructions tcgen05.commit and tcgen05.wait are implicitly pipelined with respect to previously issued tcgen05.{mma,cp,shift} and tcgen05.{ld,st} instructions respectively that they track from the same thread.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-memory-consistency-model-pipelined-instructions-implicit", "tokens": ["tcgen05.commit", "tcgen05.wait"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Implicitly Pipeline 化 tcgen05 指令」，归在「指令」。重点关注 关键词 tcgen05.commit、tcgen05.wait，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Implicitly Pipeline 化 tcgen05 指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.commit、tcgen05.wait。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Specialized Inter-thread Synchronization for tcgen05 instructions", "titleZh": "专用线程间同步 for tcgen05 指令", "numberedTitle": "9.7.17.6.3. Specialized Inter-thread Synchronization for tcgen05 instructions", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Memory Consistency Model for 5th generation of TensorCore operations", "parentZh": "内存一致性 Model for 5th generation of TensorCore 操作", "kind": "Instructions", "kindZh": "指令", "summary": "The tcgen05 instructions support a specialized inter-thread synchronization which are optimized for tcgen05 family of instructions. The standard memory consistency model synchronization mechanisms also apply to the tcgen05 family of instructions.", "details": "The tcgen05 instructions support a specialized inter-thread synchronization which are optimized for tcgen05 family of instructions.\nThe standard memory consistency model synchronization mechanisms also apply to the tcgen05 family of instructions.\nThe TensorCore 5th Generation Specialized Synchronization Operations section contains the specialized inter-thread synchronization for tcgen05 instructions.\nThe tcgen05.fence::before_thread_sync and tcgen05.fence::after_thread_sync composes with execution ordering instructions, like morally strong ld / st / atom instructions, mbarrier instruction, barrier instructions and so on, to establish an ordering between the tcgen05 operations across threads.\nThe asynchronous tcgen05 instructions that are ordered across threads also form a tcgen05 pipeline.\nAn asynchronous tcgen05 operation prior to a tcgen05.fence::before_thread_sync is ordered before all subsequent tcgen05 and the execution ordering operations.\nAn asynchronous tcgen05 operation subsequent to a tcgen05.fence::after_thread_sync is ordered after all the prior tcgen05 and the execution ordering operations.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-memory-consistency-model-inter-thread-sync", "tokens": ["tcgen05.fence"], "summaryZh": "本条整理 PTX ISA 官方文档中的「专用线程间同步 for tcgen05 指令」，归在「指令」。重点关注 关键词 tcgen05.fence，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「专用线程间同步 for tcgen05 指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.fence。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Canonical synchronization patterns", "titleZh": "规范同步模式", "numberedTitle": "9.7.17.6.4. Canonical synchronization patterns", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Memory Consistency Model for 5th generation of TensorCore operations", "parentZh": "内存一致性 Model for 5th generation of TensorCore 操作", "kind": "Instructions", "kindZh": "指令", "summary": "Using the above rules, the following are the five canonical synchronization patterns:", "details": "Using the above rules, the following are the five canonical synchronization patterns:", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-memory-consistency-model-canonical-sync-patterns", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「规范同步模式」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「规范同步模式」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Pipelined instructions, same thread", "titleZh": "Pipeline 化指令, 同一线程", "numberedTitle": "9.7.17.6.4.1. Pipelined instructions, same thread", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Canonical synchronization patterns", "parentZh": "规范同步模式", "kind": "Instructions", "kindZh": "指令", "summary": "In this pattern, no explicit ordering mechanism is needed and the ordering guarantee is provided by the pipelined instruction pairing.", "details": "In this pattern, no explicit ordering mechanism is needed and the ordering guarantee is provided by the pipelined instruction pairing.\nExample:\nThe two instructions will be executed in program order.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-memory-consistency-model-canonical-sync-patterns-pipelined-same-thread", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Pipeline 化指令, 同一线程」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Pipeline 化指令, 同一线程」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Non-pipelined instructions, same thread", "titleZh": "非 Pipeline 化指令, 同一线程", "numberedTitle": "9.7.17.6.4.2. Non-pipelined instructions, same thread", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Canonical synchronization patterns", "parentZh": "规范同步模式", "kind": "Instructions", "kindZh": "指令", "summary": "In this pattern, explicit waiting mechanisms are used to wait for the completion of the asynchronous tcgen05 operations.", "details": "In this pattern, explicit waiting mechanisms are used to wait for the completion of the asynchronous tcgen05 operations.\nExample 1:\ntcgen05.wait::st is used to wait for the completion of the prior asynchronous instruction tcgen05.st .\nExample 2:\nFor the completion of the asynchronous tcgen05.mma , tcgen05.commit is used.\nAs tcgen05.ld is an asynchronous operation, the instruction tcgen05.fence::after_thread_sync is needed.\nNo explicit tcgen05.fence::before_thread_sync is needed as this is implicitly performed by tcgen05.commit .\nThe combination of tcgen05.mma and tcgen05.commit forms a conceptual asynchronous pipeline and establishes execution ordering.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-memory-consistency-model-canonical-sync-patterns-non-pipelined-same-thread", "tokens": ["tcgen05.wait", "tcgen05.st", "tcgen05.mma", "tcgen05.commit", "tcgen05.ld", "tcgen05.fence"], "summaryZh": "本条整理 PTX ISA 官方文档中的「非 Pipeline 化指令, 同一线程」，归在「指令」。重点关注 关键词 tcgen05.wait、tcgen05.st、tcgen05.mma、tcgen05.commit、tcgen05.ld，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「非 Pipeline 化指令, 同一线程」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.wait、tcgen05.st、tcgen05.mma、tcgen05.commit、tcgen05.ld、tcgen05.fence。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Pipelined instructions, different thread", "titleZh": "Pipeline 化指令, 不同线程", "numberedTitle": "9.7.17.6.4.3. Pipelined instructions, different thread", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Canonical synchronization patterns", "parentZh": "规范同步模式", "kind": "Instructions", "kindZh": "指令", "summary": "In this pattern, no explicit waiting mechanism is needed but proper synchronization between threads is needed.", "details": "In this pattern, no explicit waiting mechanism is needed but proper synchronization between threads is needed.\nExample:\nThread 0 | Thread 1\ntcgen05 . cp tcgen05 . fence :: before_thread_sync mbarrier . arrive . relaxed . cluster\nmbarrier . try_wait . relaxed . cluster // loop till success tcgen05 . fence :: after_thread_sync tcgen05 . mma", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-memory-consistency-model-canonical-sync-patterns-pipelined-diff-thread", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Pipeline 化指令, 不同线程」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Pipeline 化指令, 不同线程」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Non-pipelined instructions, different thread", "titleZh": "非 Pipeline 化指令, 不同线程", "numberedTitle": "9.7.17.6.4.4. Non-pipelined instructions, different thread", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Canonical synchronization patterns", "parentZh": "规范同步模式", "kind": "Instructions", "kindZh": "指令", "summary": "In this pattern, the producer threads that issue the asynchronous tcgen05 instructions must explicitly wait for the instructions’ completion before synchronizing with the consumer threads.", "details": "In this pattern, the producer threads that issue the asynchronous tcgen05 instructions must explicitly wait for the instructions’ completion before synchronizing with the consumer threads.\nExample 1:\nThread 0 | Thread 1\ntcgen05 . ld tcgen05 . wait :: ld tcgen05 . fence :: before_thread_sync mbarrier . arrive . relaxed . cluster\nmbarrier . try_wait . relaxed . cluster // loop till success tcgen05 . fence :: after_thread_sync tcgen05 . mma\nExample 1:\nThread 0 | Thread 1\ntcgen05 . mma tcgen05 . commit . mbarrier :: arrive :: one [ mbar ]", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-memory-consistency-model-canonical-sync-patterns-non-pipelined-diff-thread", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「非 Pipeline 化指令, 不同线程」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「非 Pipeline 化指令, 不同线程」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Register dependencies, same thread", "titleZh": "Register 依赖关系, 同一线程", "numberedTitle": "9.7.17.6.4.5. Register dependencies, same thread", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Canonical synchronization patterns", "parentZh": "规范同步模式", "kind": "Instructions", "kindZh": "指令", "summary": "For tcgen05.ld , an intra-thread ordering through true register dependency will be respected regardless of the presence or absence of other forms of synchronization. This form of register dependency does not imply any other form of ordering. For example, a register...", "details": "For tcgen05.ld , an intra-thread ordering through true register dependency will be respected regardless of the presence or absence of other forms of synchronization.\nThis form of register dependency does not imply any other form of ordering.\nExample:", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-memory-consistency-model-canonical-sync-patterns-reg-dependency-same-thread", "tokens": ["tcgen05.ld"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Register 依赖关系, 同一线程」，归在「指令」。重点关注 关键词 tcgen05.ld，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Register 依赖关系, 同一线程」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.ld。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Shared Memory Accesses", "titleZh": "共享内存 Accesses", "numberedTitle": "9.7.17.6.5. Shared Memory Accesses", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Memory Consistency Model for 5th generation of TensorCore operations", "parentZh": "内存一致性 Model for 5th generation of TensorCore 操作", "kind": "Instructions", "kindZh": "指令", "summary": "The shared memory accesses by tcgen05.mma and tcgen05.cp operations are performed in the asynchronous proxy (async proxy).", "details": "The shared memory accesses by tcgen05.mma and tcgen05.cp operations are performed in the asynchronous proxy (async proxy).\nAccessing the same memory location across miltiple proxies needs a cross-proxy fence.\nFor the async proxy, fence.proxy.async should be used to synchronize memory between generic proxy and the async proxy.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-memory-consistency-model-smem-access", "tokens": ["tcgen05.mma", "tcgen05.cp", "fence.proxy.async"], "summaryZh": "本条整理 PTX ISA 官方文档中的「共享内存 Accesses」，归在「指令」。重点关注 关键词 tcgen05.mma、tcgen05.cp、fence.proxy.async，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「共享内存 Accesses」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.mma、tcgen05.cp、fence.proxy.async。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Tensor Memory Allocation and Management Instructions", "titleZh": "Tensor Memory 分配与管理指令", "numberedTitle": "9.7.17.7. Tensor Memory Allocation and Management Instructions", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Family Instructions", "parentZh": "第五代 TensorCore 指令族", "kind": "Instructions", "kindZh": "指令", "summary": "PTX ISA 文档章节：Tensor Memory Allocation and Management Instructions", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-memory-alloc-manage-instructions", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Tensor Memory 分配与管理指令」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Tensor Memory 分配与管理指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。"}, {"title": "Tensorcore 5th Generation Instructions: tcgen05.alloc , tcgen05.dealloc , tcgen05.relinquish_alloc_permit", "titleZh": "第五代 TensorCore 指令：tcgen05.alloc , tcgen05.dealloc , tcgen05.relinquish_alloc_permit", "numberedTitle": "9.7.17.7.1. Tensorcore 5th Generation Instructions: tcgen05.alloc , tcgen05.dealloc , tcgen05.relinquish_alloc_permit", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Tensor Memory Allocation and Management Instructions", "parentZh": "Tensor Memory 分配与管理指令", "kind": "Instructions", "kindZh": "指令", "summary": "tcgen05.alloc , tcgen05.dealloc , tcgen05.relinquish_alloc_permit", "details": "tcgen05.alloc , tcgen05.dealloc , tcgen05.relinquish_alloc_permit\nDynamic Tensor Memory allocation management instructions\nSyntax\nDescription\ntcgen05.alloc is a blocking instruction which dynamically allocates the specified number of columns in the Tensor Memory and writes the address of the allocated Tensor Memory into shared memory at the location specified by address operand dst .\nThe tcgen05.alloc blocks if the requested amount of Tensor Memory is not available and unblocks as soon as the requested amount of Tensor Memory becomes available for allocation.\ntcgen05.dealloc is a potentially blocking instruction which deallocates the Tensor Memory specified by the Tensor Memory address taddr .\nThe operand taddr must point to a previous Tensor Memory allocation.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-instructions-tcgen05-alloc-dealloc-relinquish-alloc-permit", "tokens": ["tcgen05.alloc", "tcgen05.dealloc", "tcgen05.relinquish"], "summaryZh": "本条整理 PTX ISA 官方文档中的「第五代 TensorCore 指令：tcgen05.alloc , tcgen05.dealloc , tcgen05.relinquish_alloc_permit」，归在「指令」。重点关注 关键词 tcgen05.alloc、tcgen05.dealloc、tcgen05.relinquish，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「第五代 TensorCore 指令：tcgen05.alloc , tcgen05.dealloc , tcgen05.relinquish_alloc_permit」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.alloc、tcgen05.dealloc、tcgen05.relinquish。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Tensor Memory and Register Load/Store Instructions", "titleZh": "Tensor Memory 与寄存器 load/store 指令", "numberedTitle": "9.7.17.8. Tensor Memory and Register Load/Store Instructions", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Family Instructions", "parentZh": "第五代 TensorCore 指令族", "kind": "Instructions", "kindZh": "指令", "summary": "The threads of the CTA can perform the loads and stores to the Tensor Memory of the CTA and move data between registers and Tensor Memory. The loads and stores of data can be performed in certain shapes as specified in the Matrix and Data Movement Shape section.", "details": "The threads of the CTA can perform the loads and stores to the Tensor Memory of the CTA and move data between registers and Tensor Memory.\nThe loads and stores of data can be performed in certain shapes as specified in the Matrix and Data Movement Shape section.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-tensor-memory-ld-st", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Tensor Memory 与寄存器 load/store 指令」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Tensor Memory 与寄存器 load/store 指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Access restrictions", "titleZh": "访问 restrictions", "numberedTitle": "9.7.17.8.1. Access restrictions", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Tensor Memory and Register Load/Store Instructions", "parentZh": "Tensor Memory 与寄存器 load/store 指令", "kind": "Instructions", "kindZh": "指令", "summary": "Not all threads of the CTA can access the entire Tensor Memory via the tcgen05.ld and tcgen05.st operations.", "details": "Not all threads of the CTA can access the entire Tensor Memory via the tcgen05.ld and tcgen05.st operations.\nThe Tensor Memory of a CTA is divided into 4 equal chunks such that each warp of a warpgroup in the CTA can access a chunk of the Tensor Memory.\nAll the columns of the Tensor Memory can be accessed by all the four warps of a warpgroup.\nID of the warp within the warpgroup | Accessible Lanes\n0 | 0-31\n1 | 32-63\n2 | 64-95\n3 | 96-127", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-tensor-memory-ld-st-access-restrictions", "tokens": ["tcgen05.ld", "tcgen05.st", "warp", "warpgroup", "warps"], "summaryZh": "本条整理 PTX ISA 官方文档中的「访问 restrictions」，归在「指令」。重点关注 关键词 tcgen05.ld、tcgen05.st、warp、warpgroup、warps，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「访问 restrictions」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.ld、tcgen05.st、warp、warpgroup、warps。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Packing and Unpacking", "titleZh": "打包与解包", "numberedTitle": "9.7.17.8.2. Packing and Unpacking", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Tensor Memory and Register Load/Store Instructions", "parentZh": "Tensor Memory 与寄存器 load/store 指令", "kind": "Instructions", "kindZh": "指令", "summary": "Optionally, the following pack and unpack operations can be performed during the load and store:", "details": "Optionally, the following pack and unpack operations can be performed during the load and store:\nPacking: two 16-bit chunks can be packed into a single 32-bit chunk in the register in tcgen05.ld\nUnpacking: a single 32-bit chunk in the register can be unpacked into two 16-bit chunks in tcgen05.st\nas shown in the Figure 193 .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-tensor-memory-ld-st-packing-unpacking", "tokens": ["tcgen05.ld", "tcgen05.st"], "summaryZh": "本条整理 PTX ISA 官方文档中的「打包与解包」，归在「指令」。重点关注 关键词 tcgen05.ld、tcgen05.st，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「打包与解包」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.ld、tcgen05.st。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Tensorcore 5th Generation Instructions: tcgen05.ld", "titleZh": "第五代 TensorCore 指令：tcgen05.ld", "numberedTitle": "9.7.17.8.3. Tensorcore 5th Generation Instructions: tcgen05.ld", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Tensor Memory and Register Load/Store Instructions", "parentZh": "Tensor Memory 与寄存器 load/store 指令", "kind": "Instructions", "kindZh": "指令", "summary": "tcgen05.ld", "details": "tcgen05.ld\nAsynchronous collective load from tensor memory into registers.\nSyntax\nDescription\nInstruction tcgen05.ld asynchronously loads data from the Tensor Memory at the location specified by the 32-bit address operand taddr into the destination register r , collectively across all threads of the warps.\nAll the threads in the warp must specify the same value of taddr , which must be the base address of the collective load operation.\nOtherwise, the behavior is undefined.\nThe .shape qualifier and the .num qualifier together determines the total dimension of the data which is loaded from the Tensor Memory .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-instructions-tcgen05-ld", "tokens": ["tcgen05.ld", "warps", "warp", "shape", "num"], "summaryZh": "本条整理 PTX ISA 官方文档中的「第五代 TensorCore 指令：tcgen05.ld」，归在「指令」。重点关注 关键词 tcgen05.ld、warps、warp、shape、num，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「第五代 TensorCore 指令：tcgen05.ld」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.ld、warps、warp、shape、num。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Tensorcore 5th Generation Instructions: tcgen05.st", "titleZh": "第五代 TensorCore 指令：tcgen05.st", "numberedTitle": "9.7.17.8.4. Tensorcore 5th Generation Instructions: tcgen05.st", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Tensor Memory and Register Load/Store Instructions", "parentZh": "Tensor Memory 与寄存器 load/store 指令", "kind": "Instructions", "kindZh": "指令", "summary": "tcgen05.st", "details": "tcgen05.st\nAsynchronous collective store to tensor memory from registers.\nSyntax\nDescription\nInstruction tcgen05.st asynchronously stores data from the source register r into the Tensor Memory at the location specified by the 32-bit address operand taddr , collectively across all threads of the warps.\nAll the threads in the warp must specify the same value of taddr , which must be the base address of the collective store operation.\nOtherwise, the behavior is undefined.\nThe .shape qualifier and the .num qualifier together determines the total dimension of the data which is stored to the Tensor Memory.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-instructions-tcgen05-st", "tokens": ["tcgen05.st", "warps", "warp", "shape", "num"], "summaryZh": "本条整理 PTX ISA 官方文档中的「第五代 TensorCore 指令：tcgen05.st」，归在「指令」。重点关注 关键词 tcgen05.st、warps、warp、shape、num，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「第五代 TensorCore 指令：tcgen05.st」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.st、warps、warp、shape、num。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Tensorcore 5th Generation Instructions: tcgen05.wait", "titleZh": "第五代 TensorCore 指令：tcgen05.wait", "numberedTitle": "9.7.17.8.5. Tensorcore 5th Generation Instructions: tcgen05.wait", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Tensor Memory and Register Load/Store Instructions", "parentZh": "Tensor Memory 与寄存器 load/store 指令", "kind": "Instructions", "kindZh": "指令", "summary": "tcgen05.wait", "details": "tcgen05.wait\nWaits for the completion of all prior asynchronous tcgen05.ld / tcgen05.st instructions.\nSyntax\nDescription\nInstruction tcgen05.wait::st causes the executing thread to block until all prior tcgen05.st operations issued by the executing thread have completed.\nInstruction tcgen05.wait::ld causes the executing thread to block until all prior tcgen05.ld operations issued by the executing thread have completed.\nThe mandatory .sync qualifier indicates that tcgen05.wait_operation causes the executing thread to wait until all threads in the warp execute the same tcgen05.wait_operation instruction before resuming execution.\nThe mandatory .aligned qualifier indicates that all threads in the warp must execute the same tcgen05.wait_operation instruction.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-instructions-tcgen05-wait", "tokens": ["tcgen05.wait", "tcgen05.ld", "tcgen05.st", "sync", "warp", "aligned"], "summaryZh": "本条整理 PTX ISA 官方文档中的「第五代 TensorCore 指令：tcgen05.wait」，归在「指令」。重点关注 关键词 tcgen05.wait、tcgen05.ld、tcgen05.st、sync、warp，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「第五代 TensorCore 指令：tcgen05.wait」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.wait、tcgen05.ld、tcgen05.st、sync、warp、aligned。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Tensor Memory Data Movement Instructions", "titleZh": "Tensor Memory 数据搬移指令", "numberedTitle": "9.7.17.9. Tensor Memory Data Movement Instructions", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Family Instructions", "parentZh": "第五代 TensorCore 指令族", "kind": "Instructions", "kindZh": "指令", "summary": "Data from the shared memory can be copied asynchronously to the Tensor Memory using the Tensorcore 5th Generation Instructions: tcgen05.cp operation.", "details": "Data from the shared memory can be copied asynchronously to the Tensor Memory using the Tensorcore 5th Generation Instructions: tcgen05.cp operation.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-data-movement-instructions", "tokens": ["tcgen05.cp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Tensor Memory 数据搬移指令」，归在「指令」。重点关注 关键词 tcgen05.cp，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Tensor Memory 数据搬移指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.cp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Optional Decompression", "titleZh": "可选解压", "numberedTitle": "9.7.17.9.1. Optional Decompression", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Tensor Memory Data Movement Instructions", "parentZh": "Tensor Memory 数据搬移指令", "kind": "Instructions", "kindZh": "指令", "summary": "Optionally, during the copy, a vector of 4-bit and 6-bit custom floating point types can be decompressed into 8-bit types.", "details": "Optionally, during the copy, a vector of 4-bit and 6-bit custom floating point types can be decompressed into 8-bit types.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-optional-decompression", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「可选解压」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detail ore 5th Generation Instructions: tcgen05.shift", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Tensor Memory Data Movement Instructions", "parentZh": "Tensor Memory 数据搬移指令", "kind": "Instructions", "kindZh": "指令", "summary": "tcgen05.shift", "details": "tcgen05.shift\nAsynchronously shift down the rows of the matrix in the Tensor Memory for a warp.\nSyntax\nDescription\nInstruction tcgen05.shift is an asynchronous instruction which initiates the shifting of 32-byte elements downwards across all the rows, except the last, by one row.\nThe address operand taddr specifies the base address of the matrix in the Tensor Memory whose rows must be down shifted.\nThe lane of the address operand taddr must be aligned to 32.\nQualifier .cta_group specifies the number of CTAs whose Tensor Memory is touched when a single thread of a single CTA executes the tcgen05.shift instruction.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-instructions-tcgen05-shift", "tokens": ["tcgen05.shift", "warp", "cta_group"], "summaryZh": "本条整理 PTX ISA 官方文档中的「第五代 TensorCore 指令：tcgen05.shift」，归在「指令」。重点关注 关键词 tcgen05.shift、warp、cta_group，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「第五代 TensorCore 指令：tcgen05.shift」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：tcgen05.shift、warp、cta_group。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "TensorCore 5th Generation Matrix Multiply and accumulate Operations", "titleZh": "第五代 TensorCore 矩阵乘加操作", "numberedTitle": "9.7.17.10. TensorCore 5th Generation Matrix Multiply and accumulate Operations", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Family Instructions", "parentZh": "第五代 TensorCore 指令族", "kind": "Instructions", "kindZh": "指令", "summary": "The 5 th generation of TensorCore operations of shape MxNxK perform matrix multiplication and accumulation of the form:", "details": "The 5 th generation of TensorCore operations of shape MxNxK perform matrix multiplication and accumulation of the form:\nD = A*B+D\nwhere:\nthe A matrix has shape MxK , in either Tensor Memory or Shared Memory\nthe B matrix has shape KxN , in Shared Memory of the current CTA and optionally in peer CTA\nthe D matrix is of the shape MxN , in Tensor Memory\nOptionally an input predicate can be used to disable the input from the accumulator matrix and the following operation can be performed as\nD = A*B", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-mma", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「第五代 TensorCore 矩阵乘加操作」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「第五代 TensorCore 矩阵乘加操作」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Transpose and Negate operations", "titleZh": "转置与 Negate 操作", "numberedTitle": "9.7.17.10.1. Transpose and Negate operations", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Matrix Multiply and accumulate Operations", "parentZh": "第五代 TensorCore 矩阵乘加操作", "kind": "Instructions", "kindZh": "指令", "summary": "The matrices A and B can be transposed by specifying the Tranpose A Matrix and Transpose B Matrix bits in the instruction descriptor respectively.", "details": "The matrices A and B can be transposed by specifying the Tranpose A Matrix and Transpose B Matrix bits in the instruction descriptor respectively.\nThe elements of the matrices A and B can be negated by specifying the Negate A Matrix and Negate B Matrix bits in the instruction descriptor respectively.\nThe support for Transpose and Negate operation for various MMA-Kind are shown in Table 54 .\nMMA-Kind | Is Transpose A/B supported | Is Negate A/B supported\n.kind::tf32 | Yes | Yes\n.kind::f16 | Yes | Yes\n.kind::f8f6f4 | Yes | Yes\n.kind::mxf8f6f4 | Yes | Yes", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-transpose-and-negate-operations", "tokens": ["kind"], "summaryZh": "本条整理 PTX ISA 官方文档中的「转置与 Negate 操作」，归在「指令」。重点关注 关键词 kind，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「转置与 Negate 操作」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：kind。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Matrix Layout Organization", "titleZh": "矩阵布局 Organization", "numberedTitle": "9.7.17.10.2. Matrix Layout Organization", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Matrix Multiply and accumulate Operations", "parentZh": "第五代 TensorCore 矩阵乘加操作", "kind": "Instructions", "kindZh": "指令", "summary": "Table 56 describes the major-ness used for different matrices.", "details": "Table 56 describes the major-ness used for different matrices.\nMatrix | Residing in Memory | Default Major-ness\nD | Tensor Memory | Row-Major\nA | Tensor Memory\nShared Memory | Depends on swizzling mode. Refer Shared Memory Layout and Swizzling\nB | Shared Memory", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tcgen05-matrix-layout-organization", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「矩阵布局 Organization」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「矩阵布局 Organization」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Valid Combinations of Type-Size, Major-ness and Swizzling", "titleZh": "合法组合 of 类型-Size, Major-ness 与 Swizzling", "numberedTitle": "9.7.17.10.3. Valid Combinations of Type-Size, Major-ness and Swizzling", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Matrix Multiply and accumulate Operations", "parentZh": "第五代 TensorCore 矩阵乘加操作", "kind": "Instructions", "kindZh": "指令", "summary": "PTX ISA 文档章节：Valid Combinations of Type-Size, Major-ness and Swizzling", "details": "Type-Size | Major-ness | Matrix | Supported Swizzle\n4-bit, 6-bit, 8-bit, 16-bit, 32-bit | Row | A | All swizzling modes\nColumn | B
