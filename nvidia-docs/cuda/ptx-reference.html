e column of scale_B .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#warp-level-block-scaling", "tokens": ["mma.sync", "kind"], "summaryZh": "本条整理 PTX ISA 官方文档中的「线程块 Scaling for mma.sync」，归在「指令」。重点关注 关键词 mma.sync、kind，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「线程块 Scaling for mma.sync」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mma.sync、kind。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Matrix multiply-accumulate operation using wmma instructions", "titleZh": "矩阵乘加操作使用 wmma 指令", "numberedTitle": "9.7.15.4. Matrix multiply-accumulate operation using wmma instructions", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Warp Level Matrix Multiply-Accumulate Instructions", "parentZh": "Warp 级矩阵乘加指令", "kind": "Instructions", "kindZh": "指令", "summary": "This section describes warp level wmma.load, wmma.mma and wmma.store instructions and the organization of various matrices invovled in these instruction.", "details": "This section describes warp level wmma.load, wmma.mma and wmma.store instructions and the organization of various matrices invovled in these instruction.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#warp-level-matrix-instructions-wmma", "tokens": ["warp", "wmma.load", "wmma.mma", "wmma.store"], "summaryZh": "本条整理 PTX ISA 官方文档中的「矩阵乘加操作使用 wmma 指令」，归在「指令」。重点关注 关键词 warp、wmma.load、wmma.mma、wmma.store，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「矩阵乘加操作使用 wmma 指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：warp、wmma.load、wmma.mma、wmma.store。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Matrix Fragments for WMMA", "titleZh": "矩阵 Fragment：WMMA", "numberedTitle": "9.7.15.4.1. Matrix Fragments for WMMA", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Matrix multiply-accumulate operation using wmma instructions", "parentZh": "矩阵乘加操作使用 wmma 指令", "kind": "Instructions", "kindZh": "指令", "summary": "Each thread in the warp holds a fragment of the matrix. The distribution of fragments loaded by the threads in a warp is unspecified and is target architecture dependent, and hence the identity of the fragment within the matrix is also unspecified and is target...", "details": "Each thread in the warp holds a fragment of the matrix.\nThe distribution of fragments loaded by the threads in a warp is unspecified and is target architecture dependent, and hence the identity of the fragment within the matrix is also unspecified and is target architecture dependent.\nEach fragment is a vector expression whose contents are determined as follows.\nThe identity of individual matrix elements in the fragment is unspecified.\nInteger fragments\nMultiplicands (A or B):\nData-type | Shape | Matrix | Fragment\n.u8 or .s8 | .m16n16k16 | A | A vector expression of two .b32 registers, with each register containing four elements from the matrix.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#warp-level-matrix-fragment", "tokens": ["warp", "m16n16k16", "b32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「矩阵 Fragment：WMMA」，归在「指令」。重点关注 关键词 warp、m16n16k16、b32，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「矩阵 Fragment：WMMA」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：warp、m16n16k16、b32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Matrix Storage for WMMA", "titleZh": "WMMA 矩阵存储", "numberedTitle": "9.7.15.4.2. Matrix Storage for WMMA", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Matrix multiply-accumulate operation using wmma instructions", "parentZh": "矩阵乘加操作使用 wmma 指令", "kind": "Instructions", "kindZh": "指令", "summary": "Each matrix can be stored in memory with a row-major or column-major layout. In a row-major format, consecutive elements of each row are stored in contiguous memory locations, and the row is called the leading dimension of the matrix. In a column-major format,...", "details": "Each matrix can be stored in memory with a row-major or column-major layout.\nIn a row-major format, consecutive elements of each row are stored in contiguous memory locations, and the row is called the leading dimension of the matrix.\nConsecutive instances of the leading dimension (rows or columns) need not be stored contiguously in memory.\nThe wmma.load and wmma.store operations accept an optional argument stride that specifies the offset from the beginning of each row (or column) to the next, in terms of matrix elements (and not bytes).\nAddress Alignment\nThe starting address of each instance of the leading dimension (row or column) must be aligned with the size of the corresponding fragment in bytes.\nNote that the starting address is determined by the base pointer and the optional stride .\nConsider the following instruction as an example:", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#warp-level-matrix-storage", "tokens": ["wmma.load", "wmma.store"], "summaryZh": "本条整理 PTX ISA 官方文档中的「WMMA 矩阵存储」，归在「指令」。重点关注 关键词 wmma.load、wmma.store，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「WMMA 矩阵存储」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：wmma.load、wmma.store。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Warp-level Matrix Load Instruction: wmma.load", "titleZh": "Warp 级矩阵 load 指令：wmma.load", "numberedTitle": "9.7.15.4.3. Warp-level Matrix Load Instruction: wmma.load", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Matrix multiply-accumulate operation using wmma instructions", "parentZh": "矩阵乘加操作使用 wmma 指令", "kind": "Instructions", "kindZh": "指令", "summary": "wmma.load", "details": "wmma.load\nCollectively load a matrix from memory for WMMA\nSyntax\nFloating point format .f16 loads:\nAlternate floating point format .bf16 loads:\nAlternate floating point format .tf32 loads:\nDouble precision Floating point .f64 loads:\nSub-byte loads:", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#warp-level-matrix-instructions-wmma-ld", "tokens": ["wmma.load", "f16", "bf16", "tf32", "f64"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Warp 级矩阵 load 指令：wmma.load」，归在「指令」。重点关注 关键词 wmma.load、f16、bf16、tf32、f64，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Warp 级矩阵 load 指令：wmma.load」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：wmma.load、f16、bf16、tf32、f64。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Warp-level Matrix Store Instruction: wmma.store", "titleZh": "Warp 级矩阵 store 指令：wmma.store", "numberedTitle": "9.7.15.4.4. Warp-level Matrix Store Instruction: wmma.store", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Matrix multiply-accumulate operation using wmma instructions", "parentZh": "矩阵乘加操作使用 wmma 指令", "kind": "Instructions", "kindZh": "指令", "summary": "wmma.store", "details": "wmma.store\nCollectively store a matrix into memory for WMMA\nSyntax\nDescription\nCollectively store a matrix across all threads in a warp at the location indicated by address operand p in the specified state space from source register r .\nIf no state space is given, perform the memory accesses using Generic Addressing . wmma.load operation may be used only with .global and .shared spaces and with generic addressing, where the address points to .global or .shared space.\nThe source operand r is a brace-enclosed vector expression that matches the shape of the fragment expected by the store operation, as described in Matrix Fragments for WMMA .\nThe .shape qualifier indicates the dimensions of all the matrix arguments involved in the intended wmma computation.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#warp-level-matrix-instructions-wmma-st", "tokens": ["wmma.store", "warp", "wmma.load", "global", "shared", "shape"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Warp 级矩阵 store 指令：wmma.store」，归在「指令」。重点关注 关键词 wmma.store、warp、wmma.load、global、shared，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Warp 级矩阵 store 指令：wmma.store」对应的官 iption\nMove a row-major matrix across all threads in a warp, reading elements from source a , and writing the transposed elements to destination d .\nThe .shape qualifier indicates the dimensions of the matrix being transposed.\nEach matrix element holds 16-bit data as indicated by the .type qualifier.\nThe mandatory .sync qualifier indicates that movmatrix causes the executing thread to wait until all threads in the warp execute the same movmatrix instruction before resuming execution.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#warp-level-matrix-instructions-movmatrix", "tokens": ["warp", "shape", "type", "sync"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Warp-level matrix 转置指令：movmatrix」，归在「指令」。重点关注 关键词 warp、shape、type、sync，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Warp-level matrix 转置指令：movmatrix」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：warp、shape、type、sync。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Matrix multiply-accumulate operation using mma.sp instruction with sparse matrix A", "titleZh": "矩阵乘加操作使用 mma.sp 指令 with sparse matrix A", "numberedTitle": "9.7.15.6. Matrix multiply-accumulate operation using mma.sp instruction with sparse matrix A", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Warp Level Matrix Multiply-Accumulate Instructions", "parentZh": "Warp 级矩阵乘加指令", "kind": "Instructions", "kindZh": "指令", "summary": "This section describes warp-level mma.sp{::ordered_metadata} instruction with sparse matrix A. This variant of the mma operation can be used when A is a structured sparse matrix with 50% zeros in each row distributed in a shape-specific granularity. For an MxNxK sparse...", "details": "This section describes warp-level mma.sp{::ordered_metadata} instruction with sparse matrix A.\nThis variant of the mma operation can be used when A is a structured sparse matrix with 50% zeros in each row distributed in a shape-specific granularity.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#warp-level-matrix-instructions-for-sparse-mma", "tokens": ["mma.sp", "warp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「矩阵乘加操作使用 mma.sp 指令 with sparse matrix A」，归在「指令」。重点关注 关键词 mma.sp、warp，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「矩阵乘加操作使用 mma.sp 指令 with sparse matrix A」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mma.sp、warp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Sparse matrix storage", "titleZh": "稀疏矩阵存储", "numberedTitle": "9.7.15.6.1. Sparse matrix storage", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Matrix multiply-accumulate operation using mma.sp instruction with sparse matrix A", "parentZh": "矩阵乘加操作使用 mma.sp 指令 with sparse matrix A", "kind": "Instructions", "kindZh": "指令", "summary": "Granularity of sparse matrix A is defined as the ratio of the number of non-zero elements in a sub-chunk of the matrix row to the total number of elements in that sub-chunk where the size of the sub-chunk is shape-specific. For example, in a 16x16 matrix A, sparsity is...", "details": "Granularity of sparse matrix A is defined as the ratio of the number of non-zero elements in a sub-chunk of the matrix row to the total number of elements in that sub-chunk where the size of the sub-chunk is shape-specific.\nFor example, in a 16x16 matrix A, sparsity is expected to be at 2:4 granularity, i.e. each 4-element vector (i.e. a sub-chunk of 4 consecutive elements) of a matrix row contains 2 zeros.\nFigure 111 shows an example of a 16x16 matrix A represented in sparse format and sparsity selector indicating which thread in a group of four consecutive threads stores the metadata.\nGranularities for different matrix shapes and data types are described below.\nSparse mma.sp{::ordered_metadata} with half-precision and .bf16 type\nFor the .m16n8k16 and .m16n8k32 mma.sp{::ordered_metadata} operations, matrix A is structured sparse at a granularity of 2:4.\nIn other words, each chunk of four adjacent elements in a row of matrix A has two zeros and two non-zero elements.\nThe sparsity selector indicates the threads which contribute metadata as listed below:", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#warp-level-sparse-matrix-storage", "tokens": ["mma.sp", "bf16", "m16n8k16", "m16n8k32"], "summaryZh": "本条整理 PTX ISA 官方文档中的「稀疏矩阵存储」，归在「指令」。重点关注 关键词 mma.sp、bf16、m16n8k16、m16n8k32，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「稀疏矩阵存储」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mma.sp、bf16、m16n8k16、m16n8k32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Matrix fragments for multiply-accumulate operation with sparse matrix A", "titleZh": "矩阵 Fragment：multiply-accumulate operation with sparse matrix A", "numberedTitle": "9.7.15.6.2. Matrix fragments for multiply-accumulate operation with sparse matrix A", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Matrix multiply-accumulate operation using mma.sp instruction with sparse matrix A", "parentZh": "矩阵乘加操作使用 mma.sp 指令 with sparse matrix A", "kind": "Instructions", "kindZh": "指令", "summary": "In this section we describe how the contents of thread registers are associated with fragments of various matrices and the sparsity metadata. The following conventions are used throughout this section:", "details": "In this section we describe how the contents of thread registers are associated with fragments of various matrices and the sparsity metadata.\nThe following conventions are used throughout this section:\nFor matrix A, only the layout of a fragment is described in terms of register vector sizes and their association with the matrix data.\nFor matrix B, when the combination of matrix dimension and the supported data type is not already covered in Matrix multiply-accumulate operation using mma instruction , a pictorial representation of matrix fragments is provided.\nFor matrices C and D, since the matrix dimension - data type combination is the same for all supported shapes, and is already covered in Matrix multiply-accumulate operation using mma instruction , the pictorial representations of matrix fragments are not included in this section.\nFor the metadata operand, pictorial representations of the association between indices of the elements of matrix A and the contents of the metadata operand are included. Tk: [m..n] present in cell [x][y..z] indicates that bits m through n (with m being higher) in the metadata operand of thread with %laneid=k contains the indices of the non-zero elements from the chunk [x][y]..[x][z] of matrix A.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#warp-level-matrix-fragments-for-sparse-mma", "tokens": ["%laneid"], "summaryZh": "本条整理 PTX ISA 官方文档中的「矩阵 Fragment：multiply-accumulate operation with sparse matrix A」，归在「指令」。重点关注 关键词 %laneid，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「矩阵 Fragment：multiply-accumulate operation with sparse matrix A」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：%laneid。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Matrix Fragments for sparse mma.m16n8k16 with .f16 and .bf16 types", "titleZh": "矩阵 Fragment：sparse mma.m16n8k16 with .f16 and .bf16 types", "numberedTitle": "9.7.15.6.2.1. Matrix Fragments for sparse mma.m16n8k16 with .f16 and .bf16 types", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Matrix fragments for multiply-accumulate operation with sparse matrix A", "parentZh": "矩阵 Fragment：multiply-accumulate operation with sparse matrix A", "kind": "Instructions", "kindZh": "指令", "summary": "A warp executing sparse mma.m16n8k16 with .f16 / .bf16 floating point type will compute an MMA operation of shape .m16n8k16 .", "details": "A warp executing sparse mma.m16n8k16 with .f16 / .bf16 floating point type will compute an MMA operation of shape .m16n8k16 .\nElements of the matrix are distributed across the threads in a warp so each thread of the warp holds a fragment of the matrix.\nMultiplicand A: .atype Fragment Elements .f16 / .bf16 A vector expression containing two .b32 registers, with each register containing two non-zero .f16 / .bf16 elements out of 4 consecutive elements from matrix A. Mapping of the non-zero elements is as described in Sparse matrix storage . The layout of the fragments held by different threads is shown in Figure 118 . Figure 118 Sparse MMA .m16n8k16 fragment layout for matrix A with .f16 / .bf16 type. The row and column of a matrix fragment can be computed as: groupID = % laneid >> 2 threadID_in_group = % laneid % 4 row = groupID for a0 and a1 groupID + 8 for a2 and a3 col = [ firstcol ... lastcol ] // As per the mapping of non-zero elements // as described in Sparse matrix storage Where firstcol = threadID_in_group * 4 lastcol = firstcol + 3\nMatrix fragments for multiplicand B and accumulators C and D are the same as in case of Matrix Fragments for mma.m16n8k16 with floating point type for .f16 / .b16 formats.\nMetadata: A .b32 register containing 16 2-bit vectors each storing the index of a non-zero element of a 4-wide chunk of matrix A as shown in Figure 119 . Figure 119 Sparse MMA .m16n8k16 metadata layout for .f16 / .bf16 type.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#warp-level-matrix-fragment-sparse-mma-16816-f16bf16", "tokens": ["mma.m16n8k16", "f16", "bf16", "warp", "m16n8k16", "atype", "b32", "b16"], "summaryZh": "本条整理 PTX ISA 官方文档中的「矩阵 Fragment：sparse mma.m16n8k16 with .f16 and .bf16 types」，归在「指令」。重点关注 关键词 mma.m16n8k16、f16、bf16、warp、m16n8k16，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「矩阵 Fragment：sparse mma.m16n8k16 with .f16 and .bf16 types」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mma.m16n8k16、f16、bf16、warp、m16n8k16、atype、b32、b16。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Matrix Fragments for sparse mma.m16n8k32 with .f16 and .bf16 types", "titleZh": "矩阵 Fragment：sparse mma.m16n8k32 with .f16 and .bf16 types", "numberedTitle": "9.7.15.6.2.2. Matrix Fragments for sparse mma.m16n8k32 with .f16 and .bf16 types", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Matrix fragments for multiply-accumulate operation with sparse matrix A", "parentZh": "矩阵 Fragment：multiply-accumulate operation with sparse matrix A", "kind": "Instructions", "kindZh": "指令", "summary": "A warp executing sparse mma.m16n8k32 with .f16 / .bf16 floating point type will compute an MMA operation of shape .m16n8k32 .", "details": "A warp executing sparse mma.m16n8k32 with .f16 / .bf16 floating point type will compute an MMA operation of shape .m16n8k32 .\nElements of the matrix are distributed across the threads in a warp so each thread of the warp holds a fragment of the matrix.\nMultiplicand A: .atype Fragment Elements .f16 / .bf16 A vector expression containing four .b32 registers, with each register containing two non-zero .f16 / .bf16 elements out of 4 consecutive elements from matrix A. Mapping of the non-zero elements is as described in Sparse matrix storage . The layout of the fragments held by different threads is shown in Figure 120 . Figure 120 Sparse MMA .m16n8k32 fragment layout for matrix A with .f16 / .bf16 type. The row and column of a matrix fragment can be computed as: groupID = % laneid >> 2 threadID_in_group = % laneid % 4 row = groupID for ai where 0 <= i < 2 || 4 <= i < 6 groupID + 8 Otherwise col = [ firstcol ... lastcol ] // As per the mapping of non-zero elements // as described in Sparse matrix storage Where firstcol = threadID_in_group * 4 For ai where i < 4 ( threadID_in_group * 4 ) + 16 for ai where i >= 4 lastcol = firstcol + 3\nMultiplicand B: .atype Fragment Elements (low to high) .f16 / .bf16 A vector expression containing four .b32 registers, each containing two .f16 / .bf16 elements from matrix B. b0, b1, b2, b3 The layout of the fragments held by different threads is shown in Figure 121 . Figure 121 Sparse MMA .m16n8k32 fragment layout for matrix B with .f16 / .bf16 type.\nMatrix fragments for accumulators C and D are the same as in case of Matrix Fragments for mma.m16n8k16 with floating point type for .f16 / .b16 formats.\nMetadata: A .b32 register containing 16 2-bit vectors with each pair of 2-bit vectors storing the indices of two non-zero element from a 4-wide chunk of matrix A as shown in Figure 122 . Figure 122 Sparse MMA .m16n8k32 metadata layout for .f16 / .bf16 type.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#warp-level-matrix-fragment-sparse-mma-16832-f16bf16", "tokens": ["mma.m16n8k32", "f16", "bf16", "warp", "m16n8k32", "atype", "b32", "mma.m16n8k16", "b16"], "summaryZh": "本条整理 PTX ISA 官方文档中的「矩阵 Fragment：sparse mma.m16n8k32 with .f16 and .bf16 types」，归在「指令」。重点关注 关键词 mma.m16n8k32、f16、bf16、warp、m16n8k32，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「矩阵 Fragment：sparse mma.m16n8k32 with .f16 and .bf16 types」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：mma.m16n8k32、f16、bf16、warp、m16n8k32、atype、b32、mma.m16n8k16。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Matrix Fragments for sparse mma.m16n8k16 with .tf32 floating point type", "titleZh": "矩阵 Fragment：sparse mma.m16n8k16 with .tf32 floating point type", "numberedTitle": "9.7.15.6.2.3. Matrix Fragments for sparse mma.m16n8k16 with .tf32 floating point type", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Matrix fragments for multiply-accumulate operation with sparse matrix A", "parentZh": "矩阵 Fragment：multiply-accumulate operation with sparse matrix A", "kind": "Instructions", "kindZh": "指令", "summary": "A warp executing sparse mma.m16n8k16 with .tf32 floating point type will compute an MMA operation of shape .m16n8k16 .", "details": "A warp executing sparse mma.m16n8k16 with .tf32 floating point type will compute an MMA operation of shape .m16n8k16 .\nElements of the matrix are distributed across the threads in a warp so each thread of the warp holds a fragm itleZh": "异步 Warpgroup 级矩阵乘加指令", "numberedTitle": "9.7.16. Asynchronous Warpgroup Level Matrix Multiply-Accumulate Instructions", "level": "H3", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Instructions", "parentZh": "指令", "kind": "Instructions", "kindZh": "指令", "summary": "The warpgroup level matrix multiply and accumulate operation has either of the following forms, where matrix D is called accumulator:", "details": "The warpgroup level matrix multiply and accumulate operation has either of the following forms, where matrix D is called accumulator:\nD = A * B + D\nD = A * B , where the input from accumulator D is disabled.\nThe wgmma instructions perform warpgroup level matrix multiply-and-accumulate operation by having all threads in a warpgroup collectively perform the following actions:\nLoad matrices A, B and D into registers or into shared memory.\nPerform the following fence operations: wgmma.fence operations to indicate that the register/shared-memory across the warpgroup have been written into. fence.proxy.async operation to make the generic proxy operations visible to the async proxy.\nIssue the asynchronous matrix multiply and accumulate operations using the wgmma.mma_async operation on the input matrices. The wgmma.mma_async operation is performed in the async proxy.\nCreate a wgmma-group and commit all the prior outstanding wgmma.mma_async operations into the group, by using wgmma.commit_group operation.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#asynchronous-warpgroup-level-matrix-instructions", "tokens": ["warpgroup", "wgmma.fence", "fence.proxy.async", "wgmma.mma", "wgmma.commit"], "summaryZh": "本条整理 PTX ISA 官方文档中的「异步 Warpgroup 级矩阵乘加指令」，归在「指令」。重点关注 关键词 warpgroup、wgmma.fence、fence.proxy.async、wgmma.mma、wgmma.commit，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「异步 Warpgroup 级矩阵乘加指令」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：warpgroup、wgmma.fence、fence.proxy.async、wgmma.mma、wgmma.commit。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Warpgroup", "titleZh": "Warpgroup", "numberedTitle": "9.7.16.1. Warpgroup", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Asynchronous Warpgroup Level Matrix Multiply-Accumulate Instructions", "parentZh": "异步 Warpgroup 级矩阵乘加指令", "kind": "Instructions", "kindZh": "指令", "summary": "A warpgroup is a set of four contiguous warps such that the warp-rank of the first warp is a multiple of 4.", "details": "A warpgroup is a set of four contiguous warps such that the warp-rank of the first warp is a multiple of 4.\nwarp-rank of a warp is defined as:", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#asynchronous-warpgroup-level-matrix-instructions-warpgroup", "tokens": ["warpgroup", "warps", "warp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Warpgroup」，归在「指令」。重点关注 关键词 warpgroup、warps、warp，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Warpgroup」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：warpgroup、warps、warp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Matrix Shape", "titleZh": "矩阵 Shape", "numberedTitle": "9.7.16.2. Matrix Shape", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Asynchronous Warpgroup Level Matrix Multiply-Accumulate Instructions", "parentZh": "异步 Warpgroup 级矩阵乘加指令", "kind": "Instructions", "kindZh": "指令", "summary": "The matrix multiply and accumulate operations support a limited set of shapes for the operand matrices A, B and D. The shapes of all three matrix operands are collectively described by the tuple MxNxK , where A is an MxK matrix, B is a KxN matrix, while D is a MxN...", "details": "The matrix multiply and accumulate operations support a limited set of shapes for the operand matrices A, B and D.\nThe shapes of all three matrix operands are collectively described by the tuple MxNxK , where A is an MxK matrix, B is a KxN matrix, while D is a MxN matrix.\nThe following matrix shapes are supported for the specified types for the wgmma.mma_async operation:\nMultiplicand Data type | Sparsity | Shape\nFloating-point - .f16 | Dense | .m64n8k16 , .m64n16k16 , .m64n24k16 , .m64n32k16 , .m64n40k16 , .m64n48k16 , .m64n56k16 , .m64n64k16 , .m64n72k16 , .m64n80k16 , .m64n88k16 , .m64n96k16 , .m64n104k16 , .m64n112k16 , .m64n120k16 , .m64n128k16 , .m64n136k16 , .m64n144k16 , .m64n152k16 , .m64n160k16 , .m64n168k16 , .m64n176k16 , .m64n184k16 , .m64n192k16 , .m64n200k16 , .m64n208k16 , .m64n216k16 , .m64n224k16 , .m64n232k16 , .m64n240k16 , .m64n248k16 , .m64n256k16\nAlternate floating-point format - .bf16\nAlternate floating-point format - .tf32 | Sparse\nAlternate floating-point format - .tf32 | Dense | .m64n8k8 , .m64n16k8 , .m64n24k8 , .m64n32k8 , .m64n40k8 , .m64n48k8 , .m64n56k8 , .m64n64k8 , .m64n72k8 , .m64n80k8 , .m64n88k8 , .m64n96k8 , .m64n104k8 , .m64n112k8 , .m64n120k8 , .m64n128k8 , .m64n136k8 , .m64n144k8 , .m64n152k8 , .m64n160k8 , .m64n168k8 , .m64n176k8 , .m64n184k8 , .m64n192k8 , .m64n200k8 , .m64n208k8 , .m64n216k8 , .m64n224k8 , .m64n232k8 , .m64n240k8 , .m64n248k8 , .m64n256k8", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#asynchronous-warpgroup-level-matrix-shape", "tokens": ["wgmma.mma", "f16", "m64n8k16", "m64n16k16", "m64n24k16", "m64n32k16", "m64n40k16", "m64n48k16", "m64n56k16", "m64n64k16", "m64n72k16", "m64n80k16"], "summaryZh": "本条整理 PTX ISA 官方文档中的「矩阵 Shape」，归在「指令」。重点关注 关键词 wgmma.mma、f16、m64n8k16、m64n16k16、m64n24k16，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「矩阵 Shape」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：wgmma.mma、f16、m64n8k16、m64n16k16、m64n24k16、m64n32k16、m64n40k16、m64n48k16。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Matrix Data-types", "titleZh": "矩阵数据类型", "numberedTitle": "9.7.16.3. Matrix Data-types", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Asynchronous Warpgroup Level Matrix Multiply-Accumulate Instructions", "parentZh": "异步 Warpgroup 级矩阵乘加指令", "kind": "Instructions", "kindZh": "指令", "summary": "The matrix multiply and accumulate operation is supported separately on integer, floating-point, sub-byte integer and single bit data-types. All operands must contain the same basic type kind, i.e., integer or floating-point.", "details": "The matrix multiply and accumulate operation is supported separately on integer, floating-point, sub-byte integer and single bit data-types.\nAll operands must contain the same basic type kind, i.e., integer or floating-point.\nFor floating-point matrix multiply and accumulate operation, different matrix operands may have different precision, as described later.\nFor integer matrix multiply and accumulate operation, both multiplicand matrices (A and B) must have elements of the same data-type, e.g. both signed integer or both unsigned integer.\nData-type | Multiplicands (A or B) | Accumulator (D)\nInteger | both .u8 or both .s8 | .s32\nFloating Point | .f16 | .f16 , .f32\nAlternate floating Point | .bf16 | .f32", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#asynchronous-warpgroup-level-matrix-data-types", "tokens": ["s32", "f16", "f32", "bf16"], "summaryZh": "本条整理 PTX ISA 官方文档中的「矩阵数据类型」，归在「指令」。重点关注 关键词 s32、f16、f32、bf16，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「矩阵数据类型」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：s32、f16、f32、bf16。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Async Proxy", "titleZh": "Async proxy", "numberedTitle": "9.7.16.4. Async Proxy", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Asynchronous Warpgroup Level Matrix Multiply-Accumulate Instructions", "parentZh": "异步 Warpgroup 级矩阵乘加指令", "kind": "Instructions", "kindZh": "指令", "summary": "The wgmma.mma_async operations are performed in the asynchronous proxy (or async proxy).", "details": "The wgmma.mma_async operations are performed in the asynchronous proxy (or async proxy).\nAccessing the same memory location across multiple proxies needs a cross-proxy fence.\nFor the async proxy, fence.proxy.async should be used to synchronize memory between generic proxy and the async proxy.\nThe completion of a wgmma.mma_async operation is followed by an implicit generic-async proxy fence.\nSo the result of the asynchronous operation is made visible to the generic proxy as soon as its completion is observed. wgmma.commit_group and wgmma.wait_group operations must be used to wait for the completion of the wgmma.mma_async instructions.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#asynchronous-warpgroup-level-matrix-async-proxy", "tokens": ["wgmma.mma", "fence.proxy.async", "wgmma.commit", "wgmma.wait"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Async proxy」，归在「指令」。重点关注 关键词 wgmma.mma、fence.proxy.async、wgmma.commit、wgmma.wait，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Async proxy」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：wgmma.mma、fence.proxy.async、wgmma.commit、wgmma.wait。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Asynchronous Warpgroup Level Matrix Multiply-Accumulate Operation using wgmma.mma_async instruction", "titleZh": "Asynchronous Warpgroup Level Matrix Multiply-Accumulate Operation using wgmma.mma_async instruction", "numberedTitle": "9.7.16.5. Asynchronous Warpgroup Level Matrix Multiply-Accumulate Operation using wgmma.mma_async instruction", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Asynchronous Warpgroup Level Matrix Multiply-Accumulate Instructions", "parentZh": "异步 Warpgroup 级矩阵乘加指令", "kind": "Instructions", "kindZh": "指令", "summary": "This section describes warpgroup level wgmma.mma_async instruction and the organization of various matrices involved in this instruction.", "details": "This section describes warpgroup level wgmma.mma_async instruction and the organization of various matrices involved in this instruction.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/inde uBLAS, the matrices A and B with and without transpose can be classified as either K-Major or M-or-N-Major as shown in the following table:\nNon-Transposed | Transposed\nA | K-major | M-major\nB | K-major | N-major\nTo avoid confusion with A , B , row-major , col-major , transpose , and non-transpose , we will use MN-Major and K-Major throughout this section.\nThe matrices in the shared memory are made up of one or more “swizzle layout atom”.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#asynchronous-warpgroup-level-matrix-shared-memory-layout", "tokens": ["wgmma.mma", "cuBLAS"], "summaryZh": "本条整理 PTX ISA 官方文档中的「共享内存矩阵布局」，归在「指令」。重点关注 关键词 wgmma.mma、cuBLAS，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「共享内存矩阵布局」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：wgmma.mma、cuBLAS。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Asynchronous Multiply-and-Accumulate Instruction: wgmma.mma_async", "titleZh": "异步矩阵乘加指令：wgmma.mma_async", "numberedTitle": "9.7.16.5.2. Asynchronous Multiply-and-Accumulate Instruction: wgmma.mma_async", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Asynchronous Warpgroup Level Matrix Multiply-Accumulate Operation using wgmma.mma_async instruction", "parentZh": "Asynchronous Warpgroup Level Matrix Multiply-Accumulate Operation using wgmma.mma_async instruction", "kind": "Instructions", "kindZh": "指令", "summary": "wgmma.mma_async", "details": "wgmma.mma_async\nPerform matrix multiply-and-accumulate operation across warpgroup\nSyntax\nHalf precision floating point type:\nAlternate floating point type :\nInteger type:\nSingle bit:\nDescription", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#asynchronous-warpgroup-level-matrix-instructions-wgmma-mma", "tokens": ["wgmma.mma", "warpgroup"], "summaryZh": "本条整理 PTX ISA 官方文档中的「异步矩阵乘加指令：wgmma.mma_async」，归在「指令」。重点关注 关键词 wgmma.mma、warpgroup，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「异步矩阵乘加指令：wgmma.mma_async」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：wgmma.mma、warpgroup。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Asynchronous Warpgroup Level Multiply-and-Accumulate Operation using wgmma.mma_async.sp instruction", "titleZh": "Asynchronous Warpgroup Level Multiply-and-Accumulate Operation using wgmma.mma_async.sp instruction", "numberedTitle": "9.7.16.6. Asynchronous Warpgroup Level Multiply-and-Accumulate Operation using wgmma.mma_async.sp instruction", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Asynchronous Warpgroup Level Matrix Multiply-Accumulate Instructions", "parentZh": "异步 Warpgroup 级矩阵乘加指令", "kind": "Instructions", "kindZh": "指令", "summary": "This section describes warp-level wgmma.mma_async.sp instruction with sparse matrix A. This variant of the wgmma.mma_async operation can be used when A is a structured sparse matrix with 50% zeros in each row distributed in a shape-specific granularity. For an MxNxK...", "details": "This section describes warp-level wgmma.mma_async.sp instruction with sparse matrix A.\nThis variant of the wgmma.mma_async operation can be used when A is a structured sparse matrix with 50% zeros in each row distributed in a shape-specific granularity.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#asynchronous-warpgroup-level-matrix-instructions-for-sparse-wgmma", "tokens": ["wgmma.mma", "async.sp", "warp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Asynchronous Warpgroup Level Multiply-and-Accumulate Operation using wgmma.mma_async.sp instruction」，归在「指令」。重点关注 关键词 wgmma.mma、async.sp、warp，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Asynchronous Warpgroup Level Multiply-and-Accumulate Operation using wgmma.mma_async.sp instruction」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：wgmma.mma、async.sp、warp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Sparse matrix storage", "titleZh": "稀疏矩阵存储", "numberedTitle": "9.7.16.6.1. Sparse matrix storage", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Asynchronous Warpgroup Level Multiply-and-Accumulate Operation using wgmma.mma_async.sp instruction", "parentZh": "Asynchronous Warpgroup Level Multiply-and-Accumulate Operation using wgmma.mma_async.sp instruction", "kind": "Instructions", "kindZh": "指令", "summary": "Granularity of sparse matrix A is defined as the ratio of the number of non-zero elements in a sub-chunk of the matrix row to the total number of elements in that sub-chunk where the size of the sub-chunk is shape-specific. For example, in a 64x32 matrix A used in...", "details": "Granularity of sparse matrix A is defined as the ratio of the number of non-zero elements in a sub-chunk of the matrix row to the total number of elements in that sub-chunk where the size of the sub-chunk is shape-specific.\nFor example, in a 64x32 matrix A used in floating point wgmma.mma_async operations, sparsity is expected to be at 2:4 granularity, i.e. each 4-element vector (i.e. a sub-chunk of 4 consecutive elements) of a matrix row contains 2 zeros.\nMatrix A and its corresponding input operand to the sparse wgmma is similar to the diagram shown in Figure 111 , with an appropriate matrix size.\nGranularities for different matrix shapes and data types are described below.\nSparse wgmma.mma_async.sp with half-precision and .bf16 type\nFor .f16 and .bf16 types, for all supported 64xNx32 shapes, matrix A is structured sparse at a granularity of 2:4.\nIn other words, each chunk of four adjacent elements in a row of matrix A have two zeroes and two non-zero elements.\nThe sparsity selector indicates a thread-pair within a group of four consecutive threads which contributes the sparsity metadata.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#asynchronous-warpgroup-level-sparse-matrix-storage", "tokens": ["wgmma.mma", "async.sp", "bf16", "f16"], "summaryZh": "本条整理 PTX ISA 官方文档中的「稀疏矩阵存储」，归在「指令」。重点关注 关键词 wgmma.mma、async.sp、bf16、f16，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「稀疏矩阵存储」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：wgmma.mma、async.sp、bf16、f16。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Matrix fragments for warpgroup-level multiply-accumulate operation with sparse matrix A", "titleZh": "矩阵 Fragment：warpgroup-level multiply-accumulate operation with sparse matrix A", "numberedTitle": "9.7.16.6.2. Matrix fragments for warpgroup-level multiply-accumulate operation with sparse matrix A", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Asynchronous Warpgroup Level Multiply-and-Accumulate Operation using wgmma.mma_async.sp instruction", "parentZh": "Asynchronous Warpgroup Level Multiply-and-Accumulate Operation using wgmma.mma_async.sp instruction", "kind": "Instructions", "kindZh": "指令", "summary": "In this section we describe how the contents of thread registers are associated with fragments of A matrix and the sparsity metadata.", "details": "In this section we describe how the contents of thread registers are associated with fragments of A matrix and the sparsity metadata.\nEach warp in the warpgroup provides sparsity information for 16 rows of matrix A.\nThe following table shows the assignment of warps to rows of matrix A:\nWarp | Sparsity information for rows of matrix A\n%warpid % 4 = 3 | 48-63\n%warpid % 4 = 2 | 32-47\n%warpid % 4 = 1 | 16-31\n%warpid % 4 = 0 | 0-15", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#asynchronous-warpgroup-level-matrix-fragments-for-sparse-wgmma", "tokens": ["warpgroup", "warp", "warps", "%warpid"], "summaryZh": "本条整理 PTX ISA 官方文档中的「矩阵 Fragment：warpgroup-level multiply-accumulate operation with sparse matrix A」，归在「指令」。重点关注 关键词 warpgroup、warp、warps、%warpid，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「矩阵 Fragment：warpgroup-level multiply-accumulate operation with sparse matrix A」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：warpgroup、warp、warps、%warpid。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Matrix Fragments for sparse wgmma.mma_async.m64nNk32", "titleZh": "矩阵 Fragment：sparse wgmma.mma_async.m64nNk32", "numberedTitle": "9.7.16.6.2.1. Matrix Fragments for sparse wgmma.mma_async.m64nNk32", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Matrix fragments for warpgroup-level multiply-accumulate operation with sparse matrix A", "parentZh": "矩阵 Fragment：warpgroup-level multiply-accumulate operation with sparse matrix A", "kind": "Instructions", "kindZh": "指令", "summary": "A warpgroup executing sparse wgmma.mma_async.m64nNk32 will compute an MMA operation of shape .m64nNk32 where N is a valid n dimension as listed in Matrix Shape .", "details": "A warpgroup executing sparse wgmma.mma_async.m64nNk32 will compute an MMA operation of shape .m64nNk32 where N is a valid n dimension as listed in Matrix Shape .\nElements of the matrix are distributed across the threads in a warpgroup so each thread of the warpgroup holds a fragment of the matrix.\nMultiplicand A, from shared memory is documented in Shared Memory Matrix Layout .\nMultiplicand A, from registers: .atype Fragments Elements .f16 / .bf16 A vector expression containing four .b32 registers, with each register containing two non-zero .f16 / .bf16 elements out of 4 consecutive elements from matrix A. Non-zero elements: a0, a1, a2, a3, a4, a5, a6, a7 Mapping of the non-zero elements is as described in Sparse matrix storage The layout of the fragments held by different threads is shown in Figure 175 . Figure 175 Sparse WGMMA .m64nNk32 fragment layout for matrix A with .f16 / .bf16 type.\nAccumulator D: Matrix fragments for accumulator D are the same as in case of Matrix Fragments for wgmma.mma_async.m64nNk32 for the same .dtype format.\nMultiplicand B: Shared memory layout for Matrix B is documented in Shared Memory Matrix Layout .\nMetadata operand is a .b32 register containing 16 2-bit vectors each storing the index of a non-zero element of a 4-wide chunk of matrix A. Figure 176 shows the mapping of the metadata bits to the elements of matrix A for a warp. In this figure, variable i represents the value of the sparsity selector operand. Figure 176 Sparse WGMMA .m64nNk32 metadata layout for .f16 / .bf16 type.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#asynchronous-warpgroup-level-matrix-fragment-sparse-wgmma-64n32", "tokens": ["wgmma.mma", "async.m64n", "warpgroup", "m64nNk32", "atype", "f16", "bf16", "b32", "dtype", "warp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「矩阵 Fragment：sparse wgmma.mma_async.m64nNk32」，归在「指令」。重点关注 关键词 wgmma.mma、async.m64n、warpgroup、m64nNk32、atype，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「矩阵 Fragment：sparse wgmma.mma_async.m64nNk32」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：wgmma.mma、async.m64n、warpgroup、m64nNk32、atype、f16、bf16、b32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Matrix Fragments for sparse wgmma.mma_async.m64nNk16", "titleZh": "矩阵 Fragment：sparse wgmma.mma_async.m64nNk16", "numberedTitle": "9.7.16.6.2.2. Matrix Fragments for sparse wgmma.mma_async.m64nNk16", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Matrix fragments for warpgroup-level multiply-accumulate operation with sparse matrix A", "parentZh": "矩阵 Fragment：warpgroup-level multiply-accumulate operation with sparse matrix A", "kind": "Instructions", "kindZh": "指令", "summary": "A warpgroup executing sparse wgmma.mma_async.m64nNk16 will compute an MMA operation of shape .m64nNk16 where N is a valid n dimension as listed in Matrix Shape .", "details": "A warpgroup executing sparse wgmma.mma_async.m64nNk16 will compute an MMA operation of shape .m64nNk16 where N is a valid n dimension as listed in Matrix Shape .\nElements of the matrix are distributed across the threads in a warpgroup so each thread of the warpgroup holds a fragment of the matrix.\nMultiplicand A, from shared memory is documented in Shared Memory Matrix Layout .\nMultiplicand A, from registers: .atype Fragments Elements .tf32 A vector expression containing four .b32 registers, containing four non-zero .tf32 elements out of eight consecutive elements from matrix A. Non-zero elements: a0, a1, a2, a3 Mapping of the non-zero elements is as described in Sparse matrix storage The layout of the fragments held by different threads is shown in Figure 177 . Figure 177 Sparse WGMMA .m64nNk16 fragment layout for matrix A with .tf32 type.\nAccumulator D: Matrix fragments for accumulator D are the same as in case of Matrix Fragments for wgmma.mma_async.m64nNk8 for the same .dtype format.\nMultiplicand B: Shared memory layout for Matrix B is documented in Shared Memory Matrix Layout .\nMetadata operand is a .b32 register containing eight 4-bit vectors each storing the index of a non-zero element of a 2-wide chunk of matrix A. Figure 178 shows the mapping of the metadata bits to the elements of matrix A for a warp. In this figure, variable i represents the value of the sparsity selector operand. Figure 178 Sparse WGMMA .m64nNk16 metadata layout for .tf32 type.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#asynchronous-warpgroup-level-matrix-fragment-sparse-wgmma-64n16", "tokens": ["wgmma.mma", "async.m64n", "warpgroup", "m64nNk16", "atype", "tf32", "b32", "dtype", "warp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「矩阵 Fragment：sparse wgmma.mma_async.m64nNk16」，归在「指令」。重点关注 关键词 wgmma.mma、async.m64n、warpgroup、m64nNk16、atype，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「矩阵 Fragment：sparse wgmma.mma_async.m64nNk16」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：wgmma.mma、async.m64n、warpgroup、m64nNk16、atype、tf32、b32、dtype。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Matrix Fragments for sparse wgmma.mma_async.m64nNk64", "titleZh": "矩阵 Fragment：sparse wgmma.mma_async.m64nNk64", "numberedTitle": "9.7.16.6.2.3. Matrix Fragments for sparse wgmma.mma_async.m64nNk64", "level": "H6", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Matrix fragments for warpgroup-level multiply-accumulate operation with sparse matrix A", "parentZh": "矩阵 Fragment：warpgroup-level multiply-accumulate operation with sparse matrix A", "kind": "Instructions", "kindZh": "指令", "summary": "A warpgroup executing sparse wgmma.mma_async.m64nNk64 will compute an MMA operation of shape .m64nNk64 where N is a valid n dimension as listed in Matrix Shape .", "details": "A warpgroup executing sparse wgmma.mma_async.m64nNk64 will compute an MMA operation of shape .m64nNk64 where N is a valid n dimension as listed in Matrix Shape .\nElements of the matrix are distributed across the threads in a warpgroup so each thread of the warpgroup holds a fragment of the matrix.\nMultiplicand A, from shared memory is documented in Matrix Fragments for sparse wgmma.mma_async.m64nNk64 .\nMultiplicand A, from registers: .atype Fragments Elements .e4m3 / .e5m2 A vector expression containing four .b32 registers, with each register containing four non-zero .e4m3 / .e5m2 elements out of eight consecutive elements from matrix A. Non-zero elements: a0, a1, a2, … , a15 Mapping of the non-zero elements is as described in Sparse matrix storage .s8 / .u8 A vector expression containing four .b32 registers, with each register containing four non-zero .s8 / .u8 elements out of eight consecutive elements from matrix A. The layout of the fragments held by different threads is shown in Figure 179 . Figure 179 Sparse WGMMA .m64nNk64 fragment layout for matrix A with .e4m3 / .e5m2 / .s8 / .u8 type.\nAccumulator D: Matrix fragments for accumulator D are the same as in case of Matrix Fragments for wgmma.mma_async.m64nNk32 for the same .dtype format.\nMultiplicand B: Shared memory layout for Matrix B is documented in Matrix Fragments for sparse wgmma.mma_async.m64nNk64 .\nMetadata operand is a .b32 register containing 16 4-bit vectors each storing the indices of two non-zero elements of a 4-wide chunk of matrix A. Figure 180 shows the mapping of the metadata bits to the elements of columns 0–31 of matrix A. Figure 180 Sparse WGMMA .m64nNk64 metadata layout for .e4m3 / .e5m2 / .s8 / .u8 type for columns 0–31 Figure 181 shows the mapping of the metadata bits to the elements of columns 32–63 of matrix A. Figure 181 Sparse WGMMA .m64nNk64 metadata layout for .e4m3 / .e5m2 / .s8 / .u8 type for columns 32–63", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#asynchronous-warpgroup-level-matrix-fragment-sparse-wgmma-64n64", "tokens": ["wgmma.mma", "async.m64n", "warpgroup", "m64nNk64", "atype", "e4m3", "e5m2", "b32", "dtype"], "summaryZh": "本条整理 PTX ISA 官方文档中的「矩阵 Fragment：sparse wgmma.mma_async.m64nNk64」，归在「指令」。重点关注 关键词 wgmma.mma、async.m64n、warpgroup、m64nNk64、atype，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「矩阵 Fragment：sparse wgmma.mma_async.m64nNk64」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：wgmma.mma、async.m64n、warpgroup、m64nNk64、atype、e4m3、e5m2、b32。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Asynchronous Multiply-and-Accumulate Instruction: wgmma.mma_async.sp", "titleZh": "异步矩阵乘加指令：wgmma.mma_async.sp", "numberedTitle": "9.7.16.6.3. Asynchronous Multiply-and-Accumulate Instruction: wgmma.mma_async.sp", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Asynchronous Warpgroup Level Multiply-and-Accumulate Operation using wgmma.mma_async.sp instruction", "parentZh": "Asynchronous Warpgroup Level Multiply-and-Accumulate Operation using wgmma.mma_async.sp instruction", "kind": "Instructions", "kindZh": "指令", "summary": "wgmma.mma_async.sp", "details": "wgmma.mma_async.sp\nPerform matrix multiply-and-accumulate operation with sparse matrix A across warpgroup\nSyntax\nHalf precision floating point type:\nAlternate floating point type :\nInteger type:\nDescription\nInstruction wgmma.mma_async issues a MxNxK matrix multiply and accumulate operation, D = A*B+D , where the A matrix is MxK , the B matrix is KxN , and the D matrix is MxN .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#asynchronous-warpgroup-level-matrix-instructions-wgmma-mma-sp", "tokens": ["wgmma.mma", "async.sp", "warpgroup"], "summaryZh": "本条整理 PTX ISA 官方文档中的「异步矩阵乘加指令：wgmma.mma_async.sp」，归在「指令」。重点关注 关键词 wgmma.mma、async.sp、warpgroup，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「异步矩阵乘加指令：wgmma.mma_async.sp」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：wgmma.mma、async.sp、warpgroup。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Asynchronous wgmma Proxy Operations", "titleZh": "Asynchronous wgmma Proxy 操作", "numberedTitle": "9.7.16.7. Asynchronous wgmma Proxy Operations", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Asynchronous Warpgroup Level Matrix Multiply-Accumulate Instructions", "parentZh": "异步 Warpgroup 级矩阵乘加指令", "kind": "Instructions", "kindZh": "指令", "summary": "This section describes warpgroup level wgmma.fence , wgmma.commit_group and wgmma.wait_group instructions.", "details": "This section describes warpgroup level wgmma.fence , wgmma.commit_group and wgmma.wait_group instructions.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#asynchronous-wgmma-proxy-operations", "tokens": ["warpgroup", "wgmma.fence", "wgmma.commit", "wgmma.wait"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Asynchronous wgmma Proxy 操作」，归在「指令」。重点关注 关键词 warpgroup、wgmma.fence、wgmma.commit、wgmma.wait，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Asynchronous wgmma Proxy 操作」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：warpgroup、wgmma.fence、wgmma.commit、wgmma.wait。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Asynchronous Multiply-and-Accumulate Instruction: wgmma.fence", "titleZh": "异步矩阵乘加指令：wgmma.fence", "numberedTitle": "9.7.16.7.1. Asynchronous Multiply-and-Accumulate Instruction: wgmma.fence", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Asynchronous wgmma Proxy Operations", "parentZh": "Asynchronous wgmma Proxy 操作", "kind": "Instructions", "kindZh": "指令", "summary": "wgmma.fence", "details": "wgmma.fence\nEnforce an ordering of register accesses between wgmma.mma_async and other operations.\nSyntax\nDescription\nwgmma.fence instruction establishes an ordering between prior accesses to any warpgroup registers and subsequent accesses to the same registers by a wgmma.mma_async instruction.\nOnly the accumulator register and the input registers containing the fragments of matrix A require this ordering.\nThe wgmma.fence instruction must be issued by all warps of the warpgroup at the following locations:\nBefore the first wgmma.mma_async operation in a warpgroup.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#asynchronous-warpgroup-level-matrix-instructions-wgmma-fence", "tokens": ["wgmma.fence", "wgmma.mma", "warpgroup", "warps"], "summaryZh": "本条整理 PTX ISA 官方文档中的「异步矩阵乘加指令：wgmma.fence」，归在「指令」。重点关注 关键词 wgmma.fence、wgmma.mma、warpgroup、warps，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「异步矩阵乘加指令：wgmma.fence」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：wgmma.fence、wgmma.mma、warpgroup、warps。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Asynchronous Multiply-and-Accumulate Instruction: wgmma.commit_group", "titleZh": "异步矩阵乘加指令：wgmma.commit_group", "numberedTitle": "9.7.16.7.2. Asynchronous Multiply-and-Accumulate Instruction: wgmma.commit_group", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Asynchronous wgmma Proxy Operations", "parentZh": "Asynchronous wgmma Proxy 操作", "kind": "Instructions", "kindZh": "指令", "summary": "wgmma.commit_group", "details": "wgmma.commit_group\nCommits all prior uncommitted wgmma.mma_async operations into a wgmma-group .\nSyntax\nDescription\nwgmma.commit_group instruction creates a new wgmma-group per warpgroup and batches all prior wgmma.mma_async instructions initiated by the executing warp but not committed to any wgmma-group into the new wgmma-group.\nIf there are no uncommitted wgmma.mma_async instructions then wgmma.commit_group results in an empty wgmma-group.\nAn executing thread can wait for the completion of all wgmma.mma_async operations in a wgmma-group by using wgmma.wait_group .\nThe mandatory .sync qualifier indicates that wgmma.commit_group instruction causes the executing thread to wait until all threads in the warp execute the same wgmma.commit_group instruction before resuming execution.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#asynchronous-warpgroup-level-matrix-instructions-wgmma-commit-group", "tokens": ["wgmma.commit", "wgmma.mma", "warpgroup", "warp", "wgmma.wait", "sync"], "summaryZh": "本条整理 PTX ISA 官方文档中的「异步矩阵乘加指令：wgmma.commit_group」，归在「指令」。重点关注 关键词 wgmma.commit、wgmma.mma、warpgroup、warp、wgmma.wait，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「异步矩阵乘加指令：wgmma.commit_group」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：wgmma.commit、wgmma.mma、warpgroup、warp、wgmma.wait、sync。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Asynchronous Multiply-and-Accumulate Instruction: wgmma.wait_group", "titleZh": "异步矩阵乘加指令：wgmma.wait_group", "numberedTitle": "9.7.16.7.3. Asynchronous Multiply-and-Accumulate Instruction: wgmma.wait_group", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Asynchronous wgmma Proxy Operations", "parentZh": "Asynchronous wgmma Proxy 操作", "kind": "Instructions", "kindZh": "指令", "summary": "wgmma.wait_group", "details": "wgmma.wait_group\nSignal the completion of a preceding warpgroup operation.\nSyntax\nDescription\nwgmma.wait_group instruction will cause the executing thread to wait until only N or fewer of the most recent wgmma-groups are pending and all the prior wgmma-groups committed by the executing threads are complete.\nFor example, when N is 0, the executing thread waits on all the prior wgmma-groups to complete.\nAccessing the accumulator register or the input register containing the fragments of matrix A of a wgmma.mma_async instruction without first performing a wgmma.wait_group instruction that waits on a wgmma-group including that wgmma.mma_async instruction is undefined behavior.\nThe mandatory .sync qualifier indicates that wgmma.wait_group instruction causes the executing thread to wait until all threads in the warp execute the same wgmma.wait_group instruction before resuming execution.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#asynchronous-warpgroup-level-matrix-instructions-wgmma-wait-group", "tokens": ["wgmma.wait", "warpgroup", "wgmma.mma", "sync", "warp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「异步矩阵乘加指令：wgmma.wait_group」，归在「指令」。重点关注 关键词 wgmma.wait、warpgroup、wgmma.mma、sync、warp，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「异步矩阵乘加指令：wgmma.wait_group」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：wgmma.wait、warpgroup、wgmma.mma、sync、warp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "TensorCore 5th Generation Family Instructions", "titleZh": "第五代 TensorCore 指令族", "numberedTitle": "9.7.17. TensorCore 5th Generation Family Instructions", "level": "H3", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Instructions", "parentZh": "指令", "kind": "Instructions", "kindZh": "指令", "summary": "PTX ISA 文档章节：TensorCore 5th Generation Family Instructions", "details": "", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensorcore-5th-generation-instructions", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「第五代 TensorCore 指令族」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「第五代 TensorCore 指令族」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。"}, {"title": "Tensor Memory", "titleZh": "Tensor Memory（张量内存）", "numberedTitle": "9.7.17.1. Tensor Memory", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Family Instructions", "parentZh": "第五代 TensorCore 指令族", "kind": "Instructions", "kindZh": "指令", "summary": "The 5 th generation TensorCore has dedicated on-chip memory that is specialized for use by TensorCore operations. This Tensor Memory is organized as a two-dimensional matrix where the horizontal rows are called lanes and the vertical columns are called columns.", "details": "The 5 th generation TensorCore has dedicated on-chip memory that is specialized for use by TensorCore operations.\nThis Tensor Memory is organized as a two-dimensional matrix where the horizontal rows are called lanes and the vertical columns are called columns.\nOn architecture sm_100a / sm_100f , the 5 th generation TensorCore’s Tensor Memory has a two-dimensional structure of 512 columns and 128 rows per CTA, with each cell being 32-bits in size.\nRestrictions on threads accessing the Tensor Memory via the load and store operations are specified in Access restrictions .", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-memory", "tokens": ["sm_100a", "sm_100f"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Tensor Memory（张量内存）」，归在「指令」。重点关注 关键词 sm_100a、sm_100f，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Tensor Memory（张量内存）」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：sm_100a、sm_100f。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Tensor Memory Addressing", "titleZh": "Tensor Memory 寻址", "numberedTitle": "9.7.17.1.1. Tensor Memory Addressing", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Tensor Memory", "parentZh": "Tensor Memory（张量内存）", "kind": "Instructions", "kindZh": "指令", "summary": "Tensor Memory addresses are 32-bit wide and specify two components.", "details": "Tensor Memory addresses are 32-bit wide and specify two components.\nLane index\nColumn index\nThe layout is as follows:\nFigure 182 shows the view of the Tensor Memory Layout within CTA.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-memory-addressing", "tokens": [], "summaryZh": "本条整理 PTX ISA 官方文档中的「Tensor Memory 寻址」，归在「指令」。重点关注 指令，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Tensor Memory 寻址」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Tensor Memory Allocation", "titleZh": "Tensor Memory 分配", "numberedTitle": "9.7.17.1.2. Tensor Memory Allocation", "level": "H5", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "Tensor Memory", "parentZh": "Tensor Memory（张量内存）", "kind": "Instructions", "kindZh": "指令", "summary": "The Tensor Memory is dynamically allocated. The Tensor Memory must be allocated by a single warp in a CTA using the Tensor Memory Allocation and Management Instructions .", "details": "The Tensor Memory is dynamically allocated.\nThe Tensor Memory must be allocated by a single warp in a CTA using the Tensor Memory Allocation and Management Instructions .\nThe allocation and deallocation of Tensor Memory is performed in terms of columns.\nThe unit of allocation is 32 columns and the number of columns being allocated must be a power of 2.\nAll of the Tensor Memory that was allocated in a kernel, must be explicitly deallocated before the kernel exits.", "source": "https://docs.nvidia.com/cuda/parallel-thread-execution/index.html#tensor-memory-allocation", "tokens": ["warp"], "summaryZh": "本条整理 PTX ISA 官方文档中的「Tensor Memory 分配」，归在「指令」。重点关注 关键词 warp，适合用于查询 PTX 指令语义、操作数和适用架构。", "detailsZh": "中文提要：这是「Tensor Memory 分配」对应的官方条目，分类为「指令」。\n阅读重点：查询 PTX 指令语义、操作数和适用架构。\n相关 API / 关键词：warp。\n官方原文摘录未直接放在卡片主体；需要完整上下文时请打开官方锚点。"}, {"title": "Matrix and Data Movement Shape", "titleZh": "Matrix 与数据搬移 Shape", "numberedTitle": "9.7.17.2. Matrix and Data Movement Shape", "level": "H4", "chapter": "Instruction Set", "chapterZh": "指令集", "parent": "TensorCore 5th Generation Family Instructions", "parentZh": "第五代 TensorCore 指令族", "kind": "Instructions", "kindZh": "指令", "summary": "There are two kinds of shapes involved.", "details": "There are two kinds of shapes involved.\nShapes in the data movement
