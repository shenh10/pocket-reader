name: Build Pocket Reader Mobile
on:
  workflow_dispatch:
  push:
    branches: [main, "linzhao/mobile-pocket-reader"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ai-infra-board/package-lock.json
            stockarena/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix ai-infra-board
          npm ci --prefix stockarena
      - name: Check content cache and routes
        run: npm run check
      - name: Bundle application UI and API client
        run: npm run mobile:sync
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: pocket-reader-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix ai-infra-board
          npm ci --prefix stockarena
      - name: Build application UI
        run: npm run build:mobile
      - name: Build website for browser checks
        run: |
          npm run build:web
          node scripts/check-bundle.mjs
          npx playwright install --with-deps chromium
      - name: Check mobile reading flows
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-browser-checks
          path: |
            playwright-report/
            test-results/
